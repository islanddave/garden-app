<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- V4-KBVIEWPORT-001 / overlay-architecture-design-V102 §8.1 (LOCKED): interactive-widget
         shrinks the LAYOUT viewport when the soft keyboard opens, so `position: fixed; bottom: 0`
         lands above the keyboard instead of behind it. Chromium 108+; Safari/Firefox drop the
         unknown key individually, so viewport-fit=cover survives untouched. Guarded by
         src/__tests__/viewportMeta.static.test.js and by a dist/index.html grep in the deploy
         workflows -- this one line is the whole fix and nothing else in CI can see it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2d6a4f" />
    <!-- No personal names and no town. This string is what a shared link previews as in Messenger
         and Facebook, so it reaches strangers who never load the app. Matches <title>. -->
    <meta name="description" content="Gardens at Mathews -- a growing journal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gardens at Mathews" />
    <title>Gardens at Mathews</title>
    <!-- V4-PERFTHEMEA-001 preconnect, BOTH socket pools (V4-PERFCLERK-001 Option B). Rationale,
         measurements and the derive-don't-hardcode reasoning: src/lib/bootSplash.js. Guarded by
         bootPaint.static.test.js. Comments here are terse ON PURPOSE — this is the critical path. -->
    <script>
      (function () {
        try {
          var k = '%VITE_CLERK_PUBLISHABLE_KEY%'
          if (k.slice(0, 3) !== 'pk_') return
          var host = atob(k.replace(/^pk_(live|test)_/, '')).replace(/\$+$/, '')
          if (!/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(host)) return
          for (var i = 0; i < 2; i++) {
            var l = document.createElement('link')
            l.rel = 'preconnect'
            l.href = 'https://' + host
            if (i) l.crossOrigin = 'anonymous'
            document.head.appendChild(l)
          }
        } catch (e) { /* never break boot for a preconnect */ }
      })()
    </script>
    <!-- V4-PERFTHEMEA-001 API preconnect. The four WARM_PATHS origins, anonymous pool, derived not
         hardcoded. Measurements, why exactly four, and why anonymous: src/lib/warmOrigins.js
         §PRECONNECT. Guarded by bootPaint.static.test.js. Terse ON PURPOSE — this file is no-store,
         so every byte here is re-downloaded on every load. -->
    <script>
      (function () {
        try {
          var u = ['%VITE_API_PLANTS%', '%VITE_API_DAILY_PLAN_READ%', '%VITE_API_LOCATIONS%', '%VITE_API_INVENTORY%']
          var seen = {}
          for (var i = 0; i < u.length; i++) {
            var o
            try { o = new URL(u[i]).origin } catch (e) { continue }
            if (!o || o === 'null' || seen[o]) continue
            seen[o] = 1
            var l = document.createElement('link')
            l.rel = 'preconnect'
            l.href = o
            l.crossOrigin = 'anonymous'
            document.head.appendChild(l)
          }
        } catch (e) { /* never break boot for a preconnect */ }
      })()
    </script>
    <!-- V4-PERFTHEMEA-001 pre-React boot paint. #f8f5f0 is P.cream; sibling of #root, never a
         child (createRoot clears #root). Removed by src/lib/bootSplash.js — see it for the why. -->
    <style>
      #boot-splash { position: fixed; inset: 0; z-index: 2147483000; background: #f8f5f0;
        display: flex; align-items: center; justify-content: center;
        font-size: 2.5rem; line-height: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">🌿</div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
