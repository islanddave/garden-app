# actionlint configuration — read automatically by the "Workflow lint" step in ci.yml (OPS-VERIFYINRUNSTALE-001).
#
# Every entry below is a documented FALSE POSITIVE with live evidence. Do not add an ignore without the same:
# a real run that shows the flagged construct working.
#
# The one label declaration (OPS-UBUNTU26MOVE-001): every job runs on `ubuntu-26.04`, GA since 2026-09-17
# (actions/runner-images issue 14747), but actionlint 1.7.12, the newest release and the one pinned, lists labels
# only up to ubuntu-24.04 and reports `label "ubuntu-26.04" is unknown` on every runs-on line. Declaring it here is
# actionlint's documented way to add a label. Live proof the label runs: integration-test 38451919797 (2026-10-13).
# Remove this entry when a pinned actionlint release lists the label itself.
self-hosted-runner:
  labels:
    - ubuntu-26.04
paths:
  .github/workflows/deploy-lambda.yml:
    ignore:
      # `on.workflow_call.outputs.deploy_result.value: ${{ jobs.deploy.result }}`. GitHub documents
      # jobs.<job_id>.result for reusable-workflow outputs; actionlint 1.7.12 types the jobs context as
      # {outputs} only. Live proof it works: promote-gate run 35274928023 (v4.136.0) ran its SPA `deploy`
      # job, whose predicate needs deploy_result == 'success' — with an empty value `spa-withheld` fires instead.
      - 'property "result" is not defined in object type \{outputs: \{\}\}'
