      - name: Seeds Back and lot-page arrival (BUG-SAVEDSEEDSBACKTOP-001, BUG-SEEDLOTOPENSATFORM-001)
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:seeds-scroll

  # Real-Chrome gates, second group (~181 s of work, same run).
  gates-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Canary — force this leg red (workflow_dispatch input canary_red_leg only)
        if: inputs.canary_red_leg == 'gates-b'
        run: |
          echo "::error title=ci-next canary::canary_red_leg=gates-b: this leg is forced red on request, and build-and-test-next must go red with it."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Resolve Chrome for the layout gates
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BIN" ]; then
            echo "::error::No Chrome on this runner - the layout gates cannot run and must not be skipped."
            exit 1
          fi
          echo "CHROME_PATH=$BIN" >> "$GITHUB_ENV"
          echo "layout gates will drive $BIN"
