name: Daily Database Backup

on:
  schedule:
    # 3am ET = 7am UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Make /usr/lib/postgresql/17 writable (cache + docker cp target)
        # /usr/lib is root-owned: the cache restore and the docker cp fallback both need a writable target.
        run: |
          sudo mkdir -p /usr/lib/postgresql/17/bin
          sudo chown -R "$(id -u):$(id -g)" /usr/lib/postgresql/17

      - name: pg17 client cache
        # On a miss the next step fetches and this action's post-job hook saves under the same key. This
        # daily run keeps the key warm for the less frequent sites. The key ends in the runner label so
        # binaries never cross runner images: moving `runs-on` means moving the suffix at every pg17 cache
        # site, pg17-cache-warm.yml included (scripts/test_workflow_steps.py checks them together).
        id: pg17-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/lib/postgresql/17/bin
          key: pg17-client-postgres17-image-v1-runner-ubuntu-26.04

      - name: Fetch pg17 client from the postgres:17 image (cache miss only)
        # Not apt.postgresql.org (PGDG): that mirror has hung this install inside promote-gate after main
        # had fast-forwarded. pg_dump/pg_restore must match Neon's major (17) exactly and the runner ships
        # 16 or 18, so copy the binaries out of a never-started postgres:17 container, the image
        # restore-verify.yml already runs as a service.
        if: steps.pg17-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cid=$(docker create postgres:17)
          docker cp "$cid:/usr/lib/postgresql/17/bin/." /usr/lib/postgresql/17/bin/
          docker rm -f "$cid" >/dev/null

      - name: Verify pg17 client
        # Explicit path: bare pg_dump resolves through postgresql-client-common to the image's own client
        # (pg18 on ubuntu-26.04) even with pg17 present. Later steps prepend pg17's bin to PATH for the same reason.
        run: /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          # Separate backup role — only needs s3:PutObject on backup bucket
          role-to-assume: ${{ vars.AWS_BACKUP_ROLE_ARN }}
          aws-region: us-east-1

      - name: pg_dump from Neon (prod)
        env:
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
        # Direct endpoint only (no -pooler host): pg_dump hangs or writes a corrupt dump through a pooler.
        # Full-database scope (no --schema): public, extensions (uuid_generate_v4 column defaults) and gv
        # (trigger functions) are all needed to rebuild from empty. -Fc allows selective restore;
        # --no-owner because Neon roles differ. pg_dumpall --globals-only captures roles, and
        # --no-role-passwords keeps SCRAM hashes out of S3.
        # TABLE and CATALOG LISTS are written beside the dump (db/garden-YYYYMMDD.{tables,catalog}.json) so
        # restore-verify compares its restore with prod as of the dump, not live prod. Both are read BEFORE
        # pg_dump on their own connections: a table created in the gap is in the dump but not the list (a
        # warning), never the reverse. A failed read does not stop the dump; "Verify upload" fails the job at
        # its end. The SELECTs are scripts/snap.py TABLE_LIST_SQL / restore-verify.py qualified_table_set()
        # and restore-verify.py CATALOG_LIST_SQL (after the same search_path pin, so regclass/regproc text
        # matches the restore's).
        # $RUNNER_TEMP, not /tmp, for every file: /tmp on ubuntu-26.04 is a ~7.8G RAM-backed tmpfs.
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          DUMP_FILE="$RUNNER_TEMP/garden-$(date +%Y%m%d).dump"
          GLOBALS_FILE="$RUNNER_TEMP/garden-$(date +%Y%m%d).globals.sql"
          TABLES_FILE="$RUNNER_TEMP/garden-$(date +%Y%m%d).tables.json"
          S3_KEY="db/garden-$(date +%Y%m%d).dump"
          TAKEN_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! timeout -k 5 120 psql "$NEON_BACKUP_URL" -X -tA -v ON_ERROR_STOP=1 \
            -c "SELECT json_build_object('format', 1, 'dump_key', '$S3_KEY', 'taken_at', '$TAKEN_AT', 'tables', COALESCE(json_agg(table_schema || '.' || table_name ORDER BY table_schema, table_name), '[]'::json)) FROM information_schema.tables WHERE table_type = 'BASE TABLE' AND table_schema NOT IN ('pg_catalog', 'information_schema') AND table_schema NOT LIKE 'pg_%'" \
            > "$TABLES_FILE"; then
            echo "::error::Table list for $S3_KEY could NOT be read from prod -- the dump continues, and 'Verify upload' will fail this job at its end"
            rm -f "$TABLES_FILE" || true
          fi
          CATALOG_FILE="$RUNNER_TEMP/garden-$(date +%Y%m%d).catalog.json"
          CATALOG_TAKEN_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! timeout -k 5 120 psql "$NEON_BACKUP_URL" -X -q -tA -v ON_ERROR_STOP=1 \
            -c "SET search_path TO pg_catalog" \
            -c "SELECT json_build_object('triggers', (SELECT json_build_object('count', count(*), 'rows', COALESCE(json_agg(json_build_array(t.tgname, t.tgrelid::regclass::text, t.tgtype, t.tgfoid::regproc::text, t.tgenabled) ORDER BY t.tgrelid::regclass::text, t.tgname), '[]'::json)) FROM pg_trigger t WHERE NOT t.tgisinternal), 'gv_functions', (SELECT json_build_object('count', count(*), 'rows', COALESCE(json_agg(p.oid::regprocedure::text ORDER BY p.oid::regprocedure::text), '[]'::json)) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'gv'), 'extensions_functions', (SELECT json_build_object('count', count(*), 'rows', COALESCE(json_agg(p.oid::regprocedure::text ORDER BY p.oid::regprocedure::text), '[]'::json)) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'extensions'))" \
            > "$CATALOG_FILE.raw" \
            || ! jq -ce --arg k "$S3_KEY" --arg t "$CATALOG_TAKEN_AT" '{format: 1, dump_key: $k, taken_at: $t} + .' \
            "$CATALOG_FILE.raw" > "$CATALOG_FILE"; then
            echo "::error::Catalog list for $S3_KEY could NOT be read from prod -- the dump continues, and 'Verify upload' will fail this job at its end"
            rm -f "$CATALOG_FILE" || true
          fi
          rm -f "$CATALOG_FILE.raw" || true
          pg_dump "$NEON_BACKUP_URL" \
            --no-owner \
            --no-privileges \
            -Fc \
            > "$DUMP_FILE"
          pg_dumpall --dbname "$NEON_BACKUP_URL" \
            --globals-only \
            --no-role-passwords \
            -f "$GLOBALS_FILE"
          echo "DUMP_FILE=$DUMP_FILE" >> "$GITHUB_ENV"
          echo "GLOBALS_FILE=$GLOBALS_FILE" >> "$GITHUB_ENV"
          echo "Dump file size: $(du -sh $DUMP_FILE | cut -f1); globals: $(du -sh $GLOBALS_FILE | cut -f1)"

      - name: Upload to S3
        run: |
          DUMP_FILE="$RUNNER_TEMP/garden-$(date +%Y%m%d).dump"
          GLOBALS_FILE="$RUNNER_TEMP/garden-$(date +%Y%m%d).globals.sql"
          S3_KEY="db/garden-$(date +%Y%m%d).dump"
          GLOBALS_S3_KEY="db/garden-$(date +%Y%m%d).globals.sql"
          aws s3 cp "$DUMP_FILE" "s3://${{ vars.BACKUP_BUCKET_NAME }}/$S3_KEY"
          aws s3 cp "$GLOBALS_FILE" "s3://${{ vars.BACKUP_BUCKET_NAME }}/$GLOBALS_S3_KEY"
          # Lists last and not fatal here: "Verify upload" must still check the dump, and fails the job
          # when a list did not make it.
          TABLES_FILE="$RUNNER_TEMP/garden-$(date +%Y%m%d).tables.json"
          TABLES_S3_KEY="db/garden-$(date +%Y%m%d).tables.json"
          if [ -s "$TABLES_FILE" ]; then
            aws s3 cp "$TABLES_FILE" "s3://${{ vars.BACKUP_BUCKET_NAME }}/$TABLES_S3_KEY" \
              && touch "$TABLES_FILE.uploaded" \
              || echo "::error::Upload of $TABLES_S3_KEY FAILED -- 'Verify upload' will fail this job at its end"
          fi
          CATALOG_FILE="$RUNNER_TEMP/garden-$(date +%Y%m%d).catalog.json"
          CATALOG_S3_KEY="db/garden-$(date +%Y%m%d).catalog.json"
          if [ -s "$CATALOG_FILE" ]; then
            aws s3 cp "$CATALOG_FILE" "s3://${{ vars.BACKUP_BUCKET_NAME }}/$CATALOG_S3_KEY" \
              && touch "$CATALOG_FILE.uploaded" \
              || echo "::error::Upload of $CATALOG_S3_KEY FAILED -- 'Verify upload' will fail this job at its end"
          fi

      - name: Verify upload (restorability floor)
        # Any failure is red: pg_restore --list (pg17, the dump's major) reads the archive; the full-scope
        # schemas are in it; the S3 object exists and is over a 400KB floor (smaller is a truncated dump).
        # Raise the floor as the DB grows; never lower it without a schema shrink.
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          DUMP_FILE="$RUNNER_TEMP/garden-$(date +%Y%m%d).dump"
          GLOBALS_FILE="$RUNNER_TEMP/garden-$(date +%Y%m%d).globals.sql"
          S3_KEY="db/garden-$(date +%Y%m%d).dump"
          GLOBALS_S3_KEY="db/garden-$(date +%Y%m%d).globals.sql"
          MIN_BYTES=409600
          if ! pg_restore --list "$DUMP_FILE" > /dev/null; then
            echo "::error::Backup verification FAILED — pg_restore --list cannot read $DUMP_FILE; dump is not a valid archive"
            exit 1
          fi
          # Full-DB scope proof: the archive must contain the extensions and gv schemas.
          for SCHEMA in extensions gv; do
            if ! pg_restore --list "$DUMP_FILE" | grep -q "SCHEMA - $SCHEMA"; then
              echo "::error::Backup verification FAILED — schema '$SCHEMA' missing from $DUMP_FILE; dump is not full-database scope"
              exit 1
            fi
          done
          if ! grep -q "CREATE ROLE" "$GLOBALS_FILE"; then
            echo "::error::Backup verification FAILED — $GLOBALS_FILE has no CREATE ROLE statements; globals dump is empty or malformed"
            exit 1
          fi
          if ! OBJ_BYTES=$(aws s3api list-objects-v2 --bucket "${{ vars.BACKUP_BUCKET_NAME }}" --prefix "$S3_KEY" --query 'Contents[0].Size' --output text); then
            echo "::error::Backup verification FAILED — could not query S3 for $S3_KEY"
            exit 1
          fi
          if [ -z "$OBJ_BYTES" ] || [ "$OBJ_BYTES" = "None" ]; then
            echo "::error::Backup verification FAILED — object $S3_KEY not found in S3"
            exit 1
          fi
          if [ "$OBJ_BYTES" -lt "$MIN_BYTES" ]; then
            echo "::error::Backup verification FAILED — $S3_KEY is ${OBJ_BYTES} bytes, below the ${MIN_BYTES}-byte restorability floor (truncated or empty dump)"
            exit 1
          fi
          if ! GLOB_BYTES=$(aws s3api list-objects-v2 --bucket "${{ vars.BACKUP_BUCKET_NAME }}" --prefix "$GLOBALS_S3_KEY" --query 'Contents[0].Size' --output text); then
            echo "::error::Backup verification FAILED — could not query S3 for $GLOBALS_S3_KEY"
            exit 1
          fi
          if [ -z "$GLOB_BYTES" ] || [ "$GLOB_BYTES" = "None" ] || [ "$GLOB_BYTES" -lt 500 ]; then
            echo "::error::Backup verification FAILED — globals object $GLOBALS_S3_KEY missing or implausibly small (${GLOB_BYTES} bytes)"
            exit 1
          fi
          echo "Upload verified: $S3_KEY (${OBJ_BYTES} bytes >= ${MIN_BYTES} floor; pg_restore --list OK; extensions+gv schemas present) + $GLOBALS_S3_KEY (${GLOB_BYTES} bytes)"
          # Table list, checked last so a failure here prints under a dump already verified. Missing or
          # malformed is red: restore-verify would otherwise compare with live prod with nothing saying why.
          # The .uploaded marker is written only by this run's upload, so an earlier run's list beside a
          # newer dump cannot pass (a size check could). The six core tables are restore-verify.py SANITY_TABLES.
          TABLES_FILE="$RUNNER_TEMP/garden-$(date +%Y%m%d).tables.json"
          TABLES_S3_KEY="db/garden-$(date +%Y%m%d).tables.json"
          TABLES_FAIL="the DUMP $S3_KEY is uploaded and verified; only its table list is not. restore-verify will compare that dump with LIVE prod's table list (or red on a bad list)"
          if ! jq -e --arg k "$S3_KEY" '.format == 1 and .dump_key == $k and (.taken_at | type == "string" and length > 0) and (.tables | type == "array") and ([.tables[] | select(startswith("public."))] | length > 0) and ((["public.plant_projects", "public.plants", "public.event_log", "public.locations", "public.inventory_items", "public.plant_varieties"] - .tables) | length == 0)' "$TABLES_FILE" > /dev/null; then
            echo "::error::Table list FAILED — $TABLES_FILE is missing or malformed (the prod read in the dump step failed, or returned no public table or not every core table); $TABLES_FAIL"
            exit 1
          fi
          if ! TBL_BYTES=$(aws s3api list-objects-v2 --bucket "${{ vars.BACKUP_BUCKET_NAME }}" --prefix "$TABLES_S3_KEY" --query 'Contents[0].Size' --output text); then
            echo "::error::Table list FAILED — could not query S3 for $TABLES_S3_KEY; $TABLES_FAIL"
            exit 1
          fi
          if [ ! -f "$TABLES_FILE.uploaded" ]; then
            echo "::error::Table list FAILED — the upload of $TABLES_S3_KEY did not succeed in 'Upload to S3' (S3 has '${TBL_BYTES}' bytes under that key: nothing, or an older list); $TABLES_FAIL"
            exit 1
          fi
          if [ -z "$TBL_BYTES" ] || [ "$TBL_BYTES" = "None" ]; then
            echo "::error::Table list FAILED — object $TABLES_S3_KEY not found in S3; $TABLES_FAIL"
            exit 1
          fi
          echo "Table list verified: $TABLES_S3_KEY (${TBL_BYTES} bytes, $(jq '.tables | length' "$TABLES_FILE") tables)"
          # Catalog list: each list present, count equal to its rows, not empty (restore-verify.py
          # _cataloglist_problem). Once one has been written, restore-verify reds every later dump without one.
          CATALOG_FILE="$RUNNER_TEMP/garden-$(date +%Y%m%d).catalog.json"
          CATALOG_S3_KEY="db/garden-$(date +%Y%m%d).catalog.json"
          CATALOG_FAIL="the DUMP $S3_KEY is uploaded and verified; only its catalog list is not. restore-verify will red this dump"
          if ! jq -e --arg k "$S3_KEY" '.format == 1 and .dump_key == $k and (.taken_at | type == "string" and length > 0) and all(.triggers, .gv_functions, .extensions_functions; type == "object" and (.count | type == "number") and (.rows | type == "array") and .count == (.rows | length) and .count > 0)' "$CATALOG_FILE" > /dev/null; then
            echo "::error::Catalog list FAILED — $CATALOG_FILE is missing or malformed (the prod read in the dump step failed, or a list is absent, empty or without its count); $CATALOG_FAIL"
            exit 1
          fi
          if ! CAT_BYTES=$(aws s3api list-objects-v2 --bucket "${{ vars.BACKUP_BUCKET_NAME }}" --prefix "$CATALOG_S3_KEY" --query 'Contents[0].Size' --output text); then
            echo "::error::Catalog list FAILED — could not query S3 for $CATALOG_S3_KEY; $CATALOG_FAIL"
            exit 1
          fi
          if [ ! -f "$CATALOG_FILE.uploaded" ]; then
            echo "::error::Catalog list FAILED — the upload of $CATALOG_S3_KEY did not succeed in 'Upload to S3' (S3 has '${CAT_BYTES}' bytes under that key: nothing, or an older list); $CATALOG_FAIL"
            exit 1
          fi
          if [ -z "$CAT_BYTES" ] || [ "$CAT_BYTES" = "None" ]; then
            echo "::error::Catalog list FAILED — object $CATALOG_S3_KEY not found in S3; $CATALOG_FAIL"
            exit 1
          fi
          echo "Catalog list verified: $CATALOG_S3_KEY (${CAT_BYTES} bytes; $(jq -r '[.triggers.count, .gv_functions.count, .extensions_functions.count] | "\(.[0]) triggers, \(.[1]) gv functions, \(.[2]) extensions functions"' "$CATALOG_FILE"))"

      - name: Cleanup local dump
        if: always()
        run: rm -f "${RUNNER_TEMP:?}"/garden-*.dump "${RUNNER_TEMP:?}"/garden-*.globals.sql "${RUNNER_TEMP:?}"/garden-*.tables.json "${RUNNER_TEMP:?}"/garden-*.tables.json.uploaded "${RUNNER_TEMP:?}"/garden-*.catalog.json "${RUNNER_TEMP:?}"/garden-*.catalog.json.raw "${RUNNER_TEMP:?}"/garden-*.catalog.json.uploaded

# Retention is an S3 lifecycle rule on the bucket, not this workflow. Never rely on Actions artifacts for
# backups: they expire after 90 days and the AWS restore tooling cannot read them.
