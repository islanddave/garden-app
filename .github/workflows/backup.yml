name: Daily Database Backup

on:
  schedule:
    # 3am ET = 7am UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client-17 (from pgdg apt repo)
        # Neon runs PostgreSQL 17. pg_dump enforces strict major-version match
        # since pg-15+, so pg-16 client cannot dump from pg-17 server (proven
        # 2026-05-05: failed with "server version: 17.8; pg_dump version: 16.13").
        # Pull pg17 client from the PostgreSQL Apt Repository (apt.postgresql.org)
        # until Ubuntu runners ship pg17 in default repos.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          # Use explicit path: /usr/bin/pg_dump on this runner image still resolves
          # to pg16 even after pg17 install (both client versions coexist; the
          # default wrapper picks pg16). Step 4 also overrides PATH to fix this.
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          # Separate backup role — only needs s3:PutObject on backup bucket
          role-to-assume: ${{ vars.AWS_BACKUP_ROLE_ARN }}
          aws-region: us-east-1

      - name: pg_dump from Neon (prod)
        # IMPORTANT: Use direct endpoint (no -pooler suffix) — pg_dump is incompatible
        # with connection poolers and will hang or produce corrupt output.
        # NEON_BACKUP_URL must point to the direct host, not the pooler host.
        # --no-owner: Neon roles differ from source; restore as current role.
        # FULL-DATABASE scope (no --schema flag): prod has THREE schemas — public,
        # extensions (relocated uuid-ossp functions; 14 column defaults call
        # extensions.uuid_generate_v4()), and gv (11 functions backing 11 triggers
        # on 6 core tables). The old --schema=public dumps could NOT rebuild the
        # DB from empty (Gate 0.1, verified live 2026-08-03). pg_catalog is never
        # dumped regardless — no schema flag is needed to exclude it.
        # -Fc: custom format — supports selective restore and compression.
        # Companion pg_dumpall --globals-only: cluster-level roles pg_dump never
        # captures. --no-role-passwords keeps SCRAM hashes out of S3 (Neon manages
        # role credentials via its own API; hashes are useless on restore).
        # PATH override: bare `pg_dump` resolves to pg16 on this runner image even
        # when pg17 is installed (postgresql-client-common wrapper picks pg16).
        # Prepending pg17's bin dir forces the major-version match Neon requires.
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          DUMP_FILE="/tmp/garden-$(date +%Y%m%d).dump"
          GLOBALS_FILE="/tmp/garden-$(date +%Y%m%d).globals.sql"
          pg_dump "${{ secrets.NEON_BACKUP_URL }}" \
            --no-owner \
            --no-privileges \
            -Fc \
            > "$DUMP_FILE"
          pg_dumpall --dbname "${{ secrets.NEON_BACKUP_URL }}" \
            --globals-only \
            --no-role-passwords \
            -f "$GLOBALS_FILE"
          echo "DUMP_FILE=$DUMP_FILE" >> "$GITHUB_ENV"
          echo "GLOBALS_FILE=$GLOBALS_FILE" >> "$GITHUB_ENV"
          echo "Dump file size: $(du -sh $DUMP_FILE | cut -f1); globals: $(du -sh $GLOBALS_FILE | cut -f1)"

      - name: Upload to S3
        run: |
          DUMP_FILE="/tmp/garden-$(date +%Y%m%d).dump"
          GLOBALS_FILE="/tmp/garden-$(date +%Y%m%d).globals.sql"
          S3_KEY="db/garden-$(date +%Y%m%d).dump"
          GLOBALS_S3_KEY="db/garden-$(date +%Y%m%d).globals.sql"
          aws s3 cp "$DUMP_FILE" "s3://${{ vars.BACKUP_BUCKET_NAME }}/$S3_KEY"
          aws s3 cp "$GLOBALS_FILE" "s3://${{ vars.BACKUP_BUCKET_NAME }}/$GLOBALS_S3_KEY"

      - name: Verify upload (restorability floor)
        # OPS-GUARDINTEG-001 (2026-07-22): the old check asserted S3 existence only —
        # its comment claimed "non-zero size" but nothing checked size, so a zero-byte
        # or truncated dump passed green. Now three assertions, any failure is red:
        #   1. pg_restore --list on the local dump proves it is a readable pg
        #      custom-format archive (cheap, no DB connection; pg17 binary — the
        #      default pg16 pg_restore cannot read pg17 archives).
        #   2. The S3 object exists (list-objects-v2 = same ListBucket permission
        #      the previous `aws s3 ls` check already used; no IAM change).
        #   3. The S3 object exceeds a 400KB floor: the dump was ~500KB at first
        #      backup (2026-05) and is ~2.4MB and growing today (2026-07) — anything
        #      under 400KB is a failed/truncated dump, not a plausible database.
        #      Raise the floor as the DB grows; never lower it without a schema shrink.
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          DUMP_FILE="/tmp/garden-$(date +%Y%m%d).dump"
          GLOBALS_FILE="/tmp/garden-$(date +%Y%m%d).globals.sql"
          S3_KEY="db/garden-$(date +%Y%m%d).dump"
          GLOBALS_S3_KEY="db/garden-$(date +%Y%m%d).globals.sql"
          MIN_BYTES=409600
          if ! pg_restore --list "$DUMP_FILE" > /dev/null; then
            echo "::error::Backup verification FAILED — pg_restore --list cannot read $DUMP_FILE; dump is not a valid archive"
            exit 1
          fi
          # Full-DB scope proof: the archive must contain the extensions + gv schemas
          # (the exact objects the old --schema=public dumps silently dropped).
          for SCHEMA in extensions gv; do
            if ! pg_restore --list "$DUMP_FILE" | grep -q "SCHEMA - $SCHEMA"; then
              echo "::error::Backup verification FAILED — schema '$SCHEMA' missing from $DUMP_FILE; dump is not full-database scope"
              exit 1
            fi
          done
          if ! grep -q "CREATE ROLE" "$GLOBALS_FILE"; then
            echo "::error::Backup verification FAILED — $GLOBALS_FILE has no CREATE ROLE statements; globals dump is empty or malformed"
            exit 1
          fi
          if ! OBJ_BYTES=$(aws s3api list-objects-v2 --bucket "${{ vars.BACKUP_BUCKET_NAME }}" --prefix "$S3_KEY" --query 'Contents[0].Size' --output text); then
            echo "::error::Backup verification FAILED — could not query S3 for $S3_KEY"
            exit 1
          fi
          if [ -z "$OBJ_BYTES" ] || [ "$OBJ_BYTES" = "None" ]; then
            echo "::error::Backup verification FAILED — object $S3_KEY not found in S3"
            exit 1
          fi
          if [ "$OBJ_BYTES" -lt "$MIN_BYTES" ]; then
            echo "::error::Backup verification FAILED — $S3_KEY is ${OBJ_BYTES} bytes, below the ${MIN_BYTES}-byte restorability floor (truncated or empty dump)"
            exit 1
          fi
          if ! GLOB_BYTES=$(aws s3api list-objects-v2 --bucket "${{ vars.BACKUP_BUCKET_NAME }}" --prefix "$GLOBALS_S3_KEY" --query 'Contents[0].Size' --output text); then
            echo "::error::Backup verification FAILED — could not query S3 for $GLOBALS_S3_KEY"
            exit 1
          fi
          if [ -z "$GLOB_BYTES" ] || [ "$GLOB_BYTES" = "None" ] || [ "$GLOB_BYTES" -lt 500 ]; then
            echo "::error::Backup verification FAILED — globals object $GLOBALS_S3_KEY missing or implausibly small (${GLOB_BYTES} bytes)"
            exit 1
          fi
          echo "Upload verified: $S3_KEY (${OBJ_BYTES} bytes >= ${MIN_BYTES} floor; pg_restore --list OK; extensions+gv schemas present) + $GLOBALS_S3_KEY (${GLOB_BYTES} bytes)"

      - name: Cleanup local dump
        if: always()
        run: rm -f /tmp/garden-*.dump /tmp/garden-*.globals.sql

# S3 lifecycle rules must be configured on the backup bucket (infrastructure step, not here):
#   - Retain last 14 daily dumps
#   - Retain last 4 weekly dumps (tag Sunday backups or use prefix-based lifecycle)
#   - Expire older objects automatically
# Do NOT rely on GitHub Actions artifacts for backup retention — 90-day expiry silently
# deletes backups and artifacts are not accessible via AWS tooling for restore workflows.
#
# Failure alerting: GitHub Actions will email repo notification subscribers on workflow
# failure if notifications are enabled for the repo. Enable at:
# repo Settings → Notifications → Actions → "Send notifications for failed workflows"
# For more robust alerting, add an SNS topic and publish from a failure step.
