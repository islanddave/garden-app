name: integrity-weekly (P0)

# Weekly data-integrity checks: scripts/integrity-weekly-check.sh, delta against the committed baseline
# scripts/integrity-baselines.json. Refresh the baseline only in the same commit as the repair that
# legitimately moves a number. Run snapshots persist as workflow artifacts (90 days), never as new tables.
#
# Scheduled workflows fire only from main; dispatch needs the file on main (then pick ref=dev to run dev's
# copy). No `environment:`: the job must run unattended, so it cannot use SNAP_AWS_ROLE_ARN (whose OIDC
# trust is scoped to environment:production). If the backup role lacks s3:ListBucket on the photos bucket,
# the S3<->DB class degrades to UNVERIFIED (a warning, never a false alert).
#
# ALERT SINK: an alert exits 1 (conclusion=failure). The morning-brief collector reads the latest run's
# conclusion and, on failure, surfaces report.alerts[] from the integrity-report artifact verbatim
# (shape: {status, alerts[], improvements[], warnings[], metrics{}}).
#
# NEON BRANCH HYGIENE: an out-of-band check that the branch fleet is under control (an in-pipeline pruner
# cannot detect its own non-execution). Reds when the branch count exceeds the cap; when a branch outside
# {production, staging, newest-K prod-parented snap-*} is older than STRAY_MAX_AGE_DAYS; or when an over-K
# snap-* branch persists across 2 consecutive runs (prune skipped twice). A temporary branch carrying a Neon
# expires_at at most 14 days out removes itself and is not counted against the cap (more than 6 at once
# reds instead); one with no expiry is counted and reds once a day old. Pre-migration copies of prod are
# made with an expiry by scripts/neon_safety_branch.py. Prior-run state persists as the neon-branch-state
# artifact; alerts merge into integrity-report.json. Uses the branches API only (the consumption-history
# API is Scale-plan-only).

on:
  schedule:
    - cron: '0 10 * * 1'   # Mondays 10:00 UTC = 06:00 ET, before the morning brief
  workflow_dispatch:

permissions:
  id-token: write   # OIDC for the backup role (S3 census only)
  contents: read
  actions: read     # download the previous run's neon-branch-state artifact (persistence for the 2-run prune-skip check)

concurrency:
  group: integrity-weekly
  cancel-in-progress: false

jobs:
  integrity:
    name: Weekly data-integrity checks (6 classes, delta-vs-baseline)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials (backup role, OIDC — S3 census only)
        id: aws
        continue-on-error: true   # S3 class fail-softs to UNVERIFIED inside the script
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_BACKUP_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run integrity checks
        id: checks
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          PHOTOS_BUCKET: ${{ steps.aws.outcome == 'success' && vars.PHOTOS_BUCKET || '' }}
          BASELINE_FILE: scripts/integrity-baselines.json
          OUT: integrity-report.json
        run: bash scripts/integrity-weekly-check.sh

      - name: Neon branch hygiene (out-of-band, Gate 2 §7)
        if: ${{ always() }}
        # Logic is scripts/neon_branch_select.py, shared with prune-branches.yml so the dry-run report and
        # this check cannot diverge (tested by scripts/test_neon_branch_select.py). The cap is SNAP_KEEP+4
        # (production + staging + K snaps + 2 headroom for in-flight branches with no expiry, such as a
        # running integration test's ci-*) unless NEON_MAX_BRANCHES overrides it. Branches carrying an
        # expiry are not counted.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PROD_BRANCH_ID: br-delicate-sea-amum92c2
          SNAP_KEEP: ${{ vars.SNAP_RETENTION }}
          STRAY_MAX_AGE_DAYS: '7'
          GH_TOKEN: ${{ github.token }}
          STATE_FILE: neon-branch-state.json
          PREV_STATE_DIR: prev-neon-state
        run: |
          set -euo pipefail
          mkdir -p "$PREV_STATE_DIR"
          # Prior-run state: newest completed run of THIS workflow that has the artifact.
          for rid in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow integrity-weekly.yml \
                        --status completed -L 15 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            if gh run download "$rid" --repo "$GITHUB_REPOSITORY" -n neon-branch-state -D "$PREV_STATE_DIR" 2>/dev/null; then
              echo "prior branch state from run $rid"
              break
            fi
          done
          python3 scripts/neon_branch_select.py hygiene

      - name: Upload neon branch state (prior-run persistence)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neon-branch-state
          path: neon-branch-state.json
          retention-days: 90

      - name: Upload run snapshot artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integrity-report
          path: integrity-report.json
          retention-days: 90

      - name: Job summary
        if: ${{ always() }}
        run: |
          if [ -f integrity-report.json ]; then
            {
              echo "## integrity-weekly: $(jq -r .status integrity-report.json)"
              echo ""
              jq -r '(.alerts[]? | "- ALERT: \(.)"),
                     (.improvements[]? | "- improved: \(.)"),
                     (.warnings[]? | "- warn: \(.)")' integrity-report.json
              echo ""
              echo '```json'
              jq .metrics integrity-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## integrity-weekly: ERROR — no report produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish alert to SNS (garden-ops-alerts — OPS-ALERTSINK-001 first producer)
        # Publishes ONLY on status=alert or a missing report; OK / OK_WITH_UNVERIFIED stay silent. Uses the
        # backup-role credentials from the aws step (sns:Publish). continue-on-error so the sink can never
        # mask the run's own result; the topic ARN is not a secret.
        if: ${{ always() }}
        continue-on-error: true
        env:
          SNS_TOPIC_ARN: arn:aws:sns:us-east-1:769788341849:garden-ops-alerts
        run: |
          set -euo pipefail
          STATUS=$(jq -r '.status // empty' integrity-report.json 2>/dev/null || true)
          STATUS=${STATUS:-missing}
          case "$STATUS" in
            OK|ok|OK_WITH_UNVERIFIED|ok_with_unverified)
              echo "status=$STATUS — nothing published"; exit 0;;
          esac
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          ALERTS=$(jq -r '(.alerts // [])[] | "- " + .' integrity-report.json 2>/dev/null || echo "(report missing)")
          printf 'integrity-weekly status: %s\nrun: %s\n\nalerts:\n%s\n' "$STATUS" "$RUN_URL" "$ALERTS" > /tmp/sns-msg.txt
          aws sns publish --topic-arn "$SNS_TOPIC_ARN" \
            --subject "garden integrity-weekly: $STATUS" \
            --message "file:///tmp/sns-msg.txt" --region us-east-1
          echo "published alert to garden-ops-alerts"
