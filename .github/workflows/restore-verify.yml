name: restore-verify (scheduled)

# "An untested backup is not a backup." Each leg restores the latest dump into a genuinely EMPTY postgres:17
# service container (never a Neon branch: one created without parent_id is parented to production and
# already holds every object the dump might lack, so the verify would be tautological).
# scripts/restore-verify.py asserts the target is empty first, then the schemas {public,gv,extensions}, the
# extensions/gv function inventories, the trigger inventory and core row counts. Tables, triggers and
# functions are compared with the lists written beside the dump (<dump>.tables.json, <dump>.catalog.json);
# row counts, and dumps older than their lists, with read-only SELECTs against live prod.
#
# TWO legs: the daily backup bucket and the snap bucket (db/snap-*). workflow_dispatch takes bucket/prefix
# inputs for a one-off proof run.
#
# require_full_scope defaults to 1 here, so a legacy public-only dump is a hard failure. The default is
# applied in SHELL (`${IN_REQUIRE_FULL_SCOPE:-1}`), so a dispatch that omits the key cannot downgrade the
# gate while an explicit 0 still works. scripts/restore-verify.py itself defaults REQUIRE_FULL_SCOPE to "0",
# so a direct local run stays lenient; only this workflow is strict.
#
# UNATTENDED: the restore-verify role's OIDC trust is scoped to the main ref, not an environment, so the
# scheduled run does not pause. Blast radius: S3 GetObject, read-only prod SELECTs, a throwaway container.
# RESTORE_VERIFY_ROLE_ARN needs s3:GetObject/ListBucket on BOTH buckets; the snap leg fails loudly
# (AccessDenied) otherwise.
#
# 08:00 UTC, an hour after backup.yml, so the day's dump exists.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      bucket:
        description: 'One-off proof: S3 bucket to verify (empty = normal daily+snap matrix)'
        required: false
        default: ''
        type: string
      prefix:
        description: 'Dump key prefix for the one-off bucket (default db/)'
        required: false
        default: ''
        type: string
      require_full_scope:
        description: 'Hard-fail legacy public-only dumps. Default 1 since 2026-08-11 — both legs verified full-scope.'
        required: false
        default: '1'
        type: choice
        options:
          - '0'
          - '1'

permissions:
  id-token: write
  contents: read

concurrency:
  group: restore-verify
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - name: Build verify matrix (daily + snap, or one-off dispatch bucket)
        id: mk
        env:
          IN_BUCKET: ${{ inputs.bucket }}
          IN_PREFIX: ${{ inputs.prefix }}
          DAILY_BUCKET: ${{ vars.BACKUP_BUCKET_NAME }}
          SNAP_BUCKET: ${{ vars.SNAP_BUCKET }}
        run: |
          set -euo pipefail
          if [ -n "${IN_BUCKET}" ]; then
            matrix=$(jq -cn --arg b "$IN_BUCKET" --arg p "${IN_PREFIX:-db/}" \
              '{include:[{leg:"custom",bucket:$b,prefix:$p}]}')
          else
            matrix=$(jq -cn --arg db "$DAILY_BUCKET" --arg sb "$SNAP_BUCKET" \
              '{include:[{leg:"daily",bucket:$db,prefix:"db/garden-"},{leg:"snap",bucket:$sb,prefix:"db/snap-"}]}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix: $matrix"

  verify:
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    name: verify (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      # The EMPTY restore target. postgres:17 matches Neon (PG 17) and the pg17 client fetched below.
      # POSTGRES_PASSWORD is a throwaway for a job-lifetime loopback container, not a secret.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garden_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Make /usr/lib/postgresql/17 writable (cache + docker cp target)
        run: |
          sudo mkdir -p /usr/lib/postgresql/17/bin
          sudo chown -R "$(id -u):$(id -g)" /usr/lib/postgresql/17

      - name: pg17 client cache
        id: pg17-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/lib/postgresql/17/bin
          key: pg17-client-postgres17-image-v1-runner-ubuntu-26.04

      - name: Fetch pg17 client from the postgres:17 image (cache miss only)
        # Not apt.postgresql.org (see backup.yml). pg_restore must match PG 17 exactly and the runner
        # ships 16 or 18; postgres:17 is the image the service container above already pulls, so this
        # reuses its cached layers.
        if: steps.pg17-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cid=$(docker create postgres:17)
          docker cp "$cid:/usr/lib/postgresql/17/bin/." /usr/lib/postgresql/17/bin/
          docker rm -f "$cid" >/dev/null

      - name: Verify pg17 client
        run: /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Configure AWS credentials (restore-verify role, OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.RESTORE_VERIFY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install python deps
        run: pip install boto3 --quiet

      - name: Restore-verify latest dump into EMPTY container (${{ matrix.leg }})
        env:
          SCRATCH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/garden_verify
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
          BACKUP_BUCKET: ${{ matrix.bucket }}
          DUMP_PREFIX: ${{ matrix.prefix }}
          # Raw input into env, defaulted in SHELL below, deliberately NOT `${{ inputs.require_full_scope || '1' }}`:
          # `${VAR:-1}` substitutes only on unset/empty, so an explicit '0' survives verbatim. On `schedule` the
          # input is empty, so the default is the strict 1.
          IN_REQUIRE_FULL_SCOPE: ${{ inputs.require_full_scope }}
          # The dump download lands on the work disk: /tmp on ubuntu-26.04 is a ~7.8G RAM-backed tmpfs.
          TMPDIR: ${{ runner.temp }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          export REQUIRE_FULL_SCOPE="${IN_REQUIRE_FULL_SCOPE:-1}"
          python3 scripts/restore-verify.py
