name: restore-verify (scheduled)

# B3 (spec §3) — "an untested backup is not a backup" — Gate 0.2/0.3 rework.
#
# Gate 0.2: the old design restored into a Neon scratch branch created WITHOUT
# parent_id, which Neon parents to PRODUCTION — the branch already contained
# every object the dump might be missing, so the verify was TAUTOLOGICAL. Now
# each leg restores into a genuinely EMPTY postgres:17 SERVICE CONTAINER in the
# runner (also kills the daily scratch-branch churn and the branch cost).
# scripts/restore-verify.py asserts the target is empty pre-restore, then after
# restore asserts schemas {public,gv,extensions}, the extensions/gv function
# inventories, the public trigger inventory, and core row counts — expected
# inventory grounded by read-only SELECTs against live prod at run time.
#
# Gate 0.3: TWO legs — the durable daily bucket AND the snap bucket
# (garden-snapshots-prod/db/snap-*), whose dumps had NEVER been restore-tested.
# workflow_dispatch takes bucket/prefix inputs for a one-off proof run (pick
# the dev ref in the Actions UI once this file is on main).
#
# Transition boundary: CLOSED 2026-08-11. The script still detects scope per dump
# via the archive TOC, but require_full_scope now DEFAULTS TO 1, so a legacy
# public-only dump is a HARD failure rather than a warning. Evidence for the flip:
# the newest dump on BOTH legs carries gv + extensions SCHEMA entries in its TOC
# (db/garden-20260811.dump, db/snap-v4.9.0.dump). The `|| '1'` fallback on the env
# line matches this default deliberately — a dispatch that omits the key must not
# silently downgrade the gate (same footgun as promote-gate's require_integration,
# 2026-08-06). Escape hatch preserved: dispatch with require_full_scope=0.
#
# UNATTENDED by design: the restore-verify role's OIDC trust is scoped to the
# main ref (NOT environment:production), so the scheduled run does NOT pause.
# Blast radius: S3 GetObject + read-only prod SELECTs + a throwaway container.
# NOTE: RESTORE_VERIFY_ROLE_ARN needs s3:GetObject/ListBucket on BOTH buckets —
# the snap leg fails loudly (AccessDenied) if the role only covers the daily one.
#
# Schedule is 08:00 UTC, ~1h after backup.yml (07:00 UTC), so the freshest
# daily dump exists when this runs.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      bucket:
        description: 'One-off proof: S3 bucket to verify (empty = normal daily+snap matrix)'
        required: false
        default: ''
        type: string
      prefix:
        description: 'Dump key prefix for the one-off bucket (default db/)'
        required: false
        default: ''
        type: string
      require_full_scope:
        description: 'Hard-fail legacy public-only dumps. Default 1 since 2026-08-11 — both legs verified full-scope.'
        required: false
        default: '1'
        type: choice
        options:
          - '0'
          - '1'

permissions:
  id-token: write
  contents: read

concurrency:
  group: restore-verify
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - name: Build verify matrix (daily + snap, or one-off dispatch bucket)
        id: mk
        env:
          IN_BUCKET: ${{ inputs.bucket }}
          IN_PREFIX: ${{ inputs.prefix }}
          DAILY_BUCKET: ${{ vars.BACKUP_BUCKET_NAME }}
          SNAP_BUCKET: ${{ vars.SNAP_BUCKET }}
        run: |
          set -euo pipefail
          if [ -n "${IN_BUCKET}" ]; then
            matrix=$(jq -cn --arg b "$IN_BUCKET" --arg p "${IN_PREFIX:-db/}" \
              '{include:[{leg:"custom",bucket:$b,prefix:$p}]}')
          else
            matrix=$(jq -cn --arg db "$DAILY_BUCKET" --arg sb "$SNAP_BUCKET" \
              '{include:[{leg:"daily",bucket:$db,prefix:"db/garden-"},{leg:"snap",bucket:$sb,prefix:"db/snap-"}]}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix: $matrix"

  verify:
    needs: plan
    runs-on: ubuntu-latest
    name: verify (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      # The genuinely-EMPTY restore target (Gate 0.2). postgres:17 tracks the
      # latest 17.x — matches Neon (PG 17) and the PGDG pg17 client below.
      # POSTGRES_PASSWORD is a throwaway for a job-lifetime loopback container,
      # not a secret.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garden_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install postgresql-client-17 (pgdg)
        # Neon + the service container run PG 17; pg_restore enforces a strict
        # major-version match and ubuntu-latest ships a pg16 client. Same PGDG
        # install pattern as backup.yml.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Configure AWS credentials (restore-verify role, OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.RESTORE_VERIFY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install python deps
        run: pip install boto3 --quiet

      - name: Restore-verify latest dump into EMPTY container (${{ matrix.leg }})
        env:
          SCRATCH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/garden_verify
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
          BACKUP_BUCKET: ${{ matrix.bucket }}
          DUMP_PREFIX: ${{ matrix.prefix }}
          REQUIRE_FULL_SCOPE: ${{ inputs.require_full_scope || '1' }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          python3 scripts/restore-verify.py
