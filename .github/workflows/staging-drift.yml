name: Staging schema drift (advisory)

# OPS-STAGINGDRIFT-001. Nothing keeps the staging Neon branch in sync with prod:
# integration-test.yml creates an ephemeral branch off staging and runs the real
# Lambda handlers against it WITHOUT applying migrations, so drift accumulates
# silently. Measured 2026-07-31 while unblocking Lane C: 10 prod-only columns,
# 3 prod-only constraints, and 1 staging-ONLY CHECK that made staging reject
# container_type values prod accepts.
#
# The failure mode is not a broken deploy — it is integration tests failing for
# reasons unrelated to the change under test, which trains everyone to read a red
# integration run as noise.
#
# ADVISORY BY DESIGN — never fails the build. Migrations are applied staging-first,
# so staging legitimately LEADS prod for the whole window between the two applies;
# hard-failing would red the build for that entire window. The script reports
# prod-only drift (staging behind — the dangerous direction) as a finding and
# staging-only columns/indexes as informational. A staging-only CHECK constraint
# IS reported, because an extra CHECK rejects writes prod accepts.
#
# Runs weekly rather than per-push: drift is a slow accumulation, not a per-commit
# event, and each run costs two Neon connections. Also fires on any migrations/**
# push, which is the one commit-shaped signal that the shapes may have moved.

on:
  schedule:
    # Mondays 13:00 UTC — early in the week, so a drift finding has the week to be acted on.
    - cron: '0 13 * * 1'
  push:
    branches: [dev]
    paths:
      - 'migrations/**'
      - 'scripts/check-staging-drift.py'
      - '.github/workflows/staging-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Compare staging Neon schema against prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout garden-app
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install psycopg
        run: pip install 'psycopg[binary]'

      - name: Compare schemas
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_STAGING_URL: ${{ secrets.NEON_STAGING_URL }}
        run: |
          set -uo pipefail
          # SELF-EXPIRING TOLERANCE (2026-08-01): this branch used to `exit 0`, which made a
          # missing secret indistinguishable from "no drift" — a green run that verified nothing.
          # Both secrets HAVE been configured on this repo since 2026-05, so reaching this branch is
          # now a MISCONFIGURATION (a rotated-away or renamed secret), not a not-yet-set-up state.
          # It therefore fails LOUD. This is the same shape as the schema-audit waiver that
          # hard-fails once its precondition lapses: the escape hatch demands its own removal.
          # Note the drift REPORT stays advisory by design (staging legitimately leads prod between
          # a staging apply and its prod apply). The only hard failures are "could not run": this
          # branch, and the checker crashing (below).
          if [[ -z "${NEON_DATABASE_URL:-}" || -z "${NEON_STAGING_URL:-}" ]]; then
            echo "::error title=Staging drift UNVERIFIED::A Neon URL secret is missing; the comparison did NOT run. Both secrets have existed since 2026-05, so this is a misconfiguration, not first-time setup."
            {
              echo "### FAILED — staging drift check could not run"
              echo "NEON_DATABASE_URL and/or NEON_STAGING_URL are not readable by this job."
              echo "Both were configured as repo secrets in 2026-05; check for a rotation, rename,"
              echo "or an environment-scoped override shadowing the repo-scoped secret."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # ERREXIT — keep the `|| RC=$?`. GitHub runs a step with no `shell:` as `bash -e {0}`, so a
          # bare call that exits non-zero ends the step on that line. The first version read `RC=$?`
          # on the next line: an unreachable database (exit 2) went red with no annotation instead of
          # the warning below (OPS-STAGINGDRIFTERREXIT-001; the same defect as B1 of the v4.138.0
          # pre-ship pass, in promote-gate.yml's Lambda decision step). scripts/test_workflow_steps.py
          # runs this body the runner's way.
          RC=0
          python3 scripts/check-staging-drift.py || RC=$?
          if [[ "$RC" -eq 2 ]]; then
            echo "::warning title=Staging drift UNKNOWN::A database was unreachable — drift is UNKNOWN, not absent."
            exit 0
          fi
          # Anything else non-zero is the checker crashing: --strict is not passed, so exit 1 here is an
          # uncaught exception, and 127 a missing python3. The comparison did not finish. It was red
          # before this fix too (errexit), just unnamed; a silent green would verify nothing.
          if [[ "$RC" -ne 0 ]]; then
            echo "::error title=Staging drift UNVERIFIED::check-staging-drift.py exited $RC before finishing; the comparison did NOT complete, so drift is UNKNOWN. See its output above."
            exit "$RC"
          fi
          exit 0
