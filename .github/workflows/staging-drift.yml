name: Staging schema drift (advisory)

# Nothing keeps the staging Neon branch in sync with prod: integration-test.yml forks staging and runs the
# real Lambda handlers on it WITHOUT applying migrations, so drift accumulates silently and shows up as
# integration failures unrelated to the change under test.
#
# ADVISORY BY DESIGN for drift itself: migrations are applied staging-first, so staging legitimately LEADS
# prod between the two applies. The script reports prod-only drift (staging behind, the dangerous
# direction) as a finding and staging-only columns/indexes as informational; a staging-only CHECK
# constraint IS reported, because it rejects writes prod accepts.
#
# Weekly rather than per-push (drift is slow; each run costs two Neon connections), plus any
# migrations/** push.

on:
  schedule:
    # Mondays 13:00 UTC, early in the week, so a finding has the week to be acted on.
    - cron: '0 13 * * 1'
  push:
    branches: [dev]
    paths:
      - 'migrations/**'
      - 'scripts/check-staging-drift.py'
      - '.github/workflows/staging-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Compare staging Neon schema against prod
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout garden-app
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install psycopg
        run: pip install 'psycopg[binary]'

      - name: Compare schemas
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_STAGING_URL: ${{ secrets.NEON_STAGING_URL }}
        run: |
          set -uo pipefail
          # The drift REPORT stays advisory. The only hard failures are "could not run": a missing secret
          # (the script's exit 3) and the checker crashing.
          # ERREXIT: keep the `|| RC=$?`. GitHub runs a step with no `shell:` as `bash -e {0}`, so a bare call
          # that exits non-zero ends the step on that line, with no annotation. scripts/test_workflow_steps.py
          # runs this body the runner's way.
          RC=0
          python3 scripts/check-staging-drift.py || RC=$?
          if [[ "$RC" -eq 2 ]]; then
            echo "::warning title=Staging drift UNKNOWN::A database was unreachable — drift is UNKNOWN, not absent."
            exit 0
          fi
          # Anything else non-zero did not finish: 3 is a missing secret (the script annotated it), and with
          # no --strict, 1 is an uncaught exception and 127 a missing python3. A green here would verify nothing.
          if [[ "$RC" -ne 0 ]]; then
            echo "::error title=Staging drift UNVERIFIED::check-staging-drift.py exited $RC before finishing; the comparison did NOT complete, so drift is UNKNOWN. See its output above."
            exit "$RC"
          fi
          exit 0
