name: Verify Lambda invariants

# Live-account invariant audit for the Lambda fleet. A HARD GATE: deliberately not continue-on-error.
# It is the repo's only live-AWS check of state that drifts with no repo change at all.
#
# TWO CALLERS, ONE COPY:
#   * deploy-lambda.yml calls it after its deploy matrix (`needs: deploy`), which keeps it on the
#     standalone workflow_dispatch path and on scripts/revert-to.py's incident path (revert-to.py
#     dispatches deploy-lambda.yml directly, and a revert is when the gate matters most).
#   * promote-gate.yml calls it unconditionally as the LAST job of every promote, because an SPA-only
#     promote skips deploy-lambda.yml entirely.
# On a Lambda-carrying promote it therefore runs twice. That is deliberate: a duplicate read-only audit
# costs about a minute, while two `if:` conditions that must stay exact complements are a gap waiting to open.
#
# EVERYTHING HERE IS READ-ONLY: get-function-configuration, get-function, get-function-url-config,
# get-policy, describe-rule, list-targets-by-rule. Safe to run twice, and with no preceding deploy: every
# invariant asserts live account state, not deploy output.
#
# The deploy matrix tolerates partial config failures (many of its env steps are continue-on-error); this
# is the backstop that fails loudly when the safety invariants do not hold in the LIVE account:
#   (1) garden-daily-plan env contains ALL of DRY_RUN / SYSTEM_CLERK_SUB / AWN_STATIONS_JSON /
#       GARDEN_HOUSEHOLD_IDS: guards the set-not-merge wipe hazard, where a transient read failure in any
#       env-merge step replaces the entire Variables map with a partial one;
#   (1b) AWN_STATIONS_JSON SHAPE, not just presence: station.js ships an EMPTY default on purpose (public
#       repo), so a wiped env silently unbinds the rain gauge and drops the engine to forecast-only hydrology;
#   (2) DRY_RUN == "false": a wiped or reset value silently re-darkens the nightly engine;
#   (3) EventBridge rule garden-daily-plan-hourly is ENABLED with exactly one target, and
#       (3b) the three rules it supersedes (nightly, intraday-am, intraday-pm) are ABSENT: retire_rule
#       swallows its own errors and check-lambda-config.py only iterates DECLARED rules;
#   (4) live memory/timeout/env across ALL 26 functions matches scripts/lambda-config-expected.json,
#       including flags declared deliberately ABSENT. (1)-(3) stay hand-written because they cover
#       EventBridge and cross-key relationships the manifest's per-key model cannot express.
#
# The checkout ref is the promoted SHA even on an SPA-only promote, when no Lambda shipped: its manifest is
# authoritative, and the run is then a pure drift check of live AWS against it.
#
# environment:production is REQUIRED because the OIDC trust for AWS_DEPLOY_ROLE_ARN is scoped to the
# env:production subject. It does NOT pause: that environment has a branch policy (dev, main) and no
# required reviewers. Do not generalize from production-destructive (revert-gate.yml), which does.
#
# No secrets are used or needed: vars.AWS_DEPLOY_ROLE_ARN is a repo VARIABLE, and the Lambdas fetch their
# own runtime secrets from Secrets Manager. Callers deliberately do NOT pass `secrets: inherit`.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Exact SHA whose scripts/lambda-config-expected.json and scripts/check-lambda-config.py are asserted against live AWS. Empty => the commit of the caller run.'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    # Bounds a verify that hangs once RUNNING (a stuck AWS read); healthy runs take about a minute or less.
    # One limit covers both callers, whose `uses:` jobs cannot carry one. It does NOT bound a job still
    # waiting for a runner: that is scripts/run-status.py STUCK, then cancel and re-run the failed jobs.
    # Pinned by scripts/test_workflow_steps.py.
    timeout-minutes: 10
    environment: production
    steps:
      # Pinned to the ref being verified, NOT the branch head: the manifest must belong to that commit.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Assert daily-plan safety invariants (hard fail)
        run: |
          set -euo pipefail
          FN=garden-daily-plan
          RULE=garden-daily-plan-hourly
          # The three rules the hourly schedule replaces. Asserted ABSENT below, not merely ignored:
          # `retire_rule` swallows its own failures (`|| true` on remove-targets and delete-rule), and
          # check-lambda-config.py only iterates the DECLARED list, so an undeclared-but-live rule is
          # invisible to it. Without this check a half-applied migration — hourly created, the old
          # rules still firing — is a fully green deploy that regenerates the plan five times a day.
          RETIRED_RULES="garden-daily-plan-nightly garden-daily-plan-intraday-am garden-daily-plan-intraday-pm"
          fail=0
          ENVJSON=$(aws lambda get-function-configuration --function-name "$FN" --region us-east-1 \
            --query 'Environment.Variables' --output json 2>/dev/null) || ENVJSON=""
          if [[ -z "$ENVJSON" || "$ENVJSON" == "null" ]]; then
            echo "::error::INVARIANT 1 BROKEN: could not read $FN env, or env is EMPTY (function missing, or set-not-merge wipe)"
            fail=1
            ENVJSON="{}"
          fi
          # AWN_STATIONS_JSON is load-bearing AND lives ONLY here: station.js ships an EMPTY default on
          # purpose (public repo — the record is the gauge MAC + the site coordinate, i.e. the house), so
          # a wiped env does not fall back to a working config, it silently unbinds the rain gauge and
          # drops the engine to forecast hydrology. This assertion is the only thing that catches that.
          # GARDEN_HOUSEHOLD_IDS (BUG-AUTHZLAMBDA-001): household(Space) fails closed to the Space owner
          # without it, so a wipe silently drops the other member's plantings from the plan.
          for k in DRY_RUN SYSTEM_CLERK_SUB AWN_STATIONS_JSON GARDEN_HOUSEHOLD_IDS; do
            v=$(echo "$ENVJSON" | jq -r --arg k "$k" '.[$k] // empty')
            if [[ -z "$v" ]]; then
              echo "::error::INVARIANT 1 BROKEN: $FN env is missing key $k (set-not-merge wipe hazard)"
              fail=1
            fi
          done
          # Shape, not just presence: a truncated or non-array value parses as "set" above but binds nothing.
          if ! echo "$ENVJSON" | jq -e '(.AWN_STATIONS_JSON // "") | fromjson? | (type=="array" and length>0 and (.[0] | has("mac") and has("tz") and has("lat") and has("lng")))' >/dev/null; then
            echo "::error::INVARIANT 1 BROKEN: $FN AWN_STATIONS_JSON is not a non-empty array of {mac,tz,lat,lng}"
            fail=1
          fi
          DR=$(echo "$ENVJSON" | jq -r '.DRY_RUN // empty')
          if [[ "$DR" != "false" ]]; then
            echo "::error::INVARIANT 2 BROKEN: $FN DRY_RUN='$DR' (expected 'false') — nightly engine would be dark"
            fail=1
          fi
          STATE=$(aws events describe-rule --name "$RULE" --region us-east-1 \
            --query 'State' --output text 2>/dev/null) || STATE="MISSING"
          if [[ "$STATE" != "ENABLED" ]]; then
            echo "::error::INVARIANT 3 BROKEN: EventBridge rule $RULE state=$STATE (expected ENABLED)"
            fail=1
          fi
          NTARGETS=$(aws events list-targets-by-rule --rule "$RULE" --region us-east-1 \
            --query 'length(Targets)' --output text 2>/dev/null) || NTARGETS="0"
          if [[ "$NTARGETS" != "1" ]]; then
            echo "::error::INVARIANT 3 BROKEN: $RULE has $NTARGETS targets (expected exactly 1)"
            fail=1
          fi
          # INVARIANT 3b — the superseded rules must be GONE, not merely undeclared.
          for R in $RETIRED_RULES; do
            if aws events describe-rule --name "$R" --region us-east-1 >/dev/null 2>&1; then
              echo "::error::INVARIANT 3b BROKEN: retired rule $R still exists — the hourly migration is HALF-APPLIED. The plan will regenerate on both schedules."
              fail=1
            fi
          done
          if [[ "$fail" -ne 0 ]]; then
            echo "::error::A0.3 post-deploy verification FAILED — daily-plan safety invariants do not hold; treat this deploy as BAD."
            exit 1
          fi
          echo "A0.3 verify OK: env keys present, DRY_RUN=false, $RULE ENABLED with exactly 1 target, all 3 superseded rules absent."

      # The generalization of the step above across all 26 functions. scripts/lambda-config-expected.json
      # is the written-down state of the live account, and this step makes disagreeing with it a red run.
      # It also backstops the `continue-on-error: true` env-ensure steps in deploy-lambda.yml, any of which
      # can fail silently and leave a function without, say, GARDEN_HOUSEHOLD_IDS. Deliberately NOT in
      # `deploy_result`, so a config-drift failure reds the run loudly without withholding a good frontend.
      - name: Assert live Lambda config matches the declared manifest (hard fail)
        run: python3 scripts/check-lambda-config.py --region us-east-1
