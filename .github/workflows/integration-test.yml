# Real-Postgres integration tests: the real Lambda handlers, on the prod driver (@neondatabase/serverless),
# against an ephemeral Neon branch forked from staging (br-polished-art-am12o4ue) and deleted in always().
# Catches schema/code divergence that mocked tests cannot see. promote-gate requires this job
# (`integration-tests`) on the promoted SHA unless dispatched with require_integration=false.

name: Integration Tests — real Postgres (Neon ephemeral branch)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install root deps
        run: npm ci --legacy-peer-deps

      # The harness directSql and vi.mock factories need these resolvable from the repo root, pinned to
      # the versions lambda/events uses for driver fidelity. --no-save: never mutate package.json/lock in CI.
      - name: Install handler deps at root (harness driver + mock targets)
        run: npm install --no-save --legacy-peer-deps "@neondatabase/serverless@^0.10.0" "@clerk/backend@^1.0.0" "@aws-sdk/client-secrets-manager@^3.0.0" "@aws-sdk/client-s3@^3.0.0" "@aws-sdk/s3-request-presigner@^3.0.0"

      # Install in-place lambda deps so the real handler imports resolve.
      - name: Install lambda deps (handlers under test)
        run: |
          for fn in events plants locations inventory-items shared-state findings evidence-ingest storage-location preservation photos harvests; do
            echo "--- npm install lambda/$fn ---"
            (cd lambda/$fn && npm install --omit=dev)
          done

      # The database URL is asked for by name (neondb_owner / neondb / direct), never read from the create
      # response: Neon puts `connection_uris` there only when the branch has one role it can pick, and the
      # staging parent has two password roles. Why and how: scripts/neon_api_check.py. The branch id is
      # written out the moment it is known, so a later failure still reaches the delete step, and the branch
      # carries a one-day expires_at, so one that strands anyway removes itself. The URL is accepted only on
      # the host of the endpoint the create response made for THIS branch, and never on a protected
      # long-lived endpoint: asked without branch_id, the API answers with PROD's host, and the Put-Up step
      # below runs DDL on it. NEON_PROTECTED_ENDPOINTS is the list in tests/integration/_cleanup.js
      # (test_workflow_steps.py keeps the two equal).
      - name: Create ephemeral Neon branch
        id: neon_create
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH: br-polished-art-am12o4ue
          NEON_PROTECTED_ENDPOINTS: ep-lucky-bird-amju6iqt ep-mute-firefly-amq424mj ep-calm-star-amxjxz6n
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          BRANCH_NAME="ci-${RUN_ID}"
          API="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"
          CHK="python3 scripts/neon_api_check.py"
          BODY="$RUNNER_TEMP/neon-body.json"
          # No EXIT trap: under bash 3.2 one turned an abort under set -u into exit 0. Each refusal removes the
          # body itself (it can hold the URL).
          EXPIRES=$(python3 -c 'import datetime as d; print((d.datetime.now(d.timezone.utc) + d.timedelta(days=1)).strftime("%Y-%m-%dT%H:%M:%SZ"))')
          echo "Creating Neon branch: $BRANCH_NAME (expires $EXPIRES)"
          rm -f "$BODY"
          CODE=$(curl -sS --max-time 60 -o "$BODY" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            "$API/branches" \
            -d "{\"branch\":{\"parent_id\":\"$NEON_PARENT_BRANCH\",\"name\":\"$BRANCH_NAME\",\"expires_at\":\"$EXPIRES\"},\"endpoints\":[{\"type\":\"read_write\"}]}") || CODE=000
          $CHK branch-id --endpoint "$API/branches" --status "$CODE" --body-file "$BODY" \
            --out "$RUNNER_TEMP/neon-branch-id" || { rm -f "$BODY"; exit 1; }
          BRANCH_ID=$(cat "$RUNNER_TEMP/neon-branch-id")
          echo "NEON_BRANCH_ID=$BRANCH_ID" >> "$GITHUB_ENV"
          echo "Branch created: $BRANCH_ID"
          $CHK endpoint-host --endpoint "$API/branches" --status "$CODE" --body-file "$BODY" \
            --branch-id "$BRANCH_ID" --out "$RUNNER_TEMP/neon-endpoint-host" || { rm -f "$BODY"; exit 1; }
          EP_HOST=$(cat "$RUNNER_TEMP/neon-endpoint-host")
          # The same role, database and direct host the create response's connection_uri carried. `pooled=false`
          # is load-bearing: without it the API answers with the -pooler host.
          URI_URL="$API/connection_uri?branch_id=$BRANCH_ID&role_name=neondb_owner&database_name=neondb&pooled=false"
          for try in $(seq 1 6); do
            rm -f "$BODY"
            CODE=$(curl -sS --max-time 30 -o "$BODY" -w '%{http_code}' \
              -H "Authorization: Bearer $NEON_API_KEY" "$URI_URL") || CODE=000
            case "$CODE" in
              000|409|423|429|5??) ;;
              *) break ;;
            esac
            if [[ "$try" -lt 6 ]]; then
              echo "connection_uri read: HTTP $CODE, retrying ($try/6)"
              sleep 5
            fi
          done
          $CHK connection-uri --endpoint "$URI_URL" --status "$CODE" --body-file "$BODY" \
            --expect-host "$EP_HOST" --protected "$NEON_PROTECTED_ENDPOINTS" --out "$RUNNER_TEMP/neon-uri" || { rm -f "$BODY"; exit 1; }
          rm -f "$BODY"
          DB_URL=$(cat "$RUNNER_TEMP/neon-uri")
          rm -f "$RUNNER_TEMP/neon-uri"
          DB_PW=${DB_URL#*://}
          DB_PW=${DB_PW%%@*}
          DB_PW=${DB_PW#*:}
          echo "::add-mask::$DB_PW"
          echo "::add-mask::$DB_URL"
          echo "INT_DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      # PUT-UP TRAIN: proves the train's code against its own DDL. On THIS run's ephemeral branch only,
      # apply, in train order, each train directory's 0a file(s) whose schema_version stamp the branch
      # lacks, and nothing else (no 0p backfill, no 0r, no other migration). Staging is never written: the
      # only URL used is the one the create step returned, and the step refuses without it.
      # A no-op once staging carries the stamps (the branch is a fork of staging). A directory that does not
      # exist yet is skipped; each 0a file's second line must read `-- schema_version: <stamp>` (checked
      # after apply). Any SQL error stops the step (ON_ERROR_STOP), and so does a present stamp AFTER an
      # absent one (the fork would be out of train order).
      - name: Apply the Put-Up train's migrations to the ephemeral branch
        env:
          INT_DATABASE_URL: ${{ env.INT_DATABASE_URL }}
          NEON_BRANCH_ID: ${{ env.NEON_BRANCH_ID }}
          NEON_PARENT_BRANCH: br-polished-art-am12o4ue
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [[ -z "${INT_DATABASE_URL:-}" || -z "${NEON_BRANCH_ID:-}" ]]; then
            echo "::error::No ephemeral branch id/URL from the create step; refusing to apply anything."
            exit 1
          fi
          if [[ "$NEON_BRANCH_ID" == "$NEON_PARENT_BRANCH" ]]; then
            echo "::error::The branch to migrate is the staging parent itself; refusing."
            exit 1
          fi
          fork() { psql "$INT_DATABASE_URL" -X -v ON_ERROR_STOP=1 "$@"; }
          # A new endpoint can take a few seconds to accept its first connection.
          for try in $(seq 1 12); do
            if fork -qAt -c 'SELECT 1' >/dev/null 2>&1; then break; fi
            if [[ "$try" -eq 12 ]]; then
              echo "::error::The ephemeral branch never accepted a connection."
              exit 1
            fi
            sleep 5
          done
          applied=0
          first_absent=""
          # TRAIN ORDER (06-ferment-path §5 L1): 1b, then F, then B' (2, 3, 4), then R2a's pantry item amount
          # (it alters pantry_item, so it lists after v5-pantry-001; appended last). Pinned, in this order, by
          # src/__tests__/integrationPutUpTrain.static.test.js — a directory missing here is silently never
          # applied, and the fork then runs the train's code against a schema without it.
          for dir in v5-putupmake-001 v5-fermentpath-001 v5-pantry-001 v5-batchbuilder-001 v5-recipes-001 v5-pantryitemamount-001; do
            for f in migrations/"$dir"/0a-*.sql; do
              stamp=$(sed -n '2s/^-- schema_version: \([0-9A-Za-z._-]*\)$/\1/p' "$f")
              if [[ -z "$stamp" ]]; then
                echo "::error::$f: line 2 must be '-- schema_version: <stamp>'."
                exit 1
              fi
              have=$(fork -qAt -c "SELECT count(*) FROM public.schema_version WHERE version = '$stamp'")
              if [[ "$have" == "1" ]]; then
                if [[ -n "$first_absent" ]]; then
                  echo "::error::$stamp is on the branch but $first_absent was not: out of train order."
                  exit 1
                fi
                echo "present, skipped: $f ($stamp)"
                continue
              fi
              echo "applying: $f ($stamp)"
              fork -q -f "$f"
              have=$(fork -qAt -c "SELECT count(*) FROM public.schema_version WHERE version = '$stamp'")
              if [[ "$have" != "1" ]]; then
                echo "::error::$f ran but did not write its stamp $stamp."
                exit 1
              fi
              first_absent="${first_absent:-$stamp}"
              applied=$((applied + 1))
            done
          done
          echo "Put-Up train files applied to the ephemeral branch: $applied"

      - name: Run integration tests
        env:
          INT_DATABASE_URL: ${{ env.INT_DATABASE_URL }}
          SECRET_NAME: stub-not-used-in-integration-tests
        run: |
          npx vitest run --config vitest.integration.config.ts tests/integration/

      - name: Delete ephemeral Neon branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ env.NEON_BRANCH_ID }}
          NEON_PARENT_BRANCH: br-polished-art-am12o4ue
          RUN_ID: ${{ github.run_id }}
        run: |
          API="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"
          IDS="$NEON_BRANCH_ID"
          if [[ -z "$IDS" ]]; then
            # The create step can fail before it learns the id (no reply, a timeout) after Neon has made the
            # branch. Look this run's branch up by its exact name so that failure strands nothing either.
            LIST_URL="$API/branches?search=ci-${RUN_ID}"
            CODE=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/neon-list.json" -w '%{http_code}' \
              -H "Authorization: Bearer $NEON_API_KEY" "$LIST_URL") || CODE=000
            if python3 scripts/neon_api_check.py branch-ids-named --endpoint "$LIST_URL" --status "$CODE" \
                --body-file "$RUNNER_TEMP/neon-list.json" --name "ci-${RUN_ID}" --out "$RUNNER_TEMP/neon-ids" \
                --severity warning; then
              IDS=$(cat "$RUNNER_TEMP/neon-ids")
            fi
          fi
          if [[ -z "$IDS" ]]; then
            echo "No branch ID — nothing to delete"
            exit 0
          fi
          for ID in $IDS; do
            if [[ "$ID" == "$NEON_PARENT_BRANCH" ]]; then
              echo "::error::Refusing to delete $ID: it is the staging parent, not this run's branch."
              exit 1
            fi
            # No Neon branch here is `protected`, so Neon refuses no delete: only a branch that reads back as
            # this run's ci-<run id> is deleted. One that cannot be read is left to its one-day expiry.
            CODE=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/neon-branch.json" -w '%{http_code}' \
              -H "Authorization: Bearer $NEON_API_KEY" "$API/branches/$ID") || CODE=000
            RC=0
            python3 scripts/neon_api_check.py branch-is --endpoint "$API/branches/$ID" --status "$CODE" \
              --body-file "$RUNNER_TEMP/neon-branch.json" --id "$ID" --name "ci-${RUN_ID}" \
              --out "$RUNNER_TEMP/neon-branch-name" --severity warning || RC=$?
            if [[ "$RC" -eq 2 ]]; then
              echo "::error::Refusing to delete $ID: it is not this run's branch ci-${RUN_ID}."
              exit 1
            elif [[ "$RC" -ne 0 ]]; then
              echo "::warning::Could not confirm $ID is ci-${RUN_ID}; not deleting it (it expires within a day)."
              continue
            fi
            echo "Deleting Neon branch: $ID"
            # A DELETE seconds after the create can meet the endpoint-start operation (423/409): retry, bounded.
            for try in $(seq 1 6); do
              HTTP=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $NEON_API_KEY" \
                "$API/branches/$ID") || HTTP=000
              case "$HTTP" in
                000|409|423|429|5??) ;;
                *) break ;;
              esac
              if [[ "$try" -lt 6 ]]; then
                sleep 5
              fi
            done
            if [[ "$HTTP" == 2* || "$HTTP" == "404" ]]; then
              echo "Branch deleted (HTTP $HTTP)"
            else
              echo "::warning::Branch delete returned HTTP $HTTP — $ID may need manual cleanup (it expires within a day)"
            fi
          done

