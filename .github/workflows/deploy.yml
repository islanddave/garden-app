name: Build and Deploy — SPA

on:
  workflow_call:
    inputs:
      skip_version_bump:
        required: false
        default: false
        type: boolean
      ref:
        description: 'Exact SHA/ref to build (coupled-deploy determinism: promote passes the promoted dev SHA). Empty => github.sha.'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      skip_version_bump:
        description: 'Skip auto-bump (use when package.json was manually set to a specific version, e.g. v2.0.0 or a named release bucket)'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Bump version
        run: |
          # Release-tag-driven versioning (L-171 align, 2026-06-15): the per-deploy npm-version
          # auto-increment was removed. package.json is the single version source, set to the
          # release/snap tag at promote time. NEW_VERSION stays unset so the later "Commit version
          # bump to dev" step no-ops; the Cache-bust step below still uses the short SHA, so every
          # deploy changes CACHE_VERSION and busts the PWA.
          echo "Auto-bump disabled; preserving package.json version (release-tag-driven)."

      - name: Cache-bust service worker
        # SW staleness fix (2.1.1): public/sw.js CACHE_VERSION must change every deploy, or the
        # browser never sees new SW bytes -> never re-activates -> old caches never purge -> a stale
        # shell/bundle (e.g. footer version) is served. Tie it to version + short SHA for uniqueness.
        # Runs after Bump (NEW_VERSION set) and before Build (vite copies public/ verbatim to dist/).
        run: |
          # SHORT_SHA must label the BUILT commit, not github.sha. Under workflow_call from
          # promote-gate the github context is the CALLER's, so github.sha is the ref promote-gate
          # was dispatched on (can be the PRE-PROMOTE main SHA) — NOT the promoted dev SHA the
          # checkout above built (inputs.ref). Derive it from the checked-out HEAD so CACHE_VERSION's
          # SHA matches the built code on EVERY trigger path (workflow_call w/ ref, or direct dispatch),
          # regardless of whether ref was a SHA or a branch name. (2026-07-31: promoting v3.79.0 at
          # dev 66dce43 shipped sw.js v3.79.0-6f26679 (old main) instead of -66dce43.)
          SHORT_SHA="$(git rev-parse HEAD | cut -c1-7)"
          NEWVER="${NEW_VERSION:-$(node -p "require('./package.json').version")}"
          CV="v${NEWVER}-${SHORT_SHA}"
          sed -i -E "s/const CACHE_VERSION = '[^']*'/const CACHE_VERSION = '${CV}'/" public/sw.js
          echo "Service worker cache version -> ${CV}"
          grep -nE "^const CACHE_VERSION" public/sw.js

      - name: Validate env vars
        run: |
          for VAR in VITE_CLERK_PUBLISHABLE_KEY VITE_API_PROJECTS VITE_API_PLANTS VITE_API_LOCATIONS VITE_API_EVENTS VITE_API_FAVORITES VITE_API_PHOTOS VITE_API_DASHBOARD VITE_API_INVENTORY; do
            [[ -n "${!VAR}" ]] || { echo "ERROR: $VAR not set"; exit 1; }
          done
          # VITE_API_VARIETIES is intentionally not in the strict required list yet —
          # first prod deploy creates the Lambda + Function URL; var gets set post-deploy.
          # Brief window where VITE_API_VARIETIES is empty/placeholder is acceptable
          # because no UI references /api/varieties until Session 4 (VarietyPicker etc).
          [[ -n "${VITE_API_VARIETIES:-}" ]] || echo "WARN: VITE_API_VARIETIES not set — varieties UI will not work until set"
          # VITE_API_APP_EVENTS — same first-deploy bootstrap as varieties (V1.2a-1 Session 2).
          # No SPA caller until V1.2a-1 Session 3 dashboard ships. Lambda writes telemetry directly
          # in events Lambda step 5; SPA-side telemetry calls land in Session 3.
          [[ -n "${VITE_API_APP_EVENTS:-}" ]] || echo "WARN: VITE_API_APP_EVENTS not set — SPA telemetry will not flow until set"
          # VITE_API_ACHIEVEMENTS — same first-deploy bootstrap (V1.2a-1 Session 4).
          # First prod deploy creates garden-achievements Lambda + Function URL; var gets set post-deploy.
          # Brief window where the Achievements page returns runtime error is acceptable—ship-then-wire.
          [[ -n "${VITE_API_ACHIEVEMENTS:-}" ]] || echo "WARN: VITE_API_ACHIEVEMENTS not set — Achievements page will not work until set"
          [[ -n "${VITE_API_UX_EVENTS:-}" ]] || echo "WARN: VITE_API_UX_EVENTS not set — UX telemetry will not flow until set"
          # VITE_API_CRITTERS — same first-deploy bootstrap (MVP-Critter Phase B ship 2026-05-31).
          #   Critter Lambda is created automatically on first prod deploy via deploy-lambda.yml.
          #   Dave then sets vars.VITE_API_CRITTERS to the new Function URL and next deploy bakes it in.
          [[ -n "${VITE_API_CRITTERS:-}" ]] || echo "WARN: VITE_API_CRITTERS not set — critter rewards will not flow until set"
          # VITE_API_SHARED_STATE — same first-deploy bootstrap (V3-REWARDSTATE-001).
          [[ -n "${VITE_API_SHARED_STATE:-}" ]] || echo "WARN: VITE_API_SHARED_STATE not set — shared-garden reward substrate unreachable until set"
          [[ -n "${VITE_API_TAGS:-}" ]] || echo "WARN: VITE_API_TAGS not set — tag UI will not work until set (ship-then-wire; GARDENIA)"
          # VITE_API_HARVESTS — same first-deploy bootstrap (V4-HARVESTVIEW-001). deploy-lambda.yml
          # creates garden-harvests on first prod deploy; Dave then sets vars.VITE_API_HARVESTS to the
          # new Function URL and the NEXT build bakes it. Empty until wired — Harvests page unreachable,
          # nothing else breaks (ship-then-wire; the Harvests UI ships in a later slice regardless).
          [[ -n "${VITE_API_HARVESTS:-}" ]] || echo "WARN: VITE_API_HARVESTS not set — Harvests page will not work until set"
          [[ "$VITE_CLERK_PUBLISHABLE_KEY" == pk_live_* ]] || {
            echo "ERROR: VITE_CLERK_PUBLISHABLE_KEY must be pk_live_* for prod (got ${VITE_CLERK_PUBLISHABLE_KEY:0:12}...)"
            exit 1
          }
          echo "All VITE_ vars present and valid"
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_PROJECTS:          ${{ vars.VITE_API_PROJECTS }}
          VITE_API_PLANTS:            ${{ vars.VITE_API_PLANTS }}
          VITE_API_LOCATIONS:         ${{ vars.VITE_API_LOCATIONS }}
          VITE_API_EVENTS:            ${{ vars.VITE_API_EVENTS }}
          VITE_API_FAVORITES:         ${{ vars.VITE_API_FAVORITES }}
          VITE_API_PHOTOS:            ${{ vars.VITE_API_PHOTOS }}
          VITE_API_DASHBOARD:         ${{ vars.VITE_API_DASHBOARD }}
          VITE_API_INVENTORY:         ${{ vars.VITE_API_INVENTORY }}
          VITE_API_VARIETIES:         ${{ vars.VITE_API_VARIETIES }}
          VITE_API_APP_EVENTS:        ${{ vars.VITE_API_APP_EVENTS }}
          VITE_API_ACHIEVEMENTS:      ${{ vars.VITE_API_ACHIEVEMENTS }}
          VITE_API_FINDINGS:          ${{ vars.VITE_API_FINDINGS }}
          VITE_API_DAILY_PLAN_READ:   ${{ vars.VITE_API_DAILY_PLAN_READ }}
          VITE_API_MEMBERS:          ${{ vars.VITE_API_MEMBERS }}
          VITE_API_TAGS:              ${{ vars.VITE_API_TAGS }}
          VITE_API_CRITTERS:          ${{ vars.VITE_API_CRITTERS }}
          VITE_API_UX_EVENTS:         ${{ vars.VITE_API_UX_EVENTS }}
          VITE_API_SHARED_STATE:      ${{ vars.VITE_API_SHARED_STATE }}
          # V4-HARVESTCENTER-001 (Put-Up). Ship-then-wire like critters/tags: the Lambdas are created
          # by the first deploy, Dave/Claude then set vars.VITE_API_* to the new Function URLs and the
          # NEXT build bakes them. Empty until wired — Put-Up is simply unreachable, nothing else breaks.
          VITE_API_PRESERVATION:      ${{ vars.VITE_API_PRESERVATION }}
          VITE_API_STORAGE_LOCATIONS: ${{ vars.VITE_API_STORAGE_LOCATIONS }}
          VITE_API_HARVESTS:          ${{ vars.VITE_API_HARVESTS }}
          # V4-IGSHARE-001 — MUST be in THIS block, same reason, and the reason it is here at all:
          # setting vars.VITE_API_FACEBOOK_SHARE alone did NOTHING. Prod v4.78.0 shipped with the
          # repo var correctly set and both share paths still bound to EMPTY STRINGS, because the
          # var was never mapped into a build env block. So "Facebook is one repo-var edit from
          # public", as the ledger and two handoffs claimed, was FALSE — it needed this line too.
          # ONE VAR, BOTH TARGETS: api.js routes /api/share/facebook AND /api/share/instagram
          # through this single value, so wiring it arms Facebook (live since 2026-08-21) as well.
          VITE_API_FACEBOOK_SHARE:    ${{ vars.VITE_API_FACEBOOK_SHARE }}

      - name: Build
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_PROJECTS:          ${{ vars.VITE_API_PROJECTS }}
          VITE_API_PLANTS:            ${{ vars.VITE_API_PLANTS }}
          VITE_API_LOCATIONS:         ${{ vars.VITE_API_LOCATIONS }}
          VITE_API_EVENTS:            ${{ vars.VITE_API_EVENTS }}
          VITE_API_FAVORITES:         ${{ vars.VITE_API_FAVORITES }}
          VITE_API_PHOTOS:            ${{ vars.VITE_API_PHOTOS }}
          VITE_API_DASHBOARD:         ${{ vars.VITE_API_DASHBOARD }}
          VITE_API_INVENTORY:         ${{ vars.VITE_API_INVENTORY }}
          VITE_API_VARIETIES:         ${{ vars.VITE_API_VARIETIES }}
          VITE_API_APP_EVENTS:        ${{ vars.VITE_API_APP_EVENTS }}
          VITE_API_ACHIEVEMENTS:      ${{ vars.VITE_API_ACHIEVEMENTS }}
          VITE_API_FINDINGS:          ${{ vars.VITE_API_FINDINGS }}
          VITE_API_DAILY_PLAN_READ:   ${{ vars.VITE_API_DAILY_PLAN_READ }}
          VITE_API_MEMBERS:          ${{ vars.VITE_API_MEMBERS }}
          VITE_API_TAGS:              ${{ vars.VITE_API_TAGS }}
          VITE_API_CRITTERS:          ${{ vars.VITE_API_CRITTERS }}
          VITE_API_UX_EVENTS:         ${{ vars.VITE_API_UX_EVENTS }}
          VITE_API_SHARED_STATE:      ${{ vars.VITE_API_SHARED_STATE }}
          # V4-HARVESTCENTER-001 (Put-Up) — MUST be in THIS block: vite bakes import.meta.env at build
          # time, so a repo var absent here is silently empty in the bundle no matter what vars.* holds.
          VITE_API_PRESERVATION:      ${{ vars.VITE_API_PRESERVATION }}
          VITE_API_STORAGE_LOCATIONS: ${{ vars.VITE_API_STORAGE_LOCATIONS }}
          # V4-HARVESTVIEW-001 — MUST be in THIS block: vite bakes import.meta.env at build time, so a
          # repo var absent here is silently empty in the bundle no matter what vars.* holds.
          VITE_API_HARVESTS:          ${{ vars.VITE_API_HARVESTS }}
          # V4-IGSHARE-001 — MUST be in THIS block, same reason, and the reason it is here at all:
          # setting vars.VITE_API_FACEBOOK_SHARE alone did NOTHING. Prod v4.78.0 shipped with the
          # repo var correctly set and both share paths still bound to EMPTY STRINGS, because the
          # var was never mapped into a build env block. So "Facebook is one repo-var edit from
          # public", as the ledger and two handoffs claimed, was FALSE — it needed this line too.
          # ONE VAR, BOTH TARGETS: api.js routes /api/share/facebook AND /api/share/instagram
          # through this single value, so wiring it arms Facebook (live since 2026-08-21) as well.
          VITE_API_FACEBOOK_SHARE:    ${{ vars.VITE_API_FACEBOOK_SHARE }}

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo 'ERROR: dist/index.html missing'; exit 1; }
          # V4-KBVIEWPORT-001: the viewport meta is the entire keyboard fix and nothing in the
          # jsdom suite can observe it. viewportMeta.static.test.js guards the SOURCE; this guards
          # the BUILT artifact, which is what Chrome actually parses, against an html-transform
          # plugin or a Vite upgrade silently dropping the key.
          grep -q 'interactive-widget=resizes-content' dist/index.html || {
            echo 'ERROR: viewport interactive-widget lost in build (V4-KBVIEWPORT-001)'; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify S3 versioning enabled [Boss condition 2]
        # Hard gate: S3 versioning must be enabled before any deploy.
        # Versioning is required for the S3 rollback leg of the three-unit rollback strategy.
        # If this fails: aws s3api put-bucket-versioning --bucket <bucket> --versioning-configuration Status=Enabled
        run: |
          STATUS=$(aws s3api get-bucket-versioning \
            --bucket ${{ vars.S3_BUCKET_NAME }} \
            | jq -r '.Status // "None"')
          [[ "$STATUS" == "Enabled" ]] || {
            echo "FATAL: S3 versioning not enabled on ${{ vars.S3_BUCKET_NAME }} (status: $STATUS)"
            echo "Fix: aws s3api put-bucket-versioning --bucket ${{ vars.S3_BUCKET_NAME }} --versioning-configuration Status=Enabled"
            exit 1
          }
          echo "✅ S3 versioning: $STATUS"

      - name: Deploy to S3 — hashed assets (immutable)
        run: |
          aws s3 sync dist/assets/ s3://${{ vars.S3_BUCKET_NAME }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive REPLACE

      - name: Deploy to S3 — root files (no-cache, prune stale)
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }}/ \
            --exclude "assets/*" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE \
            --delete

      - name: Invalidate CloudFront — index.html only
        run: |
          set -uo pipefail
          # Bounded retry against transient CF connect-timeouts (D1-ship false-fail class, L-166 family).
          ok=0
          for attempt in 1 2 3 4 5; do
            aws cloudfront create-invalidation \
              --distribution-id ${{ vars.CLOUDFRONT_DIST_ID }} \
              --paths "/index.html" && { ok=1; break; }
            echo "  create-invalidation attempt $attempt failed (transient) — retry in $((attempt*10))s"
            sleep $((attempt*10))
          done
          [ "$ok" = "1" ] || { echo "::error::CloudFront invalidation failed after retries"; exit 1; }

      - name: Restore Lambda Function URL CORS
        # OPTIONS excluded from AllowMethods (>6 chars fails validation); AWS handles preflight automatically.
        # First-deploy resilience: skip Lambdas that don't exist yet (e.g., a new Lambda added in the same
        # commit that creates it via deploy-lambda.yml — SPA deploy.yml may run first and find the function
        # not yet provisioned). Fixed 2026-05-12 (3f27c817 V1.2a-1 Session 2 first-deploy of garden-app-events).
        run: |
          CORS='{"AllowCredentials":false,"AllowHeaders":["authorization","content-type"],"AllowMethods":["GET","POST","PUT","DELETE","PATCH"],"AllowOrigins":["https://garden.futureishere.net"],"ExposeHeaders":[],"MaxAge":300}'
          for fn in garden-dashboard garden-events garden-favorites garden-inventory-items garden-locations garden-photos garden-plants garden-projects garden-varieties garden-app-events garden-achievements garden-preservation garden-storage-location; do
            if aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then
              echo -n "CORS $fn: "
              aws lambda update-function-url-config \
                --function-name "$fn" \
                --region us-east-1 \
                --cors "$CORS" \
                --query 'Cors.AllowOrigins[0]' --output text
            else
              echo "CORS $fn: SKIPPED (function not yet provisioned — deploy-lambda.yml will create it)"
            fi
          done

      - name: Post-deploy Lambda health check
        # Confirms all 13 prod Lambda functions are Active after deploy.
        # garden-preservation + garden-storage-location added 2026-07-21 (V4-PUTUPLINK-001): they
        # shipped with Put-Up but were never added to either list, so a CORS drift on them would
        # have gone unrestored and unnoticed. Both are origin-locked to the same prod domain.
        # Catches: broken zip, failed update, function in Pending/Failed state.
        run: |
          HEALTH_FAIL=0
          for fn in garden-dashboard garden-events garden-favorites garden-inventory-items garden-locations garden-photos garden-plants garden-projects garden-varieties garden-app-events garden-achievements garden-preservation garden-storage-location; do
            if ! aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then
              echo "⚠️ $fn: NOT YET PROVISIONED (skipping health check — first-deploy in progress)"
              continue
            fi
            STATE=$(aws lambda get-function-configuration \
              --function-name "$fn" \
              --query 'State' --output text)
            if [[ "$STATE" == "Active" ]]; then
              echo "✅ $fn: $STATE"
            else
              echo "❌ $fn: $STATE (expected Active)"
              ((HEALTH_FAIL++))
            fi
          done
          [[ "$HEALTH_FAIL" -eq 0 ]] || { echo "FATAL: $HEALTH_FAIL Lambda(s) not Active post-deploy"; exit 1; }

      - name: Post-deploy HTTP smoke (prod, read-only)
        # Data-plane verification — complements the control-plane "Lambda health check" above.
        # A Lambda can report State=Active yet 502 on invoke, and the health check never touches
        # CloudFront/SPA. This step hits the live prod surface over HTTPS with NO auth and NO writes
        # (zero prod-DB mutation; L-108 authed write→read-back asserts stay on staging only):
        #   - each Function URL /api/{entity} GET, unauthed -> must be 401 (auth gate live = healthy;
        #     catches 5xx bad-zip/module-load, 000 DNS/TLS, 404 routing break, 200 auth-disabled regression)
        #   - SPA https://garden.futureishere.net/ -> 200 + body contains id="root" (real index, not error page)
        # Verified ground truth 2026-05-25 (modest-funny-allen): all 11 endpoints 401, SPA 200 w/ id="root".
        # Required vars must be set + 401; optional (varieties/app-events/achievements) loud-skip if unset (L-109).
        # One retry per check (sleep 3) absorbs Lambda cold-start / CF cold-edge flake. Read-only, so a
        # false-fail yields a red run but never a broken prod (S3+CF already updated by the steps above).
        #
        # CANARY HYGIENE (2026-08-26, BUG-TOKENLESS401-001). These probes originally sent NO
        # Authorization header. That makes verifyToken log "Invalid JWT form", which is the exact
        # pattern of the `tokenless-request-401` metric filter behind the `garden-tokenless-requests`
        # alarm (Sum > 5 per 15min). TEN of the thirteen probes below land in that alarm's 19 log
        # groups, so EVERY prod deploy tripped it — three pages on 2026-08-26 alone, none of them a
        # real user. The canary could not be read at all: its own description claimed "every datapoint
        # is a real user request", and excluding warmOrigins' four targets was necessary but not
        # sufficient, because nobody enumerated this step as the second synthetic tokenless source.
        # Fix: send a well-formed-but-garbage bearer token instead. Prod still answers 401 (verified
        # live against garden-plants: "verifyToken failed: Unexpected end of data"), so every
        # assertion above is unchanged, and the alarm stops counting our own deploys. Deliberately
        # choose parts that do NOT base64-decode to valid JSON — the header parse then fails BEFORE
        # any Clerk JWKS lookup, so this stays as fast and as network-free as the empty-token path.
        # The three probes that are already OUTSIDE the alarm's log groups (plants / locations /
        # inventory-items are warmOrigins targets) keep the header-less form, so the no-header -> 401
        # path is still asserted on every deploy at zero canary cost.
        env:
          VITE_API_PROJECTS:     ${{ vars.VITE_API_PROJECTS }}
          VITE_API_PLANTS:       ${{ vars.VITE_API_PLANTS }}
          VITE_API_LOCATIONS:    ${{ vars.VITE_API_LOCATIONS }}
          VITE_API_EVENTS:       ${{ vars.VITE_API_EVENTS }}
          VITE_API_FAVORITES:    ${{ vars.VITE_API_FAVORITES }}
          VITE_API_PHOTOS:       ${{ vars.VITE_API_PHOTOS }}
          VITE_API_DASHBOARD:    ${{ vars.VITE_API_DASHBOARD }}
          VITE_API_INVENTORY:    ${{ vars.VITE_API_INVENTORY }}
          VITE_API_VARIETIES:    ${{ vars.VITE_API_VARIETIES }}
          VITE_API_APP_EVENTS:   ${{ vars.VITE_API_APP_EVENTS }}
          VITE_API_ACHIEVEMENTS: ${{ vars.VITE_API_ACHIEVEMENTS }}
          VITE_API_FINDINGS:          ${{ vars.VITE_API_FINDINGS }}
          VITE_API_DAILY_PLAN_READ:   ${{ vars.VITE_API_DAILY_PLAN_READ }}
          VITE_API_MEMBERS:          ${{ vars.VITE_API_MEMBERS }}
          VITE_API_TAGS:              ${{ vars.VITE_API_TAGS }}
          VITE_API_HARVESTS:          ${{ vars.VITE_API_HARVESTS }}
          # V4-IGSHARE-001 — MUST be in THIS block, same reason, and the reason it is here at all:
          # setting vars.VITE_API_FACEBOOK_SHARE alone did NOTHING. Prod v4.78.0 shipped with the
          # repo var correctly set and both share paths still bound to EMPTY STRINGS, because the
          # var was never mapped into a build env block. So "Facebook is one repo-var edit from
          # public", as the ledger and two handoffs claimed, was FALSE — it needed this line too.
          # ONE VAR, BOTH TARGETS: api.js routes /api/share/facebook AND /api/share/instagram
          # through this single value, so wiring it arms Facebook (live since 2026-08-21) as well.
          VITE_API_FACEBOOK_SHARE:    ${{ vars.VITE_API_FACEBOOK_SHARE }}
        run: |
          set -uo pipefail
          SMOKE_FAIL=0
          SPA_URL="https://garden.futureishere.net"
          SMOKE_TOKEN="ci.smoke.probe"
          probe_api() {
            local label="$1" base="$2" entity="$3" required="$4" auth="${5:-token}"
            if [[ -z "$base" ]]; then
              if [[ "$required" == "yes" ]]; then
                echo "FAIL $label: REQUIRED var unset"; SMOKE_FAIL=$((SMOKE_FAIL+1))
              else
                echo "SKIP $label: optional var unset"
              fi
              return
            fi
            local url="${base%/}/api/${entity}" code="000"
            for attempt in 1 2; do
              if [[ "$auth" == "none" ]]; then
                code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 --connect-timeout 10 "$url") || code="000"
              else
                code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 --connect-timeout 10 -H "Authorization: Bearer $SMOKE_TOKEN" "$url") || code="000"
              fi
              [[ "$code" == "401" ]] && break
              [[ "$attempt" -eq 1 ]] && sleep 3
            done
            if [[ "$code" == "401" ]]; then
              echo "PASS $label: HTTP 401 (auth gate live, auth=$auth)"
            else
              echo "FAIL $label: HTTP $code (expected 401, auth=$auth) -> $url"; SMOKE_FAIL=$((SMOKE_FAIL+1))
            fi
          }
          # auth=none is reserved for endpoints OUTSIDE the garden-tokenless-requests alarm's log
          # groups. Moving any other probe to none re-arms the false positive this step just fixed.
          probe_api projects     "$VITE_API_PROJECTS"     projects        yes token
          probe_api plants       "$VITE_API_PLANTS"       plants          yes none
          probe_api locations    "$VITE_API_LOCATIONS"    locations       yes none
          probe_api events       "$VITE_API_EVENTS"       events          yes token
          probe_api favorites    "$VITE_API_FAVORITES"    favorites       yes token
          probe_api photos       "$VITE_API_PHOTOS"       photos          yes token
          probe_api dashboard    "$VITE_API_DASHBOARD"    dashboard       yes token
          probe_api inventory    "$VITE_API_INVENTORY"    inventory-items yes none
          probe_api varieties    "$VITE_API_VARIETIES"    varieties       no  token
          probe_api app-events   "$VITE_API_APP_EVENTS"   app-events      no  token
          probe_api achievements "$VITE_API_ACHIEVEMENTS" achievements    no  token
          probe_api tags         "$VITE_API_TAGS"         tags            no  token
          probe_api harvests     "$VITE_API_HARVESTS"     harvests        no  token
          SPA_CODE="000"; SPA_BODY=""
          for attempt in 1 2; do
            SPA_BODY=$(curl -s --max-time 25 --connect-timeout 10 -w $'\n%{http_code}' "$SPA_URL/") || SPA_BODY=$'\n000'
            SPA_CODE="${SPA_BODY##*$'\n'}"
            [[ "$SPA_CODE" == "200" ]] && break
            [[ "$attempt" -eq 1 ]] && sleep 3
          done
          if [[ "$SPA_CODE" == "200" ]] && grep -q 'id="root"' <<< "$SPA_BODY"; then
            echo "PASS SPA: HTTP 200 + id=\"root\" present"
          else
            echo "FAIL SPA: HTTP $SPA_CODE (expected 200 with id=\"root\") -> $SPA_URL"; SMOKE_FAIL=$((SMOKE_FAIL+1))
          fi
          echo "----"
          if [[ "$SMOKE_FAIL" -eq 0 ]]; then
            echo "✅ Prod HTTP smoke passed"
          else
            echo "FATAL: $SMOKE_FAIL prod smoke check(s) failed"; exit 1
          fi

      - name: Commit version bump to dev
        if: env.NEW_VERSION != ''
        # Writes the bumped package.json back to dev so future builds start from the new version.
        # Uses GITHUB_TOKEN (contents: write). If dev branch protection blocks it, set GH_PAT_GARDEN
        # secret (fine-grained, contents:write on garden-app) and swap token below.
        run: |
          SHA=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/package.json?ref=dev" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          CONTENT=$(base64 -w 0 package.json)
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/package.json" \
            -d "{\"message\":\"chore: bump version to ${{ env.NEW_VERSION }} [deploy auto]\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\",\"branch\":\"dev\"}" \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print('✅ v${{ env.NEW_VERSION }} committed to dev:', r['commit']['sha'][:12])" \
            || echo "⚠️ Version commit to dev failed — bump package.json manually on dev"

