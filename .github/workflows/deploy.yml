name: Build and Deploy — SPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump applied before build (patch|minor|major|none). Defaults to patch on push triggers.'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major, none]

permissions:
  id-token: write
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Bump version
        run: |
          BUMP="${{ github.event.inputs.version_bump }}"
          BUMP="${BUMP:-patch}"
          if [[ "$BUMP" == "none" ]]; then
            echo "Version bump skipped (none)."
            exit 0
          fi
          OLD=$(node -p "require('./package.json').version")
          npm version "$BUMP" --no-git-tag-version
          NEW=$(node -p "require('./package.json').version")
          echo "Version: $OLD → $NEW"
          echo "NEW_VERSION=$NEW" >> "$GITHUB_ENV"

      - name: Validate env vars
        run: |
          for VAR in VITE_CLERK_PUBLISHABLE_KEY VITE_API_PROJECTS VITE_API_PLANTS VITE_API_LOCATIONS VITE_API_EVENTS VITE_API_FAVORITES VITE_API_PHOTOS VITE_API_DASHBOARD VITE_API_INVENTORY; do
            [[ -n "${!VAR}" ]] || { echo "ERROR: $VAR not set"; exit 1; }
          done
          # VITE_API_VARIETIES is intentionally not in the strict required list yet —
          # first prod deploy creates the Lambda + Function URL; var gets set post-deploy.
          # Brief window where VITE_API_VARIETIES is empty/placeholder is acceptable
          # because no UI references /api/varieties until Session 4 (VarietyPicker etc).
          [[ -n "${VITE_API_VARIETIES:-}" ]] || echo "WARN: VITE_API_VARIETIES not set — varieties UI will not work until set"
          # VITE_API_APP_EVENTS — same first-deploy bootstrap as varieties (V1.2a-1 Session 2).
          # No SPA caller until V1.2a-1 Session 3 dashboard ships. Lambda writes telemetry directly
          # in events Lambda step 5; SPA-side telemetry calls land in Session 3.
          [[ -n "${VITE_API_APP_EVENTS:-}" ]] || echo "WARN: VITE_API_APP_EVENTS not set — SPA telemetry will not flow until set"
          # VITE_API_ACHIEVEMENTS — same first-deploy bootstrap (V1.2a-1 Session 4).
          # First prod deploy creates garden-achievements Lambda + Function URL; var gets set post-deploy.
          # Brief window where the Achievements page returns runtime error is acceptable—ship-then-wire.
          [[ -n "${VITE_API_ACHIEVEMENTS:-}" ]] || echo "WARN: VITE_API_ACHIEVEMENTS not set — Achievements page will not work until set"
          [[ "$VITE_CLERK_PUBLISHABLE_KEY" == pk_live_* ]] || {
            echo "ERROR: VITE_CLERK_PUBLISHABLE_KEY must be pk_live_* for prod (got ${VITE_CLERK_PUBLISHABLE_KEY:0:12}...)"
            exit 1
          }
          echo "All VITE_ vars present and valid"
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_PROJECTS:          ${{ vars.VITE_API_PROJECTS }}
          VITE_API_PLANTS:            ${{ vars.VITE_API_PLANTS }}
          VITE_API_LOCATIONS:         ${{ vars.VITE_API_LOCATIONS }}
          VITE_API_EVENTS:            ${{ vars.VITE_API_EVENTS }}
          VITE_API_FAVORITES:         ${{ vars.VITE_API_FAVORITES }}
          VITE_API_PHOTOS:            ${{ vars.VITE_API_PHOTOS }}
          VITE_API_DASHBOARD:         ${{ vars.VITE_API_DASHBOARD }}
          VITE_API_INVENTORY:         ${{ vars.VITE_API_INVENTORY }}
          VITE_API_VARIETIES:         ${{ vars.VITE_API_VARIETIES }}
          VITE_API_APP_EVENTS:        ${{ vars.VITE_API_APP_EVENTS }}
          VITE_API_ACHIEVEMENTS:      ${{ vars.VITE_API_ACHIEVEMENTS }}

      - name: Build
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_PROJECTS:          ${{ vars.VITE_API_PROJECTS }}
          VITE_API_PLANTS:            ${{ vars.VITE_API_PLANTS }}
          VITE_API_LOCATIONS:         ${{ vars.VITE_API_LOCATIONS }}
          VITE_API_EVENTS:            ${{ vars.VITE_API_EVENTS }}
          VITE_API_FAVORITES:         ${{ vars.VITE_API_FAVORITES }}
          VITE_API_PHOTOS:            ${{ vars.VITE_API_PHOTOS }}
          VITE_API_DASHBOARD:         ${{ vars.VITE_API_DASHBOARD }}
          VITE_API_INVENTORY:         ${{ vars.VITE_API_INVENTORY }}
          VITE_API_VARIETIES:         ${{ vars.VITE_API_VARIETIES }}
          VITE_API_APP_EVENTS:        ${{ vars.VITE_API_APP_EVENTS }}
          VITE_API_ACHIEVEMENTS:      ${{ vars.VITE_API_ACHIEVEMENTS }}

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo 'ERROR: dist/index.html missing'; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify S3 versioning enabled [Boss condition 2]
        # Hard gate: S3 versioning must be enabled before any deploy.
        # Versioning is required for the S3 rollback leg of the three-unit rollback strategy.
        # If this fails: aws s3api put-bucket-versioning --bucket <bucket> --versioning-configuration Status=Enabled
        run: |
          STATUS=$(aws s3api get-bucket-versioning \
            --bucket ${{ vars.S3_BUCKET_NAME }} \
            | jq -r '.Status // "None"')
          [[ "$STATUS" == "Enabled" ]] || {
            echo "FATAL: S3 versioning not enabled on ${{ vars.S3_BUCKET_NAME }} (status: $STATUS)"
            echo "Fix: aws s3api put-bucket-versioning --bucket ${{ vars.S3_BUCKET_NAME }} --versioning-configuration Status=Enabled"
            exit 1
          }
          echo "✅ S3 versioning: $STATUS"

      - name: Deploy to S3 — hashed assets (immutable)
        run: |
          aws s3 sync dist/assets/ s3://${{ vars.S3_BUCKET_NAME }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive REPLACE

      - name: Deploy to S3 — root files (no-cache, prune stale)
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }}/ \
            --exclude "assets/*" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE \
            --delete

      - name: Invalidate CloudFront — index.html only
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DIST_ID }} \
            --paths "/index.html"

      - name: Restore Lambda Function URL CORS
        # OPTIONS excluded from AllowMethods (>6 chars fails validation); AWS handles preflight automatically.
        # First-deploy resilience: skip Lambdas that don't exist yet (e.g., a new Lambda added in the same
        # commit that creates it via deploy-lambda.yml — SPA deploy.yml may run first and find the function
        # not yet provisioned). Fixed 2026-05-12 (3f27c817 V1.2a-1 Session 2 first-deploy of garden-app-events).
        run: |
          CORS='{"AllowCredentials":false,"AllowHeaders":["authorization","content-type"],"AllowMethods":["GET","POST","PUT","DELETE"],"AllowOrigins":["https://garden.futureishere.net"],"ExposeHeaders":[],"MaxAge":300}'
          for fn in garden-dashboard garden-events garden-favorites garden-inventory-items garden-locations garden-photos garden-plants garden-projects garden-varieties garden-app-events garden-achievements; do
            if aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then
              echo -n "CORS $fn: "
              aws lambda update-function-url-config \
                --function-name "$fn" \
                --region us-east-1 \
                --cors "$CORS" \
                --query 'Cors.AllowOrigins[0]' --output text
            else
              echo "CORS $fn: SKIPPED (function not yet provisioned — deploy-lambda.yml will create it)"
            fi
          done

      - name: Post-deploy Lambda health check
        # Confirms all 10 prod Lambda functions are Active after deploy.
        # Catches: broken zip, failed update, function in Pending/Failed state.
        run: |
          HEALTH_FAIL=0
          for fn in garden-dashboard garden-events garden-favorites garden-inventory-items garden-locations garden-photos garden-plants garden-projects garden-varieties garden-app-events garden-achievements; do
            if ! aws lambda get-function --function-name "$fn" >/dev/null 2>&1; then
              echo "⚠️ $fn: NOT YET PROVISIONED (skipping health check — first-deploy in progress)"
              continue
            fi
            STATE=$(aws lambda get-function-configuration \
              --function-name "$fn" \
              --query 'State' --output text)
            if [[ "$STATE" == "Active" ]]; then
              echo "✅ $fn: $STATE"
            else
              echo "❌ $fn: $STATE (expected Active)"
              ((HEALTH_FAIL++))
            fi
          done
          [[ "$HEALTH_FAIL" -eq 0 ]] || { echo "FATAL: $HEALTH_FAIL Lambda(s) not Active post-deploy"; exit 1; }

      - name: Commit version bump to dev
        if: env.NEW_VERSION != ''
        # Writes the bumped package.json back to dev so future builds start from the new version.
        # Uses GITHUB_TOKEN (contents: write). If dev branch protection blocks it, set GH_PAT_GARDEN
        # secret (fine-grained, contents:write on garden-app) and swap token below.
        run: |
          SHA=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/package.json?ref=dev" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          CONTENT=$(base64 -w 0 package.json)
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/package.json" \
            -d "{\"message\":\"chore: bump version to ${{ env.NEW_VERSION }} [deploy auto]\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\",\"branch\":\"dev\"}" \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print('✅ v${{ env.NEW_VERSION }} committed to dev:', r['commit']['sha'][:12])" \
            || echo "⚠️ Version commit to dev failed — bump package.json manually on dev"
