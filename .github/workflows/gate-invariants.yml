name: Migration gate invariants

# Runs the POST-gates of already-applied migrations against live prod and staging as a continuous
# invariant check. It catches what no apply-time check can: an apply that was green while the post-state
# is wrong (a backfill that never ran, an invariant a later write broke), visible only by asking the
# database whether the invariant still holds.
#
# POST-gates only, and only --continuous-only: PRE-gates assert a migration is NOT yet applied, so they
# fail by design on an applied database. Some post-gates hold only in the apply window (a freshness check,
# a frozen view-column count, a "no rows yet" receipt); those carry `continuous: false` and are skipped
# here, which keeps this job's red meaningful instead of permanent.
#
# The job FAILS on findings (see `Surface findings` for why the teeth are there and not on the run
# steps). Scheduled rather than per-push: a post-state invariant drifts with data and later migrations,
# not with each commit. migrations/** pushes also fire it.

on:
  schedule:
    # Tuesdays 13:00 UTC, a day after staging-drift.yml, so the two findings streams do not land together.
    - cron: '0 13 * * 2'
  push:
    branches: [dev]
    paths:
      - 'migrations/**'
      - 'scripts/gate_runner.py'
      - '.github/workflows/gate-invariants.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-26.04
    # Both legs run back to back in this one job, so the budget covers both plus setup; a cancelled leg is
    # a hole in the signal, not a finding and not a pass. If a clean run approaches 20 min, split PROD and
    # STAGING into separate jobs rather than raising this.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install python deps
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'psycopg[binary]' pyyaml \
            || python3 -m pip install --quiet --break-system-packages 'psycopg[binary]' pyyaml

      - name: Validate gate schema
        # Structural first, so a malformed gate file is reported as itself rather
        # than as a connection-shaped mystery. Hard-fails: exit 2.
        run: python3 scripts/gate_runner.py --all --env prod --validate-only

      # THE `status` OUTPUT IS A MEASUREMENT RECEIPT, NOT A RESULT. These steps have three outcomes:
      # findings (non-zero exit), measured, and UNKNOWN (secret unreadable: `gate_runner.py --receipt`
      # warns, writes status=unknown and exits 0). The receipt is POSITIVE: gate_runner writes
      # `measured` only after the gates ran, so any path that skips them reads as UNKNOWN in
      # `Surface findings`, never as a pass. UNKNOWN exits 0 on purpose: non-zero would be reported
      # as findings about a database that was never opened. Guarded by test_gate_runner.py
      # test_receipt_*.
      - name: Post-gate invariants — PROD
        id: prod
        continue-on-error: true
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          python3 scripts/gate_runner.py --all --env prod --phase post --continuous-only --receipt \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Post-gate invariants — STAGING
        id: staging
        continue-on-error: true
        env:
          NEON_STAGING_URL: ${{ secrets.NEON_STAGING_URL }}
        run: |
          set -euo pipefail
          python3 scripts/gate_runner.py --all --env staging --phase post --continuous-only --receipt \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Surface findings
        # The teeth are here, not on the two run steps: they keep `continue-on-error: true` so a PROD
        # finding does not abort the job before STAGING runs. This step aggregates both outcomes.
        #
        # Not a promote check: promote-gate requires `build-and-test` and `integration-tests` only, so a red
        # here makes a finding visible without blocking a promote.
        #
        # AUTHORING RULE this creates: the job also fires on `migrations/**` pushes, so a migration whose post
        # gates are pushed BEFORE it is applied reds here. Standing invariants must be SELF-ARMING, keyed on
        # the migration's own `schema_version` row so they are vacuously true until the apply
        # (migrations/v4-cachemissingrow-001/gates.yml shows the pattern). Apply-window-only receipts take
        # `continuous: false` instead.
        #
        # UNKNOWN is a third outcome and it fails: a leg that could not read its database exits 0, so only its
        # `status` receipt tells it apart (see the comment above the run steps). Exit 1 = invariants broken,
        # read the summary; exit 2 = nothing was measured, fix the secret.
        run: |
          set -euo pipefail
          findings=0
          unknown=0
          prod_status="${{ steps.prod.outputs.status }}"
          staging_status="${{ steps.staging.outputs.status }}"
          if [[ "${{ steps.prod.outcome }}" != "success" ]]; then
            echo "::error::PROD post-gate invariants reported findings — see the job summary."
            findings=1
          elif [[ "$prod_status" != "measured" ]]; then
            echo "::error::PROD post-gate invariants are UNKNOWN — the database was never read, so nothing was measured. This is not a pass."
            unknown=1
          fi
          if [[ "${{ steps.staging.outcome }}" != "success" ]]; then
            echo "::error::STAGING post-gate invariants reported findings — see the job summary."
            findings=1
          elif [[ "$staging_status" != "measured" ]]; then
            echo "::error::STAGING post-gate invariants are UNKNOWN — the database was never read, so nothing was measured. This is not a pass."
            unknown=1
          fi
          if [[ "$findings" -ne 0 ]]; then
            exit 1
          fi
          if [[ "$unknown" -ne 0 ]]; then
            exit 2
          fi
          echo "All continuous post-gate invariants hold on both environments."
