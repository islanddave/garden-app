name: Migration gate invariants

# OPS-GATERUNNER-001. Runs the POST-gates of already-applied migrations against
# live prod and staging as a continuous invariant check.
#
# WHY THIS EXISTS
# ---------------
# V4-EVENTSOURCE-001 applied cleanly. Its DDL landed, its schema_version rows
# were written, and every structural gate would have passed. What was wrong was
# the POST-STATE: the data backfill never ran, leaving event_log.source 100% NULL
# across 12,100 prod rows for weeks. Its own gates.yml already asserted the
# correct invariant. Nothing ever executed it.
#
# That is the exact class this job catches and that no apply-time check can: the
# apply was green, and the defect was only visible afterwards, by asking the
# database whether the invariant still holds.
#
# WHY POST-GATES ONLY, AND ONLY --continuous-only
# -----------------------------------------------
# PRE-gates assert the migration has NOT yet been applied ("pre_new_columns_absent",
# "pre_beefsteak_resolves_to_the_bad_number"). On an applied database they fail BY
# DESIGN — measured 2026-08-04: 38 of 109 prod pre-gates fail purely because the
# migrations succeeded. Running them here would be pure noise.
#
# Among post-gates, some are true only in the apply window and are legitimately
# invalidated later — v1-2a-2's "no flagged rows" (V4-FLAG-001 later shipped the
# flag feature; now 72 rows), v4-evtcascade-001's NOW() - INTERVAL '1 hour'
# freshness check, and the frozen view-column-count gates that each later view
# widen invalidates. Those carry `continuous: false` and are skipped here.
# --continuous-only is what keeps this job's red meaningful instead of permanent.
#
# WAS ADVISORY BY DESIGN — BLOCKING SINCE 2026-08-10
# --------------------------------------------------
# HISTORICAL, kept because the reasoning is why the flip had to wait rather than
# something to undo. This job used to exit 0 even on findings, matching
# staging-drift.yml and schema-audit.yml, because the corpus carried a stale-gate
# backlog (measured 2026-08-04: 18 prod post-gate failures, ~10 superseded-by-design
# rather than real; re-measured 2026-08-10: 27 across 16 migrations). Hard-failing
# before that backlog was annotated would have redded the build permanently and
# trained everyone to ignore this job — reproducing the original disease in a new form.
# The instruction was to flip once the backlog was triaged, and leaving it advisory
# forever would be a slow failure.
#
# The backlog is triaged: prod 27 -> 0 and staging 28 -> 0, every failure classified
# with evidence and no assertion weakened to get there. The job now FAILS on findings
# — see `Surface findings` for where the teeth are and why they are not on the two
# run steps.
#
# Scheduled rather than per-push: a post-state invariant drifts with DATA and
# with later migrations, not with each commit. Also fires on migrations/** pushes,
# the one commit-shaped signal that the invariants may have moved.

on:
  schedule:
    # Tuesdays 13:00 UTC — a day after staging-drift.yml so the two findings
    # streams do not land together and compete for attention.
    - cron: '0 13 * * 2'
  push:
    branches: [dev]
    paths:
      - 'migrations/**'
      - 'scripts/gate_runner.py'
      - '.github/workflows/gate-invariants.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install python deps
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'psycopg[binary]' pyyaml \
            || python3 -m pip install --quiet --break-system-packages 'psycopg[binary]' pyyaml

      - name: Validate gate schema
        # Structural first, so a malformed gate file is reported as itself rather
        # than as a connection-shaped mystery. Hard-fails: exit 2.
        run: python3 scripts/gate_runner.py --all --env prod --validate-only

      # THE `status` OUTPUT IS A MEASUREMENT RECEIPT, NOT A RESULT (added 2026-08-31,
      # BUG-GATESTAGINGVACUOUS-001). These two steps have three outcomes, not two, and until
      # this receipt existed the aggregate could only see two. An unreadable database takes the
      # early return below, exits 0, and `Surface findings` reads `outcome == success` — so a
      # leg that read NOTHING contributes a PASS, while the step's own warning text says the
      # correct reading is UNKNOWN. That is worse than a missing check: it manufactures a
      # positive result, and any later claim of "the migration gates are green" sourced from a
      # run that took this path is unsupported.
      #
      # STRUCTURAL, NOT OBSERVED — and the difference was checked rather than assumed. The
      # ledger row cites run 33434949499's STAGING leg as having logged the warning and exited
      # 0. It did not: that text appears in the log only inside the `##[group]Run` block, which
      # echoes the whole script verbatim. Both legs actually connected on that run (`SUMMARY
      # (staging): ... PASS=588`) and the red was PROD's real finding. The path is reachable
      # from any run where either secret is missing or unreadable, which is why it is closed
      # here rather than left for the run that does take it to be believed.
      #
      # Deliberately a POSITIVE receipt (`status=measured` written only after the runner has
      # actually returned) rather than a negative flag. A flag only covers the early return that
      # exists today; a receipt makes any future `exit 0` path that skips the runner read as
      # UNKNOWN by default, because it will not have written one. Fail-closed is the whole point.
      #
      # The early return still exits 0 on purpose. Exiting non-zero here would make the leg
      # indistinguishable from a real finding, and `Surface findings` would then report
      # "reported findings" about a database it never opened — trading a false pass for a false
      # accusation. The receipt is what separates the two.
      - name: Post-gate invariants — PROD
        id: prod
        continue-on-error: true
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${NEON_DATABASE_URL:-}" ]]; then
            echo "::warning::NEON_DATABASE_URL is not readable by this job — prod invariants UNKNOWN, not clean."
            echo "status=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/gate_runner.py --all --env prod --phase post --continuous-only \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "status=measured" >> "$GITHUB_OUTPUT"

      - name: Post-gate invariants — STAGING
        id: staging
        continue-on-error: true
        env:
          NEON_STAGING_URL: ${{ secrets.NEON_STAGING_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${NEON_STAGING_URL:-}" ]]; then
            echo "::warning::NEON_STAGING_URL is not readable by this job — staging invariants UNKNOWN, not clean."
            echo "status=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/gate_runner.py --all --env staging --phase post --continuous-only \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "status=measured" >> "$GITHUB_OUTPUT"

      - name: Surface findings
        # NOW BLOCKING — 2026-08-10. The backlog this job's header said to triage is triaged:
        # prod went 27 failing gates / 16 migrations -> 0, staging 28 / 20 -> 0, every failure
        # classified with evidence and not one assertion weakened to get there.
        #
        # WHY THE TEETH ARE HERE AND NOT ON THE TWO RUN STEPS ABOVE. They keep
        # `continue-on-error: true` deliberately. Flipping those would abort the job the moment PROD
        # reported a finding, and STAGING would never run — halving the signal exactly when
        # something is wrong. This step already aggregates both outcomes, so it is the correct place
        # to fail from. It previously computed `fail` and then never used it, which is why a job
        # whose log said `[FAIL] v4-cachemissingrow-001` on BOTH environments still reported success.
        #
        # BLAST RADIUS, checked before flipping: promote-gate.yml requires `build-and-test` and
        # `integration-tests` ONLY. This job is not among its required checks, so a red here does
        # NOT block a promote or a merge. It makes a finding VISIBLE — which is the entire point,
        # since the failure mode being fixed was findings hiding behind a green job.
        #
        # NEW AUTHORING REQUIREMENT this creates, and it must be honoured or the backlog returns:
        # this job also fires on `migrations/**` pushes, so a migration whose post gates are pushed
        # BEFORE it is applied will red here. Standing invariants must therefore be SELF-ARMING —
        # keyed on the migration's own `schema_version` row, so they are vacuously true until the
        # apply and asserting forever after. See migrations/v4-cachemissingrow-001/gates.yml for the
        # pattern and the reasoning. Apply-window-only receipts take `continuous: false` instead.
        #
        # UNKNOWN IS A THIRD OUTCOME AND IT FAILS (2026-08-31, BUG-GATESTAGINGVACUOUS-001). A leg
        # that could not read its database exits 0 and so still reports `outcome == success`; only
        # its `status` receipt tells the two apart. See the comment above the two run steps for why
        # the receipt is positive and why that early return is still allowed to exit 0. Distinct
        # exit codes because the two demand different responses: 1 = the invariants are broken, go
        # read the summary; 2 = nothing was measured, go fix the secret. Neither is a pass, and the
        # message says which so nobody has to guess from a red X.
        run: |
          set -euo pipefail
          findings=0
          unknown=0
          prod_status="${{ steps.prod.outputs.status }}"
          staging_status="${{ steps.staging.outputs.status }}"
          if [[ "${{ steps.prod.outcome }}" != "success" ]]; then
            echo "::error::PROD post-gate invariants reported findings — see the job summary."
            findings=1
          elif [[ "$prod_status" != "measured" ]]; then
            echo "::error::PROD post-gate invariants are UNKNOWN — the database was never read, so nothing was measured. This is not a pass."
            unknown=1
          fi
          if [[ "${{ steps.staging.outcome }}" != "success" ]]; then
            echo "::error::STAGING post-gate invariants reported findings — see the job summary."
            findings=1
          elif [[ "$staging_status" != "measured" ]]; then
            echo "::error::STAGING post-gate invariants are UNKNOWN — the database was never read, so nothing was measured. This is not a pass."
            unknown=1
          fi
          if [[ "$findings" -ne 0 ]]; then
            exit 1
          fi
          if [[ "$unknown" -ne 0 ]]; then
            exit 2
          fi
          echo "All continuous post-gate invariants hold on both environments."
