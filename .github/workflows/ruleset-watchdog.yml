name: Ruleset Drift Watchdog

# Defense-in-depth: asserts the main capability-gate ruleset (17227141) is intact and alerts on drift. Runs
# from the DEFAULT branch (main) on a schedule, so its own definition is capability-gated: an agent writing dev
# cannot alter it (dev->main is a Dave-approved gate). NOT load-bearing (the gate already blocks agent writes
# to main); this catches accidental or manual ruleset tampering. Verdict logic and its traps:
# scripts/ruleset-watchdog.py, tested by scripts/test_ruleset_watchdog.py.
#
# AUTH: a garden-bot App token minted per run (needs `administration: read` on the repo for the rulesets API),
# minted AFTER checkout and passed only to the script step. HISTORY_TOKEN (github.token, actions:read +
# checks:read) reads this workflow's own run annotations for the blind-streak escalation.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  assert-ruleset:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout garden-app
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Mint garden-bot token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.GARDEN_BOT_APP_ID }}
          private-key: ${{ secrets.GARDEN_BOT_PRIVATE_KEY }}

      - name: Assert main-capability-gate ruleset intact
        env:
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          HISTORY_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RULESET_ID: '17227141'
          BYPASS_APP_ID: '3951762'
          REQUIRED_RULES: 'pull_request non_fast_forward deletion update'
          # Mutation fingerprint: the ruleset's updated_at when an admin-capable read last verified it intact
          # (bypass = garden-bot 3951762 only, scope main). ANY ruleset edit bumps it. Re-pin ONLY together
          # with a deliberate, reviewed ruleset change; main reads DRIFT until a promote carries the new pin.
          EXPECT_UPDATED_AT: '2026-10-02T12:20:11.554-04:00'
        run: python3 scripts/ruleset-watchdog.py
