name: harvest-weight-ratchet (V4-HARVRATCHET-001)

# Propagates improved per-cultivar weight factors into stored harvest weights: a guarded re-run of
# 0c-backfill-basis over the calibration samples 0f-autocapture accumulates (the guards are in
# scripts/harvest-weight-ratchet.sh). Scheduled workflows fire only from main.
#
# WEEKLY, and after integrity-weekly: the input changes only when Dave weighs something, and a weekly
# move of a number he reads is one he can tie to an event.
#
# REPORT-ONLY ON SCHEDULE. Writing is an explicit workflow_dispatch with apply=true: an application moves
# stored totals Dave reads, so it is his decision, not something that happens on a Monday.
#
# ALERT SINK: a blocked run exits 1 (conclusion=failure), and the report artifact uses integrity-weekly.yml's
# report shape ({status, alerts[], warnings[], ...}) so the morning-brief collector can surface .alerts[].
#
# REPORTING IS SPLIT FROM ENFORCEMENT: the report step never fails the job, and a terminal `Enforce` step
# owns the red. A fail-closed guard whose verdict is the job's only signal makes "a factor needs your
# judgement" look like "the job is broken", and publication must not depend on `if: always()` surviving an edit.

on:
  schedule:
    - cron: '0 11 * * 1'   # Mondays 11:00 UTC = 07:00 ET, an hour after integrity-weekly
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the re-derived weights (default: report only)'
        type: boolean
        default: false
      max_total_drop_pct:
        description: 'Refuse a one-step total move larger than this percent'
        default: '25'

permissions:
  contents: read

concurrency:
  group: harvest-weight-ratchet
  cancel-in-progress: false

jobs:
  ratchet:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Produce the weekly report
        # No psql install step: the runner image ships a client on PATH (16 or 18), and psql, unlike
        # pg_dump/pg_restore, needs no major-version match with Neon's PG 17.
        #
        # THIS STEP NEVER FAILS THE JOB. It records the script's exit code for the Enforce step at the bottom.
        id: report
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MAX_TOTAL_DROP_PCT: ${{ github.event.inputs.max_total_drop_pct || '25' }}
          OUT: harvest-ratchet-report.json
          APPLY_INPUT: ${{ github.event.inputs.apply }}
        run: |
          set +e
          if [ "$APPLY_INPUT" = "true" ]; then
            bash scripts/harvest-weight-ratchet.sh --apply
          else
            bash scripts/harvest-weight-ratchet.sh
          fi
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarise
        if: always()
        env:
          APPLY_INPUT: ${{ github.event.inputs.apply }}
        run: |
          {
            echo "### V4-HARVRATCHET-001 — harvest weight ratchet"
            echo
            if [ -f harvest-ratchet-report.json ]; then
              # Lead with the verdict and the alert lines: a raw JSON blob is what a reader skips.
              python3 scripts/harvest_ratchet_verdict.py --markdown harvest-ratchet-report.json
              echo
              echo '```json'
              cat harvest-ratchet-report.json
              echo '```'
            else
              echo "_No report produced — the analysis query failed before writing one._"
            fi
            echo
            echo "Mode: **$([ "$APPLY_INPUT" = "true" ] && echo APPLY || echo 'REPORT ONLY')**"
            echo
            echo "A non-zero exit means the run was BLOCKED and nothing was written — either an"
            echo "unreviewed outlier among the factors the resolver actually uses, or a one-step"
            echo "total move beyond the limit. Both want a human decision, not a retry."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: harvest-ratchet-report
          path: harvest-ratchet-report.json
          retention-days: 90

      - name: Enforce the ratchet guards
        # The red lives here, AFTER the report has been summarised and uploaded. Exit 1 (BLOCKED, a decision
        # is waiting) and exit 2 (ERROR, nothing measured) both flatten to conclusion=failure, so the
        # ::error:: title carries the distinction onto the run page.
        if: always()
        env:
          RC: ${{ steps.report.outputs.rc }}
        run: |
          case "$RC" in
            0)
              echo "OK — nothing blocking."
              ;;
            1)
              echo "::error title=Ratchet BLOCKED — a decision is waiting::Unreviewed outlier factor(s) or an oversized one-step total move. Nothing was written. See the run summary and the harvest-ratchet-report artifact (.alerts[])."
              exit 1
              ;;
            *)
              echo "::error title=Ratchet ERROR — the job could not measure anything::The analysis or the report writer failed (rc=$RC); this is not a data finding. See the log."
              exit 1
              ;;
          esac
