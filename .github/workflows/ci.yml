name: CI — Build and Unit Tests

# Gate on PRs targeting any protected branch.
# Must pass before merge to dev, staging, or main is permitted.
# `push: [dev]` trigger removed 2026-05-01 (pipeline hardening sprint Step 1)
# to avoid double-firing once enhanced branch protection lands on main/staging.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # --- Release-version guard (v3.81.0 tag-burn regression) ---------------
      # Placed BEFORE setup-node/npm ci on purpose: it fails in seconds and
      # needs no node toolchain. Cheap fail-fast on a cheap-to-detect defect.
      - name: Fetch origin/main for the release-version guard
        # The checkout above has no `with:` block, so it is fetch-depth:1 and
        # single-branch — origin/main is otherwise unreachable. Do NOT switch it
        # to fetch-depth: 0; 112 releases of history on every CI run is real cost
        # for data this guard does not need. It reads exactly one blob
        # (main:package.json) plus a tree diff, both of which a depth-1 fetch
        # satisfies. Tag NAMES come from `git ls-remote` inside the script (one
        # network call, no objects downloaded) rather than a --tags fetch.
        # actions/checkout leaves a credential helper configured, so the job's
        # GITHUB_TOKEN authenticates; `permissions: contents: read` suffices.
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Release-version guard
        # Hard-fails (exit 1) on: non-semver package.json version, a version that
        # promote-gate's snap_version regex would reject, releases.json that is
        # malformed / mis-ordered / duplicated / head-mismatched, a version
        # BELOW main, or a bump onto an already-consumed v* tag. Advisory-only
        # (::warning::) when dev carries unreleased release-relevant work with no
        # bump. Exit 2 = origin/main or the tag list was unreadable — never a
        # silent pass. Waivers: scripts/release-version-allowlist.json.
        # NOTE: the keystone check lives in promote-gate.yml (snap_version vs
        # package.json@dev_sha) — this job cannot see the dispatch input.
        run: python3 scripts/check-release-version.py

      - name: Python script tests (pytest)
        # Retroactively covers the previously-unrun scripts/test_*.py suites
        # (snap, revert-to, restore-verify, verify-deploy) as well as the guard's
        # own tests. requests+boto3 are import-time deps of snap.py/revert-to.py.
        run: |
          set -euo pipefail
          # Plain form is proven on these runners (promote-gate.yml "Install python
          # deps"); the fallback covers a PEP-668 externally-managed image.
          python3 -m pip install --quiet pytest requests boto3 pyyaml \
            || python3 -m pip install --quiet --break-system-packages pytest requests boto3 pyyaml
          python3 -m pytest -q scripts/test_*.py

      - name: Migration gate schema validation (OPS-GATERUNNER-001)
        # Every migrations/*/gates.yml must PARSE and satisfy the strict gate
        # schema. No database is touched — this is a pure structural check, so it
        # needs no secrets and runs on every push.
        #
        # WHY IT IS UNCONDITIONAL: for months these gate files were runbook prose
        # that nothing executed, and V4-EVENTSOURCE-001's backfill shipped unrun
        # with two post-gates that would have caught it instantly. A gate file the
        # runner cannot parse is exactly as inert as those were — so an unparseable
        # or mis-keyed gate file is a BUILD FAILURE (exit 2), never a skip.
        # Observed drift this is designed to catch: two in-flight migrations
        # authored on 2026-08-04 used `pre_gates:`/`post_gates:` and a `mid:`
        # phase instead of the canonical pre/sweep/post.
        run: python3 scripts/gate_runner.py --all --env prod --validate-only

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (frozen primitives)
        # DESIGNSYS Pass A (V4-DESIGNSYS-001): scoped no-raw-design-tokens guard.
        # Fails the build if a guarded primitive reintroduces a raw hex color, raw
        # border-radius, raw padding/margin, raw font-size or a raw emoji glyph (must use
        # lib/constants.js P / forms/formStyles.js T / lib/iconRegistry.js).
        # Scope is a GLOB over components/forms/** plus the non-form primitives, so a new
        # primitive is guarded by default; per-class deferrals are a dated register in
        # eslint.config.js. Raw hex is not deferrable on any file.
        run: npm run lint

      - name: Garden-render golden (V4-GARDENIA-001 / DESIGNSYS §7)
        # GroupByControl's regression oracle, per contract §3: the legacy by-project render
        # (buildDisplayList + buildGardenTree — the `none` path) must still reproduce parity
        # hash 8a3d78f098e55ff2 against the 61-project/171-planting prod fixture.
        #
        # Unwired until 2026-08-26 because it was unwirable: the harness and golden lived in
        # the gardening-docs repo and the harness hardcoded a Cowork sandbox path, so this CI
        # could not reach it — while projectTree.js carried a comment asserting the code
        # "remain[s] golden-gated" to that hash. Now vendored into scripts/parity/ with a
        # real check mode. Verified non-vacuous: reversing the alpha sort trips 3 drifts.
        run: npm run parity:garden-render

      - name: Daily-plan parity goldens (G-PARITY)
        # 21 frozen scenarios replayed through the current daily-plan rule engine and diffed
        # against tests/parity/daily-plan/golden/*.json. The §13 G-PARITY exit gate for the
        # system-of-record cutover: it is the baseline the refactor is measured against, so a
        # silent engine change now would move the thing the cutover is diffed to.
        # Defined in package.json since the P0 backbone work and invoked by nothing until now.
        run: npm run parity:golden

      - name: Service-worker cache-key mirror
        # public/sw.js is a hand-maintained MIRROR of src/lib/swCacheKeys.js — the service
        # worker cannot import from src/. Fails if the two byte-diverge, which is the shape
        # where the app and its offline cache disagree about what is cached under which key.
        # Defined in package.json and invoked by nothing until now.
        run: npm run gate:sw-mirror

      # ── The real-Chrome layout gates (OPS-LAYOUTGATESUNWIRED-001) ───────────────────────
      # The WebSocket blocker that kept these unwired is FIXED, not worked around. The gates
      # attached over a bare global WebSocket, which this job's pinned node-version '20.19.0'
      # does not have (measured: `npx node@20.19.0 -e "typeof WebSocket"` -> undefined, and the
      # gate exited 1 with "WebSocket is not defined"). scripts/layout-gate/cdp-socket.mjs now
      # prefers the global and falls back to `ws`, which is a DECLARED devDependency rather than
      # the jsdom transitive it used to be reachable as. Both gates were then re-run under a real
      # Node 20.19.0 and PASS with measurements identical to the Node 26 run.
      #
      # The CI Node version was deliberately NOT bumped to get a global WebSocket: package.json
      # declares "engines": { "node": "20.x" }, so a bump would run the whole suite and the build
      # outside the declared engine range to fix a two-line transport problem.
      #
      # NO continue-on-error on either step, by policy. This repo already carries deploy steps
      # that report success when they fail; a pseudo-gate here would be worse than the honest gap
      # it replaces, because gate:save-band's absence from CI is precisely why a weigh-in keypad
      # row that silently committed a harvest shipped and survived two releases.
      #
      # STILL NOT WIRED: gate:save-band-stability. Its WebSocket blocker is the same and the same
      # one-line import fixes it, but it drives four full harvest entries and was out of scope for
      # the lane that wired these two. It is one import and one step away.
      - name: Resolve Chrome for the layout gates
        # The gates drive REAL Chrome over CDP and honour CHROME_PATH, defaulting to a macOS path
        # that does not exist here. This RESOLVES the runner's browser rather than assuming it: if
        # the image ever stops shipping Chrome, this step FAILS the build. It must never degrade to
        # "no browser, so nothing to check" — a layout gate that silently skips is the vacuous
        # guard this whole directory exists to be the opposite of.
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BIN" ]; then
            echo "::error::No Chrome on this runner - the layout gates cannot run and must not be skipped."
            exit 1
          fi
          echo "CHROME_PATH=$BIN" >> "$GITHUB_ENV"
          echo "layout gates will drive $BIN"
          "$BIN" --version

      - name: Weigh-in Save-band clearance (BUG-FRAMEPADOCCLUDE-001)
        # Real Chrome at a TRUE 390x500, four consecutive weigh-in entries. Asserts every bottom-row
        # weight key clears Save by SAVE_BAND_MIN_CLEARANCE_PX and that each key hit-tests to itself,
        # on whichever arm rendered (frame or the legacy sticky band) — an arm it cannot identify
        # FAILS. This is the gate whose absence let a keypad row commit the harvest under the thumb.
        # Verified non-vacuous: tightening framePadGapPx by 8px drops the gap to 13px and the gate
        # fails 20+ named key/entry pairs with exit 1.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:save-band

      - name: Log-chooser clearance and tap floor (BUG-LOGBANDOCCLUDE-001)
        # Real Chrome at 390x844 and 390x667 (phone at rest, and with the keyboard up — the tighter
        # one). Asserts the plant chooser clears the sticky Save band, that probes across its width
        # actually hit the chooser rather than the band, and — as a census, not a named list —
        # that no visible interactive control on /log is under the T.tapMinHeight tap floor.
        # Verified non-vacuous: dropping inputChrome's minHeight to 30 makes it fail on the named
        # control ("Event date" is 41px tall) at both viewports with exit 1.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:log-chooser

      - name: Photo-tier payload budget (BUG-TIERLESSPHOTOS-001)
        # THE ONLY THING IN THIS REPO THAT PRODUCES A REAL PAYLOAD NUMBER, and until now it was
        # wired to nothing — `rg "phototier-bytes"` returned only the file's own self-references.
        # vitest can prove which URL a surface ASKED for and can never prove a byte moved, because
        # jsdom never loads an image. This drives real Chrome at Dave's 390x844 @ dpr 2.625 and reads
        # CDP Network.loadingFinished encodedDataLength — the transferred size on the wire.
        #
        # It could not simply be added as it stood: it opened its CDP session with a bare global
        # WebSocket, which node-version '20.19.0' does not have, so it would have thrown at attach()
        # after paying for a Vite boot and a Chrome launch. Same blocker, same one-line fix
        # (cdp-socket.mjs) as the two gates above.
        #
        # A BUDGET, NOT A REPORT. Without --max-bytes the script prints a number and fails only on
        # instrument faults, which would be a step that cannot fail on the thing it measures — the
        # `gate:` script passes the ceiling. Verified non-vacuous by running the BEFORE arm
        # (`npm run phototier-bytes:before`, --tier none, byte-for-byte what the pre-fix code
        # requested): 82,957,060 B against the 4,000,000 B ceiling, exit 1, naming 20 of 20 requests
        # as full originals. The passing arm measured 3,542,820 B. NO continue-on-error, per the
        # policy note above.
        #
        # Pillow is the fixture generator's only dependency and is not on the runner image. Plain
        # form first, --break-system-packages for a PEP-668 image — same shape as the pytest step.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow \
            || python3 -m pip install --quiet --break-system-packages pillow
          npm run gate:phototier-bytes

      - name: Inventory list tap floor and row integrity (HG-4.2)
        # Real Chrome at 390x844. The repo's ONLY gate on SC 2.5.8: every control the redesign owns
        # must render >=44x44 AS RENDERED, not merely be authored that way — and 44 is not a number
        # anyone here chose, it is T.tapMinHeight and the success criterion. Also asserts each control
        # hit-tests to itself (a control probed as occluded fails, and one never probed fails too:
        # "not measured" is not "not occluded"), that no row wraps or overflows right at the fixture's
        # worst-case 44-char name, and that the document does not scroll sideways. A non-vacuity floor
        # of 8 rows / 6 sections / >=12 controls is asserted before any of it.
        #
        # It sits at ZERO margin: the smallest measured side is exactly 44px against a 44px floor, so
        # any shrink at all reds it. Verified non-vacuous: T.tapMinHeight 44 -> 40 fails with exit 1
        # naming six controls ("Add seeds" 99.8x42, "Sow now" 93.5x42, "+ Add" 65.8x40, and the three
        # 102.7x40 filter selects). Three shallower mutations SURVIVED and are worth knowing about —
        # an inline height:40 on the selects is backstopped by selectChrome's own minHeight, and the
        # quantity steppers are in the probe's selector list but are not rendered by this fixture, so
        # a regression confined to them would not be caught here.
        #
        # Both CI blockers fixed with this step: the bare global WebSocket (node 20.19.0 has none —
        # cdp-socket.mjs, same one-line fix as its siblings; measured here by running it with the
        # global deleted, which reds the still-unfixed iconwire3 with "WebSocket is not defined" and
        # passes this one with identical numbers), and the absolute /Users/davenichols/... --out
        # default that would have thrown in mkdirSync after every assertion had already passed.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:inventory-list

      - name: Icon wiring slice 4 — five rewired surfaces (V4-ICON-001)
        # Real Chrome at 390x844 across overwinter / inventory-type / water-depth / life-story /
        # notify. Asserts ZERO pictographic characters survive inside the rewired subtree, and that
        # every mark renders non-zero, checkVisibility()s true, fits the 390px viewport, is CONTAINED
        # by the card/chip/row it labels, and has text in an ancestor so nothing reads by mark alone.
        # `emoji.length === 0` needs no calibration: zero is the only correct value for this lane, so
        # unlike a chosen ceiling it cannot drift into vacuity. A per-surface minIcons floor (4/2/12/
        # 5/3) is asserted BEFORE any of it, because "every mark passes" is true of a page with none.
        #
        # It could not simply be added as it stood. Its WebSocket blocker was already fixed, but it
        # defaulted its --outdir to /Users/davenichols/... and then mkdirSync'd it; /Users does not
        # exist on this runner and cannot be created at /, so it threw INSIDE the try and surfaced as
        # fail('gate could not complete') -> exit 1, AFTER the Vite boot, the Chrome launch and all
        # five surfaces had already passed. A false red on the by-product path. The npm script now
        # passes a repo-relative --outdir (gitignored).
        #
        # Verified non-vacuous: putting one 🌱 back into WaterDepthChips' depth labels reds it with
        # exit 1 on water-depth, naming the character. NO continue-on-error, per the policy note above.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:iconwire4

      - name: Icon optical-weight golden (V4-ICON-001)
        # V101 §14 pre-flight gate: each migrated SVG glyph's live-area ink-coverage must
        # stay within +/-tolerance of its approved baseline (scripts/icon-ci/icon-golden-baseline.json).
        run: npm run icon:golden

      - name: Icon region-seam (V4-ICON-001)
        # V101 §14: color-candidate multi-region glyphs paint every region with no interior
        # seam holes (backs the zero-geometry-redraw color-pass promise).
        run: npm run icon:seam

      - name: Icon pair distinctness (V4-GERMVSTRANSPLANT-001)
        # Glyphs read SIDE BY SIDE must not collapse into each other. Both gates above measure a
        # glyph alone, so neither could see that event.germination and event.transplant were one
        # drawing at two scales. Masks are scale-normalised before comparison — raw pixel overlap
        # scored the shipped defect (0.402) as MORE distinct than a known-good pair (0.367), because
        # a size change moves pixels while reading as the same shape.
        run: npm run icon:distinct

      - name: Build (CI — placeholder env vars)
        # VITE_ vars are inlined at build time as string literals.
        # Placeholder values allow build to succeed without real infrastructure.
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          VITE_API_PROJECTS:          https://ci-placeholder.lambda-url.us-east-1.on.aws/
          VITE_API_PLANTS:            https://ci-placeholder.lambda-url.us-east-1.on.aws/
          VITE_API_LOCATIONS:         https://ci-placeholder.lambda-url.us-east-1.on.aws/
          VITE_API_EVENTS:            https://ci-placeholder.lambda-url.us-east-1.on.aws/
          VITE_API_FAVORITES:         https://ci-placeholder.lambda-url.us-east-1.on.aws/
          VITE_API_PHOTOS:            https://ci-placeholder.lambda-url.us-east-1.on.aws/
          VITE_API_DASHBOARD:         https://ci-placeholder.lambda-url.us-east-1.on.aws/

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo 'ERROR: dist/index.html missing'; exit 1; }

      - name: Harvest-window chunk split (V4-RIPENESSCUES-001)
        # THE ONLY DETECTOR for the inert-payload class, and until now it was wired to nothing.
        # The colour-window feature shipped DEAD in v4.9.x — resolver imported, nothing called it,
        # ~110KB gzip of JSON riding the entry bundle to every user, all tests green. vitest cannot
        # catch this class at all: it asserts MODULES, and resolves the import itself at test time,
        # so it never observes the real chunk graph. Only a build-artifact check can. A mutation
        # that recreated the bug kept all 127 unit tests passing.
        #
        # Asserts against the artifact the step above just built (SKIP_BUILD=1 — verify THIS dist/,
        # not a second differently-configured build): exactly one hashed chunk carries the dataset
        # marker, and it is NOT the entry chunk. Fails the build (exit 1) if a static
        # `import { resolveHarvestWindow }` is reintroduced at/above CropCard, if the dataset
        # vanishes from the bundle entirely, or if the marker leaks into multiple chunks.
        #
        # Home is ci.yml on purpose: this is deterministic from source, so it reaches the same
        # verdict here as it would in deploy.yml — but here it fails BEFORE the code lands on dev,
        # rather than mid-deploy after main has already fast-forwarded.
        env:
          SKIP_BUILD: '1'
        run: bash scripts/verify-window-chunk.sh

      - name: Event-types drift guard
        # V3-EVENT-008: fails the build if lambda/events/eventTypes.generated.js is
        # stale vs the canonical src/lib/eventTypes.js (regenerate to temp + byte-diff).
        # Required (not advisory): the deployed Lambda cannot import src/lib/ at runtime,
        # so a stale generated copy would silently diverge the batch allowlist from the UI.
        run: npm run check:event-types

      - name: Coverage ratchet enforcement
        # Fails the build if vitest.config.ts thresholds fall below the
        # calendar-due target in coverage-ratchet.json.
        # B2 from pipeline-consolidation-plan-20260501.md (boss VP add).
        run: python3 scripts/check-coverage-ratchet.py

      - name: Run unit tests with coverage
        run: npm test
        # vitest exits non-zero if coverage thresholds (in vitest.config.ts) not met.
        # Path A baseline: thresholds at 0%; schedule ratchets up per coverage-ratchet.json.

      - name: Unit tests under America/New_York TZ (date-fragility guard)
        # Wave 0 / WS-B M2: the run above executes under UTC (GHA default), which hid a
        # class of TZ-fragile date assertions that only fail in a UTC-negative zone like
        # the app's own EDT/EST (plantingMaturity ageDays, Collection "Seen" caption).
        # Re-run the suite under the app's real timezone so that class fails CI, not prod.
        run: npx vitest run --no-coverage
        env:
          TZ: America/New_York

      - name: Coverage ratchet — measured floor (WS-B M4)
        # The pre-test ratchet step above compares only the CONFIG thresholds to
        # active_target. This reads ACTUAL measured coverage (coverage/coverage-summary.json,
        # emitted by the json-summary reporter) and fails if it drops below active_target,
        # wiring the ratchet to real coverage so advancing active_target (a Dave-gated
        # milestone decision) immediately protects it. No-op while active_target is 0.
        run: python3 scripts/check-coverage-ratchet.py --measured

      - name: Dependency audit (blocking on moderate, WS-B M6)
        # Fail the build on any prod-dependency MODERATE+ advisory EXCEPT documented, dated
        # waivers in scripts/audit-allowlist.json (each a justified non-applicability note).
        # Replaces the bare `npm audit --omit=dev --audit-level=moderate`. The js-cookie high
        # (→ Clerk 6.12.7) and the old react-router moderates (→ react-router-dom 7.18.1) stay
        # remediated. Currently WAIVED: GHSA-qwww-vcr4-c8h2 (react-router RSC-mode CSRF —
        # non-applicable to this client SPA / no RSC; no react-router-dom fix line yet).
        # Dave-approved 2026-07-24. Dev-only advisories stay excluded by --omit=dev.
        run: python3 scripts/audit-gate.py

