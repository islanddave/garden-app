name: CI — Build and Unit Tests

# Runs on every push to dev and on PRs targeting dev, staging or main.
# The dev push's run is the one a promote reads: scripts/promote-preflight.py counts `push` and
# `workflow_dispatch` runs on the SHA and never a `pull_request` run.
#
# THE SHAPE. Twelve legs and one aggregator job whose id is `build-and-test`. promote-gate.yml reads that job, by
# that id, through scripts/promote-preflight.py; it is green only when every leg reported and every one succeeded.
# The UTC coverage pass is three shards and a merge leg, the America/New_York pass two shards.
#   - NO workflow_dispatch here, ever. The preflight counts a dispatched run on any branch at the SHA, so a run
#     dispatched red on purpose at dev's head would leave that commit unpromotable.
#   - A step added to, edited in or removed from a leg regenerates scripts/ci-step-manifest.json
#     (python3 scripts/gen-ci-step-manifest.py) in the same commit. scripts/test_ci_legs.py holds this file to its
#     shape and scripts/test_ci_step_manifest.py holds it to the manifest; both run in the `pytest` leg.
#   - NO continue-on-error, no `if:` on a leg or a step, no matrix, no job-level env: a leg that fails under
#     continue-on-error reads `success` in `needs`, and a skipped leg is not a pass.
#   - What a step hands to a later one stays inside its leg; each leg repeats the setup it needs (checkout,
#     setup-node, npm ci, Chrome, the origin/main fetch, shfmt), and HANDOFFS in scripts/test_ci_legs.py lists the
#     hand-offs. ONE exception: the three coverage shards hand their blobs to the merge leg `unit-utc-cov` as
#     artifacts, and that leg is the only one with `needs` (no `if:`: a red shard makes it `skipped`, and the
#     aggregator reads that as red).
#   - The unit steps run vitest.config.ts as it is: two projects, the server-side test files in `node` and the rest
#     under jsdom, in every run.
#   - That a red leg reds the aggregate is proven by running the aggregator's body against `needs` fixtures
#     (test_aggregator_fails_when_any_leg_did_not_succeed in scripts/test_ci_legs.py); nothing forces a leg red here.
#
# READING A RED `build-and-test`. Read the RUN's conclusion and the legs before the aggregator.
#   - The run concluded `cancelled`: a newer push superseded it. The aggregator runs under always(), reads its
#     cancelled legs and shows `failure`. Nothing to chase.
#   - A leg red at a test, a gate or a ratchet: a red of the PRODUCT. Fix forward or re-run; never a rollback.
#   - Every leg green and `build-and-test` not: the aggregator got no runner (the job has no steps and reads
#     `cancelled`; its 5-minute timeout counts only a running job). `gh run rerun <run id> --failed` re-runs it
#     alone, then ask the preflight again.
#
# ROLLBACK. The leg split does not revert cleanly (it edited files this tree no longer has), so a red of SHAPE (a leg
# red in a step it only repeats, red again on a re-run; the aggregator red over green legs twice; a leg red on
# pull_request only) is fixed forward, as a gate-file push with the regression-impact review first.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no browser and no test runner, in the order the serial job ran it. ~1 min.
  static:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Release-version guard: BEFORE setup-node/npm ci on purpose, it fails in seconds and needs no node.
      - name: Fetch origin/main for the release-version guard
        # The checkout above is fetch-depth 1 and single-branch, so origin/main is otherwise unreachable. Do NOT
        # switch it to fetch-depth: 0: the guard reads one blob (main:package.json) plus a tree diff, and tag
        # NAMES come from `git ls-remote` inside the script. The checkout's credential helper authenticates with
        # the job's GITHUB_TOKEN; `contents: read` suffices.
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Release-version guard
        # Exit 2 = origin/main or the tag list was unreadable, never a silent pass. Waivers:
        # scripts/release-version-allowlist.json. The keystone check (snap_version vs package.json@dev_sha) is in
        # promote-gate.yml: this job cannot see the dispatch input.
        run: python3 scripts/check-release-version.py

      - name: Workflow lint (actionlint + shellcheck, pinned and checksum-verified)
        # A workflow change governs the promote that ships it when dispatched from dev, so without this the first
        # real run of an edited promote-gate.yml would be the ship itself. Lints every workflow on every push:
        # expressions, contexts, needs/outputs wiring, action inputs, and each run: block through shellcheck.
        #
        # PINNED and CHECKSUM-VERIFIED, because this is a required promote check: a floating "latest" could start
        # redding promotes with no change in this repo. The hashes are each release's published digest; to bump,
        # change a version AND its hash together.
        #
        # SHELLCHECK_OPTS --severity=warning: info/style findings (SC2086 quoting, SC2129 grouping) exist
        # in several workflows and are not defects; warnings and
        # errors, which include a script that does not parse, are what this is for. -pyflakes= disables the
        # optional python checker so the result does not depend on the runner image. False positives are ignored
        # per file in .github/actionlint.yaml, each with its evidence.
        #
        # NON-VACUITY. Two ways for this lint to go quiet: -shellcheck= naming a missing file makes actionlint
        # DISABLE shellcheck and still exit 0 (only -verbose says so), and a blanket ignore in
        # .github/actionlint.yaml silences every finding. So first the same binaries, flags and config must REJECT
        # a known-bad fixture with one actionlint finding ([job-needs]) and one shellcheck warning (SC2034); then
        # the real run must cover every workflow file on disk with
        # shellcheck enabled, and says how many.
        #
        # BLIND SPOT, by construction: an exit status read after errexit already acted (`cmd` then `RC=$?`). The
        # linter reports nothing on it at ANY severity, because the body carries no -e (the runner adds it).
        # scripts/test_workflow_steps.py guards that class instead (a scan of every run: body).
        #
        # DOWNLOAD RETRIES: --retry alone does not retry a refused connection, a reset or an empty reply (curl
        # 7/56/52); --retry-connrefused and --retry-all-errors (curl >= 7.71) add them, still at most 3 times.
        # The sha256 checks below still decide what may run, so a retried download cannot weaken them.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          SHELLCHECK_OPTS: --severity=warning
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/wflint"
          mkdir -p "$T"
          curl -sSfL --retry 3 --retry-connrefused --retry-all-errors -o "$T/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 --retry-connrefused --retry-all-errors -o "$T/shellcheck.tgz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $T/actionlint.tgz" | sha256sum -c -
          echo "${SHELLCHECK_SHA256}  $T/shellcheck.tgz" | sha256sum -c -
          tar -xzf "$T/actionlint.tgz" -C "$T" actionlint
          tar -xzf "$T/shellcheck.tgz" -C "$T" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          "$T/actionlint" -version
          SC="$T/shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          # Canary: rejected by actionlint AND by shellcheck, under this repo's own config, or nothing below counts.
          mkdir -p "$T/canary/.github/workflows"
          [ ! -f .github/actionlint.yaml ] || cp .github/actionlint.yaml "$T/canary/.github/"
          git -C "$T/canary" init -q
          cat > "$T/canary/.github/workflows/canary.yml" <<'CANARY'
          on: push
          jobs:
            canary:
              needs: no-such-job
              runs-on: ubuntu-latest
              steps:
                - run: unused=1
          CANARY
          RC=0
          (cd "$T/canary" && "$T/actionlint" -oneline -shellcheck="$SC" -pyflakes=) > "$T/canary.out" 2>&1 || RC=$?
          if [ "$RC" -ne 1 ] || ! grep -q '\[job-needs\]' "$T/canary.out" || ! grep -q 'SC2034:warning' "$T/canary.out"; then
            cat "$T/canary.out"
            echo "::error title=Workflow lint canary::the lint did not reject its known-bad fixture (exit $RC; want 1 with a [job-needs] and an SC2034 warning). A clean run would verify nothing."
            exit 1
          fi
          RC=0
          "$T/actionlint" -color -verbose -shellcheck="$SC" -pyflakes= 2> "$T/lint.err" || RC=$?
          if [ "$RC" -ne 0 ]; then
            [ "$RC" -eq 1 ] || cat "$T/lint.err"  # 1 = findings, printed above; anything else is fatal
            exit "$RC"
          fi
          LINTED=$(awk '/Linting [0-9]+ files/ { for (i = 1; i < NF; i++) if ($i == "Linting") { print $(i + 1); exit } }' "$T/lint.err")
          ONDISK=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')
          if [ "${LINTED:-0}" -ne "$ONDISK" ] || grep -q 'Rule "shellcheck" was disabled' "$T/lint.err"; then
            cat "$T/lint.err"
            echo "::error title=Workflow lint vacuous::linted ${LINTED:-0} of $ONDISK workflow files, or shellcheck was disabled (verbose log above)."
            exit 1
          fi
          echo "Workflow lint: $LINTED of $ONDISK workflow files clean under actionlint + shellcheck; the canary was rejected as required."

      - name: Install PyYAML for the migration gate validation
        # scripts/gate_runner.py refuses to validate without PyYAML, and pytest (which installs it) runs in
        # another leg. Plain install, then --break-system-packages for a PEP-668 image.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml \
            || python3 -m pip install --quiet --break-system-packages pyyaml

      - name: Migration gate schema validation (OPS-GATERUNNER-001)
        # Every migrations/*/gates.yml must PARSE and satisfy the strict gate schema. No database is touched, so
        # it needs no secrets and runs on every push. A gate file the runner cannot parse is as inert as no gate,
        # so an unparseable or mis-keyed one (e.g. `pre_gates:` or a `mid:` phase instead of pre/sweep/post) is a
        # BUILD FAILURE (exit 2), never a skip.
        run: python3 scripts/gate_runner.py --all --env prod --validate-only

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - name: Dependency manifest re-resolves (strict peers)
        # BEFORE npm ci on purpose: node_modules must NOT exist yet, or npm takes a satisfied-tree fast path and
        # the check goes vacuous. `npm ci` replays package-lock.json and never re-solves, so a package.json that
        # CANNOT resolve (every `npm install` dying ERESOLVE) is invisible to every other job.
        # NO --legacy-peer-deps here: that flag is the blindfold this step removes. If this ever needs it to pass,
        # the manifest is broken: fix the manifest, do not add the flag. --dry-run --package-lock-only writes
        # nothing; it only re-solves the graph.
        run: npm install --dry-run --package-lock-only

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (frozen primitives)
        # The scoped no-raw-design-tokens guard (eslint.config.js) plus madge's import-cycle check.
        run: npm run lint

      - name: Today-gate fixture privacy preflight (V5-TODAYSHAPE-001)
        # The Today layout gate's fixtures are dumped from prod (npm run todaymeasure:dump writes UNSCRUBBED raw
        # dumps next to them, gitignored) and this repo is public. The preflight refuses Clerk subs, live keys,
        # JWTs, Postgres URLs, emails and real coordinates in the tracked fixtures; its self-test first proves
        # every matcher fires on a known positive. The gate itself runs with the real-Chrome gates ("Today V2
        # contract, instrument and self-test"), which runs this preflight again as its step 0.
        run: npm run gate:today-shape:preflight:self-test && npm run gate:today-shape:preflight

      - name: Garden-render golden (V4-GARDENIA-001 / DESIGNSYS §7)
        # GroupByControl's regression oracle: the legacy by-project render (buildDisplayList + buildGardenTree,
        # the `none` path) must still reproduce parity hash 8a3d78f098e55ff2 against the prod fixture in
        # scripts/parity/. projectTree.js relies on this gate.
        run: npm run parity:garden-render

      - name: Daily-plan parity goldens (G-PARITY)
        # Frozen scenarios replayed through the current daily-plan rule engine and diffed against
        # tests/parity/daily-plan/golden/*.json: the baseline an engine refactor is measured against, so a silent
        # engine change would move it.
        run: npm run parity:golden

      - name: Service-worker cache-key mirror
        # public/sw.js is a hand-maintained MIRROR of src/lib/swCacheKeys.js (the service worker cannot import
        # from src/). Fails if the two diverge: the app and its offline cache would disagree about which key
        # holds what.
        run: npm run gate:sw-mirror

      - name: Icon optical-weight golden (V4-ICON-001)
        # Each migrated SVG glyph's live-area ink coverage must stay within tolerance of its approved baseline
        # (scripts/icon-ci/icon-golden-baseline.json).
        run: npm run icon:golden

      - name: Icon region-seam (V4-ICON-001)
        # Colour-candidate multi-region glyphs paint every region with no interior seam holes, so a colour pass
        # needs no geometry redraw.
        run: npm run icon:seam

      - name: Icon pair distinctness (V4-GERMVSTRANSPLANT-001)
        # Glyphs read SIDE BY SIDE must not collapse into each other; both gates above measure a glyph alone.
        # Masks are scale-normalised before comparison: raw pixel overlap scores one drawing at two scales as
        # distinct, because a size change moves pixels while reading as the same shape.
        run: npm run icon:distinct

      - name: Build (CI — placeholder env vars)
        # VITE_ vars are inlined at build time; placeholders let the build succeed without real infrastructure.
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          VITE_API_PROJECTS:          https://ci-placeholder.lambda-url.us-east-1.on.aws/
          VITE_API_PLANTS:            https://ci-placeholder.lambda-url.us-east-1.on.aws/
          VITE_API_LOCATIONS:         https://ci-placeholder.lambda-url.us-east-1.on.aws/
          VITE_API_EVENTS:            https://ci-placeholder.lambda-url.us-east-1.on.aws/
          VITE_API_FAVORITES:         https://ci-placeholder.lambda-url.us-east-1.on.aws/
          VITE_API_PHOTOS:            https://ci-placeholder.lambda-url.us-east-1.on.aws/
          VITE_API_DASHBOARD:         https://ci-placeholder.lambda-url.us-east-1.on.aws/

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo 'ERROR: dist/index.html missing'; exit 1; }

      - name: Harvest-window chunk split (V4-RIPENESSCUES-001)
        # The ONLY detector for the inert-payload class (a dataset riding the entry bundle to every user). vitest
        # cannot catch it: it asserts MODULES and resolves imports itself, so it never sees the real chunk graph.
        # Asserts against the dist/ the step above built (SKIP_BUILD=1, not a second differently-configured
        # build): exactly one hashed chunk carries the dataset marker, and it is NOT the entry chunk. Fails if a
        # static `import { resolveHarvestWindow }` returns at/above CropCard, if the dataset vanishes from the
        # bundle, or if the marker leaks into several chunks. Here rather than in deploy.yml so it fails BEFORE
        # the code lands on dev, not mid-deploy after main has fast-forwarded.
        env:
          SKIP_BUILD: '1'
        run: bash scripts/verify-window-chunk.sh

      - name: Event-types drift guard
        # Fails if lambda/events/eventTypes.generated.js is stale against the canonical src/lib/eventTypes.js
        # (regenerate to temp + byte-diff). Required: the deployed Lambda cannot import src/lib/, so a stale copy
        # would silently diverge the batch allowlist from the UI.
        run: npm run check:event-types

      - name: Dependency audit (blocking on moderate, WS-B M6)
        # Fails on any prod-dependency MODERATE+ advisory except the documented waivers in
        # scripts/audit-allowlist.json (each a justified non-applicability note; the waiver list lives there, not
        # here). Dev-only advisories are excluded by --omit=dev.
        run: python3 scripts/audit-gate.py

  # The image's own node and no node_modules: pytest runs before setup-node and npm ci.
  pytest:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Python script tests (pytest)
        # Every scripts/test_*.py. requests+boto3 are import-time deps of snap.py/revert-to.py.
        run: |
          set -euo pipefail
          # Plain form is proven on these runners (promote-gate.yml "Install python
          # deps"); the fallback covers a PEP-668 externally-managed image.
          python3 -m pip install --quiet pytest requests boto3 pyyaml \
            || python3 -m pip install --quiet --break-system-packages pytest requests boto3 pyyaml
          python3 -m pytest -q scripts/test_*.py

  # THE UTC PASS WITH COVERAGE: three shards and a merge, because as one leg it was the long pole. Each shard runs a
  # third of the test files (`--shard=i/3`: vitest's own split, by a hash of each file's path, so every runner draws
  # the same thirds) and writes a BLOB: its test results and its coverage
  # map, in which the provider records how that run loaded each file (scripts/vitest/coverage-v8-two-forms.mjs,
  # "A RUN IN SHARDS"). A shard is no verdict on coverage: its map is a third of the suite's. So it checks no threshold
  # (the four set to 0) and writes no report (`--coverage.reporter=none`: no partial table in its log for a reader to
  # take as the figure). Its tests still fail it, and so does the provider's own check of its map. The command-line
  # reporters replace vitest.config.ts's, so a shard prints no test-ids notice; the merge prints the pass's one.
  # The blob reaches the merge leg as an artifact: overwrite, so a re-run of a shard replaces its blob; error when the
  # shard wrote none; kept 3 days, long enough for a re-run of the merge.
  unit-utc-cov-1:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install shfmt (pinned and checksum-verified)
        # scripts/check-comment-only.test.js runs shfmt on its shell and YAML run: fixtures and fails without it. Every
        # unit shard installs it: vitest's split decides which shard draws that file. Pinned to the Mac's Homebrew
        # version so a local run and CI parse shell alike; the sha256 is the release asset's published digest,
        # re-hashed locally. To bump, change the version AND its hash together.
        env:
          SHFMT_VERSION: 3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/shfmt"
          mkdir -p "$D"
          curl -sSfL --retry 3 --retry-connrefused --retry-all-errors -o "$D/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $D/shfmt" | sha256sum -c -
          chmod +x "$D/shfmt"
          "$D/shfmt" --version
          echo "$D" >> "$GITHUB_PATH"

      - name: Unit tests with coverage, shard 1 of 3 (no threshold, no report)
        run: |
          npx vitest run --coverage --shard=1/3 --coverage.reporter=none \
            --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 --coverage.thresholds.statements=0 \
            --reporter=default --reporter=github-actions --reporter=blob --outputFile.blob=vitest-blobs/blob-1-3.json

      - name: Upload shard 1 of 3's blob for the merge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-utc-1
          path: vitest-blobs/blob-1-3.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # As unit-utc-cov-1, for the second third.
  unit-utc-cov-2:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install shfmt (pinned and checksum-verified)
        env:
          SHFMT_VERSION: 3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/shfmt"
          mkdir -p "$D"
          curl -sSfL --retry 3 --retry-connrefused --retry-all-errors -o "$D/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $D/shfmt" | sha256sum -c -
          chmod +x "$D/shfmt"
          "$D/shfmt" --version
          echo "$D" >> "$GITHUB_PATH"

      - name: Unit tests with coverage, shard 2 of 3 (no threshold, no report)
        run: |
          npx vitest run --coverage --shard=2/3 --coverage.reporter=none \
            --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 --coverage.thresholds.statements=0 \
            --reporter=default --reporter=github-actions --reporter=blob --outputFile.blob=vitest-blobs/blob-2-3.json

      - name: Upload shard 2 of 3's blob for the merge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-utc-2
          path: vitest-blobs/blob-2-3.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # As unit-utc-cov-1, for the last third.
  unit-utc-cov-3:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install shfmt (pinned and checksum-verified)
        env:
          SHFMT_VERSION: 3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/shfmt"
          mkdir -p "$D"
          curl -sSfL --retry 3 --retry-connrefused --retry-all-errors -o "$D/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $D/shfmt" | sha256sum -c -
          chmod +x "$D/shfmt"
          "$D/shfmt" --version
          echo "$D" >> "$GITHUB_PATH"

      - name: Unit tests with coverage, shard 3 of 3 (no threshold, no report)
        run: |
          npx vitest run --coverage --shard=3/3 --coverage.reporter=none \
            --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 --coverage.thresholds.statements=0 \
            --reporter=default --reporter=github-actions --reporter=blob --outputFile.blob=vitest-blobs/blob-3-3.json

      - name: Upload shard 3 of 3's blob for the merge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-utc-3
          path: vitest-blobs/blob-3-3.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # The UTC pass's VERDICT: the three blobs merged as one run (`vitest run --merge-reports --coverage`, which reproduces
  # the single run's coverage), the thresholds in vitest.config.ts, and the two halves of the
  # coverage ratchet around it, as the one leg ran them: the measured floor reads the coverage/coverage-summary.json the
  # merge writes. The only leg with `needs`, and no `if:`, so a red shard leaves it `skipped`, which the aggregator reads
  # as red. Its log carries the coverage table and the pass's test-ids notice, over every test of the three shards.
  unit-utc-cov:
    needs: [unit-utc-cov-1, unit-utc-cov-2, unit-utc-cov-3]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Coverage ratchet enforcement
        # Fails if the lowest vitest.config.ts threshold is below coverage-ratchet.json active_target.
        run: python3 scripts/check-coverage-ratchet.py

      - name: Download the three shards' blobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-utc-*
          path: vitest-blobs
          merge-multiple: true

      - name: Merge the three shards, with the coverage thresholds
        # vitest merges whatever blobs the directory holds and has no idea how many shards there were, so two blobs
        # would pass two thirds of the suite as the whole of it. The check first holds the directory to exactly the
        # three. Then vitest exits non-zero on a failed test in any blob, on a threshold the merged coverage misses
        # (vitest.config.ts) and on the provider's ERROR line (a blob it did not make, or a reading it could not align).
        # Last, the files the three shards ran must be the suite's, each once: the merge's test-ids notice
        # (files_sha256, the sorted unique test files, and files, how many ran) against `vitest list --filesOnly` from
        # this checkout. vitest's split is by a hash of each path and the same on every runner; this is what turns a
        # vitest whose split was not into a red. The NY shards use the same split. No notice is a red too.
        run: |
          set -euo pipefail
          FOUND=""
          [ ! -d vitest-blobs ] || FOUND="$(cd vitest-blobs && printf '%s ' *)"
          if [ "$FOUND" != "blob-1-3.json blob-2-3.json blob-3-3.json " ]; then
            echo "::error title=Coverage merge::want exactly the blobs of shards 1, 2 and 3 of 3 in vitest-blobs, found: ${FOUND:-none}. Two would pass two thirds of the suite as the whole. Blobs are kept 3 days: on an older run, re-run all jobs."
            exit 1
          fi
          npx vitest run --merge-reports=vitest-blobs --coverage | tee "$RUNNER_TEMP/merge.log"
          npx vitest list --filesOnly | sed -nE 's/^\[[a-z]+\] //p' > "$RUNNER_TEMP/listed.txt"
          LISTED="$(wc -l < "$RUNNER_TEMP/listed.txt" | tr -d ' ')"
          WANT="files_sha256=$(LC_ALL=C sort -u "$RUNNER_TEMP/listed.txt" | sha256sum | cut -d' ' -f1) files=$LISTED"
          GOT="$(sed -nE 's/^::notice title=test-ids UTC::.* (files_sha256=[0-9a-f]{64}) .* (files=[0-9]+) .*$/\1 \2/p' "$RUNNER_TEMP/merge.log")"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error title=Coverage merge::the merged run's test files are not the suite's: merged ${GOT:-with no test-ids notice}, vitest list --filesOnly $WANT. The shards lost or repeated a file."
            exit 1
          fi
          echo "Coverage merge: the three shards ran the suite's $LISTED test files, each once."

      - name: Coverage ratchet — measured floor (WS-B M4)
        # The ratchet step above compares only the CONFIG thresholds to active_target. This reads ACTUAL measured
        # coverage (coverage/coverage-summary.json, written by the merge's json-summary reporter) and fails if it
        # drops below active_target, so advancing active_target protects real coverage at once.
        run: python3 scripts/check-coverage-ratchet.py --measured

  # The same suite under the app's own timezone, behind a sentinel that the zone resolved, in two shards (as one leg it
  # was the long pole once the coverage pass was sharded). No coverage, so no merge: each shard's
  # tests are its verdict, the aggregator needs both, and `--shard=i/2` splits as the coverage shards do. Each shard
  # repeats the sentinel, and prints its own test-ids notice, for its half of the files: two digests cannot be put
  # together, so "the NY files are the UTC files" is now read from the counts (the two NY notices' files and tests add up
  # to the merge's). The merge's file check holds the split itself. No coverage also makes this the only pass whose time
  # is free of instrumentation.
  unit-ny-1:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install shfmt (pinned and checksum-verified)
        env:
          SHFMT_VERSION: 3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/shfmt"
          mkdir -p "$D"
          curl -sSfL --retry 3 --retry-connrefused --retry-all-errors -o "$D/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $D/shfmt" | sha256sum -c -
          chmod +x "$D/shfmt"
          "$D/shfmt" --version
          echo "$D" >> "$GITHUB_PATH"

      - name: TZ sentinel — America/New_York resolves on this runner
        # The step below is only a date-fragility guard if TZ takes effect. An unknown or unreadable zone does not
        # fail: node falls back to UTC and the whole suite passes as a second UTC run. This asks node (the runtime
        # the tests use) what the zone resolved to and for its January and July offsets, EST 300 and EDT 240.
        env:
          TZ: America/New_York
        run: |
          set -euo pipefail
          node -e '
          const zone = Intl.DateTimeFormat().resolvedOptions().timeZone
          const jan = new Date(2026, 0, 15, 12).getTimezoneOffset()
          const jul = new Date(2026, 6, 15, 12).getTimezoneOffset()
          console.log(`TZ=${process.env.TZ} resolved as ${zone}; minutes behind UTC: January ${jan}, July ${jul}`)
          if (process.env.TZ !== "America/New_York" || zone !== "America/New_York" || jan !== 300 || jul !== 240) {
            console.log("::error title=TZ sentinel::America/New_York did not resolve (want zone America/New_York, January 300, July 240). The suite below would run in another zone and prove nothing about date fragility.")
            process.exit(1)
          }
          '

      - name: Unit tests under America/New_York TZ (date-fragility guard), shard 1 of 2
        # The UTC pass (UTC is the runner default) hides TZ-fragile date assertions that fail only in a
        # UTC-negative zone like the app's own EDT/EST. Re-running the suite under the app's real timezone makes
        # that class fail CI, not prod.
        run: npx vitest run --no-coverage --shard=1/2
        env:
          TZ: America/New_York

  # As unit-ny-1, for the other half.
  unit-ny-2:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install shfmt (pinned and checksum-verified)
        env:
          SHFMT_VERSION: 3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/shfmt"
          mkdir -p "$D"
          curl -sSfL --retry 3 --retry-connrefused --retry-all-errors -o "$D/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $D/shfmt" | sha256sum -c -
          chmod +x "$D/shfmt"
          "$D/shfmt" --version
          echo "$D" >> "$GITHUB_PATH"

      - name: TZ sentinel — America/New_York resolves on this runner
        env:
          TZ: America/New_York
        run: |
          set -euo pipefail
          node -e '
          const zone = Intl.DateTimeFormat().resolvedOptions().timeZone
          const jan = new Date(2026, 0, 15, 12).getTimezoneOffset()
          const jul = new Date(2026, 6, 15, 12).getTimezoneOffset()
          console.log(`TZ=${process.env.TZ} resolved as ${zone}; minutes behind UTC: January ${jan}, July ${jul}`)
          if (process.env.TZ !== "America/New_York" || zone !== "America/New_York" || jan !== 300 || jul !== 240) {
            console.log("::error title=TZ sentinel::America/New_York did not resolve (want zone America/New_York, January 300, July 240). The suite below would run in another zone and prove nothing about date fragility.")
            process.exit(1)
          }
          '

      - name: Unit tests under America/New_York TZ (date-fragility guard), shard 2 of 2
        run: npx vitest run --no-coverage --shard=2/2
        env:
          TZ: America/New_York

  # Real-Chrome gates, first group.
  gates-a:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # The real-Chrome layout gates. They attach over CDP through scripts/layout-gate/cdp-socket.mjs, which
      # prefers node's global WebSocket and falls back to `ws` (a declared devDependency).
      # NO continue-on-error on any gate, by policy: a gate that reports success when it fails is worse than
      # no gate.
      - name: Resolve Chrome for the layout gates
        # The gates honour CHROME_PATH, defaulting to a macOS path that does not exist here. This RESOLVES the
        # runner's browser rather than assuming it: if the image stops shipping Chrome, this step FAILS the
        # build. It must never degrade to "no browser, so nothing to check".
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BIN" ]; then
            echo "::error::No Chrome on this runner - the layout gates cannot run and must not be skipped."
            exit 1
          fi
          echo "CHROME_PATH=$BIN" >> "$GITHUB_ENV"
          echo "layout gates will drive $BIN"
          "$BIN" --version

      - name: Weigh-in Save-band clearance (BUG-FRAMEPADOCCLUDE-001)
        # Real Chrome at a TRUE 390x500, four consecutive weigh-in entries. Asserts every bottom-row
        # weight key clears Save by SAVE_BAND_MIN_CLEARANCE_PX and that each key hit-tests to itself,
        # on whichever arm rendered (frame or the legacy sticky band); an arm it cannot identify FAILS.
        # Without it a keypad row can commit the harvest under the thumb.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:save-band

      - name: Log-chooser clearance and tap floor (BUG-LOGBANDOCCLUDE-001)
        # Real Chrome at 390x844 and 390x667 (keyboard up). Asserts the plant chooser clears the sticky Save
        # band, that probes across its width hit the chooser rather than the band, and, as a census rather than
        # a named list, that no visible interactive control on /log is under the T.tapMinHeight tap floor.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:log-chooser

      - name: Photo-tier payload budget (BUG-TIERLESSPHOTOS-001)
        # The only real payload number in this repo: vitest can prove which URL a surface ASKED for but never
        # that a byte moved (jsdom loads no image). Drives real Chrome at 390x844 @ dpr 2.625 and reads CDP
        # Network.loadingFinished encodedDataLength, the transferred size on the wire.
        # A BUDGET, NOT A REPORT: without --max-bytes the script only prints a number, so the `gate:` script
        # passes the ceiling. Non-vacuity twin: `npm run phototier-bytes:before` (--tier none) exceeds it.
        # Pillow is the fixture generator's only dependency and is not on the runner image (plain install, then
        # --break-system-packages for a PEP-668 image).
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow \
            || python3 -m pip install --quiet --break-system-packages pillow
          npm run gate:phototier-bytes

      - name: Inventory list tap floor and row integrity (HG-4.2)
        # Real Chrome at 390x844. Every control the inventory list owns must render >= T.tapMinHeight (44) on
        # both axes AS RENDERED, and hit-test to itself (one never probed fails too: "not measured" is not "not
        # occluded"); no row wraps or overflows at the fixture's 44-char name; no sideways scroll. A non-vacuity
        # floor of rows / sections / controls is asserted first. The fixture's seed rows are counted on the
        # Seeds pointer row and listed nowhere.
        # ZERO margin: the smallest side is exactly 44px, so any shrink reds it. Blind spots: an inline height
        # on the selects is backstopped by selectChrome's own minHeight, and the quantity steppers are in the
        # probe's selector list but not rendered by this fixture.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:inventory-list

      - name: Saved-seeds layout and action clearance (V4-SEEDSAVEFLOW-001)
        # The real Seeds page at /seeds?view=saved (tests/harness/seedssaved.*; the instrument check refuses any
        # other surface), in real Chrome at 360x640, 390x844, 426x836 and 390x667 (keyboard up) across the
        # harness's states: empty, populated list, candidate picker, advance sheet. Asserts, as a census, that
        # no visible button or form control is under T.tapMinHeight; that no seed-lot card overflows or clips its
        # text beside the advance button at the 44-char variety name; no sideways scroll; and that the sheet's
        # primary action hit-tests to itself, fits the viewport and is reachable.
        # Hit-testing is on the TOP layer only: a control behind an open modal correctly fails to hit-test.
        # Link heights are printed, NOT asserted (WCAG 2.5.8 exempts a link inline in text). ONE named tap-floor
        # exemption: the frozen SegmentedControl view switch at 40px
        # (scripts/layout-gate/segmented-control-exemption.mjs), printed on every run.
        # Non-vacuity twin: `npm run gate:seeds-saved:probe-nothing` points every selector at a testid nothing
        # renders and exits 1 on every case/viewport pair: a selector that matched nothing is a FAILURE here.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:seeds-saved

      - name: Save seed sheet layout and Save clearance (V5-SEEDMULTIPARENT-001)
        # The Save seed sheet's "From" block (one row per parent planting, an adder, a plant count and a mix
        # name) sits above Save in a panel capped at 85vh. Real Chrome at 360x640, 390x844 and 426x836 across the
        # states tests/harness/saveseedsheet.jsx builds by TAPPING the real adder and picker. Asserts, as a
        # census, that no visible button or form control is under T.tapMinHeight (the icon-only remove control
        # sideways too); that every control, scrolled into view, hit-tests to itself; that Save is reachable and
        # hit-tests to itself at its centre and four corners; that the notice and refusal sentence sit above it;
        # no sideways scroll in the document or the panel.
        # Non-vacuity twin: `npm run gate:save-seed-sheet:probe-nothing` exits 1 on every case/viewport pair.
        # CI runs the gate, not the twin, as for every clearance gate.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:save-seed-sheet

      - name: Seeds page layout, all three views (V5-SEEDSTAB-001)
        # The whole Seeds page (header, SegmentedControl view switch, ferment line, ONE view body) on ?view=mine,
        # ?view=saved and ?view=sow at a TRUE 360x640 and 390x844, mounted by tests/harness/seeds.{html,jsx} with
        # the app's top bar and bottom nav in place (heights read from TopChrome.jsx and constants.js and
        # checked). The assertion list, (a) to (p), and the fixture rows each one needs are in the gate script.
        # They cover the switch and header on one line, no sideways scroll, the tap floor (ONE named exemption,
        # the 40px SegmentedControl radios, shared with gate:seeds-saved), My seeds folded and opened by real
        # hit-tested taps, line 1 and line 2 of each row (every heat shown whole, never sliced or dropped; the
        # F2 chip never costs the heat), thumbnails measured with image requests HELD and again after load, and
        # (o) lazy mounting within useNearViewport's reach.
        # It refuses to measure a view whose innerWidth or innerHeight is not the one requested, that is not at
        # scrollTop 0, or where a tap did not take.
        # Non-vacuity: `npm run gate:seeds-page:probe-nothing` exits 1 on every view/viewport pair, and
        # GATE_MUTATE_CSS (CSS injected before measuring) and GATE_MUTATE_JS (a page script, for what no
        # stylesheet reaches) red each assertion by name.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:seeds-page

      - name: Seed detail page layout — packet, after a sow, F2 lot (V5-SEEDSTAB-001)
        # The seed's own page (/inventory/:id): tests/harness/seeddetail.{html,jsx} mounts the real
        # InventoryDetail under top bar and bottom nav stand-ins (heights read and checked) at a TRUE 360x640,
        # 390x844 and 426x836, across a bought packet, the same page after a REAL sow (hit-tested taps), a lot
        # saved off an F1 plant, a Remove refused by the Lambda's 409, and a typo in the Seed count. The
        # assertion list, (a) to (l), is in the gate script: tap floor (two NAMED exemptions, printed every
        # run), the Sown-from card whole, Sow this only where it belongs, the F2 breeding fact, a refused Remove
        # keeping its reason inside the dialog, and a typed "175-" refused with NOTHING written (a
        # type="number" box reads it as blank).
        # It refuses a page whose viewport, surface, chrome or fixture counts are not the ones promised.
        # Non-vacuity twin: `npm run gate:seed-detail:probe-nothing` exits 1 on every state/viewport pair.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:seed-detail

      - name: Seeds Back and lot-page arrival (BUG-SAVEDSEEDSBACKTOP-001, BUG-SEEDLOTOPENSATFORM-001)
        # Scroll behaviour jsdom cannot produce: Back must restore the list's scrollY (Chrome CLAMPS scrollY to
        # the next page's one-screen loading shell before an unmount save can read it), and a push must land
        # at the top (Chrome's SCROLL ANCHORING re-applies the old offset). The unit suites pin both only with
        # models. tests/harness/seedsscroll.{html,jsx} mounts the real Seeds page and InventoryDetail under
        # BrowserRouter (real history keys, a real popstate Back) in App.jsx's shell, with a network that
        # answers after a loading phase, at 426x836 and 360x640. Each flow runs in a fresh tab with real taps
        # (hit-tested in place), real wheel scrolling and history.back(). The script's header lists all
        # sixteen flows: list -> lot page -> Back, and overlays (Search, +LOG) closed or re-mounted over Seeds.
        # It refuses a frame whose viewport or chrome is not the one asked for, a list less than 300px down (a
        # clobbered offset could equal it), a tap that pushed no new history entry, and a Back onto any entry but
        # the list's own. A frame that reloads mid-flow (Vite re-optimizing a dependency) is named as such
        # rather than measured. Non-vacuity twin: `npm run gate:seeds-scroll:probe-nothing` exits 1 on every flow.
        # Non-vacuity, measured (the record scripts/layout-gate/seeds-scroll.mjs points to): the pre-fix tree
        # (HARNESS_BASELINE_SHA=c016dcde) reds it by name; with ONLY the scroll-restore hook reverted
        # (GATE_HARNESS_CONFIG) it fails the Back checks and nothing else, with ONLY the lot page reverted the
        # lot-page checks and nothing else; a My seeds that forgets its open row fails "row still open" alone.
        # Same numbers with every font forced to Verdana and with the tabs' CPU throttled 6x (GATE_CPU_THROTTLE).
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:seeds-scroll

  # Real-Chrome gates, second group.
  gates-b:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Resolve Chrome for the layout gates
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BIN" ]; then
            echo "::error::No Chrome on this runner - the layout gates cannot run and must not be skipped."
            exit 1
          fi
          echo "CHROME_PATH=$BIN" >> "$GITHUB_ENV"
          echo "layout gates will drive $BIN"
          "$BIN" --version

      - name: Kitchen-batch close-out layout and band clearance (V5-KBCLOSE-001)
        # Real Chrome at 390x844, plus 390x667 (keyboard up) for the step-2 sheet states, across the states
        # tests/harness/putupclose.jsx renders. It mounts the REAL PutUp page behind its `?state=closed` and
        # `?batch=` flags and TAPS the real controls, so "is the close-out reachable" is answered before "does it
        # fit". Asserts, as a census, that no visible button or form control is under T.tapMinHeight; that no
        # closed-batch row overflows or clips beside Reopen at the fixture's 51-char label; no sideways scroll;
        # that the sheet's "Record it" hit-tests to itself and is reachable; and that with the page SCROLLED TO
        # ITS END no control intersects the fixed BottomNav (at scrollTop 0 nothing near the bottom is probed,
        # so "no control is occluded" would be about an empty set).
        # FONT-METRIC trap: a control whose centre lands exactly ON the viewport edge (elementFromPoint returns
        # null: nothing to probe) and one behind the nav at scrollTop 0 are not findings; both depend on row
        # heights, so they fire on CI fonts and never locally.
        # ZERO margin on the tap floor: the shortest control measures exactly 44px, so any shrink reds it.
        # Non-vacuity twin: `npm run gate:putup:probe-nothing` exits 1 on every case/viewport pair.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:putup

      - name: Put-Up ferment walks, Start to finish and after (release F, 06-ferment-path §5 L3)
        # Five walks through the REAL /put-up page in real Chrome at 426x836 and keyboard-up 426x492, each
        # tapping what a cook taps from Start a batch to finishing, then editing after. The far side of the wire
        # is tests/harness/fermentFake.js: stateful, judging every body with the Lambda's own validators and
        # planners, so a body the Lambda would refuse fails the walk. It proves nothing about SQL (that is the
        # integration suite). Asserts, besides getting through: every tap lands on its control; every focused
        # field sits inside the viewport and clear of pinned chrome; no sideways scroll; the tap floor; an open
        # sheet's primary action on screen at its first AND last scroll position; and the golden values in the
        # DOM and in what was written (listed in the gate script). Text is laid out in Roboto
        # (tests/harness/robotoPin.js), the phone's face, and a run whose pin did not load is refused.
        # Non-vacuity twin: `npm run gate:putup-ferment:probe-nothing` exits 1 on every walk/viewport pair.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:putup-ferment

      - name: Icon wiring slice 4 — five rewired surfaces (V4-ICON-001)
        # Real Chrome at 390x844 across overwinter / inventory-type / water-depth / life-story / notify.
        # Asserts ZERO pictographic characters survive inside the rewired subtree, and that every mark renders
        # non-zero, is visible, fits the viewport, is CONTAINED by the card/chip/row it labels, and has text in
        # an ancestor so nothing reads by mark alone. A per-surface minIcons floor is asserted first, because
        # "every mark passes" is true of a page with none. The npm script passes a repo-relative --outdir: an
        # absolute home path cannot be created on the runner and reds the gate after every check passed.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:iconwire4

      - name: Undo toast tap targets, glyph and stack (BUG-UNDOTOASTTAPTARGET-001)
        # The shared UndoToast (src/context/ToastContext.jsx), behind every "Logged … · Undo" message, in real
        # Chrome at 426x836 @ DPR 3 (tests/harness/undotap.{html,jsx}: the real ToastProvider under a nav
        # stand-in). For every production caller's message shape and on a stack of three at the cap: Undo takes
        # a tap across a full 48x48 square while its painted pill stays under 48px and the toast does not grow;
        # × is 48px tall, reaches the toast's edge, sits >= 8px clear of Undo and keeps its glyph out of the
        # right padding; three toasts do not overlap and end above the nav; a fourth takes the low-priority
        # toast's slot. The toast unit tests pin style declarations only, so this is the one that sees a glyph
        # slide. Same Roboto pin as the put-up walks.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:undo-toast

      - name: Weigh-in Save-band stability (V4-HARVESTFRAME-001)
        # The "it doesn't jump around" invariant, and the only gate that drives a FULL four-entry harvest
        # session rather than a single render. Real Chrome at 390x500 with the keyboard up. On the frame arm the
        # travel budget is ZERO: entries 2-4 must not move the weight pad one pixel (entry 1 has a documented
        # 12px descent allowance), and track 3's height must stay [49,49,49,49,49] across the session
        # (FRAME_LEDGER_PX). It refuses to pass vacuously: an unidentified surface, a zero-height, non-visible
        # or pointer-events:none band, or a step that never came to rest FAILS, and on the frame arm a travel of
        # 0 is accepted only while the document genuinely cannot scroll.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:save-band-stability

  # Page scroll alone: it is longer than either group above, and it is the gate that grows.
  gates-c:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Resolve Chrome for the layout gates
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BIN" ]; then
            echo "::error::No Chrome on this runner - the layout gates cannot run and must not be skipped."
            exit 1
          fi
          echo "CHROME_PATH=$BIN" >> "$GITHUB_ENV"
          echo "layout gates will drive $BIN"
          "$BIN" --version

      - name: Page scroll — a page opens at its top, Back returns to the place (BUG-DETAILPAGESCARRYSCROLL-001)
        # BrowserRouter never resets scroll on a push: the arriving page paints a one-screen loading shell,
        # Chrome clamps the old offset to it and SCROLL ANCHORING re-applies it once the content lands, so pages
        # open part-way down; and "Back keeps my place" rides the same carry, so a reset alone breaks Back. The
        # fix is ONE app-level manager (src/hooks/usePageScrollManager.js, decisions in src/lib/pageScroll.js,
        # flag SCROLL_MANAGER_ENABLED). jsdom has no clamp, no anchoring and no traversal timing; the unit suites
        # pin the decisions (pageScroll.test.js) and the wiring (usePageScrollManager.test.jsx) with models.
        # tests/harness/pagescroll.{html,jsx} mounts the real pages under BrowserRouter in App.jsx's shell, with
        # the REAL manager and main.jsx's real boot mode (a drift guard fails if either stops matching App.jsx),
        # a network that answers after a loading phase, a Clerk token that can be slow and a user that can be
        # held unresolved, at 426x836 and 360x640. Real taps, wheel, touch, typing and history.back(). Every page
        # a flow pushes onto must land at scrollY 0 (within 1px: a browser-side sub-pixel nudge, counted in the
        # log) with its title in view, and every Back must land on the exact offset the page was left at. The
        # script's header lists each flow; the slow flows run at 426x836 only (they measure time, not layout).
        # FLAG-AWARE, for the rollback: with SCROLL_MANAGER_ENABLED off it prints "manager OFF" and asserts only
        # the flag-off contract, so a forward flag-off build passes this step. Roll back that way, never with a
        # revert. Rehearse from any checkout: npm run test:flag-off, gate:page-scroll:flag-off,
        # gate:seeds-scroll:flag-off (the flag served false in memory, tests/harness/flagOffTransform.mjs).
        # It refuses a frame whose viewport, chrome, latency, skeleton or restore mode is not the one asked for, a
        # source less than 300px down, a tap that pushed no entry, a Back onto any entry but the one the offset
        # was taken on, a takeover flow whose restore had already finished before the user acted, and an
        # /api/members roster that is not the household of two (without that check the Garden flows pass on a
        # build that creeps).
        # Non-vacuity (the record scripts/layout-gate/page-scroll.mjs points to; mutants served through
        # GATE_HARNESS_CONFIG, each red at every viewport it runs at), mutant: flows it reds.
        #   manager deciding nothing, flag on: every flow but the must-not-change guards (Search's peek,
        #     "Add a planting", Put-Up, the Seeds switch); row 4's zero removed: top-back; row 5's: hook-top;
        #     row 6's: putup-top
        #   no scroll takeover: takeover, takeover-touch; a touch pointerdown taking over: takeover-touch; no
        #     click takeover: eventlog-more-tap; no out-of-reach stop: eventlog-more
        #   claims per page instead of per entry: retap-back; the ?lot= hint on a return: lot-back; time counted
        #     under the skeleton: reload-skeleton; a 4 s budget: eventlog-slow, zones-slow
        #   stopping on the height alone: eventlog-slow, zones-slow, leave-during-load; writes left open while
        #     armed: leave-during-load
        #   the pathname rule removed: garden-add, seeds-switch, same-replace, retap-back; the snapshot removed or
        #     filing while covered: the three blanked-list closes
        #   a request counted before its token was in hand: zones-slowtoken; the household uncached:
        #     garden-cycles; a restore holding the raw offset until the network is quiet: garden-plantsgrow
        # Not covered by a flow: the "entry still current" write rule (timing-dependent under 'manual') and the
        # hidden-only discard path, both pinned by usePageScrollManager.test.jsx. The lot-refuse flow's driver
        # can drift by a few px with timing; the driver's unit tests are the deterministic pin.
        # Non-vacuity twin: `npm run gate:page-scroll:probe-nothing` exits 1 on every flow.
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: npm run gate:page-scroll

  # The two Today V2 steps, which run their gate and then its probe-nothing and self-test proofs.
  gate-probes:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Resolve Chrome for the layout gates
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BIN" ]; then
            echo "::error::No Chrome on this runner - the layout gates cannot run and must not be skipped."
            exit 1
          fi
          echo "CHROME_PATH=$BIN" >> "$GITHUB_ENV"
          echo "layout gates will drive $BIN"
          "$BIN" --version

      - name: Today V2 contract, instrument and self-test (V5-TODAYREDESIGN-001)
        # THE Today gate. It drives the real TodayV2 (tests/harness/todaymeasure.jsx, on
        # tests/harness/vite.harness.v2.mjs) over the contract states in
        # tests/harness/_todaymeasure/today-v2-contract.mjs. A check still PENDING fails the run; the instrument
        # (viewport, clock, font pin, stubbed weather, no live request, fixture ledger, the state's seeds, the
        # prefs GET) holds on every state. Then two proofs the contract can fail, both of which must hold:
        # --probe-nothing blinds every v2 anchor and MUST exit 1, and --self-test arms every check against
        # an EMPTY V2 stub and passes only if the census reds every state while the instrument holds.
        # The probe is inverted with an explicit `if`, NOT a bare `! cmd`: steps run `bash -e`, and errexit
        # ignores a `!`-inverted command, so a probe that wrongly exited 0 mid-block would be swallowed.
        # The v2 mutation matrix stays out of CI (npm run mutate:today-shape:v2).
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: |
          npm run gate:today-shape:v2
          if npm run gate:today-shape:v2:probe-nothing; then
            echo "::error::gate:today-shape:v2:probe-nothing exited 0 - every v2 anchor pointed at nothing and the gate did not notice"
            exit 1
          fi
          npm run gate:today-shape:v2:self-test

      - name: Today V2 in the app shell (V5-TODAYREDESIGN-001)
        # tests/harness/todayshell.{html,jsx}: real TopChrome, the nav band, the REAL page-scroll manager
        # called as AppShell calls it: the shell itself (measured page band = 836 - 52 - 56, TopChrome
        # sticky at y=0, scrollRestoration manual, a production-shaped /api/members roster, the prefs GET),
        # a drift guard against App.jsx (TodayV2 mounted at /today from a static import) and main.jsx, and
        # sticky, jump landing and the Back round trip. --probe-nothing MUST exit 1 (explicit `if`, as above).
        env:
          GATE_CHROME_FLAGS: --no-sandbox
        run: |
          npm run gate:today-shell:v2
          if npm run gate:today-shell:v2:probe-nothing; then
            echo "::error::gate:today-shell:v2:probe-nothing exited 0 - the shell anchors pointed at nothing and the gate did not notice"
            exit 1
          fi

  # The verdict. It has no check-run and no job record until every leg has finished. `always()`
  # because without it a failed leg makes this job `skipped`, which reads as "no verdict" rather than red. The
  # step uses no action and no network: it reads the legs' results from `needs` and nothing else. A leg that
  # timed out reads `cancelled` here, not `failure`, so the test is "every result is
  # success", never "no result is failure". The pinned list is what makes a leg dropped from `needs` (or a new
  # leg nobody listed) a red rather than a quieter green. No `name:` on this job: its id is the check-run name,
  # and `build-and-test` is the name promote-gate.yml asks scripts/promote-preflight.py for.
  build-and-test:
    needs: [static, pytest, unit-utc-cov-1, unit-utc-cov-2, unit-utc-cov-3, unit-utc-cov, unit-ny-1, unit-ny-2,
            gates-a, gates-b, gates-c, gate-probes]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every pinned leg reported, and every one succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          EXPECTED_LEGS="static pytest unit-utc-cov-1 unit-utc-cov-2 unit-utc-cov-3 unit-utc-cov unit-ny-1 unit-ny-2 gates-a gates-b gates-c gate-probes"
          export EXPECTED_LEGS
          python3 - <<'PY'
          import json, os, sys


          def fail(why):
              print("::error title=build-and-test::" + why)
              sys.exit(1)


          expected = sorted(os.environ["EXPECTED_LEGS"].split())
          try:
              needs = json.loads(os.environ.get("NEEDS") or "")
          except ValueError as exc:
              fail("the needs context is not JSON (%s); no leg result could be read" % exc)
          if not isinstance(needs, dict):
              fail("the needs context is not a JSON object; no leg result could be read")
          if sorted(needs) != expected:
              fail("legs reported %s, expected exactly %s" % (sorted(needs), expected))
          results = {leg: needs[leg].get("result") if isinstance(needs[leg], dict) else None for leg in expected}
          for leg in expected:
              print("%-15s %s" % (leg, results[leg]))
          bad = ["%s=%s" % (leg, results[leg]) for leg in expected if results[leg] != "success"]
          if bad:
              fail("not every leg succeeded: " + ", ".join(bad))
          print("build-and-test: all %d legs succeeded" % len(expected))
          PY
