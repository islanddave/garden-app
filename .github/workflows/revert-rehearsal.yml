name: revert rehearsal (staging)

# Rehearsal of scripts/revert-to.py against STAGING. Unlike snap (which only creates, so env alone can
# point it at staging), revert-to's CODE leg mutates refs. REHEARSAL_MODE=1 redirects the code legs to
# throwaway revert-rehearsal-* branches, resets the STAGING Neon branch (br-polished-art-am12o4ue) from the
# target snapshot, and SKIPS the prod Lambda/CF legs (revert-to.rehearsal_guard fails closed otherwise). It
# does not touch dev, main, the prod DB, prod Lambdas or prod CloudFront.
#
# Triggered by touching ops/revert-rehearsal.trigger on dev: workflow_dispatch needs the file on main, and
# this one lives on dev only. `environment: production` is an OIDC subject-claim dependency (the snap role
# trusts environment:production), NOT an approval gate: that environment has no required reviewers. Do not
# move this to production-destructive; it needs no destructive gate and the subject would no longer match.
#
# AUTH: GitHub calls run as the garden-bot App, minted per run as promote-gate.yml mints it. No user token
# can do this: ruleset release-tag-integrity (20140435) restricts creating, updating and deleting
# refs/tags/v* to garden-bot, and this workflow recreates TARGET_VERSION while revert-to.py tags
# PREREVERT_VERSION.
#
# The trigger file selects the run via shell-style lines (all optional, defaults shown):
#   MODE=dump_path            # dump_path | fast_path | abort
#   TARGET_VERSION=v0.0.0     # snapshot to revert TO (must exist in SNAP_BUCKET)
#   PREREVERT_VERSION=v0.0.1  # fresh version for the pre-revert snap of CURRENT staging
# Setup creates the two rehearsal refs and recreates tag TARGET_VERSION (snap-rehearsal deletes it);
# teardown (always) deletes all rehearsal artifacts (refs, tags, pre-revert and stage Neon branches).

on:
  push:
    branches: [dev]
    paths: ['ops/revert-rehearsal.trigger']

permissions:
  id-token: write
  contents: write

env:
  REPO: ${{ github.repository }}
  # v0.0.0 snapshot's main_sha (pinned in snap-rehearsal.yml); the recreated tag must resolve here.
  TARGET_MAIN_SHA: "31e8673032bcb142e3accf6ae96fd45bd1830429"

concurrency:
  group: revert-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Mint garden-bot installation token
        id: bot
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.GARDEN_BOT_APP_ID }}
          private-key: ${{ secrets.GARDEN_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev

      - name: Setup rehearsal refs + tag, parse mode
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail
          TRG=ops/revert-rehearsal.trigger
          # || true: a missing key makes grep exit 1, which under pipefail+set -e would abort setup.
          get() { grep -E "^$1=" "$TRG" 2>/dev/null | head -1 | cut -d= -f2- | tr -d '[:space:]' || true; }
          MODE=$(get MODE); MODE=${MODE:-dump_path}
          TV=$(get TARGET_VERSION); TV=${TV:-v0.0.0}
          # run-unique default so re-fires don't collide with a prior (WORM-locked) prerevert manifest
          PV=$(get PREREVERT_VERSION); PV=${PV:-v0.0.${{ github.run_number }}}
          echo "mode=$MODE target=$TV prerevert=$PV"
          RID="${{ github.run_id }}"
          DEVB="revert-rehearsal-dev-$RID"
          MAINB="revert-rehearsal-main-$RID"
          API="https://api.github.com/repos/$REPO"
          # Every call captures the HTTP status AND the body and reports both through
          # scripts/gh_api_check.py: a bare `curl | python3 -c` read drops the body, which makes
          # 401, 403 and 404 indistinguishable (scripts/test_gh_api_check.py forbids that shape).
          # Only --fatal calls can end the step; tolerated calls annotate and continue.
          CHK="python3 scripts/gh_api_check.py"
          ghcurl() {
            curl -sS -o /tmp/gh-body.json -w "%{http_code}" \
              -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"
          }
          CODE=$(ghcurl "$API/git/refs/heads/dev")
          $CHK ref-sha --endpoint "$API/git/refs/heads/dev" --method GET \
            --status "$CODE" --body-file /tmp/gh-body.json --sha-file /tmp/base.sha
          BASE=$(cat /tmp/base.sha)
          echo "base dev HEAD = $BASE"
          # Exported BEFORE the first write: the tag create below can now end this
          # step, and teardown (always) can only delete the refs it is told about.
          {
            echo "DEVB=$DEVB"
            echo "MAINB=$MAINB"
            echo "TV=$TV"
            echo "PV=$PV"
          } >> "$GITHUB_ENV"
          for B in "$DEVB" "$MAINB"; do
            CODE=$(ghcurl -X POST -d "{\"ref\":\"refs/heads/$B\",\"sha\":\"$BASE\"}" "$API/git/refs")
            # 201 = created; 422 = already exists on a re-fire (both expected).
            # Anything else is annotated and still falls through to the force-update below.
            $CHK status --endpoint "$API/git/refs" --method POST --status "$CODE" \
              --body-file /tmp/gh-body.json --ok 201 --ok 422 --severity warning
            if [ "$CODE" != "201" ]; then
              CODE=$(ghcurl -X PATCH -d "{\"sha\":\"$BASE\",\"force\":true}" "$API/git/refs/heads/$B")
              # Status-checked so a refused force-update is named here, not as a missing branch
              # later. Non-fatal, like the create above.
              $CHK status --endpoint "$API/git/refs/heads/$B" --method PATCH \
                --status "$CODE" --body-file /tmp/gh-body.json --ok 200
            fi
          done
          # The tag DELETE is tolerant: the tag is normally absent, so it warns and continues.
          CODE=$(ghcurl -X DELETE "$API/git/refs/tags/$TV")
          $CHK status --endpoint "$API/git/refs/tags/$TV" --method DELETE --status "$CODE" \
            --body-file /tmp/gh-body.json --ok 204 --ok 404 --severity warning
          # The tag CREATE is not tolerant, and only 201 passes: a 422 is also how a ruleset refusal
          # arrives, and after the DELETE above a tag that still exists may point anywhere. Either way
          # revert-to.py has no usable target, so stop HERE with the response body.
          CODE=$(ghcurl -X POST -d "{\"ref\":\"refs/tags/$TV\",\"sha\":\"$TARGET_MAIN_SHA\"}" "$API/git/refs")
          $CHK status --endpoint "$API/git/refs" --method POST --status "$CODE" \
            --body-file /tmp/gh-body.json --ok 201 --fatal
          case "$MODE" in
            dump_path) echo "FORCE_DUMP_PATH=1" >> "$GITHUB_ENV" ;;
            # abort also forces the dump path so the post-checkpoint failure is injected
            # AFTER the already-proven dump+restore checkpoint, isolating rollback as the SUT.
            abort) { echo "FORCE_ABORT=1"; echo "FORCE_DUMP_PATH=1"; } >> "$GITHUB_ENV" ;;
            fast_path) : ;;
            *) echo "::error::unknown MODE=$MODE"; exit 1 ;;
          esac

      - name: Make /usr/lib/postgresql/17 writable (cache + docker cp target)
        run: |
          sudo mkdir -p /usr/lib/postgresql/17/bin
          sudo chown -R "$(id -u):$(id -g)" /usr/lib/postgresql/17

      - name: pg17 client cache
        id: pg17-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/lib/postgresql/17/bin
          key: pg17-client-postgres17-image-v1-runner-ubuntu-26.04

      - name: Fetch pg17 client from the postgres:17 image (cache miss only)
        # Not apt.postgresql.org (see backup.yml): the rehearsal of the incident-recovery path needs
        # the same independence from a package mirror as revert-gate.yml.
        if: steps.pg17-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cid=$(docker create postgres:17)
          docker cp "$cid:/usr/lib/postgresql/17/bin/." /usr/lib/postgresql/17/bin/
          docker rm -f "$cid" >/dev/null

      - name: Verify pg17 client
        run: /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Configure AWS credentials (snap role, OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.SNAP_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install python deps
        run: pip install boto3 requests --quiet

      - name: Run revert-to (REHEARSAL, staging-pointed)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REHEARSAL_MODE: "1"
          DEV_BRANCH: ${{ env.DEVB }}
          MAIN_BRANCH: ${{ env.MAINB }}
          TARGET_VERSION: ${{ env.TV }}
          PREREVERT_VERSION: ${{ env.PV }}
          CONFIRM_DATA_LOSS: "yes"
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PROD_BRANCH_ID: br-polished-art-am12o4ue
          NEON_BACKUP_URL: ${{ secrets.NEON_STAGING_URL }}
          SNAP_BUCKET: ${{ vars.SNAP_BUCKET }}
          PHOTOS_BUCKET: ${{ vars.PHOTOS_BUCKET }}
          SNAP_RETENTION: ${{ vars.SNAP_RETENTION }}
          CF_DIST: E3FAJTXAORQYDT
          # As revert-gate.yml: tempfile dumps on the work disk, not the ubuntu-26.04 /tmp RAM disk.
          TMPDIR: ${{ runner.temp }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          if [ "${FORCE_ABORT:-}" = "1" ]; then
            # Abort rehearsal: the script is EXPECTED to exit 1 after rolling back.
            # PASS = exit 1 AND the rollback marker present; anything else FAILS.
            set +e
            python3 scripts/revert-to.py 2>&1 | tee /tmp/revert-out.txt
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" = "1" ] && grep -q "rolled back to pre-revert snap" /tmp/revert-out.txt; then
              echo "ABORT REHEARSAL PASS: post-checkpoint failure rolled back as designed (rc=1 + marker)."
            else
              echo "::error::abort rehearsal did NOT roll back as expected (rc=$rc)"; exit 1
            fi
          else
            python3 scripts/revert-to.py
          fi

      - name: Teardown rehearsal artifacts
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set +e
          API="https://api.github.com/repos/$REPO"
          CHK="python3 scripts/gh_api_check.py"
          ghcurl() {
            curl -sS -o /tmp/gh-body.json -w "%{http_code}" \
              -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"
          }
          # Teardown is best-effort and never fails the job (set +e, --severity warning, no --fatal),
          # but a refused delete still names the ref, the status and the reason.
          for B in "$DEVB" "$MAINB"; do
            [ -n "$B" ] || continue
            CODE=$(ghcurl -X DELETE "$API/git/refs/heads/$B")
            $CHK status --endpoint "$API/git/refs/heads/$B" --method DELETE --status "$CODE" \
              --body-file /tmp/gh-body.json --ok 204 --ok 404 --severity warning
          done
          for T in "$TV" "$PV"; do
            [ -n "$T" ] || continue
            CODE=$(ghcurl -X DELETE "$API/git/refs/tags/$T")
            $CHK status --endpoint "$API/git/refs/tags/$T" --method DELETE --status "$CODE" \
              --body-file /tmp/gh-body.json --ok 204 --ok 404 --severity warning
          done
          python3 - <<'PY'
          import os, requests
          key = os.environ["NEON_API_KEY"]; proj = os.environ["NEON_PROJECT_ID"]
          pre = os.environ.get("PV", "v0.0.1"); tv = os.environ.get("TV", "v0.0.0")
          H = {"accept": "application/json", "Authorization": f"Bearer {key}"}
          BRANCHES_URL = f"https://console.neon.tech/api/v2/projects/{proj}/branches"
          def list_branches():
              # Same blind spot as the GitHub legs: a bare .json()["branches"] turns
              # any auth/quota/outage response into a bare KeyError with the status
              # and body discarded. Report both, then fail the same way as before.
              r = requests.get(BRANCHES_URL, headers=H, timeout=60)
              if r.status_code != 200:
                  raise RuntimeError(f"GET {BRANCHES_URL} -> HTTP {r.status_code}: {r.text[:400]}")
              data = r.json()
              if not isinstance(data, dict) or "branches" not in data:
                  raise RuntimeError(
                      f"GET {BRANCHES_URL} -> HTTP 200 but no 'branches' key "
                      f"(keys: {sorted(data) if isinstance(data, dict) else type(data).__name__}): "
                      f"{str(data)[:400]}")
              return data["branches"]
          try:
              bs = list_branches()
          except Exception as e:
              print("teardown: neon list failed", e); raise SystemExit(0)
          def doomed(n):
              return n == f"snap-{pre}" or n == f"revert-stage-{tv}" or n.startswith(f"prerestore-{tv}-")
          # Multi-pass, leaf-first: Neon refuses to delete a branch that still has
          # children (restore-with-preserve RE-PARENTS branches, so a scratch branch
          # can end up an ANCESTOR of staging and is then un-deletable by design).
          # Report status honestly instead of assuming success.
          for _pass in range(4):
              bs = list_branches()
              targets = [b for b in bs if doomed(b.get("name", ""))]
              if not targets:
                  break
              made_progress = False
              for b in targets:
                  r = requests.delete(f"https://console.neon.tech/api/v2/projects/{proj}/branches/{b['id']}", headers=H, timeout=60)
                  if r.status_code in (200, 201, 202):
                      print("deleted neon branch", b.get("name")); made_progress = True
                  else:
                      print(f"kept neon branch {b.get('name')} ({r.status_code}: {r.json().get('message','')[:60]})")
              if not made_progress:
                  print("teardown: remaining scratch branches are staging ancestors (expected, benign)")
                  break
          PY
