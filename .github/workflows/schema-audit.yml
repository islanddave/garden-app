name: L-081 Schema Audit (dev)

# Verifies that the column and relation references in lambda code exist in prod Neon's schema. Phase 1 =
# the columns declared in lambda/**/*columns.test.js contracts; Phase 2 = INSERT column lists and Phase 3 =
# soft-delete deleted_at targets, in every non-test lambda/**/*.js; Phase 4 = every relation a handler
# queries exists in prod, plus the joined-relation coverage ratchet (scripts/schema-audit-join-baseline.json).
# The bug class: a column exists in staging but not prod, the deploy succeeds, and every endpoint 500s.
#
# This workflow is the early warning on each dev push. The blocking check is promote-gate.yml's "Prod
# schema gate", which runs the same script with --gate on the promoted SHA before main moves.
# A GREEN RUN HERE DOES NOT PREDICT THE GATE, in either direction: exit 2 (inconclusive), a missing secret
# and an unreadable Phase-1 contract are green here (a warning) but refused at the gate; a STALE waiver reds
# here but is only a warning at the gate (prod already has the column).
#
# Audit script: scripts/dev-main-schema-audit.py. A reference copy lives in claude-ops/scripts/ for local
# sandbox invocation; keep them in sync.

on:
  push:
    branches: [dev]
    paths:
      # The filter must cover everything the audit reads: a gate that does not run on the files it audits
      # is as blind as one that cannot see them. Phase 2 reads every non-test lambda/**/*.js and Phase 1
      # discovers '*columns.test.js', hence lambda/**/*.js rather than index.js only.
      - 'lambda/**/*.js'
      - 'migrations/**'
      - 'scripts/dev-main-schema-audit.py'
      - 'scripts/test-schema-audit-phase1.py'
      - 'scripts/schema-audit-join-baseline.json'
      - '.github/workflows/schema-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit lambda column refs vs prod Neon schema
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout garden-app
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install psycopg2-binary
        run: pip install psycopg2-binary

      - name: Verify audit script present
        run: |
          test -s scripts/dev-main-schema-audit.py || { echo "::error::scripts/dev-main-schema-audit.py missing or empty"; exit 1; }
          head -1 scripts/dev-main-schema-audit.py | grep -q python3 || { echo "::error::audit script header malformed"; exit 1; }

      # Runs BEFORE the audit and independently of it: the suite needs no DB and no psycopg2, so it is the
      # only step here that still verifies something when NEON_DATABASE_URL is absent. It guards the parser:
      # a Phase-1 regression is SILENT downstream (a dropped column group leaves the table covered, so the
      # Phase-4 ratchet sees nothing and the audit still reports PASS). Hard-fails.
      - name: Phase 1 parser unit tests
        run: python3 scripts/test-schema-audit-phase1.py

      - name: Run L-081 schema audit
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [[ -z "$NEON_DATABASE_URL" ]]; then
            echo "::warning title=L-081 audit UNVERIFIED::UNVERIFIED — NEON_DATABASE_URL secret not set; schema audit did NOT run. Green here verifies nothing."
            {
              echo "### ⚠️ UNVERIFIED — L-081 schema audit did not run"
              echo "NEON_DATABASE_URL is not configured (Settings → Secrets and variables → Actions). No column refs were checked against prod Neon this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # ERREXIT: keep pipefail OFF for this pipeline. GitHub runs this step as `bash -e {0}`, so the
          # audit's exit reaches AUDIT_EXIT only because the pipeline's status is tee's. With pipefail on,
          # exit 1 or 2 would end the step on this line: no annotation, and an inconclusive run red instead
          # of warned. scripts/test_workflow_steps.py runs the body with the `set -euo pipefail` prologue.
          set +o pipefail
          python3 scripts/dev-main-schema-audit.py --repo-root . --verbose | tee audit-output.txt
          AUDIT_EXIT=${PIPESTATUS[0]}
          if [[ "$AUDIT_EXIT" -eq 0 ]]; then
            echo "::notice title=L-081 audit PASS::All lambda column refs present in prod Neon."
            echo "✅ L-081 schema audit PASS — all lambda column refs present in prod Neon." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$AUDIT_EXIT" -eq 1 ]]; then
            echo "::error title=L-081 audit FAIL::Lambda code references columns missing in prod Neon. Apply additive migration to prod before promote."
            echo "❌ L-081 schema audit FAIL — lambda code references columns missing in prod Neon. See run log." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "::warning title=L-081 audit UNVERIFIED::UNVERIFIED — audit inconclusive (script exited $AUDIT_EXIT: config/connection/parse failure). Schema state was NOT verified this run."
            {
              echo "### ⚠️ UNVERIFIED — L-081 schema audit inconclusive"
              echo "Audit script exited $AUDIT_EXIT (config/connection/parse failure). No PASS/FAIL determination was made; schema state is unverified."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
