name: L-081 Schema Audit (dev)

# Verifies lambda code's column references are present in prod Neon's
# information_schema.columns: Phase 1 = lambda/**/select-columns.test.js
# assertions; Phases 2-3 = INSERT column lists + soft-delete deleted_at refs
# in lambda/**/index.js.
# Catches the L-081 bug class (local_3f62f153 2026-05-19 prod incident):
# lambda code references columns that exist in staging but not prod, deploy
# succeeds, every endpoint 500s.
#
# Trigger re-homed 2026-07-22 (OPS-GUARDINTEG-001): the original
# `pull_request -> main` trigger became structurally unreachable when
# OPS-GATE-001 (2026-06-03) retired PRs to main — main advances ONLY by
# garden-bot fast-forward via promote-gate, so no PR to main can ever exist.
# The workflow sat dead 7 weeks while looking configured. It now fires on
# push to dev, path-filtered to exactly what the audit reads (the lambda
# column sources), plus migrations/** as the schema-change signal and the
# audit script + this workflow themselves.
#
# Advisory: a genuine FAIL (missing column) fails this workflow, but nothing
# gates on it yet. The fail-soft paths (missing secret, inconclusive) no
# longer exit 0 silently — they emit a loud UNVERIFIED warning + job summary.
# Resurrect observably first; consider wiring into the pre-promote impact
# pass once a green history exists.
#
# Audit script: scripts/dev-main-schema-audit.py (canonical here in garden-app/).
# A reference copy lives in claude-ops/scripts/ for local sandbox invocation. Keep in sync.
#
# ---------------------------------------------------------------------------------------
# Second job added 2026-09-07: gam-site contract check. Same trigger, same prod Neon
# connection, opposite direction. The L-081 audit above asks "does prod have the columns
# THIS repo's code needs?" The contract check asks "does prod have columns the PUBLIC
# WEBSITE does not know about?"
#
# gam-site (private repo islanddave/gardens-at-mathews-rd) publishes gardensatmathews.com
# from this database. Its gate 1 enforces a closed world: every live column on the 8
# published tables must be classified in gam-site/public-export.yaml, or its build FAILs
# and the site freezes at its last publish. On 2026-09-03 seed-saving work added four
# plant_varieties columns and did exactly that. The contract was UNILATERAL — gam-site
# knew about garden-app; garden-app had never heard of gam-site (9 files mentioned it,
# all comments, zero enforcement), so CI here stayed green while the site sat frozen.
#
# THE TRADEOFF, since it is not free. gam-site is a separate PRIVATE repo and this CI
# cannot check it out without a credential. Three options existed:
#   (a) vendor the contract here as scripts/gam-site-column-contract.json  <- CHOSEN
#   (b) cross-repo checkout with a token
#   (c) fetch the contract from a published URL
# (b) was rejected: it puts a standing cross-repo credential in garden-app's CI and makes
# every migration push to dev depend on that token still being valid — a large coupling
# and blast-radius cost to buy an advisory warning, with token expiry as a recurring
# silent-death mode. (c) was rejected as worse than it looks: the contract would be served
# by the very site that is FROZEN whenever this check matters, so it would go stale exactly
# in the failure case — and it would require changes in gam-site.
#
# (a)'s cost is a second copy that can drift, so the drift is made DETECTABLE rather than
# silent, three ways: the vendored file carries a sha256 over its own canonicalized body
# (the checker recomputes it and refuses to report a confident PASS from a hand-edited
# contract — INCONCLUSIVE instead); the contract's AGE and source commit print in the job
# summary on EVERY run, pass or fail, so a stale mirror is visible without going looking;
# and scripts/refresh-gam-site-contract.py --check recomputes the digest against a live
# gam-site checkout on the one machine that has both repos. Drift also fails in a known
# DIRECTION: a lagging copy over-reports (false positive, noisy, safe); under-reporting
# needs gam-site to REMOVE a classification, which is not a normal edit.
#
# ADVISORY, AND STRICTLY SO — stricter than the job above. That job's genuine FAIL exits 1
# and fails this workflow. The contract job NEVER exits non-zero, on any path. A finding
# means another repo's build will fail; freezing garden-app's pipeline to protect a garden
# website is a worse trade than the problem being solved, and a stale vendored contract
# would produce exactly that freeze on a false positive. Signal is carried entirely by
# ::error / ::warning annotations plus the job summary — loud, attributable to the commit
# that caused it, and incapable of blocking a promote. Fail-soft paths hold the same line
# as the job above: a missing secret, a missing contract, or an inconclusive run emits a
# loud UNVERIFIED rather than passing quietly.
#
# Checker: scripts/gam-site-contract-check.py   Contract: scripts/gam-site-column-contract.json
# Refresher (local, needs a gam-site checkout): scripts/refresh-gam-site-contract.py
# Tests: scripts/test-gam-site-contract-check.py   Mirrors: gam-site/tools/gates.py::gate1

on:
  push:
    branches: [dev]
    paths:
      # Widened 2026-08-28. The filter had drifted BEHIND the audit twice, and a gate that
      # does not run on the files it audits is the same shape of blind spot as one that
      # cannot see them:
      #   - Phase 2 was widened to every non-test lambda/**/*.js on 2026-08-19, but this
      #     filter still watched only index.js -- so editing e.g. lambda/harvests/watch-route.js
      #     (which carries INSERT column lists) never triggered the audit.
      #   - Phase 1 discovery is now '*columns.test.js', so the garden_node joined-relation
      #     guard would not have triggered a run either.
      - 'lambda/**/*.js'
      - 'migrations/**'
      - 'scripts/dev-main-schema-audit.py'
      - 'scripts/schema-audit-join-baseline.json'
      # gam-site contract job. migrations/** and lambda/**/*.js above already cover the two
      # ways a change here breaks the public site (a column add, and a handler emitting a new
      # event_type); these two add the check's own sources, same reasoning as the 2026-08-28
      # widening — a gate that does not run on the files it reads is a blind spot.
      - 'scripts/gam-site-contract-check.py'
      - 'scripts/gam-site-column-contract.json'
      - '.github/workflows/schema-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit lambda column refs vs prod Neon schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout garden-app
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # setup-python pinned to major version v5 — advisory workflow, not deploy-tier discipline.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install psycopg2-binary
        run: pip install psycopg2-binary

      - name: Verify audit script present
        run: |
          test -s scripts/dev-main-schema-audit.py || { echo "::error::scripts/dev-main-schema-audit.py missing or empty"; exit 1; }
          head -1 scripts/dev-main-schema-audit.py | grep -q python3 || { echo "::error::audit script header malformed"; exit 1; }

      - name: Run L-081 schema audit
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [[ -z "$NEON_DATABASE_URL" ]]; then
            echo "::warning title=L-081 audit UNVERIFIED::UNVERIFIED — NEON_DATABASE_URL secret not set; schema audit did NOT run. Green here verifies nothing."
            {
              echo "### ⚠️ UNVERIFIED — L-081 schema audit did not run"
              echo "NEON_DATABASE_URL is not configured (Settings → Secrets and variables → Actions). No column refs were checked against prod Neon this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/dev-main-schema-audit.py --repo-root . --verbose | tee audit-output.txt
          AUDIT_EXIT=${PIPESTATUS[0]}
          if [[ "$AUDIT_EXIT" -eq 0 ]]; then
            echo "::notice title=L-081 audit PASS::All lambda column refs present in prod Neon."
            echo "✅ L-081 schema audit PASS — all lambda column refs present in prod Neon." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$AUDIT_EXIT" -eq 1 ]]; then
            echo "::error title=L-081 audit FAIL::Lambda code references columns missing in prod Neon. Apply additive migration to prod before promote."
            echo "❌ L-081 schema audit FAIL — lambda code references columns missing in prod Neon. See run log." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "::warning title=L-081 audit UNVERIFIED::UNVERIFIED — audit inconclusive (script exited $AUDIT_EXIT: config/connection/parse failure). Schema state was NOT verified this run."
            {
              echo "### ⚠️ UNVERIFIED — L-081 schema audit inconclusive"
              echo "Audit script exited $AUDIT_EXIT (config/connection/parse failure). No PASS/FAIL determination was made; schema state is unverified."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

  # Independent job, not a step in `audit` above: the two checks answer different questions and
  # must stay separately readable. It also means this one cannot turn the L-081 audit red, and
  # (because every path below exits 0) cannot turn the workflow red either.
  gam-site-contract:
    name: Will this schema change freeze the public website?
    runs-on: ubuntu-latest

    steps:
      - name: Checkout garden-app
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # setup-python pinned to major version v5 — advisory workflow, not deploy-tier discipline.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # psycopg2 only. The checker reads the vendored JSON contract and prod Neon — no PyYAML,
      # no gam-site checkout, no cross-repo credential. That dependency-free property is the
      # point of vendoring, so keep this list at one package.
      - name: Install psycopg2-binary
        run: pip install psycopg2-binary

      - name: Check prod schema against the gam-site publish contract
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [[ ! -s scripts/gam-site-contract-check.py || ! -s scripts/gam-site-column-contract.json ]]; then
            echo "::warning title=gam-site contract UNVERIFIED::UNVERIFIED — checker or contract file missing; nothing was compared. Green here verifies nothing."
            {
              echo "### ⚠️ UNVERIFIED — gam-site contract check did not run"
              echo "scripts/gam-site-contract-check.py or scripts/gam-site-column-contract.json is missing or empty."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$NEON_DATABASE_URL" ]]; then
            echo "::warning title=gam-site contract UNVERIFIED::UNVERIFIED — NEON_DATABASE_URL secret not set; contract check did NOT run. Green here verifies nothing."
            {
              echo "### ⚠️ UNVERIFIED — gam-site contract check did not run"
              echo "NEON_DATABASE_URL is not configured (Settings → Secrets and variables → Actions). Prod schema was not compared against the publish contract this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # No `set -o pipefail` here, deliberately: GitHub runs this with `bash -e`, so a
          # pipefail'd pipeline whose python side exits 1 would kill the step before the
          # branching below could translate that 1 into an advisory annotation. tee's own
          # exit status keeps `-e` quiet; PIPESTATUS carries the real code. Same pattern as
          # the L-081 job above.
          python3 scripts/gam-site-contract-check.py --repo-root . --verbose 2>&1 | tee contract-output.txt
          CHECK_EXIT=${PIPESTATUS[0]}
          if [[ "$CHECK_EXIT" -eq 0 ]]; then
            echo "::notice title=gam-site contract PASS::Prod schema is consistent with the public-site publish contract."
            {
              echo "### ✅ gam-site contract PASS"
              echo "Prod schema is consistent with the publish contract; gam-site gate 1 should pass."
              echo ''
              echo '```'
              head -3 contract-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$CHECK_EXIT" -eq 1 ]]; then
            # ::error for visibility (red annotation on the commit), exit 0 for posture. This
            # is the whole design: loud, attributable, non-blocking. Do not "fix" this to
            # exit 1 — see the ADVISORY note in the header.
            echo "::error title=gam-site contract BREAK::This schema will FAIL gam-site's gate 1 and freeze gardensatmathews.com at its last publish. Classify the columns in gam-site/public-export.yaml. ADVISORY — garden-app's pipeline is NOT blocked."
            {
              echo "### ❌ gam-site publish contract BREAK — the public site will freeze"
              echo ""
              echo "This schema change will fail **gam-site gate 1** (closed-world columns). gardensatmathews.com will stay frozen at its last successful publish until every column below is classified in \`gam-site/public-export.yaml\` under the source's \`columns:\` (published) or \`excluded:\` (with a reason)."
              echo ""
              echo '```'
              cat contract-output.txt
              echo '```'
              echo ""
              echo "**This is advisory.** garden-app's pipeline is not blocked and this job is green by design."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=gam-site contract UNVERIFIED::UNVERIFIED — check inconclusive (script exited $CHECK_EXIT: config/connection/contract failure). The publish contract was NOT verified this run."
            {
              echo "### ⚠️ UNVERIFIED — gam-site contract check inconclusive"
              echo "Checker exited $CHECK_EXIT (config / connection / unreadable or hand-edited contract). No PASS/FAIL determination was made."
              echo ""
              echo '```'
              cat contract-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Every path above lands here. This job is incapable of failing the workflow.
          exit 0
