name: Build and Deploy — Staging + Regression Suite

# The run title carries the SHA this run BUILT (inputs.dev_sha), not the dispatch ref's HEAD:
# promote-gate's write-path smoke gate finds its dispatched run by this title. head_sha cannot serve,
# because a workflow_dispatch run's head_sha is the head of the ref it was dispatched on (dev), which
# differs from inputs.dev_sha whenever dev moves mid-promote.
run-name: staging ${{ inputs.dev_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      dev_sha:
        description: 'Exact dev commit SHA to build + deploy to staging (no staging-ref force-reset). Defaults to the dispatch ref HEAD if omitted.'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  # Staging Clerk (dev instance — publishable key is intentionally client-visible)
  STAGING_CLERK_KEY: pk_test_ZWxlY3RyaWMtaGF3ay04Ny5jbGVyay5hY2NvdW50cy5kZXYk
  # Staging Lambda URLs
  STAGING_API_PROJECTS:  https://mjozckiuondhvmsa7eulvuld3m0rptdh.lambda-url.us-east-1.on.aws/
  STAGING_API_PLANTS:    https://fhgmxvrp2mefmzybhhwiptb2j40abfrw.lambda-url.us-east-1.on.aws/
  STAGING_API_LOCATIONS: https://7d7gjas5nuup6dowlq7fxlwh6a0cotgd.lambda-url.us-east-1.on.aws/
  STAGING_API_EVENTS:    https://ugggquxg5qk5rkupwib3s53hty0vqdjf.lambda-url.us-east-1.on.aws/
  STAGING_API_FAVORITES: https://groahbarqmnhamc2oicymsuuba0rugkj.lambda-url.us-east-1.on.aws/
  STAGING_API_PHOTOS:    https://sj6y3awedsfxqttuascvateeoy0tohji.lambda-url.us-east-1.on.aws/
  STAGING_API_DASHBOARD: https://rsooajzuwmmyldgrpx7ebp2doa0gttpn.lambda-url.us-east-1.on.aws/
  STAGING_API_INVENTORY: https://yjp6wsb2gkckork57shkxwqlzu0shwcm.lambda-url.us-east-1.on.aws/
  STAGING_API_VARIETIES: https://dlhj5pjej6alk6ynyih2ktbxca0uiorl.lambda-url.us-east-1.on.aws/
  STAGING_API_APP_EVENTS: https://m3lvka5lzswyqkl6uzpkof24y40hoqki.lambda-url.us-east-1.on.aws/
  # ux-events: placeholder until first staging deploy creates the Function URL (then this is updated to the real URL).
  STAGING_API_UX_EVENTS: https://ggrsrryarrkw2y5eaxm6r26cc40czzje.lambda-url.us-east-1.on.aws/
  # critter: smoke skips gracefully while this is a placeholder and HARD-FAILs once it is the real URL.
  STAGING_API_CRITTERS: https://nqq6b5kkf76mtvjmtqybk5jene0efzuk.lambda-url.us-east-1.on.aws/
  # shared-state: no smoke assert until this is the real URL.
  STAGING_API_SHARED_STATE: https://nhkygabmmjfcksqlahk2n2t5di0webau.lambda-url.us-east-1.on.aws/
  # No staging tags Lambda exists. Declared empty so the reference below is explicit: an undefined repo
  # var silently bakes VITE_API_TAGS="" into every staging build. WARN-tier in the Validate step.
  STAGING_API_TAGS: ""
  # Every staging Lambda must be wired here, in both VITE_ mappings and in a validate list: a missing one
  # bakes VITE_API_*="" into every staging build, the app falls back to a relative /api/... path that
  # CloudFront answers with index.html ("Unexpected token '<'"), and the surface is dead on staging while
  # working in prod. URLs come from `aws lambda get-function-url-config` and answer 401 (alive, auth-gated).
  STAGING_API_PRESERVATION:      https://gmcwnewzjykdlnd7nllagvyrlm0vgrjn.lambda-url.us-east-1.on.aws/
  STAGING_API_STORAGE_LOCATIONS: https://4arsh5rxe6f5f5bgbyeyueftee0qquwa.lambda-url.us-east-1.on.aws/
  STAGING_API_HARVESTS:      https://c2xqhj5fktciet2efz3hjkayxe0zunda.lambda-url.us-east-1.on.aws/
  STAGING_API_MEMBERS:         https://zhkvqgtlh3jwsdvoeak5hhro4y0ujbxq.lambda-url.us-east-1.on.aws/
  STAGING_API_FINDINGS:        https://xadazkudo5dyzaz67nmud2wsh40mbepo.lambda-url.us-east-1.on.aws/
  STAGING_API_DAILY_PLAN_READ: https://5fblg7acway22fxx5svtqsc4ta0ipgpl.lambda-url.us-east-1.on.aws/
  # Declared EMPTY on purpose, so the reference is not an undefined-var silent empty and the Validate step
  # WARNs on it: garden-achievements-staging does not exist and achievements is prod-only in the matrix below.
  STAGING_API_ACHIEVEMENTS: ""
  # It lights up /share on staging and the smoke's facebook-share reachability.
  STAGING_API_FACEBOOK_SHARE: https://hzswsu5vcmef7uivk2ctvmy7ry0pkapr.lambda-url.us-east-1.on.aws/
  # Staging infra
  STAGING_S3_BUCKET:   garden-app-staging
  STAGING_CF_DIST_ID:  E3K5KH9B8CTPQS
  STAGING_CF_ORIGIN:   https://dg6mmjhepoyt9.cloudfront.net

jobs:
  # Refuses a dispatch from the wrong ref. The `staging` environment's branch policy rejects a run on any
  # other ref, and a hand `gh workflow run deploy-staging.yml` without --ref dispatches on the default
  # branch, so the run would die at deploy-lambdas on a policy refusal that does not name the fix. This job
  # carries no `environment:`, so it runs first and names it; every job that declares `environment: staging`
  # sits behind it (deploy-lambdas directly, deploy-frontend through it). promote-gate dispatches with
  # "ref":"dev" and passes.
  ref-guard:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Require dispatch from dev or staging
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/dev|refs/heads/staging)
              echo "dispatch ref $REF: ok"
              ;;
            *)
              echo "::error::deploy-staging was dispatched on ${REF:-(no ref)}; the staging environment accepts only dev or staging. Dispatch with --ref dev: gh workflow run deploy-staging.yml --ref dev -f dev_sha=<sha>"
              exit 1
              ;;
          esac

  deploy-lambdas:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: staging  # OIDC subject claim for garden-app-github-deploy-staging trust
    needs: ref-guard
    strategy:
      matrix:
        # Four functions in deploy-lambda.yml's 26-wide matrix are prod-only, deliberately: achievements +
        # tags (no staging Lambda; their STAGING_API_* URLs are declared empty above), xp-reconcile +
        # daily-plan (EventBridge-driven writers: whether staging gets its own cron, and at what DRY_RUN, is
        # an open decision, not an omission). Every other function runs here, so the smoke gate sees it.
        function: [projects, plants, locations, events, favorites, photos, dashboard, inventory-items, varieties, app-events, ux-events, critter, shared-state, findings, daily-plan-read, members, evidence-ingest, storage-location, preservation, harvests, facebook-share, photocdn-derivative]
      # Prod's matrix (deploy-lambda.yml) runs all 26 in one wave with no cap and has met no Lambda
      # control-plane limit, so the cap here is only pacing.
      max-parallel: 8
      fail-fast: false

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.dev_sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc  # read from the checked-out tree; must name the Lambda runtime's major (lambda-config-expected.json)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::769788341849:role/garden-app-github-deploy-staging
          aws-region: us-east-1

      # Byte-identical to deploy-lambda.yml's step (scripts/test_workflow_steps.py), so staging runs the zip prod gets.
      # The script comes from the dev_sha checkout: a dev_sha older than the script's commit lacks it and fails here.
      - name: Build and zip ${{ matrix.function }}
        env:
          FN: ${{ matrix.function }}
        run: bash scripts/package-lambda.sh "$FN"

      # Mirrors deploy-lambda.yml's "Ensure declared runtime" (body byte-identical, pinned by
      # scripts/test_ensure_runtime_step.py): update-function-code never touches Runtime, so this moves an
      # existing staging function to the runtime the prod manifest declares for its prod twin (KEY). Runtime
      # only, no env map; before the code update. Hard-fails on purpose (prod's copy is continue-on-error):
      # nothing asserts staging config afterwards, and staging is where the runtime is proven, so a red leg
      # here correctly stops the promote's staging gate.
      - name: Ensure declared runtime on ${{ matrix.function }}-staging
        env:
          FN: garden-${{ matrix.function }}-staging
          KEY: garden-${{ matrix.function }}
        run: |
          set -euo pipefail
          WANT=$(jq -er --arg f "$KEY" '.[$f].runtime' scripts/lambda-config-expected.json) \
            || { echo "::error::$KEY: no runtime declared in scripts/lambda-config-expected.json"; exit 1; }
          ERR=$(mktemp)
          if ! CUR=$(aws lambda get-function-configuration --function-name "$FN" --query Runtime --output text 2>"$ERR"); then
            if grep -q ResourceNotFoundException "$ERR"; then echo "$FN does not exist yet: its create step sets the runtime, and the next deploy applies $WANT if that differs"; exit 0; fi
            cat "$ERR"; echo "::error::$FN: could not read Runtime; left unchanged"; exit 1
          fi
          if [ "$CUR" = "$WANT" ]; then echo "$FN already on $WANT"; exit 0; fi
          echo "Moving $FN runtime $CUR -> $WANT"
          if ! aws lambda update-function-configuration --function-name "$FN" --runtime "$WANT" >/dev/null; then
            echo "::error::$FN: runtime update to $WANT refused"; exit 1
          fi
          if ! aws lambda wait function-updated --function-name "$FN"; then
            echo "::error::$FN: did not settle after the runtime update to $WANT"; exit 1
          fi
          GOT=$(aws lambda get-function-configuration --function-name "$FN" --query '[Runtime,LastUpdateStatus]' --output text)
          if [ "$GOT" != "$(printf '%s\tSuccessful' "$WANT")" ]; then echo "::error::$FN: Runtime/LastUpdateStatus read '$GOT' after the update, want $WANT/Successful"; exit 1; fi
          echo "$FN runtime $WANT"

      - name: Deploy or create ${{ matrix.function }}-staging
        # Mirrors deploy-lambda.yml's create-or-update: existing functions update; missing ones are created
        # with default config. Staging functions run as garden-app-lambda-exec-staging (staging secrets,
        # garden-photos-staging, staging log groups), never the prod exec role, which reads prod's secrets
        # bundle. The update path never sets Role.
        if: matrix.function != 'photocdn-derivative'
        run: |
          FN="garden-${{ matrix.function }}-staging"
          ZIP_FILE="fileb://lambda/${{ matrix.function }}.zip"
          if aws lambda get-function --function-name "$FN" 2>/dev/null; then
            echo "Updating existing function: $FN"
            aws lambda wait function-updated --function-name "$FN"  # settle a runtime move first (normally a no-op)
            aws lambda update-function-code \
              --function-name "$FN" \
              --zip-file "$ZIP_FILE"
          else
            echo "Creating new function: $FN"
            RT=$(jq -er --arg f "garden-${{ matrix.function }}" '.[$f].runtime' scripts/lambda-config-expected.json) \
              || { echo "::error::$FN: no runtime declared in scripts/lambda-config-expected.json"; exit 1; }
            aws lambda create-function \
              --function-name "$FN" \
              --runtime "$RT" \
              --handler index.handler \
              --role arn:aws:iam::769788341849:role/garden-app-lambda-exec-staging \
              --zip-file "$ZIP_FILE" \
              --timeout 30 \
              --memory-size 256 \
              --environment 'Variables={SECRET_NAME=garden-app/secrets-staging}'
          fi

      - name: Deploy or create photocdn-derivative-staging (nodejs22.x / arm64)
        # The prod function is created by infra/photocdn.yaml (CFN), not by a deploy workflow —
        # deploy-lambda.yml only ever update-function-code's it, so its create branch has never run
        # for this function and would produce the wrong shape. There is no staging CFN stack, so the
        # create branch here reproduces the CFN properties by hand (its runtime literal is coupled to the manifest's
        # garden-photocdn-derivative `runtime` and infra/photocdn.yaml: change all three together): nodejs22.x + arm64 (an x86_64
        # function module-load-fails on the arm64 sharp zip) and MemorySize 2048.
        # ORIGINALS_BUCKET is set AT CREATE rather than left to the config step below because
        # index.mjs defaults it to 'garden-photos-prod' — an unset staging function reads PROD
        # originals. SECRET_NAME is not passed: this function touches neither Neon nor Clerk.
        if: matrix.function == 'photocdn-derivative'
        run: |
          FN="garden-photocdn-derivative-staging"
          ZIP_FILE="fileb://lambda/photocdn-derivative.zip"
          if aws lambda get-function --function-name "$FN" 2>/dev/null; then
            echo "Updating existing function: $FN"
            aws lambda update-function-code \
              --function-name "$FN" \
              --zip-file "$ZIP_FILE"
          else
            echo "Creating new function: $FN"
            aws lambda create-function \
              --function-name "$FN" \
              --runtime nodejs22.x \
              --architectures arm64 \
              --handler index.handler \
              --role arn:aws:iam::769788341849:role/garden-app-lambda-exec-staging \
              --zip-file "$ZIP_FILE" \
              --timeout 30 \
              --memory-size 2048 \
              --environment 'Variables={ORIGINALS_BUCKET=garden-photos-staging}'
          fi

      - name: Wait for ${{ matrix.function }}-staging
        # function-updated keys off LastUpdateStatus, which is not the gate after a CREATE: State is, and
        # State is what the health check below asserts, so wait on both. On the update path State never
        # leaves Active on these non-VPC functions, so function-active matches on its first poll and adds no
        # delay. On a net-new leg function-active is the wait that matters (the Pending -> health-check race).
        run: |
          FN="garden-${{ matrix.function }}-staging"
          aws lambda wait function-active --function-name "$FN"
          aws lambda wait function-updated --function-name "$FN"
          echo "$FN active"

      - name: Health check ${{ matrix.function }}-staging
        run: |
          FN="garden-${{ matrix.function }}-staging"
          STATE=$(aws lambda get-function-configuration \
            --function-name "$FN" \
            --query 'State' --output text)
          [[ "$STATE" == "Active" ]] || { echo "FATAL: $FN state=$STATE (expected Active)"; exit 1; }
          echo "✅ $FN is $STATE"

      - name: Assert staging exec role on ${{ matrix.function }}-staging
        # A staging function on the prod exec role can read prod's secrets bundle.
        # Read-only. Reds the leg on drift; repair is by hand (this deploy role cannot pass the prod role).
        run: |
          set -euo pipefail
          FN="garden-${{ matrix.function }}-staging"
          WANT="arn:aws:iam::769788341849:role/garden-app-lambda-exec-staging"
          GOT=$(aws lambda get-function-configuration --function-name "$FN" --query Role --output text)
          if [ "$GOT" != "$WANT" ]; then echo "::error::$FN runs as $GOT, want $WANT"; exit 1; fi
          echo "$FN role ok"

      - name: Ensure S3_PHOTOS_BUCKET env for ${{ matrix.function }}-staging
        # Idempotent: only updates if the value differs. Mirrors deploy-lambda.yml. The photo-enriching
        # Lambdas sign S3 GET URLs for featured_photo_view_url, and create-function above sets only
        # SECRET_NAME, so without this a net-new staging Lambda returns view_url=null for every photo.
        if: contains(fromJSON('["plants","projects","locations","inventory-items","photos"]'), matrix.function)
        run: |
          FN="garden-${{ matrix.function }}-staging"
          EXPECTED="garden-photos-staging"
          CURRENT=$(aws lambda get-function-configuration \
            --function-name "$FN" \
            --query 'Environment.Variables.S3_PHOTOS_BUCKET' --output text 2>/dev/null || echo "None")
          if [[ "$CURRENT" == "$EXPECTED" ]]; then
            echo "S3_PHOTOS_BUCKET already correct on $FN"
          else
            echo "Setting S3_PHOTOS_BUCKET=$EXPECTED on $FN (was: $CURRENT)"
            # OPS-STAGINGENVREAD-001 (staging port of deploy-lambda.yml's OPS-LAMBDAENVWIPE-001): test the
            # read's EXIT STATUS. `|| echo "{}"` turned a failed read (throttle, transient error) into an
            # empty merge base, and the update below is SET-not-MERGE, so it replaced the function's whole
            # environment with the one key this step adds — SECRET_NAME gone. Emptiness is NOT the signal:
            # a function with no env reads back as `null` at exit 0 and jq merges onto it correctly. Nor is
            # a net-new leg a reason to start from empty: the function was created (with SECRET_NAME) and
            # read by the health check before this step runs.
            # This step has NO continue-on-error, so a failed read warns and SKIPS the write rather than
            # exiting 1 — refusing to destroy an env map must not newly red an otherwise good leg, and the
            # next staging deploy runs this step again. The exception is ResourceNotFoundException: the
            # function is gone, the update below always failed on that, and it still stops the leg.
            if ! EXISTING=$(aws lambda get-function-configuration \
              --function-name "$FN" --query 'Environment.Variables' --output json 2>/tmp/env-read-err); then
              CAUSE=$(tr -s '\r\n' '  ' </tmp/env-read-err | sed -e 's/^ //' -e 's/ $//' | cut -c1-400)
              if grep -q 'ResourceNotFoundException' /tmp/env-read-err; then
                echo "::error::$FN does not exist (${CAUSE:-no error text}) though the health check above just read it; nothing written."
                exit 1
              fi
              echo "::warning::could not read env for $FN (${CAUSE:-no error text}); skipping S3_PHOTOS_BUCKET write rather than risking a wipe"
              exit 0
            fi
            UPDATED=$(echo "$EXISTING" | jq --arg b "$EXPECTED" '. + {S3_PHOTOS_BUCKET: $b}')
            echo "{\"Variables\": $UPDATED}" > /tmp/env-photos-bucket.json
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --environment file:///tmp/env-photos-bucket.json >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "S3_PHOTOS_BUCKET=$EXPECTED on $FN"
          fi

      - name: Ensure ADMIN_CLERK_SUBS env for ux-events-staging
        if: matrix.function == 'ux-events'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on staging deploy role
        run: |
          FN="garden-ux-events-staging"
          EXPECTED="user_3D2gM0hIl03gjW3JM2DjtPzm0jI,${{ secrets.CLERK_TEST_USER_ID }}"
          CURRENT=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables.ADMIN_CLERK_SUBS' --output text 2>/dev/null || echo "None")
          if [[ "$CURRENT" == "$EXPECTED" ]]; then
            echo "ADMIN_CLERK_SUBS already correct on $FN"
          else
            # OPS-STAGINGENVREAD-001: test EXIT STATUS, not emptiness (rationale on the S3_PHOTOS_BUCKET
            # step). This step is continue-on-error, so bailing leaves the live config untouched.
            if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables' --output json 2>/tmp/env-read-err); then
              CAUSE=$(tr -s '\r\n' '  ' </tmp/env-read-err | sed -e 's/^ //' -e 's/ $//' | cut -c1-400)
              echo "::warning::could not read env for $FN (${CAUSE:-no error text}); leaving ADMIN_CLERK_SUBS untouched rather than risking a wipe"
              exit 1
            fi
            UPDATED=$(echo "$EXISTING" | jq --arg v "$EXPECTED" '. + {ADMIN_CLERK_SUBS: $v}')
            echo "{\"Variables\": $UPDATED}" > /tmp/env-ux-admin-staging.json
            aws lambda update-function-configuration --function-name "$FN" --environment file:///tmp/env-ux-admin-staging.json >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "ADMIN_CLERK_SUBS set on $FN"
          fi

      - name: Ensure ADMIN_CLERK_SUBS env for varieties-staging
        # The crop-type retire, restore and admin-listing routes fail closed
        # without it. Carries the smoke's CLERK_TEST_USER_ID alongside Dave (the ux-events-staging
        # convention above), so the smoke's block V can walk retire -> read back -> restore.
        if: matrix.function == 'varieties'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on staging deploy role
        run: |
          FN="garden-varieties-staging"
          EXPECTED="user_3D2gM0hIl03gjW3JM2DjtPzm0jI,${{ secrets.CLERK_TEST_USER_ID }}"
          CURRENT=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables.ADMIN_CLERK_SUBS' --output text 2>/dev/null || echo "None")
          if [[ "$CURRENT" == "$EXPECTED" ]]; then
            echo "ADMIN_CLERK_SUBS already correct on $FN"
          else
            # OPS-STAGINGENVREAD-001: test EXIT STATUS, not emptiness (rationale on the S3_PHOTOS_BUCKET
            # step). This step is continue-on-error, so bailing leaves the live config untouched.
            if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables' --output json 2>/tmp/env-read-err); then
              CAUSE=$(tr -s '\r\n' '  ' </tmp/env-read-err | sed -e 's/^ //' -e 's/ $//' | cut -c1-400)
              echo "::warning::could not read env for $FN (${CAUSE:-no error text}); leaving ADMIN_CLERK_SUBS untouched rather than risking a wipe"
              exit 1
            fi
            UPDATED=$(echo "$EXISTING" | jq --arg v "$EXPECTED" '. + {ADMIN_CLERK_SUBS: $v}')
            echo "{\"Variables\": $UPDATED}" > /tmp/env-varieties-admin-staging.json
            aws lambda update-function-configuration --function-name "$FN" --environment file:///tmp/env-varieties-admin-staging.json >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "ADMIN_CLERK_SUBS set on $FN"
          fi

      # Every function that reads GARDEN_HOUSEHOLD_IDS gets it from ONE source, this environment's
      # GARDEN_HOUSEHOLD_IDS secret; no value is in the repo. The URL handlers' SEC-13a household gate fails
      # closed (403) without it. The step never shrinks a live list: a list wider than the secret is a hand
      # widening (the lockout undo) and is kept with a warning, and a list naming different members is
      # refused. It prints no entry, only counts and a sha256 prefix, because these logs are public.
      # Read-merge, as every env step here (--environment is SET-not-MERGE). It runs AFTER the code update,
      # so it is the backstop: set the list live before code that needs it ships. The run body is
      # byte-identical in deploy-lambda.yml and deploy-staging.yml (scripts/test_check_lambda_config.py)
      # and is executed against a stub aws by scripts/test_deploy_staging_env.py.
      - name: Ensure GARDEN_HOUSEHOLD_IDS env for household-scoped staging fns (read-merge)
        if: matrix.function == 'projects' || matrix.function == 'plants' || matrix.function == 'locations' || matrix.function == 'events' || matrix.function == 'favorites' || matrix.function == 'photos' || matrix.function == 'dashboard' || matrix.function == 'inventory-items' || matrix.function == 'varieties' || matrix.function == 'app-events' || matrix.function == 'ux-events' || matrix.function == 'critter' || matrix.function == 'shared-state' || matrix.function == 'findings' || matrix.function == 'daily-plan-read' || matrix.function == 'members' || matrix.function == 'evidence-ingest' || matrix.function == 'storage-location' || matrix.function == 'preservation' || matrix.function == 'harvests' || matrix.function == 'facebook-share'
        continue-on-error: true  # requires lambda:Get/UpdateFunctionConfiguration on staging deploy role
        env:
          FN: garden-${{ matrix.function }}-staging
          HH_CANON: ${{ secrets.GARDEN_HOUSEHOLD_IDS }}
        run: |
          set -o pipefail
          HH=$(printf '%s' "${HH_CANON:-}" | tr -d '\r\n')
          if [ -z "$(printf '%s' "$HH" | tr -d ', \t')" ]; then
            echo "::error::$FN: this environment's GARDEN_HOUSEHOLD_IDS secret is empty or missing; nothing written"
            exit 1
          fi
          ids() { printf '%s\n' "$1" | tr ',' '\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' | LC_ALL=C sort -u; }
          mask() { while IFS= read -r e; do echo "::add-mask::$e"; done; }
          CANON=$(ids "$HH")
          printf '%s\n' "$CANON" | mask
          # OPS-LAMBDAENVWIPE-001: test the read's EXIT STATUS, never emptiness. A function with no env reads
          # back `null` at exit 0 and merges correctly; a failed read must never become an empty merge base.
          if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" \
            --query 'Environment.Variables' --output json 2>/tmp/env-read-err); then
            CAUSE=$(tr -s '\r\n' '  ' </tmp/env-read-err | sed -e 's/^ //' -e 's/ $//' | cut -c1-400)
            echo "::warning::could not read env for $FN (${CAUSE:-no error text}); leaving GARDEN_HOUSEHOLD_IDS untouched rather than risking a wipe"
            exit 1
          fi
          LIVE_RAW=$(printf '%s' "$EXISTING" | jq -r '(. // {}).GARDEN_HOUSEHOLD_IDS // ""')
          LIVE=$(ids "$LIVE_RAW")
          if [ -n "$LIVE" ]; then printf '%s\n' "$LIVE" | mask; fi
          if [ -z "$LIVE" ]; then
            VERDICT=added
          elif [ "$LIVE" = "$CANON" ]; then
            if [ "$LIVE_RAW" = "$HH" ]; then VERDICT=same; else VERDICT=normalized; fi
          else
            ONLY_LIVE=$(LC_ALL=C comm -23 <(printf '%s\n' "$LIVE") <(printf '%s\n' "$CANON"))
            ONLY_CANON=$(LC_ALL=C comm -13 <(printf '%s\n' "$LIVE") <(printf '%s\n' "$CANON"))
            if [ -z "$ONLY_LIVE" ]; then VERDICT=widened
            elif [ -z "$ONLY_CANON" ]; then VERDICT=live-wider
            else VERDICT=differ; fi
          fi
          N=$(printf '%s\n' "$CANON" | wc -l | tr -d ' ')
          SUM=$(printf '%s' "$HH" | sha256sum | cut -c1-12)
          case "$VERDICT" in
            same)
              echo "GARDEN_HOUSEHOLD_IDS already correct on $FN ($N entries, sha256 $SUM)"
              exit 0 ;;
            live-wider)
              echo "::warning::$FN carries a wider GARDEN_HOUSEHOLD_IDS than this environment's secret (a hand widening?): kept, because a deploy never shrinks the list. Update the secret to match."
              exit 0 ;;
            differ)
              echo "::error::$FN: its GARDEN_HOUSEHOLD_IDS and this environment's secret name different members. Nothing written: a person decides which list is right."
              exit 1 ;;
          esac
          UPDATED=$(echo "$EXISTING" | jq --arg v "$HH" '. + {GARDEN_HOUSEHOLD_IDS: $v}')
          echo "{\"Variables\": $UPDATED}" > "/tmp/env-$FN-household.json"
          aws lambda update-function-configuration \
            --function-name "$FN" --environment "file:///tmp/env-$FN-household.json" >/dev/null
          aws lambda wait function-updated --function-name "$FN"
          rm -f "/tmp/env-$FN-household.json"
          echo "GARDEN_HOUSEHOLD_IDS $VERDICT on $FN ($N entries, sha256 $SUM)"

      - name: Ensure facebook-share-staging config (admin + bucket + secret; read-merge)
        # Staging mirror of deploy-lambda.yml's "Ensure facebook-share config" step.
        # READ-MERGE is mandatory: --environment is set-not-merge and a naive set would wipe the
        # SECRET_NAME written at create.
        # S3_PHOTOS_BUCKET is not optional — lambda/facebook-share/index.js throws at MODULE LOAD
        # when it is unset, so without this step every staging invoke 502s on init.
        # ADMIN_CLERK_SUBS carries the smoke's CLERK_TEST_USER_ID alongside Dave (same convention as
        # the ux-events-staging step above): the endpoint is admin-gated, so an authed smoke call
        # from the test user would otherwise 403.
        # FB_SHARE_ENABLED stays UNSET — kill switch OFF, exactly as in prod. Note the handler checks
        # auth (401) and admin (403) BEFORE the switch, so an unauthenticated reachability probe still
        # gets a clean 4xx and never reaches Facebook.
        # FB_SECRET_NAME points at a STAGING-scoped secret name on purpose: staging must never hold
        # the token for the real Facebook Page.
        if: matrix.function == 'facebook-share'
        continue-on-error: true  # requires lambda:Get/UpdateFunctionConfiguration on staging deploy role
        run: |
          FN="garden-facebook-share-staging"
          # OPS-STAGINGENVREAD-001: test EXIT STATUS, not emptiness (rationale on the S3_PHOTOS_BUCKET
          # step). This step reads and SETS on every deploy, and a merge onto "{}" would drop SECRET_NAME
          # and whatever was set by hand. It is continue-on-error, so bailing leaves the config untouched.
          if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" \
            --query 'Environment.Variables' --output json 2>/tmp/env-read-err); then
            CAUSE=$(tr -s '\r\n' '  ' </tmp/env-read-err | sed -e 's/^ //' -e 's/ $//' | cut -c1-400)
            echo "::warning::could not read env for $FN (${CAUSE:-no error text}); leaving config untouched rather than risking a wipe"
            exit 1
          fi
          UPDATED=$(echo "$EXISTING" | jq \
            --arg b "garden-photos-staging" \
            --arg a "user_3D2gM0hIl03gjW3JM2DjtPzm0jI,${{ secrets.CLERK_TEST_USER_ID }}" \
            --arg s "garden-app/facebook-page-token-staging" \
            '. + {S3_PHOTOS_BUCKET:$b, ADMIN_CLERK_SUBS:$a, FB_SECRET_NAME:$s}')
          echo "{\"Variables\": $UPDATED}" > /tmp/env-fbshare-staging.json
          aws lambda update-function-configuration --function-name "$FN" \
            --environment file:///tmp/env-fbshare-staging.json --timeout 60 --memory-size 512 >/dev/null
          aws lambda wait function-updated --function-name "$FN"
          echo "facebook-share-staging config ensured (admin; bucket; secret; 512MB/60s)"

      - name: Ensure photocdn-derivative-staging config (buckets; read-merge)
        # ORIGINALS_BUCKET is re-asserted on every deploy, not just at create: index.mjs falls back to
        # 'garden-photos-prod' when it is unset, so a wiped env would silently point the staging
        # function at PROD originals.
        # DERIVATIVES_BUCKET has no staging counterpart — the derivatives bucket, its policy, the
        # CloudFront distro and the signing key group are all created by infra/photocdn.yaml, which is
        # a PROD-ONLY stack. It is therefore left unset and warned about: derivative WRITES stay inert
        # on staging while the arm64 self-test below still proves the package loads.
        if: matrix.function == 'photocdn-derivative'
        continue-on-error: true  # requires lambda:Get/UpdateFunctionConfiguration on staging deploy role
        run: |
          FN="garden-photocdn-derivative-staging"
          # OPS-STAGINGENVREAD-001: test EXIT STATUS, not emptiness (rationale on the S3_PHOTOS_BUCKET
          # step). This step is continue-on-error, so bailing leaves the live config untouched.
          if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" \
            --query 'Environment.Variables' --output json 2>/tmp/env-read-err); then
            CAUSE=$(tr -s '\r\n' '  ' </tmp/env-read-err | sed -e 's/^ //' -e 's/ $//' | cut -c1-400)
            echo "::warning::could not read env for $FN (${CAUSE:-no error text}); leaving ORIGINALS_BUCKET untouched rather than risking a wipe"
            exit 1
          fi
          UPDATED=$(echo "$EXISTING" | jq --arg o "garden-photos-staging" '. + {ORIGINALS_BUCKET:$o}')
          echo "{\"Variables\": $UPDATED}" > /tmp/env-photocdn-staging.json
          aws lambda update-function-configuration --function-name "$FN" \
            --environment file:///tmp/env-photocdn-staging.json >/dev/null
          aws lambda wait function-updated --function-name "$FN"
          echo "ORIGINALS_BUCKET=garden-photos-staging ensured on $FN"
          D=$(echo "$UPDATED" | jq -r '.DERIVATIVES_BUCKET // empty')
          if [[ -z "$D" ]]; then
            echo "::warning::$FN has no DERIVATIVES_BUCKET — no staging derivatives bucket exists (infra/photocdn.yaml is prod-only). Derivative writes are inert on staging; the arm64 self-test still runs."
          fi

      - name: Ensure Function URL exists for ${{ matrix.function }}-staging
        # First-deploy support: mirror deploy-lambda.yml Function URL creation step.
        # Existing URLs unchanged; missing URLs created with public access (handler owns CORS).
        # photocdn-derivative is excluded here and from the CORS step below: it is INTERNAL-INVOKE
        # ONLY (infra/photocdn.yaml: no public AuthType-NONE URL), same as in prod.
        if: matrix.function != 'photocdn-derivative'
        continue-on-error: true  # requires lambda:CreateFunctionUrlConfig + AddPermission on staging deploy role
        run: |
          FN="garden-${{ matrix.function }}-staging"
          if aws lambda get-function-url-config --function-name "$FN" 2>/dev/null; then
            echo "Function URL already exists for $FN"
          else
            # OPS-STAGINGFIRSTCREATE-001: record that this leg had NO URL before this run, so the
            # CORS step below can tell "net-new create did not land" (skip loudly) from "a
            # pre-existing URL vanished" (hard stop). Written before the attempts so it is set even
            # if all of them fail.
            echo "URL_WAS_NET_NEW=true" >> "$GITHUB_ENV"
            echo "Creating Function URL for $FN"
            # Create-branch only, unreachable for an existing URL. This is the one call on a net-new
            # leg that races the function itself settling, so it gets bounded retries rather than one
            # shot — a single transient here used to resurface as a ResourceNotFoundException in the
            # hard-failing CORS step below.
            for ATTEMPT in 1 2 3; do
              if aws lambda create-function-url-config \
                --function-name "$FN" \
                --auth-type NONE \
                --cors '{"AllowOrigins":["*"],"AllowMethods":["*"],"AllowHeaders":["*"]}'; then
                break
              fi
              echo "create-function-url-config attempt $ATTEMPT failed for $FN"
              sleep 10
            done
            aws lambda add-permission \
              --function-name "$FN" \
              --statement-id FunctionURLAllowPublicAccess \
              --action lambda:InvokeFunctionUrl \
              --principal "*" \
              --function-url-auth-type NONE 2>/dev/null || true
            # Since Oct 2025 a URL needs both grants. The InvokeFunction grant carries
            # lambda:InvokedViaFunctionUrl=true, so it cannot be used to invoke the function directly (SEC-09).
            aws lambda add-permission \
              --function-name "$FN" \
              --statement-id AllowInvokeViaFunctionUrl \
              --action lambda:InvokeFunction \
              --principal "*" \
              --invoked-via-function-url
          fi
          # Ship-then-wire: a net-new staging function's URL is not knowable until this step creates
          # it. Echo it so it can be pasted into the STAGING_API_* block at the top of this file
          # (how STAGING_API_FACEBOOK_SHARE was wired, after its first run).
          if ! aws lambda get-function-url-config --function-name "$FN" --query 'FunctionUrl' --output text; then
            echo "::error::$FN — no Function URL readable after this step (never created, or GetFunctionUrlConfig failing). Its staging surface is unreachable and STAGING_API_* for it cannot be wired. Check lambda:CreateFunctionUrlConfig on garden-app-github-deploy-staging."
            exit 1
          fi

      - name: Restore staging Lambda CORS
        if: matrix.function != 'photocdn-derivative'  # no Function URL to configure
        # This step hard-fails while the URL-creating step above is continue-on-error, so the two cases are
        # told apart by URL_WAS_NET_NEW, which only that step's create branch sets: a never-created URL is
        # loud but non-blocking (the function had no URL before this run either, and an IAM gap there must
        # not red the gate), while a pre-existing URL going missing still hard-stops.
        run: |
          FN="garden-${{ matrix.function }}-staging"
          if ! aws lambda get-function-url-config --function-name "$FN" >/dev/null 2>/tmp/url-probe-err; then
            if grep -q 'ResourceNotFoundException' /tmp/url-probe-err; then
              if [[ "${URL_WAS_NET_NEW:-}" == "true" ]]; then
                echo "::error::$FN — net-new Function URL was not created by the step above (it is continue-on-error; its log has the cause). CORS skipped. The function had no URL before this run either, so this is not a regression and does not red the gate."
                exit 0
              fi
              echo "::error::$FN had a Function URL when the step above ran and does not now — refusing to continue."
              exit 1
            fi
            # Any other probe failure (throttle, transient API error) falls through to the update
            # call below, which is exactly what this step did before the probe existed.
            cat /tmp/url-probe-err
          fi
          CORS='{"AllowCredentials":false,"AllowHeaders":["authorization","content-type"],"AllowMethods":["GET","POST","PUT","DELETE","PATCH"],"AllowOrigins":["${{ env.STAGING_CF_ORIGIN }}"],"ExposeHeaders":[],"MaxAge":300}'
          aws lambda update-function-url-config \
            --function-name "$FN" \
            --region us-east-1 \
            --cors "$CORS" \
            --query 'Cors.AllowOrigins[0]' --output text

      - name: Verify photocdn-derivative-staging (arm64 self-test + no public URL)
        if: matrix.function == 'photocdn-derivative'
        run: |
          # OPS-STAGINGFIRSTCREATE-001: the config step above is continue-on-error, so if its own
          # post-update wait is what failed, this invoke lands mid-update and 409s
          # (ResourceConflictException) on a HARD step. Re-wait — a no-op when nothing is in flight.
          aws lambda wait function-updated --function-name garden-photocdn-derivative-staging
          # (a) The whole point of OPS-STAGINGMATRIX-001 for this function: prove the arm64 package
          # actually loads on Lambda BEFORE the identical zip goes to prod. The /d/__selftest__ route
          # touches neither S3 nor the DB, so it works with the generic staging exec role.
          # A missing lambda:InvokeFunction on the staging deploy role degrades to a warning — an IAM
          # gap must not red the promote gate — but a self-test that RUNS and fails is a hard stop.
          if aws lambda invoke --function-name garden-photocdn-derivative-staging \
               --cli-binary-format raw-in-base64-out \
               --payload '{"rawPath":"/d/__selftest__"}' /tmp/selftest-staging.json >/dev/null 2>/tmp/selftest-err; then
            cat /tmp/selftest-staging.json
            python3 -c "import json,sys; d=json.load(open('/tmp/selftest-staging.json')); b=json.loads(d['body']); assert b.get('sharp_ok') and b.get('blurhash_ok') and b.get('heif_input') and b.get('arch')=='arm64', 'self-test failed: '+str(b); print('self-test OK', b)"
          elif grep -qiE 'accessdenied|not authorized' /tmp/selftest-err; then
            cat /tmp/selftest-err
            echo "::warning::staging deploy role lacks lambda:InvokeFunction on garden-photocdn-derivative-staging — arm64 self-test SKIPPED. Grant it to make this leg meaningful."
          else
            cat /tmp/selftest-err
            echo "::error::garden-photocdn-derivative-staging self-test invoke failed"
            exit 1
          fi
          # (b) spec-B2 mirror: assert no public Function URL exists on staging either. The step above
          # skips this function; this catches drift from a manual create or an older workflow run.
          if aws lambda get-function-url-config --function-name garden-photocdn-derivative-staging 2>/dev/null; then
            echo "::error::photocdn-derivative-staging has a Function URL — spec-B2 forbids a public surface"
            exit 1
          fi
          echo "verified: no Function URL on garden-photocdn-derivative-staging"

  deploy-frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: staging  # OIDC subject claim for garden-app-github-deploy-staging trust
    needs: deploy-lambdas
    outputs:
      artifact-hash:   ${{ steps.build.outputs.artifact-hash }}
      asset-filename:  ${{ steps.build.outputs.asset-filename }}
      commit-sha:      ${{ steps.build.outputs.commit-sha }}
      sw-short-sha:    ${{ steps.build.outputs.sw-short-sha }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.dev_sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate env vars (staging)
        run: |
          # Ported from deploy.yml's prod Validate step. Staging previously had NO env validation,
          # which let deploy-staging.yml bake VITE_API_TAGS="" into every build unnoticed (the lone
          # `vars.STAGING_API_TAGS` typo referenced an undefined repo var). Hard-fail the core vars,
          # WARN the ship-then-wire optionals, and assert a staging (pk_test_*) Clerk key.
          # OPS-STAGINGAPIGAP-001 (2026-08-10): these two lists must between them name EVERY
          # VITE_API_* the app reads. Five did not appear in either one — MEMBERS, FINDINGS,
          # DAILY_PLAN_READ, ACHIEVEMENTS, FACEBOOK_SHARE — so the ship-then-wire guard could not
          # see them, they baked as relative /api/... paths, CloudFront served index.html, and the
          # client died on "Unexpected token '<'". A var absent from BOTH lists is the failure
          # mode; an empty var in the WARN list is a known, declared state.
          # Keep in sync with: rg -o 'VITE_API_[A-Z_]+' src/ --no-filename | sort -u
          for VAR in VITE_CLERK_PUBLISHABLE_KEY VITE_API_PROJECTS VITE_API_PLANTS VITE_API_LOCATIONS VITE_API_EVENTS VITE_API_FAVORITES VITE_API_PHOTOS VITE_API_DASHBOARD VITE_API_INVENTORY VITE_API_HARVESTS VITE_API_MEMBERS VITE_API_FINDINGS VITE_API_DAILY_PLAN_READ; do
            [[ -n "${!VAR}" ]] || { echo "ERROR: $VAR not set"; exit 1; }
          done
          for VAR in VITE_API_VARIETIES VITE_API_APP_EVENTS VITE_API_UX_EVENTS VITE_API_CRITTERS VITE_API_SHARED_STATE VITE_API_TAGS VITE_API_ACHIEVEMENTS VITE_API_FACEBOOK_SHARE; do
            [[ -n "${!VAR}" ]] || echo "WARN: $VAR not set — its UI will not work on staging until wired (ship-then-wire)"
          done
          [[ "$VITE_CLERK_PUBLISHABLE_KEY" == pk_test_* ]] || {
            echo "ERROR: VITE_CLERK_PUBLISHABLE_KEY must be pk_test_* for staging (got ${VITE_CLERK_PUBLISHABLE_KEY:0:12}...)"
            exit 1
          }
          echo "All staging VITE_ vars present and valid"
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ env.STAGING_CLERK_KEY }}
          VITE_API_PROJECTS:          ${{ env.STAGING_API_PROJECTS }}
          VITE_API_PLANTS:            ${{ env.STAGING_API_PLANTS }}
          VITE_API_LOCATIONS:         ${{ env.STAGING_API_LOCATIONS }}
          VITE_API_EVENTS:            ${{ env.STAGING_API_EVENTS }}
          VITE_API_FAVORITES:         ${{ env.STAGING_API_FAVORITES }}
          VITE_API_PHOTOS:            ${{ env.STAGING_API_PHOTOS }}
          VITE_API_DASHBOARD:         ${{ env.STAGING_API_DASHBOARD }}
          VITE_API_INVENTORY:         ${{ env.STAGING_API_INVENTORY }}
          VITE_API_VARIETIES:         ${{ env.STAGING_API_VARIETIES }}
          VITE_API_APP_EVENTS:        ${{ env.STAGING_API_APP_EVENTS }}
          VITE_API_UX_EVENTS:         ${{ env.STAGING_API_UX_EVENTS }}
          VITE_API_CRITTERS:          ${{ env.STAGING_API_CRITTERS }}
          VITE_API_SHARED_STATE:      ${{ env.STAGING_API_SHARED_STATE }}
          VITE_API_TAGS:              ${{ env.STAGING_API_TAGS }}
          VITE_API_PRESERVATION:      ${{ env.STAGING_API_PRESERVATION }}
          VITE_API_STORAGE_LOCATIONS: ${{ env.STAGING_API_STORAGE_LOCATIONS }}
          VITE_API_HARVESTS:          ${{ env.STAGING_API_HARVESTS }}
          VITE_API_MEMBERS:           ${{ env.STAGING_API_MEMBERS }}
          VITE_API_FINDINGS:          ${{ env.STAGING_API_FINDINGS }}
          VITE_API_DAILY_PLAN_READ:   ${{ env.STAGING_API_DAILY_PLAN_READ }}
          VITE_API_ACHIEVEMENTS:      ${{ env.STAGING_API_ACHIEVEMENTS }}
          VITE_API_FACEBOOK_SHARE:    ${{ env.STAGING_API_FACEBOOK_SHARE }}

      - name: Build (staging)
        id: build
        run: |
          # SW staleness fix (2.1.1): unique CACHE_VERSION per staging build (forces SW update -> purge old caches)
          # The short SHA is computed once and also handed to the smoke as an output, so the smoke
          # asserts the exact string stamped here rather than assuming an abbreviation length.
          SW_SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i -E "s/const CACHE_VERSION = '[^']*'/const CACHE_VERSION = 'vstg-${SW_SHORT_SHA}'/" public/sw.js
          grep -nE "^const CACHE_VERSION" public/sw.js
          npm run build
          ARTIFACT_HASH=$(sha256sum dist/index.html | awk '{print $1}')
          ASSET_FILE=$(ls dist/assets/index-*.js 2>/dev/null | head -1 | xargs -r basename || echo "")
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "artifact-hash=$ARTIFACT_HASH"  >> "$GITHUB_OUTPUT"
          echo "asset-filename=$ASSET_FILE"    >> "$GITHUB_OUTPUT"
          echo "commit-sha=$COMMIT_SHA"        >> "$GITHUB_OUTPUT"
          echo "sw-short-sha=$SW_SHORT_SHA"    >> "$GITHUB_OUTPUT"
          echo "Build artifact hash : $ARTIFACT_HASH"
          echo "Hashed asset file   : $ASSET_FILE"
          echo "Commit SHA          : $COMMIT_SHA"
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ env.STAGING_CLERK_KEY }}
          VITE_API_PROJECTS:          ${{ env.STAGING_API_PROJECTS }}
          VITE_API_PLANTS:            ${{ env.STAGING_API_PLANTS }}
          VITE_API_LOCATIONS:         ${{ env.STAGING_API_LOCATIONS }}
          VITE_API_EVENTS:            ${{ env.STAGING_API_EVENTS }}
          VITE_API_FAVORITES:         ${{ env.STAGING_API_FAVORITES }}
          VITE_API_PHOTOS:            ${{ env.STAGING_API_PHOTOS }}
          VITE_API_DASHBOARD:         ${{ env.STAGING_API_DASHBOARD }}
          VITE_API_INVENTORY:         ${{ env.STAGING_API_INVENTORY }}
          VITE_API_VARIETIES:         ${{ env.STAGING_API_VARIETIES }}
          VITE_API_APP_EVENTS:        ${{ env.STAGING_API_APP_EVENTS }}
          VITE_API_UX_EVENTS:         ${{ env.STAGING_API_UX_EVENTS }}
          VITE_API_CRITTERS:          ${{ env.STAGING_API_CRITTERS }}
          VITE_API_SHARED_STATE:      ${{ env.STAGING_API_SHARED_STATE }}
          VITE_API_TAGS:              ${{ env.STAGING_API_TAGS }}
          VITE_API_PRESERVATION:      ${{ env.STAGING_API_PRESERVATION }}
          VITE_API_STORAGE_LOCATIONS: ${{ env.STAGING_API_STORAGE_LOCATIONS }}
          VITE_API_HARVESTS:          ${{ env.STAGING_API_HARVESTS }}
          VITE_API_MEMBERS:           ${{ env.STAGING_API_MEMBERS }}
          VITE_API_FINDINGS:          ${{ env.STAGING_API_FINDINGS }}
          VITE_API_DAILY_PLAN_READ:   ${{ env.STAGING_API_DAILY_PLAN_READ }}
          VITE_API_ACHIEVEMENTS:      ${{ env.STAGING_API_ACHIEVEMENTS }}
          VITE_API_FACEBOOK_SHARE:    ${{ env.STAGING_API_FACEBOOK_SHARE }}

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo 'ERROR: dist/index.html missing'; exit 1; }
          # V4-KBVIEWPORT-001: guards the BUILT artifact (viewportMeta.static.test.js guards the
          # source). This is the staging leg, so it is also the gate that makes Dave's device pass
          # meaningful — if the key is missing here, nothing he observes on staging is valid.
          grep -q 'interactive-widget=resizes-content' dist/index.html || {
            echo 'ERROR: viewport interactive-widget lost in build (V4-KBVIEWPORT-001)'; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::769788341849:role/garden-app-github-deploy-staging
          aws-region: us-east-1

      - name: Deploy to S3 staging — hashed assets (immutable)
        run: |
          aws s3 sync dist/assets/ s3://${{ env.STAGING_S3_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive REPLACE

      - name: Deploy to S3 staging — root files (no-cache)
        run: |
          aws s3 sync dist/ s3://${{ env.STAGING_S3_BUCKET }}/ \
            --exclude "assets/*" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE \
            --delete

      - name: Invalidate staging CloudFront and wait for completion
        run: |
          set -uo pipefail
          # Bounded retry: a transient "Connect timeout on cloudfront.amazonaws.com" on the
          # create or the wait used to false-fail the run (promote #20). The wait is idempotent
          # — it re-polls the same invalidation to Completed, so retrying is safe. (OPS, L-166 family)
          INVAL_ID=""
          for attempt in 1 2 3 4 5; do
            INVAL_ID=$(aws cloudfront create-invalidation \
              --distribution-id ${{ env.STAGING_CF_DIST_ID }} \
              --paths "/index.html" \
              --query 'Invalidation.Id' --output text) && [ -n "$INVAL_ID" ] && break
            echo "  create-invalidation attempt $attempt failed (transient) — retry in $((attempt*10))s"
            sleep $((attempt*10))
          done
          [ -n "$INVAL_ID" ] || { echo "::error::could not create CF invalidation after retries"; exit 1; }
          echo "Waiting for invalidation $INVAL_ID to complete (edge flush, not just accepted)..."
          ok=0
          for attempt in 1 2 3 4 5; do
            if aws cloudfront wait invalidation-completed \
                 --distribution-id ${{ env.STAGING_CF_DIST_ID }} \
                 --id "$INVAL_ID"; then ok=1; break; fi
            echo "  wait attempt $attempt failed (transient CF/connect error) — retry in $((attempt*10))s"
            sleep $((attempt*10))
          done
          [ "$ok" = "1" ] || { echo "::error::CF invalidation $INVAL_ID did not complete after retries"; exit 1; }
          echo "✅ CF invalidation $INVAL_ID complete"

      - name: Verify CF edge serving new build [Boss condition 1]
        # Confirms CF is serving the just-deployed build, not a stale cached version.
        # Strategy: Vite bakes content hash into asset filenames; grep the served
        # index.html for the known hashed filename. Mismatch = stale edge cache.
        run: |
          ASSET_FILE="${{ steps.build.outputs.asset-filename }}"
          if [[ -z "$ASSET_FILE" ]]; then
            echo "WARNING: No hashed asset filename captured from build — skipping content verify"
            echo "         (This may mean the Vite build config changed asset naming conventions)"
          else
            echo "Verifying CF edge serves index.html referencing $ASSET_FILE..."
            CF_HTML=$(curl -sf --max-time 30 --connect-timeout 10 \
              "${{ env.STAGING_CF_ORIGIN }}/index.html") || {
              echo "FATAL: Could not fetch ${{ env.STAGING_CF_ORIGIN }}/index.html"
              exit 1
            }
            if grep -q "$ASSET_FILE" <<< "$CF_HTML"; then
              echo "✅ CF serving fresh build (found $ASSET_FILE in index.html)"
            else
              echo "FATAL: CF serving stale build — $ASSET_FILE not found in served index.html"
              echo "First 300 chars of CF response:"
              echo "${CF_HTML:0:300}"
              exit 1
            fi
          fi

  # Runs AFTER the frontend deploy so Lambda and DB changes are both live. Uses the isolated staging Neon
  # branch, never the prod DB.
  db-schema-check:
    runs-on: ubuntu-26.04
    needs: deploy-frontend
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.dev_sha || github.sha }}

      - name: Run schema integrity check
        # No postgresql-client install: the runner ships psql on PATH (18 on ubuntu-26.04), and psql,
        # unlike pg_dump/pg_restore, needs no major-version match with the PG 17 staging branch.
        run: bash tests/schema/check-schema.sh
        env:
          NEON_STAGING_URL: ${{ secrets.NEON_STAGING_URL }}

  # Phase 1: Lambda reachability (no auth; 4xx is fine, 5xx is not).
  # Phase 2: authenticated CRUD (needs CLERK_SECRET_KEY_STAGING + CLERK_TEST_USER_ID).
  smoke-tests:
    runs-on: ubuntu-26.04
    # deploy-frontend is listed for its OUTPUTS, not for ordering: it is
    # already a transitive ancestor (deploy-frontend -> db-schema-check -> here), so this edge adds
    # no wait and no new skip path, but WITHOUT it `needs.deploy-frontend` is not in this job's
    # needs context and COMMIT_SHA below silently resolved to "". Same pattern promote-gate.yml
    # uses at its `deploy` job, which lists resolve+promote purely to read their outputs.
    needs: [db-schema-check, deploy-frontend]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.dev_sha || github.sha }}

      - name: Run smoke tests
        run: bash tests/smoke/run-smoke.sh
        env:
          # Phase 1 (Lambda reachability) uses these — always set
          STAGING_API_PROJECTS:  ${{ env.STAGING_API_PROJECTS }}
          STAGING_API_PLANTS:    ${{ env.STAGING_API_PLANTS }}
          STAGING_API_LOCATIONS: ${{ env.STAGING_API_LOCATIONS }}
          STAGING_API_EVENTS:    ${{ env.STAGING_API_EVENTS }}
          STAGING_API_FAVORITES: ${{ env.STAGING_API_FAVORITES }}
          STAGING_API_PHOTOS:    ${{ env.STAGING_API_PHOTOS }}
          STAGING_API_DASHBOARD: ${{ env.STAGING_API_DASHBOARD }}
          # bar==Today equality smoke: staging daily-plan-read Function URL.
          # Set repo variable STAGING_API_DAILY_PLAN_READ to activate; unset -> graceful WARN-skip.
          STAGING_API_DAILY_PLAN: ${{ vars.STAGING_API_DAILY_PLAN_READ }}
          STAGING_API_SHARED_STATE: ${{ env.STAGING_API_SHARED_STATE }}
          STAGING_API_VARIETIES: ${{ env.STAGING_API_VARIETIES }}
          STAGING_API_INVENTORY: ${{ env.STAGING_API_INVENTORY }}
          STAGING_API_APP_EVENTS: ${{ env.STAGING_API_APP_EVENTS }}
          STAGING_API_UX_EVENTS: ${{ env.STAGING_API_UX_EVENTS }}
          STAGING_API_PRESERVATION: ${{ env.STAGING_API_PRESERVATION }}
          STAGING_API_STORAGE_LOCATIONS: ${{ env.STAGING_API_STORAGE_LOCATIONS }}
          STAGING_API_HARVESTS: ${{ env.STAGING_API_HARVESTS }}
          # Phase 1's check_reachable for facebook-share. Its handler
          # answers 401 for an unauthenticated request (auth is evaluated before the FB_SHARE_ENABLED
          # kill switch), which check_reachable counts as up.
          STAGING_API_FACEBOOK_SHARE: ${{ env.STAGING_API_FACEBOOK_SHARE }}
          COMMIT_SHA:            ${{ needs.deploy-frontend.outputs.commit-sha }}
          # The exact short SHA the Build step stamped into sw.js
          # (CACHE_VERSION = 'vstg-<this>'). Phase 1 re-reads $STAGING_CF_ORIGIN/sw.js and fails unless
          # it carries that stamp: proof of the SPA build only, not of the Lambda code.
          STAGING_BUILD_SHORT_SHA: ${{ needs.deploy-frontend.outputs.sw-short-sha }}
          STAGING_CF_ORIGIN:     ${{ env.STAGING_CF_ORIGIN }}
          # Phase 2 (authenticated CRUD) — set these GHA secrets to enable:
          # CLERK_SECRET_KEY_STAGING = sk_test_... (Clerk dev instance secret key)
          # CLERK_TEST_USER_ID       = user_...    (existing user in dev Clerk instance)
          CLERK_SECRET_KEY_STAGING: ${{ secrets.CLERK_SECRET_KEY_STAGING }}
          CLERK_TEST_USER_ID:       ${{ secrets.CLERK_TEST_USER_ID }}
          # The ship-gate smoke: Phase 2 (authed write-path) MUST run.
          # With this set, a missing Clerk secret or a failed session mint FAILS the job
          # (fail-closed) instead of vacuously passing on Phase-1 reachability alone.
          SMOKE_REQUIRE_AUTH: "1"
          # The same staging DSN the L-058 sweep below uses. Block D reads back,
          # through SQL, the cultivar care_profile that POST /api/varieties writes, because no API route
          # returns that row. Under SMOKE_REQUIRE_AUTH a missing value FAILS that assert, never skips it.
          NEON_STAGING_URL: ${{ secrets.NEON_STAGING_URL }}

      - name: L-058 smoke-test row hygiene cleanup
        # Hard-deletes the smoke's staging rows (L-058): the smoke's own cleanup goes through API DELETEs,
        # which are soft deletes, and VALIDATE trips on soft-deleted residue. if: always(), so residue is
        # cleaned even when the smoke fails. Every statement runs under ON_ERROR_STOP and a 23503 stops the
        # step with everything before it committed (and every later run fails on the same row), so ORDER IS
        # THE INVARIANT: children before parents, each RESTRICT or no-action key forcing a step:
        #   * Put-Up first: preservation_log (the jar) before storage_location (its place) and everything
        #     below, because preservation_log.storage_location_id, variety_id and photo_id have no ON DELETE
        #     action. Both match ONLY block N's markers ('smoke-test-putup-<run>', 'smoke-test-place-<run>'):
        #     a prefix, not '%smoke%', which would take a real "smoked paprika" jar or a place called
        #     "Smokehouse". preservation_source is written only by the /sources route, which the smoke never calls.
        #   * photos before event_log, plants and locations (photos.event_id, plant_id and location_id are
        #     RESTRICT), by every shape the event_log sweeps use. featured_photo_id / featured_image_id
        #     back-pointers are SET NULL, so no pre-nulling pass is needed.
        #   * harvest_log -> event_log (by project AND by plant: an event anchored only by plant_id would
        #     block the plants delete) -> entity_memory -> favorites -> plants -> inventory_items ->
        #     plant_varieties -> locations -> plant_projects. favorites.entity_id and event_batches.scope_json
        #     have no FK and are swept by smoke-project id.
        #   * care_profile before plant_varieties: scope_id has NO foreign key, so the variety delete would
        #     just orphan the smoke's cultivar profile, which v5-rekeystrand-001's guard counts.
        #   * Seed lots: plants go before inventory_items, yet a lot's parents point back at plants (through
        #     inventory_items.source_plant_id and seed_lot_parent_planting, both RESTRICT). So, ahead of the
        #     plants delete: the link rows of a smoke lot OR a smoke planting go first, in their own psql call;
        #     a lot NOT named smoke whose source_plant_id is a planting about to go has that pointer moved to
        #     its earliest remaining live parent (created_at, then id: the handler's rule) or to NULL, printed
        #     with RETURNING because it changes a row it does not delete (otherwise the lot keeps a live link
        #     row beside a NULL pointer, a row of the standing gate post_nonempty_set_has_a_cache); and the
        #     main chain clears source_plant_id on every smoke lot and every lot pointing at a doomed planting.
        #   * seed_lot_addition (a picking) before the link row it hangs on (parent_link_id is RESTRICT), by
        #     the link delete's own predicate.
        #   * seed_lot_stage_log before its lot (no ON DELETE action; POST /seed-stage adds a row on every
        #     call and the smoke's API delete is soft), by the lot delete's own predicate, so any staged smoke
        #     lot is covered.
        #   * MIXES: a blend's NAME is generated and can be renamed, so before any delete the ids of every mix
        #     with a component row touching a smoke-named variety (either side) are captured and appended to
        #     SMOKE_VARIETY_IDS. The cultivar entity, entity_tag and care_profile deletes take them too; the
        #     component rows and the mix rows are then deleted by id, after plants and inventory_items (both
        #     point at plant_varieties). The by-id arms are the only deletes here that can reach a variety NOT
        #     named smoke, so the captured ids are echoed first and the delete prints each row (RETURNING id, name).
        # WHY ONE TRANSACTION: the component delete and the mix delete share ONE psql -c string, which runs as
        # one transaction, so a mix loses its component rows and its own row together or not at all. Split, a
        # stop in between leaves a keyed mix with no live component (a row of the standing gate
        # post_blend_key_equals_live_components, reddening another workflow under the wrong name), and a mix
        # without components is never captured again.
        #
        # OPTIONAL TABLES: this file is read from dev, and staging can lack seed_lot_parent_planting,
        # variety_blend_component and seed_lot_addition (their migrations reach staging by hand, and a
        # rehearsed rollback removes them). Each one's presence is read once with to_regclass (NULL for a
        # missing relation, where a cast would raise 42P01), and its deletes and residue term run only when it
        # is there: plain SQL behind a shell test, not a DO block, so each statement prints its own row count.
        # Without the mix table the captured list is empty, and '{}'::uuid[] matches nothing. seed_lot_stage_log
        # has NO such test: the inventory list read joins it on every request, so a database without it fails
        # the smoke long before this step.
        #
        # RESIDUE: the closing check counts by the ids captured BEFORE the sweep (smoke variety, lot, planting
        # and mix ids), never by name: after the sweep no smoke row is left to join through. A global orphan
        # count is unusable (staging carries seeded orphan cultivar profiles that are not smoke rows). New
        # terms go LAST in the sum, so every earlier term reads as it always has.
        #
        # NOT SWEPT, on purpose: xp_events. A seed_saved event that names a lot is paid by a row whose
        # source_id is the LOT id; source_id has no foreign key, this sweep has never deleted the event-keyed
        # rows every other smoke event leaves, and deleting only these would hand the smoke user back part of
        # its daily allowance, which block U's comment says the smoke must not lean on.
        #
        # No apt install: the runner's psql (18 on ubuntu-26.04) needs no major-version match with PG 17.
        if: always()
        env:
          NEON_STAGING_URL: ${{ secrets.NEON_STAGING_URL }}
        run: |
          if [[ -z "$NEON_STAGING_URL" ]]; then
            echo "⚠ NEON_STAGING_URL secret not set — skipping L-058 cleanup"
            exit 0
          fi
          echo "🧹 L-058 cleanup sweep starting against staging Neon (FK-safe order)..."
          SMOKE_VARIETY_IDS=$(psql "$NEON_STAGING_URL" -v ON_ERROR_STOP=1 -At -c "SELECT COALESCE(string_agg(id::text, ','), '') FROM plant_varieties WHERE name ILIKE '%smoke%';")
          SEED_PARENT_TABLE=$(psql "$NEON_STAGING_URL" -v ON_ERROR_STOP=1 -At -c "SELECT to_regclass('public.seed_lot_parent_planting') IS NOT NULL;")
          SEED_ADDITION_TABLE=$(psql "$NEON_STAGING_URL" -v ON_ERROR_STOP=1 -At -c "SELECT to_regclass('public.seed_lot_addition') IS NOT NULL;")
          SMOKE_PARENT_KEYS=$(psql "$NEON_STAGING_URL" -v ON_ERROR_STOP=1 -At -c "SELECT COALESCE(string_agg(id::text, ','), '') FROM (SELECT id FROM inventory_items WHERE name ILIKE '%smoke%' UNION ALL SELECT id FROM plants WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%')) k;")
          BLEND_TABLE=$(psql "$NEON_STAGING_URL" -v ON_ERROR_STOP=1 -At -c "SELECT to_regclass('public.variety_blend_component') IS NOT NULL;")
          SMOKE_MIX_IDS=""
          BLEND_LEFT="0"
          if [[ "$BLEND_TABLE" == "t" ]]; then
            SMOKE_MIX_IDS=$(psql "$NEON_STAGING_URL" -v ON_ERROR_STOP=1 -At -c "SELECT COALESCE(string_agg(DISTINCT blend_variety_id::text, ','), '') FROM variety_blend_component WHERE blend_variety_id IN (SELECT id FROM plant_varieties WHERE name ILIKE '%smoke%') OR component_variety_id IN (SELECT id FROM plant_varieties WHERE name ILIKE '%smoke%');")
            if [[ -n "$SMOKE_MIX_IDS" ]]; then SMOKE_VARIETY_IDS="${SMOKE_VARIETY_IDS:+$SMOKE_VARIETY_IDS,}$SMOKE_MIX_IDS"; fi
            echo "  mix ids captured, before any delete: ${SMOKE_MIX_IDS:-none}"
            BLEND_LEFT="(SELECT COUNT(*) FROM variety_blend_component WHERE blend_variety_id = ANY('{$SMOKE_VARIETY_IDS}'::uuid[]) OR component_variety_id = ANY('{$SMOKE_VARIETY_IDS}'::uuid[]))"
          else
            echo "  variety_blend_component is not on this database (to_regclass: '$BLEND_TABLE') — no mix to sweep"
          fi
          SEED_PARENT_LEFT="0"
          SEED_ADDITION_LEFT="0"
          if [[ "$SEED_PARENT_TABLE" == "t" ]]; then
            if [[ "$SEED_ADDITION_TABLE" == "t" ]]; then
              psql "$NEON_STAGING_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM seed_lot_addition WHERE parent_link_id IN (SELECT id FROM seed_lot_parent_planting WHERE inventory_item_id IN (SELECT id FROM inventory_items WHERE name ILIKE '%smoke%') OR plant_id IN (SELECT id FROM plants WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%')));"
              SEED_ADDITION_LEFT="(SELECT COUNT(*) FROM seed_lot_addition WHERE parent_link_id IN (SELECT id FROM seed_lot_parent_planting WHERE inventory_item_id = ANY('{$SMOKE_PARENT_KEYS}'::uuid[]) OR plant_id = ANY('{$SMOKE_PARENT_KEYS}'::uuid[])))"
            fi
            psql "$NEON_STAGING_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM seed_lot_parent_planting WHERE inventory_item_id IN (SELECT id FROM inventory_items WHERE name ILIKE '%smoke%') OR plant_id IN (SELECT id FROM plants WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%'));"
            psql "$NEON_STAGING_URL" -v ON_ERROR_STOP=1 -c "UPDATE inventory_items i SET source_plant_id = (SELECT l.plant_id FROM seed_lot_parent_planting l WHERE l.inventory_item_id = i.id AND l.role = 'seed_parent' AND l.deleted_at IS NULL ORDER BY l.created_at, l.id LIMIT 1) WHERE i.name NOT ILIKE '%smoke%' AND i.source_plant_id IN (SELECT id FROM plants WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%')) RETURNING i.id, i.name, i.source_plant_id;"
            SEED_PARENT_LEFT="(SELECT COUNT(*) FROM seed_lot_parent_planting WHERE inventory_item_id = ANY('{$SMOKE_PARENT_KEYS}'::uuid[]) OR plant_id = ANY('{$SMOKE_PARENT_KEYS}'::uuid[]))"
          else
            echo "  seed_lot_parent_planting is not on this database (to_regclass: '$SEED_PARENT_TABLE') — no link rows to sweep"
          fi
          psql "$NEON_STAGING_URL" -v ON_ERROR_STOP=1 \
            -c "DELETE FROM preservation_log WHERE notes LIKE 'smoke-test-putup-%' OR storage_location_id IN (SELECT id FROM storage_location WHERE label LIKE 'smoke-test-place-%');" \
            -c "DELETE FROM storage_location WHERE label LIKE 'smoke-test-place-%';" \
            -c "DELETE FROM harvest_log    WHERE project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%');" \
            -c "DELETE FROM harvest_log    WHERE event_id IN (SELECT id FROM event_log WHERE plant_id IN (SELECT id FROM plants WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%')));" \
            -c "DELETE FROM share_log      WHERE photo_id IN (SELECT id FROM photos WHERE plant_id IN (SELECT id FROM plants WHERE name ILIKE '%smoke%') OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%') OR location_id IN (SELECT id FROM locations WHERE name ILIKE '%smoke%') OR inventory_item_id IN (SELECT id FROM inventory_items WHERE name ILIKE '%smoke%'));" \
            -c "DELETE FROM photos         WHERE event_id IN (SELECT id FROM event_log WHERE project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%') OR plant_id IN (SELECT id FROM plants WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%'))) OR plant_id IN (SELECT id FROM plants WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%')) OR location_id IN (SELECT id FROM locations WHERE name ILIKE '%smoke%') OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%') OR inventory_item_id IN (SELECT id FROM inventory_items WHERE name ILIKE '%smoke%');" \
            -c "DELETE FROM event_log      WHERE project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%');" \
            -c "DELETE FROM event_log      WHERE plant_id IN (SELECT id FROM plants WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%'));" \
            -c "DELETE FROM entity_memory  WHERE project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%');" \
            -c "DELETE FROM entity_memory  WHERE plant_id IN (SELECT id FROM plants WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%'));" \
            -c "DELETE FROM favorites      WHERE entity_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%');" \
            -c "DELETE FROM event_batches  WHERE scope_json->>'project_id' IN (SELECT id::text FROM plant_projects WHERE name ILIKE '%smoke%');" \
            -c "DELETE FROM critter_state  WHERE species_id = 255 OR created_by IN (SELECT created_by FROM plant_projects WHERE name ILIKE '%smoke%');" \
            -c "DELETE FROM entity         WHERE entity_type='planting' AND planting_ref_id IN (SELECT id FROM plants WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%'));" \
            -c "DELETE FROM entity_tag     WHERE entity_id IN (SELECT id FROM plants WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%')) OR entity_id IN (SELECT id FROM plant_varieties WHERE name ILIKE '%smoke%') OR entity_id = ANY('{$SMOKE_MIX_IDS}'::uuid[]) OR entity_id IN (SELECT id FROM locations WHERE name ILIKE '%smoke%') OR entity_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%');" \
            -c "UPDATE inventory_items SET source_plant_id = NULL WHERE source_plant_id IS NOT NULL AND (name ILIKE '%smoke%' OR source_plant_id IN (SELECT id FROM plants WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%')));" \
            -c "DELETE FROM plants         WHERE name ILIKE '%smoke%' OR project_id IN (SELECT id FROM plant_projects WHERE name ILIKE '%smoke%');" \
            -c "DELETE FROM seed_lot_stage_log WHERE inventory_item_id IN (SELECT id FROM inventory_items WHERE name ILIKE '%smoke%');" \
            -c "DELETE FROM inventory_items WHERE name ILIKE '%smoke%';" \
            -c "DELETE FROM entity         WHERE entity_type='cultivar' AND (cultivar_ref_id IN (SELECT id FROM plant_varieties WHERE name ILIKE '%smoke%') OR cultivar_ref_id = ANY('{$SMOKE_MIX_IDS}'::uuid[]));" \
            -c "DELETE FROM care_profile   WHERE scope='cultivar' AND (scope_id IN (SELECT id FROM plant_varieties WHERE name ILIKE '%smoke%') OR scope_id = ANY('{$SMOKE_MIX_IDS}'::uuid[]));"
          if [[ "$BLEND_TABLE" == "t" ]]; then
            psql "$NEON_STAGING_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM variety_blend_component WHERE blend_variety_id = ANY('{$SMOKE_VARIETY_IDS}'::uuid[]) OR component_variety_id = ANY('{$SMOKE_VARIETY_IDS}'::uuid[]); DELETE FROM plant_varieties WHERE id = ANY('{$SMOKE_MIX_IDS}'::uuid[]) RETURNING id, name;"
          fi
          psql "$NEON_STAGING_URL" -v ON_ERROR_STOP=1 \
            -c "DELETE FROM plant_varieties WHERE name ILIKE '%smoke%';" \
            -c "DELETE FROM locations      WHERE name ILIKE '%smoke%';" \
            -c "DELETE FROM garden_shared_state WHERE natural_key ILIKE '%smoke%';" \
            -c "DELETE FROM plant_projects  WHERE name ILIKE '%smoke%';"
          echo "  swept: harvest_log, event_log, entity_memory, favorites, event_batches, plants, seed_lot_stage_log, inventory_items, care_profile, variety_blend_component, plant_varieties, locations, plant_projects"
          REMAINING=$(psql "$NEON_STAGING_URL" -At -c "SELECT (SELECT COUNT(*) FROM plant_projects WHERE name ILIKE '%smoke%') + (SELECT COUNT(*) FROM plant_varieties WHERE name ILIKE '%smoke%') + (SELECT COUNT(*) FROM plants WHERE name ILIKE '%smoke%') + (SELECT COUNT(*) FROM locations WHERE name ILIKE '%smoke%') + (SELECT COUNT(*) FROM inventory_items WHERE name ILIKE '%smoke%') + (SELECT COUNT(*) FROM care_profile WHERE scope='cultivar' AND scope_id = ANY('{$SMOKE_VARIETY_IDS}'::uuid[])) + $SEED_PARENT_LEFT + (SELECT COUNT(*) FROM plant_varieties WHERE id = ANY('{$SMOKE_MIX_IDS}'::uuid[])) + $BLEND_LEFT + $SEED_ADDITION_LEFT + (SELECT COUNT(*) FROM seed_lot_stage_log WHERE inventory_item_id = ANY('{$SMOKE_PARENT_KEYS}'::uuid[]));")
          if [[ "$REMAINING" != "0" ]]; then
            echo "⚠ WARN: $REMAINING smoke residue row(s) remain after sweep — possible FK constraint preventing delete"
            exit 1
          fi
          echo "✅ L-058 cleanup complete — 0 smoke residue rows (plant_projects + plant_varieties + plants + locations + inventory_items + care_profile + seed_lot_parent_planting + variety_blend_component + seed_lot_addition + seed_lot_stage_log)"
