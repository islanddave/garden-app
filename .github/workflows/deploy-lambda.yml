name: Deploy Lambda Functions

# OPS-PROMOTERACE-001 (2026-08-14) — the `push: main` trigger is GONE, deliberately.
#
# It made this a SEPARATE workflow run kicked off by promote-gate's fast-forward, racing the SPA
# deploy that promote-gate calls in the same breath. Nothing sequenced them. Measured on promote-gate
# run 31657287769: this workflow ran 01:24:45->01:30:45 while the SPA deploy finished 01:27:35 — the
# new frontend served against old Lambdas for 3m10s. The ~30s margin on a typical promote is
# accidental (a vite build happens to take about as long as a 26-function matrix), not designed.
#
# It also raced `snap.py` inside the promote job, so the revertibility manifest recorded a TORN mix
# of pre- and post-deploy Lambda package versions — see snap.py's L-221 note. (`revert-to.py` no longer
# restores a target's Lambdas from its manifest: it rebuilds them from the target's tree through this
# workflow, and restores snapshot versions only on rollback, from its own pre-revert snap.)
#
# promote-gate now calls this workflow explicitly as a `needs:` predecessor of the SPA deploy, which
# makes the ordering a graph edge instead of a coincidence, and puts it strictly AFTER snap.py.
# `deploy-staging.yml:273` has always had the right topology (`deploy-frontend: needs: deploy-lambdas`);
# prod was the outlier.
#
# Removing `push: main` is safe because `main` is capability-gated to the garden-bot App (3951762) and
# promote-gate's fast-forward is the ONLY writer. This is also the only `push: main` workflow in the
# repo, so nothing else changes shape.
#
# ⚠️ DISPATCH-REF TRAP (OPS-WFSELFFIXORDER-001, proven 2026-09-15). A CHANGE TO THIS FILE CANNOT TAKE
# EFFECT ON THE PROMOTE THAT SHIPS IT, IF THAT PROMOTE IS DISPATCHED FROM `main`.
#
# promote-gate calls this workflow with `uses: ./.github/workflows/deploy-lambda.yml`. A *local*
# `uses: ./…` reference is resolved from the CALLER RUN'S OWN COMMIT (`github.sha`), NOT from the
# `ref:` input below. `ref:` only feeds the `actions/checkout` inside this workflow. So a promote runs
# NEW SOURCE CODE UNDER OLD STEP DEFINITIONS whenever the caller's commit is behind the SHA it promotes.
#
# Dispatching promote-gate against `main` does exactly that: main is fast-forwarded DURING the run, but
# the workflow definitions were pinned at dispatch time — so this file is always exactly one promote
# behind. Proven on promote run 34979965132: dispatched branch=main head_sha=1474c2db (15 commits
# behind the dev SHA it promoted), and the executed step name was the PRE-change
# "Ensure EventBridge cron rules for daily-plan (nightly + intraday)". The hourly migration in that very
# promote was never attempted, and the run was green end to end — it correctly did what the old recipe
# said. Live AWS still had all three retired rules afterwards, which is what a correct run of the OLD
# recipe produces; nothing was drifted or half-applied.
#
# RULE: dispatch promote-gate from `dev` (or from an explicit SHA that carries the intended recipe)
# whenever the promote includes a change to this file or to promote-gate.yml. Verify the fix landed by
# reading LIVE AWS (`aws events list-rules --name-prefix garden-daily-plan`), never by the run's colour —
# a green promote is compatible with the change having never executed.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Exact SHA to deploy. promote-gate passes the promoted dev SHA so the Lambda code and the SPA build come from one commit.'
        required: false
        default: ''
        type: string
    outputs:
      deploy_result:
        # The SPA gate keys on THIS, not on the called workflow's aggregate result.
        #
        # `verify-daily-plan` below is a post-deploy safety-invariant check on garden-daily-plan; it
        # hard-fails by design and is unrelated to the frontend. Under the old `push: main` topology it
        # could not block the SPA (separate run); gating the SPA on the aggregate would newly let an
        # unrelated invariant failure withhold a good frontend. It still reds the run — it just does
        # not hold the SPA hostage.
        #
        # `deploy` is a fail-fast:false matrix over all 26 functions, so its own result already
        # aggregates every leg: any failed function => this is not 'success' => the SPA is withheld.
        description: 'Result of the 26-function deploy matrix only (excludes the post-deploy daily-plan invariant check).'
        value: ${{ jobs.deploy.result }}
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: lambda-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # claim env:production OIDC subject for garden-app-github-deploy trust (scoped 2026-05-05)
    strategy:
      matrix:
        # One job per Lambda function directory under lambda/
        function: [projects, plants, locations, events, favorites, photos, dashboard, inventory-items, varieties, app-events, achievements, ux-events, xp-reconcile, critter, shared-state, findings, daily-plan-read, members, evidence-ingest, daily-plan, tags, storage-location, preservation, harvests, facebook-share, photocdn-derivative]
      # No max-parallel cap: all functions dispatch in one wave so the
      # environment:production approval gate prompts ONCE (not 3 batches of 4).
      # Re-add `max-parallel: N` here only if Lambda control-plane rate limits appear.
      fail-fast: false

    steps:
      # Coupled-deploy determinism: promote-gate passes the promoted dev SHA so the Lambda code and
      # the SPA build come from ONE commit, matching what `deploy.yml` already does with its own
      # `ref` input. Empty (workflow_dispatch) => default checkout, i.e. the branch head, unchanged.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.0'
          # no root-level lockfile — caching disabled for lambda subdirs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # V3-EVENT-008: regenerate the events Lambda's event-type vocabulary from the
      # canonical src/lib/eventTypes.js BEFORE zipping, so a stale committed copy can
      # never ship. events function only; fails the build if it would drift.
      - name: Regenerate event-types (events only)
        if: matrix.function == 'events'
        run: |
          npm run gen:event-types
          npm run check:event-types

      # OPS-LAMBDATESTZIP-001: `zip -r .` shipped every *.test.js into the deployed bundle across all
      # 26 functions — wasted bytes on a cold-start-sensitive path (garden-daily-plan-read measured a
      # 42.9% cold-start rate), and internal test fixtures and mock shapes handed to production.
      #
      # `-x '*.test.js'` — zip wildcards SPAN `/`, so one pattern covers every depth, including
      # nested cases like findings/engine/persist.test.js. It also reaches node_modules; verified
      # safe by measurement rather than assumption — across the union of all 10 Lambda prod deps the
      # tree carries exactly ONE such file (@stablelib/base64/lib/base64.test.js) and NOTHING in the
      # vendor tree or in lambda/ resolves a .test path via require/import.
      #
      # The assert is the point: an exclude that silently stops matching (a reworded pattern, a new
      # test suffix) would go back to shipping tests with a green build. Same shape as the
      # photocdn-derivative sharp assert below — prove the bundle, don't trust the command.
      #
      # The assert MUST stay a subset of the exclude or it can never pass. Its first deploy run
      # (2026-08-19) failed all 26 functions on a false positive: the unanchored `\.test\.js` also
      # matches `.test.js.map`, and pg (every function's dep) vendors two orphaned source maps,
      # node_modules/pg-protocol/dist/{inbound-parser,outbound-serializer}.test.js.map, whose `.js`
      # siblings the exclude had correctly removed. Anchored to `$` the check now matches only real
      # test files, and the maps are excluded too — dead weight once their source is gone.
      - name: Build and zip ${{ matrix.function }}
        if: matrix.function != 'photocdn-derivative'
        run: |
          cd lambda/${{ matrix.function }}
          npm install --omit=dev
          zip -r ../${{ matrix.function }}.zip . -x '*.test.js' '*.test.js.map'
          if unzip -l ../${{ matrix.function }}.zip | grep -qE '\.test\.js$'; then
            echo "FATAL: test files present in ${{ matrix.function }}.zip — the -x exclude stopped matching"; exit 1
          fi

      # V4-PHOTOCDN-001: photocdn-derivative is nodejs22.x/arm64 and depends on `sharp` (native).
      # The GHA runner is x86_64, so a plain `npm install` would package the x64 sharp binary -> a
      # module-load 502 on the arm64 Lambda (invisible until an internal invoke, days later). Install
      # the linux-arm64 binary explicitly and HARD-ASSERT it is inside the zip before deploying.
      - name: Build and zip photocdn-derivative (arm64 sharp)
        if: matrix.function == 'photocdn-derivative'
        run: |
          node -v && npm -v
          cd lambda/photocdn-derivative
          npm install --omit=dev --os=linux --cpu=arm64 --include=optional
          zip -r ../photocdn-derivative.zip . -x '*.test.js' '*.test.js.map'   # OPS-LAMBDATESTZIP-001, same rule as the generic step
          if ! unzip -l ../photocdn-derivative.zip | grep -q 'sharp-linux-arm64'; then
            echo "FATAL: linux-arm64 sharp binary missing from zip — refusing to deploy an x64 build to an arm64 Lambda"; exit 1
          fi
          unzip -l ../photocdn-derivative.zip | grep -q 'node_modules/blurhash' || { echo "FATAL: blurhash dep missing from zip"; exit 1; }
          echo "arm64 sharp + blurhash present in photocdn-derivative.zip"

      - name: Deploy or create ${{ matrix.function }}
        run: |
          FUNCTION_NAME="garden-${{ matrix.function }}"
          ZIP_FILE="fileb://lambda/${{ matrix.function }}.zip"

          # Check if function exists; create on first deploy, update thereafter
          if aws lambda get-function --function-name "$FUNCTION_NAME" 2>/dev/null; then
            echo "Updating existing function: $FUNCTION_NAME"
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file "$ZIP_FILE"
          else
            echo "Creating new function: $FUNCTION_NAME"
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime nodejs20.x \
              --handler index.handler \
              --role ${{ vars.LAMBDA_EXECUTION_ROLE_ARN }} \
              --zip-file "$ZIP_FILE" \
              --timeout 30 \
              --memory-size 256
          fi

      - name: Wait for ${{ matrix.function }} update to complete
        run: |
          aws lambda wait function-updated \
            --function-name "garden-${{ matrix.function }}"
          echo "garden-${{ matrix.function }} is active"

      # B1 (V4-HARVESTVIEW-001): garden-harvests is HOUSEHOLD-SCOPED (householdScope reads
      # GARDEN_HOUSEHOLD_IDS). The create-function branch above sets ZERO env vars, so on the FIRST
      # prod deploy this net-new Lambda would have NO GARDEN_HOUSEHOLD_IDS -> householdScope silently
      # collapses to [userId] and Dave/Jen would see DISJOINT harvest lists (a silent per-user data
      # partition). There is no pre-existing GARDEN_HOUSEHOLD_IDS ensure step in this workflow — the
      # value was set manually on the older household lambdas — so we SOURCE it from a sibling that
      # already carries it (garden-events, canonical live) and READ-MERGE it onto garden-harvests.
      # READ-MERGE (get-function-configuration -> jq '. + {...}') is MANDATORY: the Lambda
      # --environment update is SET-not-MERGE, so a naive set would wipe every other env var.
      # 0A.6: garden-members joined — the roster is now filtered by householdScope; without the
      # env it fail-closes to [caller] and the AssigneePicker silently loses the other household
      # member. Same read-merge mechanics as the original harvests step.
      # BUG-TAGENTOWN-001 (v3.75.0): garden-tags joined — entityExists now carries a household
      # ownership predicate; without the env it fail-closes to [caller] and every cross-member
      # tag attach 404s (pre-promote impact pass found the live fn had no GARDEN_HOUSEHOLD_IDS).
      - name: Ensure GARDEN_HOUSEHOLD_IDS env for household-scoped fns (read-merge)
        if: matrix.function == 'harvests' || matrix.function == 'members' || matrix.function == 'tags'
        continue-on-error: true  # requires lambda:GetFunctionConfiguration + lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-${{ matrix.function }}"
          SRC="garden-events"  # canonical live source of GARDEN_HOUSEHOLD_IDS (household mode is live)
          HH=$(aws lambda get-function-configuration --function-name "$SRC" \
            --query 'Environment.Variables.GARDEN_HOUSEHOLD_IDS' --output text 2>/dev/null || echo "None")
          if [[ "$HH" == "None" || -z "$HH" ]]; then
            echo "::warning::B1 UNRESOLVED — could not read GARDEN_HOUSEHOLD_IDS from $SRC. $FN"
            echo "::warning::will fall back to per-user scope (harvests: Dave and Jen see DISJOINT lists;"
            echo "::warning::members: the AssigneePicker roster collapses to the caller alone) until"
            echo "::warning::GARDEN_HOUSEHOLD_IDS is set on $FN manually."
            exit 0
          fi
          CURRENT=$(aws lambda get-function-configuration --function-name "$FN" \
            --query 'Environment.Variables.GARDEN_HOUSEHOLD_IDS' --output text 2>/dev/null || echo "None")
          if [[ "$CURRENT" == "$HH" ]]; then
            echo "GARDEN_HOUSEHOLD_IDS already correct on $FN"
          else
            echo "Setting GARDEN_HOUSEHOLD_IDS on $FN from $SRC (read-merge; was: $CURRENT)"
            # OPS-LAMBDAENVWIPE-001: test EXIT STATUS, not emptiness. `|| echo "{}"` turned a transient
            # read failure into an empty merge base, and the update below is SET-not-MERGE, so it would
            # delete every env var this step does not hardcode. Emptiness is NOT the signal: a net-new
            # function legitimately has no env, which comes back as `null` at exit 0 and jq merges
            # correctly. This step is continue-on-error, so bailing leaves the live config untouched.
            if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" \
              --query 'Environment.Variables' --output json 2>/dev/null); then
              echo "::warning::could not read env for $FN; leaving config untouched rather than risking a wipe"
              exit 1
            fi
            UPDATED=$(echo "$EXISTING" | jq --arg v "$HH" '. + {GARDEN_HOUSEHOLD_IDS: $v}')
            echo "{\"Variables\": $UPDATED}" > "/tmp/env-$FN-household.json"
            aws lambda update-function-configuration \
              --function-name "$FN" --environment "file:///tmp/env-$FN-household.json" >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "GARDEN_HOUSEHOLD_IDS set on $FN"
          fi

      # V4-FBSHARE-001: garden-facebook-share is admin-only + household-scoped and byte-uploads photos
      # to the Graph API. Net-new, so create-function sets ZERO env — read-merge its config here.
      # FB_SHARE_ENABLED is set to "1" on the LIVE function as of 2026-08-21 — Facebook posting went
      # live once garden-app/facebook-page-token was provisioned. This step does NOT set or unset it;
      # it read-merges, so the live value survives. That is deliberate: the kill switch is operated
      # from the console, and scripts/lambda-config-expected.json is where its expected state is
      # declared. (Before go-live this comment read "deliberately NOT set" — kept in sync now because
      # a stale comment here is what made the drift look like an accident.)
      # timeout/memory are NOT hardcoded below — they are read from that same manifest.
      - name: Ensure facebook-share config (household + admin + bucket + secret; read-merge)
        if: matrix.function == 'facebook-share'
        continue-on-error: true  # requires lambda:Get/UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-facebook-share"
          HH=$(aws lambda get-function-configuration --function-name garden-events \
            --query 'Environment.Variables.GARDEN_HOUSEHOLD_IDS' --output text 2>/dev/null || echo "None")
          # Read the CURRENT env and abort the step if it cannot be read. The old code fell back to
          # "{}" here, which silently turned a read blip into a WIPE: the merge below would then emit
          # only the four hardcoded keys, dropping FB_SHARE_ENABLED and re-darkening a LIVE feature
          # during an unrelated deploy. The step is continue-on-error, so bailing leaves the existing
          # config untouched — strictly safer than overwriting it. Same `|| echo "{}"` shape appears
          # at 6 other sites in this file; this is the one guarding a live kill switch.
          if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" \
            --query 'Environment.Variables' --output json 2>/dev/null); then
            echo "::warning::could not read $FN config; leaving env untouched rather than risking a wipe"
            exit 1
          fi
          UPDATED=$(echo "$EXISTING" | jq \
            --arg hh "$HH" \
            --arg b "garden-photos-prod" \
            --arg a "user_3D2gM0hIl03gjW3JM2DjtPzm0jI" \
            --arg s "garden-app/facebook-page-token" \
            --arg igs "garden-photos-derivatives-769788341849" \
            '. + {S3_PHOTOS_BUCKET:$b, ADMIN_CLERK_SUBS:$a, FB_SECRET_NAME:$s, IG_STAGING_BUCKET:$igs} + (if $hh != "None" and $hh != "" then {GARDEN_HOUSEHOLD_IDS:$hh} else {} end)')
          echo "{\"Variables\": $UPDATED}" > /tmp/env-fbshare.json
          # Timeout/memory come from scripts/lambda-config-expected.json — the SAME file the post-deploy
          # drift guard asserts against — instead of a second hardcoded copy here. Two sources of truth
          # for these four numbers is the root cause of OPS-FBSHAREFLAGDRIFT-001: this step hardcoded
          # 60/512 with no read, no comparison and no log line, so it silently reverted a deliberate
          # 180s/1024MB raise on the next deploy and the drift guard then red-flagged the promote.
          # (Why 180s/1024MB at all: this fans out over up to 10 photos — S3 GetObject + metadata strip
          # + a multipart Graph upload each — and a timeout mid-Promise.all orphans uploaded Graph media
          # with NO cleanup, because neither catch nor finally runs on a Lambda timeout.)
          # jq -e exits non-zero on null/missing, and the default GHA shell is `bash -e`, so a manifest
          # that stops declaring these values fails the step loudly instead of writing a silent default.
          CFG=scripts/lambda-config-expected.json
          TMO=$(jq -er '.["garden-facebook-share"].timeout' "$CFG")
          MEM=$(jq -er '.["garden-facebook-share"].memory' "$CFG")
          aws lambda update-function-configuration --function-name "$FN" \
            --environment file:///tmp/env-fbshare.json --timeout "$TMO" --memory-size "$MEM" >/dev/null
          aws lambda wait function-updated --function-name "$FN"
          echo "facebook-share config ensured (household=$HH; admin; bucket; secret; ${MEM}MB/${TMO}s from $CFG)"

      - name: Ensure S3_PHOTOS_BUCKET env for ${{ matrix.function }}
        # Idempotent: only updates if value differs. Required for photo-enriching
        # Lambdas that sign S3 GET URLs for featured_photo_view_url. Historical gap:
        # create-function below sets ZERO env vars, so a net-new photo-aware Lambda
        # would silently return view_url=null for every featured photo. Bug landed
        # in V2-PHOTO F1 S2 (2026-05-13, PR #36) and was patched manually 2026-05-15;
        # this step makes it self-healing for future deploys.
        if: contains(fromJSON('["plants","projects","locations","inventory-items","photos"]'), matrix.function)
        run: |
          FN="garden-${{ matrix.function }}"
          EXPECTED="garden-photos-prod"
          CURRENT=$(aws lambda get-function-configuration \
            --function-name "$FN" \
            --query 'Environment.Variables.S3_PHOTOS_BUCKET' --output text 2>/dev/null || echo "None")
          if [[ "$CURRENT" == "$EXPECTED" ]]; then
            echo "S3_PHOTOS_BUCKET already correct on $FN"
          else
            echo "Setting S3_PHOTOS_BUCKET=$EXPECTED on $FN (was: $CURRENT)"
            # OPS-LAMBDAENVWIPE-001: test EXIT STATUS, not emptiness (rationale on the household step).
            # This step has NO continue-on-error, so it warns and SKIPS the write rather than exiting 1
            # — refusing to destroy an env map must not newly red an otherwise good deploy. The
            # post-deploy drift guard (scripts/check-lambda-config.py) reports any resulting gap.
            if ! EXISTING=$(aws lambda get-function-configuration \
              --function-name "$FN" --query 'Environment.Variables' --output json 2>/dev/null); then
              echo "::warning::could not read env for $FN; skipping S3_PHOTOS_BUCKET write rather than risking a wipe"
              exit 0
            fi
            UPDATED=$(echo "$EXISTING" | jq --arg b "$EXPECTED" '. + {S3_PHOTOS_BUCKET: $b}')
            echo "{\"Variables\": $UPDATED}" > /tmp/env-photos-bucket.json
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --environment file:///tmp/env-photos-bucket.json >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "S3_PHOTOS_BUCKET=$EXPECTED on $FN"
          fi

      - name: Ensure PHOTO_CDN_* config env for ${{ matrix.function }}
        # V4-PHOTOCDN-001 P1: CDN issuance config for the 5 photo signers. Idempotent; merges into
        # existing env. PHOTO_CDN_ENABLED is intentionally NOT set here (unset => OFF => legacy S3
        # presign path); the CDN flip happens in a later phase by setting PHOTO_CDN_ENABLED=true.
        # The signing private key stays in Secrets Manager (garden-app/photocdn-signing) — only the
        # secret NAME + public-key id + distro domain are passed as env (no key material in config).
        if: contains(fromJSON('["plants","projects","locations","inventory-items","photos"]'), matrix.function)
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-${{ matrix.function }}"
          # OPS-LAMBDAENVWIPE-001: the `[[ "$UPDATED" == "$EXISTING" ]]` test below is a NO-OP detector,
          # not a failure detector — on a failed read the two necessarily DIFFER, so it routed the
          # failure case straight into the write, across all five photo signers. Test exit status here.
          if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables' --output json 2>/dev/null); then
            echo "::warning::could not read env for $FN; leaving PHOTO_CDN_* untouched rather than risking a wipe"
            exit 1
          fi
          UPDATED=$(echo "$EXISTING" | jq \
            --arg d "dovwpi82qccqi.cloudfront.net" \
            --arg k "K1JIPLZ9SVNU1N" \
            --arg s "garden-app/photocdn-signing" \
            '. + {PHOTO_CDN_DOMAIN:$d, PHOTO_CDN_KEY_PAIR_ID:$k, PHOTO_CDN_SIGNING_SECRET:$s}')
          if [[ "$UPDATED" == "$EXISTING" ]]; then
            echo "PHOTO_CDN_* already set on $FN"
          else
            echo "{\"Variables\": $UPDATED}" > /tmp/env-photocdn.json
            aws lambda update-function-configuration --function-name "$FN" --environment file:///tmp/env-photocdn.json >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "PHOTO_CDN_* set on $FN"
          fi

      - name: Ensure inventory-items config
        # V4-SEEDINV-001: POST /api/inventory-items/extract-seeds proxies the Anthropic
        # Messages API (image OCR runs >30s; base64 image bodies need memory headroom),
        # so this one function needs timeout=120s / memory=512MB instead of the
        # create-function defaults (30s/256MB). Idempotent: only updates when values differ.
        if: matrix.function == 'inventory-items'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-inventory-items"
          T=$(aws lambda get-function-configuration --function-name "$FN" --query 'Timeout' --output text 2>/dev/null || echo "None")
          M=$(aws lambda get-function-configuration --function-name "$FN" --query 'MemorySize' --output text 2>/dev/null || echo "None")
          if [[ "$T" == "120" && "$M" == "512" ]]; then
            echo "timeout/memory already correct on $FN (timeout=$T memory=$M)"
          else
            echo "Setting timeout=120 memory-size=512 on $FN (was: timeout=$T memory=$M)"
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --timeout 120 \
              --memory-size 512 >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "timeout=120 memory=512 set on $FN"
          fi

      - name: Ensure plants config
        # OPS-PLANTSLAMBDACPU-001: garden-plants mints ~446 HMAC CloudFront presigns on a single
        # list request. At the create-function default of 256MB it gets 0.145 vCPU, and that signing
        # loop — not the query — was the wall-clock cost. Bumped to 1024MB live on 2026-08-17 with
        # Dave's approval; vCPU scales with memory, so this is a CPU purchase, not headroom.
        #
        # The bump SURVIVES deploys today (the existing-function path calls update-function-code,
        # which does not touch memory), so this step is not fixing a revert — it is ending UNDECLARED
        # DRIFT. The repo said 256 and prod ran 1024, and the only way to know was to go and look.
        # Idempotent compare-then-update, cloned from "Ensure inventory-items config" above.
        # Timeout is deliberately not asserted here: 30s is the create default and correct.
        if: matrix.function == 'plants'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-plants"
          M=$(aws lambda get-function-configuration --function-name "$FN" --query 'MemorySize' --output text 2>/dev/null || echo "None")
          if [[ "$M" == "1024" ]]; then
            echo "memory already correct on $FN (memory=$M)"
          else
            echo "Setting memory-size=1024 on $FN (was: memory=$M)"
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --memory-size 1024 >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "memory=1024 set on $FN"
          fi

      - name: Ensure ADMIN_CLERK_SUBS env for ux-events
        if: matrix.function == 'ux-events'
