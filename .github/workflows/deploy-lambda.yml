      - name: Set xp-reconcile DRY_RUN env on first deploy (read-merge)
        if: matrix.function == 'xp-reconcile'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration; idempotent (only sets if unset)
        run: |
          # On first deploy, set DRY_RUN=true. Subsequent deploys preserve whatever value is set.
          #
          # READ-MERGE. Until 2026-08-18 this step wrote `--environment 'Variables={DRY_RUN=true}'`,
          # which is set-not-MERGE — it deletes every other key. garden-xp-reconcile carries
          # SECRET_REFRESH, so the literal form silently drops the secret-rotation marker.
          # It was also REACHABLE on an already-deployed function: the old read ended in
          # `|| echo "None"`, so a throttled read reported DRY_RUN unset, the first-deploy branch
          # fired, and the map was replaced. An unreadable baseline is therefore now a hard skip,
          # never a default — same rule as scripts/lambda-env-set.sh guarantee 1.
          FN=garden-xp-reconcile
          if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" \
                            --query 'Environment.Variables' --output json 2>/dev/null); then
            echo "::warning::could not read $FN env — skipping the DRY_RUN default rather than writing a partial map"
            exit 0
          fi
          if [[ -z "$EXISTING" || "$EXISTING" == "null" ]]; then EXISTING="{}"; fi
          CURRENT=$(echo "$EXISTING" | jq -r '.DRY_RUN // empty')
          if [[ -n "$CURRENT" ]]; then
            echo "DRY_RUN already set to: $CURRENT (preserving)"
          else
            echo "DRY_RUN not set; defaulting to true on first deploy (merging into $(echo "$EXISTING" | jq 'length') existing key(s))."
            echo "$EXISTING" | jq '. + {DRY_RUN:"true"}' > /tmp/env-xp-reconcile.json
            echo "{\"Variables\": $(cat /tmp/env-xp-reconcile.json)}" > /tmp/env-xp-reconcile-payload.json
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --environment file:///tmp/env-xp-reconcile-payload.json >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "DRY_RUN=true set on $FN"
          fi

      # The nightly plan alone is a frozen snapshot: a plan computed at 02:00 is only as good as the 02:00
      # forecast, and rain does not consult the schedule (a morning downpour left Today listing 150+
      # plantings to water). So daily-plan regenerates hourly 05:00-21:00 ET plus two overnight runs. This is
      # also the precondition for forecast-aware watering deferral: deferring on a forecast is defensible
      # only if a busted forecast is noticed and undone within the hour.
      #
      #   cron(0 0-1,3,5,9-23 * * ? *) = 19 runs. UTC 09-23 + 00-01 is 05:00-21:00 ET hourly; UTC 03 is
      #   23:00 ET and UTC 05 is 01:00 ET. Fixed UTC, so it all shifts an hour earlier in EST, which is why
      #   the two application-side hour windows are written WIDE and hold in both offsets:
      #     rain autolog  00:00-05:59 ET  — keeps 2 runs in either offset (01:00+05:00 EDT / 00:00+04:00+05:00 EST)
      #     frost eval    14:00-17:59 ET  — 3-4 runs; frostEval publishes only when the assessment is
      #                                     strictly WORSE than what was already sent
      #
      # Cost is negligible (~+$0.02/month of Lambda); 60-minute spacing is far wider than Neon's 5-minute
      # autosuspend, so the compute still sleeps between runs. The AWN 1-req/sec limit is enforced in
      # index.js and is a per-second bound, unaffected by run frequency.
      #
      # Safe to run repeatedly by construction: writes stay gated on the Lambda's own env DRY_RUN (an event
      # can never force a live run), per-plant done state is computed at READ time from event_log so
      # regeneration cannot clobber check-offs, and the row carries items.prior_runs (handler.js
      # PRIOR_RUNS_MAX keeps the day baseline + the recent window) so an earlier generation stays auditable.
      # The client revalidates the plan on focus/visibilitychange, so the extra runs reach the phone.
      - name: Ensure EventBridge cron rules for daily-plan (hourly + overnight)
        if: matrix.function == 'daily-plan'
        continue-on-error: true  # requires events:PutRule + events:PutTargets + lambda:AddPermission on deploy role
        run: |
          set -euo pipefail
          LAMBDA_ARN=$(aws lambda get-function --function-name garden-daily-plan --query 'Configuration.FunctionArn' --output text)
          ensure_rule () {
            local NAME="$1" EXPR="$2" DESC="$3" SID="$4"
            aws events put-rule --name "$NAME" --schedule-expression "$EXPR" --state ENABLED --description "$DESC"
            aws events put-targets --rule "$NAME" --targets "Id=1,Arn=$LAMBDA_ARN"
            local RULE_ARN
            RULE_ARN=$(aws events describe-rule --name "$NAME" --query 'Arn' --output text)
            # AddPermission is idempotent-by-statement-id — a duplicate returns ResourceConflictException.
            aws lambda add-permission \
              --function-name garden-daily-plan \
              --statement-id "$SID" \
              --action lambda:InvokeFunction \
              --principal events.amazonaws.com \
              --source-arn "$RULE_ARN" 2>/dev/null || echo "AddPermission $SID already exists (expected on re-deploy)."
            echo "EventBridge rule $NAME -> garden-daily-plan ($EXPR)"
          }
          # Retire a superseded rule. ensure_rule only ever asserts the names it knows, so without this
          # the three old rules would survive untouched and un-declared — firing alongside the new one
          # forever, and invisible to this mechanism (drift in the direction nothing checks). Every step
          # tolerates already-gone so the retirement is idempotent across re-deploys.
          retire_rule () {
            local NAME="$1" SID="$2"
            if aws events describe-rule --name "$NAME" >/dev/null 2>&1; then
              aws events remove-targets --rule "$NAME" --ids 1 >/dev/null 2>&1 || true
              aws events delete-rule --name "$NAME" >/dev/null 2>&1 || true
              echo "Retired superseded EventBridge rule $NAME"
            else
              echo "EventBridge rule $NAME already absent (expected after the first post-OPS-PLANHOURLY-001 deploy)."
            fi
            aws lambda remove-permission --function-name garden-daily-plan --statement-id "$SID" >/dev/null 2>&1 \
              || echo "Lambda permission $SID already removed."
          }
          ensure_rule garden-daily-plan-hourly 'cron(0 0-1,3,5,9-23 * * ? *)' 'Daily Plan generation, hourly 05:00-21:00 ET + 23:00/01:00 ET overnight (OPS-PLANHOURLY-001). Supersedes nightly+intraday-am+intraday-pm. LIVE.' EventBridgeInvokeHourly
          # Asserted BEFORE the retirements so there is never a window with no schedule at all. The
          # overlap runs the other way — both old and new rules live for a few seconds — and that is
          # harmless: the generator is an idempotent upsert on (user_id, plan_date), and its one
          # non-idempotent side effect (the frost SNS publish) is behind the dedup + escalation gates.
          retire_rule garden-daily-plan-nightly     EventBridgeInvokeDaily
          retire_rule garden-daily-plan-intraday-am EventBridgeInvokeIntradayAm
          retire_rule garden-daily-plan-intraday-pm EventBridgeInvokeIntradayPm

      - name: Ensure EventBridge cron rule for xp-reconcile
        if: matrix.function == 'xp-reconcile'
        continue-on-error: true  # requires events:PutRule + events:PutTargets + lambda:AddPermission on deploy role
        run: |
          RULE_NAME=garden-xp-reconcile-daily
          # cron(min hr day-of-month month day-of-week year) — 04:00 UTC daily = midnight ET (standard) / 11pm ET (DST)
          aws events put-rule \
            --name "$RULE_NAME" \
            --schedule-expression 'cron(0 4 * * ? *)' \
            --state ENABLED \
            --description 'Daily XP reconciliation: heal user_stats.xp drift vs SUM(xp_events.amount)'
          # Lambda ARN for target
          LAMBDA_ARN=$(aws lambda get-function --function-name garden-xp-reconcile --query 'Configuration.FunctionArn' --output text)
          aws events put-targets \
            --rule "$RULE_NAME" \
            --targets "Id=1,Arn=$LAMBDA_ARN"
          # Permit EventBridge to invoke. AddPermission is idempotent-by-statement-id — duplicate calls return ResourceConflictException (squelched).
          RULE_ARN=$(aws events describe-rule --name "$RULE_NAME" --query 'Arn' --output text)
          aws lambda add-permission \
            --function-name garden-xp-reconcile \
            --statement-id EventBridgeInvokeDaily \
            --action lambda:InvokeFunction \
            --principal events.amazonaws.com \
            --source-arn "$RULE_ARN" 2>/dev/null || echo "AddPermission already exists (expected on re-deploy)."
          echo "EventBridge rule $RULE_NAME wired to garden-xp-reconcile (cron 0 4 * * ? *)"

      - name: Ensure daily-plan config
        # The nightly first attempt stacks a Neon scale-to-zero cold-resume stall (~21-26s on the first
        # pool.query) on 6-9s of real work, which blows the 30s create-function default. timeout=120s
        # absorbs the stall; memory is INTENTIONALLY left at 256MB (the wait is I/O, not CPU). Idempotent
        # compare-then-update. NEVER pass --environment here (set-not-merge wipe hazard; see
        # verify-lambda-invariants.yml invariant 1).
        if: matrix.function == 'daily-plan'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-daily-plan"
          T=$(aws lambda get-function-configuration --function-name "$FN" --query 'Timeout' --output text 2>/dev/null || echo "None")
          if [[ "$T" == "120" ]]; then
            echo "timeout already correct on $FN (timeout=$T)"
          else
            echo "Setting timeout=120 on $FN (was: timeout=$T; memory left untouched)"
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --timeout 120 >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "timeout=120 set on $FN"
          fi

      # The retired single-owner fallback key is not re-added (the handler no longer reads it; unassigned
      # rows go to each Space's own owner). The merge below still PRESERVES whatever is live; removing the
      # key from the live map is a separate, one-key lambda-env-set.sh --unset, never done here.
      - name: Set daily-plan DRY_RUN + RAIN_AUTOLOG_ENABLED env
        if: matrix.function == 'daily-plan'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration; idempotent
        run: |
          FN=garden-daily-plan
          CURRENT=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables.DRY_RUN' --output text 2>/dev/null || echo "None")
          # OPS-LAMBDAENVWIPE-001: widest-open of the seven — no value-check at all, so this read is
          # followed by an unconditional write on EVERY daily-plan deploy. `|| echo "{}"` meant one
          # transient read failure would strip the nightly engine's entire env (DRY_RUN,
          # CARE_WATER_LEDGER_ENABLED, CARE_RAIN_MAXDAYS_ENABLED, ...) and still report success.
          if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables' --output json 2>/dev/null); then
            echo "::warning::could not read env for $FN; leaving config untouched rather than risking a wipe"
            exit 1
          fi
          if [[ "$CURRENT" == "None" || -z "$CURRENT" ]]; then
            echo "First deploy: DRY_RUN=true."
            UPDATED=$(echo "$EXISTING" | jq '. + {DRY_RUN:"true"}')
          else
            echo "DRY_RUN=$CURRENT preserved."
            UPDATED="$EXISTING"
          fi
          # BUG-RAINAUTOLOGCLIFF-001 — RAIN_AUTOLOG_ENABLED must exist as a VALUE, never be inferred
          # from an absence. rainLog.js arms on anything that is not the exact string 'false', so the
          # key being missing has meant ARMED all along; writing "true" states what prod already does
          # and changes no behaviour. ADD-IF-MISSING, never overwrite: a deliberate live 'false' is
          # the incident kill switch, and a deploy that silently re-arms it is not a kill switch.
          # scripts/lambda-config-expected.json declares the key "true", and that assertion runs in
          # verify-daily-plan AFTER this step, so a failure here (this step is continue-on-error)
          # surfaces as a red config check rather than as silence.
          UPDATED=$(echo "$UPDATED" | jq 'if has("RAIN_AUTOLOG_ENABLED") then . else . + {RAIN_AUTOLOG_ENABLED:"true"} end')
          echo "{\"Variables\": $UPDATED}" > /tmp/env-daily-plan.json
          aws lambda update-function-configuration --function-name "$FN" --environment file:///tmp/env-daily-plan.json >/dev/null
          aws lambda wait function-updated --function-name "$FN"
          echo "env ensured on $FN"

      # Daily-plan scheduling has ONE source of truth: the `ensure_rule`/`retire_rule` step above. A second
      # step that creates a daily-plan rule, running later in the same leg, would resurrect a rule that
      # step retires.

      # THE LAST STEP OF EVERY LEG: stamp the function with what it now runs, in its Description:
      #   garden-app lambda-deploy v1 src=<commit built> recipe=<commit this file came from>
      #                               code=<CodeSha256 of the zip built above> run=<run id>.<attempt>
      #
      # promote-gate's `lam` step reads these (scripts/check-lambda-current.py) to decide whether a promote
      # may skip this workflow. `main` cannot answer that: main means APPROVED, not DEPLOYED (a failed leg,
      # a promote that died after its fast-forward, a revert rollback or a console upload leaves main naming
      # code that is not running).
      #
      # Written ONLY when the live CodeSha256 equals the sha256 of this leg's zip, i.e. once the running
      # code is provably these bytes; and only if no earlier step of the leg failed outright (default
      # success(); a failed continue-on-error env step does not stop it: verify-lambda-invariants is what
      # asserts config, on every promote). Any later code change from elsewhere moves CodeSha256 off
      # `code=`, and the reader then refuses the marker, so a stale marker can only cause an unnecessary
      # deploy, never a skip.
      #
      # continue-on-error, and every failure path warns and exits 0: no marker means the next promote
      # redeploys all 26. It must never red a leg or withhold the SPA.
      #
      # It REPLACES the Description on purpose. To force cold starts, set the env key FORCE_COLD_START
      # (check-lambda-config.py ignores it); writing the Description instead costs one full redeploy.
      #
      # RECIPE_SHA is github.sha, which inside a called workflow is the CALLER's commit, the one this file
      # was loaded from. It differs from the checked-out SRC when promote-gate is dispatched from main.
      #
      # Withheld when "Ensure declared runtime" failed, so this leg never certifies a function whose runtime
      # move failed: the marker left from the previous deploy names other code or an older recipe in the
      # cases that matter (new code, or this recipe's first run), and the next promote redeploys the
      # function and retries the move. verify-lambda-invariants reds on the runtime either way.
      - name: Record deployed source on garden-${{ matrix.function }} (deploy marker read by promote-gate)
        if: success() && steps.ensure_runtime.outcome != 'failure'
        continue-on-error: true
        env:
          FN: garden-${{ matrix.function }}
          ZIP: lambda/${{ matrix.function }}.zip
          RECIPE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          warn() { echo "::warning::$FN: $1 — no deploy marker, so the next promote redeploys every Lambda"; exit 0; }
          SRC=$(git rev-parse HEAD) || warn "cannot read the checked-out commit"
          WANT=$(openssl dgst -sha256 -binary "$ZIP" | base64) || warn "cannot hash $ZIP"
          aws lambda wait function-updated --function-name "$FN" || warn "the function did not settle"
          LIVE=$(aws lambda get-function-configuration --function-name "$FN" --query CodeSha256 --output text) \
            || warn "cannot read the live CodeSha256"
          if [ "$LIVE" != "$WANT" ]; then warn "live CodeSha256 $LIVE is not the zip this leg built ($WANT)"; fi
          DESC="garden-app lambda-deploy v1 src=${SRC} recipe=${RECIPE_SHA} code=${LIVE} run=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          aws lambda update-function-configuration --function-name "$FN" --description "$DESC" >/dev/null \
            || warn "the Description write was refused"
          aws lambda wait function-updated --function-name "$FN" \
            || echo "::warning::$FN: marker written but the function had not settled when this step ended"
          echo "deploy marker on $FN: $DESC"

  # Post-deploy verification: a HARD GATE (deliberately NOT continue-on-error), carried by
  # verify-lambda-invariants.yml, the single source of these assertions. `needs: deploy` runs it only when
  # the matrix succeeded, and it is EXCLUDED from the `deploy_result` output above, so a config-drift
  # failure reds the run without withholding a good frontend. promote-gate.yml also calls it, as the last
  # job of every promote; THIS call covers the two paths promote-gate never reaches: a manual
  # workflow_dispatch of this file, and scripts/revert-to.py, which dispatches this workflow directly.
  #
  # The job's API name is `verify-daily-plan / verify` (nested reusable workflow). revert-to.py's
  # `_is_lambda_leg` selects matrix legs POSITIVELY (`name == "deploy"` or `name.startswith("deploy (")`),
  # and verify-deploy.py's `_lambda_job_state` matches the `deploy-lambdas /` prefix; keep both true if
  # either job is renamed.
  #
  # No `secrets: inherit`: the called workflow uses none (vars.AWS_DEPLOY_ROLE_ARN is a repo variable).
  verify-daily-plan:
    needs: deploy
    uses: ./.github/workflows/verify-lambda-invariants.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

# Lambda functions pull NEON_DATABASE_URL and CLERK_SECRET_KEY from AWS Secrets Manager at runtime
# (garden-app/neon-database-url, garden-app/clerk-secret-key), so no DB credentials touch GitHub. The
# execution role needs secretsmanager:GetSecretValue on arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:garden-app/*
