      - name: Ensure Function URL exists for ${{ matrix.function }}
        if: matrix.function != 'xp-reconcile' && matrix.function != 'daily-plan' && matrix.function != 'photocdn-derivative'  # xp-reconcile/daily-plan EventBridge; photocdn-derivative INTERNAL-INVOKE ONLY (spec-B2: NO public AuthType-NONE URL)
        continue-on-error: true  # requires lambda:CreateFunctionUrlConfig + lambda:GetFunctionUrlConfig + lambda:AddPermission on deploy role
        run: |
          FUNCTION_NAME="garden-${{ matrix.function }}"
          # Check if Function URL exists; create on first deploy.
          if aws lambda get-function-url-config --function-name "$FUNCTION_NAME" 2>/dev/null; then
            echo "Function URL already exists for $FUNCTION_NAME"
          else
            echo "Creating Function URL for $FUNCTION_NAME"
            aws lambda create-function-url-config \
              --function-name "$FUNCTION_NAME" \
              --auth-type NONE \
              --cors '{"AllowOrigins":["*"],"AllowMethods":["*"],"AllowHeaders":["*"]}'
            # Add resource-based policy for public invoke (required when AuthType=NONE)
            # Function URL invocations require BOTH InvokeFunctionUrl (URL-config layer)
            # AND InvokeFunction (handler-dispatch layer) — missing either returns 403
            # at the URL layer before the request reaches the handler.
            # Ref: error-log.md E-magical-nifty-franklin-pickup-002 (2026-05-08)
            aws lambda add-permission \
              --function-name "$FUNCTION_NAME" \
              --statement-id FunctionURLAllowPublicAccess \
              --action lambda:InvokeFunctionUrl \
              --principal "*" \
              --function-url-auth-type NONE 2>/dev/null || true
            aws lambda add-permission \
              --function-name "$FUNCTION_NAME" \
              --statement-id AllowPublicInvoke \
              --action lambda:InvokeFunction \
              --principal "*" 2>/dev/null || true
            echo "Function URL created for $FUNCTION_NAME"
          fi

      - name: Restore Lambda Function URL CORS (prod garden.futureishere.net)
        if: matrix.function != 'xp-reconcile' && matrix.function != 'daily-plan' && matrix.function != 'photocdn-derivative'  # photocdn-derivative has no Function URL
        continue-on-error: true  # requires lambda:UpdateFunctionUrlConfig on deploy role
        run: |
          # Set CORS to allow garden.futureishere.net (the prod SPA origin).
          # IMPORTANT: handler code uses CORS={} (empty) — the Lambda URL config IS the source of truth
          # for prod CORS. The previous "Clear" step (vestigial "handler owns CORS" assumption) was
          # racing with deploy.yml's restore step and clobbering CORS on prod — fixed 2026-05-12 by
          # 3f27c817 prod deploy incident (V1.2a-1 Session 2 staging-then-prod ship).
          aws lambda update-function-url-config \
            --function-name "garden-${{ matrix.function }}" \
            --region us-east-1 \
            --cors '{"AllowCredentials":false,"AllowHeaders":["authorization","content-type"],"AllowMethods":["GET","POST","PUT","DELETE","PATCH"],"AllowOrigins":["https://garden.futureishere.net"],"ExposeHeaders":[],"MaxAge":300}' \
            --query 'Cors.AllowOrigins[0]' --output text
          echo "CORS restored for garden-${{ matrix.function }}"

      - name: Verify photocdn-derivative (arm64 self-test + no public URL)
        if: matrix.function == 'photocdn-derivative'
        run: |
          # (a) Prove the deployed arm64 build actually loads sharp+blurhash+heif — the ONLY tripwire
          # that catches an x64-sharp mismatch or a CFN placeholder-revert (both invisible to CI's
          # static lambda tests). Internal invoke, RequestResponse.
          aws lambda invoke --function-name garden-photocdn-derivative \
            --cli-binary-format raw-in-base64-out \
            --payload '{"rawPath":"/d/__selftest__"}' /tmp/selftest.json >/dev/null
          cat /tmp/selftest.json
          python3 -c "import json,sys; d=json.load(open('/tmp/selftest.json')); b=json.loads(d['body']); assert b.get('sharp_ok') and b.get('blurhash_ok') and b.get('heif_input') and b.get('arch')=='arm64', 'self-test failed: '+str(b); print('self-test OK', b)"
          # (b) Spec-B2: assert this internal-invoke Lambda has NO public Function URL and no public
          # invoke policy (a prior generic run or drift could have created one).
          if aws lambda get-function-url-config --function-name garden-photocdn-derivative 2>/dev/null; then
            echo "FATAL: photocdn-derivative has a Function URL — spec-B2 forbids a public surface"; exit 1
          fi
          echo "verified: no Function URL on garden-photocdn-derivative"

      - name: Set xp-reconcile DRY_RUN env on first deploy (read-merge)
        if: matrix.function == 'xp-reconcile'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration; idempotent (only sets if unset)
        run: |
          # On first deploy, set DRY_RUN=true. Subsequent deploys preserve whatever value is set.
          #
          # READ-MERGE. Until 2026-08-18 this step wrote `--environment 'Variables={DRY_RUN=true}'`,
          # which is set-not-MERGE — it deletes every other key. garden-xp-reconcile carries
          # SECRET_REFRESH, so the literal form silently drops the secret-rotation marker.
          # It was also REACHABLE on an already-deployed function: the old read ended in
          # `|| echo "None"`, so a throttled read reported DRY_RUN unset, the first-deploy branch
          # fired, and the map was replaced. An unreadable baseline is therefore now a hard skip,
          # never a default — same rule as scripts/lambda-env-set.sh guarantee 1.
          FN=garden-xp-reconcile
          if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" \
                            --query 'Environment.Variables' --output json 2>/dev/null); then
            echo "::warning::could not read $FN env — skipping the DRY_RUN default rather than writing a partial map"
            exit 0
          fi
          if [[ -z "$EXISTING" || "$EXISTING" == "null" ]]; then EXISTING="{}"; fi
          CURRENT=$(echo "$EXISTING" | jq -r '.DRY_RUN // empty')
          if [[ -n "$CURRENT" ]]; then
            echo "DRY_RUN already set to: $CURRENT (preserving)"
          else
            echo "DRY_RUN not set; defaulting to true on first deploy (merging into $(echo "$EXISTING" | jq 'length') existing key(s))."
            echo "$EXISTING" | jq '. + {DRY_RUN:"true"}' > /tmp/env-xp-reconcile.json
            echo "{\"Variables\": $(cat /tmp/env-xp-reconcile.json)}" > /tmp/env-xp-reconcile-payload.json
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --environment file:///tmp/env-xp-reconcile-payload.json >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "DRY_RUN=true set on $FN"
          fi

      # BUG-TODAYWATER-001 — INTRADAY REGENERATION.
      # The nightly plan is a frozen ~02:00 ET snapshot. On 2026-08-03 it was generated with a 0.98"
      # forecast for a day that delivered 3.8" observed, so Today listed 200 plantings for watering in the
      # rain; a manual re-run at 08:37 with the real figure took that to 18. Fixing the engine's gates does
      # NOT fix this — a plan computed at 02:00 is only ever as good as the 02:00 forecast. The input has to
      # be refreshed while the day is happening.
      #
      # OPS-PLANHOURLY-001 (2026-09-13) — SUPERSEDES the three-run schedule described above. Dave's
      # ruling: hourly 05:00-21:00 ET plus a couple of overnight runs.
      #
      # What forced it: on 2026-09-13 the gauge read 0.79" by midday while Today still listed 153
      # plantings to water. Nothing was broken — the 05:30 snapshot was correct for 05:30, when the
      # gauge held 0.07"; the rain fell 06:40-08:40 and the next run was not until 15:30. Two refreshes
      # tied to "real decision moments" still leave a ~10-hour blind window, and rain does not consult
      # the schedule. It is also the precondition for forecast-aware watering deferral: deferring on a
      # forecast is only defensible if a busted forecast can be noticed and undone within the hour
      # (cf. 2026-08-08, 0.97" predicted at 28% PoP, 0.04" fell, 32 plantings lost a watering for the day).
      #
      #   cron(0 0-1,3,5,9-23 * * ? *) — 19 runs. UTC 09-23 + 00-01 is 05:00-21:00 ET hourly; UTC 03
      #   is 23:00 ET and UTC 05 is 01:00 ET (the two overnight runs). Fixed-UTC as before, so the whole
      #   thing shifts an hour earlier in EST (04:00-20:00 + 22:00 + 00:00 ET) — which is why the two
      #   application-side hour windows are written WIDE and still hold in both offsets:
      #     rain autolog  00:00-05:59 ET  — keeps 2 runs in either offset (01:00+05:00 EDT / 00:00+04:00+05:00 EST)
      #     frost eval    14:00-17:59 ET  — 3-4 runs; see the escalation gate note below.
      #
      # Cost, measured rather than assumed (2026-09-13): Lambda p50 9.8s at 256MB => ~+$0.02/month.
      # Both Neon endpoints carry the 5-minute default autosuspend, and 60-minute spacing is far wider
      # than that, so the compute still sleeps between runs — no pinned-awake bill. Outbound calls go
      # ~21/day -> ~133/day; the AWN 1-req/sec limit is enforced in index.js and is a PER-SECOND bound,
      # unaffected by run frequency.
      #
      # Safe to run repeatedly by construction: writes stay gated on the Lambda's own env DRY_RUN (an event
      # can never force a live run), per-plant done state is computed at READ time from event_log
      # (V3-TODAYDONE-001) so regeneration cannot clobber check-offs, and the row carries items.prior_runs
      # so an earlier generation is auditable rather than destroyed.
      #
      # THREE THINGS HAD TO CHANGE WITH THE SCHEDULE, because each was correct only at 3 runs/day:
      #   1. handler.js PRIOR_RUNS_MAX — was `.slice(0, 3)`, which keeps the OLDEST three. From run #4
      #      the audit trail would have frozen on runs 1-3 and recorded nothing further. Now keeps the
      #      day baseline + the recent window.
      #   2. frostEval escalation gate — the 14:00-17:59 ET window held ONE evaluation; it now holds 3-4,
      #      and ordinary afternoon forecast wobble mints a new dedup key (hence an email) each time.
      #      Alerts now publish only when the assessment is strictly WORSE than what was already sent.
      #   3. useDailyPlan wake revalidation — the client fetched the plan once per Today mount and never
      #      again (`refresh` was exported and called by nobody), so the extra runs would have been
      #      invisible on Dave's phone. Now revalidates on focus/visibilitychange.
      - name: Ensure EventBridge cron rules for daily-plan (hourly + overnight)
        if: matrix.function == 'daily-plan'
        continue-on-error: true  # requires events:PutRule + events:PutTargets + lambda:AddPermission on deploy role
        run: |
          set -euo pipefail
          LAMBDA_ARN=$(aws lambda get-function --function-name garden-daily-plan --query 'Configuration.FunctionArn' --output text)
          ensure_rule () {
            local NAME="$1" EXPR="$2" DESC="$3" SID="$4"
            aws events put-rule --name "$NAME" --schedule-expression "$EXPR" --state ENABLED --description "$DESC"
            aws events put-targets --rule "$NAME" --targets "Id=1,Arn=$LAMBDA_ARN"
            local RULE_ARN
            RULE_ARN=$(aws events describe-rule --name "$NAME" --query 'Arn' --output text)
            # AddPermission is idempotent-by-statement-id — a duplicate returns ResourceConflictException.
            aws lambda add-permission \
              --function-name garden-daily-plan \
              --statement-id "$SID" \
              --action lambda:InvokeFunction \
              --principal events.amazonaws.com \
              --source-arn "$RULE_ARN" 2>/dev/null || echo "AddPermission $SID already exists (expected on re-deploy)."
            echo "EventBridge rule $NAME -> garden-daily-plan ($EXPR)"
          }
          # Retire a superseded rule. ensure_rule only ever asserts the names it knows, so without this
          # the three old rules would survive untouched and un-declared — firing alongside the new one
          # forever, and invisible to this mechanism (drift in the direction nothing checks). Every step
          # tolerates already-gone so the retirement is idempotent across re-deploys.
          retire_rule () {
            local NAME="$1" SID="$2"
            if aws events describe-rule --name "$NAME" >/dev/null 2>&1; then
              aws events remove-targets --rule "$NAME" --ids 1 >/dev/null 2>&1 || true
              aws events delete-rule --name "$NAME" >/dev/null 2>&1 || true
              echo "Retired superseded EventBridge rule $NAME"
            else
              echo "EventBridge rule $NAME already absent (expected after the first post-OPS-PLANHOURLY-001 deploy)."
            fi
            aws lambda remove-permission --function-name garden-daily-plan --statement-id "$SID" >/dev/null 2>&1 \
              || echo "Lambda permission $SID already removed."
          }
          ensure_rule garden-daily-plan-hourly 'cron(0 0-1,3,5,9-23 * * ? *)' 'Daily Plan generation, hourly 05:00-21:00 ET + 23:00/01:00 ET overnight (OPS-PLANHOURLY-001). Supersedes nightly+intraday-am+intraday-pm. LIVE.' EventBridgeInvokeHourly
          # Asserted BEFORE the retirements so there is never a window with no schedule at all. The
          # overlap runs the other way — both old and new rules live for a few seconds — and that is
          # harmless: the generator is an idempotent upsert on (user_id, plan_date), and its one
          # non-idempotent side effect (the frost SNS publish) is behind the dedup + escalation gates.
          retire_rule garden-daily-plan-nightly     EventBridgeInvokeDaily
          retire_rule garden-daily-plan-intraday-am EventBridgeInvokeIntradayAm
          retire_rule garden-daily-plan-intraday-pm EventBridgeInvokeIntradayPm

      - name: Ensure EventBridge cron rule for xp-reconcile
        if: matrix.function == 'xp-reconcile'
        continue-on-error: true  # requires events:PutRule + events:PutTargets + lambda:AddPermission on deploy role
        run: |
          RULE_NAME=garden-xp-reconcile-daily
          # cron(min hr day-of-month month day-of-week year) — 04:00 UTC daily = midnight ET (standard) / 11pm ET (DST)
          aws events put-rule \
            --name "$RULE_NAME" \
            --schedule-expression 'cron(0 4 * * ? *)' \
            --state ENABLED \
            --description 'Daily XP reconciliation: heal user_stats.xp drift vs SUM(xp_events.amount)'
          # Lambda ARN for target
          LAMBDA_ARN=$(aws lambda get-function --function-name garden-xp-reconcile --query 'Configuration.FunctionArn' --output text)
          aws events put-targets \
            --rule "$RULE_NAME" \
            --targets "Id=1,Arn=$LAMBDA_ARN"
          # Permit EventBridge to invoke. AddPermission is idempotent-by-statement-id — duplicate calls return ResourceConflictException (squelched).
          RULE_ARN=$(aws events describe-rule --name "$RULE_NAME" --query 'Arn' --output text)
          aws lambda add-permission \
            --function-name garden-xp-reconcile \
            --statement-id EventBridgeInvokeDaily \
            --action lambda:InvokeFunction \
            --principal events.amazonaws.com \
            --source-arn "$RULE_ARN" 2>/dev/null || echo "AddPermission already exists (expected on re-deploy)."
          echo "EventBridge rule $RULE_NAME wired to garden-xp-reconcile (cron 0 4 * * ? *)"

      - name: Ensure daily-plan config
        # DRG-NIGHTLYTIMEOUT-001: the nightly first attempt stacks a Neon scale-to-zero cold-resume
        # stall (~21-26s on the first pool.query at 2am ET) on 6-9s of real work, blowing the 30s
        # create-function default on 24/30 nights (the async retry succeeds only because the dead
        # first attempt already woke the DB). timeout=120s absorbs the stall; memory INTENTIONALLY
        # untouched at 256MB (diagnosis proved I/O wait, not CPU). Idempotent compare-then-update,
        # cloned from "Ensure inventory-items config". NEVER pass --environment here (set-not-merge
        # wipe hazard — see verify-daily-plan invariant 1).
        if: matrix.function == 'daily-plan'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-daily-plan"
          T=$(aws lambda get-function-configuration --function-name "$FN" --query 'Timeout' --output text 2>/dev/null || echo "None")
          if [[ "$T" == "120" ]]; then
            echo "timeout already correct on $FN (timeout=$T)"
          else
            echo "Setting timeout=120 on $FN (was: timeout=$T; memory left untouched)"
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --timeout 120 >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "timeout=120 set on $FN"
          fi

      - name: Set daily-plan DRY_RUN + OWNER_FALLBACK_SUB + RAIN_AUTOLOG_ENABLED env
        if: matrix.function == 'daily-plan'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration; idempotent
        run: |
          FN=garden-daily-plan
          OWNER=user_3D2gM0hIl03gjW3JM2DjtPzm0jI
          CURRENT=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables.DRY_RUN' --output text 2>/dev/null || echo "None")
          # OPS-LAMBDAENVWIPE-001: widest-open of the seven — no value-check at all, so this read is
          # followed by an unconditional write on EVERY daily-plan deploy. `|| echo "{}"` meant one
          # transient read failure would strip the nightly engine's entire env (DRY_RUN,
          # CARE_WATER_LEDGER_ENABLED, CARE_RAIN_MAXDAYS_ENABLED, ...) and still report success.
          if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables' --output json 2>/dev/null); then
            echo "::warning::could not read env for $FN; leaving config untouched rather than risking a wipe"
            exit 1
          fi
          if [[ "$CURRENT" == "None" || -z "$CURRENT" ]]; then
            echo "First deploy: DRY_RUN=true + OWNER_FALLBACK_SUB (dormant)."
            UPDATED=$(echo "$EXISTING" | jq --arg o "$OWNER" '. + {DRY_RUN:"true", OWNER_FALLBACK_SUB:$o}')
          else
            echo "DRY_RUN=$CURRENT preserved; ensuring OWNER_FALLBACK_SUB present."
            UPDATED=$(echo "$EXISTING" | jq --arg o "$OWNER" 'if has("OWNER_FALLBACK_SUB") then . else . + {OWNER_FALLBACK_SUB:$o} end')
          fi
          # BUG-RAINAUTOLOGCLIFF-001 — RAIN_AUTOLOG_ENABLED must exist as a VALUE, never be inferred
          # from an absence. rainLog.js arms on anything that is not the exact string 'false', so the
          # key being missing has meant ARMED all along; writing "true" states what prod already does
          # and changes no behaviour. ADD-IF-MISSING, never overwrite: a deliberate live 'false' is
          # the incident kill switch, and a deploy that silently re-arms it is not a kill switch.
          # scripts/lambda-config-expected.json declares the key "true", and that assertion runs in
          # verify-daily-plan AFTER this step, so a failure here (this step is continue-on-error)
          # surfaces as a red config check rather than as silence.
          UPDATED=$(echo "$UPDATED" | jq 'if has("RAIN_AUTOLOG_ENABLED") then . else . + {RAIN_AUTOLOG_ENABLED:"true"} end')
          echo "{\"Variables\": $UPDATED}" > /tmp/env-daily-plan.json
          aws lambda update-function-configuration --function-name "$FN" --environment file:///tmp/env-daily-plan.json >/dev/null
          aws lambda wait function-updated --function-name "$FN"
          echo "env ensured on $FN"

      # REMOVED 2026-09-15 (OPS-WFSELFFIXORDER-001). This step used to sit here and re-create
      # garden-daily-plan-nightly with `cron(0 6 * * ? *)`, 88 lines AFTER the step at ~616 retires it.
      # Both carried `if: matrix.function == 'daily-plan'`, so both ran in the same matrix leg in file
      # order: A retired the rule, B resurrected it. The hourly migration (OPS-PLANHOURLY-001) would
      # therefore have half-applied on any run that loaded the new recipe — hourly created, nightly
      # never actually gone. It never got the chance: the 2026-09-15 promote loaded the PRE-hourly
      # recipe entirely (see the dispatch-ref note at the top of this file), so this duplicate was
      # latent, not causal. Do not reinstate. The single source of truth for daily-plan scheduling is
      # the `ensure_rule`/`retire_rule` step above.

  # A0.3 — post-deploy verification (HARD GATE; deliberately NOT continue-on-error).
  #
  # MOVED 2026-09-17 (OPS-LAMCHANGEDBLIND-002) to .github/workflows/verify-lambda-invariants.yml, which
  # now carries the assertions VERBATIM and is their single source of truth. Nothing about this deploy's
  # behaviour changes: `needs: deploy` still means it runs only when the 26-function matrix succeeded, it
  # is still a hard gate, and it is still deliberately EXCLUDED from the `deploy_result` output above, so
  # a config-drift failure reds the run without withholding a good frontend.
  #
  # WHY IT MOVED: promote-gate skips this entire workflow on an SPA-only promote and took these
  # assertions with it — and they are the repo's only live-AWS check of state that drifts with no repo
  # change at all. promote-gate.yml now calls the same reusable workflow unconditionally, as the last job
  # of every promote. THIS call is KEPT so the gate still covers the two paths promote-gate never
  # reaches: a manual workflow_dispatch of this file, and scripts/revert-to.py, which dispatches this
  # workflow directly during a revert. Running it twice on a Lambda-carrying promote is ~1 minute of
  # read-only AWS calls and is the deliberate trade against leaving a gap.
  #
  # The job's API name becomes `verify-daily-plan / verify` (nested reusable workflow). Both readers of
  # these job names were checked: revert-to.py's `_is_lambda_leg` selects matrix legs POSITIVELY
  # (`name == "deploy"` or `name.startswith("deploy (")`), so it excludes this job under either name; and
  # verify-deploy.py's `_lambda_job_ok` matches the `deploy-lambdas /` prefix, which the extra nesting
  # level preserves.
  #
  # No `secrets: inherit` — the called workflow uses none (vars.AWS_DEPLOY_ROLE_ARN is a repo variable).
  verify-daily-plan:
    needs: deploy
    uses: ./.github/workflows/verify-lambda-invariants.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

# Note: Lambda functions pull NEON_DATABASE_URL and CLERK_SECRET_KEY from AWS Secrets Manager
# at runtime (path: garden-app/neon-database-url and garden-app/clerk-secret-key).
# These are NOT injected as GitHub Actions env vars — no DB credentials touch GitHub.
# Lambda execution role requires secretsmanager:GetSecretValue on arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:garden-app/*
