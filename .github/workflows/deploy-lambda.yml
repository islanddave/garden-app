name: Deploy Lambda Functions

on:
  push:
    branches: [main]
    paths:
      - 'lambda/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: lambda-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # claim env:production OIDC subject for garden-app-github-deploy trust (scoped 2026-05-05)
    strategy:
      matrix:
        # One job per Lambda function directory under lambda/
        function: [projects, plants, locations, events, favorites, photos, dashboard, inventory-items, varieties, app-events, achievements, ux-events, xp-reconcile, critter, shared-state, findings, daily-plan-read, members, evidence-ingest, daily-plan, tags, storage-location, preservation, harvests, facebook-share, photocdn-derivative]
      # No max-parallel cap: all functions dispatch in one wave so the
      # environment:production approval gate prompts ONCE (not 3 batches of 4).
      # Re-add `max-parallel: N` here only if Lambda control-plane rate limits appear.
      fail-fast: false

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.0'
          # no root-level lockfile — caching disabled for lambda subdirs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # V3-EVENT-008: regenerate the events Lambda's event-type vocabulary from the
      # canonical src/lib/eventTypes.js BEFORE zipping, so a stale committed copy can
      # never ship. events function only; fails the build if it would drift.
      - name: Regenerate event-types (events only)
        if: matrix.function == 'events'
        run: |
          npm run gen:event-types
          npm run check:event-types

      - name: Build and zip ${{ matrix.function }}
        if: matrix.function != 'photocdn-derivative'
        run: |
          cd lambda/${{ matrix.function }}
          npm install --omit=dev
          zip -r ../${{ matrix.function }}.zip .

      # V4-PHOTOCDN-001: photocdn-derivative is nodejs22.x/arm64 and depends on `sharp` (native).
      # The GHA runner is x86_64, so a plain `npm install` would package the x64 sharp binary -> a
      # module-load 502 on the arm64 Lambda (invisible until an internal invoke, days later). Install
      # the linux-arm64 binary explicitly and HARD-ASSERT it is inside the zip before deploying.
      - name: Build and zip photocdn-derivative (arm64 sharp)
        if: matrix.function == 'photocdn-derivative'
        run: |
          node -v && npm -v
          cd lambda/photocdn-derivative
          npm install --omit=dev --os=linux --cpu=arm64 --include=optional
          zip -r ../photocdn-derivative.zip .
          if ! unzip -l ../photocdn-derivative.zip | grep -q 'sharp-linux-arm64'; then
            echo "FATAL: linux-arm64 sharp binary missing from zip — refusing to deploy an x64 build to an arm64 Lambda"; exit 1
          fi
          unzip -l ../photocdn-derivative.zip | grep -q 'node_modules/blurhash' || { echo "FATAL: blurhash dep missing from zip"; exit 1; }
          echo "arm64 sharp + blurhash present in photocdn-derivative.zip"

      - name: Deploy or create ${{ matrix.function }}
        run: |
          FUNCTION_NAME="garden-${{ matrix.function }}"
          ZIP_FILE="fileb://lambda/${{ matrix.function }}.zip"

          # Check if function exists; create on first deploy, update thereafter
          if aws lambda get-function --function-name "$FUNCTION_NAME" 2>/dev/null; then
            echo "Updating existing function: $FUNCTION_NAME"
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file "$ZIP_FILE"
          else
            echo "Creating new function: $FUNCTION_NAME"
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime nodejs20.x \
              --handler index.handler \
              --role ${{ vars.LAMBDA_EXECUTION_ROLE_ARN }} \
              --zip-file "$ZIP_FILE" \
              --timeout 30 \
              --memory-size 256
          fi

      - name: Wait for ${{ matrix.function }} update to complete
        run: |
          aws lambda wait function-updated \
            --function-name "garden-${{ matrix.function }}"
          echo "garden-${{ matrix.function }} is active"

      # B1 (V4-HARVESTVIEW-001): garden-harvests is HOUSEHOLD-SCOPED (householdScope reads
      # GARDEN_HOUSEHOLD_IDS). The create-function branch above sets ZERO env vars, so on the FIRST
      # prod deploy this net-new Lambda would have NO GARDEN_HOUSEHOLD_IDS -> householdScope silently
      # collapses to [userId] and Dave/Jen would see DISJOINT harvest lists (a silent per-user data
      # partition). There is no pre-existing GARDEN_HOUSEHOLD_IDS ensure step in this workflow — the
      # value was set manually on the older household lambdas — so we SOURCE it from a sibling that
      # already carries it (garden-events, canonical live) and READ-MERGE it onto garden-harvests.
      # READ-MERGE (get-function-configuration -> jq '. + {...}') is MANDATORY: the Lambda
      # --environment update is SET-not-MERGE, so a naive set would wipe every other env var.
      # 0A.6: garden-members joined — the roster is now filtered by householdScope; without the
      # env it fail-closes to [caller] and the AssigneePicker silently loses the other household
      # member. Same read-merge mechanics as the original harvests step.
      # BUG-TAGENTOWN-001 (v3.75.0): garden-tags joined — entityExists now carries a household
      # ownership predicate; without the env it fail-closes to [caller] and every cross-member
      # tag attach 404s (pre-promote impact pass found the live fn had no GARDEN_HOUSEHOLD_IDS).
      - name: Ensure GARDEN_HOUSEHOLD_IDS env for household-scoped fns (read-merge)
        if: matrix.function == 'harvests' || matrix.function == 'members' || matrix.function == 'tags'
        continue-on-error: true  # requires lambda:GetFunctionConfiguration + lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-${{ matrix.function }}"
          SRC="garden-events"  # canonical live source of GARDEN_HOUSEHOLD_IDS (household mode is live)
          HH=$(aws lambda get-function-configuration --function-name "$SRC" \
            --query 'Environment.Variables.GARDEN_HOUSEHOLD_IDS' --output text 2>/dev/null || echo "None")
          if [[ "$HH" == "None" || -z "$HH" ]]; then
            echo "::warning::B1 UNRESOLVED — could not read GARDEN_HOUSEHOLD_IDS from $SRC. $FN"
            echo "::warning::will fall back to per-user scope (harvests: Dave and Jen see DISJOINT lists;"
            echo "::warning::members: the AssigneePicker roster collapses to the caller alone) until"
            echo "::warning::GARDEN_HOUSEHOLD_IDS is set on $FN manually."
            exit 0
          fi
          CURRENT=$(aws lambda get-function-configuration --function-name "$FN" \
            --query 'Environment.Variables.GARDEN_HOUSEHOLD_IDS' --output text 2>/dev/null || echo "None")
          if [[ "$CURRENT" == "$HH" ]]; then
            echo "GARDEN_HOUSEHOLD_IDS already correct on $FN"
          else
            echo "Setting GARDEN_HOUSEHOLD_IDS on $FN from $SRC (read-merge; was: $CURRENT)"
            EXISTING=$(aws lambda get-function-configuration --function-name "$FN" \
              --query 'Environment.Variables' --output json 2>/dev/null || echo "{}")
            UPDATED=$(echo "$EXISTING" | jq --arg v "$HH" '. + {GARDEN_HOUSEHOLD_IDS: $v}')
            echo "{\"Variables\": $UPDATED}" > "/tmp/env-$FN-household.json"
            aws lambda update-function-configuration \
              --function-name "$FN" --environment "file:///tmp/env-$FN-household.json" >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "GARDEN_HOUSEHOLD_IDS set on $FN"
          fi

      # V4-FBSHARE-001: garden-facebook-share is admin-only + household-scoped and byte-uploads photos
      # to the Graph API. Net-new, so create-function sets ZERO env — read-merge its config here.
      # FB_SHARE_ENABLED is deliberately NOT set (unset => kill switch OFF): the endpoint returns 503
      # until Dave flips it at go-live, AFTER the garden-app/facebook-page-token secret exists.
      # memory=512/timeout=60: parallel byte-uploads of up to 10 JPEGs need headroom over the 256/30 default.
      - name: Ensure facebook-share config (household + admin + bucket + secret; read-merge)
        if: matrix.function == 'facebook-share'
        continue-on-error: true  # requires lambda:Get/UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-facebook-share"
          HH=$(aws lambda get-function-configuration --function-name garden-events \
            --query 'Environment.Variables.GARDEN_HOUSEHOLD_IDS' --output text 2>/dev/null || echo "None")
          EXISTING=$(aws lambda get-function-configuration --function-name "$FN" \
            --query 'Environment.Variables' --output json 2>/dev/null || echo "{}")
          UPDATED=$(echo "$EXISTING" | jq \
            --arg hh "$HH" \
            --arg b "garden-photos-prod" \
            --arg a "user_3D2gM0hIl03gjW3JM2DjtPzm0jI" \
            --arg s "garden-app/facebook-page-token" \
            '. + {S3_PHOTOS_BUCKET:$b, ADMIN_CLERK_SUBS:$a, FB_SECRET_NAME:$s} + (if $hh != "None" and $hh != "" then {GARDEN_HOUSEHOLD_IDS:$hh} else {} end)')
          echo "{\"Variables\": $UPDATED}" > /tmp/env-fbshare.json
          aws lambda update-function-configuration --function-name "$FN" \
            --environment file:///tmp/env-fbshare.json --timeout 60 --memory-size 512 >/dev/null
          aws lambda wait function-updated --function-name "$FN"
          echo "facebook-share config ensured (household=$HH; admin; bucket; secret; 512MB/60s)"

      - name: Ensure S3_PHOTOS_BUCKET env for ${{ matrix.function }}
        # Idempotent: only updates if value differs. Required for photo-enriching
        # Lambdas that sign S3 GET URLs for featured_photo_view_url. Historical gap:
        # create-function below sets ZERO env vars, so a net-new photo-aware Lambda
        # would silently return view_url=null for every featured photo. Bug landed
        # in V2-PHOTO F1 S2 (2026-05-13, PR #36) and was patched manually 2026-05-15;
        # this step makes it self-healing for future deploys.
        if: contains(fromJSON('["plants","projects","locations","inventory-items","photos"]'), matrix.function)
        run: |
          FN="garden-${{ matrix.function }}"
          EXPECTED="garden-photos-prod"
          CURRENT=$(aws lambda get-function-configuration \
            --function-name "$FN" \
            --query 'Environment.Variables.S3_PHOTOS_BUCKET' --output text 2>/dev/null || echo "None")
          if [[ "$CURRENT" == "$EXPECTED" ]]; then
            echo "S3_PHOTOS_BUCKET already correct on $FN"
          else
            echo "Setting S3_PHOTOS_BUCKET=$EXPECTED on $FN (was: $CURRENT)"
            EXISTING=$(aws lambda get-function-configuration \
              --function-name "$FN" --query 'Environment.Variables' --output json 2>/dev/null || echo "{}")
            UPDATED=$(echo "$EXISTING" | jq --arg b "$EXPECTED" '. + {S3_PHOTOS_BUCKET: $b}')
            echo "{\"Variables\": $UPDATED}" > /tmp/env-photos-bucket.json
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --environment file:///tmp/env-photos-bucket.json >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "S3_PHOTOS_BUCKET=$EXPECTED on $FN"
          fi

      - name: Ensure PHOTO_CDN_* config env for ${{ matrix.function }}
        # V4-PHOTOCDN-001 P1: CDN issuance config for the 5 photo signers. Idempotent; merges into
        # existing env. PHOTO_CDN_ENABLED is intentionally NOT set here (unset => OFF => legacy S3
        # presign path); the CDN flip happens in a later phase by setting PHOTO_CDN_ENABLED=true.
        # The signing private key stays in Secrets Manager (garden-app/photocdn-signing) — only the
        # secret NAME + public-key id + distro domain are passed as env (no key material in config).
        if: contains(fromJSON('["plants","projects","locations","inventory-items","photos"]'), matrix.function)
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-${{ matrix.function }}"
          EXISTING=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables' --output json 2>/dev/null || echo "{}")
          UPDATED=$(echo "$EXISTING" | jq \
            --arg d "dovwpi82qccqi.cloudfront.net" \
            --arg k "K1JIPLZ9SVNU1N" \
            --arg s "garden-app/photocdn-signing" \
            '. + {PHOTO_CDN_DOMAIN:$d, PHOTO_CDN_KEY_PAIR_ID:$k, PHOTO_CDN_SIGNING_SECRET:$s}')
          if [[ "$UPDATED" == "$EXISTING" ]]; then
            echo "PHOTO_CDN_* already set on $FN"
          else
            echo "{\"Variables\": $UPDATED}" > /tmp/env-photocdn.json
            aws lambda update-function-configuration --function-name "$FN" --environment file:///tmp/env-photocdn.json >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "PHOTO_CDN_* set on $FN"
          fi

      - name: Ensure inventory-items config
        # V4-SEEDINV-001: POST /api/inventory-items/extract-seeds proxies the Anthropic
        # Messages API (image OCR runs >30s; base64 image bodies need memory headroom),
        # so this one function needs timeout=120s / memory=512MB instead of the
        # create-function defaults (30s/256MB). Idempotent: only updates when values differ.
        if: matrix.function == 'inventory-items'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-inventory-items"
          T=$(aws lambda get-function-configuration --function-name "$FN" --query 'Timeout' --output text 2>/dev/null || echo "None")
          M=$(aws lambda get-function-configuration --function-name "$FN" --query 'MemorySize' --output text 2>/dev/null || echo "None")
          if [[ "$T" == "120" && "$M" == "512" ]]; then
            echo "timeout/memory already correct on $FN (timeout=$T memory=$M)"
          else
            echo "Setting timeout=120 memory-size=512 on $FN (was: timeout=$T memory=$M)"
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --timeout 120 \
              --memory-size 512 >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "timeout=120 memory=512 set on $FN"
          fi

      - name: Ensure ADMIN_CLERK_SUBS env for ux-events
        if: matrix.function == 'ux-events'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-ux-events"
          EXPECTED="user_3D2gM0hIl03gjW3JM2DjtPzm0jI"
          CURRENT=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables.ADMIN_CLERK_SUBS' --output text 2>/dev/null || echo "None")
          if [[ "$CURRENT" == "$EXPECTED" ]]; then
            echo "ADMIN_CLERK_SUBS already correct on $FN"
          else
            EXISTING=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables' --output json 2>/dev/null || echo "{}")
            UPDATED=$(echo "$EXISTING" | jq --arg v "$EXPECTED" '. + {ADMIN_CLERK_SUBS: $v}')
            echo "{\"Variables\": $UPDATED}" > /tmp/env-ux-admin.json
            aws lambda update-function-configuration --function-name "$FN" --environment file:///tmp/env-ux-admin.json >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "ADMIN_CLERK_SUBS set on $FN"
          fi

      - name: Ensure ADMIN_CLERK_SUBS env for tags
        if: matrix.function == 'tags'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-tags"
          EXPECTED="user_3D2gM0hIl03gjW3JM2DjtPzm0jI"
          CURRENT=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables.ADMIN_CLERK_SUBS' --output text 2>/dev/null || echo "None")
          if [[ "$CURRENT" == "$EXPECTED" ]]; then
            echo "ADMIN_CLERK_SUBS already correct on $FN"
          else
            EXISTING=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables' --output json 2>/dev/null || echo "{}")
            UPDATED=$(echo "$EXISTING" | jq --arg v "$EXPECTED" '. + {ADMIN_CLERK_SUBS: $v}')
            echo "{\"Variables\": $UPDATED}" > /tmp/env-tags-admin.json
            aws lambda update-function-configuration --function-name "$FN" --environment file:///tmp/env-tags-admin.json >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "ADMIN_CLERK_SUBS set on $FN"
          fi

      - name: Ensure Function URL exists for ${{ matrix.function }}
        if: matrix.function != 'xp-reconcile' && matrix.function != 'daily-plan' && matrix.function != 'photocdn-derivative'  # xp-reconcile/daily-plan EventBridge; photocdn-derivative INTERNAL-INVOKE ONLY (spec-B2: NO public AuthType-NONE URL)
        continue-on-error: true  # requires lambda:CreateFunctionUrlConfig + lambda:GetFunctionUrlConfig + lambda:AddPermission on deploy role
        run: |
          FUNCTION_NAME="garden-${{ matrix.function }}"
          # Check if Function URL exists; create on first deploy.
          if aws lambda get-function-url-config --function-name "$FUNCTION_NAME" 2>/dev/null; then
            echo "Function URL already exists for $FUNCTION_NAME"
          else
            echo "Creating Function URL for $FUNCTION_NAME"
            aws lambda create-function-url-config \
              --function-name "$FUNCTION_NAME" \
              --auth-type NONE \
              --cors '{"AllowOrigins":["*"],"AllowMethods":["*"],"AllowHeaders":["*"]}'
            # Add resource-based policy for public invoke (required when AuthType=NONE)
            # Function URL invocations require BOTH InvokeFunctionUrl (URL-config layer)
            # AND InvokeFunction (handler-dispatch layer) — missing either returns 403
            # at the URL layer before the request reaches the handler.
            # Ref: error-log.md E-magical-nifty-franklin-pickup-002 (2026-05-08)
            aws lambda add-permission \
              --function-name "$FUNCTION_NAME" \
              --statement-id FunctionURLAllowPublicAccess \
              --action lambda:InvokeFunctionUrl \
              --principal "*" \
              --function-url-auth-type NONE 2>/dev/null || true
            aws lambda add-permission \
              --function-name "$FUNCTION_NAME" \
              --statement-id AllowPublicInvoke \
              --action lambda:InvokeFunction \
              --principal "*" 2>/dev/null || true
            echo "Function URL created for $FUNCTION_NAME"
          fi

      - name: Restore Lambda Function URL CORS (prod garden.futureishere.net)
        if: matrix.function != 'xp-reconcile' && matrix.function != 'daily-plan' && matrix.function != 'photocdn-derivative'  # photocdn-derivative has no Function URL
        continue-on-error: true  # requires lambda:UpdateFunctionUrlConfig on deploy role
        run: |
          # Set CORS to allow garden.futureishere.net (the prod SPA origin).
          # IMPORTANT: handler code uses CORS={} (empty) — the Lambda URL config IS the source of truth
          # for prod CORS. The previous "Clear" step (vestigial "handler owns CORS" assumption) was
          # racing with deploy.yml's restore step and clobbering CORS on prod — fixed 2026-05-12 by
          # 3f27c817 prod deploy incident (V1.2a-1 Session 2 staging-then-prod ship).
          aws lambda update-function-url-config \
            --function-name "garden-${{ matrix.function }}" \
            --region us-east-1 \
            --cors '{"AllowCredentials":false,"AllowHeaders":["authorization","content-type"],"AllowMethods":["GET","POST","PUT","DELETE","PATCH"],"AllowOrigins":["https://garden.futureishere.net"],"ExposeHeaders":[],"MaxAge":300}' \
            --query 'Cors.AllowOrigins[0]' --output text
          echo "CORS restored for garden-${{ matrix.function }}"

      - name: Verify photocdn-derivative (arm64 self-test + no public URL)
        if: matrix.function == 'photocdn-derivative'
        run: |
          # (a) Prove the deployed arm64 build actually loads sharp+blurhash+heif — the ONLY tripwire
          # that catches an x64-sharp mismatch or a CFN placeholder-revert (both invisible to CI's
          # static lambda tests). Internal invoke, RequestResponse.
          aws lambda invoke --function-name garden-photocdn-derivative \
            --cli-binary-format raw-in-base64-out \
            --payload '{"rawPath":"/d/__selftest__"}' /tmp/selftest.json >/dev/null
          cat /tmp/selftest.json
          python3 -c "import json,sys; d=json.load(open('/tmp/selftest.json')); b=json.loads(d['body']); assert b.get('sharp_ok') and b.get('blurhash_ok') and b.get('heif_input') and b.get('arch')=='arm64', 'self-test failed: '+str(b); print('self-test OK', b)"
          # (b) Spec-B2: assert this internal-invoke Lambda has NO public Function URL and no public
          # invoke policy (a prior generic run or drift could have created one).
          if aws lambda get-function-url-config --function-name garden-photocdn-derivative 2>/dev/null; then
            echo "FATAL: photocdn-derivative has a Function URL — spec-B2 forbids a public surface"; exit 1
          fi
          echo "verified: no Function URL on garden-photocdn-derivative"

      - name: Set xp-reconcile DRY_RUN env on first deploy
        if: matrix.function == 'xp-reconcile'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration; idempotent (only sets if unset)
        run: |
          # On first deploy, set DRY_RUN=true. Subsequent deploys preserve whatever value is currently set.
          CURRENT=$(aws lambda get-function-configuration \
            --function-name garden-xp-reconcile \
            --query 'Environment.Variables.DRY_RUN' --output text 2>/dev/null || echo "None")
          if [[ "$CURRENT" == "None" || -z "$CURRENT" ]]; then
            echo "DRY_RUN not set; defaulting to true on first deploy."
            aws lambda update-function-configuration \
              --function-name garden-xp-reconcile \
              --environment 'Variables={DRY_RUN=true}'
            aws lambda wait function-updated --function-name garden-xp-reconcile
          else
            echo "DRY_RUN already set to: $CURRENT (preserving)"
          fi

      # BUG-TODAYWATER-001 — INTRADAY REGENERATION.
      # The nightly plan is a frozen ~02:00 ET snapshot. On 2026-08-03 it was generated with a 0.98"
      # forecast for a day that delivered 3.8" observed, so Today listed 200 plantings for watering in the
      # rain; a manual re-run at 08:37 with the real figure took that to 18. Fixing the engine's gates does
      # NOT fix this — a plan computed at 02:00 is only ever as good as the 02:00 forecast. The input has to
      # be refreshed while the day is happening.
      #
      # Two refreshes, each tied to a real decision moment rather than a round number:
      #   05:30 ET — before the primary morning watering window (foliage must dry before evening or you
      #              drive foliar disease in this humidity), and before Dave looks at Today.
      #   15:30 ET — before the evening container top-up, the one call that genuinely needs observed rather
      #              than forecast rain.
      # Cron is fixed-UTC so both drift an hour with DST; each lands inside its window in either offset.
      #
      # Safe to run repeatedly by construction: writes stay gated on the Lambda's own env DRY_RUN (an event
      # can never force a live run), per-plant done state is computed at READ time from event_log
      # (V3-TODAYDONE-001) so regeneration cannot clobber check-offs, and the row carries items.prior_runs
      # so an earlier generation is auditable rather than destroyed.
      #
      # The nightly rule is (re)asserted here too. It has existed since DRG-TODAY-001 but was created out of
      # band, so it was a snowflake — declaring it makes the whole schedule reproducible and drift-visible.
      # put-rule is idempotent and the expression below is byte-identical to what is live.
      - name: Ensure EventBridge cron rules for daily-plan (nightly + intraday)
        if: matrix.function == 'daily-plan'
        continue-on-error: true  # requires events:PutRule + events:PutTargets + lambda:AddPermission on deploy role
        run: |
          set -euo pipefail
          LAMBDA_ARN=$(aws lambda get-function --function-name garden-daily-plan --query 'Configuration.FunctionArn' --output text)
          ensure_rule () {
            local NAME="$1" EXPR="$2" DESC="$3" SID="$4"
            aws events put-rule --name "$NAME" --schedule-expression "$EXPR" --state ENABLED --description "$DESC"
            aws events put-targets --rule "$NAME" --targets "Id=1,Arn=$LAMBDA_ARN"
            local RULE_ARN
            RULE_ARN=$(aws events describe-rule --name "$NAME" --query 'Arn' --output text)
            # AddPermission is idempotent-by-statement-id — a duplicate returns ResourceConflictException.
            aws lambda add-permission \
              --function-name garden-daily-plan \
              --statement-id "$SID" \
              --action lambda:InvokeFunction \
              --principal events.amazonaws.com \
              --source-arn "$RULE_ARN" 2>/dev/null || echo "AddPermission $SID already exists (expected on re-deploy)."
            echo "EventBridge rule $NAME -> garden-daily-plan ($EXPR)"
          }
          ensure_rule garden-daily-plan-nightly    'cron(0 6 * * ? *)'   'Overnight Daily Plan generation (DRG-TODAY-001). LIVE.'                                  EventBridgeInvokeDaily
          ensure_rule garden-daily-plan-intraday-am 'cron(30 9 * * ? *)'  'Intraday Daily Plan refresh, 05:30 ET, before the morning watering window (BUG-TODAYWATER-001).' EventBridgeInvokeIntradayAm
          ensure_rule garden-daily-plan-intraday-pm 'cron(30 19 * * ? *)' 'Intraday Daily Plan refresh, 15:30 ET, before the evening container pass (BUG-TODAYWATER-001).'  EventBridgeInvokeIntradayPm

      - name: Ensure EventBridge cron rule for xp-reconcile
        if: matrix.function == 'xp-reconcile'
        continue-on-error: true  # requires events:PutRule + events:PutTargets + lambda:AddPermission on deploy role
        run: |
          RULE_NAME=garden-xp-reconcile-daily
          # cron(min hr day-of-month month day-of-week year) — 04:00 UTC daily = midnight ET (standard) / 11pm ET (DST)
          aws events put-rule \
            --name "$RULE_NAME" \
            --schedule-expression 'cron(0 4 * * ? *)' \
            --state ENABLED \
            --description 'Daily XP reconciliation: heal user_stats.xp drift vs SUM(xp_events.amount)'
          # Lambda ARN for target
          LAMBDA_ARN=$(aws lambda get-function --function-name garden-xp-reconcile --query 'Configuration.FunctionArn' --output text)
          aws events put-targets \
            --rule "$RULE_NAME" \
            --targets "Id=1,Arn=$LAMBDA_ARN"
          # Permit EventBridge to invoke. AddPermission is idempotent-by-statement-id — duplicate calls return ResourceConflictException (squelched).
          RULE_ARN=$(aws events describe-rule --name "$RULE_NAME" --query 'Arn' --output text)
          aws lambda add-permission \
            --function-name garden-xp-reconcile \
            --statement-id EventBridgeInvokeDaily \
            --action lambda:InvokeFunction \
            --principal events.amazonaws.com \
            --source-arn "$RULE_ARN" 2>/dev/null || echo "AddPermission already exists (expected on re-deploy)."
          echo "EventBridge rule $RULE_NAME wired to garden-xp-reconcile (cron 0 4 * * ? *)"

      - name: Ensure daily-plan config
        # DRG-NIGHTLYTIMEOUT-001: the nightly first attempt stacks a Neon scale-to-zero cold-resume
        # stall (~21-26s on the first pool.query at 2am ET) on 6-9s of real work, blowing the 30s
        # create-function default on 24/30 nights (the async retry succeeds only because the dead
        # first attempt already woke the DB). timeout=120s absorbs the stall; memory INTENTIONALLY
        # untouched at 256MB (diagnosis proved I/O wait, not CPU). Idempotent compare-then-update,
        # cloned from "Ensure inventory-items config". NEVER pass --environment here (set-not-merge
        # wipe hazard — see verify-daily-plan invariant 1).
        if: matrix.function == 'daily-plan'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-daily-plan"
          T=$(aws lambda get-function-configuration --function-name "$FN" --query 'Timeout' --output text 2>/dev/null || echo "None")
          if [[ "$T" == "120" ]]; then
            echo "timeout already correct on $FN (timeout=$T)"
          else
            echo "Setting timeout=120 on $FN (was: timeout=$T; memory left untouched)"
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --timeout 120 >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "timeout=120 set on $FN"
          fi

      - name: Set daily-plan DRY_RUN + OWNER_FALLBACK_SUB env on first deploy
        if: matrix.function == 'daily-plan'
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration; idempotent
        run: |
          FN=garden-daily-plan
          OWNER=user_3D2gM0hIl03gjW3JM2DjtPzm0jI
          CURRENT=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables.DRY_RUN' --output text 2>/dev/null || echo "None")
          EXISTING=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables' --output json 2>/dev/null || echo "{}")
          if [[ "$CURRENT" == "None" || -z "$CURRENT" ]]; then
            echo "First deploy: DRY_RUN=true + OWNER_FALLBACK_SUB (dormant)."
            UPDATED=$(echo "$EXISTING" | jq --arg o "$OWNER" '. + {DRY_RUN:"true", OWNER_FALLBACK_SUB:$o}')
          else
            echo "DRY_RUN=$CURRENT preserved; ensuring OWNER_FALLBACK_SUB present."
            UPDATED=$(echo "$EXISTING" | jq --arg o "$OWNER" 'if has("OWNER_FALLBACK_SUB") then . else . + {OWNER_FALLBACK_SUB:$o} end')
          fi
          echo "{\"Variables\": $UPDATED}" > /tmp/env-daily-plan.json
          aws lambda update-function-configuration --function-name "$FN" --environment file:///tmp/env-daily-plan.json >/dev/null
          aws lambda wait function-updated --function-name "$FN"
          echo "env ensured on $FN"

      - name: Ensure EventBridge cron rule for daily-plan (ENABLED - engine live)
        if: matrix.function == 'daily-plan'
        continue-on-error: true  # requires events:PutRule + events:PutTargets + lambda:AddPermission
        run: |
          RULE_NAME=garden-daily-plan-nightly
          # Engine is LIVE: rule ENABLED so the nightly run SURVIVES every deploy. Was DISABLED, which silently re-darkened the engine on each prod deploy (L-186 recurrence, fixed 2026-06-21).
          aws events put-rule \
            --name "$RULE_NAME" \
            --schedule-expression 'cron(0 6 * * ? *)' \
            --state ENABLED \
            --description 'Overnight Daily Plan generation (DRG-TODAY-001). LIVE.'
          LAMBDA_ARN=$(aws lambda get-function --function-name garden-daily-plan --query 'Configuration.FunctionArn' --output text)
          aws events put-targets --rule "$RULE_NAME" --targets "Id=1,Arn=$LAMBDA_ARN"
          RULE_ARN=$(aws events describe-rule --name "$RULE_NAME" --query 'Arn' --output text)
          aws lambda add-permission \
            --function-name garden-daily-plan \
            --statement-id EventBridgeInvokeNightly \
            --action lambda:InvokeFunction \
            --principal events.amazonaws.com \
            --source-arn "$RULE_ARN" 2>/dev/null || echo "AddPermission already exists (expected on re-deploy)."
          echo "EventBridge rule $RULE_NAME wired to garden-daily-plan (DISABLED, cron 0 6 * * ? *)"

  # A0.3 — post-deploy verification (HARD GATE; deliberately NOT continue-on-error).
  # The deploy matrix tolerates partial config failures (many continue-on-error steps); this job is
  # the backstop that fails the whole deploy loudly when the daily-plan safety invariants don't hold
  # in the LIVE account:
  #   (1) garden-daily-plan env contains ALL of DRY_RUN / SYSTEM_CLERK_SUB / OWNER_FALLBACK_SUB —
  #       guards the set-not-merge wipe hazard, where a transient read failure in any env-merge step
  #       replaces the entire Variables map with a partial one;
  #   (2) DRY_RUN == "false" — a wiped/reset value silently re-darkens the nightly engine (L-186 class);
  #   (3) EventBridge rule garden-daily-plan-nightly is ENABLED with exactly one target.
  # environment:production is REQUIRED (the OIDC trust for AWS_DEPLOY_ROLE_ARN is scoped to the
  # env:production subject) — in this repo's observed behavior that means a SECOND approval prompt
  # after the deploy matrix completes. needs:deploy default semantics: this job runs only when the
  # matrix succeeded; a red matrix already fails the run on its own.
  verify-daily-plan:
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Assert daily-plan safety invariants (hard fail)
        run: |
          set -euo pipefail
          FN=garden-daily-plan
          RULE=garden-daily-plan-nightly
          fail=0
          ENVJSON=$(aws lambda get-function-configuration --function-name "$FN" --region us-east-1 \
            --query 'Environment.Variables' --output json 2>/dev/null) || ENVJSON=""
          if [[ -z "$ENVJSON" || "$ENVJSON" == "null" ]]; then
            echo "::error::INVARIANT 1 BROKEN: could not read $FN env, or env is EMPTY (function missing, or set-not-merge wipe)"
            fail=1
            ENVJSON="{}"
          fi
          for k in DRY_RUN SYSTEM_CLERK_SUB OWNER_FALLBACK_SUB; do
            v=$(echo "$ENVJSON" | jq -r --arg k "$k" '.[$k] // empty')
            if [[ -z "$v" ]]; then
              echo "::error::INVARIANT 1 BROKEN: $FN env is missing key $k (set-not-merge wipe hazard)"
              fail=1
            fi
          done
          DR=$(echo "$ENVJSON" | jq -r '.DRY_RUN // empty')
          if [[ "$DR" != "false" ]]; then
            echo "::error::INVARIANT 2 BROKEN: $FN DRY_RUN='$DR' (expected 'false') — nightly engine would be dark"
            fail=1
          fi
          STATE=$(aws events describe-rule --name "$RULE" --region us-east-1 \
            --query 'State' --output text 2>/dev/null) || STATE="MISSING"
          if [[ "$STATE" != "ENABLED" ]]; then
            echo "::error::INVARIANT 3 BROKEN: EventBridge rule $RULE state=$STATE (expected ENABLED)"
            fail=1
          fi
          NTARGETS=$(aws events list-targets-by-rule --rule "$RULE" --region us-east-1 \
            --query 'length(Targets)' --output text 2>/dev/null) || NTARGETS="0"
          if [[ "$NTARGETS" != "1" ]]; then
            echo "::error::INVARIANT 3 BROKEN: $RULE has $NTARGETS targets (expected exactly 1)"
            fail=1
          fi
          if [[ "$fail" -ne 0 ]]; then
            echo "::error::A0.3 post-deploy verification FAILED — daily-plan safety invariants do not hold; treat this deploy as BAD."
            exit 1
          fi
          echo "A0.3 verify OK: env keys present, DRY_RUN=false, $RULE ENABLED with exactly 1 target."

# Note: Lambda functions pull NEON_DATABASE_URL and CLERK_SECRET_KEY from AWS Secrets Manager
# at runtime (path: garden-app/neon-database-url and garden-app/clerk-secret-key).
# These are NOT injected as GitHub Actions env vars — no DB credentials touch GitHub.
# Lambda execution role requires secretsmanager:GetSecretValue on arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:garden-app/*
