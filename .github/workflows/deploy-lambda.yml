name: Deploy Lambda Functions

# No `push: main` trigger, deliberately. promote-gate calls this workflow as a `needs:` predecessor of the
# SPA deploy and strictly after snap.py, so the ordering is a graph edge: the new frontend never serves
# against old Lambdas, and the revertibility manifest never records a torn mix of Lambda versions.
# deploy-staging.yml has the same topology (`deploy-frontend: needs: deploy-lambdas`). main is
# capability-gated to the garden-bot App (3951762) and promote-gate's fast-forward is its only writer.
#
# ⚠️ DISPATCH-REF TRAP. A CHANGE TO THIS FILE CANNOT TAKE EFFECT ON THE PROMOTE THAT SHIPS IT, IF THAT
# PROMOTE IS DISPATCHED FROM `main`. promote-gate calls this workflow with
# `uses: ./.github/workflows/deploy-lambda.yml`, and a *local* `uses: ./…` reference is resolved from the
# CALLER RUN'S OWN COMMIT (`github.sha`), NOT from the `ref:` input below, which only feeds the checkout. A
# promote dispatched on main pins the definitions before main is fast-forwarded, so it runs NEW SOURCE CODE
# UNDER OLD STEP DEFINITIONS, and is green because it correctly did what the old recipe said. The reverse
# also bites: a recipe that builds with scripts/package-lambda.sh cannot build a tree without that script,
# so promote such a tree from dev.
#
# RULE: dispatch promote-gate from `dev` (or from an explicit SHA that carries the intended recipe)
# whenever the promote includes a change to this file or to promote-gate.yml. Verify the change landed by
# reading LIVE AWS, never by the run's colour: a green promote is compatible with it never having executed.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Exact SHA to deploy. promote-gate passes the promoted dev SHA so the Lambda code and the SPA build come from one commit.'
        required: false
        default: ''
        type: string
    outputs:
      deploy_result:
        # The SPA gate keys on THIS, not on the called workflow's aggregate result: `verify-daily-plan`
        # below hard-fails by design on invariants unrelated to the frontend, and reds the run without
        # holding a good SPA hostage. `deploy` is a fail-fast:false matrix over all 26 functions, so its
        # own result already aggregates every leg: any failed function => not 'success' => SPA withheld.
        description: 'Result of the 26-function deploy matrix only (excludes the post-deploy daily-plan invariant check).'
        value: ${{ jobs.deploy.result }}
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: lambda-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    # Bounds a leg that hangs once it is RUNNING (a stuck `aws lambda wait`, npm install, zip upload). Each matrix
    # leg is its own job with its own 10 minutes; the slowest healthy leg on record is 148 s. It does NOT bound a
    # leg still waiting for a runner: that is scripts/run-status.py STUCK, then cancel and re-run the failed jobs.
    # Pinned by scripts/test_workflow_steps.py; the caller job in promote-gate.yml cannot carry a limit (`uses:`).
    timeout-minutes: 10
    environment: production  # the env:production OIDC subject is what garden-app-github-deploy trusts
    strategy:
      matrix:
        # One job per Lambda function directory under lambda/
        function: [projects, plants, locations, events, favorites, photos, dashboard, inventory-items, varieties, app-events, achievements, ux-events, xp-reconcile, critter, shared-state, findings, daily-plan-read, members, evidence-ingest, daily-plan, tags, storage-location, preservation, harvests, facebook-share, photocdn-derivative]
      # No max-parallel cap: every function deploys in one wave. Add `max-parallel: N` only if Lambda
      # control-plane rate limits appear.
      fail-fast: false

    steps:
      # OPS-MAINREFGUARD-001 (decision S1-postFF-2, 2026-10-11). A prod deploy job ships main's head and nothing
      # else. This step is FIRST, ahead of the checkout, and has no `if:` and no `continue-on-error`: a refusal
      # ends the job before anything is fetched, built, uploaded or updated.
      #
      # What it stops: "Re-run failed jobs" on an old promote, or a hand dispatch on an old ref, putting an older
      # commit over a newer one. A re-run keeps the run's original commit and the original `ref` input, so
      # without this the old code simply deploys again.
      #
      # WANT is the same expression the checkout below builds. Under workflow_call `github.sha` is the CALLER's
      # commit, so the `ref` input wins whenever it is given; on a direct dispatch there is no `ref` and
      # `github.sha` is the head of the dispatched ref. It must be a full SHA: a branch name would be compared
      # with nothing.
      #
      # main is read from the API by exact ref name, never from a checkout (there is none yet, and a checkout
      # is the thing being checked). Unreadable six times, 10 s apart = REFUSE, never pass. A main that is not
      # WANT is read twice more, 10 s apart (a ref read can trail a fast-forward made seconds earlier, and on
      # a revert a false refusal costs a rollback); only the NEWEST read decides: equal passes, else refuse.
      #
      # Paths: promote-gate calls this after its own fast-forward, so main == ref; scripts/revert-to.py moves
      # main to its revert commit (and, on rollback, to its restore commit) BEFORE it dispatches this file on
      # main, so main == github.sha there too and no opt-out exists or is needed. deploy-staging.yml does not
      # use this job. On a revert the forward legs run the TARGET release's workflow files, so they carry this
      # step only when that release already shipped it, and the step protects runs created at or after the
      # SHA that ships it (a re-run of an older run keeps its own workflow files). The step is byte-identical
      # in deploy.yml and deploy-lambda.yml; pinned, and executed against a stand-in API, by
      # scripts/test_deploy_main_guard.py.
      - name: Refuse unless main is at the commit this job deploys
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WANT: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          NOTHING="Nothing was built, uploaded or updated by this job."
          # Whole-string match (grep would accept any one matching LINE), digits spelled out (a range is locale-dependent).
          HEX40='^[0123456789abcdef]{40}$'
          if [[ ! "$WANT" =~ $HEX40 ]]; then
            echo "::error::deploy refused: the commit to deploy must be a full 40-hex SHA, got '$WANT'. $NOTHING Remedy: dispatch on ref main with no ref input, or promote through promote-gate."; exit 1
          fi
          OUT=$(mktemp)
          FAILS=0
          DIFFS=0
          # Two budgets: 6 reads with no usable SHA, 3 reads of a main that is not WANT. The loop ends on the read that
          # spends a budget or on a read equal to WANT, so the verdict below is always about the newest read.
          while true; do
            MAIN=""
            CODE=$(curl -sS --max-time 20 -o "$OUT" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/git/ref/heads/main") || CODE="curl-failed"
            if [ "$CODE" = "200" ]; then
              MAIN=$(jq -r 'select(.ref == "refs/heads/main") | .object.sha' "$OUT" 2>/dev/null) || MAIN=""
              if [[ ! "$MAIN" =~ $HEX40 ]]; then MAIN=""; fi
            fi
            if [ "$MAIN" = "$WANT" ]; then break; fi
            if [ -n "$MAIN" ]; then
              DIFFS=$((DIFFS + 1))
              echo "read of main: at $MAIN, not $WANT (differing read $DIFFS of 3)"
              if [ "$DIFFS" = "3" ]; then break; fi
            else
              FAILS=$((FAILS + 1))
              echo "read of main: HTTP $CODE and no usable SHA (failed read $FAILS of 6)"
              if [ "$FAILS" = "6" ]; then break; fi
            fi
            sleep 10
          done
          if [ -z "$MAIN" ]; then
            echo "::error::deploy refused: could not read where main points (6 failed reads, last answer: HTTP $CODE), so this job cannot prove that $WANT is main's head. $NOTHING Remedy: 'Re-run failed jobs' on this run once GitHub answers."; exit 1
          fi
          if [ "$MAIN" != "$WANT" ]; then
            echo "::error::deploy refused: main is at $MAIN (the newest of 3 reads 10 s apart, none of them this commit) but this job would deploy $WANT. $NOTHING A prod deploy ships main's head and nothing else. main has moved: do NOT re-run this run; whatever moved main (a newer promote, or a revert) owns prod. Remedy: to ship $WANT, promote it through promote-gate; if scripts/revert-to.py dispatched this run, follow the revert tool's own output (it rolls back or stops and says so); a hand dispatch goes on ref main."; exit 1
          fi
          echo "main is at $MAIN, the commit this job deploys: proceeding"

      # promote-gate passes the promoted dev SHA so the Lambda code and the SPA build come from ONE commit
      # (deploy.yml takes the same `ref`). Empty (workflow_dispatch) => github.sha, the dispatched head.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc  # read from the checked-out tree; must name the Lambda runtime's major (lambda-config-expected.json)
          # no root-level lockfile — caching disabled for lambda subdirs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # One packaging script builds every zip, prod and staging alike: events regeneration, install, zip without
      # test files, and the in-zip asserts (photocdn-derivative: the linux-arm64 sharp binary). deploy-staging.yml
      # carries this step byte-identical (scripts/test_workflow_steps.py); check-lambda-current.py lists the script.
      - name: Build and zip ${{ matrix.function }}
        env:
          FN: ${{ matrix.function }}
        run: bash scripts/package-lambda.sh "$FN"

      # update-function-code never touches Runtime, so this step moves an existing function to the runtime
      # declared in scripts/lambda-config-expected.json (a no-op once it is there). It sends Runtime only,
      # never an env map, so nothing else in the configuration can be overwritten. It runs BEFORE the code
      # update so AWS never has to accept a code update on a deprecated runtime; the previous code runs on
      # the new runtime for the seconds until the update lands. The promote's staging gate runs this body
      # too, but usually only its no-op branch. continue-on-error like the other config-ensure steps:
      # verify-lambda-invariants asserts `runtime` after every promote, so a failure reds the run without
      # withholding the SPA; it also withholds the deploy marker (the marker step's `if:`), and
      # check-lambda-current reads an undeclared runtime as NOT CURRENT, so the next promote redeploys and
      # retries. The body is byte-identical to deploy-staging.yml's copy (scripts/test_ensure_runtime_step.py).
      - name: Ensure declared runtime on garden-${{ matrix.function }}
        id: ensure_runtime
        continue-on-error: true
        env:
          FN: garden-${{ matrix.function }}
          KEY: garden-${{ matrix.function }}
        run: |
          set -euo pipefail
          WANT=$(jq -er --arg f "$KEY" '.[$f].runtime' scripts/lambda-config-expected.json) \
            || { echo "::error::$KEY: no runtime declared in scripts/lambda-config-expected.json"; exit 1; }
          ERR=$(mktemp)
          if ! CUR=$(aws lambda get-function-configuration --function-name "$FN" --query Runtime --output text 2>"$ERR"); then
            if grep -q ResourceNotFoundException "$ERR"; then echo "$FN does not exist yet: its create step sets the runtime, and the next deploy applies $WANT if that differs"; exit 0; fi
            cat "$ERR"; echo "::error::$FN: could not read Runtime; left unchanged"; exit 1
          fi
          if [ "$CUR" = "$WANT" ]; then echo "$FN already on $WANT"; exit 0; fi
          echo "Moving $FN runtime $CUR -> $WANT"
          if ! aws lambda update-function-configuration --function-name "$FN" --runtime "$WANT" >/dev/null; then
            echo "::error::$FN: runtime update to $WANT refused"; exit 1
          fi
          if ! aws lambda wait function-updated --function-name "$FN"; then
            echo "::error::$FN: did not settle after the runtime update to $WANT"; exit 1
          fi
          GOT=$(aws lambda get-function-configuration --function-name "$FN" --query '[Runtime,LastUpdateStatus]' --output text)
          if [ "$GOT" != "$(printf '%s\tSuccessful' "$WANT")" ]; then echo "::error::$FN: Runtime/LastUpdateStatus read '$GOT' after the update, want $WANT/Successful"; exit 1; fi
          echo "$FN runtime $WANT"

      - name: Deploy or create ${{ matrix.function }}
        run: |
          FUNCTION_NAME="garden-${{ matrix.function }}"
          ZIP_FILE="fileb://lambda/${{ matrix.function }}.zip"

          # Check if function exists; create on first deploy, update thereafter. Both calls answer with the
          # function's env and a presigned code URL, so stdout is dropped: these logs are public.
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "Updating existing function: $FUNCTION_NAME"
            # Settle a runtime move first (normally a no-op). Tolerated: a function whose last update is Failed
            # still gets the code update that repairs it; one still InProgress fails it closed (ResourceConflict).
            aws lambda wait function-updated --function-name "$FUNCTION_NAME" \
              || echo "::warning::$FUNCTION_NAME: last update not Successful; trying the code update anyway"
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file "$ZIP_FILE" >/dev/null
          else
            echo "Creating new function: $FUNCTION_NAME"
            RT=$(jq -er --arg f "$FUNCTION_NAME" '.[$f].runtime' scripts/lambda-config-expected.json) \
              || { echo "::error::$FUNCTION_NAME: no runtime declared in scripts/lambda-config-expected.json"; exit 1; }
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime "$RT" \
              --handler index.handler \
              --role ${{ vars.LAMBDA_EXECUTION_ROLE_ARN }} \
              --zip-file "$ZIP_FILE" \
              --timeout 30 \
              --memory-size 256
          fi

      - name: Wait for ${{ matrix.function }} update to complete
        run: |
          aws lambda wait function-updated \
            --function-name "garden-${{ matrix.function }}"
          echo "garden-${{ matrix.function }} is active"

      # Every function that reads GARDEN_HOUSEHOLD_IDS gets it from ONE source, this environment's
      # GARDEN_HOUSEHOLD_IDS secret; no value is in the repo. The URL handlers' SEC-13a household gate fails
      # closed (403) without it. The step never shrinks a live list: a list wider than the secret is a hand
      # widening (the lockout undo) and is kept with a warning, and a list naming different members is
      # refused. It prints no entry, only counts and a sha256 prefix, because these logs are public.
      # Read-merge, as every env step here (--environment is SET-not-MERGE). It runs AFTER the code update,
      # so it is the backstop: set the list live before code that needs it ships. The run body is
      # byte-identical in deploy-lambda.yml and deploy-staging.yml (scripts/test_check_lambda_config.py)
      # and is executed against a stub aws by scripts/test_deploy_staging_env.py.
      - name: Ensure GARDEN_HOUSEHOLD_IDS env for household-scoped fns (read-merge)
        if: matrix.function == 'projects' || matrix.function == 'plants' || matrix.function == 'locations' || matrix.function == 'events' || matrix.function == 'favorites' || matrix.function == 'photos' || matrix.function == 'dashboard' || matrix.function == 'inventory-items' || matrix.function == 'varieties' || matrix.function == 'app-events' || matrix.function == 'achievements' || matrix.function == 'ux-events' || matrix.function == 'critter' || matrix.function == 'shared-state' || matrix.function == 'findings' || matrix.function == 'daily-plan-read' || matrix.function == 'members' || matrix.function == 'evidence-ingest' || matrix.function == 'daily-plan' || matrix.function == 'tags' || matrix.function == 'storage-location' || matrix.function == 'preservation' || matrix.function == 'harvests' || matrix.function == 'facebook-share'
        continue-on-error: true  # requires lambda:GetFunctionConfiguration + lambda:UpdateFunctionConfiguration on deploy role
        env:
          FN: garden-${{ matrix.function }}
          HH_CANON: ${{ secrets.GARDEN_HOUSEHOLD_IDS }}
        run: |
          set -o pipefail
          HH=$(printf '%s' "${HH_CANON:-}" | tr -d '\r\n')
          if [ -z "$(printf '%s' "$HH" | tr -d ', \t')" ]; then
            echo "::error::$FN: this environment's GARDEN_HOUSEHOLD_IDS secret is empty or missing; nothing written"
            exit 1
          fi
          ids() { printf '%s\n' "$1" | tr ',' '\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' | LC_ALL=C sort -u; }
          mask() { while IFS= read -r e; do echo "::add-mask::$e"; done; }
          CANON=$(ids "$HH")
          printf '%s\n' "$CANON" | mask
          # OPS-LAMBDAENVWIPE-001: test the read's EXIT STATUS, never emptiness. A function with no env reads
          # back `null` at exit 0 and merges correctly; a failed read must never become an empty merge base.
          if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" \
            --query 'Environment.Variables' --output json 2>/tmp/env-read-err); then
            CAUSE=$(tr -s '\r\n' '  ' </tmp/env-read-err | sed -e 's/^ //' -e 's/ $//' | cut -c1-400)
            echo "::warning::could not read env for $FN (${CAUSE:-no error text}); leaving GARDEN_HOUSEHOLD_IDS untouched rather than risking a wipe"
            exit 1
          fi
          LIVE_RAW=$(printf '%s' "$EXISTING" | jq -r '(. // {}).GARDEN_HOUSEHOLD_IDS // ""')
          LIVE=$(ids "$LIVE_RAW")
          if [ -n "$LIVE" ]; then printf '%s\n' "$LIVE" | mask; fi
          if [ -z "$LIVE" ]; then
            VERDICT=added
          elif [ "$LIVE" = "$CANON" ]; then
            if [ "$LIVE_RAW" = "$HH" ]; then VERDICT=same; else VERDICT=normalized; fi
          else
            ONLY_LIVE=$(LC_ALL=C comm -23 <(printf '%s\n' "$LIVE") <(printf '%s\n' "$CANON"))
            ONLY_CANON=$(LC_ALL=C comm -13 <(printf '%s\n' "$LIVE") <(printf '%s\n' "$CANON"))
            if [ -z "$ONLY_LIVE" ]; then VERDICT=widened
            elif [ -z "$ONLY_CANON" ]; then VERDICT=live-wider
            else VERDICT=differ; fi
          fi
          N=$(printf '%s\n' "$CANON" | wc -l | tr -d ' ')
          SUM=$(printf '%s' "$HH" | sha256sum | cut -c1-12)
          case "$VERDICT" in
            same)
              echo "GARDEN_HOUSEHOLD_IDS already correct on $FN ($N entries, sha256 $SUM)"
              exit 0 ;;
            live-wider)
              echo "::warning::$FN carries a wider GARDEN_HOUSEHOLD_IDS than this environment's secret (a hand widening?): kept, because a deploy never shrinks the list. Update the secret to match."
              exit 0 ;;
            differ)
              echo "::error::$FN: its GARDEN_HOUSEHOLD_IDS and this environment's secret name different members. Nothing written: a person decides which list is right."
              exit 1 ;;
          esac
          UPDATED=$(echo "$EXISTING" | jq --arg v "$HH" '. + {GARDEN_HOUSEHOLD_IDS: $v}')
          echo "{\"Variables\": $UPDATED}" > "/tmp/env-$FN-household.json"
          aws lambda update-function-configuration \
            --function-name "$FN" --environment "file:///tmp/env-$FN-household.json" >/dev/null
          aws lambda wait function-updated --function-name "$FN"
          rm -f "/tmp/env-$FN-household.json"
          echo "GARDEN_HOUSEHOLD_IDS $VERDICT on $FN ($N entries, sha256 $SUM)"

      # garden-facebook-share is admin-only and household-scoped, and byte-uploads photos to the Graph API.
      # create-function sets ZERO env, so its config is read-merged here. This step never sets or unsets
      # FB_SHARE_ENABLED: the read-merge keeps the live value, the kill switch is operated from the console,
      # and scripts/lambda-config-expected.json declares its expected state. timeout/memory are read from
      # that same manifest, not hardcoded below.
      - name: Ensure facebook-share config (admin + bucket + secret; read-merge)
        if: matrix.function == 'facebook-share'
        continue-on-error: true  # requires lambda:Get/UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-facebook-share"
          # Read the CURRENT env and abort the step if it cannot be read. The old code fell back to
          # "{}" here, which silently turned a read blip into a WIPE: the merge below would then emit
          # only the four hardcoded keys, dropping FB_SHARE_ENABLED and re-darkening a LIVE feature
          # during an unrelated deploy. The step is continue-on-error, so bailing leaves the existing
          # config untouched — strictly safer than overwriting it. Same `|| echo "{}"` shape appears
          # at 6 other sites in this file; this is the one guarding a live kill switch.
          if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" \
            --query 'Environment.Variables' --output json 2>/dev/null); then
            echo "::warning::could not read $FN config; leaving env untouched rather than risking a wipe"
            exit 1
          fi
          UPDATED=$(echo "$EXISTING" | jq \
            --arg b "garden-photos-prod" \
            --arg a "user_3D2gM0hIl03gjW3JM2DjtPzm0jI" \
            --arg s "garden-app/facebook-page-token" \
            --arg igs "garden-photos-derivatives-769788341849" \
            '. + {S3_PHOTOS_BUCKET:$b, ADMIN_CLERK_SUBS:$a, FB_SECRET_NAME:$s, IG_STAGING_BUCKET:$igs}')
          echo "{\"Variables\": $UPDATED}" > /tmp/env-fbshare.json
          # Timeout/memory come from scripts/lambda-config-expected.json — the SAME file the post-deploy
          # drift guard asserts against — instead of a second hardcoded copy here. Two sources of truth
          # for these four numbers is the root cause of OPS-FBSHAREFLAGDRIFT-001: this step hardcoded
          # 60/512 with no read, no comparison and no log line, so it silently reverted a deliberate
          # 180s/1024MB raise on the next deploy and the drift guard then red-flagged the promote.
          # (Why 180s/1024MB at all: this fans out over up to 10 photos — S3 GetObject + metadata strip
          # + a multipart Graph upload each — and a timeout mid-Promise.all orphans uploaded Graph media
          # with NO cleanup, because neither catch nor finally runs on a Lambda timeout.)
          # jq -e exits non-zero on null/missing, and the default GHA shell is `bash -e`, so a manifest
          # that stops declaring these values fails the step loudly instead of writing a silent default.
          CFG=scripts/lambda-config-expected.json
          TMO=$(jq -er '.["garden-facebook-share"].timeout' "$CFG")
          MEM=$(jq -er '.["garden-facebook-share"].memory' "$CFG")
          aws lambda update-function-configuration --function-name "$FN" \
            --environment file:///tmp/env-fbshare.json --timeout "$TMO" --memory-size "$MEM" >/dev/null
          aws lambda wait function-updated --function-name "$FN"
          echo "facebook-share config ensured (admin; bucket; secret; ${MEM}MB/${TMO}s from $CFG)"

      - name: Ensure S3_PHOTOS_BUCKET env for ${{ matrix.function }}
        # Idempotent: only updates if the value differs. The photo-enriching Lambdas sign S3 GET URLs for
        # featured_photo_view_url, and create-function sets ZERO env vars, so without this a net-new
        # photo-aware Lambda silently returns view_url=null for every featured photo.
        if: contains(fromJSON('["plants","projects","locations","inventory-items","photos"]'), matrix.function)
        run: |
          FN="garden-${{ matrix.function }}"
          EXPECTED="garden-photos-prod"
          CURRENT=$(aws lambda get-function-configuration \
            --function-name "$FN" \
            --query 'Environment.Variables.S3_PHOTOS_BUCKET' --output text 2>/dev/null || echo "None")
          if [[ "$CURRENT" == "$EXPECTED" ]]; then
            echo "S3_PHOTOS_BUCKET already correct on $FN"
          else
            echo "Setting S3_PHOTOS_BUCKET=$EXPECTED on $FN (was: $CURRENT)"
            # OPS-LAMBDAENVWIPE-001: test EXIT STATUS, not emptiness (rationale on the household step).
            # This step has NO continue-on-error, so it warns and SKIPS the write rather than exiting 1
            # — refusing to destroy an env map must not newly red an otherwise good deploy. The
            # post-deploy drift guard (scripts/check-lambda-config.py) reports any resulting gap.
            if ! EXISTING=$(aws lambda get-function-configuration \
              --function-name "$FN" --query 'Environment.Variables' --output json 2>/dev/null); then
              echo "::warning::could not read env for $FN; skipping S3_PHOTOS_BUCKET write rather than risking a wipe"
              exit 0
            fi
            UPDATED=$(echo "$EXISTING" | jq --arg b "$EXPECTED" '. + {S3_PHOTOS_BUCKET: $b}')
            echo "{\"Variables\": $UPDATED}" > /tmp/env-photos-bucket.json
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --environment file:///tmp/env-photos-bucket.json >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            echo "S3_PHOTOS_BUCKET=$EXPECTED on $FN"
          fi

      - name: Ensure PHOTO_CDN_* config env for ${{ matrix.function }}
        # CDN issuance config for the 5 photo signers. Idempotent; merges into existing env.
        # PHOTO_CDN_ENABLED is intentionally NOT set here (unset => OFF => legacy S3 presign path). The
        # signing private key stays in Secrets Manager (garden-app/photocdn-signing): only the secret NAME,
        # public-key id and distro domain are passed as env, never key material.
        if: contains(fromJSON('["plants","projects","locations","inventory-items","photos"]'), matrix.function)
        continue-on-error: true  # requires lambda:UpdateFunctionConfiguration on deploy role
        run: |
          FN="garden-${{ matrix.function }}"
          # OPS-LAMBDAENVWIPE-001: the `[[ "$UPDATED" == "$EXISTING" ]]` test below is a NO-OP detector,
          # not a failure detector — on a failed read the two necessarily DIFFER, so it routed the
          # failure case straight into the write, across all five photo signers. Test exit status here.
          if ! EXISTING=$(aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables' --output json 2>/dev/null); then
            echo "::warning::could not read env for $FN; leaving PHOTO_CDN_* untouched rather than risking a wipe"
            exit 1
          fi
          UPDATED=$(echo "$EXISTING" | jq \
            --arg d "dovwpi82qccqi.cloudfront.net" \
