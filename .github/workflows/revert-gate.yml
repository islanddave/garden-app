name: revert-gate

# B2 production revert (spec repo-version-env-spec-V100 §3 B2). Reverts prod to a previously-snapped
# version vX as a SINGLE transaction gated on environment:production-destructive, restoring code + DB +
# Lambda versions as a coherent pair via scripts/revert-to.py. Runs AS garden-bot (App 3951762) — the sole
# actor permitted to advance main (the code leg FF-promotes a forward revert-commit). The revert is itself
# revertible: revert-to.py takes a PRE-REVERT snap of CURRENT prod first, so a bad revert can be rolled back.
#
# Relationship to revert-rehearsal.yml: that workflow exercises the SAME script against STAGING with
# REHEARSAL_MODE=1 (throwaway refs, prod Lambda/CF legs skipped). THIS workflow is the real thing —
# REHEARSAL_MODE is OFF, the code legs target real dev/main, and CONFIRM_DATA_LOSS must be "yes".
#
# Dispatchability: workflow_dispatch requires the workflow on the default branch (main). It IS on main —
# see STATUS below. Edits made here on dev do not take effect for a dispatch until the next promote-gate
# ship carries them to main; the Actions UI keeps running main's copy in the meantime.
#
# APPROVAL GATE (2026-08-05, OPS-REVERTGATE-001). This job runs under `environment: production-destructive`,
# which carries a REQUIRED REVIEWER (islanddave) — the run pauses at the environment gate until that review is
# granted, so the dispatcher cannot also be the sole approver. Do NOT point this at `environment: production`:
# that environment carries a branch/tag ref policy ONLY and has had ZERO required reviewers since 2026-06-22,
# so it is not an approval stop of any kind. Prior versions of this header claimed a "Dave-approved" gate that
# did not exist in infrastructure; the `confirm_data_loss` dropdown was the only guard and it is selected by
# whoever is already dispatching.
#
# STATUS — LIVE AND DISPATCHABLE (verified 2026-09-10). `state: active`, and this file is present on the
# default branch (main), so it is dispatchable from the Actions UI right now. An earlier version of this
# header said it had been disabled via `gh workflow disable` on 2026-08-05 and needed `gh workflow enable`
# once it reached main; that stopped being true when it reached main. Do NOT plan an incident response
# around this workflow being inert.
#
# IAM trust policy — SATISFIED, no longer a prereq (verified 2026-09-10). The snap OIDC role
# (SNAP_AWS_ROLE_ARN = arn:aws:iam::769788341849:role/garden-app-github-snap) trusts BOTH subjects as an
# exact-match list:
#   repo:islanddave/garden-app:environment:production
#   repo:islanddave/garden-app:environment:production-destructive
# so sts:AssumeRoleWithWebIdentity SUCCEEDS for this job and the AWS legs do get credentials. This block
# previously read "BLOCKING PREREQ ... trusts EXACTLY ONE subject"; it is done. Keep it an exact-match list
# of two literal subjects — do NOT relax it to a StringLike wildcard. Corollary for anyone triaging
# mid-incident: the credential step is NOT a safety net, it will succeed. The step that fails safe is the
# IAM preflight below.
#
# PERMISSION PREFLIGHT — THIS WORKFLOW CURRENTLY ABORTS, BY DESIGN (OPS-REVERTPREFLIGHT, 2026-09-10).
# scripts/revert-to.py restores the prod DB (~:928) BEFORE its Lambda (~:825) and CloudFront (~:837) legs,
# and the snap role is not granted lambda:UpdateFunctionCode or cloudfront:CreateInvalidation — both
# implicitDeny per simulate-principal-policy, 2026-09-10. Unguarded, a real revert restores prod to N-1,
# dies on the code leg, and rolls the DB back from the PRE-revert snap — silently destroying every prod
# write made in between, then raising a "prod may be inconsistent — PAGE DAVE" that is, in that failure
# mode, a false alarm indistinguishable from a real one. The preflight step below simulates all six actions
# the revert can perform and aborts before anything is touched unless every one is `allowed`. It fails
# TODAY and keeps failing until those two grants are added. That is correct — a rollback that cannot
# complete must refuse to begin. There is no bypass flag and no warn-only mode; do not add one.
# It also supersedes the old "confirm the snap role carries these permissions" note: the rehearsal SKIPS
# the prod Lambda/CF legs, so it can never prove them, and the preflight now does.
#
# Secrets: GARDEN_BOT_APP_ID, GARDEN_BOT_PRIVATE_KEY, NEON_API_KEY, NEON_PROJECT_ID, NEON_BACKUP_URL.
# Vars: SNAP_AWS_ROLE_ARN, SNAP_BUCKET, PHOTOS_BUCKET, SNAP_RETENTION.

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Snapped version to revert prod TO (must exist in SNAP_BUCKET; ^v\d+(\.\d+){0,2}$, e.g. v2.5.6)'
        required: true
        type: string
      prerevert_version:
        description: 'Fresh, unused version to snapshot CURRENT prod as before the revert (so the revert is itself revertible)'
        required: true
        type: string
      confirm_data_loss:
        description: 'Reverting prod DB to the target discards ALL prod writes since then. Select "yes" to proceed.'
        required: true
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'

permissions:
  contents: read
  id-token: write

jobs:
  revert:
    runs-on: ubuntu-latest
    environment: production-destructive
    timeout-minutes: 45
    steps:
      - name: Validate inputs (injection-safe — read from env, never interpolated into run)
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          PREREVERT_VERSION: ${{ inputs.prerevert_version }}
          CONFIRM: ${{ inputs.confirm_data_loss }}
        run: |
          set -euo pipefail
          re='^v[0-9]+(\.[0-9]+){0,2}$'
          [[ "$TARGET_VERSION" =~ $re ]] || { echo "::error::target_version '$TARGET_VERSION' invalid (need ^v\d+(\.\d+){0,2}$)"; exit 1; }
          [[ "$PREREVERT_VERSION" =~ $re ]] || { echo "::error::prerevert_version '$PREREVERT_VERSION' invalid (need ^v\d+(\.\d+){0,2}$)"; exit 1; }
          [ "$TARGET_VERSION" != "$PREREVERT_VERSION" ] || { echo "::error::prerevert_version must differ from target_version"; exit 1; }
          [ "$CONFIRM" = "yes" ] || { echo "::error::confirm_data_loss must be 'yes' to proceed (prod DB revert is data loss)"; exit 1; }
          echo "inputs valid: revert prod -> $TARGET_VERSION (pre-revert snap $PREREVERT_VERSION)"

      - name: Mint garden-bot installation token
        id: bot
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.GARDEN_BOT_APP_ID }}
          private-key: ${{ secrets.GARDEN_BOT_PRIVATE_KEY }}

      - name: Checkout dev (scripts/revert-to.py)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev

      - name: Make /usr/lib/postgresql/17 writable (cache + docker cp target)
        run: |
          sudo mkdir -p /usr/lib/postgresql/17/bin
          sudo chown -R "$(id -u):$(id -g)" /usr/lib/postgresql/17

      - name: pg17 client cache
        id: pg17-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/lib/postgresql/17/bin
          key: pg17-client-postgres17-image-v1

      - name: Fetch pg17 client from the postgres:17 image (cache miss only)
        # OPS-SCHEMACHECKAPT-001: no more apt.postgresql.org (PGDG) -- see backup.yml
        # for the full incident writeup (this pattern is identical across every
        # OPS-SCHEMACHECKAPT-001 site). This is the incident-recovery path itself: a
        # prod revert cannot be left hostage to the same third-party mirror that
        # stranded main fast-forwarded to 437164e on 2026-08-18 while stuck installing
        # this exact package inside promote-gate.
        if: steps.pg17-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cid=$(docker create postgres:17)
          docker cp "$cid:/usr/lib/postgresql/17/bin/." /usr/lib/postgresql/17/bin/
          docker rm -f "$cid" >/dev/null

      - name: Verify pg17 client
        run: /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Configure AWS credentials (snap role, OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.SNAP_AWS_ROLE_ARN }}
          aws-region: us-east-1

      # FAIL-CLOSED GATE — must stay between the credential step and revert-to.py.
      # Every ARN lives in env, never inline in run:, so no quoted colon can reach
      # GitHub's workflow parser (PyYAML accepts those; GHA silently rejects them).
      # Stdlib + the preinstalled aws CLI only, so it runs before the pip install
      # and aborts as early as possible. Expected to FAIL today — see the header.
      - name: Preflight — assert the snap role can complete the WHOLE revert
        env:
          SNAP_AWS_ROLE_ARN: ${{ vars.SNAP_AWS_ROLE_ARN }}
          SNAP_BUCKET: ${{ vars.SNAP_BUCKET }}
          TARGET_VERSION: ${{ inputs.target_version }}
          CF_DIST: E3FAJTXAORQYDT
        run: python3 scripts/preflight-revert-iam.py

      - name: Install python deps
        run: pip install boto3 requests --quiet

      - name: Run revert-to (PROD — real code + DB + Lambda cutover)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_VERSION: ${{ inputs.target_version }}
          PREREVERT_VERSION: ${{ inputs.prerevert_version }}
          CONFIRM_DATA_LOSS: ${{ inputs.confirm_data_loss }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PROD_BRANCH_ID: br-delicate-sea-amum92c2
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
          SNAP_BUCKET: ${{ vars.SNAP_BUCKET }}
          PHOTOS_BUCKET: ${{ vars.PHOTOS_BUCKET }}
          SNAP_RETENTION: ${{ vars.SNAP_RETENTION }}
          CF_DIST: E3FAJTXAORQYDT
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          python3 scripts/revert-to.py
