name: revert-gate

# Production revert: reverts prod to a previously snapped version vX as one transaction, restoring code, DB
# and Lambdas as a coherent pair via scripts/revert-to.py. Runs AS garden-bot (App 3951762), the only actor
# that may advance main (the code leg fast-forwards a forward revert commit). The revert is itself revertible:
# revert-to.py snaps CURRENT prod first. revert-rehearsal.yml runs the same script against STAGING with
# REHEARSAL_MODE=1; here REHEARSAL_MODE is off, the code legs target real dev/main, and CONFIRM_DATA_LOSS
# must be "yes".
#
# PAGE-SCROLL MANAGER: do NOT use this workflow to roll it back; use a forward flag-off build
# (SCROLL_MANAGER_ENABLED = false in src/lib/featureFlags.js, then promote). A bundle from before it never
# writes history.scrollRestoration back to 'auto', so Back loses the place on most pages until the app is
# closed. After ANY run that lands on a version before the manager: swipe the app away once.
#
# DISPATCH runs main's copy of this file: edits here take effect only once a promote carries them to main.
# "Checkout dev" means revert-to.py, snap.py and preflight-revert-iam.py changes govern a revert as soon as
# they land on dev.
#
# APPROVAL GATE: `environment: production-destructive` has a required reviewer (islanddave), so the run
# pauses until approved. It is an identity gate that ALLOWS self-approval (prevent_self_review=false,
# can_admins_bypass=true; the only reviewer is also the only dispatcher), not a two-person rule. Whether the
# environment is restricted to main: `gh api repos/islanddave/garden-app/environments/production-destructive`
# (deployment_branch_policy). Do NOT point this at `environment: production`: it has a branch policy only and
# no required reviewers, so it is not an approval stop of any kind.
#
# IAM TRUST: the snap OIDC role (SNAP_AWS_ROLE_ARN, garden-app-github-snap) trusts an exact-match list of two
# subjects, repo:islanddave/garden-app:environment:production and :environment:production-destructive. Keep
# it an exact list; never a StringLike wildcard. So the credential step succeeds and is NOT a safety net; the
# step that fails safe is the IAM preflight below.
#
# PERMISSION PREFLIGHT: revert-to.py resets the prod DB first and redeploys after, so a revert that could not
# also be ROLLED BACK must refuse to begin. The preflight simulates every action the snap role performs (the
# pre-revert snap's lambda:PublishVersion + GetFunctionConfiguration and the rollback's
# lambda:UpdateFunctionCode + GetFunction on the qualified ARN function:<fn>:<version>, on every release
# function in scripts/lambda_fleet.py, plus the two snapshot reads) and aborts before anything is touched
# unless every pair is `allowed`. It fails until snap-ops Stage 1 and Stage 2 are applied
# (Projects/Gardening/iam-trust-rollback). There is no bypass flag and no warn-only mode; do not add one. The
# rehearsal skips every prod Lambda and SPA leg, so only the preflight proves these permissions.
#
# RESTORE LEGS: after the DB reset and the main fast-forward, revert-to.py REBUILDS the target from its own
# tree: it dispatches deploy-lambda.yml, then deploy.yml, on main (= the revert commit) with the garden-bot
# token and polls each to success inside its checkpoint, Lambdas first and the SPA only once every Lambda leg
# is green. Those run under the DEPLOY role; this job's snap role changes no Lambda code and no CloudFront
# state on the forward path. The target manifest's lambda_versions are NOT restored. On any failure the
# rollback restores every release function from the PRE-REVERT snap (what prod was running minutes earlier)
# and rebuilds the SPA from the restored tree.
#
# JOB BUDGET: timeout-minutes is sized for forward + rollback worst case, because a job killed mid-rollback
# leaves prod split. The first step writes the job's start to REVERT_JOB_STARTED_AT, and the revert step
# passes timeout-minutes again as REVERT_JOB_BUDGET_MIN (the two must be equal; scripts/test_revert_to.py
# parses this file and checks). revert-to.py refuses before the pre-revert snap unless that budget covers
# post_checkpoint_worst_case_s() + JOB_START_ALLOWANCE_S, and again at the checkpoint, before the first
# mutation, unless that much time is still left. A copy of this file WITHOUT the marker makes every revert refuse.
#
# SUPPORTED TARGETS: before the pre-revert snap, revert-to.py refuses any target below the floor in
# scripts/revert-floors.json (dev's copy; undo such a release forward with scripts/forward-undo.py), then
# reads the target's own .github/workflows at its tagged commit and refuses it when (a) any workflow runs on
# a push to main (the revert's fast-forward would start it, unseen by the rollback); (b) deploy-lambda.yml
# merges Lambda env onto a live `|| echo "{}"` base (one failed read would wipe that function's environment);
# or (c) a redeploy workflow is missing, lacks workflow_dispatch, or deploy.yml lacks the skip_version_bump
# input, so the target cannot rebuild itself. target_workflow_hazards() in revert-to.py defines the range;
# a read or parse failure refuses too.
#
# Secrets: GARDEN_BOT_APP_ID, GARDEN_BOT_PRIVATE_KEY, NEON_API_KEY, NEON_PROJECT_ID, NEON_BACKUP_URL.
# Vars: SNAP_AWS_ROLE_ARN, SNAP_BUCKET, PHOTOS_BUCKET, SNAP_RETENTION.

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Snapped version to revert prod TO (must exist in SNAP_BUCKET and be at or above the revert floor in scripts/revert-floors.json, else revert-to.py refuses before reading anything; ^v\d+(\.\d+){0,2}$, e.g. v4.156.0)'
        required: true
        type: string
      prerevert_version:
        description: 'Fresh, unused version to snapshot CURRENT prod as before the revert (so the revert is itself revertible)'
        required: true
        type: string
      confirm_data_loss:
        description: 'Reverting prod DB to the target discards ALL prod writes since then. Select "yes" to proceed.'
        required: true
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'

permissions:
  contents: read
  id-token: write

jobs:
  revert:
    runs-on: ubuntu-26.04
    environment: production-destructive
    timeout-minutes: 180  # = REVERT_JOB_BUDGET_MIN below; forward redeploys + a full rollback (JOB BUDGET above)
    steps:
      - name: Record the job's start (revert-to.py measures the time left from it)
        run: echo "REVERT_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Validate inputs (injection-safe — read from env, never interpolated into run)
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          PREREVERT_VERSION: ${{ inputs.prerevert_version }}
          CONFIRM: ${{ inputs.confirm_data_loss }}
        run: |
          set -euo pipefail
          re='^v[0-9]+(\.[0-9]+){0,2}$'
          [[ "$TARGET_VERSION" =~ $re ]] || { echo "::error::target_version '$TARGET_VERSION' invalid (need ^v\d+(\.\d+){0,2}$)"; exit 1; }
          [[ "$PREREVERT_VERSION" =~ $re ]] || { echo "::error::prerevert_version '$PREREVERT_VERSION' invalid (need ^v\d+(\.\d+){0,2}$)"; exit 1; }
          [ "$TARGET_VERSION" != "$PREREVERT_VERSION" ] || { echo "::error::prerevert_version must differ from target_version"; exit 1; }
          [ "$CONFIRM" = "yes" ] || { echo "::error::confirm_data_loss must be 'yes' to proceed (prod DB revert is data loss)"; exit 1; }
          echo "inputs valid: revert prod -> $TARGET_VERSION (pre-revert snap $PREREVERT_VERSION)"

      - name: Mint garden-bot installation token
        id: bot
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.GARDEN_BOT_APP_ID }}
          private-key: ${{ secrets.GARDEN_BOT_PRIVATE_KEY }}

      - name: Checkout dev (scripts/revert-to.py)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev

      - name: Make /usr/lib/postgresql/17 writable (cache + docker cp target)
        run: |
          sudo mkdir -p /usr/lib/postgresql/17/bin
          sudo chown -R "$(id -u):$(id -g)" /usr/lib/postgresql/17

      - name: pg17 client cache
        id: pg17-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/lib/postgresql/17/bin
          key: pg17-client-postgres17-image-v1-runner-ubuntu-26.04

      - name: Fetch pg17 client from the postgres:17 image (cache miss only)
        # Not apt.postgresql.org (see backup.yml): a prod revert is the incident-recovery path and cannot
        # depend on the package mirror that has hung inside promote-gate.
        if: steps.pg17-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cid=$(docker create postgres:17)
          docker cp "$cid:/usr/lib/postgresql/17/bin/." /usr/lib/postgresql/17/bin/
          docker rm -f "$cid" >/dev/null

      - name: Verify pg17 client
        run: /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Configure AWS credentials (snap role, OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.SNAP_AWS_ROLE_ARN }}
          aws-region: us-east-1

      # FAIL-CLOSED GATE: must stay between the credential step and revert-to.py.
      # Every ARN lives in env, never inline in run:, so no quoted colon can reach GitHub's workflow
      # parser (PyYAML accepts those; GHA silently rejects them). Stdlib + the preinstalled aws CLI only,
      # so it runs before the pip install and aborts as early as possible. It asserts the snap role's
      # pre-revert-snap and rollback grants on every release function, and no CloudFront action.
      # Expected to FAIL until snap-ops Stage 2 is applied (see the header).
      - name: Preflight — assert the snap role can complete the WHOLE revert
        env:
          SNAP_AWS_ROLE_ARN: ${{ vars.SNAP_AWS_ROLE_ARN }}
          SNAP_BUCKET: ${{ vars.SNAP_BUCKET }}
          TARGET_VERSION: ${{ inputs.target_version }}
          # Unused by today's preflight. If revert-to.py's restore legs are git-reverted on dev while main
          # carries this file, dev's older preflight runs here and refuses every revert with "CF_DIST is
          # empty" without it.
          CF_DIST: E3FAJTXAORQYDT
        run: python3 scripts/preflight-revert-iam.py

      - name: Install python deps
        # pyyaml: revert-to.py parses the target's own workflow files (SUPPORTED TARGETS above); without it
        # the revert refuses rather than skipping that check. 6.0.3: 6.0.2 has no wheel for ubuntu-26.04's
        # Python 3.14 and would build from source at revert time.
        run: pip install boto3 requests pyyaml==6.0.3 --quiet

      - name: Run revert-to (PROD — real code + DB + Lambda cutover)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_VERSION: ${{ inputs.target_version }}
          PREREVERT_VERSION: ${{ inputs.prerevert_version }}
          CONFIRM_DATA_LOSS: ${{ inputs.confirm_data_loss }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PROD_BRANCH_ID: br-delicate-sea-amum92c2
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
          SNAP_BUCKET: ${{ vars.SNAP_BUCKET }}
          PHOTOS_BUCKET: ${{ vars.PHOTOS_BUCKET }}
          SNAP_RETENTION: ${{ vars.SNAP_RETENTION }}
          CF_DIST: E3FAJTXAORQYDT
          REVERT_JOB_BUDGET_MIN: "180"  # MUST equal timeout-minutes above (JOB BUDGET in the header)
          # revert-to.py's tempfile dumps land on the work disk: /tmp on ubuntu-26.04 is a ~7.8G RAM-backed tmpfs.
          TMPDIR: ${{ runner.temp }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          python3 scripts/revert-to.py
