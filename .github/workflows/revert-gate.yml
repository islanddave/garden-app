name: revert-gate

# B2 production revert (spec repo-version-env-spec-V100 §3 B2). Reverts prod to a previously-snapped
# version vX as a SINGLE transaction gated on environment:production-destructive, restoring code + DB +
# Lambda versions as a coherent pair via scripts/revert-to.py. Runs AS garden-bot (App 3951762) — the sole
# actor permitted to advance main (the code leg FF-promotes a forward revert-commit). The revert is itself
# revertible: revert-to.py takes a PRE-REVERT snap of CURRENT prod first, so a bad revert can be rolled back.
#
# Relationship to revert-rehearsal.yml: that workflow exercises the SAME script against STAGING with
# REHEARSAL_MODE=1 (throwaway refs; the prod Lambda/SPA redeploy and Lambda-restore legs skipped). THIS
# workflow is the real thing — REHEARSAL_MODE is OFF, the code legs target real dev/main, and
# CONFIRM_DATA_LOSS must be "yes".
#
# Dispatchability: workflow_dispatch requires the workflow on the default branch (main). It IS on main —
# see STATUS below. Edits made here on dev do not take effect for a dispatch until the next promote-gate
# ship carries them to main; the Actions UI keeps running main's copy in the meantime.
#
# APPROVAL GATE (2026-08-05, OPS-REVERTGATE-001; corrected 2026-09-11, OPS-REVERTRESTORE-001 R2). This job runs
# under `environment: production-destructive`, which carries a REQUIRED REVIEWER (islanddave): the run pauses at
# the environment gate until that review is granted. What that enforces is an IDENTITY gate that ALLOWS
# SELF-APPROVAL, not a two-person rule: prevent_self_review=false and can_admins_bypass=true, and islanddave is
# both the only reviewer and the only dispatcher, so the dispatcher approves his own run (and anything holding
# his token could do both). Earlier versions of this header said "the dispatcher cannot also be the sole
# approver"; that was never true of the live configuration.
#   - Self-approval accepted by Dave, 2026-09-11 (SEC I3).
#   - Environment restricted to the main branch, 2026-09-11: Dave's decision; he applies the deployment branch
#     policy himself. Until it is applied the environment admits any ref — check with
#     `gh api repos/islanddave/garden-app/environments/production-destructive` (deployment_branch_policy).
# Do NOT point this at `environment: production`: that environment carries a branch/tag ref policy ONLY and has
# had ZERO required reviewers since 2026-06-22, so it is not an approval stop of any kind. Prior versions of this
# header claimed a "Dave-approved" gate that did not exist in infrastructure; the `confirm_data_loss` dropdown
# was the only guard and it is selected by whoever is already dispatching.
#
# STATUS — LIVE AND DISPATCHABLE (verified 2026-09-10). `state: active`, and this file is present on the
# default branch (main), so it is dispatchable from the Actions UI right now. An earlier version of this
# header said it had been disabled via `gh workflow disable` on 2026-08-05 and needed `gh workflow enable`
# once it reached main; that stopped being true when it reached main. Do NOT plan an incident response
# around this workflow being inert.
#
# IAM trust policy — SATISFIED, no longer a prereq (verified 2026-09-10). The snap OIDC role
# (SNAP_AWS_ROLE_ARN = arn:aws:iam::769788341849:role/garden-app-github-snap) trusts BOTH subjects as an
# exact-match list:
#   repo:islanddave/garden-app:environment:production
#   repo:islanddave/garden-app:environment:production-destructive
# so sts:AssumeRoleWithWebIdentity SUCCEEDS for this job and the AWS legs do get credentials. This block
# previously read "BLOCKING PREREQ ... trusts EXACTLY ONE subject"; it is done. Keep it an exact-match list
# of two literal subjects — do NOT relax it to a StringLike wildcard. Corollary for anyone triaging
# mid-incident: the credential step is NOT a safety net, it will succeed. The step that fails safe is the
# IAM preflight below.
#
# PERMISSION PREFLIGHT — THIS WORKFLOW CURRENTLY ABORTS, BY DESIGN (OPS-REVERTPREFLIGHT 2026-09-10, widened
# by OPS-REVERTRESTORE-001 2026-09-11). scripts/revert-to.py resets the prod DB first and redeploys after, so
# a revert that could not also be ROLLED BACK must refuse to begin. The preflight step below simulates every
# action the snap role performs — the pre-revert snap's lambda:PublishVersion + GetFunctionConfiguration and
# the rollback's lambda:UpdateFunctionCode + GetFunction on the QUALIFIED ARN function:<fn>:<version>, on
# EVERY release function (scripts/lambda_fleet.py: the 26 deploy-lambda.yml builds), plus the two snapshot
# reads — and aborts before anything is touched unless all 106 pairs are `allowed`. Measured live 2026-09-11:
# 82 of 106 denied. It keeps failing until snap-ops Stage 1 AND Stage 2 are applied (Projects/Gardening/
# iam-trust-rollback, README section 2026-09-11). That is correct — a rollback that cannot complete must
# refuse to begin. There is no bypass flag and no warn-only mode; do not add one. The rehearsal SKIPS every
# prod Lambda and SPA leg, so it can never prove these permissions; the preflight does.
#
# RESTORE LEGS (OPS-REVERTRESTORE-001). After the DB reset and the main fast-forward, revert-to.py REBUILDS the
# target from its own tree: it dispatches deploy-lambda.yml, then deploy.yml, on main (= the revert commit)
# with the garden-bot token and polls each to success inside its checkpoint — Lambdas first, the SPA only once
# every Lambda leg is green, the promote's own order. Those run under the DEPLOY role; this job's snap role
# changes no Lambda code and no CloudFront state on the forward path. The target manifest's lambda_versions are
# NOT restored: a promote snaps before its own Lambda deploy, so that manifest holds the PREVIOUS release's
# Lambda code. On any failure the rollback restores every release function from the PRE-REVERT snap (taken
# minutes earlier, so it is what prod was running) and rebuilds the SPA from the restored tree.
# timeout-minutes below is sized for forward + rollback worst case: a job killed mid-rollback leaves prod split,
# which is worse than any failure the script can report. JOB BUDGET (R2): the first step writes the job's start to
# REVERT_JOB_STARTED_AT, and the revert step passes timeout-minutes again as REVERT_JOB_BUDGET_MIN (the two must be
# equal; scripts/test_revert_to.py parses this file and checks). revert-to.py refuses before the pre-revert snap
# unless that budget covers post_checkpoint_worst_case_s() + JOB_START_ALLOWANCE_S (164 min on 2026-09-11, every
# poll loop and GitHub read counted at its ceiling), and again at the checkpoint, before the first mutation, unless
# that much time is still left. A copy of this file WITHOUT the marker — main's, until a promote carries this one —
# makes every revert refuse, so arming IAM Stage 2 early cannot run a revert under the old 45-minute job.
#
# SUPPORTED TARGETS (OPS-REVERTRESTORE-001 R2, 2026-09-11). Not every snapshot can be reverted to. Before the
# pre-revert snap, revert-to.py reads the TARGET's own .github/workflows at its tagged commit and refuses it when
# (a) any workflow runs on a push to main: the revert's fast-forward would start it, and the rollback could neither
# see nor stop it; (b) deploy-lambda.yml merges Lambda env onto a live `|| echo "{}"` base: one failed read on the
# forward leg would wipe that function's environment and nothing would put it back; or (c) a redeploy workflow is
# missing, lacks workflow_dispatch, or deploy.yml lacks the skip_version_bump input, so the target cannot rebuild
# itself. The supported range is whatever those checks admit — target_workflow_hazards() in revert-to.py, not a
# version list. Measured with that function over all 260 snapped targets (2026-09-11): 48 revertible, v4.45.0
# through v4.128.0, one contiguous run; the 212 from v2.5.4 through v4.43.0 are refused ((a) 193, (b) all 212).
# A read or parse failure refuses too.
# NOTE: "Checkout dev" means revert-to.py, snap.py and preflight-revert-iam.py changes govern a revert as soon
# as they land on dev; changes to THIS file govern a dispatch only once a promote carries them to main.
#
# Secrets: GARDEN_BOT_APP_ID, GARDEN_BOT_PRIVATE_KEY, NEON_API_KEY, NEON_PROJECT_ID, NEON_BACKUP_URL.
# Vars: SNAP_AWS_ROLE_ARN, SNAP_BUCKET, PHOTOS_BUCKET, SNAP_RETENTION.

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Snapped version to revert prod TO (must exist in SNAP_BUCKET; ^v\d+(\.\d+){0,2}$, e.g. v2.5.6)'
        required: true
        type: string
      prerevert_version:
        description: 'Fresh, unused version to snapshot CURRENT prod as before the revert (so the revert is itself revertible)'
        required: true
        type: string
      confirm_data_loss:
        description: 'Reverting prod DB to the target discards ALL prod writes since then. Select "yes" to proceed.'
        required: true
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'

permissions:
  contents: read
  id-token: write

jobs:
  revert:
    runs-on: ubuntu-latest
    environment: production-destructive
    timeout-minutes: 180  # = REVERT_JOB_BUDGET_MIN below; forward redeploys + a full rollback (JOB BUDGET above)
    steps:
      - name: Record the job's start (revert-to.py measures the time left from it)
        run: echo "REVERT_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Validate inputs (injection-safe — read from env, never interpolated into run)
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          PREREVERT_VERSION: ${{ inputs.prerevert_version }}
          CONFIRM: ${{ inputs.confirm_data_loss }}
        run: |
          set -euo pipefail
          re='^v[0-9]+(\.[0-9]+){0,2}$'
          [[ "$TARGET_VERSION" =~ $re ]] || { echo "::error::target_version '$TARGET_VERSION' invalid (need ^v\d+(\.\d+){0,2}$)"; exit 1; }
          [[ "$PREREVERT_VERSION" =~ $re ]] || { echo "::error::prerevert_version '$PREREVERT_VERSION' invalid (need ^v\d+(\.\d+){0,2}$)"; exit 1; }
          [ "$TARGET_VERSION" != "$PREREVERT_VERSION" ] || { echo "::error::prerevert_version must differ from target_version"; exit 1; }
          [ "$CONFIRM" = "yes" ] || { echo "::error::confirm_data_loss must be 'yes' to proceed (prod DB revert is data loss)"; exit 1; }
          echo "inputs valid: revert prod -> $TARGET_VERSION (pre-revert snap $PREREVERT_VERSION)"

      - name: Mint garden-bot installation token
        id: bot
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.GARDEN_BOT_APP_ID }}
          private-key: ${{ secrets.GARDEN_BOT_PRIVATE_KEY }}

      - name: Checkout dev (scripts/revert-to.py)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev

      - name: Make /usr/lib/postgresql/17 writable (cache + docker cp target)
        run: |
          sudo mkdir -p /usr/lib/postgresql/17/bin
          sudo chown -R "$(id -u):$(id -g)" /usr/lib/postgresql/17

      - name: pg17 client cache
        id: pg17-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/lib/postgresql/17/bin
          key: pg17-client-postgres17-image-v1

      - name: Fetch pg17 client from the postgres:17 image (cache miss only)
        # OPS-SCHEMACHECKAPT-001: no more apt.postgresql.org (PGDG) -- see backup.yml
        # for the full incident writeup (this pattern is identical across every
        # OPS-SCHEMACHECKAPT-001 site). This is the incident-recovery path itself: a
        # prod revert cannot be left hostage to the same third-party mirror that
        # stranded main fast-forwarded to 437164e on 2026-08-18 while stuck installing
        # this exact package inside promote-gate.
        if: steps.pg17-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cid=$(docker create postgres:17)
          docker cp "$cid:/usr/lib/postgresql/17/bin/." /usr/lib/postgresql/17/bin/
          docker rm -f "$cid" >/dev/null

      - name: Verify pg17 client
        run: /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Configure AWS credentials (snap role, OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.SNAP_AWS_ROLE_ARN }}
          aws-region: us-east-1

      # FAIL-CLOSED GATE — must stay between the credential step and revert-to.py.
      # Every ARN lives in env, never inline in run:, so no quoted colon can reach
      # GitHub's workflow parser (PyYAML accepts those; GHA silently rejects them).
      # Stdlib + the preinstalled aws CLI only (scripts/lambda_fleet.py is stdlib too),
      # so it runs before the pip install and aborts as early as possible. It asserts
      # the snap role's pre-revert-snap and rollback grants on every release function,
      # and no CloudFront action (the revert makes no CloudFront call any more).
      # Expected to FAIL until snap-ops Stage 2 is applied — see the header.
      - name: Preflight — assert the snap role can complete the WHOLE revert
        env:
          SNAP_AWS_ROLE_ARN: ${{ vars.SNAP_AWS_ROLE_ARN }}
          SNAP_BUCKET: ${{ vars.SNAP_BUCKET }}
          TARGET_VERSION: ${{ inputs.target_version }}
          # Kept for ONE release (R2): today's preflight ignores it, but if OPS-REVERTRESTORE-001 is git-reverted
          # on dev after a promote has carried this file to main, dev's OLD preflight runs here again and refuses
          # every revert with "CF_DIST is empty" without it. Drop it in the release after the one that ships this.
          CF_DIST: E3FAJTXAORQYDT
        run: python3 scripts/preflight-revert-iam.py

      - name: Install python deps
        # pyyaml: revert-to.py parses the target's own workflow files (SUPPORTED TARGETS above); without
        # it the revert refuses rather than skipping that check.
        run: pip install boto3 requests pyyaml==6.0.2 --quiet

      - name: Run revert-to (PROD — real code + DB + Lambda cutover)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_VERSION: ${{ inputs.target_version }}
          PREREVERT_VERSION: ${{ inputs.prerevert_version }}
          CONFIRM_DATA_LOSS: ${{ inputs.confirm_data_loss }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PROD_BRANCH_ID: br-delicate-sea-amum92c2
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
          SNAP_BUCKET: ${{ vars.SNAP_BUCKET }}
          PHOTOS_BUCKET: ${{ vars.PHOTOS_BUCKET }}
          SNAP_RETENTION: ${{ vars.SNAP_RETENTION }}
          CF_DIST: E3FAJTXAORQYDT
          REVERT_JOB_BUDGET_MIN: "180"  # MUST equal timeout-minutes above (JOB BUDGET in the header)
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          python3 scripts/revert-to.py
