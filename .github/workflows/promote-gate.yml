name: promote-gate

# Capability-gate promote (cutover spec V1.0, session ce88c0be; snap + deploy-coupling wired 2026-06-03 sleepy-gifted-maxwell).
# main is ruleset-protected with garden-bot (App 3951762) as the sole bypass actor; this workflow runs AS garden-bot.
# environment: production does NOT pause for human approval — CORRECTED 2026-08-06 (the previous claim here, that it
# "pauses the promote job for Dave's approval BEFORE main is touched", was STALE and load-bearingly wrong). VERIFIED
# LIVE against the environments API (also verified 2026-08-04, OPS-PROMOTEAPPROVAL-001): the `production` environment's
# protection_rules contain a `branch_policy` entry ONLY — there is NO `required_reviewers` rule, because the required
# reviewer was REMOVED 2026-06-22 at Dave's direction. That policy gates WHICH refs may deploy (2 branches + the
# promote-v* tag rule) = MECHANISM, not AUTHORIZATION. Nothing in this workflow waits for a human tap: once it starts,
# main is fast-forwarded and prod ships. The behavioral dev->main HARD GATE (promote ONLY on an explicit Dave
# "ship it"/"promote to prod") is therefore the SOLE authorization control. For contrast, the `production-destructive`
# environment used by revert-gate.yml DOES carry required_reviewers=[islanddave] — do not generalize from it to here.
# Promote = fast-forward main -> the exact dev SHA (no squash). CI is enforced here (required-checks on main only gate PRs).
# After the FF, a version-snap (scripts/snap.py) captures a revertible marker (git tag + Neon branch + durable dump +
# photo/lambda version-ids + manifest) INSIDE the same promote job — so a green promote always has a snapshot
# (a snap failure reds the promote). Then the `deploy` job (workflow_call into deploy.yml) builds + deploys the SPA
# under that same approval-free production ref policy, making promote->deploy deterministic (no reliance on
# push:main retriggering) — it is a second environment binding, NOT a second approval.
# Secrets: GARDEN_BOT_APP_ID, GARDEN_BOT_PRIVATE_KEY, NEON_API_KEY, NEON_PROJECT_ID, NEON_BACKUP_URL.
# Vars: SNAP_AWS_ROLE_ARN, SNAP_BUCKET, PHOTOS_BUCKET, SNAP_RETENTION.
#
# WRITE-PATH SMOKE GATE (PHASE2-CI-001 / L-145, added 2026-06-04): before the FF, this job dispatches
# deploy-staging.yml for the exact dev SHA, polls the run to completion, and requires its `smoke-tests` job
# (the tail of deploy-lambdas->deploy-frontend->db-schema-check->smoke-tests, so its success implies the whole
# write-path chain passed) to conclude success. Closes the hole where deploy-staging had no push:[dev] trigger,
# so the staging write-path smoke only ran on manual dispatch and 7 releases shipped ungated. The dispatch runs AS
# garden-bot (App tokens reliably trigger workflows; GITHUB_TOKEN does not). Fail-closed: a missing/non-success
# staging-smoke conclusion blocks the promotion.
#
# INTEGRATION-TESTS GATE — SOAK CLOSED, DEFAULT FLIPPED TO true 2026-08-06. integration-tests (M5, 2026-07-24) rode
# advisory (require_integration default false) through its soak window; the dispatch default is now `true`, so the
# check is fail-closed exactly like build-and-test unless a dispatcher explicitly opts out. Evidence for the flip:
#   * integration-test.yml triggers on `push: branches: [dev]`, and its job id `integration-tests` IS the check-run
#     name the preflight looks up — so the check exists on every dev HEAD a promote can target.
#   * 845 historical runs: 702 success / 31 failure / 112 cancelled. EVERY sampled failure was in the `Run integration
#     tests` step — i.e. real test signal. The Neon-branch-create step (the only plausible infra flake, and it carries
#     its own FATAL guard) has never been the failing step. This is not a flaky check.
#   * It catches what build-and-test cannot. dev 29c50396 was build-and-test=SUCCESS + integration-tests=FAILURE on a
#     genuine handler regression (events.int.test.js, BUG-HARVESTEDIT-001, "expected '1360.776' to be null"). That is
#     the green-tests-broken-prod class this layer was built for, and advisory mode would have let it promote.
#   * It also catches staging/prod schema drift (dev 90ee5850: `column pv.dtm_basis does not exist`). deploy-staging
#     does NOT apply migrations, so a promote carrying a new-column migration SHOULD block until the schema is applied
#     — shipping that code to prod unapplied is a guaranteed 500. Blocking is the correct outcome, not a false alarm.
#   * No new failure mode vs today: on multi-commit pushes and concurrency-cancelled runs, integration-tests is
#     MISSING/cancelled on exactly the same SHAs where build-and-test is MISSING/cancelled, and build-and-test is
#     ALREADY fail-closed — so those promotes are blocked with or without this flag.
# Known cost (accepted): integration-tests runs longer than build-and-test, so a promote dispatched immediately after
# a dev push can find build-and-test=success while integration is still in_progress (conclusion null -> prints "None")
# and fail-closed. Remedy is to wait for the check and re-dispatch. Escape hatch is preserved: dispatch with
# require_integration=false to deliberately promote past a red/absent integration run.
# NOTE: the promote-v* TAG trigger still hardcodes require_integration=false in `resolve` below — a tag push carries
# no inputs, so it has no way to opt out if it were forced true, and that path (ship-garden.sh) is the break-glass
# remote ship route. That asymmetry is deliberate and flagged for Dave, not an oversight.

on:
  workflow_dispatch:
    inputs:
      dev_sha:
        description: 'Exact dev HEAD SHA to promote (must equal current dev HEAD)'
        required: true
        type: string
      snap_version:
        description: 'Version tag for the post-promote snapshot (unique; ^v\d+(\.\d+){0,2}$, e.g. v2.5.2)'
        required: true
        type: string
      require_integration:
        description: 'Enforce the integration-tests check on the dev SHA (default true = fail-closed; set false ONLY to deliberately promote past a red or absent integration-tests run)'
        required: false
        default: true
        type: boolean
      force_lambda:
        description: 'Deploy all Lambdas without consulting the deploy markers on the running functions. A plain re-dispatch after a failed Lambda leg no longer needs this (any function not provably current redeploys); use it to force a rebuild, e.g. to re-resolve a floating dependency. "Re-run failed jobs" on the original run is still the cheapest recovery.'
        required: false
        default: false
        type: boolean
  # OPS-SHIPTRIGGER-001 (2026-07-09): git-channel promote trigger so a Cowork/remote session
  # can ship WITHOUT api.github.com (which the session egress proxy 403-gates for repos it isn't
  # bound to). Push an annotated/lightweight tag `promote-vX.Y.Z` pointing AT the exact dev SHA to
  # promote: the tagged commit becomes dev_sha (== github.sha, so the coupled deploy checks out the
  # promoted code by construction), and the tag name minus `promote-` becomes snap_version. The
  # `resolve` job normalises both trigger paths into a single (dev_sha, snap_version) pair that every
  # downstream job consumes — the workflow_dispatch path is behaviourally unchanged. The
  # environment:production gate and the garden-bot capability-gate FF still apply identically.
  push:
    tags:
      - 'promote-v*'

permissions:
  contents: write
  id-token: write
  actions: write
  checks: read

# OPS-SHIPTRIGGER-001: serialize promotes now that two triggers exist (a promote-v* tag push
# AND a manual workflow_dispatch could otherwise both fast-forward main concurrently). Queue,
# never cancel — a promote mid-FF/snap must run to completion, so cancel-in-progress is false.
concurrency:
  group: promote-gate
  cancel-in-progress: false

jobs:
  # OPS-SHIPTRIGGER-001: normalise (dev_sha, snap_version) from EITHER trigger so every downstream
  # job is trigger-agnostic. workflow_dispatch -> the two inputs verbatim. push (promote-v* tag) ->
  # dev_sha = github.sha (the commit the tag points to), snap_version = tag name minus the promote- prefix.
  # Fail-closed: dev_sha must be a 40-hex commit SHA and snap_version must match the snap regex.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      dev_sha: ${{ steps.r.outputs.dev_sha }}
      snap_version: ${{ steps.r.outputs.snap_version }}
      require_integration: ${{ steps.r.outputs.require_integration }}
    steps:
      - name: Resolve promote inputs (dispatch OR promote-v* tag)
        id: r
        env:
          EVENT: ${{ github.event_name }}
          IN_DEV_SHA: ${{ github.event.inputs.dev_sha }}
          IN_SNAP: ${{ github.event.inputs.snap_version }}
          IN_REQINT: ${{ github.event.inputs.require_integration }}
          GH_SHA: ${{ github.sha }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            DEV_SHA="$IN_DEV_SHA"
            SNAP="$IN_SNAP"
            # Fallback MUST mirror the declared input default (true) so an API dispatch that omits the
            # key entirely cannot silently downgrade the gate to advisory. Fail-closed on absence.
            REQINT="${IN_REQINT:-true}"
          else
            DEV_SHA="$GH_SHA"
            REQINT="false"
            case "$GH_REF_NAME" in
              promote-*) SNAP="${GH_REF_NAME#promote-}" ;;
              *) echo "::error::unexpected trigger ref '$GH_REF_NAME' (expected promote-v*)"; exit 1 ;;
            esac
          fi
          if ! printf '%s' "$DEV_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::dev_sha not a 40-hex commit SHA: '$DEV_SHA'"; exit 1
          fi
          if ! printf '%s' "$SNAP" | grep -Eq '^v[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::snap_version '$SNAP' fails ^v[0-9]+(\.[0-9]+){0,2}\$"; exit 1
          fi
          {
            echo "dev_sha=$DEV_SHA"
            echo "snap_version=$SNAP"
            echo "require_integration=$REQINT"
          } >> "$GITHUB_OUTPUT"
          echo "resolved: event=$EVENT dev_sha=$DEV_SHA snap_version=$SNAP require_integration=$REQINT"

  promote:
    needs: resolve
    runs-on: ubuntu-latest
    environment: production
    # OPS-PROMOTERACE-001: consumed by the deploy-lambdas job below to decide whether to run at all.
    outputs:
      lambda_changed: ${{ steps.lam.outputs.changed }}
    # 50 (was 30): the staging write-path smoke gate below polls up to ~27.5min + ~5min locate;
    # FF+snap need ~10min after. Widened 2026-07-23 after two promotes fail-closed when a runner-queue
    # backlog pushed the ~16min staging pipeline past the old window (staging was green both times).
    timeout-minutes: 50
    steps:
      - name: Mint garden-bot installation token
        id: bot
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.GARDEN_BOT_APP_ID }}
          private-key: ${{ secrets.GARDEN_BOT_PRIVATE_KEY }}

      - name: Preflight — dev unmoved + build-and-test green
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ github.repository }}
          DEV_SHA: ${{ needs.resolve.outputs.dev_sha }}
          REQ_INT: ${{ needs.resolve.outputs.require_integration }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          DEV_HEAD=$(api "https://api.github.com/repos/$REPO/git/refs/heads/dev" | python3 -c "import sys,json;print(json.load(sys.stdin)['object']['sha'])")
          if [ "$DEV_HEAD" != "$DEV_SHA" ]; then
            echo "::error::dev moved since dispatch ($DEV_HEAD != $DEV_SHA)"; exit 1
          fi
          CONC=$(api "https://api.github.com/repos/$REPO/commits/$DEV_SHA/check-runs?filter=latest&per_page=100" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((c['conclusion'] for c in d['check_runs'] if c['name']=='build-and-test'),'MISSING'))")
          if [ "$CONC" != "success" ]; then
            echo "::error::build-and-test on $DEV_SHA = $CONC (need success)"; exit 1
          fi
          # M5: integration-tests gate. FAIL-CLOSED BY DEFAULT since 2026-08-06 (require_integration
          # defaults to true) — a non-success integration-tests check blocks the promote exactly like
          # build-and-test above. Soak evidence for the flip is in the header. Dispatch with
          # require_integration=false to deliberately promote past a red/absent integration run.
          # The advisory branch below is now the explicit opt-out path, not the normal path.
          INT=$(api "https://api.github.com/repos/$REPO/commits/$DEV_SHA/check-runs?filter=latest&per_page=100" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((c['conclusion'] for c in d['check_runs'] if c['name']=='integration-tests'),'MISSING'))")
          if [ "$REQ_INT" = "true" ]; then
            if [ "$INT" != "success" ]; then
              echo "::error::integration-tests on $DEV_SHA = $INT (need success; require_integration=true)"; exit 1
            fi
            echo "preflight ok: dev==$DEV_SHA, build-and-test=success, integration-tests=success (enforced)"
          else
            echo "::notice::integration-tests on $DEV_SHA = $INT (advisory during soak; not blocking promote)"
            echo "preflight ok: dev==$DEV_SHA, build-and-test=success (integration advisory=$INT)"
          fi

      - name: Version/tag skew gate — snap_version must equal package.json@dev_sha
        # THE KEYSTONE of the v3.81.0 tag-burn fix. 00558fe carried package.json
        # 3.80.0 AND releases.json[0] 3.80.0 — internally consistent, so every
        # check that runs INSIDE a CI job on dev (including the vitest
        # releases.json[0]==package.json assertion and scripts/check-release-version.py)
        # passed. The skew existed only between the promoted code and this
        # workflow's human-typed snap_version, which is invisible from dev. Tag
        # v3.81.0 was consumed on content calling itself 3.80.0, forcing a second
        # promote as v3.81.1 — and the release-tag-integrity ruleset (id 20140435)
        # now forbids deleting or re-pointing v* tags, so the burn is permanent.
        #
        # PLACEMENT IS LOAD-BEARING: after Preflight, BEFORE the ~28-minute
        # staging-smoke gate and BEFORE "Fast-forward main". Failing here costs
        # nothing — main is untouched, no tag exists, no Neon branch, no dump.
        # scripts/snap.py does enforce version uniqueness (its ensure_tag /
        # manifest guards), but it runs AFTER the FF, so its abort reds a promote
        # whose irreversible half already happened.
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ github.repository }}
          DEV_SHA: ${{ needs.resolve.outputs.dev_sha }}
          SNAP: ${{ needs.resolve.outputs.snap_version }}
        run: |
          set -euo pipefail
          PKG=$(curl -sS -f -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/$REPO/contents/package.json?ref=$DEV_SHA" | python3 -c "import sys,json;print(json.load(sys.stdin)['version'])")
          if [ -z "$PKG" ]; then
            echo "::error::could not read package.json version at $DEV_SHA — refusing to promote"; exit 1
          fi
          echo "package.json@$DEV_SHA = $PKG"
          echo "snap_version         = $SNAP"
          if [ "$SNAP" != "v$PKG" ]; then
            echo "::error::version/tag skew — snap_version '$SNAP' does not match the promoted code, which calls itself '$PKG' (expected 'v$PKG'). Either re-dispatch with snap_version=v$PKG, or land a bump on dev first with: node scripts/add-release.mjs <version> \"<highlight>\" — main has NOT been touched."
            exit 1
          fi
          # Matching alone is NOT enough. Promoting an UNBUMPED dev (dev==main==3.81.1,
          # snap_version=v3.81.1) satisfies the equality above, then dies in snap.py's
          # ensure_tag/manifest reuse guard AFTER main has been fast-forwarded. Pull that
          # exact check forward. Idempotency is preserved deliberately, mirroring
          # snap.py: an existing tag ALREADY pointing at this DEV_SHA is a clean re-run.
          CODE=$(curl -sS -o /tmp/tagref.json -w "%{http_code}" -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/git/ref/tags/$SNAP")
          if [ "$CODE" = "200" ]; then
            TAG_TYPE=$(python3 -c "import json;print(json.load(open('/tmp/tagref.json'))['object']['type'])")
            TAG_SHA=$(python3 -c "import json;print(json.load(open('/tmp/tagref.json'))['object']['sha'])")
            if [ "$TAG_TYPE" = "tag" ]; then
              TAG_SHA=$(curl -sS -f -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/git/tags/$TAG_SHA" | python3 -c "import sys,json;print(json.load(sys.stdin)['object']['sha'])")
            fi
            if [ "$TAG_SHA" != "$DEV_SHA" ]; then
              echo "::error::tag $SNAP already exists at $TAG_SHA (!= $DEV_SHA) — that version has already shipped. Bump dev first: node scripts/add-release.mjs <next> \"<highlight>\", then re-dispatch. main has NOT been touched (snap.py would have caught this only AFTER the fast-forward)."
              exit 1
            fi
            echo "::notice::tag $SNAP already exists and points at $DEV_SHA — idempotent re-promote of the same SHA"
          elif [ "$CODE" != "404" ]; then
            echo "::error::tag lookup for $SNAP failed (HTTP $CODE) — cannot rule out a tag collision, refusing to promote"
            exit 1
          else
            echo "tag $SNAP is free"
          fi
          echo "version/tag skew gate ok: $SNAP == v$PKG, tag not previously consumed"

      - name: Write-path staging smoke gate (PHASE2-CI-001 / L-145)
        env:
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEV_SHA: ${{ needs.resolve.outputs.dev_sha }}
        run: |
          set -euo pipefail
          apiq() { curl -sS -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          # 1) dispatch deploy-staging for the exact dev SHA, AS garden-bot (App tokens reliably trigger workflows)
          DISPATCH_EPOCH=$(date -u +%s)
          HTTP=$(curl -sS -o /tmp/disp.json -w "%{http_code}" -X POST -H "Authorization: token $BOT_TOKEN" -H "Accept: application/vnd.github+json" -d "{\"ref\":\"dev\",\"inputs\":{\"dev_sha\":\"$DEV_SHA\"}}" "https://api.github.com/repos/$REPO/actions/workflows/deploy-staging.yml/dispatches")
          if [ "$HTTP" != "204" ]; then
            # OPS-PROMOTE503MSG-001. This used to print "garden-bot App likely needs Actions:write"
            # on ANY non-204 — a guess stated as a finding. On 2026-08-17 the real failure was a
            # transient 503 whose body said "please try resubmitting", and three sessions burned
            # four promotes chasing a phantom permissions problem because the string named one.
            # A genuine permissions failure is 403 "Resource not accessible by integration".
            # Branch on the code, and echo the response body in EVERY branch — the body alone
            # would have ended the confusion in one read.
            echo "--- deploy-staging dispatch response body (HTTP $HTTP) ---"
            cat /tmp/disp.json || true
            echo
            echo "--- end response body ---"
            BODY=$(tr '\n' ' ' < /tmp/disp.json 2>/dev/null || true)
            case "$HTTP" in
              403)
                echo "::error::deploy-staging dispatch forbidden (HTTP 403) — garden-bot App likely needs Actions:write on the installation. Body: ${BODY:-(empty)}"
                ;;
              5??)
                echo "::error::deploy-staging dispatch hit a GitHub transient (HTTP $HTTP) — retry the dispatch; this is NOT a permissions problem. Body: ${BODY:-(empty)}"
                ;;
              *)
                echo "::error::deploy-staging dispatch failed (HTTP $HTTP) — read the body below before assuming a cause. Body: ${BODY:-(empty)}"
                ;;
            esac
            exit 1
          fi
          echo "dispatched deploy-staging for $DEV_SHA at epoch $DISPATCH_EPOCH"
          # 2) locate the run we just created.
          #
          # MATCH ON THE RUN TITLE, NOT head_sha. deploy-staging sets `run-name: staging <dev_sha>`
          # (the SHA it actually checks out). A workflow_dispatch run's head_sha is the HEAD of the
          # REF it was dispatched on — here `dev` — NOT the dev_sha input. Those two coincide only
          # while dev sits still. On 2026-08-03 a concurrent session pushed to dev between the
          # promote dispatch and this lookup: the staging run built the correct commit and its smoke
          # passed, but this step searched head_shas for the promoted SHA, found none, and
          # fail-closed after 5 minutes. Concurrent dev pushes are normal here, so head_sha matching
          # was a latent time-bomb rather than an edge case.
          #
          # head_sha is retained as a FALLBACK so a run created before the run-name change (or by a
          # dispatch that omitted dev_sha, where the two are legitimately equal) still resolves.
          RUN_ID=""
          for i in $(seq 1 30); do
            sleep 10
            RUN_ID=$(apiq "https://api.github.com/repos/$REPO/actions/workflows/deploy-staging.yml/runs?event=workflow_dispatch&per_page=20" | python3 -c "import sys,json,datetime as t; d=json.load(sys.stdin); sha='$DEV_SHA'; ok=lambda r: sha in (r.get('display_title') or '') or r.get('head_sha')==sha; rs=[r for r in d.get('workflow_runs',[]) if ok(r) and t.datetime.strptime(r['created_at'],'%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=t.timezone.utc).timestamp()>=$DISPATCH_EPOCH-30]; print(max(rs,key=lambda r:r['created_at'])['id'] if rs else '')")
            if [ -n "$RUN_ID" ]; then echo "run id: $RUN_ID"; break; fi
            echo "  ...waiting for run to register ($i)"
          done
          if [ -z "$RUN_ID" ]; then echo "::error::could not locate dispatched deploy-staging run"; exit 1; fi
          # 3) poll the run to completion (bounded so FF+snap still fit under timeout-minutes).
          # ~27.5min ceiling (165x10s): the staging pipeline runs ~3-5min but can sit queued 10-13min
          # under runner-queue backlog; the old 95 (~16min) fail-closed twice on 2026-07-23 despite green staging.
          ST="queued"
          for i in $(seq 1 165); do
            ST=$(apiq "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID" | python3 -c "import sys,json;print(json.load(sys.stdin)['status'])")
            echo "  run $RUN_ID status=$ST ($i)"
            [ "$ST" = "completed" ] && break
            sleep 10
          done
          if [ "$ST" != "completed" ]; then echo "::error::deploy-staging run $RUN_ID not complete in window — promotion blocked (fail-closed)"; exit 1; fi
          # 4) fail-closed: require the smoke-tests job in THIS run to have conclusion=success.
          #
          # The jobs API LAGS the run status. Step 3 exits the moment the RUN reads completed, but the
          # per-job list can still be empty or still carry status!=completed for a few seconds after
          # that. A single read therefore returns MISSING for a run whose smoke-tests actually passed,
          # and MISSING is indistinguishable here from a real failure -- so a GOOD promote fail-closes.
          # Observed 2026-08-11: the staging run for the v4.9.0 dev SHA completed at 13:58:04 with
          # smoke-tests=success; this gate read MISSING and errored at 13:58:14, ten seconds later.
          # A re-dispatch with byte-identical inputs then passed, which is the signature of a race
          # rather than a defect in the thing being gated.
          #
          # Retry until the job RESOLVES (present AND completed). Only a resolved non-success is a
          # real failure. This does NOT weaken the gate: an unresolved job still exits 1 after the
          # window, exactly as before -- it just stops calling a slow API a red smoke test.
          CONC="MISSING"
          for i in $(seq 1 24); do
            CONC=$(apiq "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=50" | python3 -c "import sys,json; d=json.load(sys.stdin); j=next((x for x in d.get('jobs',[]) if x['name']=='smoke-tests'),None); print(j['conclusion'] if j and j.get('status')=='completed' else 'MISSING')")
            [ "$CONC" != "MISSING" ] && break
            echo "  ...jobs API has not caught up (smoke-tests unresolved), retry $i/24"
            sleep 5
          done
          echo "smoke-tests conclusion = $CONC"
          if [ "$CONC" != "success" ]; then
            echo "::error::staging write-path smoke not green for $DEV_SHA (smoke-tests=$CONC) — promotion blocked (L-145)"; exit 1
          fi
          echo "write-path staging smoke green for $DEV_SHA"

      # Moved up from after the pg17 steps (2026-09-18, OPS-LAMSKIPVSMAIN-001): the Lambda decision
      # below reads the running functions with this role, and it must run BEFORE the fast-forward (see
      # there). Side effect, and a strict improvement: an OIDC or role failure now stops the promote with
      # main untouched, instead of after the fast-forward with main advanced and no snapshot. snap.py
      # still uses these credentials; the minute or two this adds to their age is far inside the 1h session.
      - name: Configure AWS credentials (snap role, OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.SNAP_AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Moved with it: the decision script and snap.py both come from the promoted commit.
      - name: Checkout dev_sha (scripts/check-lambda-current.py + scripts/snap.py)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.dev_sha }}

      # OPS-LAMSKIPVSMAIN-001 (2026-09-18) — decide whether the Lambdas need deploying by asking THE
      # RUNNING FUNCTIONS, not `main`.
      #
      # Until now this step compared dev_sha's Lambda inputs with main's. main means APPROVED, not
      # DEPLOYED: this workflow fast-forwards main BEFORE deploy-lambdas runs, so a failed leg, a promote
      # that died after its FF (snap.py, the pg17 fetch), a revert rollback or a console upload all leave
      # main naming code that is not running. A plain re-dispatch after a failed leg was the sharp case:
      # main == dev_sha, all seven inputs compared equal, the step skipped every Lambda and shipped the SPA
      # onto the stale legs (reproduced by running the old step body with DEV_SHA=main: changed=false).
      # verify-deploy.py then called that skip "the running Lambdas are current", which was false.
      #
      # scripts/check-lambda-current.py reads each release function's deploy marker (written by the last
      # step of every deploy-lambda.yml leg, and bound to the live CodeSha256) and proves CURRENT only when
      # every function runs a marked build whose Lambda inputs equal dev_sha's. Its docstring is the spec,
      # and the seven compared inputs (formerly PATHS here) now live there, in one copy.
      #
      # FAILS CLOSED, and only exit 0 skips. No marker (every function, until the first deploy that writes
      # them), a mismatch, an unreadable function or input, a crash: all deploy all 26 — the pre-v4.137
      # behaviour, ~6 minutes, idempotent. force_lambda still short-circuits.
      #
      # ERREXIT — keep the `|| RC=$?`. GitHub runs a step with no `shell:` as `bash -e {0}`. The first
      # version called the script bare and read `RC=$?` on the next line, so exit 1 or 2 (both DEPLOY
      # answers) ended the step right there, before `changed=`, and failed the promote pre-FF (B1 of the
      # v4.138.0 pre-ship pass). Its tests passed because they ran this body with `bash -c`; they now run
      # it as the runner does (`bash -e <file>`, scripts/test_check_lambda_current.py). Every exit code of
      # the script now ends in `changed=`. If the step fails anyway, the promote job fails with main
      # untouched and nothing deploys: deploy-lambdas' `!= 'false'` covers a missing output only when this
      # job succeeded.
      #
      # Still pre-FF on purpose. The answer no longer depends on main, but a defect in THIS step then stops
      # the promote with main untouched rather than after the fast-forward.
      #
      # verify-deploy.py keys on this step's NAME to tell a proven skip from the old main comparison
      # (LAMBDA_DECISION_STEP there; test_verify_deploy.py pins the two equal). Rename both together.
      - name: Decide Lambda deploy from deploy markers on the running functions (pre-FF; fail-closed)
        id: lam
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ github.repository }}
          DEV_SHA: ${{ needs.resolve.outputs.dev_sha }}
          FORCE: ${{ inputs.force_lambda }}
        run: |
          set -uo pipefail
          CHANGED=true
          if [ "${FORCE:-false}" = "true" ]; then
            echo "force_lambda=true — deploying Lambdas without consulting the running functions"
          else
            RC=0
            python3 scripts/check-lambda-current.py --dev-sha "$DEV_SHA" --repo "$REPO" --region us-east-1 || RC=$?
            case "$RC" in
              0) CHANGED=false
                 echo "running Lambdas proven current for $DEV_SHA -> skipping the Lambda deploy (SPA-only promote)" ;;
              1) echo "running Lambdas are not current for $DEV_SHA -> Lambdas will deploy BEFORE the SPA" ;;
              *) echo "::warning::check-lambda-current exited $RC (could not decide) — failing CLOSED, deploying Lambdas" ;;
            esac
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Fast-forward main -> dev SHA
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ github.repository }}
          DEV_SHA: ${{ needs.resolve.outputs.dev_sha }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/ff.json -w "%{http_code}" -X PATCH -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" -d "{\"sha\":\"$DEV_SHA\",\"force\":false}" "https://api.github.com/repos/$REPO/git/refs/heads/main")
          echo "FF main -> $CODE"
          if [ "$CODE" != "200" ]; then
            cat /tmp/ff.json; echo "::error::fast-forward of main failed ($CODE)"; exit 1
          fi
          echo "promoted main -> $DEV_SHA"

      - name: Make /usr/lib/postgresql/17 writable (cache + docker cp target)
        run: |
          sudo mkdir -p /usr/lib/postgresql/17/bin
          sudo chown -R "$(id -u):$(id -g)" /usr/lib/postgresql/17

      - name: pg17 client cache
        id: pg17-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/lib/postgresql/17/bin
          key: pg17-client-postgres17-image-v1

      - name: Fetch pg17 client from the postgres:17 image (cache miss only)
        # OPS-SCHEMACHECKAPT-001: no more apt.postgresql.org (PGDG) -- see backup.yml
        # for the full incident writeup. This exact step, at this exact position (AFTER
        # main has already been fast-forwarded above), is what hung 46 minutes on
        # 2026-08-18 and stranded main at 437164e while prod stayed on 4.35.0 with no
        # version tag -- the expensive incident variant, because main had already moved.
        # The docker/cache fetch below removes the flaky network install; the ordering
        # hazard itself (fast-forward before snap) is unchanged and out of scope here.
        if: steps.pg17-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cid=$(docker create postgres:17)
          docker cp "$cid:/usr/lib/postgresql/17/bin/." /usr/lib/postgresql/17/bin/
          docker rm -f "$cid" >/dev/null

      - name: Verify pg17 client
        run: /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Install python deps
        run: pip install boto3 requests --quiet

      - name: Version snap (revertibility marker)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ needs.resolve.outputs.dev_sha }}
          SNAP_VERSION: ${{ needs.resolve.outputs.snap_version }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PROD_BRANCH_ID: br-delicate-sea-amum92c2
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
          SNAP_BUCKET: ${{ vars.SNAP_BUCKET }}
          PHOTOS_BUCKET: ${{ vars.PHOTOS_BUCKET }}
          SNAP_RETENTION: ${{ vars.SNAP_RETENTION }}
          CF_DIST: E3FAJTXAORQYDT
          APP_VERSION: ${{ needs.resolve.outputs.snap_version }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          python3 scripts/snap.py

  # OPS-PROMOTERACE-001 — THE ORDERING EDGE. Lambdas ship BEFORE the SPA, by graph, not by luck.
  #
  # Previously deploy-lambda.yml self-triggered on the `push: main` that the FF above produces, so it
  # raced BOTH the SPA deploy and snap.py. Measured inversion: promote-gate 31657287769 served the new
  # SPA 3m10s before the Lambdas finished. It is now an explicit predecessor, which also places it
  # strictly AFTER snap.py (a step of `promote`), so the revert manifest records a clean pre-deploy
  # Lambda set instead of a torn mix.
  #
  # Skipped entirely on an SPA-only promote — that is the common case and must stay cheap.
  #
  # `!= 'false'`, not `== 'true'` (OPS-LAMSKIPVSMAIN-001): only an explicit "false" from the proven
  # decision above skips. An ABSENT output now deploys instead of silently skipping, which also makes
  # verify-deploy.py's reading of "promote succeeded + deploy-lambdas skipped" exact, not inferred.
  deploy-lambdas:
    needs: [resolve, promote]
    if: ${{ needs.promote.outputs.lambda_changed != 'false' }}
    uses: ./.github/workflows/deploy-lambda.yml
    with:
      ref: ${{ needs.resolve.outputs.dev_sha }}
    secrets: inherit

  deploy:
    # `always()` + an explicit predicate, NOT a bare `needs:` — a bare needs would treat the SKIPPED
    # lambda job (SPA-only promote) as unsatisfied and silently skip the SPA deploy too, which would
    # turn every frontend-only promote into a no-op that still advanced main.
    #
    # The predicate WITHHOLDS the SPA if the Lambda deploy failed. That is deliberate and is the whole
    # point: shipping a new frontend onto Lambdas that failed to update is the exact incompatibility
    # this change exists to prevent. The cost is a half-shipped state (main advanced, Lambdas partial,
    # old SPA still serving) — which is the RECOVERABLE direction, and `spa-withheld` below makes it
    # loud rather than silent.
    #
    # Note deploy-lambda's matrix is `fail-fast: false` across 26 functions, so a single unrelated leg
    # (e.g. photocdn-derivative, which has no SPA caller) can red the job. Recovery is "Re-run failed
    # jobs" on this run, which resumes the SPA in-place once the leg goes green.
    needs: [resolve, promote, deploy-lambdas]
    if: ${{ always() && needs.promote.result == 'success' && (needs.deploy-lambdas.result == 'skipped' || needs.deploy-lambdas.outputs.deploy_result == 'success') }}
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.resolve.outputs.dev_sha }}
    secrets: inherit

  # Makes the half-shipped state impossible to miss: main is advanced and the Lambdas are partial,
  # but the SPA was deliberately held back. Reds the run so the promote does not read as a success.
  spa-withheld:
    needs: [promote, deploy-lambdas]
    # Mirrors the deploy gate exactly: fires only when the Lambda MATRIX failed, so a red
    # verify-daily-plan (which does not withhold the SPA) does not produce a misleading
    # "SPA withheld" report alongside a successfully-shipped frontend.
    if: ${{ always() && needs.promote.result == 'success' && needs.deploy-lambdas.result != 'skipped' && needs.deploy-lambdas.outputs.deploy_result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report withheld SPA deploy
        run: |
          {
            echo "## SPA deploy WITHHELD — Lambda deploy failed"
            echo ""
            echo "\`main\` HAS been fast-forwarded and the snapshot marker was taken, but one or more"
            echo "Lambda functions failed to deploy, so the SPA was held back deliberately: a new"
            echo "frontend against stale Lambdas is the incompatibility this ordering exists to prevent."
            echo ""
            echo "**Prod is still serving the PREVIOUS SPA.** That is the recoverable direction."
            echo ""
            echo "Recovery: open the failed \`deploy-lambdas\` legs, fix or re-run them, then"
            echo "**Re-run failed jobs** on THIS run — the SPA deploy resumes in place."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::SPA deploy withheld — Lambda deploy failed. main is advanced; prod still serves the previous SPA. See the run summary."
          exit 1

  # OPS-LAMCHANGEDBLIND-002 — THE SAFETY CHECK THAT SURVIVES THE SKIP. Unconditional by design.
  #
  # These assertions used to live ONLY inside deploy-lambda.yml (as `verify-daily-plan`), so the
  # SPA-only skip above took them with it. They are the repo's only live-AWS check of state that drifts
  # with NO repo change at all — a console edit, an AWS-side reset, or any of deploy-lambda.yml's many
  # continue-on-error env steps failing silently. Losing them on the cheap common-case promote is what
  # blocked activating the skip. Dave's call (2026-09-17) was "move the safety check out first, then
  # enable"; this job is that move. deploy-lambda.yml still calls the SAME reusable workflow after its
  # matrix, so a Lambda-carrying promote audits twice — read-only, about a minute, and deliberately
  # preferred over two `if:` conditions that would have to stay exact complements forever.
  #
  # `always()` + an explicit predicate, for the same reason the `deploy` job above needs one: a bare
  # `needs:` would treat the SKIPPED deploy-lambdas job as unsatisfied and skip THIS job too, which is
  # precisely the hole it exists to plug. The only precondition is that the promote itself succeeded —
  # if main never moved, there is nothing to audit.
  #
  # IT NEEDS `deploy` DELIBERATELY, i.e. it runs LAST, after the SPA:
  #   * check-lambda-config.py reads `aws lambda get-function-url-config` and asserts Cors.AllowOrigins
  #     for the 23 functions whose manifest entry declares cors_origins. deploy.yml's "Restore Lambda
  #     Function URL CORS" step WRITES that same field for 13 of them on every SPA deploy. Running this
  #     job beside `deploy` rather than after it would be reading CORS while deploy.yml rewrites it — a
  #     measure-while-mutating race on a HARD GATE, i.e. an intermittently red promote.
  #   * Last is also strictly better coverage: the in-deploy-lambda copy runs BEFORE deploy.yml's CORS
  #     restore, so a restore that writes the WRONG origins is invisible to it until the next promote.
  # It still cannot withhold the SPA — nothing `needs:` this job, and `deploy` does not depend on it.
  # That preserves deploy-lambda.yml's deliberate choice to keep these assertions out of deploy_result.
  verify-lambda-invariants:
    needs: [resolve, promote, deploy-lambdas, deploy]
    if: ${{ always() && needs.promote.result == 'success' }}
    uses: ./.github/workflows/verify-lambda-invariants.yml
    with:
      ref: ${{ needs.resolve.outputs.dev_sha }}

  # OPS-VERIFY-001 (advisory REPORT-ONLY, per L-147/L-161/L-141) — runs AFTER deploy and
  # gates NOTHING (no job needs it; FF + deploy already happened, so it cannot un-ship).
  # It mechanizes the post-promote read of the SPA deploy JOB conclusion (L-161 — a green
  # run can mask a failed deploy job) and of the Lambda legs. It NEVER fails the promote: exit code
  # becomes an annotation (notice/warning/error) + a step-summary line, and the job always exits 0.
  #
  # OPS-VERIFYINRUNSTALE-001 (2026-09-18): it now passes --run-id, so verify-deploy.py reads THIS run's
  # own jobs. It used to list only COMPLETED promote-gate runs, which can never include the in-progress
  # run it sits in, so it fell back to the last standalone deploy-lambda.yml run (2026-08-13, c509fff4ae)
  # and printed "STALE LAMBDA ... NOT VERIFIED" on every promote — including the three before this
  # change, whose 26 legs all succeeded. By the time this job starts deploy-lambdas is final (`deploy`
  # needs it and this job needs `deploy`), so this run's Lambda legs are settled. The older rationale
  # here ("deploy-lambda.yml is a SEPARATE push:main workflow ... may still be mid-flight") has been
  # false since OPS-PROMOTERACE-001 made it a nested job.
  verify:
    needs: [resolve, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.dev_sha }}
      - name: Verify deploy success incl. this run's own Lambda legs (advisory report-only — never gates)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.dev_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          python3 scripts/verify-deploy.py --sha "$SHA" --run-id "$RUN_ID" | tee /tmp/verify.out
          rc=${PIPESTATUS[0]}
          {
            echo "### OPS-VERIFY-001 — deploy verification for ${SHA}"
            echo
            echo '```'
            cat /tmp/verify.out
            echo '```'
            echo
            echo "_Advisory only — never fails the promote. Read this promote's own job list (run ${RUN_ID}); dispatch verify-deploy.yml on this SHA for a second opinion after the fact._"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) echo "::notice::OPS-VERIFY-001: deploy VERIFIED for $SHA" ;;
            2) echo "::warning::OPS-VERIFY-001: indeterminate (exit 2) — not verified; see the step summary" ;;
            *) echo "::error::OPS-VERIFY-001: NOT verified (exit $rc) — inspect SPA deploy job / Lambda freshness for $SHA" ;;
          esac
          exit 0
