name: snap rehearsal (staging)

# One-off REHEARSAL of scripts/snap.py against STAGING data (spec §3 B3 / runbook Step 5).
# Triggered by touching ops/snap-rehearsal.trigger on dev (so it does not need to live on main).
# Runs in environment: production ONLY because the snap role's OIDC trust is scoped to
# environment:production — it does NOT deploy, does NOT write main, does NOT mutate prod DB.
# It snapshots the STAGING Neon branch + dumps STAGING. Side effects: tag v0.0.0, Neon branch
# rehearsal-snap-v0.0.0 (from staging), snap-v0.0.0.* objects in garden-snapshots-prod, +1
# published version on each garden-* Lambda (additive). Rehearsal artifacts are cleaned up
# afterward. SNAP_BRANCH_PREFIX keeps rehearsal branches namespace-separate from production
# snap-* branches; snap.py's pruner additionally scopes candidates to children of
# NEON_PROD_BRANCH_ID (here: staging), so a rehearsal prune can never touch prod snapshots.

on:
  push:
    branches: [dev]
    paths: ['ops/snap-rehearsal.trigger']

permissions:
  id-token: write
  contents: write

jobs:
  rehearse:
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ secrets.RULESET_READ_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      MAIN_SHA: "31e8673032bcb142e3accf6ae96fd45bd1830429"
      SNAP_VERSION: v0.0.0
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_PROD_BRANCH_ID: br-polished-art-am12o4ue
      NEON_BACKUP_URL: ${{ secrets.NEON_STAGING_URL }}
      SNAP_BUCKET: ${{ vars.SNAP_BUCKET }}
      SNAP_BRANCH_PREFIX: rehearsal-snap-
      PHOTOS_BUCKET: ${{ vars.PHOTOS_BUCKET }}
      SNAP_RETENTION: ${{ vars.SNAP_RETENTION }}
      CF_DIST: E3FAJTXAORQYDT
      APP_VERSION: rehearsal
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev

      # DIAGNOSTICS (2026-09-10). This workflow makes no curl calls of its own --
      # its GitHub API traffic is inside scripts/snap.py, which already reports
      # `{status}: {body}` on every failure. What it lacked was any signal about
      # the CREDENTIAL itself: GH_TOKEN is secrets.RULESET_READ_PAT, the same
      # secret whose read failure made revert-rehearsal die with a bare
      # `KeyError: 'object'` (run 34507891849). A dead or under-scoped token used
      # to surface ~4 minutes in, after the pg17 fetch, the OIDC assume and pip.
      # This probe is the same endpoint and the same reporter, in ~1s, up front.
      # It changes no rehearsal behaviour: a credential that fails here would
      # have failed the run anyway, just later and less legibly. It deliberately
      # declares NO env of its own so it always probes the job-level GH_TOKEN --
      # a step-local copy would keep passing against the old secret if the job's
      # credential were ever repointed.
      - name: Preflight - GH_TOKEN can read git refs
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is empty or unset for this job - check the job-level env GH_TOKEN secret. snap.py cannot create the rehearsal tag without it."
            exit 1
          fi
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          CODE=$(curl -sS -o /tmp/gh-body.json -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/git/refs/heads/dev")
          python3 scripts/gh_api_check.py ref-sha --endpoint "$API/git/refs/heads/dev" \
            --method GET --status "$CODE" --body-file /tmp/gh-body.json --sha-file /tmp/base.sha
          echo "GH_TOKEN reads dev at $(cat /tmp/base.sha)"

      - name: Make /usr/lib/postgresql/17 writable (cache + docker cp target)
        run: |
          sudo mkdir -p /usr/lib/postgresql/17/bin
          sudo chown -R "$(id -u):$(id -g)" /usr/lib/postgresql/17

      - name: pg17 client cache
        id: pg17-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/lib/postgresql/17/bin
          key: pg17-client-postgres17-image-v1

      - name: Fetch pg17 client from the postgres:17 image (cache miss only)
        # OPS-SCHEMACHECKAPT-001: no more apt.postgresql.org (PGDG) -- see backup.yml
        # for the full incident writeup (this pattern is identical across every
        # OPS-SCHEMACHECKAPT-001 site).
        if: steps.pg17-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cid=$(docker create postgres:17)
          docker cp "$cid:/usr/lib/postgresql/17/bin/." /usr/lib/postgresql/17/bin/
          docker rm -f "$cid" >/dev/null

      - name: Verify pg17 client
        run: /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Configure AWS credentials (snap role, OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.SNAP_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install python deps
        run: pip install boto3 requests --quiet

      - name: Run snap (staging-pointed)
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          python3 scripts/snap.py

      - name: Re-run snap (idempotency — must skip all, exit 0)
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          python3 scripts/snap.py
