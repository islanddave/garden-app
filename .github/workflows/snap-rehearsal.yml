name: snap rehearsal (staging)

# Rehearsal of scripts/snap.py against STAGING data, triggered by touching ops/snap-rehearsal.trigger on dev
# (so it need not live on main). `environment: production` only because the snap role's OIDC trust is
# scoped to it; this does not deploy, write main or mutate the prod DB. It snapshots the STAGING Neon branch
# and dumps STAGING. Side effects: tag SNAP_VERSION, Neon branch rehearsal-snap-<version> (from staging),
# snap-<version>.* objects in the snapshot bucket, and +1 published version on each garden-* Lambda
# (additive). SNAP_BRANCH_PREFIX keeps rehearsal branches apart from production snap-* branches, and
# snap.py's pruner only considers children of NEON_PROD_BRANCH_ID (here staging), so a rehearsal prune can
# never touch prod snapshots.
#
# AUTH: GitHub calls run as the garden-bot App, minted per run as promote-gate.yml mints it. Ruleset
# release-tag-integrity (20140435) lets only garden-bot create or delete refs/tags/v*, so no user token can
# create the rehearsal tag, and nobody can delete it by hand: the last step deletes it, as the bot.

on:
  push:
    branches: [dev]
    paths: ['ops/snap-rehearsal.trigger']

permissions:
  id-token: write
  contents: write

concurrency:
  group: snap-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: production
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      MAIN_SHA: "31e8673032bcb142e3accf6ae96fd45bd1830429"
      # snap.py skips objects that already exist, so a rehearsal that must really dump (a new runner image,
      # a new pg_dump) needs a version never used before. Old rehearsal versions stay in the bucket, unused;
      # never reuse one whose dump and manifest came from different runs (revert-to's validate refuses it).
      SNAP_VERSION: v0.0.926
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_PROD_BRANCH_ID: br-polished-art-am12o4ue
      NEON_BACKUP_URL: ${{ secrets.NEON_STAGING_URL }}
      SNAP_BUCKET: ${{ vars.SNAP_BUCKET }}
      SNAP_BRANCH_PREFIX: rehearsal-snap-
      PHOTOS_BUCKET: ${{ vars.PHOTOS_BUCKET }}
      SNAP_RETENTION: ${{ vars.SNAP_RETENTION }}
      CF_DIST: E3FAJTXAORQYDT
      APP_VERSION: rehearsal
    steps:
      - name: Mint garden-bot installation token
        id: bot
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.GARDEN_BOT_APP_ID }}
          private-key: ${{ secrets.GARDEN_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dev

      # Probes the CREDENTIAL up front (~1 s) instead of ~4 minutes in, after the pg17 fetch, the OIDC assume
      # and pip. snap.py already reports `{status}: {body}` on its own API failures; this changes no
      # rehearsal behaviour. A step output cannot be read from job-level env, so each step that talks to
      # GitHub names the token itself, and scripts/test_gh_api_check.py holds them to ONE source
      # (steps.bot.outputs.token): a probe that passed on one credential while snap.py ran on another would
      # prove nothing. It does NOT prove the token may CREATE refs/tags/v*; only snap.py's tag create does.
      - name: Preflight - GH_TOKEN can read git refs
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is empty - the garden-bot token mint step produced no token. snap.py cannot create the rehearsal tag without it."
            exit 1
          fi
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          CODE=$(curl -sS -o /tmp/gh-body.json -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/git/refs/heads/dev")
          python3 scripts/gh_api_check.py ref-sha --endpoint "$API/git/refs/heads/dev" \
            --method GET --status "$CODE" --body-file /tmp/gh-body.json --sha-file /tmp/base.sha
          echo "GH_TOKEN reads dev at $(cat /tmp/base.sha)"

      - name: Make /usr/lib/postgresql/17 writable (cache + docker cp target)
        run: |
          sudo mkdir -p /usr/lib/postgresql/17/bin
          sudo chown -R "$(id -u):$(id -g)" /usr/lib/postgresql/17

      - name: pg17 client cache
        id: pg17-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/lib/postgresql/17/bin
          key: pg17-client-postgres17-image-v1-runner-ubuntu-26.04

      - name: Fetch pg17 client from the postgres:17 image (cache miss only)
        # Not apt.postgresql.org (see backup.yml).
        if: steps.pg17-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cid=$(docker create postgres:17)
          docker cp "$cid:/usr/lib/postgresql/17/bin/." /usr/lib/postgresql/17/bin/
          docker rm -f "$cid" >/dev/null

      - name: Verify pg17 client
        run: /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Configure AWS credentials (snap role, OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.SNAP_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install python deps
        run: pip install boto3 requests --quiet

      - name: Run snap (staging-pointed)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          # As promote-gate.yml: snap.py's tempfile dumps on the work disk, not the ubuntu-26.04 /tmp RAM disk.
          TMPDIR: ${{ runner.temp }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          python3 scripts/snap.py

      - name: Re-run snap (idempotency — must skip all, exit 0)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          # As promote-gate.yml: snap.py's tempfile dumps on the work disk, not the ubuntu-26.04 /tmp RAM disk.
          TMPDIR: ${{ runner.temp }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          python3 scripts/snap.py

      # Only garden-bot may delete refs/tags/v* (release-tag-integrity), so a rehearsal tag left here could
      # not be removed by hand. Runs on failure too: snap.py tags just before its manifest, so a run that
      # failed late may have made it. The name guard keeps this step off every real release tag whatever
      # SNAP_VERSION is set to. The DELETE only warns (an absent tag is not a failure); then the tag is
      # looked up and anything but "not there" fails the step. revert-rehearsal.yml recreates the tag
      # itself, so nothing depends on it surviving.
      - name: Teardown - delete the rehearsal tag
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail
          case "$SNAP_VERSION" in
            v0.0.*) ;;
            *) echo "::error::refusing to delete tag '$SNAP_VERSION' - this teardown only removes v0.0.* rehearsal tags"; exit 1 ;;
          esac
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          ghcurl() {
            curl -sS -o /tmp/gh-body.json -w "%{http_code}" \
              -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"
          }
          CODE=$(ghcurl -X DELETE "$API/git/refs/tags/$SNAP_VERSION")
          python3 scripts/gh_api_check.py status --endpoint "$API/git/refs/tags/$SNAP_VERSION" \
            --method DELETE --status "$CODE" --body-file /tmp/gh-body.json --ok 204 --severity warning
          CODE=$(ghcurl "$API/git/ref/tags/$SNAP_VERSION")
          if [ "$CODE" != "404" ]; then
            python3 scripts/gh_api_check.py status --endpoint "$API/git/ref/tags/$SNAP_VERSION" \
              --method GET --status "$CODE" --body-file /tmp/gh-body.json --ok 404 --severity notice
            echo "::error::rehearsal tag $SNAP_VERSION is not confirmed gone after teardown (lookup answered HTTP $CODE; 200 means it is still on origin). Only garden-bot can delete it: re-run this workflow, or let revert-rehearsal's teardown remove it."
            exit 1
          fi
          echo "rehearsal tag $SNAP_VERSION is not on origin"
