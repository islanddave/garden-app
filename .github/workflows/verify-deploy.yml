name: verify-deploy

# On-demand, read-only check that a prod SHA deployed: the SPA deploy job succeeded and no Lambda is
# stranded or stale (scripts/verify-deploy.py). Dispatch-only, so it never runs inside the promote pipeline.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Prod SHA to verify (blank = live main HEAD)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify deploy success
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          ARGS=""
          if [ -n "$SHA" ]; then ARGS="--sha $SHA"; fi
          python3 scripts/verify-deploy.py $ARGS
