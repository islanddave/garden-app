<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" aria-label="Glow the Big Dipper Firefly">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="lantern-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#facc15" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body-glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#525252"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="20" fill="url(#bg-glow)"/>
  <!-- distant stars / firefly speckles -->
  <circle cx="40" cy="60" r="1.5" fill="#fef9c3" opacity="0.7"/>
  <circle cx="220" cy="80" r="1.2" fill="#fef9c3" opacity="0.6"/>
  <circle cx="60" cy="180" r="1.5" fill="#fef9c3" opacity="0.5"/>
  <circle cx="210" cy="200" r="1.2" fill="#fef9c3" opacity="0.7"/>
  <circle cx="200" cy="40" r="1" fill="#fef9c3" opacity="0.5"/>
  <circle cx="30" cy="140" r="1.3" fill="#fef9c3" opacity="0.6"/>
  <!-- large glow halo around abdomen -->
  <circle cx="128" cy="180" r="70" fill="url(#halo-glow)"/>
  <!-- wings (open, showing the J-flight signature) -->
  <ellipse cx="86" cy="120" rx="38" ry="22" fill="#9ca3af" opacity="0.55" stroke="#374151" stroke-width="1" transform="rotate(-25 86 120)"/>
  <ellipse cx="170" cy="120" rx="38" ry="22" fill="#9ca3af" opacity="0.55" stroke="#374151" stroke-width="1" transform="rotate(25 170 120)"/>
  <!-- pronotum (red with black spot — Photinus pyralis signature) -->
  <ellipse cx="128" cy="86" rx="26" ry="20" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <circle cx="128" cy="88" r="9" fill="#1f2937"/>
  <!-- elytra/wing covers -->
  <path d="M 100 102 Q 100 168 128 178 Q 156 168 156 102 Q 142 106 128 106 Q 114 106 100 102 Z" fill="url(#body-glow)" stroke="#000" stroke-width="2"/>
  <!-- pale yellow margins (P. pyralis trait) -->
  <path d="M 100 102 Q 100 168 128 178" stroke="#fde68a" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 156 102 Q 156 168 128 178" stroke="#fde68a" stroke-width="3" fill="none" opacity="0.8"/>
  <!-- abdomen tip (glowing lantern) -->
  <ellipse cx="128" cy="180" rx="22" ry="14" fill="url(#lantern-glow)"/>
  <ellipse cx="128" cy="180" rx="12" ry="8" fill="#fef9c3"/>
  <!-- head -->
  <circle cx="128" cy="62" r="14" fill="#1f2937" stroke="#000" stroke-width="1.5"/>
  <!-- eyes (big, dark adapted) -->
  <ellipse cx="122" cy="60" rx="4" ry="5" fill="#fef9c3"/>
  <ellipse cx="134" cy="60" rx="4" ry="5" fill="#fef9c3"/>
  <circle cx="122" cy="61" r="2" fill="#1f2937"/>
  <circle cx="134" cy="61" r="2" fill="#1f2937"/>
  <!-- antennae (thin, threadlike — P. pyralis) -->
  <path d="M 122 52 Q 116 38 110 26" stroke="#9ca3af" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 134 52 Q 140 38 146 26" stroke="#9ca3af" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M 122 68 Q 128 72 134 68" stroke="#fde68a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- legs -->
  <path d="M 108 130 L 96 144" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <path d="M 148 130 L 160 144" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <path d="M 106 150 L 90 162" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <path d="M 150 150 L 166 162" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- tier badge (Uncommon = blue) -->
  <circle cx="226" cy="30" r="14" fill="#3B82F6" stroke="#ffffff" stroke-width="2"/>
  <text x="226" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">U</text>
  <!-- name plate -->
  <rect x="48" y="226" width="160" height="22" rx="11" fill="#0f172a" opacity="0.85" stroke="#fde047" stroke-width="1.5"/>
  <text x="128" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fde047">Glow · Big Dipper Firefly</text>
</svg>
