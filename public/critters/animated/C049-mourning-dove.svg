<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Mourning dove — Zenaida macroura</title>
<desc>Gentle body/head bob with slow additive translate on the positioning group; slow blink.</desc>
<g transform="translate(100, 100)">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0 0; 0 -4; 0 0" dur="2.8s" repeatCount="indefinite"/>
  <!-- wings -->
  <ellipse cx="-30" cy="6" rx="24" ry="11" fill="#e8d8c8" opacity="0.6" transform="rotate(-22 -30 6)" stroke="#a89888" stroke-width="0.5"/>
  <ellipse cx="-30" cy="8" rx="21" ry="8" fill="#a89888" opacity="0.4" transform="rotate(-15 -30 8)"/>
  <ellipse cx="30" cy="6" rx="24" ry="11" fill="#e8d8c8" opacity="0.6" transform="rotate(22 30 6)" stroke="#a89888" stroke-width="0.5"/>
  <ellipse cx="30" cy="8" rx="21" ry="8" fill="#a89888" opacity="0.4" transform="rotate(15 30 8)"/>
  <!-- tail -->
  <path d="M 18 20 L 32 36 L 28 38 L 14 22 Z" fill="#9c8674"/>
  <!-- body -->
  <ellipse cx="0" cy="24" rx="24" ry="24" fill="#d4b89a"/>
  <!-- feet -->
  <line x1="-5" y1="46" x2="-5" y2="54" stroke="#e85d6d" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="5" y1="46" x2="5" y2="54" stroke="#e85d6d" stroke-width="2.2" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="0" cy="-14" r="23" fill="#dcc4a6"/>
  <!-- cheek spot -->
  <circle cx="17" cy="-3" r="3.5" fill="#3a2418"/>
  <circle cx="15" cy="-3" r="3.2" fill="#dcc4a6"/>
  <!-- eyes -->
  <circle cx="-9" cy="-14" r="6" fill="#ffffff"/>
  <circle cx="9" cy="-14" r="6" fill="#ffffff"/>
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="4.0s" repeatCount="indefinite"/>
    <circle cx="-9" cy="-13" r="4.3" fill="#fb7185"/>
    <circle cx="-9" cy="-11" r="2.5" fill="#0d0d0d"/>
    <circle cx="-7" cy="-16" r="1.4" fill="#ffffff"/>
    <circle cx="-11" cy="-13" r="0.7" fill="#ffffff"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="4.0s" repeatCount="indefinite"/>
    <circle cx="9" cy="-13" r="4.3" fill="#fb7185"/>
    <circle cx="9" cy="-11" r="2.5" fill="#0d0d0d"/>
    <circle cx="11" cy="-16" r="1.4" fill="#ffffff"/>
    <circle cx="7" cy="-13" r="0.7" fill="#ffffff"/>
  </g>
  <!-- bill -->
  <g transform="rotate(20 0 0)">
    <path d="M -2 -2 Q 3 -3 5 -1 Q 6 1 4 2 Q 1 3 -2 2 Z" fill="#3a3a3a"/>
  </g>
  <!-- breast line -->
  <path d="M -4 10 Q 0 13 4 10" stroke="#5a3a2a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</g>
</svg>
