<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Champ / Lake Monster — Champlain (Cryptid)</title>
<desc>The head bobs slowly up and down, the water band shimmers with faint opacity pulses, and the eyes glow eerily.</desc>
<g transform="translate(100, 100)">
  <!-- water band — faint shimmer -->
  <path d="M -90,50 Q -90,55 -85,55 L 90,55 Q 95,55 95,50 Q 95,45 90,45 L -85,45 Q -90,45 -90,50 Z" fill="#4a7a8a" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.35;0.5;0.65;0.5" keyTimes="0;0.25;0.5;0.75;1" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- body humps (static) -->
  <path d="M -75,30 Q -55,30 -45,45 L -45,55 L -75,55 Z" fill="#3a5a4a"/>
  <path d="M -40,15 Q -20,5 0,25 L 0,55 L -45,55 L -45,45 Z" fill="#4a7058"/>
  <path d="M 5,25 Q 25,15 45,30 L 45,55 L 0,55 L 0,25 Z" fill="#3a5a4a"/>
  <!-- head group — slow bob -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -5; 0 0; 0 3; 0 0"
      keyTimes="0;0.3;0.5;0.75;1"
      dur="3.5s" repeatCount="indefinite"/>
    <circle cx="-58" cy="0" r="22" fill="#5a8068"/>
    <ellipse cx="-58" cy="-12" rx="22" ry="20" fill="#6a8c70"/>
    <!-- eye whites -->
    <ellipse cx="-66" cy="-8" rx="6" ry="7" fill="#fff"/>
    <ellipse cx="-50" cy="-8" rx="6" ry="7" fill="#fff"/>
    <!-- iris — amber glow pulse -->
    <circle cx="-65" cy="-7" r="4" fill="#f5a623">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-49" cy="-7" r="4" fill="#f5a623">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- pupils -->
    <path d="M -66,-10 L -66,-4 L -64,-4 L -64,-10 Z" fill="#000"/>
    <path d="M -50,-10 L -50,-4 L -48,-4 L -48,-10 Z" fill="#000"/>
    <!-- catchlights -->
    <circle cx="-63" cy="-9" r="1" fill="#fff"/>
    <circle cx="-47" cy="-9" r="1" fill="#fff"/>
    <!-- nostrils -->
    <circle cx="-62" cy="3" r="1.5" fill="#3a2818"/>
    <circle cx="-54" cy="3" r="1.5" fill="#3a2818"/>
    <!-- mouth -->
    <path d="M -64,8 Q -58,13 -52,8" stroke="#000" stroke-width="1.5" fill="none"/>
    <!-- horns/ears -->
    <path d="M -70,-22 L -68,-32 L -62,-25 Z" fill="#5a8068"/>
    <path d="M -54,-22 L -52,-32 L -46,-25 Z" fill="#5a8068"/>
  </g>
</g>
</svg>
