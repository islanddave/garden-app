    <path d="M -34,-32 L -38,-46 L -22,-38 Z" fill="#3a2818"/>
  </g>
  <path d="M 34,-32 L 38,-46 L 22,-38 Z" fill="#3a2818"/>
  <ellipse cx="0" cy="15" rx="20" ry="14" fill="#7a5a3a"/>
  <circle cx="-14" cy="-5" r="9" fill="#fff"/>
