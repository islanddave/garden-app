  <circle cx="-12" cy="-5" r="3" fill="#000"/>
  <circle cx="16" cy="-5" r="3" fill="#000"/>
  <circle cx="-10" cy="-7" r="1.5" fill="#fff"/>
  <circle cx="18" cy="-7" r="1.5" fill="#fff"/>
  <ellipse cx="0" cy="13" rx="4.5" ry="2.5" fill="#000"/>
