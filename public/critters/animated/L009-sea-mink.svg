<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Sea Mink — Neogale macrodon (Legacy)</title>
<desc>Sea mink breathes gently with a slow chest rise and twitches its left ear periodically.</desc>
