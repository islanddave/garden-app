<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Bald-faced hornet — Dolichovespula maculata</title>
<desc>Bald-faced hornet hovers with a gentle bob while wings blur in rapid buzz.</desc>
<g transform="translate(100, 100)">
<animateTransform attributeName="transform" type="translate" additive="sum" dur="2.1s" repeatCount="indefinite" values="0 0; 0 -5; 0 0" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
