<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Hover fly — Toxomerus marginatus</title>
<desc>Hover fly floats with a gentle bob while wings blur in rapid buzz.</desc>
<g transform="translate(100, 100)">
<animateTransform attributeName="transform" type="translate" additive="sum" dur="2.2s" repeatCount="indefinite" values="0 0; 0 -5; 0 0" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
<g>
<ellipse cx="-30" cy="-2" rx="22" ry="9" fill="#e8f0f5" opacity="0.65" transform="rotate(-25 -30 -2)" stroke="#9aa5ab" stroke-width="0.5"/>
<animateTransform attributeName="transform" type="rotate" additive="sum" dur="0.12s" repeatCount="indefinite" values="-12 -30 -2; 8 -30 -2; -12 -30 -2"/>
</g>
<g>
<ellipse cx="30" cy="-2" rx="22" ry="9" fill="#e8f0f5" opacity="0.65" transform="rotate(25 30 -2)" stroke="#9aa5ab" stroke-width="0.5"/>
<animateTransform attributeName="transform" type="rotate" additive="sum" dur="0.12s" repeatCount="indefinite" values="12 30 -2; -8 30 -2; 12 30 -2"/>
</g>
<ellipse cx="0" cy="20" rx="22" ry="20" fill="#fcd34d"/>
<path d="M -20 12 L 20 12" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
<path d="M -18 24 L 18 24" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
<path d="M -12 34 L 12 34" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
<circle cx="0" cy="-14" r="20" fill="#1a1a1a"/>
<circle cx="-9" cy="-14" r="8" fill="#5a4818"/>
<circle cx="9" cy="-14" r="8" fill="#5a4818"/>
<circle cx="-9" cy="-14" r="5.5" fill="#2dd4bf"/>
<circle cx="9" cy="-14" r="5.5" fill="#2dd4bf"/>
<circle cx="-9" cy="-13" r="2.5" fill="#0d0d0d"/>
<circle cx="9" cy="-13" r="2.5" fill="#0d0d0d"/>
<circle cx="-7" cy="-16" r="1.6" fill="#ffffff"/>
<circle cx="11" cy="-16" r="1.6" fill="#ffffff"/>
<path d="M -7 -28 L -8 -34" stroke="#0d0d0d" stroke-width="1.4" stroke-linecap="round"/>
<path d="M 7 -28 L 8 -34" stroke="#0d0d0d" stroke-width="1.4" stroke-linecap="round"/>
<path d="M -4 -3 Q 0 0 4 -3" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
