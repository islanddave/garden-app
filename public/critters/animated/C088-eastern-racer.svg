<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Eastern racer — Coluber constrictor</title>
<desc>Body and ventral stripe paths morph through a sinuous slither wave; tongue flicks via opacity loop; head ellipse and eyes stay static.</desc>
<g transform="translate(100, 100)">
<path stroke="#1e293b" stroke-width="11" fill="none" stroke-linecap="round">
  <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
   values="M -32 36 Q -10 50 26 36 Q 40 24 30 12 Q 18 -2 -2 4 Q -10 8 -20 16;
           M -32 36 Q -10 44 26 40 Q 40 28 30 8 Q 18 -6 -2 8 Q -10 12 -20 16;
           M -32 36 Q -10 50 26 36 Q 40 24 30 12 Q 18 -2 -2 4 Q -10 8 -20 16"/>
</path>
<path stroke="#0c1226" stroke-width="2" fill="none">
  <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
   values="M -32 32 Q -10 46 26 32;
           M -32 32 Q -10 40 26 36;
           M -32 32 Q -10 46 26 32"/>
</path>
<ellipse cx="-26" cy="-2" rx="20" ry="14" fill="#1e293b"/>
<circle cx="-32" cy="-4" r="5" fill="#ffffff"/>
<circle cx="-18" cy="-4" r="5" fill="#ffffff"/>
<circle cx="-32" cy="-3" r="3.6" fill="#a3e635"/>
<circle cx="-18" cy="-3" r="3.6" fill="#a3e635"/>
<ellipse cx="-32" cy="-3" rx="1.6" ry="3.5" fill="#0d0d0d"/>
<ellipse cx="-18" cy="-3" rx="1.6" ry="3.5" fill="#0d0d0d"/>
<circle cx="-30" cy="-5" r="1.2" fill="#ffffff"/>
<circle cx="-16" cy="-5" r="1.2" fill="#ffffff"/>
<g>
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.55;0.8;1" dur="1.4s" repeatCount="indefinite"/>
  <path d="M -42 4 L -50 2 M -42 4 L -50 6" stroke="#fbbf24" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M -38 4 L -42 4" stroke="#fbbf24" stroke-width="1.3" fill="none" stroke-linecap="round"/>
</g>
</g>
</svg>
