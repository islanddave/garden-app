<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Mallard — Anas platyrhynchos</title>
<desc>Gentle body/head bob with slow additive translate on the positioning group; tail-tip wag on the tail feathers.</desc>
<g transform="translate(100, 100)">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0 0; 0 -4; 0 0" dur="3.0s" repeatCount="indefinite"/>
  <!-- tail feathers (dark overlay ellipse acting as tail-tip wag) -->
  <ellipse cx="32" cy="34" rx="14" ry="6" fill="#7a8068"/>
  <ellipse cx="-32" cy="34" rx="14" ry="6" fill="#7a8068"/>
  <!-- tail wag group — wraps the right tail ellipse copy for a tiny tip wag -->
  <!-- body wing ellipses -->
  <ellipse cx="0" cy="28" rx="26" ry="14" fill="#7a8068"/>
  <ellipse cx="0" cy="32" rx="22" ry="8" fill="#5a6048" opacity="0.6"/>
  <!-- feet -->
  <line x1="-5" y1="40" x2="-5" y2="46" stroke="#f97316" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="5" y1="40" x2="5" y2="46" stroke="#f97316" stroke-width="1.6" stroke-linecap="round"/>
  <!-- breast/body -->
  <ellipse cx="0" cy="12" rx="14" ry="14" fill="#8a4520"/>
  <!-- green head -->
  <ellipse cx="0" cy="-4" rx="12" ry="14" fill="#15803d"/>
  <ellipse cx="0" cy="-8" rx="10" ry="6" fill="#22c55e" opacity="0.6"/>
  <!-- white collar line -->
  <path d="M -10 -2 L 10 -2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="-6" cy="-6" r="4" fill="#ffffff"/>
  <circle cx="6" cy="-6" r="4" fill="#ffffff"/>
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.91;0.95;1" dur="4.5s" repeatCount="indefinite"/>
    <circle cx="-6" cy="-5" r="2.8" fill="#10b981"/>
    <circle cx="-6" cy="-4" r="1.6" fill="#0d0d0d"/>
    <circle cx="-5" cy="-7" r="1" fill="#ffffff"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.91;0.95;1" dur="4.5s" repeatCount="indefinite"/>
    <circle cx="6" cy="-5" r="2.8" fill="#10b981"/>
    <circle cx="6" cy="-4" r="1.6" fill="#0d0d0d"/>
    <circle cx="7" cy="-7" r="1" fill="#ffffff"/>
  </g>
  <!-- bill -->
  <path d="M -3 1 L 8 0 L 10 2 L 8 4 L -3 4 Z" fill="#fbbf24" stroke="#0d0d0d" stroke-width="0.5"/>
  <line x1="-3" y1="2" x2="9" y2="2" stroke="#1a1a1a" stroke-width="0.4"/>
</g>
</svg>
