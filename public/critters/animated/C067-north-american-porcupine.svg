<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>North American porcupine — Erethizon dorsatum</title>
<desc>Gentle body breathe with subtle head/quill shift — porcupine has a low mound head with no prominent ears, so breathe is the primary motion.</desc>
<g transform="translate(100, 100)">
<!-- body + quills breathe: scale about body center (0,24) -->
<g transform="translate(0,24)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1.025 1.025;1 1" keyTimes="0;0.5;1"
    dur="4.0s" repeatCount="indefinite"/>
  <g transform="translate(0,-24)">
    <ellipse cx="0" cy="24" rx="28" ry="24" fill="#5a3818"/>
    <!-- quills -->
    <line x1="-22" y1="-2" x2="-26" y2="-10" stroke="#8a6028" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-14" y1="-6" x2="-16" y2="-16" stroke="#8a6028" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="-8" x2="-4" y2="-18" stroke="#8a6028" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="-8" x2="6" y2="-18" stroke="#8a6028" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="-6" x2="18" y2="-16" stroke="#8a6028" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="24" y1="-2" x2="28" y2="-10" stroke="#8a6028" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-18" y1="12" x2="-26" y2="6" stroke="#8a6028" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-22" y1="24" x2="-30" y2="22" stroke="#8a6028" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="12" x2="26" y2="6" stroke="#8a6028" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="24" x2="30" y2="22" stroke="#8a6028" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="-12" cy="44" rx="5" ry="3" fill="#3a2010"/>
    <ellipse cx="12" cy="44" rx="5" ry="3" fill="#3a2010"/>
    <ellipse cx="0" cy="14" rx="18" ry="16" fill="#7a5028"/>
  </g>
</g>
<!-- head slow nod — porcupine has no visible ear pinna, so we give the whole head a gentle nod instead -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 0 14;2 0 14;0 0 14;-2 0 14;0 0 14"
    keyTimes="0;0.25;0.5;0.75;1"
    dur="5.5s" repeatCount="indefinite"/>
  <!-- eyes -->
  <circle cx="-7" cy="10" r="4.5" fill="#ffffff"/>
  <circle cx="7" cy="10" r="4.5" fill="#ffffff"/>
  <circle cx="-7" cy="11" r="3.2" fill="#15803d"/>
  <circle cx="7" cy="11" r="3.2" fill="#15803d"/>
  <circle cx="-7" cy="12" r="1.8" fill="#0d0d0d"/>
  <circle cx="7" cy="12" r="1.8" fill="#0d0d0d"/>
  <circle cx="-6" cy="9" r="1" fill="#ffffff"/>
  <circle cx="8" cy="9" r="1" fill="#ffffff"/>
  <ellipse cx="0" cy="22" rx="2.5" ry="1.8" fill="#1a1a1a"/>
  <path d="M -3 26 Q 0 29 3 26" stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</g>
</g>
</svg>
