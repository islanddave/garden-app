<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Heath Hen — Tympanuchus cupido cupido (Legacy)</title>
<desc>Gentle body/head bob with slow additive translate on the positioning group; slow blink on eyes.</desc>
<g transform="translate(100, 100)">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0 0; 0 -4; 0 0" dur="3.0s" repeatCount="indefinite"/>
  <!-- wings -->
  <ellipse cx="-38" cy="5" rx="26" ry="18" fill="#8b6f4a" opacity="0.5"/>
  <ellipse cx="38" cy="5" rx="26" ry="18" fill="#8b6f4a" opacity="0.5"/>
  <!-- body -->
  <ellipse cx="0" cy="20" rx="36" ry="40" fill="#a08560"/>
  <!-- head -->
  <circle cx="0" cy="-15" r="34" fill="#b39370"/>
  <!-- pinnae (ear tufts) -->
  <path d="M -25,-32 L -30,-48 Q -15,-44 -15,-32 Z" fill="#7a5a3a"/>
  <path d="M 25,-32 L 30,-48 Q 15,-44 15,-32 Z" fill="#7a5a3a"/>
  <!-- eyes -->
  <circle cx="-12" cy="-18" r="8" fill="#fff"/>
  <circle cx="12" cy="-18" r="8" fill="#fff"/>
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="4.4s" repeatCount="indefinite"/>
    <circle cx="-11" cy="-17" r="5" fill="#f5a623"/>
    <circle cx="-10" cy="-18" r="2.5" fill="#000"/>
    <circle cx="-8" cy="-20" r="1.2" fill="#fff"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="4.4s" repeatCount="indefinite"/>
    <circle cx="13" cy="-17" r="5" fill="#f5a623"/>
    <circle cx="14" cy="-18" r="2.5" fill="#000"/>
    <circle cx="16" cy="-20" r="1.2" fill="#fff"/>
  </g>
  <!-- beak -->
  <path d="M -3,-5 L 0,2 L 3,-5 Z" fill="#3a3530"/>
  <!-- breast line -->
  <path d="M -6,8 Q 0,12 6,8" stroke="#000" stroke-width="1.5" fill="none"/>
</g>
</svg>
