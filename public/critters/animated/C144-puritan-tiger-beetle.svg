<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Puritan tiger beetle — Ellipsoptera puritana</title>
<desc>Antennae twitch, eyes blink, and a brief scuttle adds a tiny additive translate dart to the body group.</desc>
<!-- scuttle: brief dart on the whole positioning group -->
<g transform="translate(100, 100)">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0 0;0 0;3 -1;-3 1;0 0;0 0"
    keyTimes="0;0.7;0.76;0.82;0.88;1"
    dur="3.6s" repeatCount="indefinite"/>
  <!-- body/elytra -->
  <ellipse cx="0" cy="20" rx="22" ry="26" fill="#15803d"/>
  <ellipse cx="-4" cy="10" rx="14" ry="6" fill="#22c55e" opacity="0.55"/>
  <ellipse cx="-3" cy="22" rx="11" ry="3" fill="#16a34a" opacity="0.4"/>
  <!-- leg markings -->
  <path d="M -22 18 L -16 16 M 22 18 L 16 16 M -20 28 L -14 26 M 20 28 L 14 26" stroke="#fde047" stroke-width="1.5" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="-20" y1="36" x2="-26" y2="42" stroke="#0d0d0d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="36" x2="26" y2="42" stroke="#0d0d0d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="-22" y1="22" x2="-28" y2="22" stroke="#0d0d0d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="22" x2="28" y2="22" stroke="#0d0d0d" stroke-width="1.5" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="0" cy="-14" r="18" fill="#0a4a26"/>
  <!-- left antenna — twitch at base (-7,-28) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 -7 -28; -9 -7 -28; 0 -7 -28; 6 -7 -28; 0 -7 -28"
      keyTimes="0;0.2;0.4;0.65;1"
      dur="2.4s" repeatCount="indefinite"/>
    <path d="M -7 -28 L -10 -36" stroke="#0d0d0d" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <!-- right antenna -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 7 -28; 9 7 -28; 0 7 -28; -6 7 -28; 0 7 -28"
      keyTimes="0;0.2;0.4;0.65;1"
      dur="2.4s" repeatCount="indefinite"/>
    <path d="M 7 -28 L 10 -36" stroke="#0d0d0d" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <!-- eye whites -->
  <circle cx="-7" cy="-14" r="6" fill="#ffffff"/>
  <circle cx="7" cy="-14" r="6" fill="#ffffff"/>
  <!-- iris -->
  <circle cx="-7" cy="-13" r="4.5" fill="#fbbf24"/>
  <circle cx="7" cy="-13" r="4.5" fill="#fbbf24"/>
  <!-- pupils + catchlights — blink left -->
  <g transform="translate(-7 -12)">
    <animateTransform attributeName="transform" type="scale"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.87;0.92;1"
      dur="4.8s" repeatCount="indefinite" additive="sum"/>
    <circle cx="0" cy="0" r="2.5" fill="#0d0d0d"/>
    <circle cx="2" cy="-3" r="1.4" fill="#ffffff"/>
  </g>
  <!-- pupils + catchlights — blink right -->
  <g transform="translate(7 -12)">
    <animateTransform attributeName="transform" type="scale"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.87;0.92;1"
      dur="4.8s" repeatCount="indefinite" additive="sum"/>
    <circle cx="0" cy="0" r="2.5" fill="#0d0d0d"/>
    <circle cx="2" cy="-3" r="1.4" fill="#ffffff"/>
  </g>
  <!-- mandible -->
  <path d="M -3 -3 L 3 -3 L 0 0 Z" fill="#0d0d0d"/>
</g>
</svg>
