<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Deer mouse — Peromyscus maniculatus</title>
<desc>Gentle body breathe with alternating big-ear twitches — ears are prominent on this small mouse.</desc>
<g transform="translate(100, 100)">
<!-- tail static -->
<ellipse cx="22" cy="36" rx="3" ry="14" fill="#dca888" transform="rotate(-15 22 36)"/>
<ellipse cx="22" cy="40" rx="2" ry="14" fill="#ffffff" transform="rotate(-15 22 40)"/>
<!-- body breathe: scale about body center (0,22) -->
<g transform="translate(0,22)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1.025 1.025;1 1" keyTimes="0;0.5;1"
    dur="3.2s" repeatCount="indefinite"/>
  <g transform="translate(0,-22)">
    <ellipse cx="0" cy="22" rx="18" ry="20" fill="#a8826a"/>
    <ellipse cx="0" cy="28" rx="11" ry="14" fill="#f4ead6"/>
    <line x1="-5" y1="42" x2="-5" y2="48" stroke="#f4b6b6" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="5" y1="42" x2="5" y2="48" stroke="#f4b6b6" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</g>
<!-- head -->
<circle cx="0" cy="-14" r="18" fill="#a8826a"/>
<!-- left ear twitch — pivot at ear base (-16,-22); big round ears are the star -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 -16 -22;0 -16 -22;-10 -16 -22;4 -16 -22;0 -16 -22"
    keyTimes="0;0.78;0.84;0.91;1"
    dur="3.8s" repeatCount="indefinite"/>
  <circle cx="-16" cy="-30" r="8" fill="#a8826a"/>
  <circle cx="-16" cy="-30" r="5" fill="#f4b6b6"/>
</g>
<!-- right ear twitch — pivot at ear base (16,-22), offset phase -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 16 -22;0 16 -22;10 16 -22;-4 16 -22;0 16 -22"
    keyTimes="0;0.36;0.42;0.49;1"
    dur="4.9s" repeatCount="indefinite"/>
  <circle cx="16" cy="-30" r="8" fill="#a8826a"/>
  <circle cx="16" cy="-30" r="5" fill="#f4b6b6"/>
</g>
<!-- eyes -->
<circle cx="-9" cy="-14" r="6.5" fill="#ffffff"/>
<circle cx="9" cy="-14" r="6.5" fill="#ffffff"/>
<circle cx="-9" cy="-13" r="5" fill="#a78bfa"/>
<circle cx="9" cy="-13" r="5" fill="#a78bfa"/>
<circle cx="-9" cy="-12" r="3" fill="#0d0d0d"/>
<circle cx="9" cy="-12" r="3" fill="#0d0d0d"/>
<circle cx="-7" cy="-15" r="1.6" fill="#ffffff"/>
<circle cx="11" cy="-15" r="1.6" fill="#ffffff"/>
<ellipse cx="0" cy="0" rx="2.2" ry="1.6" fill="#f4b6b6"/>
<line x1="-2" y1="2" x2="-8" y2="4" stroke="#1a1a1a" stroke-width="0.5" stroke-linecap="round"/>
<line x1="2" y1="2" x2="8" y2="4" stroke="#1a1a1a" stroke-width="0.5" stroke-linecap="round"/>
<path d="M -4 6 Q 0 9 4 6" stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</g>
</svg>
