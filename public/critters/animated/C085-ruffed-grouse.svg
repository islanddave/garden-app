<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Ruffed grouse — Bonasa umbellus</title>
<desc>Gentle body/head bob with slow additive translate on the positioning group; slow blink on eyes.</desc>
<g transform="translate(100, 100)">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0 0; 0 -4; 0 0" dur="3.1s" repeatCount="indefinite"/>
  <!-- body -->
  <ellipse cx="0" cy="22" rx="32" ry="22" fill="#7a5028"/>
  <path d="M -28 8 L -24 14 M -16 6 L -12 14 M -4 8 L 0 16 M 8 6 L 12 14 M 20 8 L 24 14" stroke="#5a3818" stroke-width="0.8"/>
  <path d="M -28 22 L -24 28 M -16 24 L -12 30 M -4 22 L 0 30 M 8 24 L 12 30 M 20 22 L 24 28" stroke="#5a3818" stroke-width="0.8"/>
  <!-- tail -->
  <path d="M 22 14 L 38 18 L 42 22 L 44 28 L 42 34 L 38 36 L 24 30 Z" fill="#a87238"/>
  <path d="M 26 18 L 38 22 M 28 22 L 40 26 M 30 26 L 40 30 M 28 30 L 38 32" stroke="#5a3818" stroke-width="0.5"/>
  <!-- feet -->
  <line x1="-5" y1="44" x2="-5" y2="52" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="5" y1="44" x2="5" y2="52" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/>
  <!-- head -->
  <ellipse cx="-22" cy="2" rx="18" ry="14" fill="#7a5028"/>
  <!-- crest -->
  <path d="M -36 -4 Q -30 -10 -24 -4 Q -26 4 -34 4 Z" fill="#5a3818"/>
  <!-- eyes -->
  <circle cx="-28" cy="0" r="4.5" fill="#ffffff"/>
  <circle cx="-18" cy="-2" r="4.5" fill="#ffffff"/>
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="4.6s" repeatCount="indefinite"/>
    <circle cx="-28" cy="1" r="3.2" fill="#92400e"/>
    <circle cx="-28" cy="2" r="1.8" fill="#0d0d0d"/>
    <circle cx="-27" cy="-1" r="1.1" fill="#ffffff"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="4.6s" repeatCount="indefinite"/>
    <circle cx="-18" cy="-1" r="3.2" fill="#92400e"/>
    <circle cx="-18" cy="0" r="1.8" fill="#0d0d0d"/>
    <circle cx="-17" cy="-3" r="1.1" fill="#ffffff"/>
  </g>
  <!-- beak -->
  <path d="M -38 4 L -34 4 L -36 8 Z" fill="#2a2a2a"/>
</g>
</svg>
