<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Common green darner — Anax junius</title>
<desc>Green darner dragonfly hovers with a gentle bob while all four wings blur in rapid counter-phased buzz.</desc>
<g transform="translate(-366, 20)">
  <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0; 0 -5; 0 0" dur="2.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-8 440 78; 5 440 78; -8 440 78" dur="0.12s" repeatCount="indefinite" calcMode="linear"/>
    <ellipse cx="440" cy="78" rx="24" ry="6" fill="#cfd8dc" opacity="0.6" transform="rotate(-10 440 78)" stroke="#9aa5ab" stroke-width="0.5"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="8 492 78; -5 492 78; 8 492 78" dur="0.12s" repeatCount="indefinite" calcMode="linear"/>
    <ellipse cx="492" cy="78" rx="24" ry="6" fill="#cfd8dc" opacity="0.6" transform="rotate(10 492 78)" stroke="#9aa5ab" stroke-width="0.5"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="5 442 92; -8 442 92; 5 442 92" dur="0.12s" repeatCount="indefinite" calcMode="linear"/>
    <ellipse cx="442" cy="92" rx="22" ry="5" fill="#cfd8dc" opacity="0.6" transform="rotate(-15 442 92)" stroke="#9aa5ab" stroke-width="0.5"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 490 92; 8 490 92; -5 490 92" dur="0.12s" repeatCount="indefinite" calcMode="linear"/>
    <ellipse cx="490" cy="92" rx="22" ry="5" fill="#cfd8dc" opacity="0.6" transform="rotate(15 490 92)" stroke="#9aa5ab" stroke-width="0.5"/>
  </g>
  <ellipse cx="466" cy="108" rx="4" ry="22" fill="#2ec4b6"/>
  <line x1="463" y1="116" x2="469" y2="116" stroke="#0a8276" stroke-width="0.8"/>
  <line x1="463" y1="124" x2="469" y2="124" stroke="#0a8276" stroke-width="0.8"/>
  <circle cx="466" cy="78" r="22" fill="#2ec4b6"/>
  <circle cx="456" cy="76" r="11" fill="#0077b6"/>
  <circle cx="476" cy="76" r="11" fill="#0077b6"/>
  <circle cx="456" cy="76" r="6" fill="#1a1a1a"/>
