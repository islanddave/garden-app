  <circle cx="458" cy="74" r="2" fill="#ffffff"/>
  <circle cx="478" cy="74" r="2" fill="#ffffff"/>
  <path d="M 462 90 Q 466 93 470 90" stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</g>
