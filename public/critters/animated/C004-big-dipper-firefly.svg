<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Big dipper firefly — Photinus pyralis</title>
<desc>Abdomen lantern pulses with glowing opacity, halo circles shimmer, the firefly drifts slowly, and two sparkle dots fade in and out.</desc>
<!-- slow drift on the whole body group, additive=sum to preserve translate -->
<g transform="translate(-366, -150)">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0 0; 2 -4; 0 -6; -2 -4; 0 0"
    keyTimes="0;0.25;0.5;0.75;1"
    dur="3.2s" repeatCount="indefinite"/>
  <!-- outer glow halo — pulsing opacity and r -->
  <circle cx="466" cy="286" r="16" fill="#fff3a0" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.65;0.35;0.2;0.35" keyTimes="0;0.4;0.7;0.85;1" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="16;20;16;13;16" keyTimes="0;0.4;0.7;0.85;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <!-- inner halo -->
  <circle cx="466" cy="286" r="10" fill="#fff3a0" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6;0.35;0.6" keyTimes="0;0.4;0.7;0.85;1" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="10;13;10;8;10" keyTimes="0;0.4;0.7;0.85;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <!-- wings -->
  <ellipse cx="438" cy="262" rx="20" ry="10" fill="#cfd8dc" opacity="0.6" transform="rotate(-25 438 262)" stroke="#9aa5ab" stroke-width="0.5"/>
  <ellipse cx="494" cy="262" rx="20" ry="10" fill="#cfd8dc" opacity="0.6" transform="rotate(25 494 262)" stroke="#9aa5ab" stroke-width="0.5"/>
  <!-- thorax -->
  <ellipse cx="466" cy="275" rx="13" ry="18" fill="#1a2238"/>
  <!-- abdomen lantern — pulse opacity -->
  <ellipse cx="466" cy="288" rx="10" ry="8" fill="#fff3a0">
    <animate attributeName="opacity" values="1;0.5;1;0.3;1" keyTimes="0;0.4;0.7;0.85;1" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  <!-- head -->
  <circle cx="466" cy="248" r="22" fill="#1a2238"/>
  <!-- eyes white sclera -->
  <circle cx="457" cy="246" r="6" fill="#ffffff"/>
  <circle cx="475" cy="246" r="6" fill="#ffffff"/>
  <!-- iris (glowing yellow) -->
  <circle cx="457" cy="248" r="3.5" fill="#fff3a0"/>
  <circle cx="475" cy="248" r="3.5" fill="#fff3a0"/>
  <!-- catchlights -->
  <circle cx="458" cy="246" r="1.3" fill="#ffffff"/>
  <circle cx="476" cy="246" r="1.3" fill="#ffffff"/>
  <!-- smile -->
  <path d="M 461 258 Q 466 262 471 258" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- antennae -->
  <path d="M 456 225 Q 450 217 448 211" stroke="#1a2238" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 476 225 Q 482 217 484 211" stroke="#1a2238" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <circle cx="448" cy="211" r="2.5" fill="#fff3a0"/>
  <circle cx="484" cy="211" r="2.5" fill="#fff3a0"/>
  <!-- sparkle dot 1 — fades in then out, staggered -->
  <circle cx="475" cy="295" r="2.5" fill="#fff3a0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.3;0.45;0.6;1" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;1;2.5;1;0" keyTimes="0;0.3;0.45;0.6;1" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <!-- sparkle dot 2 — offset timing -->
  <circle cx="458" cy="298" r="2" fill="#fff3a0">
    <animate attributeName="opacity" values="0;0;0.8;0" keyTimes="0;0.55;0.7;1" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0;0;2;0" keyTimes="0;0.55;0.7;1" dur="2.1s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
