<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Northern raccoon — Procyon lotor</title>
<desc>Gentle body breathe and slow tail sway with ear twitches.</desc>
<g transform="translate(100, 100)">
<!-- tail sway — pivot at tail base (~22,8) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 22 8;5 22 8;0 22 8;-4 22 8;0 22 8"
    keyTimes="0;0.25;0.5;0.75;1"
    dur="5.2s" repeatCount="indefinite"/>
  <path d="M 22 8 Q 38 -6 40 16 Q 36 36 22 32 Q 26 16 22 8 Z" fill="#6a5a48"/>
  <path d="M 24 4 L 38 0" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 28 14 L 40 16" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 26 24 L 38 26" stroke="#1a1a1a" stroke-width="1.5"/>
</g>
<!-- body breathe: scale about body center (0,24) -->
<g transform="translate(0,24)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1.025 1.025;1 1" keyTimes="0;0.5;1"
    dur="3.7s" repeatCount="indefinite"/>
  <g transform="translate(0,-24)">
    <ellipse cx="0" cy="24" rx="24" ry="24" fill="#9a8a72"/>
    <ellipse cx="0" cy="30" rx="14" ry="12" fill="#f0e4cc"/>
    <ellipse cx="-12" cy="44" rx="4" ry="2.8" fill="#5a4828"/>
    <ellipse cx="12" cy="44" rx="4" ry="2.8" fill="#5a4828"/>
  </g>
</g>
<!-- head -->
<circle cx="0" cy="-14" r="22" fill="#9a8a72"/>
<!-- left ear twitch — pivot at ear base (-14,-22) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 -14 -22;0 -14 -22;-8 -14 -22;3 -14 -22;0 -14 -22"
    keyTimes="0;0.80;0.86;0.93;1"
    dur="4.3s" repeatCount="indefinite"/>
  <ellipse cx="-14" cy="-30" rx="5" ry="6" fill="#9a8a72"/>
  <ellipse cx="-14" cy="-30" rx="2.5" ry="3" fill="#5a4828"/>
</g>
<!-- right ear twitch — pivot at ear base (14,-22), offset phase -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 14 -22;0 14 -22;8 14 -22;-3 14 -22;0 14 -22"
    keyTimes="0;0.39;0.45;0.52;1"
    dur="5.4s" repeatCount="indefinite"/>
  <ellipse cx="14" cy="-30" rx="5" ry="6" fill="#9a8a72"/>
  <ellipse cx="14" cy="-30" rx="2.5" ry="3" fill="#5a4828"/>
</g>
<!-- mask + eyes -->
<ellipse cx="0" cy="-10" rx="22" ry="10" fill="#1a1a1a"/>
<ellipse cx="-8" cy="-10" rx="8" ry="7" fill="#ffffff"/>
<ellipse cx="8" cy="-10" rx="8" ry="7" fill="#ffffff"/>
<circle cx="-8" cy="-10" r="6" fill="#ffffff"/>
<circle cx="8" cy="-10" r="6" fill="#ffffff"/>
<circle cx="-8" cy="-9" r="4.5" fill="#ca8a04"/>
<circle cx="8" cy="-9" r="4.5" fill="#ca8a04"/>
<circle cx="-8" cy="-8" r="2.5" fill="#0d0d0d"/>
<circle cx="8" cy="-8" r="2.5" fill="#0d0d0d"/>
<circle cx="-6" cy="-11" r="1.5" fill="#ffffff"/>
<circle cx="10" cy="-11" r="1.5" fill="#ffffff"/>
<ellipse cx="0" cy="4" rx="3" ry="2" fill="#1a1a1a"/>
<path d="M -4 12 Q 0 15 4 12" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</g>
</svg>
