<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Southern flying squirrel — Glaucomys volans</title>
<desc>Gentle body breathe with ear twitches and a slow gliding-membrane flutter.</desc>
<g transform="translate(100, 100)">
<!-- gliding membranes — slow gentle opacity/scale flutter suggesting folded patagium -->
<g>
  <animate attributeName="opacity" values="0.6;0.8;0.6;0.5;0.6"
    keyTimes="0;0.25;0.5;0.75;1"
    dur="4.0s" repeatCount="indefinite"/>
  <path d="M -36 -8 Q -50 10 -46 30 Q -28 22 -14 8 Z" fill="#9ca3af" opacity="0.6"/>
  <path d="M 36 -8 Q 50 10 46 30 Q 28 22 14 8 Z" fill="#9ca3af" opacity="0.6"/>
</g>
<!-- tail static -->
<path d="M 18 32 L 38 56 L 30 56 L 14 36 Z" fill="#a8a098"/>
<!-- body breathe: scale about body center (0,22) -->
<g transform="translate(0,22)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1.025 1.025;1 1" keyTimes="0;0.5;1"
    dur="3.4s" repeatCount="indefinite"/>
  <g transform="translate(0,-22)">
    <ellipse cx="0" cy="22" rx="22" ry="20" fill="#a8a098"/>
    <ellipse cx="0" cy="28" rx="12" ry="11" fill="#ede0c8"/>
    <line x1="-5" y1="40" x2="-5" y2="46" stroke="#5a5048" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="5" y1="40" x2="5" y2="46" stroke="#5a5048" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</g>
<!-- head -->
<circle cx="0" cy="-14" r="20" fill="#a8a098"/>
<!-- left ear twitch — pivot at ear base (-14,-24) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 -14 -24;0 -14 -24;-9 -14 -24;3 -14 -24;0 -14 -24"
    keyTimes="0;0.80;0.86;0.93;1"
    dur="4.0s" repeatCount="indefinite"/>
  <circle cx="-14" cy="-30" r="5" fill="#a8a098"/>
  <circle cx="-14" cy="-30" r="2.5" fill="#f4b6b6"/>
</g>
<!-- right ear twitch — pivot at ear base (14,-24), offset phase -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 14 -24;0 14 -24;9 14 -24;-3 14 -24;0 14 -24"
    keyTimes="0;0.38;0.44;0.51;1"
    dur="5.3s" repeatCount="indefinite"/>
  <circle cx="14" cy="-30" r="5" fill="#a8a098"/>
  <circle cx="14" cy="-30" r="2.5" fill="#f4b6b6"/>
</g>
<!-- eyes — flying squirrel has giant dark eyes -->
<circle cx="-9" cy="-14" r="9" fill="#0d0d0d"/>
<circle cx="9" cy="-14" r="9" fill="#0d0d0d"/>
<circle cx="-9" cy="-14" r="7" fill="#1a1a1a"/>
<circle cx="9" cy="-14" r="7" fill="#1a1a1a"/>
<circle cx="-9" cy="-13" r="4.5" fill="#8b5cf6"/>
<circle cx="9" cy="-13" r="4.5" fill="#8b5cf6"/>
<circle cx="-9" cy="-12" r="2.5" fill="#0d0d0d"/>
<circle cx="9" cy="-12" r="2.5" fill="#0d0d0d"/>
<circle cx="-7" cy="-16" r="1.6" fill="#ffffff"/>
<circle cx="11" cy="-16" r="1.6" fill="#ffffff"/>
<ellipse cx="0" cy="0" rx="2" ry="1.5" fill="#f4b6b6"/>
<path d="M -4 6 Q 0 9 4 6" stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</g>
</svg>
