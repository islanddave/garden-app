<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Giant panda — Ailuropoda melanoleuca</title>
<desc>Giant panda breathes gently and twitches an ear with a slow blink.</desc>
<g transform="translate(100, 100)">
  <animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;1.02 1.02;1 1" dur="3.5s" repeatCount="indefinite"/>
  <ellipse cx="0" cy="24" rx="28" ry="26" fill="#ffffff"/>
  <ellipse cx="-20" cy="14" rx="10" ry="14" fill="#1a1a1a"/>
  <ellipse cx="20" cy="14" rx="10" ry="14" fill="#1a1a1a"/>
  <ellipse cx="-14" cy="46" rx="5" ry="4" fill="#1a1a1a"/>
  <ellipse cx="14" cy="46" rx="5" ry="4" fill="#1a1a1a"/>
  <circle cx="0" cy="-14" r="26" fill="#ffffff"/>
  <circle cx="18" cy="-30" r="10" fill="#1a1a1a"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 -18 -30;0 -18 -30;-6 -18 -30;2 -18 -30;0 -18 -30" keyTimes="0;0.8;0.86;0.92;1" dur="4.5s" repeatCount="indefinite"/>
    <circle cx="-18" cy="-30" r="10" fill="#1a1a1a"/>
  </g>
  <ellipse cx="-10" cy="-12" rx="9" ry="8" fill="#1a1a1a"/>
  <ellipse cx="10" cy="-12" rx="9" ry="8" fill="#1a1a1a"/>
  <circle cx="-10" cy="-12" r="5" fill="#ffffff"/>
  <circle cx="10" cy="-12" r="5" fill="#ffffff"/>
  <circle cx="10" cy="-11" r="3.5" fill="#fbbf24"/>
  <circle cx="10" cy="-10" r="2" fill="#0d0d0d"/>
  <circle cx="12" cy="-13" r="1.4" fill="#ffffff"/>
  <g>
    <animate attributeName="opacity" values="1;1;0.05;1" keyTimes="0;0.88;0.93;1" dur="5s" repeatCount="indefinite"/>
    <circle cx="-10" cy="-11" r="3.5" fill="#fbbf24"/>
    <circle cx="-10" cy="-10" r="2" fill="#0d0d0d"/>
    <circle cx="-8" cy="-13" r="1.4" fill="#ffffff"/>
  </g>
  <ellipse cx="0" cy="2" rx="4" ry="3" fill="#1a1a1a"/>
  <path d="M -5 8 Q 0 12 5 8" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
