<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Convergent ladybug — Hippodamia convergens</title>
<desc>Antennae sway gently side to side, red elytra twitch with a slow rotate, and the eyes blink occasionally.</desc>
<g transform="translate(12, 20)">
  <!-- wing halo/shadow ellipses -->
  <ellipse cx="58" cy="98" rx="22" ry="9" fill="#cfd8dc" opacity="0.7" transform="rotate(-25 58 98)"/>
  <ellipse cx="118" cy="98" rx="22" ry="9" fill="#cfd8dc" opacity="0.7" transform="rotate(25 118 98)"/>
  <!-- left elytra (red wing-case) — slow twitch rotate around its center -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-18 64 102; -15 64 102; -18 64 102; -20 64 102; -18 64 102"
      keyTimes="0;0.25;0.5;0.75;1"
      dur="3.8s" repeatCount="indefinite"/>
    <ellipse cx="64" cy="102" rx="18" ry="9" fill="#d92f2f" transform="rotate(-18 64 102)"/>
  </g>
  <!-- right elytra — mirror twitch -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="18 112 102; 21 112 102; 18 112 102; 15 112 102; 18 112 102"
      keyTimes="0;0.25;0.5;0.75;1"
      dur="3.8s" repeatCount="indefinite"/>
    <ellipse cx="112" cy="102" rx="18" ry="9" fill="#d92f2f" transform="rotate(18 112 102)"/>
  </g>
  <!-- black spot dots (static) -->
  <circle cx="60" cy="100" r="2" fill="#1a1a1a"/>
  <circle cx="68" cy="105" r="2" fill="#1a1a1a"/>
  <circle cx="116" cy="100" r="2" fill="#1a1a1a"/>
  <circle cx="108" cy="105" r="2" fill="#1a1a1a"/>
  <!-- head -->
  <circle cx="88" cy="78" r="26" fill="#1a1a1a"/>
  <!-- eye whites -->
  <circle cx="79" cy="76" r="7" fill="#ffffff"/>
  <circle cx="97" cy="76" r="7" fill="#ffffff"/>
  <!-- iris+pupil+catchlight — blink group left eye -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0" dur="4.5s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(79 76)">
      <animateTransform attributeName="transform" type="scale"
        values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.90;0.94;1"
        dur="4.5s" repeatCount="indefinite" additive="sum"/>
      <circle cx="0" cy="2" r="4" fill="#1a1a1a"/>
      <circle cx="2" cy="0" r="1.5" fill="#ffffff"/>
    </g>
  </g>
  <!-- iris+pupil+catchlight — blink group right eye -->
  <g transform="translate(97 76)">
    <animateTransform attributeName="transform" type="scale"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.90;0.94;1"
      dur="4.5s" repeatCount="indefinite" additive="sum"/>
    <circle cx="0" cy="2" r="4" fill="#1a1a1a"/>
    <circle cx="2" cy="0" r="1.5" fill="#ffffff"/>
  </g>
  <!-- mouth smile -->
  <path d="M 83 88 Q 88 92 93 88" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- left antenna — gentle sway around base at (78,55) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 78 55; -6 78 55; 0 78 55; 5 78 55; 0 78 55"
      keyTimes="0;0.25;0.5;0.75;1"
      dur="2.6s" repeatCount="indefinite"/>
    <path d="M 78 55 Q 72 47 70 41" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="70" cy="41" r="2.5" fill="#d92f2f"/>
  </g>
  <!-- right antenna — gentle sway (opposite phase) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 98 55; 6 98 55; 0 98 55; -5 98 55; 0 98 55"
      keyTimes="0;0.25;0.5;0.75;1"
      dur="2.6s" repeatCount="indefinite"/>
    <path d="M 98 55 Q 104 47 106 41" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="106" cy="41" r="2.5" fill="#d92f2f"/>
  </g>
</g>
</svg>
