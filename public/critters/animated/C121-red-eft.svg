<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Red eft (Eastern newt) — Notophthalmus viridescens</title>
<desc>Body breathes gently; tail sways slowly; eyes blink.</desc>
<g transform="translate(100, 100)">
<!-- body breathe -->
<ellipse cx="6" cy="0" rx="36" ry="11" fill="#ea580c">
  <animate attributeName="ry" values="11;11.7;11" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
</ellipse>
<!-- tail sway — rotate at tail base (~42,0) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 42 0; 4 42 0; -3 42 0; 0 42 0" keyTimes="0;0.35;0.7;1"
    dur="3.8s" repeatCount="indefinite"/>
  <path d="M 42 0 Q 52 -2 56 -4 Q 52 4 42 6 Z" fill="#ea580c"/>
</g>
<circle cx="-12" cy="-2" r="2" fill="#3a1a08"/>
<circle cx="-2" cy="-1" r="2" fill="#3a1a08"/>
<circle cx="8" cy="-2" r="2" fill="#3a1a08"/>
<circle cx="18" cy="-1" r="2" fill="#3a1a08"/>
<circle cx="28" cy="-2" r="2" fill="#3a1a08"/>
<circle cx="-12" cy="-2" r="0.8" fill="#fde047"/>
<circle cx="-2" cy="-1" r="0.8" fill="#fde047"/>
<circle cx="8" cy="-2" r="0.8" fill="#fde047"/>
<circle cx="18" cy="-1" r="0.8" fill="#fde047"/>
<circle cx="28" cy="-2" r="0.8" fill="#fde047"/>
<ellipse cx="-14" cy="12" rx="3.5" ry="3" fill="#c2410c"/>
<ellipse cx="-2" cy="12" rx="3.5" ry="3" fill="#c2410c"/>
<ellipse cx="14" cy="12" rx="3.5" ry="3" fill="#c2410c"/>
<ellipse cx="26" cy="12" rx="3.5" ry="3" fill="#c2410c"/>
<!-- head -->
<ellipse cx="-30" cy="-1" rx="15" ry="12" fill="#ea580c"/>
<!-- left sclera -->
<circle cx="-36" cy="-3" r="4.5" fill="#ffffff"/>
<!-- right sclera -->
<circle cx="-24" cy="-3" r="4.5" fill="#ffffff"/>
<!-- left iris+pupil+catchlight blink -->
<g transform="translate(-36,-3)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.88;0.93;1" dur="5.4s" repeatCount="indefinite"/>
  <circle cx="0" cy="1" r="3.2" fill="#67e8f9"/>
  <circle cx="0" cy="2" r="1.8" fill="#0d0d0d"/>
  <circle cx="1" cy="-1" r="1.1" fill="#ffffff"/>
</g>
<!-- right iris+pupil+catchlight blink -->
<g transform="translate(-24,-3)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.88;0.93;1" dur="5.4s" repeatCount="indefinite"/>
  <circle cx="0" cy="1" r="3.2" fill="#67e8f9"/>
  <circle cx="0" cy="2" r="1.8" fill="#0d0d0d"/>
  <circle cx="1" cy="-1" r="1.1" fill="#ffffff"/>
</g>
<path d="M -40 5 Q -30 9 -20 5" stroke="#3a1a08" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</g>
</svg>
