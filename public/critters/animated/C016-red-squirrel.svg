<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Red squirrel — Tamiasciurus hudsonicus</title>
<desc>Gentle body breathe, ear twitches, and slow tail sway.</desc>
<g transform="translate(100, 100)">
<!-- tail sway — pivot at tail base near body (~-18,4) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 -18 4;4 -18 4;0 -18 4;-4 -18 4;0 -18 4"
    keyTimes="0;0.25;0.5;0.75;1"
    dur="5.0s" repeatCount="indefinite"/>
  <path d="M -16 4 Q -44 -16 -46 14 Q -42 40 -18 34 Q -24 16 -16 4 Z" fill="#d2691e"/>
  <path d="M -22 0 Q -36 -8 -36 14 Q -32 26 -22 24" fill="none" stroke="#a35020" stroke-width="0.8"/>
  <path d="M -28 -4 Q -38 -8 -40 4" fill="none" stroke="#a35020" stroke-width="0.5"/>
</g>
<!-- body breathe: scale about body center (0,24) -->
<g transform="translate(0,24)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1.03 1.03;1 1" keyTimes="0;0.5;1"
    dur="3.4s" repeatCount="indefinite"/>
  <g transform="translate(0,-24)">
    <ellipse cx="0" cy="24" rx="20" ry="25" fill="#d2691e"/>
    <ellipse cx="2" cy="30" rx="11" ry="14" fill="#f4ead6"/>
    <ellipse cx="-7" cy="46" rx="4" ry="2.8" fill="#a35020"/>
    <ellipse cx="11" cy="40" rx="4" ry="3" fill="#a35020" transform="rotate(-25 11 40)"/>
  </g>
</g>
<!-- head -->
<circle cx="2" cy="-14" r="22" fill="#d2691e"/>
<!-- left ear twitch — pivot at ear base (-13,-26) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 -13 -26;0 -13 -26;-9 -13 -26;3 -13 -26;0 -13 -26"
    keyTimes="0;0.8;0.86;0.93;1"
    dur="4.0s" repeatCount="indefinite"/>
  <circle cx="-13" cy="-32" r="6" fill="#d2691e"/>
  <circle cx="-13" cy="-32" r="3" fill="#f4b6b6"/>
  <line x1="-14" y1="-39" x2="-12" y2="-45" stroke="#8a4520" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="-12" y1="-39" x2="-10" y2="-45" stroke="#8a4520" stroke-width="1.6" stroke-linecap="round"/>
</g>
<!-- right ear twitch — pivot at ear base (17,-26), offset phase -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 17 -26;0 17 -26;8 17 -26;-3 17 -26;0 17 -26"
    keyTimes="0;0.4;0.46;0.53;1"
    dur="5.2s" repeatCount="indefinite"/>
  <circle cx="17" cy="-32" r="6" fill="#d2691e"/>
  <circle cx="17" cy="-32" r="3" fill="#f4b6b6"/>
  <line x1="18" y1="-39" x2="16" y2="-45" stroke="#8a4520" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="-39" x2="14" y2="-45" stroke="#8a4520" stroke-width="1.6" stroke-linecap="round"/>
</g>
<!-- eyes -->
<circle cx="-6" cy="-15" r="7" fill="#ffffff"/>
<circle cx="10" cy="-15" r="7" fill="#ffffff"/>
<circle cx="-7" cy="-16" r="5.5" fill="#ca8a04"/>
<circle cx="9" cy="-16" r="5.5" fill="#ca8a04"/>
<circle cx="-8" cy="-17" r="2.8" fill="#0d0d0d"/>
<circle cx="8" cy="-17" r="2.8" fill="#0d0d0d"/>
<circle cx="-5" cy="-18" r="1.8" fill="#ffffff"/>
<circle cx="11" cy="-18" r="1.8" fill="#ffffff"/>
<ellipse cx="2" cy="0" rx="2.2" ry="1.6" fill="#1a1a1a"/>
<path d="M -3 6 Q 2 12 7 6" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</g>
</svg>
