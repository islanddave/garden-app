<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Northern saw-whet owl — Aegolius acadicus</title>
<desc>Slow blink of big eyes (iris+pupil opacity) with a gentle head tilt on a 5s loop.</desc>
<g transform="translate(100, 100)">
<!-- wings -->
<ellipse cx="-26" cy="14" rx="22" ry="12" fill="#a87238" opacity="0.85" transform="rotate(-20 -26 14)" stroke="#5a3818" stroke-width="0.5"/>
<ellipse cx="26" cy="14" rx="22" ry="12" fill="#a87238" opacity="0.85" transform="rotate(20 26 14)" stroke="#5a3818" stroke-width="0.5"/>
<!-- belly -->
<ellipse cx="0" cy="26" rx="22" ry="18" fill="#f0e4cc"/>
<path d="M -14 18 L 14 18 M -16 26 L 16 26 M -14 34 L 14 34" stroke="#7a5028" stroke-width="2" stroke-linecap="round"/>
<!-- feet -->
<line x1="-5" y1="42" x2="-5" y2="50" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/>
<line x1="5" y1="42" x2="5" y2="50" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/>
<!-- head group with tilt -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 0 -10; 4 0 -10; 0 0 -10; -4 0 -10; 0 0 -10"
    keyTimes="0; 0.25; 0.5; 0.75; 1"
    dur="5s" repeatCount="indefinite"/>
  <!-- head base -->
  <circle cx="0" cy="-10" r="26" fill="#a87238"/>
  <circle cx="0" cy="-6" r="22" fill="#f0e4cc"/>
  <!-- facial disks -->
  <ellipse cx="-12" cy="-10" rx="11" ry="13" fill="#fef3c7"/>
  <ellipse cx="12" cy="-10" rx="11" ry="13" fill="#fef3c7"/>
  <!-- sclera — extra big for saw-whet -->
  <circle cx="-11" cy="-10" r="10" fill="#ffffff"/>
  <circle cx="11" cy="-10" r="10" fill="#ffffff"/>
  <!-- left iris+pupil+catchlight — slow blink, this owl's eyes are the star -->
  <g>
    <animate attributeName="opacity" values="1;1;0.05;1" keyTimes="0;0.88;0.94;1" dur="5s" repeatCount="indefinite"/>
    <circle cx="-11" cy="-9" r="7.5" fill="#bae6fd"/>
    <circle cx="-11" cy="-8" r="5" fill="#0d0d0d"/>
    <circle cx="-9" cy="-12" r="2" fill="#ffffff"/>
  </g>
  <!-- right iris+pupil+catchlight — blink -->
  <g>
    <animate attributeName="opacity" values="1;1;0.05;1" keyTimes="0;0.88;0.94;1" dur="5s" repeatCount="indefinite"/>
    <circle cx="11" cy="-9" r="7.5" fill="#bae6fd"/>
    <circle cx="11" cy="-8" r="5" fill="#0d0d0d"/>
    <circle cx="13" cy="-12" r="2" fill="#ffffff"/>
  </g>
  <!-- eyelid overlays — matches facial disk -->
  <g>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.88;0.94;1" dur="5s" repeatCount="indefinite"/>
    <ellipse cx="-11" cy="-10" rx="10" ry="5" fill="#a87238"/>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.88;0.94;1" dur="5s" repeatCount="indefinite"/>
    <ellipse cx="11" cy="-10" rx="10" ry="5" fill="#a87238"/>
  </g>
  <!-- beak -->
  <path d="M -3 4 L 3 4 L 0 9 Z" fill="#5a3818"/>
</g>
</g>
</svg>
