<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Meadow vole — Microtus pennsylvanicus</title>
<desc>Gentle body breathe with small ear twitches on this compact vole.</desc>
<g transform="translate(100, 100)">
<!-- body breathe: scale about body center (0,22) -->
<g transform="translate(0,22)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1.025 1.025;1 1" keyTimes="0;0.5;1"
    dur="3.3s" repeatCount="indefinite"/>
  <g transform="translate(0,-22)">
    <ellipse cx="0" cy="22" rx="22" ry="20" fill="#8a6038"/>
    <ellipse cx="0" cy="28" rx="13" ry="12" fill="#c4a280"/>
    <ellipse cx="-22" cy="38" rx="3" ry="5" fill="#8a6038"/>
    <line x1="-5" y1="42" x2="-5" y2="48" stroke="#5a3818" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="5" y1="42" x2="5" y2="48" stroke="#5a3818" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</g>
<!-- head -->
<circle cx="0" cy="-10" r="18" fill="#8a6038"/>
<!-- left ear twitch — pivot at ear base (-12,-16); small ears on this species -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 -12 -16;0 -12 -16;-8 -12 -16;3 -12 -16;0 -12 -16"
    keyTimes="0;0.80;0.86;0.93;1"
    dur="4.1s" repeatCount="indefinite"/>
  <ellipse cx="-12" cy="-22" rx="4" ry="3" fill="#8a6038"/>
  <ellipse cx="-12" cy="-22" rx="2" ry="1.5" fill="#5a3818"/>
</g>
<!-- right ear twitch — pivot at ear base (12,-16), offset phase -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 12 -16;0 12 -16;8 12 -16;-3 12 -16;0 12 -16"
    keyTimes="0;0.39;0.45;0.52;1"
    dur="5.2s" repeatCount="indefinite"/>
  <ellipse cx="12" cy="-22" rx="4" ry="3" fill="#8a6038"/>
  <ellipse cx="12" cy="-22" rx="2" ry="1.5" fill="#5a3818"/>
</g>
<!-- eyes -->
<circle cx="-7" cy="-10" r="4.5" fill="#ffffff"/>
<circle cx="7" cy="-10" r="4.5" fill="#ffffff"/>
<circle cx="-7" cy="-9" r="3.2" fill="#fdba74"/>
<circle cx="7" cy="-9" r="3.2" fill="#fdba74"/>
<circle cx="-7" cy="-8" r="1.8" fill="#0d0d0d"/>
<circle cx="7" cy="-8" r="1.8" fill="#0d0d0d"/>
<circle cx="-6" cy="-11" r="1.1" fill="#ffffff"/>
<circle cx="8" cy="-11" r="1.1" fill="#ffffff"/>
<ellipse cx="0" cy="2" rx="2" ry="1.5" fill="#1a1a1a"/>
<path d="M -3 6 Q 0 9 3 6" stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</g>
</svg>
