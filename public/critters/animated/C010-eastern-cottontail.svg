<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Eastern cottontail — Sylvilagus floridanus</title>
<desc>Gentle body breathe with alternating left and right ear twitches.</desc>
<g transform="translate(12, -150)">
<!-- body breathe: scale about body center (88,268) -->
<g transform="translate(88,268)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1.025 1.025;1 1" keyTimes="0;0.5;1"
    dur="3.6s" repeatCount="indefinite"/>
  <g transform="translate(-88,-268)">
    <ellipse cx="70" cy="282" rx="14" ry="7" fill="#a08d7a" transform="rotate(-20 70 282)"/>
    <ellipse cx="88" cy="278" rx="22" ry="16" fill="#a08d7a"/>
    <ellipse cx="88" cy="282" rx="14" ry="10" fill="#f0e6d8"/>
    <circle cx="110" cy="276" r="6" fill="#f0e6d8"/>
    <ellipse cx="72" cy="290" rx="5" ry="3" fill="#a08d7a"/>
  </g>
</g>
<!-- head + ears -->
<circle cx="88" cy="248" r="24" fill="#a08d7a"/>
<!-- left ear twitch — pivot at base (76,242) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 76 242;0 76 242;-9 76 242;3 76 242;0 76 242"
    keyTimes="0;0.78;0.84;0.91;1"
    dur="4.2s" repeatCount="indefinite"/>
  <ellipse cx="76" cy="226" rx="5" ry="16" fill="#a08d7a" transform="rotate(-15 76 226)"/>
  <ellipse cx="76" cy="228" rx="2.5" ry="10" fill="#f4b6b6" transform="rotate(-15 76 228)"/>
</g>
<!-- right ear twitch — pivot at base (100,242), phase-offset by starting mid-cycle -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 100 242;0 100 242;8 100 242;-3 100 242;0 100 242"
    keyTimes="0;0.4;0.46;0.53;1"
    dur="5.1s" repeatCount="indefinite"/>
  <ellipse cx="100" cy="226" rx="5" ry="16" fill="#a08d7a" transform="rotate(15 100 226)"/>
  <ellipse cx="100" cy="228" rx="2.5" ry="10" fill="#f4b6b6" transform="rotate(15 100 228)"/>
</g>
<!-- eyes -->
<circle cx="79" cy="246" r="6" fill="#ffffff"/>
<circle cx="97" cy="246" r="6" fill="#ffffff"/>
<circle cx="79" cy="248" r="3.5" fill="#1a1a1a"/>
<circle cx="97" cy="248" r="3.5" fill="#1a1a1a"/>
<circle cx="80" cy="246" r="1.3" fill="#ffffff"/>
<circle cx="98" cy="246" r="1.3" fill="#ffffff"/>
<path d="M 85 258 L 91 258 L 88 262 Z" fill="#f4b6b6"/>
<path d="M 88 262 Q 88 264 86 265" stroke="#1a1a1a" stroke-width="1" fill="none" stroke-linecap="round"/>
<path d="M 88 262 Q 88 264 90 265" stroke="#1a1a1a" stroke-width="1" fill="none" stroke-linecap="round"/>
</g>
</svg>
