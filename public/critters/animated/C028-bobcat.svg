<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Bobcat — Lynx rufus</title>
<desc>Gentle body breathe with tufted ear twitches on this alert cat.</desc>
<g transform="translate(100, 100)">
<!-- bobcat stub tail (static, too small for sway) -->
<ellipse cx="22" cy="44" rx="6" ry="3" fill="#a87238"/>
<!-- body breathe: scale about body center (0,22) -->
<g transform="translate(0,22)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1.025 1.025;1 1" keyTimes="0;0.5;1"
    dur="3.5s" repeatCount="indefinite"/>
  <g transform="translate(0,-22)">
    <ellipse cx="0" cy="22" rx="26" ry="24" fill="#c4a07c"/>
    <ellipse cx="0" cy="28" rx="15" ry="14" fill="#ede0c8"/>
    <circle cx="-12" cy="14" r="2" fill="#1a1a1a"/>
    <circle cx="10" cy="18" r="2" fill="#1a1a1a"/>
    <circle cx="-2" cy="22" r="2" fill="#1a1a1a"/>
    <circle cx="14" cy="32" r="2" fill="#1a1a1a"/>
    <circle cx="-14" cy="32" r="2" fill="#1a1a1a"/>
    <ellipse cx="-12" cy="46" rx="4" ry="2.8" fill="#8a5828"/>
    <ellipse cx="12" cy="46" rx="4" ry="2.8" fill="#8a5828"/>
  </g>
</g>
<!-- head -->
<circle cx="0" cy="-14" r="22" fill="#c4a07c"/>
<!-- left ear twitch — pivot at ear base (-11,-24) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 -11 -24;0 -11 -24;-9 -11 -24;3 -11 -24;0 -11 -24"
    keyTimes="0;0.80;0.86;0.93;1"
    dur="4.1s" repeatCount="indefinite"/>
  <path d="M -14 -26 L -10 -42 L -8 -22 Z" fill="#c4a07c"/>
  <path d="M -12 -28 L -10 -38 L -8 -26 Z" fill="#0d0d0d"/>
  <line x1="-10" y1="-44" x2="-10" y2="-50" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
</g>
<!-- right ear twitch — pivot at ear base (11,-24), offset phase -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 11 -24;0 11 -24;9 11 -24;-3 11 -24;0 11 -24"
    keyTimes="0;0.38;0.44;0.51;1"
    dur="5.2s" repeatCount="indefinite"/>
  <path d="M 14 -26 L 10 -42 L 8 -22 Z" fill="#c4a07c"/>
  <path d="M 12 -28 L 10 -38 L 8 -26 Z" fill="#0d0d0d"/>
  <line x1="10" y1="-44" x2="10" y2="-50" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
</g>
<!-- eye patches + eyes -->
<ellipse cx="-8" cy="-10" rx="9" ry="8" fill="#ede0c8"/>
<ellipse cx="8" cy="-10" rx="9" ry="8" fill="#ede0c8"/>
<circle cx="-8" cy="-12" r="6" fill="#ffffff"/>
<circle cx="8" cy="-12" r="6" fill="#ffffff"/>
<circle cx="-8" cy="-11" r="4.5" fill="#10b981"/>
<circle cx="8" cy="-11" r="4.5" fill="#10b981"/>
<ellipse cx="-8" cy="-11" rx="2" ry="3.5" fill="#0d0d0d"/>
<ellipse cx="8" cy="-11" rx="2" ry="3.5" fill="#0d0d0d"/>
<circle cx="-6" cy="-14" r="1.4" fill="#ffffff"/>
<circle cx="10" cy="-14" r="1.4" fill="#ffffff"/>
<ellipse cx="0" cy="0" rx="3" ry="2" fill="#1a1a1a"/>
<path d="M -5 6 Q 0 10 5 6" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</g>
</svg>
