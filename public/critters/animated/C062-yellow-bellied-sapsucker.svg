<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Yellow-bellied sapsucker — Sphyrapicus varius</title>
<desc>Wings flap at the shoulder with a gentle ambient beat; red cap stays static.</desc>
<g transform="translate(100, 100)">
<!-- Left wing: 2 ellipses only (no spots in this critter) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="-8 -30 6; 12 -30 6; -8 -30 6" dur="0.50s" repeatCount="indefinite"/>
  <ellipse cx="-30" cy="6" rx="24" ry="11" fill="#3a3a3a" opacity="0.85" transform="rotate(-25 -30 6)" stroke="#1a1a1a" stroke-width="0.5"/>
  <ellipse cx="-30" cy="8" rx="21" ry="8" fill="#1a1a1a" opacity="0.6" transform="rotate(-18 -30 8)"/>
</g>
<!-- Right wing: 2 ellipses only -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="8 30 6; -12 30 6; 8 30 6" dur="0.50s" repeatCount="indefinite"/>
  <ellipse cx="30" cy="6" rx="24" ry="11" fill="#3a3a3a" opacity="0.85" transform="rotate(25 30 6)" stroke="#1a1a1a" stroke-width="0.5"/>
  <ellipse cx="30" cy="8" rx="21" ry="8" fill="#1a1a1a" opacity="0.6" transform="rotate(18 30 8)"/>
</g>
<!-- Body -->
<ellipse cx="0" cy="24" rx="22" ry="25" fill="#fef3c7"/>
<line x1="-15" y1="10" x2="15" y2="10" stroke="#0d0d0d" stroke-width="3" stroke-linecap="round"/>
<line x1="-17" y1="18" x2="17" y2="18" stroke="#0d0d0d" stroke-width="3" stroke-linecap="round"/>
<line x1="-15" y1="26" x2="15" y2="26" stroke="#0d0d0d" stroke-width="2" stroke-linecap="round"/>
<ellipse cx="0" cy="36" rx="14" ry="6" fill="#fde047"/>
<line x1="-5" y1="46" x2="-5" y2="54" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="5" y1="46" x2="5" y2="54" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
<!-- Head -->
<circle cx="0" cy="-14" r="24" fill="#fef3c7"/>
<path d="M -24 -16 Q -24 -38 0 -42 Q 24 -38 24 -16 L 24 -8 Q 0 -30 -24 -8 Z" fill="#0d0d0d"/>
<!-- Red cap (static) -->
<path d="M -16 -36 L -8 -40 L 0 -36 L 8 -40 L 16 -36 L 8 -28 L -8 -28 Z" fill="#dc2626"/>
<!-- Eyes -->
<circle cx="-8" cy="-14" r="5" fill="#ffffff"/>
<circle cx="8" cy="-14" r="5" fill="#ffffff"/>
<circle cx="-8" cy="-13" r="3.6" fill="#ec4899"/>
<circle cx="8" cy="-13" r="3.6" fill="#ec4899"/>
<circle cx="-8" cy="-12" r="2.1" fill="#0d0d0d"/>
<circle cx="8" cy="-12" r="2.1" fill="#0d0d0d"/>
<circle cx="-7" cy="-15" r="1.3" fill="#ffffff"/>
<circle cx="10" cy="-15" r="1.3" fill="#ffffff"/>
<!-- Beak -->
<g transform="rotate(5 0 0)">
<path d="M -2 -5 L 14 -4 Q 18 0 14 4 L -2 5 Z" fill="#1a1a1a"/>
<line x1="-2" y1="0" x2="16" y2="0" stroke="#3a3a3a" stroke-width="0.5"/>
<path d="M 13 -2 L 18 0 L 13 2 Z" fill="#0d0d0d"/>
</g>
</g>
</svg>
