<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Cedar waxwing — Bombycilla cedrorum</title>
<desc>Wings flap gently at the shoulder in a slow ambient loop.</desc>
<g transform="translate(100, 100)">
<animateTransform attributeName="transform" type="translate" additive="sum"
   values="0 0; 0 -2; 0 0" dur="3.1s" repeatCount="indefinite"/>
<!-- left wing (includes wax-tip accents) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
     values="-6 -32 6; 14 -32 6; -6 -32 6" dur="0.50s" repeatCount="indefinite"/>
  <ellipse cx="-32" cy="6" rx="26" ry="11" fill="#e8f0f5" opacity="0.6" transform="rotate(-25 -32 6)" stroke="#9aa5ab" stroke-width="0.5"/>
  <ellipse cx="-32" cy="8" rx="23" ry="8" fill="#8a7060" opacity="0.4" transform="rotate(-18 -32 8)"/>
  <path d="M -38 10 L -34 10 L -34 14 Z" fill="#dc2626"/>
  <path d="M -36 16 L -32 16 L -32 20 Z" fill="#dc2626"/>
</g>
<!-- right wing (includes wax-tip accents) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
     values="6 32 6; -14 32 6; 6 32 6" dur="0.50s" repeatCount="indefinite"/>
  <ellipse cx="32" cy="6" rx="26" ry="11" fill="#e8f0f5" opacity="0.6" transform="rotate(25 32 6)" stroke="#9aa5ab" stroke-width="0.5"/>
  <ellipse cx="32" cy="8" rx="23" ry="8" fill="#8a7060" opacity="0.4" transform="rotate(18 32 8)"/>
  <path d="M 38 10 L 34 10 L 34 14 Z" fill="#dc2626"/>
  <path d="M 36 16 L 32 16 L 32 20 Z" fill="#dc2626"/>
</g>
<ellipse cx="0" cy="24" rx="22" ry="25" fill="#d4a878"/>
<ellipse cx="0" cy="14" rx="22" ry="14" fill="#a88758"/>
<path d="M -22 38 L 22 38" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
<line x1="-5" y1="46" x2="-5" y2="54" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="5" y1="46" x2="5" y2="54" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="0" cy="-14" r="24" fill="#a88758"/>
<path d="M -8 -34 L 0 -42 L 8 -34 Z" fill="#a88758"/>
<ellipse cx="0" cy="-10" rx="22" ry="6" fill="#0d0d0d"/>
<circle cx="-9" cy="-12" r="5" fill="#ffffff"/>
<circle cx="9" cy="-12" r="5" fill="#ffffff"/>
<circle cx="-9" cy="-11" r="3.6" fill="#fb923c"/>
<circle cx="9" cy="-11" r="3.6" fill="#fb923c"/>
<circle cx="-9" cy="-10" r="2.1" fill="#0d0d0d"/>
<circle cx="9" cy="-10" r="2.1" fill="#0d0d0d"/>
<circle cx="-7" cy="-13" r="1.3" fill="#ffffff"/>
<circle cx="11" cy="-13" r="1.3" fill="#ffffff"/>
<path d="M -3 -3 L 5 -2 Q 7 0 5 2 L -3 3 Z" fill="#2a2a2a"/>
</g>
</svg>
