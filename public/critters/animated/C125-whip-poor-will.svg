<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Whip-poor-will — Antrostomus vociferus</title>
<desc>Gentle body/head bob with slow additive translate on the positioning group; slow blink.</desc>
<g transform="translate(100, 100)">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0 0; 0 -5; 0 0" dur="3.3s" repeatCount="indefinite"/>
  <!-- wings left -->
  <ellipse cx="-32" cy="8" rx="28" ry="12" fill="#7a6850" opacity="0.85" transform="rotate(-25 -32 8)" stroke="#5a4828" stroke-width="0.5"/>
  <ellipse cx="-32" cy="10" rx="24" ry="9" fill="#5a4828" opacity="0.55" transform="rotate(-18 -32 10)"/>
  <!-- wings right -->
  <ellipse cx="32" cy="8" rx="28" ry="12" fill="#7a6850" opacity="0.85" transform="rotate(25 32 8)" stroke="#5a4828" stroke-width="0.5"/>
  <ellipse cx="32" cy="10" rx="24" ry="9" fill="#5a4828" opacity="0.55" transform="rotate(18 32 10)"/>
  <!-- body -->
  <ellipse cx="0" cy="24" rx="26" ry="22" fill="#a89878"/>
  <ellipse cx="0" cy="24" rx="22" ry="14" fill="#7a6850" opacity="0.6"/>
  <path d="M -16 18 L 16 18 M -18 26 L 18 26 M -16 34 L 16 34" stroke="#5a4828" stroke-width="1.4" stroke-linecap="round"/>
  <!-- feet -->
  <line x1="-5" y1="44" x2="-5" y2="52" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="5" y1="44" x2="5" y2="52" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="0" cy="-12" r="22" fill="#a89878"/>
  <!-- white throat stripe -->
  <path d="M -18 -6 L 18 -6" stroke="#fef3c7" stroke-width="2" stroke-linecap="round"/>
  <!-- throat dark -->
  <ellipse cx="0" cy="-2" rx="22" ry="6" fill="#1a1a1a"/>
  <!-- eyes -->
  <circle cx="-8" cy="-12" r="5.5" fill="#ffffff"/>
  <circle cx="8" cy="-12" r="5.5" fill="#ffffff"/>
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="4.5s" repeatCount="indefinite"/>
    <circle cx="-8" cy="-11" r="4" fill="#d1d5db"/>
    <circle cx="-8" cy="-10" r="2.3" fill="#0d0d0d"/>
    <circle cx="-7" cy="-13" r="1.4" fill="#ffffff"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="4.5s" repeatCount="indefinite"/>
    <circle cx="8" cy="-11" r="4" fill="#d1d5db"/>
    <circle cx="8" cy="-10" r="2.3" fill="#0d0d0d"/>
    <circle cx="10" cy="-13" r="1.4" fill="#ffffff"/>
  </g>
  <!-- gape -->
  <path d="M -10 2 Q 0 12 10 2" stroke="#0d0d0d" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</g>
</svg>
