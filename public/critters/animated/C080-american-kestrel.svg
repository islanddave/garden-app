<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>American kestrel — Falco sparverius</title>
<desc>Fierce slow blink (iris+pupil opacity) with a small head turn on a 4s loop.</desc>
<g transform="translate(100, 100)">
<!-- wings — static -->
<ellipse cx="-32" cy="6" rx="26" ry="11" fill="#7a90c0" opacity="0.85" transform="rotate(-25 -32 6)" stroke="#3a4878" stroke-width="0.5"/>
<ellipse cx="-32" cy="8" rx="23" ry="8" fill="#5a7eba" opacity="0.5" transform="rotate(-18 -32 8)"/>
<ellipse cx="32" cy="6" rx="26" ry="11" fill="#7a90c0" opacity="0.85" transform="rotate(25 32 6)" stroke="#3a4878" stroke-width="0.5"/>
<ellipse cx="32" cy="8" rx="23" ry="8" fill="#5a7eba" opacity="0.5" transform="rotate(18 32 8)"/>
<!-- body -->
<ellipse cx="0" cy="24" rx="22" ry="25" fill="#f4ead6"/>
<ellipse cx="0" cy="14" rx="22" ry="14" fill="#a8552a"/>
<line x1="-12" y1="20" x2="12" y2="20" stroke="#0d0d0d" stroke-width="0.8"/>
<line x1="-12" y1="26" x2="12" y2="26" stroke="#0d0d0d" stroke-width="0.8"/>
<!-- feet -->
<line x1="-5" y1="46" x2="-5" y2="54" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="5" y1="46" x2="5" y2="54" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
<!-- head group — small head turn -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 0 -14; 5 0 -14; 0 0 -14"
    keyTimes="0; 0.5; 1"
    dur="4s" repeatCount="indefinite"/>
  <circle cx="0" cy="-14" r="22" fill="#a8552a"/>
  <ellipse cx="0" cy="-22" rx="20" ry="8" fill="#5a7eba"/>
  <!-- moustache marks -->
  <path d="M -16 -8 L -10 -2" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 16 -8 L 10 -2" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- sclera -->
  <circle cx="-7" cy="-12" r="5" fill="#ffffff"/>
  <circle cx="7" cy="-12" r="5" fill="#ffffff"/>
  <!-- left iris+pupil+catchlight — fierce quick blink -->
  <g>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.87;0.92;1" dur="4s" repeatCount="indefinite"/>
    <circle cx="-7" cy="-11" r="3.6" fill="#dc2626"/>
    <circle cx="-7" cy="-10" r="2.1" fill="#0d0d0d"/>
    <circle cx="-6" cy="-13" r="1.3" fill="#ffffff"/>
  </g>
  <!-- right iris+pupil+catchlight -->
  <g>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.87;0.92;1" dur="4s" repeatCount="indefinite"/>
    <circle cx="7" cy="-11" r="3.6" fill="#dc2626"/>
    <circle cx="7" cy="-10" r="2.1" fill="#0d0d0d"/>
    <circle cx="9" cy="-13" r="1.3" fill="#ffffff"/>
  </g>
  <!-- eyelid overlays -->
  <g>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.87;0.92;1" dur="4s" repeatCount="indefinite"/>
    <ellipse cx="-7" cy="-12" rx="5" ry="2.5" fill="#a8552a"/>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.87;0.92;1" dur="4s" repeatCount="indefinite"/>
    <ellipse cx="7" cy="-12" rx="5" ry="2.5" fill="#a8552a"/>
  </g>
  <!-- beak -->
  <path d="M -2 -4 L 6 -3 Q 8 0 6 3 L -2 4 Z" fill="#fbbf24"/>
  <path d="M 4 -2 L 8 0 L 4 2 Z" fill="#0d0d0d"/>
</g>
</g>
</svg>
