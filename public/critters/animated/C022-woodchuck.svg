<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Woodchuck — Marmota monax</title>
<desc>Gentle body breathe with subtle ear twitches on this stocky groundhog.</desc>
<g transform="translate(100, 100)">
<!-- body breathe: scale about body center (0,24) -->
<g transform="translate(0,24)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1.025 1.025;1 1" keyTimes="0;0.5;1"
    dur="3.9s" repeatCount="indefinite"/>
  <g transform="translate(0,-24)">
    <ellipse cx="0" cy="24" rx="26" ry="23" fill="#8a5a3a"/>
    <ellipse cx="0" cy="30" rx="14" ry="12" fill="#5a3a1a" opacity="0.4"/>
    <ellipse cx="-18" cy="42" rx="6" ry="4" fill="#6a4020"/>
    <ellipse cx="18" cy="42" rx="6" ry="4" fill="#6a4020"/>
    <ellipse cx="-10" cy="48" rx="5" ry="3" fill="#5a3818"/>
    <ellipse cx="10" cy="48" rx="5" ry="3" fill="#5a3818"/>
  </g>
</g>
<!-- head -->
<circle cx="0" cy="-12" r="22" fill="#8a5a3a"/>
<!-- left ear twitch — pivot at ear base (-12,-20) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 -12 -20;0 -12 -20;-7 -12 -20;3 -12 -20;0 -12 -20"
    keyTimes="0;0.81;0.87;0.94;1"
    dur="4.5s" repeatCount="indefinite"/>
  <ellipse cx="-12" cy="-26" rx="5" ry="4" fill="#8a5a3a"/>
  <ellipse cx="-12" cy="-26" rx="2.5" ry="2" fill="#f4a880"/>
</g>
<!-- right ear twitch — pivot at ear base (12,-20), offset phase -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 12 -20;0 12 -20;7 12 -20;-3 12 -20;0 12 -20"
    keyTimes="0;0.42;0.48;0.55;1"
    dur="5.5s" repeatCount="indefinite"/>
  <ellipse cx="12" cy="-26" rx="5" ry="4" fill="#8a5a3a"/>
  <ellipse cx="12" cy="-26" rx="2.5" ry="2" fill="#f4a880"/>
</g>
<!-- eyes -->
<circle cx="-8" cy="-12" r="6" fill="#ffffff"/>
<circle cx="8" cy="-12" r="6" fill="#ffffff"/>
<circle cx="-8" cy="-11" r="4.5" fill="#92400e"/>
<circle cx="8" cy="-11" r="4.5" fill="#92400e"/>
<circle cx="-8" cy="-10" r="2.5" fill="#0d0d0d"/>
<circle cx="8" cy="-10" r="2.5" fill="#0d0d0d"/>
<circle cx="-7" cy="-13" r="1.5" fill="#ffffff"/>
<circle cx="9" cy="-13" r="1.5" fill="#ffffff"/>
<ellipse cx="0" cy="0" rx="3" ry="2" fill="#1a1a1a"/>
<ellipse cx="-4" cy="4" rx="3" ry="2" fill="#dca888" opacity="0.6"/>
<ellipse cx="4" cy="4" rx="3" ry="2" fill="#dca888" opacity="0.6"/>
<path d="M -2 6 Q 0 7 -1 9 M 1 9 Q 0 7 2 6" stroke="#fcd34d" stroke-width="0.8" fill="none"/>
<path d="M -4 10 Q 0 13 4 10" stroke="#1a1a1a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
</g>
</svg>
