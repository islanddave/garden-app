<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Great Auk — Pinguinus impennis (Legacy)</title>
<desc>Gentle body/head bob with slow additive translate on the positioning group; slow blink.</desc>
<g transform="translate(100, 100)">
  <animateTransform attributeName="transform" type="translate" additive="sum"
    values="0 0; 0 -4; 0 0" dur="3.1s" repeatCount="indefinite"/>
  <!-- flipper wings -->
  <ellipse cx="-38" cy="10" rx="14" ry="22" fill="#1a1a1a" opacity="0.6"/>
  <ellipse cx="38" cy="10" rx="14" ry="22" fill="#1a1a1a" opacity="0.6"/>
  <!-- white belly -->
  <ellipse cx="0" cy="25" rx="36" ry="42" fill="#fafafa"/>
  <!-- dark back -->
  <path d="M -36,-5 Q -36,30 -34,55 Q 0,40 34,55 Q 36,30 36,-5 Z" fill="#1a1a1a"/>
  <!-- head -->
  <circle cx="0" cy="-15" r="36" fill="#1a1a1a"/>
  <!-- white facial patches -->
  <ellipse cx="-12" cy="-15" rx="9" ry="11" fill="#fff"/>
  <ellipse cx="12" cy="-15" rx="9" ry="11" fill="#fff"/>
  <circle cx="-12" cy="-12" r="9" fill="#fff"/>
  <circle cx="12" cy="-12" r="9" fill="#fff"/>
  <!-- eyes -->
  <circle cx="-11" cy="-11" r="5" fill="#2a4a6a"/>
  <circle cx="13" cy="-11" r="5" fill="#2a4a6a"/>
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="4.6s" repeatCount="indefinite"/>
    <circle cx="-10" cy="-12" r="2.5" fill="#000"/>
    <circle cx="-8" cy="-14" r="1.2" fill="#fff"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="4.6s" repeatCount="indefinite"/>
    <circle cx="14" cy="-12" r="2.5" fill="#000"/>
    <circle cx="16" cy="-14" r="1.2" fill="#fff"/>
  </g>
  <!-- bill -->
  <path d="M -8,0 Q 0,12 8,0 Q 8,-3 0,-2 Q -8,-3 -8,0 Z" fill="#1a1a1a" stroke="#666" stroke-width="0.5"/>
  <path d="M -6,-1 Q 0,3 6,-1" stroke="#fff" stroke-width="0.8" fill="none" opacity="0.6"/>
</g>
</svg>
