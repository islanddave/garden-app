<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Grasshopper sparrow — Ammodramus savannarum</title>
<desc>Wings flap gently at the shoulder in a slow ambient loop.</desc>
<g transform="translate(100, 100)">
<animateTransform attributeName="transform" type="translate" additive="sum"
   values="0 0; 0 -2; 0 0" dur="3.2s" repeatCount="indefinite"/>
<!-- left wing (sparrow uses rx=22/19, pivot at -30 6) -->
<g>
  <animateTransform attributeName="transform" type="rotate"
     values="-6 -30 6; 14 -30 6; -6 -30 6" dur="0.50s" repeatCount="indefinite"/>
  <ellipse cx="-30" cy="6" rx="22" ry="10" fill="#e8f0f5" opacity="0.6" transform="rotate(-25 -30 6)" stroke="#9aa5ab" stroke-width="0.5"/>
  <ellipse cx="-30" cy="8" rx="19" ry="7" fill="#a87238" opacity="0.4" transform="rotate(-18 -30 8)"/>
</g>
<!-- right wing -->
<g>
  <animateTransform attributeName="transform" type="rotate"
     values="6 30 6; -14 30 6; 6 30 6" dur="0.50s" repeatCount="indefinite"/>
  <ellipse cx="30" cy="6" rx="22" ry="10" fill="#e8f0f5" opacity="0.6" transform="rotate(25 30 6)" stroke="#9aa5ab" stroke-width="0.5"/>
  <ellipse cx="30" cy="8" rx="19" ry="7" fill="#a87238" opacity="0.4" transform="rotate(18 30 8)"/>
</g>
<ellipse cx="0" cy="22" rx="18" ry="22" fill="#dcc4a0"/>
<line x1="-12" y1="14" x2="-8" y2="22" stroke="#5a4020" stroke-width="1.2"/>
<line x1="-4" y1="18" x2="0" y2="26" stroke="#5a4020" stroke-width="1.2"/>
<line x1="4" y1="14" x2="8" y2="22" stroke="#5a4020" stroke-width="1.2"/>
<line x1="10" y1="20" x2="14" y2="28" stroke="#5a4020" stroke-width="1.2"/>
<line x1="-5" y1="42" x2="-5" y2="50" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
<line x1="5" y1="42" x2="5" y2="50" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="0" cy="-14" r="18" fill="#dcc4a0"/>
<!-- crown stripe — static -->
<path d="M -14 -22 L 14 -22" stroke="#a87238" stroke-width="2" stroke-linecap="round"/>
<circle cx="-7" cy="-14" r="5" fill="#ffffff"/>
<circle cx="7" cy="-14" r="5" fill="#ffffff"/>
<circle cx="-7" cy="-13" r="3.6" fill="#c4b5fd"/>
<circle cx="7" cy="-13" r="3.6" fill="#c4b5fd"/>
<circle cx="-7" cy="-12" r="2" fill="#0d0d0d"/>
<circle cx="7" cy="-12" r="2" fill="#0d0d0d"/>
<circle cx="-6" cy="-15" r="1.3" fill="#ffffff"/>
<circle cx="8" cy="-15" r="1.3" fill="#ffffff"/>
<path d="M -2 -3 L 4 -2 Q 5 0 4 2 L -2 3 Z" fill="#3a3a3a"/>
<path d="M -3 8 Q 0 11 3 8" stroke="#3a3a3a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
</g>
</svg>
