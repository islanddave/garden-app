<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Eastern carpenter bee — Xylocopa virginica</title>
<desc>Eastern carpenter bee hovers with a gentle bob while wings blur in rapid buzz.</desc>
<g transform="translate(100, 100)">
  <animateTransform attributeName="transform" type="translate" additive="sum" dur="2.1s" repeatCount="indefinite" values="0 0; 0 -5; 0 0" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" additive="sum" dur="0.12s" repeatCount="indefinite" values="-12 -30 1; 8 -30 1; -12 -30 1"/>
    <ellipse cx="-30" cy="0" rx="22" ry="13" fill="#e8f0f5" opacity="0.55" transform="rotate(-25 -30 0)" stroke="#9aa5ab" stroke-width="0.5"/>
    <ellipse cx="-30" cy="2" rx="19" ry="9" fill="#9aa5ab" opacity="0.4" transform="rotate(-18 -30 2)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" additive="sum" dur="0.12s" repeatCount="indefinite" values="12 30 1; -8 30 1; 12 30 1"/>
    <ellipse cx="30" cy="0" rx="22" ry="13" fill="#e8f0f5" opacity="0.55" transform="rotate(25 30 0)" stroke="#9aa5ab" stroke-width="0.5"/>
    <ellipse cx="30" cy="2" rx="19" ry="9" fill="#9aa5ab" opacity="0.4" transform="rotate(18 30 2)"/>
  </g>
  <ellipse cx="0" cy="20" rx="25" ry="24" fill="#1a1a1a"/>
  <ellipse cx="-6" cy="12" rx="14" ry="5" fill="#3a4a6a" opacity="0.35"/>
  <ellipse cx="-3" cy="22" rx="11" ry="3" fill="#5a3a6a" opacity="0.25"/>
  <circle cx="0" cy="-14" r="20" fill="#0d0d0d"/>
  <ellipse cx="-5" cy="-22" rx="10" ry="3" fill="#4a5b9a" opacity="0.4"/>
  <path d="M -8 -30 Q -10 -38 -12 -44" stroke="#0d0d0d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 8 -30 Q 10 -38 12 -44" stroke="#0d0d0d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="-12" cy="-44" r="1.8" fill="#0d0d0d"/>
  <circle cx="12" cy="-44" r="1.8" fill="#0d0d0d"/>
  <circle cx="-7" cy="-14" r="6" fill="#ffffff"/>
  <circle cx="7" cy="-14" r="6" fill="#ffffff"/>
  <circle cx="-7" cy="-13" r="4.5" fill="#facc15"/>
  <circle cx="7" cy="-13" r="4.5" fill="#facc15"/>
  <circle cx="-7" cy="-12" r="2.5" fill="#0d0d0d"/>
  <circle cx="7" cy="-12" r="2.5" fill="#0d0d0d"/>
  <circle cx="-5" cy="-15" r="1.4" fill="#ffffff"/>
  <circle cx="9" cy="-15" r="1.4" fill="#ffffff"/>
  <path d="M -4 -3 Q 0 -1 4 -3" stroke="#7a7a3a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</g>
</svg>
