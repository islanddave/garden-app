<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Merlin — Falco columbarius</title>
<desc>Fierce slow blink and a small head turn on a 4s loop.</desc>
<g transform="translate(100, 100)">
<!-- wings -->
<ellipse cx="-32" cy="6" rx="28" ry="12" fill="#5a7090" opacity="0.85" transform="rotate(-25 -32 6)" stroke="#3a4868" stroke-width="0.5"/>
<ellipse cx="-32" cy="8" rx="24" ry="9" fill="#3a4868" opacity="0.6" transform="rotate(-18 -32 8)"/>
<ellipse cx="32" cy="6" rx="28" ry="12" fill="#5a7090" opacity="0.85" transform="rotate(25 32 6)" stroke="#3a4868" stroke-width="0.5"/>
<ellipse cx="32" cy="8" rx="24" ry="9" fill="#3a4868" opacity="0.6" transform="rotate(18 32 8)"/>
<!-- body -->
<ellipse cx="0" cy="24" rx="22" ry="25" fill="#fce7d4"/>
<path d="M -16 14 L 16 14 M -16 22 L 16 22 M -14 30 L 14 30" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
<!-- feet -->
<line x1="-5" y1="46" x2="-5" y2="54" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="5" y1="46" x2="5" y2="54" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
<!-- head group — head turn -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 0 -14; 6 0 -14; 0 0 -14"
    keyTimes="0; 0.5; 1"
    dur="4s" repeatCount="indefinite"/>
  <circle cx="0" cy="-14" r="22" fill="#3a4868"/>
  <!-- sclera -->
  <circle cx="-9" cy="-14" r="6" fill="#ffffff"/>
  <circle cx="9" cy="-14" r="6" fill="#ffffff"/>
  <!-- left iris+pupil+catchlight — fierce blink -->
  <g>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.87;0.92;1" dur="4s" repeatCount="indefinite"/>
    <circle cx="-9" cy="-13" r="4.5" fill="#ca8a04"/>
    <circle cx="-9" cy="-12" r="2.5" fill="#0d0d0d"/>
    <circle cx="-7" cy="-15" r="1.6" fill="#ffffff"/>
  </g>
  <!-- right iris+pupil+catchlight -->
  <g>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.87;0.92;1" dur="4s" repeatCount="indefinite"/>
    <circle cx="9" cy="-13" r="4.5" fill="#ca8a04"/>
    <circle cx="9" cy="-12" r="2.5" fill="#0d0d0d"/>
    <circle cx="11" cy="-15" r="1.6" fill="#ffffff"/>
  </g>
  <!-- eyelid overlays -->
  <g>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.87;0.92;1" dur="4s" repeatCount="indefinite"/>
    <ellipse cx="-9" cy="-14" rx="6" ry="3" fill="#3a4868"/>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.87;0.92;1" dur="4s" repeatCount="indefinite"/>
    <ellipse cx="9" cy="-14" rx="6" ry="3" fill="#3a4868"/>
  </g>
  <!-- beak -->
  <path d="M -2 -4 L 6 -3 Q 9 0 6 3 L -2 4 Z" fill="#fbbf24"/>
  <path d="M 4 -2 L 9 0 L 4 2 Z" fill="#0d0d0d"/>
</g>
</g>
</svg>
