<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>American green frog — Lithobates clamitans</title>
<desc>Body pulses with a gentle throat-puff breathe; large amber eyes blink slowly.</desc>
<g transform="translate(100, 100)">
<!-- body breathe — animate ry of body ellipse directly -->
<ellipse cx="0" cy="20" rx="30" ry="22" fill="#22c55e">
  <animate attributeName="ry" values="22;23.5;22" keyTimes="0;0.5;1" dur="1.6s" repeatCount="indefinite"/>
</ellipse>
<path d="M 0 -2 Q 0 20 0 38" stroke="#fde047" stroke-width="3" fill="none" stroke-linecap="round"/>
<ellipse cx="-22" cy="36" rx="7" ry="4" fill="#16a34a" transform="rotate(-20 -22 36)"/>
<ellipse cx="22" cy="36" rx="7" ry="4" fill="#16a34a" transform="rotate(20 22 36)"/>
<line x1="-12" y1="42" x2="-14" y2="48" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
<line x1="12" y1="42" x2="14" y2="48" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
<!-- left eye surround -->
<ellipse cx="-12" cy="-8" rx="11" ry="11" fill="#22c55e"/>
<!-- right eye surround -->
<ellipse cx="12" cy="-8" rx="11" ry="11" fill="#22c55e"/>
<!-- left sclera -->
<circle cx="-12" cy="-8" r="8" fill="#ffffff"/>
<!-- right sclera -->
<circle cx="12" cy="-8" r="8" fill="#ffffff"/>
<!-- left iris+pupil+catchlight blink -->
<g transform="translate(-12,-8)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.88;0.93;1" dur="5.2s" repeatCount="indefinite"/>
  <circle cx="0" cy="1" r="6" fill="#f59e0b"/>
  <ellipse cx="0" cy="1" rx="2" ry="5" fill="#0d0d0d"/>
  <circle cx="2" cy="-2" r="1.8" fill="#ffffff"/>
</g>
<!-- right iris+pupil+catchlight blink -->
<g transform="translate(12,-8)">
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.88;0.93;1" dur="5.2s" repeatCount="indefinite"/>
  <circle cx="0" cy="1" r="6" fill="#f59e0b"/>
  <ellipse cx="0" cy="1" rx="2" ry="5" fill="#0d0d0d"/>
  <circle cx="2" cy="-2" r="1.8" fill="#ffffff"/>
</g>
<path d="M -18 6 Q 0 16 18 6" stroke="#0d0d0d" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<circle cx="-4" cy="2" r="0.8" fill="#0d0d0d"/>
<circle cx="4" cy="2" r="0.8" fill="#0d0d0d"/>
</g>
</svg>
