  <ellipse cx="20" cy="38" rx="36" ry="22" fill="#1a1a1a"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 -42 -34;0 -42 -34;-8 -42 -34;3 -42 -34;0 -42 -34" keyTimes="0;0.8;0.86;0.92;1" dur="4.3s" repeatCount="indefinite"/>
    <path d="M -46,-32 L -42,-50 L -34,-38 Z" fill="#1a1a1a"/>
    <path d="M -42,-50 L -38,-55 L -36,-48 Z" fill="#fff"/>
  </g>
  <path d="M -2,-32 L 2,-50 L -10,-38 Z" fill="#1a1a1a"/>
  <path d="M 2,-50 L 6,-55 L -2,-48 Z" fill="#fff"/>
  <circle cx="-22" cy="-12" r="36" fill="#2a2a2a"/>
  <path d="M -38,8 Q -34,18 -28,8" fill="#3a3a3a"/>
  <path d="M -16,8 Q -10,18 -6,8" fill="#3a3a3a"/>
  <ellipse cx="-22" cy="6" rx="18" ry="12" fill="#3a3a3a"/>
  <ellipse cx="-33" cy="-14" rx="9" ry="11" fill="#fff"/>
  <ellipse cx="-11" cy="-16" rx="9" ry="11" fill="#fff"/>
  <g>
    <animate attributeName="opacity" values="1;1;0.05;1" keyTimes="0;0.88;0.93;1" dur="5.8s" repeatCount="indefinite"/>
    <ellipse cx="-33" cy="-12" rx="6" ry="8" fill="#f5a623"/>
    <path d="M -34,-17 L -34,-7 L -32,-7 L -32,-17 Z" fill="#000"/>
    <circle cx="-31" cy="-15" r="1.2" fill="#fff"/>
  </g>
  <ellipse cx="-11" cy="-14" rx="6" ry="8" fill="#f5a623"/>
  <path d="M -12,-20 L -12,-10 L -10,-10 L -10,-20 Z" fill="#000"/>
  <circle cx="-9" cy="-17" r="1.2" fill="#fff"/>
  <path d="M -25,4 L -22,9 L -19,4 Z" fill="#000"/>
  <path d="M -28,12 Q -22,17 -16,12" stroke="#000" stroke-width="1.5" fill="none"/>
