<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Melanistic Bobcat — Lynx rufus (Cryptid)</title>
<desc>The bobcat breathes slowly, its left ear (with white tuft) twitches, and one amber eye blinks.</desc>
