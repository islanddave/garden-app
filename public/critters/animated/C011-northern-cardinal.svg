<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Northern cardinal — Cardinalis cardinalis</title>
<desc>Wings flap slowly at the shoulder with a gentle ambient beat; crest stays static.</desc>
<g transform="translate(-114, -150)">
<!-- Left wing -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="-6 184 252; 14 184 252; -6 184 252" dur="0.48s" repeatCount="indefinite"/>
  <path d="M 184 252 Q 164 240 154 252 Q 156 270 176 264 Z" fill="#9b1c1c"/>
</g>
<!-- Right wing -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="6 244 252; -14 244 252; 6 244 252" dur="0.48s" repeatCount="indefinite"/>
  <path d="M 244 252 Q 264 240 274 252 Q 272 270 252 264 Z" fill="#9b1c1c"/>
</g>
<!-- Body -->
<ellipse cx="214" cy="268" rx="20" ry="22" fill="#c62828"/>
<line x1="208" y1="288" x2="206" y2="294" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="220" y1="288" x2="222" y2="294" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
<!-- Head -->
<circle cx="214" cy="244" r="22" fill="#c62828"/>
<!-- Crest (static) -->
<path d="M 208 222 L 214 206 L 220 222 Z" fill="#c62828"/>
<!-- Face mask -->
<ellipse cx="214" cy="256" rx="14" ry="6" fill="#1a1a1a"/>
<!-- Eyes -->
<circle cx="206" cy="244" r="5.5" fill="#ffffff"/>
<circle cx="222" cy="244" r="5.5" fill="#ffffff"/>
<circle cx="206" cy="246" r="3" fill="#1a1a1a"/>
<circle cx="222" cy="246" r="3" fill="#1a1a1a"/>
<circle cx="207" cy="244" r="1.2" fill="#ffffff"/>
<circle cx="223" cy="244" r="1.2" fill="#ffffff"/>
<!-- Beak -->
<path d="M 209 256 L 219 256 L 214 262 Z" fill="#ff9800"/>
</g>
</svg>
