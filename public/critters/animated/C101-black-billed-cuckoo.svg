<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Black-billed cuckoo — Coccyzus erythropthalmus</title>
<desc>Wings flap gently at the shoulder; tail stays static.</desc>
<g transform="translate(100, 100)">
<animateTransform attributeName="transform" type="translate" additive="sum"
   values="0 0; 0 -2; 0 0" dur="3.5s" repeatCount="indefinite"/>
<!-- left wing -->
<g>
  <animateTransform attributeName="transform" type="rotate"
     values="-6 -32 6; 14 -32 6; -6 -32 6" dur="0.49s" repeatCount="indefinite"/>
  <ellipse cx="-32" cy="6" rx="26" ry="11" fill="#e8f0f5" opacity="0.6" transform="rotate(-25 -32 6)" stroke="#9aa5ab" stroke-width="0.5"/>
  <ellipse cx="-32" cy="8" rx="23" ry="8" fill="#8a6848" opacity="0.4" transform="rotate(-18 -32 8)"/>
</g>
<!-- right wing -->
<g>
  <animateTransform attributeName="transform" type="rotate"
     values="6 32 6; -14 32 6; 6 32 6" dur="0.49s" repeatCount="indefinite"/>
  <ellipse cx="32" cy="6" rx="26" ry="11" fill="#e8f0f5" opacity="0.6" transform="rotate(25 32 6)" stroke="#9aa5ab" stroke-width="0.5"/>
  <ellipse cx="32" cy="8" rx="23" ry="8" fill="#8a6848" opacity="0.4" transform="rotate(18 32 8)"/>
</g>
<!-- tail — static -->
<path d="M 18 30 L 30 58 L 24 56 L 12 32 Z" fill="#a8826a"/>
<ellipse cx="0" cy="24" rx="22" ry="25" fill="#f4ead6"/>
<ellipse cx="0" cy="14" rx="22" ry="14" fill="#8a6848"/>
<line x1="-5" y1="46" x2="-5" y2="54" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="5" y1="46" x2="5" y2="54" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="0" cy="-14" r="22" fill="#8a6848"/>
<circle cx="-9" cy="-14" r="6" fill="#ffffff"/>
<circle cx="9" cy="-14" r="6" fill="#ffffff"/>
<circle cx="-9" cy="-13" r="4.5" fill="#dc2626"/>
<circle cx="9" cy="-13" r="4.5" fill="#dc2626"/>
<circle cx="-9" cy="-12" r="2.5" fill="#0d0d0d"/>
<circle cx="9" cy="-12" r="2.5" fill="#0d0d0d"/>
<circle cx="-7" cy="-15" r="1.6" fill="#ffffff"/>
<circle cx="11" cy="-15" r="1.6" fill="#ffffff"/>
<path d="M -3 -4 L 7 -3 Q 10 0 7 3 L -3 4 Z" fill="#1a1a1a"/>
<path d="M -4 8 Q 0 11 4 8" stroke="#3a3a3a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</g>
</svg>
