<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Red-bellied woodpecker — Melanerpes carolinus</title>
<desc>Wings flap at the shoulder with a gentle ambient beat; white spot circles stay static.</desc>
<g transform="translate(100, 100)">
<!-- Left wing: 2 ellipses only; spot circles static -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="-8 -32 6; 12 -32 6; -8 -32 6" dur="0.50s" repeatCount="indefinite"/>
  <ellipse cx="-32" cy="6" rx="26" ry="11" fill="#3a3a3a" opacity="0.85" transform="rotate(-25 -32 6)" stroke="#1a1a1a" stroke-width="0.5"/>
  <ellipse cx="-32" cy="8" rx="23" ry="8" fill="#1a1a1a" opacity="0.6" transform="rotate(-18 -32 8)"/>
</g>
<!-- Left spot circles (static) -->
<circle cx="-30" cy="-2" r="1.5" fill="#ffffff"/>
<circle cx="-26" cy="8" r="1.5" fill="#ffffff"/>
<circle cx="-36" cy="6" r="1.5" fill="#ffffff"/>
<circle cx="-30" cy="14" r="1.5" fill="#ffffff"/>
<!-- Right wing: 2 ellipses only; spot circles static -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="8 32 6; -12 32 6; 8 32 6" dur="0.50s" repeatCount="indefinite"/>
  <ellipse cx="32" cy="6" rx="26" ry="11" fill="#3a3a3a" opacity="0.85" transform="rotate(25 32 6)" stroke="#1a1a1a" stroke-width="0.5"/>
  <ellipse cx="32" cy="8" rx="23" ry="8" fill="#1a1a1a" opacity="0.6" transform="rotate(18 32 8)"/>
</g>
<!-- Right spot circles (static) -->
<circle cx="30" cy="-2" r="1.5" fill="#ffffff"/>
<circle cx="26" cy="8" r="1.5" fill="#ffffff"/>
<circle cx="36" cy="6" r="1.5" fill="#ffffff"/>
<circle cx="30" cy="14" r="1.5" fill="#ffffff"/>
<!-- Body -->
<ellipse cx="0" cy="24" rx="23" ry="25" fill="#fafafa"/>
<ellipse cx="0" cy="20" rx="20" ry="14" fill="#d4d8dc"/>
<ellipse cx="0" cy="38" rx="11" ry="5" fill="#f4c0c8" opacity="0.55"/>
<line x1="-5" y1="46" x2="-5" y2="54" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="5" y1="46" x2="5" y2="54" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
<!-- Head -->
<circle cx="0" cy="-14" r="25" fill="#f9f9f9"/>
<path d="M -25 -18 Q -25 -40 0 -44 Q 25 -40 25 -18 L 25 -10 Q 0 -32 -25 -10 Z" fill="#d02020"/>
<!-- Eyes -->
<circle cx="-8" cy="-14" r="5.5" fill="#ffffff"/>
<circle cx="8" cy="-14" r="5.5" fill="#ffffff"/>
<circle cx="-8" cy="-13" r="4" fill="#6ee7b7"/>
<circle cx="8" cy="-13" r="4" fill="#6ee7b7"/>
<circle cx="-8" cy="-13" r="2.3" fill="#0d0d0d"/>
<circle cx="8" cy="-13" r="2.3" fill="#0d0d0d"/>
<circle cx="-8" cy="-16" r="1.6" fill="#ffffff"/>
<circle cx="8" cy="-16" r="1.6" fill="#ffffff"/>
<!-- Beak -->
<g transform="rotate(15 0 0)">
<path d="M -2 -6 L 16 -4 L 24 -2 L 16 -1 L -2 -1 Z" fill="#f97316" stroke="#1a1a1a" stroke-width="1"/>
<path d="M -2 1 L 16 1 L 24 2 L 16 4 L -2 6 Z" fill="#f97316" stroke="#1a1a1a" stroke-width="1"/>
</g>
</g>
</svg>
