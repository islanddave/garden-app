<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Bald eagle — Haliaeetus leucocephalus</title>
<desc>Fierce slow blink and a small deliberate head turn on a 5s loop.</desc>
<g transform="translate(100, 100)">
<!-- wings -->
<ellipse cx="-36" cy="6" rx="30" ry="14" fill="#5a3818" opacity="0.9" transform="rotate(-25 -36 6)" stroke="#3a2010" stroke-width="0.5"/>
<ellipse cx="-36" cy="8" rx="26" ry="11" fill="#3a2010" opacity="0.75" transform="rotate(-18 -36 8)"/>
<ellipse cx="36" cy="6" rx="30" ry="14" fill="#5a3818" opacity="0.9" transform="rotate(25 36 6)" stroke="#3a2010" stroke-width="0.5"/>
<ellipse cx="36" cy="8" rx="26" ry="11" fill="#3a2010" opacity="0.75" transform="rotate(18 36 8)"/>
<!-- body -->
<ellipse cx="0" cy="26" rx="27" ry="28" fill="#5a3818"/>
<ellipse cx="0" cy="46" rx="18" ry="6" fill="#ffffff"/>
<!-- feet -->
<line x1="-7" y1="50" x2="-7" y2="56" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="7" y1="50" x2="7" y2="56" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
<!-- head group — slow deliberate head turn, eagle commands presence -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="0 0 -14; -7 0 -14; 0 0 -14"
    keyTimes="0; 0.5; 1"
    dur="5s" repeatCount="indefinite"/>
  <circle cx="0" cy="-14" r="26" fill="#ffffff"/>
  <!-- sclera -->
  <circle cx="-9" cy="-14" r="6" fill="#ffffff"/>
  <circle cx="9" cy="-14" r="6" fill="#ffffff"/>
  <!-- left iris+pupil+catchlight — fierce blink -->
  <g>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.87;0.92;1" dur="5s" repeatCount="indefinite"/>
    <circle cx="-9" cy="-13" r="4.5" fill="#eab308"/>
    <circle cx="-9" cy="-12" r="2.5" fill="#0d0d0d"/>
    <circle cx="-7" cy="-15" r="1.6" fill="#ffffff"/>
  </g>
  <!-- right iris+pupil+catchlight -->
  <g>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.87;0.92;1" dur="5s" repeatCount="indefinite"/>
    <circle cx="9" cy="-13" r="4.5" fill="#eab308"/>
    <circle cx="9" cy="-12" r="2.5" fill="#0d0d0d"/>
    <circle cx="11" cy="-15" r="1.6" fill="#ffffff"/>
  </g>
  <!-- eyelid overlays — white head, so eyelids match -->
  <g>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.87;0.92;1" dur="5s" repeatCount="indefinite"/>
    <ellipse cx="-9" cy="-14" rx="6" ry="3" fill="#cccccc"/>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.87;0.92;1" dur="5s" repeatCount="indefinite"/>
    <ellipse cx="9" cy="-14" rx="6" ry="3" fill="#cccccc"/>
  </g>
  <!-- beak -->
  <path d="M -3 -4 L 12 -3 L 16 0 L 12 3 L -3 4 Z" fill="#fbbf24" stroke="#0d0d0d" stroke-width="0.5"/>
  <path d="M 10 -2 L 16 0 L 10 2 Z" fill="#3a2010"/>
</g>
</g>
</svg>
