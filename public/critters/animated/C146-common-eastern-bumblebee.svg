<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Common eastern bumblebee — Bombus impatiens</title>
<desc>Common eastern bumblebee hovers with a gentle bob while wings buzz rapidly.</desc>
<g transform="translate(100, 100)">
  <animateTransform attributeName="transform" type="translate" additive="sum" dur="2.3s" repeatCount="indefinite" values="0 0; 0 -5; 0 0" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" additive="sum" dur="0.13s" repeatCount="indefinite" values="-12 -30 1; 8 -30 1; -12 -30 1"/>
    <ellipse cx="-30" cy="0" rx="22" ry="13" fill="#e8f0f5" opacity="0.65" transform="rotate(-25 -30 0)" stroke="#9aa5ab" stroke-width="0.5"/>
    <ellipse cx="-30" cy="2" rx="19" ry="9" fill="#9aa5ab" opacity="0.4" transform="rotate(-18 -30 2)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" additive="sum" dur="0.13s" repeatCount="indefinite" values="12 30 1; -8 30 1; 12 30 1"/>
    <ellipse cx="30" cy="0" rx="22" ry="13" fill="#e8f0f5" opacity="0.65" transform="rotate(25 30 0)" stroke="#9aa5ab" stroke-width="0.5"/>
    <ellipse cx="30" cy="2" rx="19" ry="9" fill="#9aa5ab" opacity="0.4" transform="rotate(18 30 2)"/>
  </g>
  <ellipse cx="0" cy="20" rx="25" ry="24" fill="#fcd34d"/>
  <path d="M -22 10 L 22 10" stroke="#0d0d0d" stroke-width="5" stroke-linecap="round"/>
  <path d="M -22 24 L 22 24" stroke="#0d0d0d" stroke-width="5" stroke-linecap="round"/>
  <path d="M -16 36 L 16 36" stroke="#0d0d0d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="0" cy="-14" r="20" fill="#0d0d0d"/>
  <path d="M -8 -30 Q -10 -38 -12 -44" stroke="#0d0d0d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 8 -30 Q 10 -38 12 -44" stroke="#0d0d0d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="-12" cy="-44" r="1.8" fill="#0d0d0d"/>
  <circle cx="12" cy="-44" r="1.8" fill="#0d0d0d"/>
  <circle cx="-7" cy="-14" r="6" fill="#ffffff"/>
  <circle cx="7" cy="-14" r="6" fill="#ffffff"/>
  <circle cx="-7" cy="-13" r="4.5" fill="#6366f1"/>
  <circle cx="7" cy="-13" r="4.5" fill="#6366f1"/>
  <circle cx="-7" cy="-12" r="2.5" fill="#0d0d0d"/>
  <circle cx="7" cy="-12" r="2.5" fill="#0d0d0d"/>
  <circle cx="-5" cy="-15" r="1.4" fill="#ffffff"/>
  <circle cx="9" cy="-15" r="1.4" fill="#ffffff"/>
  <circle cx="-9" cy="-11" r="0.8" fill="#ffffff"/>
  <circle cx="5" cy="-11" r="0.8" fill="#ffffff"/>
  <path d="M -4 -3 Q 0 0 4 -3" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</g>
</svg>
