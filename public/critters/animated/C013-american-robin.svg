<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>American robin — Turdus migratorius</title>
<desc>Wings flap at the shoulder with a gentle ambient beat, mirrored left and right.</desc>
<g transform="translate(12, -150)">
<!-- Left wing -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="-6 58 252; 18 58 252; -6 58 252" dur="0.45s" repeatCount="indefinite"/>
  <path d="M 58 252 Q 38 240 28 252 Q 30 270 50 264 Z" fill="#6b4423"/>
</g>
<!-- Right wing -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="6 118 252; -18 118 252; 6 118 252" dur="0.45s" repeatCount="indefinite"/>
  <path d="M 118 252 Q 138 240 148 252 Q 146 270 126 264 Z" fill="#6b4423"/>
</g>
<!-- Body -->
<ellipse cx="88" cy="268" rx="20" ry="22" fill="#6b4423"/>
<ellipse cx="88" cy="274" rx="14" ry="13" fill="#e85d04"/>
<line x1="82" y1="288" x2="80" y2="294" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="94" y1="288" x2="96" y2="294" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
<!-- Head -->
<circle cx="88" cy="244" r="22" fill="#6b4423"/>
<!-- Eyes -->
<circle cx="79" cy="242" r="6" fill="#ffffff"/>
<circle cx="97" cy="242" r="6" fill="#ffffff"/>
<circle cx="79" cy="244" r="3.5" fill="#1a1a1a"/>
<circle cx="97" cy="244" r="3.5" fill="#1a1a1a"/>
<circle cx="80" cy="242" r="1.3" fill="#ffffff"/>
<circle cx="98" cy="242" r="1.3" fill="#ffffff"/>
<!-- Beak -->
<path d="M 84 252 L 92 252 L 88 259 Z" fill="#f4c430"/>
</g>
</svg>
