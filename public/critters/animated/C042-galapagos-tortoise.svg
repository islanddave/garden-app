<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Galápagos tortoise — Chelonoidea nigra</title>
<desc>Massive head slowly bobs in and out along the neck axis; eyes blink with ancient patience.</desc>
<g transform="translate(100, 100)">
<!-- shell (static) -->
<ellipse cx="0" cy="10" rx="38" ry="30" fill="#3a2818"/>
<ellipse cx="0" cy="4" rx="32" ry="22" fill="#5a4828"/>
<path d="M -22 -2 L -10 6 L 10 -2 L 20 6" stroke="#3a2818" stroke-width="1" fill="none"/>
<path d="M -22 10 L -10 18 L 10 10 L 20 18" stroke="#3a2818" stroke-width="1" fill="none"/>
<!-- legs (static) -->
<ellipse cx="-26" cy="38" rx="6" ry="4" fill="#3a2818"/>
<ellipse cx="26" cy="38" rx="6" ry="4" fill="#3a2818"/>
<!-- head group — tortoise neck axis: upper-left, ±3 translate -->
<g>
  <animateTransform attributeName="transform" type="translate"
    values="0 0; -2.5 -1.5; 0 0" keyTimes="0;0.5;1"
    dur="3.8s" repeatCount="indefinite"/>
  <ellipse cx="-30" cy="-14" rx="18" ry="12" fill="#5a4028"/>
  <!-- beak -->
  <path d="M -44 -4 L -28 -2 L -28 0 L -44 4 Z" fill="#3a2818"/>
  <!-- left sclera -->
  <circle cx="-36" cy="-14" r="4" fill="#ffffff"/>
  <!-- right sclera -->
  <circle cx="-24" cy="-16" r="4" fill="#ffffff"/>
  <!-- left iris+pupil+catchlight blink — very slow, ancient -->
  <g transform="translate(-36,-14)">
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.90;0.95;1" dur="7.0s" repeatCount="indefinite"/>
    <circle cx="0" cy="1" r="2.8" fill="#10b981"/>
    <circle cx="0" cy="2" r="1.6" fill="#0d0d0d"/>
    <circle cx="1" cy="-1" r="1" fill="#ffffff"/>
  </g>
  <!-- right iris+pupil+catchlight blink -->
  <g transform="translate(-24,-16)">
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.90;0.95;1" dur="7.0s" repeatCount="indefinite"/>
    <circle cx="0" cy="1" r="2.8" fill="#10b981"/>
    <circle cx="0" cy="2" r="1.6" fill="#0d0d0d"/>
    <circle cx="1" cy="-1" r="1" fill="#ffffff"/>
  </g>
</g>
</g>
</svg>
