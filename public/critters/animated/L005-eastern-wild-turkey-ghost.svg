<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Eastern Wild Turkey Ghost — Meleagris gallopavo silvestris (Legacy)</title>
<desc>Gentle body/head bob with slow additive translate, plus a faint opacity shimmer on the whole figure for a spectral feel.</desc>
<!-- Spectral shimmer wrapper — outer opacity oscillation -->
<g>
  <animate attributeName="opacity" values="1;0.85;1;0.9;1" keyTimes="0;0.25;0.5;0.75;1"
    dur="4.0s" repeatCount="indefinite"/>
  <g transform="translate(100, 100)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0 0; 0 -4; 0 0" dur="3.2s" repeatCount="indefinite"/>
    <!-- tail fan feathers -->
    <path d="M -45,-15 Q -60,-50 -38,-55 Q -55,-25 -30,-10 Z" fill="#5a3a1f" opacity="0.5"/>
    <path d="M 45,-15 Q 60,-50 38,-55 Q 55,-25 30,-10 Z" fill="#5a3a1f" opacity="0.5"/>
    <path d="M 0,-55 Q -20,-65 -38,-55" fill="#7a4a25" opacity="0.5"/>
    <path d="M 0,-55 Q 20,-65 38,-55" fill="#7a4a25" opacity="0.5"/>
    <!-- body -->
    <ellipse cx="0" cy="25" rx="36" ry="38" fill="#3a2818"/>
    <!-- head -->
    <circle cx="0" cy="-10" r="30" fill="#c4a070"/>
    <!-- eyes -->
    <circle cx="-12" cy="-12" r="7" fill="#fff"/>
    <circle cx="12" cy="-12" r="7" fill="#fff"/>
    <g>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="5.0s" repeatCount="indefinite"/>
      <circle cx="-11" cy="-11" r="4.5" fill="#8c2e2e"/>
      <circle cx="-10" cy="-12" r="2.2" fill="#000"/>
      <circle cx="-8" cy="-14" r="1" fill="#fff"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="5.0s" repeatCount="indefinite"/>
      <circle cx="13" cy="-11" r="4.5" fill="#8c2e2e"/>
      <circle cx="14" cy="-12" r="2.2" fill="#000"/>
      <circle cx="16" cy="-14" r="1" fill="#fff"/>
    </g>
    <!-- beak -->
    <path d="M -3,0 L 0,6 L 3,0 Z" fill="#f5a623"/>
    <!-- snood -->
    <path d="M 0,6 Q -2,12 -1,15" stroke="#c84a4a" stroke-width="2.5" fill="none"/>
    <!-- breast line -->
    <path d="M -6,12 Q 0,16 6,12" stroke="#000" stroke-width="1.5" fill="none"/>
  </g>
</g>
</svg>
