<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Eastern milk snake — Lampropeltis triangulum</title>
<desc>Body and saddle-band stripe paths morph through a sinuous slither wave; tongue flicks via opacity loop; head ellipse and eyes stay static.</desc>
<g transform="translate(100, 100)">
<path stroke="#c2410c" stroke-width="13" fill="none" stroke-linecap="round">
  <animate attributeName="d" dur="1.5s" repeatCount="indefinite"
   values="M -32 36 Q -10 50 26 36 Q 40 24 30 12 Q 18 -2 -2 4 Q -10 8 -20 16;
           M -32 36 Q -10 44 26 40 Q 40 28 30 8 Q 18 -6 -2 8 Q -10 12 -20 16;
           M -32 36 Q -10 50 26 36 Q 40 24 30 12 Q 18 -2 -2 4 Q -10 8 -20 16"/>
</path>
<path stroke="#0d0d0d" stroke-width="3" fill="none">
  <animate attributeName="d" dur="1.5s" repeatCount="indefinite"
   values="M -32 32 Q -22 38 -12 34;
           M -32 32 Q -22 36 -12 36;
           M -32 32 Q -22 38 -12 34"/>
</path>
<path stroke="#0d0d0d" stroke-width="3" fill="none">
  <animate attributeName="d" dur="1.5s" repeatCount="indefinite"
   values="M 0 26 Q 12 32 22 26;
           M 0 28 Q 12 34 22 28;
           M 0 26 Q 12 32 22 26"/>
</path>
<path stroke="#fef3c7" stroke-width="2" fill="none">
  <animate attributeName="d" dur="1.5s" repeatCount="indefinite"
   values="M -28 40 Q -18 46 -8 42;
           M -28 40 Q -18 44 -8 44;
           M -28 40 Q -18 46 -8 42"/>
</path>
<path stroke="#fef3c7" stroke-width="2" fill="none">
  <animate attributeName="d" dur="1.5s" repeatCount="indefinite"
   values="M 4 36 Q 14 42 24 38;
           M 4 38 Q 14 44 24 40;
           M 4 36 Q 14 42 24 38"/>
</path>
<ellipse cx="-26" cy="-2" rx="20" ry="14" fill="#c2410c"/>
<line x1="-40" y1="-4" x2="-12" y2="-4" stroke="#fef3c7" stroke-width="1.4"/>
<circle cx="-32" cy="-4" r="5" fill="#ffffff"/>
<circle cx="-18" cy="-4" r="5" fill="#ffffff"/>
<circle cx="-32" cy="-3" r="3.6" fill="#06b6d4"/>
<circle cx="-18" cy="-3" r="3.6" fill="#06b6d4"/>
<ellipse cx="-32" cy="-3" rx="1.6" ry="3.5" fill="#0d0d0d"/>
<ellipse cx="-18" cy="-3" rx="1.6" ry="3.5" fill="#0d0d0d"/>
<circle cx="-30" cy="-5" r="1.2" fill="#ffffff"/>
<circle cx="-16" cy="-5" r="1.2" fill="#ffffff"/>
<g>
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.55;0.8;1" dur="1.5s" repeatCount="indefinite"/>
  <path d="M -42 4 L -50 2 M -42 4 L -50 6" stroke="#a8552a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M -38 4 L -42 4" stroke="#a8552a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
</g>
</g>
</svg>
