<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>American goldfinch — Spinus tristis</title>
<desc>Wings flap at the shoulder with a gentle ambient beat, wing bars moving with each side.</desc>
<g transform="translate(-240, -150)">
<!-- Left wing + bar line -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="-6 310 252; 16 310 252; -6 310 252" dur="0.48s" repeatCount="indefinite"/>
  <path d="M 310 252 Q 290 240 280 252 Q 282 270 302 264 Z" fill="#1a1a1a"/>
  <line x1="294" y1="252" x2="304" y2="258" stroke="#ffffff" stroke-width="1.5"/>
</g>
<!-- Right wing + bar line -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="6 370 252; -16 370 252; 6 370 252" dur="0.48s" repeatCount="indefinite"/>
  <path d="M 370 252 Q 390 240 400 252 Q 398 270 378 264 Z" fill="#1a1a1a"/>
  <line x1="386" y1="252" x2="376" y2="258" stroke="#ffffff" stroke-width="1.5"/>
</g>
<!-- Body -->
<ellipse cx="340" cy="268" rx="20" ry="22" fill="#f4c430"/>
<line x1="334" y1="288" x2="332" y2="294" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
<line x1="346" y1="288" x2="348" y2="294" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
<!-- Head -->
<circle cx="340" cy="244" r="22" fill="#f4c430"/>
<!-- Cap -->
<path d="M 322 232 Q 340 218 358 232 Q 350 240 340 240 Q 330 240 322 232 Z" fill="#1a1a1a"/>
<!-- Eyes -->
<circle cx="331" cy="248" r="6" fill="#ffffff"/>
<circle cx="349" cy="248" r="6" fill="#ffffff"/>
<circle cx="331" cy="250" r="3.5" fill="#1a1a1a"/>
<circle cx="349" cy="250" r="3.5" fill="#1a1a1a"/>
<circle cx="332" cy="248" r="1.3" fill="#ffffff"/>
<circle cx="350" cy="248" r="1.3" fill="#ffffff"/>
<!-- Beak -->
<path d="M 335 256 L 345 256 L 340 263 Z" fill="#ff9800"/>
</g>
</svg>
