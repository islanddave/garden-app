<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Memphre — Lake Memphremagog (Cryptid)</title>
<desc>The head bobs slowly and the water band shimmers with a faint opacity pulse.</desc>
<g transform="translate(100, 100)">
  <!-- water band — shimmer -->
  <path d="M -95,60 Q -90,65 -85,63 L 95,63 Q 95,68 90,68 L -90,68 Q -95,68 -95,60 Z" fill="#5a7a8a" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.3;0.5;0.7;0.5" keyTimes="0;0.25;0.5;0.75;1" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <!-- body humps (static) -->
  <path d="M -80,35 Q -65,40 -55,35 L -38,35 L -38,63 L -80,63 Z" fill="#3a5848"/>
  <path d="M -38,18 Q -20,10 0,30 L 12,30 L 12,63 L -38,63 Z" fill="#4a6858"/>
  <path d="M 12,8 Q 30,-2 50,22 L 55,22 L 55,63 L 12,63 Z" fill="#3a5848"/>
  <!-- head group — slow bob -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -5; 0 -1; 0 3; 0 0"
      keyTimes="0;0.3;0.55;0.78;1"
      dur="3.6s" repeatCount="indefinite"/>
    <circle cx="-65" cy="0" r="22" fill="#5a7868"/>
    <ellipse cx="-65" cy="-10" rx="22" ry="20" fill="#6a8c78"/>
    <!-- horn stubs -->
    <path d="M -78,-22 Q -82,-32 -72,-30 Q -70,-25 -72,-22 Z" fill="#6a8c78"/>
    <path d="M -52,-22 Q -48,-32 -58,-30 Q -60,-25 -58,-22 Z" fill="#6a8c78"/>
    <!-- eye whites -->
    <ellipse cx="-73" cy="-5" rx="6" ry="8" fill="#fff"/>
    <ellipse cx="-55" cy="-5" rx="6" ry="8" fill="#fff"/>
    <!-- iris purple — glow pulse -->
    <circle cx="-72" cy="-3" r="4" fill="#6c4ab8">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-54" cy="-3" r="4" fill="#6c4ab8">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- pupils -->
    <circle cx="-71" cy="-4" r="2.2" fill="#000"/>
    <circle cx="-53" cy="-4" r="2.2" fill="#000"/>
    <!-- catchlights -->
    <circle cx="-69" cy="-6" r="1" fill="#fff"/>
    <circle cx="-51" cy="-6" r="1" fill="#fff"/>
    <!-- nostril marks -->
    <ellipse cx="-67" cy="3" rx="1.5" ry="1" fill="#3a2818"/>
    <ellipse cx="-63" cy="3" rx="1.5" ry="1" fill="#3a2818"/>
    <!-- mouth -->
    <path d="M -70,10 Q -64,15 -58,10" stroke="#000" stroke-width="1.5" fill="none"/>
  </g>
</g>
</svg>
