<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport copied verbatim from ../../index.html for the same reason it is copied into
         ./index.html: interactive-widget=resizes-content is what makes a browser resize reproduce
         the keyboard-open layout, and viewport-fit=cover is what makes env(safe-area-inset-*)
         resolve at all. If these diverge from the app's, every number this page produces is void. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>PlantingPhotoSheet at Dave's geometry</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #faf8f3; }
      #verdict {
        position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
        font: 11px/1.4 ui-monospace, monospace; color: #fff; padding: 4px 8px; white-space: pre-wrap;
      }
      /* Decoration ONLY — plain divs standing in for the Garden list behind the backdrop, so the
         screenshot shows the sheet against something rather than against white. Deliberately NOT the
         real PlantingTile: that pulls FavoriteToggle -> AuthContext, which is the dual-React import
         that defeated the retired photostrips entry. Nothing here is measured. */
      .bg { padding: 52px 12px 12px; }
      .bg-card {
        height: 96px; border-radius: 12px; background: #fff; border: 1px solid #e3ded3;
        margin-bottom: 10px; display: flex; align-items: center; padding: 0 12px;
        font: 600 13px/1.3 system-ui, sans-serif; color: #8a8578;
      }
    </style>
  </head>
  <body>
    <div id="verdict">booting…</div>
    <div class="bg" aria-hidden="true">
      <div class="bg-card">Garden list (decorative stand-in)</div>
      <div class="bg-card">Garden list (decorative stand-in)</div>
      <div class="bg-card">Garden list (decorative stand-in)</div>
      <div class="bg-card">Garden list (decorative stand-in)</div>
      <div class="bg-card">Garden list (decorative stand-in)</div>
      <div class="bg-card">Garden list (decorative stand-in)</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/tests/harness/plantingphotosheet.jsx"></script>
  </body>
</html>
