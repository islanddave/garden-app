<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport copied verbatim from ../../index.html, same reason as every other harness entry:
         viewport-fit=cover is what makes env(safe-area-inset-*) resolve at all, and this entry is
         measuring a max-height expression that subtracts one. Diverge and every number is void. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Sheet census — geometry per consumer</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #faf8f3; }
      #verdict {
        position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
        font: 11px/1.4 ui-monospace, monospace; color: #fff; padding: 4px 8px; white-space: pre-wrap;
      }
      /* Decorative page behind the backdrop so a screenshot shows the sheet against something. Plain
         divs, not a real list: nothing here is measured. */
      .bg { padding: 52px 12px 12px; }
      .bg-card {
        height: 96px; border-radius: 12px; background: #fff; border: 1px solid #e3ded3;
        margin-bottom: 10px; display: flex; align-items: center; padding: 0 12px;
        font: 600 13px/1.3 system-ui, sans-serif; color: #8a8578;
      }
    </style>
  </head>
  <body>
    <div id="verdict">booting…</div>
    <div class="bg" aria-hidden="true">
      <div class="bg-card">Page behind the sheet (decorative stand-in)</div>
      <div class="bg-card">Page behind the sheet (decorative stand-in)</div>
      <div class="bg-card">Page behind the sheet (decorative stand-in)</div>
      <div class="bg-card">Page behind the sheet (decorative stand-in)</div>
      <div class="bg-card">Page behind the sheet (decorative stand-in)</div>
      <div class="bg-card">Page behind the sheet (decorative stand-in)</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/tests/harness/sheetcensus.jsx"></script>
  </body>
</html>
