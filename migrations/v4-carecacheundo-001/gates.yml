# gates.yml
# V4-CARECACHEUNDO-001 — repair of entity_memory rows left AHEAD of the event log by event undo.
# DATA-ONLY (no DDL on any app table; the one snap_* table is rollback scaffolding).
#
# DEPLOY BOUNDARY — the falsifiable test.
#
#   QUESTION: can the CURRENTLY DEPLOYED prod code re-create the drift this file repairs, after it
#             has been repaired?
#   ANSWER:   YES, until the Lambda fix promotes. The deployed events Lambda still recomputes only
#             last_watered_at on undo, and its single-event arm still runs no recompute at all
#             unless the undone event was watering/rain. Any undo of a harvest / fertilizing /
#             pruning / observation between this repair and the promote re-opens exactly one cell.
#   CONSEQUENCE: this migration is ORDER-SENSITIVE in one direction only. It is safe to apply at any
#             time — it never breaks the deployed writer, which does not read these columns before
#             writing them — but applying it LONG BEFORE the promote wastes the repair. Preferred
#             order is code first, data second; see README.md §Apply order. The repair is idempotent,
#             so re-running it after the promote is the cheap, correct remedy if drift reappears.
#   COUPLING with the Lambda fix: none in the breaking sense. The new recompute arms are correct
#             against repaired and unrepaired data alike (they compute from event_log, never from
#             the cache), and the repair is correct against old and new Lambda alike.
#
# DESTRUCTIVE STEPS: none. No DROP, no DELETE, no constraint change. The only mutation is lowering
# six timestamp columns toward values already present in event_log, snapshotted first and reversible
# by 0r.
#
# ORDER APPLIED: nothing is applied yet. Authored, parse-verified against live prod inside
# SET TRANSACTION READ ONLY, and gate-validated only.
#
# The sweep phase is the L-058 all-row check in its data-repair form: it MEASURES the two drift
# populations separately before the write, so the post phase can assert that one went to zero while
# the other is exactly as many rows as it was. Both sweeps use rowcount_gte: 0 — they always pass,
# still run, still report. That is the point: they put the before/after of a data-quality finding on
# the record instead of in prose.

pre:
  # The columns this migration writes. Asserting the substrate rather than assuming it.
  - name: pre_recency_columns_present
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema = 'public' AND table_name = 'entity_memory'
         AND column_name IN ('last_event_at','last_watered_at','last_fertilized_at',
                             'last_pruned_at','last_observed_at','last_harvested_at')
    expect: rowcount_eq
    value: 6

  # Phase A of care-rekey-001 must be applied: without the plant arm there is no plant-keyed row to
  # repair, and this file would silently do half its job.
  - name: pre_plant_arm_present
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema = 'public' AND table_name = 'entity_memory' AND column_name = 'plant_id'
    expect: rowcount_eq
    value: 1

  # A pre-existing snapshot means an earlier run already captured state. 0b's CREATE TABLE IF NOT
  # EXISTS would then adopt that older capture rather than the current one — correct for a resumed
  # run, wrong and invisible for a fresh one. Fail loudly and let a human decide which it is.
  - name: pre_snapshot_table_absent
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema = 'public' AND table_name = 'snap_carecacheundo001_entity_memory'
    expect: rowcount_eq
    value: 0

  # Re-run guard. A second application against an already-repaired database is harmless (0b matches
  # nothing) but should be a deliberate act, not a silent no-op reported as success.
  - name: pre_not_already_applied
    sql: |
      SELECT 1 FROM public.schema_version WHERE version = '4.23.2-carecacheundo-001'
    expect: rowcount_eq
    value: 0

sweep:
  # ── population 1: what THIS migration repairs ────────────────────────────────────────────────
  - name: sweep_capture_cache_ahead_of_event_log
    note: >
      entity_memory rows with at least one recency column STRICTLY AHEAD of the surviving event log
      (including cached-non-NULL against truth-NULL). This is BUG-CARECACHEUNDO-001's blast radius
      and exactly the set 0b rewrites. Prod at authoring time: 6 rows / 12 cells — 2 plant rows
      (both last_harvested_at: "Beefsteak Rescue 2" cached 2026-07-31 vs true max 2026-07-14, and
      "Pineapple Tomato" cached 2026-08-04 with no surviving harvest at all) and 4 project rows
      ("Basil" E, "Bitter Melon" H, "Build Out" EWPO, "Chilis" EWOH; 3 of the 4 on soft-deleted
      containers). Every one carries the undo signature — a soft-deleted event at exactly the cached
      timestamp. Must be 0 after 0b.
    sql: |
      WITH truth AS (
        SELECT em.id,
               em.last_event_at, em.last_watered_at, em.last_fertilized_at,
               em.last_pruned_at, em.last_observed_at, em.last_harvested_at,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_any,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL AND e.event_type IN ('watering','rain')
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_water,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL AND e.event_type = 'fertilizing'
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_fert,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL AND e.event_type = 'pruning'
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_prune,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL AND e.event_type = 'observation'
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_obs,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.event_type IN ('harvest','first_harvest')
                             ELSE e.event_type = 'harvest' END)
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_harv
          FROM public.entity_memory em
         WHERE em.plant_id IS NOT NULL OR em.project_id IS NOT NULL
      )
      SELECT id FROM truth
       WHERE (last_event_at      IS NOT NULL AND (t_any   IS NULL OR last_event_at      > t_any))
          OR (last_watered_at    IS NOT NULL AND (t_water IS NULL OR last_watered_at    > t_water))
          OR (last_fertilized_at IS NOT NULL AND (t_fert  IS NULL OR last_fertilized_at > t_fert))
          OR (last_pruned_at     IS NOT NULL AND (t_prune IS NULL OR last_pruned_at     > t_prune))
          OR (last_observed_at   IS NOT NULL AND (t_obs   IS NULL OR last_observed_at   > t_obs))
          OR (last_harvested_at  IS NOT NULL AND (t_harv  IS NULL OR last_harvested_at  > t_harv))
    expect: rowcount_gte
    value: 0

  # ── population 2: what this migration must NOT touch ────────────────────────────────────────
  - name: sweep_capture_cache_behind_event_log_left_alone
    note: >
      The OTHER drift direction — cache BEHIND the log — which is NOT this file's to repair.
      CORRECTED 2026-08-07 (BUG-CACHEFWDGAP-001 investigation): the attribution and the remedy
      named here were both wrong. Those 15 rows are not one ticket's — they come from four
      unrelated doors: the events PUT running no recompute on a forward event_date edit (4 rows),
      the BUG-DIRECTWRITEDRIFT-001 reversal script INSERTing 5 plant rows with a partial column
      list and a subset-scoped recompute (5), commit 78419e8 renormalising event_date midnight->
      noon without recomputing (4), and a harvest acquiring event_log.plant_id out of band (2).
      And re-running care-rekey-001/0b-backfill.sql repairs at most 5 of the 15: it writes only the
      plant arm, so all 5 project rows are invisible to it, and its
      `WHERE p.deleted_at IS NULL AND p.archived_at IS NULL` excludes all 5 reversal-script rows,
      every one of which was archived 2026-07-20. The actual repair is
      migrations/v4-cachefwdgap-001. Captured here so the
      post gate can prove 0b was backwards-only: this count must be UNCHANGED after apply. Prod at
      authoring time: 15 rows (some overlap population 1 — a row can be ahead on one column and
      behind on another, which is precisely why the repair is decided per CELL, not per row).
    sql: |
      WITH truth AS (
        SELECT em.id,
               em.last_event_at, em.last_watered_at, em.last_fertilized_at,
               em.last_pruned_at, em.last_observed_at, em.last_harvested_at,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_any,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL AND e.event_type IN ('watering','rain')
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_water,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL AND e.event_type = 'fertilizing'
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_fert,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL AND e.event_type = 'pruning'
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_prune,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL AND e.event_type = 'observation'
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_obs,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.event_type IN ('harvest','first_harvest')
                             ELSE e.event_type = 'harvest' END)
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_harv
          FROM public.entity_memory em
         WHERE em.plant_id IS NOT NULL OR em.project_id IS NOT NULL
      )
      SELECT id FROM truth
       WHERE (t_any   IS NOT NULL AND (last_event_at      IS NULL OR last_event_at      < t_any))
          OR (t_water IS NOT NULL AND (last_watered_at    IS NULL OR last_watered_at    < t_water))
          OR (t_fert  IS NOT NULL AND (last_fertilized_at IS NULL OR last_fertilized_at < t_fert))
          OR (t_prune IS NOT NULL AND (last_pruned_at     IS NULL OR last_pruned_at     < t_prune))
          OR (t_obs   IS NOT NULL AND (last_observed_at   IS NULL OR last_observed_at   < t_obs))
          OR (t_harv  IS NOT NULL AND (last_harvested_at  IS NULL OR last_harvested_at  < t_harv))
    expect: rowcount_gte
    value: 0

post:
  # The invariant this migration exists to establish. Structural, not a pinned count, so it stays
  # true as the garden grows: no cached recency value may claim an event the log does not have.
  - name: post_no_cache_ahead_of_event_log
    sql: |
      WITH truth AS (
        SELECT em.id,
               em.last_event_at, em.last_watered_at, em.last_fertilized_at,
               em.last_pruned_at, em.last_observed_at, em.last_harvested_at,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_any,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL AND e.event_type IN ('watering','rain')
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_water,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL AND e.event_type = 'fertilizing'
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_fert,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL AND e.event_type = 'pruning'
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_prune,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL AND e.event_type = 'observation'
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_obs,
               (SELECT MAX(e.event_date) FROM public.event_log e
                 WHERE e.deleted_at IS NULL
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.event_type IN ('harvest','first_harvest')
                             ELSE e.event_type = 'harvest' END)
                   AND (CASE WHEN em.plant_id IS NOT NULL THEN e.plant_id = em.plant_id
                             ELSE e.project_id = em.project_id END)) AS t_harv
          FROM public.entity_memory em
         WHERE em.plant_id IS NOT NULL OR em.project_id IS NOT NULL
      )
      SELECT id FROM truth
       WHERE (last_event_at      IS NOT NULL AND (t_any   IS NULL OR last_event_at      > t_any))
          OR (last_watered_at    IS NOT NULL AND (t_water IS NULL OR last_watered_at    > t_water))
          OR (last_fertilized_at IS NOT NULL AND (t_fert  IS NULL OR last_fertilized_at > t_fert))
          OR (last_pruned_at     IS NOT NULL AND (t_prune IS NULL OR last_pruned_at     > t_prune))
          OR (last_observed_at   IS NOT NULL AND (t_obs   IS NULL OR last_observed_at   > t_obs))
          OR (last_harvested_at  IS NOT NULL AND (t_harv  IS NULL OR last_harvested_at  > t_harv))
    expect: rowcount_eq
    value: 0

  # BACKWARDS-ONLY, asserted rather than trusted. Every repaired cell must have MOVED DOWN (or to
  # NULL) relative to the snapshot. A single upward move would mean 0b's CASE was inverted or a
  # future edit replaced it with a plain "set to truth", which would silently annex
  # BUG-DIRECTWRITEDRIFT-001's rows and destroy that ticket's before/after evidence.
  #
  # continuous: false ADDED 2026-08-10 (gate-invariants backlog triage), for the SAME reason as its
  # sibling below and one the sibling's note already spells out. This gate joins the APPLY-TIME
  # SNAPSHOT and asserts no cell has moved forward SINCE it was taken. entity_memory takes ~264
  # writes/day, and every ordinary watering/observation legitimately moves last_watered_at and
  # last_event_at forward past the snapshot — so the comparison is only meaningful while the apply
  # is in flight. Measured 2026-08-10: 3 rows on prod, 1 on staging, all ordinary forward traffic on
  # snapshotted rows. The 0b-was-backwards-only claim is real but is an APPLY-TIME claim; asserting
  # it forever converts normal garden use into a permanent red.
  - name: post_no_repaired_cell_moved_forward
    continuous: false
    sql: |
      SELECT em.id
        FROM public.snap_carecacheundo001_entity_memory s
        JOIN public.entity_memory em ON em.id = s.id
       WHERE (em.last_event_at      IS NOT NULL AND (s.last_event_at      IS NULL OR em.last_event_at      > s.last_event_at))
          OR (em.last_watered_at    IS NOT NULL AND (s.last_watered_at    IS NULL OR em.last_watered_at    > s.last_watered_at))
          OR (em.last_fertilized_at IS NOT NULL AND (s.last_fertilized_at IS NULL OR em.last_fertilized_at > s.last_fertilized_at))
          OR (em.last_pruned_at     IS NOT NULL AND (s.last_pruned_at     IS NULL OR em.last_pruned_at     > s.last_pruned_at))
          OR (em.last_observed_at   IS NOT NULL AND (s.last_observed_at   IS NULL OR em.last_observed_at   > s.last_observed_at))
          OR (em.last_harvested_at  IS NOT NULL AND (s.last_harvested_at  IS NULL OR em.last_harvested_at  > s.last_harvested_at))
    expect: rowcount_eq
    value: 0

  # The rollback path must actually be usable: every row 0b wrote has to be in the snapshot. If the
  # snapshot predicate and the UPDATE predicate ever drift apart, this catches it while the data is
  # still recoverable rather than after someone needs 0r.
  # continuous: false ADDED 2026-08-07 — this gate was RED AT 88 ROWS on prod when checked, and had
  # been red since minutes after the 14:47:59Z apply. Not a real failure: it infers "was repaired"
  # from `updated_at >= applied_at`, which is only a valid proxy DURING the apply window. Ordinary
  # traffic writes ~264 entity_memory rows a day, and every one of them matches the proxy while
  # legitimately having no snapshot row. Left continuous, the weekly gate-invariants job carries a
  # permanent red for a migration that succeeded — precisely the "known stale-gate backlog … train
  # everyone to ignore this job" failure that workflow's own header warns against.
  - name: post_every_repaired_row_is_snapshotted
    continuous: false
    sql: |
      SELECT em.id
        FROM public.entity_memory em
        LEFT JOIN public.snap_carecacheundo001_entity_memory s ON s.id = em.id
       WHERE em.updated_at >= (SELECT applied_at FROM public.schema_version
                                WHERE version = '4.23.2-carecacheundo-001')
         AND s.id IS NULL
         AND (em.plant_id IS NOT NULL OR em.project_id IS NOT NULL)
    expect: rowcount_eq
    value: 0

  # Out-of-scope columns, asserted untouched. next_water_at belongs to the nightly daily-plan engine
  # and last_issue_at has no event_type mapping; a future "while we're in here" edit that starts
  # writing either of them would be caught by comparing against the snapshot's row set.
  - name: post_no_recency_row_lost_its_parent
    sql: |
      SELECT em.id FROM public.snap_carecacheundo001_entity_memory s
        JOIN public.entity_memory em ON em.id = s.id
       WHERE em.plant_id IS NULL AND em.project_id IS NULL AND em.location_id IS NULL
    expect: rowcount_eq
    value: 0

  - name: post_schema_version_recorded
    sql: |
      SELECT 1 FROM public.schema_version WHERE version = '4.23.2-carecacheundo-001'
    expect: rowcount_eq
    value: 1
