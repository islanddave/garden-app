# gates.yml
# v5-tenancyclasses-001: V5-SPACETENANCYKEY-001 (multi-space plan V204 step 2.0b, §2.1): the relkind gate.
# Stamp 5.3.6-tenancyclasses-001. README.md has the apply order, the arming decision and the C-CONV pre-scan.
#
# ── WHAT IT ASSERTS ───────────────────────────────────────────────────────────────────────────────
#   The live catalog and lambda/tenancy-classes.json name the same relations. Every relation of relkind r, p, v,
#   m or f in every non-system schema is a row of the VALUES list below (or a copy table, by the anchored
#   copy-pattern regexes, the same list as the class file's copyPatterns), and every row exists with its relkind,
#   unless its pending stamp is not yet in schema_version (public.plots until 5.3.6-plottier-001).
#   One row per finding: 'unclassed <schema.rel> (relkind k)' or 'stale <schema.rel> (relkind k)'. To list them
#   on a red, run the gate's SQL read-only.
#
# ── THE VALUES LIST IS THE CLASS FILE ─────────────────────────────────────────────────────────────
#   (nspname, relname, relkind, class, tenancy_column, pending_stamp), one row per relation of
#   lambda/tenancy-classes.json, between the BEGIN/END markers. lambda/tenancy-classes.test.js holds every marked
#   block here and in 0a-stamp.sql equal to the file, and the copy predicates equal to its copyPatterns (N16).
#   `node tests/lib/tenancyClasses.mjs --values` prints the rows to paste. A migration that creates or drops a
#   relation edits the class file, the snapshot (scripts/tenancy-catalog-snapshot.py) and these blocks in its
#   push; a relation it creates is added as pending on its own stamp, so this gate tolerates the gap until the
#   apply and asserts after it.
#
# ── SELF-ARMING ───────────────────────────────────────────────────────────────────────────────────
#   gate-invariants runs `gate_runner.py --all --phase post --continuous-only` against live prod and staging on
#   every migrations/** push. This directory has no DDL, so it follows v5-tenantgates-001 (review DSA I3): a 0a
#   that writes only the stamp and a 0r that deletes it. The post gate returns rows only when the stamp exists.
#   No `::regclass` anywhere: relations by pg_class.relname joined to pg_namespace.
#
# REHEARSED on a throwaway local PostgreSQL 17 loaded with prod's schema and stamps (README.md). Not run against
# staging or prod as an applied migration; the unarmed pre gate was read on both (README.md).

pre:
  - name: pre_not_already_applied
    note: continuous false; false by design once 0a runs.
    sql: |
      SELECT version FROM public.schema_version WHERE version = '5.3.6-tenancyclasses-001'
    expect: rowcount_eq
    value: 0
    continuous: false

