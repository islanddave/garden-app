# gates.yml
# V5-SEASONSTATS-001 — seventeen stat_* views behind GET /api/harvests/season-stats.
#
# HARD DEPENDENCY: v5-sourcecontact-001 (public.source.instagram_url / facebook_url). stat_saved_lot
# projects both, and a view cannot name a column its base table does not have — so the apply fails
# outright if this migration goes first. Apply order: sourcecontact, then this.
#
# NO `env:` KEY ANYWHERE. Every gate reads pg_catalog / information_schema or the receipt, so each
# means the same thing on staging and prod and none can pass vacuously for want of a data row.
#
# NO COUNT GATE ON A WHOLE VIEW, DELIBERATELY (same reasoning as v5-sourcenodeview-001): every post
# gate names the columns it asserts, so a later migration that appends a column to one of these
# views does not red it, while losing a named column does.

pre:
  - name: pre_source_contact_columns_exist
    note: >
      The hard dependency. v5-sourcecontact-001 adds source.instagram_url and source.facebook_url;
      stat_saved_lot projects both. Counted, so losing either reds it.
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema = 'public' AND table_name = 'source'
         AND column_name IN ('instagram_url', 'facebook_url')
      HAVING count(*) = 2
    expect: rowcount_eq
    value: 1

  - name: pre_named_base_columns_exist
    note: >
      The three base columns the plan names as load-bearing: harvest_log.weight_basis (measured
      share, every tomato figure), plants.source_inventory_item_id (the packet fallback that makes
      eff_source_id), weather_daily.tmin_f (degree days and cool nights).
    sql: |
      SELECT 1
        FROM (VALUES ('harvest_log', 'weight_basis'),
                     ('plants', 'source_inventory_item_id'),
                     ('weather_daily', 'tmin_f')) req(t, c)
       WHERE NOT EXISTS (SELECT 1 FROM information_schema.columns ic
                          WHERE ic.table_schema = 'public' AND ic.table_name = req.t
                            AND ic.column_name = req.c)
    expect: rowcount_eq
    value: 0

  - name: pre_other_base_columns_exist
    note: >
      Every other base-table column 0a names outside the long-standing core (ids, names, deleted_at,
      created_by). Each row returned is a column the views need and the database lacks.
    sql: |
      SELECT req.t, req.c
        FROM (VALUES ('plants', 'source_id'), ('plants', 'acquired_from_source_id'),
                     ('plants', 'qty_initial'), ('plants', 'transplanted_at_approx'),
                     ('plants', 'container_size'), ('plants', 'archived_at'),
                     ('plants', 'source_type'), ('plants', 'sown_at'),
                     ('plant_varieties', 'scoville_max'), ('plant_varieties', 'crop_type_slug'),
                     ('crop_types', 'category'), ('event_log', 'source'),
                     ('harvest_log', 'weight_grams'),
                     ('inventory_items', 'source_id'), ('inventory_items', 'acquired_from_source_id'),
                     ('inventory_items', 'source_plant_id'), ('inventory_items', 'seed_stage'),
                     ('inventory_items', 'seed_count'), ('inventory_items', 'seed_count_estimated'),
                     ('inventory_items', 'source_kind'), ('source', 'kind'), ('source', 'locality'),
                     ('source', 'address'), ('source', 'website_url'),
                     ('weather_daily', 'tmax_f'), ('weather_daily', 'precip_in'),
                     ('spaces', 'created_by')) req(t, c)
       WHERE NOT EXISTS (SELECT 1 FROM information_schema.columns ic
                          WHERE ic.table_schema = 'public' AND ic.table_name = req.t
                            AND ic.column_name = req.c)
    expect: rowcount_eq
    value: 0

  - name: pre_no_non_view_relation_uses_a_stat_name
    note: >
      CREATE OR REPLACE VIEW fails if a TABLE (or matview) already holds the name. Continuous: a
      stat_* view is fine, anything else under these names is a collision.
    sql: |
      SELECT c.relname
        FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
       WHERE n.nspname = 'public' AND c.relkind <> 'v'
         AND c.relname IN ('stat_weather_day', 'stat_planting', 'stat_pick', 'stat_planting_harvest',
                           'stat_care_day', 'stat_season_pins', 'stat_weekly_heat_fruit',
                           'stat_source_mix', 'stat_source_card', 'stat_heat_clock_crop',
                           'stat_heat_clock_cultivar', 'stat_heat_ladder', 'stat_pepper_best',
                           'stat_tomato_keep', 'stat_longest_giving', 'stat_tomato_month_size',
                           'stat_saved_lot')
    expect: rowcount_eq
    value: 0

  - name: pre_views_absent
    note: >
      Greenfield. A row here means 0a (or a draft of it) already ran — diff before re-running,
      because CREATE OR REPLACE VIEW refuses to rename or reorder an existing view's columns.
      continuous false by design: false forever once 0a lands.
    sql: |
      SELECT table_name FROM information_schema.views
       WHERE table_schema = 'public' AND table_name LIKE 'stat\_%'
    expect: rowcount_eq
    value: 0
    continuous: false

post:
  - name: post_every_view_exists
    note: >
      All seventeen, by name. Armed on the receipt so it is vacuously green before the apply and red
      only if a view is dropped afterwards.
    sql: |
      SELECT 1
       WHERE EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-seasonstats-001')
         AND (SELECT count(*) FROM information_schema.views
               WHERE table_schema = 'public'
                 AND table_name IN ('stat_weather_day', 'stat_planting', 'stat_pick',
                                    'stat_planting_harvest', 'stat_care_day', 'stat_season_pins',
                                    'stat_weekly_heat_fruit', 'stat_source_mix', 'stat_source_card',
                                    'stat_heat_clock_crop', 'stat_heat_clock_cultivar',
                                    'stat_heat_ladder', 'stat_pepper_best', 'stat_tomato_keep',
                                    'stat_longest_giving', 'stat_tomato_month_size',
                                    'stat_saved_lot')) <> 17
    expect: rowcount_eq
    value: 0

