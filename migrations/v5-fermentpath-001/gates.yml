  # ── Heat is an estimate, never a measurement ──────────────────────────────────────────────────
  # No column that could hold a MEASURED heat: any column on the four put-up tables whose name contains
  # 'shu' or 'scoville', other than F's five estimate/rating columns, reds. NOT ARMED: true today. Its
  # rehearsal plants a `shu` column to prove it is not vacuous.
  - name: post_no_measured_shu_column
    sql: |
      SELECT c.table_name, c.column_name
        FROM information_schema.columns c
       WHERE c.table_schema = 'public'
         AND c.table_name IN ('kitchen_batch','kitchen_batch_input','kitchen_stage_log','preservation_log')
         AND (c.column_name LIKE '%shu%' OR c.column_name LIKE '%scoville%')
         AND c.column_name NOT IN ('shu_est_low','shu_est_high','shu_est_basis',
                                   'shu_rating_low','shu_rating_high')
    expect: rowcount_eq
    value: 0

  # ── Kind gating is UI-only (06 §3.10) ─────────────────────────────────────────────────────────
  # No CHECK on the put-up tables names kitchen_batch.kind except the two shipped vocabulary CHECKs.
  # `\m` is a word start, so stage_kind / input_kind / source_kind never match. NOT ARMED: true today.
  - name: post_no_f_check_names_kind
    sql: |
      SELECT t.relname, c.conname
        FROM pg_constraint c
        JOIN pg_class t ON t.oid = c.conrelid
        JOIN pg_namespace n ON n.oid = t.relnamespace
       WHERE n.nspname = 'public' AND c.contype = 'c'
         AND t.relname IN ('kitchen_batch','kitchen_batch_input','kitchen_stage_log','preservation_log',
                           'pantry_use')
         AND pg_get_constraintdef(c.oid) ~ '\mkind\M'
         AND c.conname NOT IN ('chk_kitchen_batch_kind','chk_kitchen_batch_kind_other')
    expect: rowcount_eq
    value: 0

  # ── v_kitchen_batch_current: 1b's 31, then F's nine at 32-40 ───────────────────────────────────
  # Positions, not a count, so B''s recipe_id at 41 stays green.
  - name: post_view_f_columns_in_order
    sql: |
      SELECT v.pos, v.col
        FROM (VALUES
               (31,'idempotency_key'), (32,'vessel_label'), (33,'vessel_size'), (34,'vessel_unit'),
               (35,'vessel_count'), (36,'no_salt'), (37,'shu_est_low'), (38,'shu_est_high'),
               (39,'shu_est_basis'), (40,'recipe_ref')) AS v(pos, col)
       WHERE EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-fermentpath-001')
         AND NOT EXISTS (SELECT 1
                           FROM pg_attribute a
                           JOIN pg_class c ON c.oid = a.attrelid
                           JOIN pg_namespace n ON n.oid = c.relnamespace
                          WHERE n.nspname = 'public' AND c.relname = 'v_kitchen_batch_current'
                            AND a.attnum = v.pos AND a.attname = v.col AND NOT a.attisdropped)
    expect: rowcount_eq
    value: 0

  # ── Apply-window receipt ──────────────────────────────────────────────────────────────────────
  # Right after 0a, and until F's code writes: no F-shaped row exists — 0a wrote no data and 0r's window
  # is open. F's first write ends the window, so this is continuous: false. to_jsonb so a runbook run on
  # an unapplied database reports 0, not 42703. pantry_use is not read here (naming a relation that may
  # not exist would ERROR); 0r's guard counts it.
  - name: post_no_f_shaped_row_yet
    continuous: false
    sql: |
      SELECT x.what, x.id
        FROM (SELECT 'batch' AS what, b.id FROM public.kitchen_batch b
               WHERE jsonb_strip_nulls(jsonb_build_object(
                       'vl', to_jsonb(b) -> 'vessel_label', 'vs', to_jsonb(b) -> 'vessel_size',
                       'vu', to_jsonb(b) -> 'vessel_unit', 'vc', to_jsonb(b) -> 'vessel_count',
                       'ns', to_jsonb(b) -> 'no_salt', 'lo', to_jsonb(b) -> 'shu_est_low',
                       'hi', to_jsonb(b) -> 'shu_est_high', 'sb', to_jsonb(b) -> 'shu_est_basis',
                       'rr', to_jsonb(b) -> 'recipe_ref')) <> '{}'::jsonb
              UNION ALL
              SELECT 'line', i.id FROM public.kitchen_batch_input i
               WHERE jsonb_strip_nulls(jsonb_build_object(
                       'brand', to_jsonb(i) -> 'brand', 'form', to_jsonb(i) -> 'form',
                       'lo', to_jsonb(i) -> 'shu_rating_low', 'hi', to_jsonb(i) -> 'shu_rating_high',
                       'm', to_jsonb(i) -> 'salt_method', 'f', to_jsonb(i) -> 'base_from',
                       'e', to_jsonb(i) -> 'edited_at', 'p', CASE WHEN to_jsonb(i) ->> 'salt_base' = 'produce'
                                                               THEN to_jsonb(i) -> 'salt_base' END)) <> '{}'::jsonb
              UNION ALL
              SELECT 'stage row', s.id FROM public.kitchen_stage_log s
               WHERE jsonb_strip_nulls(jsonb_build_object(
                       'a', to_jsonb(s) -> 'acts', 'm', to_jsonb(s) -> 'mash_in_g',
                       'e', to_jsonb(s) -> 'edited_at')) <> '{}'::jsonb
              UNION ALL
              SELECT 'jar', p.id FROM public.preservation_log p
               WHERE jsonb_strip_nulls(jsonb_build_object(
                       'lo', to_jsonb(p) -> 'shu_est_low', 'hi', to_jsonb(p) -> 'shu_est_high',
                       'b', to_jsonb(p) -> 'shu_est_basis', 'c', to_jsonb(p) -> 'cooked',
                       'd', to_jsonb(p) -> 'delta_at', 'r', to_jsonb(p) -> 'remaining_amount')) <> '{}'::jsonb) x
    expect: rowcount_eq
    value: 0
