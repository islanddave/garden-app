  # audit_stmt_update() reads deleted_at on both transition tables and swallows the 42703 as a WARNING
  # (DS-B2): attached to a table without deleted_at it audits NOTHING, silently. NOT ARMED: true today
  # (event_log, harvest_log, plants, source, preservation_log all carry deleted_at). One row per table.
  - name: post_audit_stmt_update_tables_have_deleted_at
    sql: |
      SELECT DISTINCT t.relname
        FROM pg_trigger g
        JOIN pg_class t ON t.oid = g.tgrelid
        JOIN pg_namespace n ON n.oid = t.relnamespace
        JOIN pg_proc p ON p.oid = g.tgfoid
       WHERE n.nspname = 'public' AND NOT g.tgisinternal AND p.proname = 'audit_stmt_update'
         AND NOT EXISTS (SELECT 1 FROM information_schema.columns c
                          WHERE c.table_schema = 'public' AND c.table_name = t.relname
                            AND c.column_name = 'deleted_at')
    expect: rowcount_eq
    value: 0

  # ── Identity functions: each names exactly its frozen columns, all real, on its own table ──────────
  - name: post_identity_fn_ksl_names_its_columns
    sql: |
      WITH fn AS (
        SELECT p.prosrc FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
         WHERE n.nspname = 'public' AND p.proname = 'prevent_ksl_identity_change'
      ), ref AS (
        SELECT DISTINCT lower((regexp_matches(fn.prosrc, '(?:OLD|NEW)\.([a-z_][a-z0-9_]*)', 'gi'))[1]) AS col
          FROM fn
      ), expected(col) AS (VALUES ('batch_id'), ('stage_kind'), ('voids_id'), ('created_by')),
      armed AS (SELECT 1 WHERE EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-fermentpath-001'))
      SELECT 'not frozen' AS problem, e.col FROM expected e, armed
       WHERE NOT EXISTS (SELECT 1 FROM ref WHERE ref.col = e.col)
      UNION ALL
      SELECT 'frozen but not in the list', ref.col FROM ref
       WHERE NOT EXISTS (SELECT 1 FROM expected e WHERE e.col = ref.col)
      UNION ALL
      SELECT 'names a column the table lacks', ref.col FROM ref
       WHERE NOT EXISTS (SELECT 1 FROM information_schema.columns c
                          WHERE c.table_schema = 'public' AND c.table_name = 'kitchen_stage_log'
                            AND c.column_name = ref.col)
    expect: rowcount_eq
    value: 0

  # plant_id and deleted_at must NOT be frozen (SET NULL RI action, merge repoint, soft delete): naming
  # either reds here as "frozen but not in the list".
  - name: post_identity_fn_kbi_names_its_columns
    sql: |
      WITH fn AS (
        SELECT p.prosrc FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
         WHERE n.nspname = 'public' AND p.proname = 'prevent_kbi_identity_change'
      ), ref AS (
        SELECT DISTINCT lower((regexp_matches(fn.prosrc, '(?:OLD|NEW)\.([a-z_][a-z0-9_]*)', 'gi'))[1]) AS col
          FROM fn
      ), expected(col) AS (VALUES ('batch_id'), ('created_by'), ('input_kind'), ('preservation_log_id'),
                                  ('harvest_log_id'), ('put_up_stage_id'), ('output_id')),
      armed AS (SELECT 1 WHERE EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-fermentpath-001'))
      SELECT 'not frozen' AS problem, e.col FROM expected e, armed
       WHERE NOT EXISTS (SELECT 1 FROM ref WHERE ref.col = e.col)
      UNION ALL
      SELECT 'frozen but not in the list', ref.col FROM ref
       WHERE NOT EXISTS (SELECT 1 FROM expected e WHERE e.col = ref.col)
      UNION ALL
