# gates.yml
# V4-EVENTSOURCE-001 — event_log.source provenance column + backfill + xp_events idempotency index.
#
# SEQUENCING — this one DOES gate the code deploy, in one direction only:
#   0a/0c MUST reach an environment BEFORE the lambda/events code that writes `source` and relies on
#   ON CONFLICT against uq_xp_events_user_reason_source. Without 0a every event INSERT 42703s on the
#   unknown column. The reverse is unconstrained: 0a/0b/0c are safe against the currently-deployed
#   Lambda (nullable column, NULL-admitting NOT VALID CHECK, no writer that can violate the index).
#
#   CONSEQUENCE FOR CI (do not skip this): integration-test.yml branches off STAGING and does NOT
#   apply migrations. So the order is
#       1. apply 0a + 0c to STAGING   <-- before the dev push, or integration tests fail on 42703
#       2. push code to dev
#       3. apply 0a + 0b + 0c to PROD before the promote reaches prod
#   0b (data backfill) is not a code DEPENDENCY, so it cannot break a deploy by lagging — but the
#   original wording here ("may lag; nothing reads `source` yet") was read as permission to skip it,
#   and it WAS skipped: 0a/0c were applied, 0b never ran, and event_log.source shipped in v3.97.0
#   at 100% NULL. "May lag" is not "may be forgotten". 0b writes its own schema_version row now
#   (4.21.3-eventsource-001-backfill) and post_backfill_ledger_row_recorded below asserts it, so a
#   skipped backfill is visible instead of silent. Apply 0b before anything reads `source`.
#
# NO RUNNER EXISTS. Nothing in this repo executes these pre/post blocks — they are a runbook, and
# an operator must run them by hand. That is the second half of why the gap survived: the
# post-conditions that would have caught it were never executed either.
#
# RUN RECORD — 2026-08-04, executed by hand against both environments:
#   staging 18:50:53Z  0b applied (0 batch / 49 app / 0 status; 53 rows correctly left NULL)
#   prod    18:53:13Z  0b applied (9,724 batch / 2,025 app / 167 status; 184 left NULL, 166 live)
#   both    re-run immediately after -> 0/0/0 updated (idempotent); all post gates below return 0/pass.
#
# L-058 SWEEP: empty. The only CHECK is created NOT VALID on purpose — see 0a's header. Do NOT add
#   a VALIDATE step here: validating would arm the constraint against the still-deployed old writer,
#   and arming a CHECK is a deploy, not a migration.

pre:
  - name: pre_event_log_present
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name='event_log'
    expect: rowcount_eq
    value: 1

  # 0b reads app_events. If it has already been dropped, the backfill silently classifies nothing
  # and the whole point of item 10 (move provenance out BEFORE dropping) has been lost.
  - name: pre_app_events_still_present
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name='app_events'
    expect: rowcount_eq
    value: 1

  # 0c is a UNIQUE index over existing data — it fails loudly on a duplicate. Prove there is none
  # BEFORE the DDL rather than discovering it mid-apply.
  - name: pre_no_duplicate_xp_grants
    sql: |
      SELECT 1 FROM (
        SELECT user_id, reason, source_id FROM public.xp_events
         WHERE source_id IS NOT NULL
         GROUP BY 1,2,3 HAVING count(*) > 1) d
    expect: rowcount_eq
    value: 0

sweep: []

post:
  - name: post_source_column_present
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='event_log' AND column_name='source'
    expect: rowcount_eq
    value: 1

  # Nullable with no default is what makes 0a safe against the deployed Lambda. If a later edit
  # ever adds NOT NULL or a DEFAULT, that safety is gone and this gate says so.
  - name: post_source_is_nullable_no_default
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='event_log' AND column_name='source'
         AND is_nullable='YES' AND column_default IS NULL
    expect: rowcount_eq
    value: 1

  - name: post_source_check_present_and_not_valid
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conname='event_log_source_check' AND convalidated = false
    expect: rowcount_eq
    value: 1

  - name: post_source_index_present
    sql: |
      SELECT 1 FROM pg_indexes
       WHERE schemaname='public' AND indexname='idx_event_log_source'
    expect: rowcount_eq
    value: 1

  - name: post_xp_idempotency_index_present
    sql: |
      SELECT 1 FROM pg_indexes
       WHERE schemaname='public' AND indexname='uq_xp_events_user_reason_source'
    expect: rowcount_eq
    value: 1

  # ── 0b backfill assertions ──────────────────────────────────────────────────────────────────
  # Exactness, not coverage: EVERY batch-metadata row must be classified. A miss here means the
  # batch INSERT changed shape and the provenance column is already lying.
  - name: post_every_batch_row_classified
    sql: |
      SELECT 1 FROM public.event_log
       WHERE deleted_at IS NULL AND metadata ->> 'batch_id' IS NOT NULL AND source IS DISTINCT FROM 'app_batch'
    expect: rowcount_eq
    value: 0

  - name: post_every_status_change_row_classified
    sql: |
      SELECT 1 FROM public.event_log
       WHERE deleted_at IS NULL AND event_type = 'status_change'
         AND metadata ->> 'schema' = 'status_change.v1' AND source IS DISTINCT FROM 'app_status'
    expect: rowcount_eq
    value: 0

  # The backfill must NEVER manufacture 'direct'. A telemetry try/catch failure is indistinguishable
  # from a direct write, so 'direct' can only be set by a writer that KNOWS it bypassed the API.
  # If this ever trips, someone taught 0b to guess.
  # RE-BASELINED 2026-08-17 against ONE reviewed row, and the exclusion is by ID so the gate keeps
  # its teeth: any NEW direct write still trips it at rowcount 1.
  #
  # The row is `90eb96fc-e9ec-47d9-a48e-39833998fcbe` — a germination event on the Palla Rossa
  # Mavrik radicchio, written straight to Postgres 2026-08-17 11:35 ET with the note "Backdated from
  # recollection; sprouted with the 7/21 cabbage cohort."
  #
  # It is KEPT, not deleted, and its `source` is NOT rewritten. Both alternatives were considered
  # and rejected:
  #   * Hard-deleting it destroys real garden history — a germination date and a first-person note —
  #     and it cannot be faithfully re-created, because posting through the app path needs a Clerk
  #     bearer token minted by a React hook that no script can obtain. Deleting what you cannot
  #     restore to clear an alarm is the wrong trade, and it would violate the Soft-Delete-Only Rule.
  #   * Rewriting `source` to 'app' would make the row claim a provenance it does not have. The
  #     column exists precisely to record that this write bypassed the Lambda path. Falsifying it to
  #     turn a gate green is the failure this gate was built to catch.
  #
  # Verified before re-baselining — the write left NO functional residue:
  #   user_stats.total_events 14372 = live count 14372 (the handler recomputes as a full COUNT
  #     rather than incrementing, so it self-healed);
  #   garden_node.germinated_at = 2026-08-05 (set);
  #   entity_memory.last_event_at = the plant's newest event (cache current, not behind);
  #   xp_events = 0 for this event — and on 2026-08-17 the user logged 104 events against 23 XP
  #     grants, i.e. daily-capped, so an app-path write would almost certainly have granted nothing
  #     either. The XP residue is nil in practice.
  #
  # So what was actually broken was the DETECTOR, not the data: a permanently-red gate is a smoke
  # alarm nobody looks at. If a second id ever has to be added here, that is the signal to fix the
  # write path instead of widening the list again.
  - name: post_backfill_invented_no_direct_rows
    sql: |
      SELECT 1 FROM public.event_log
       WHERE source = 'direct'
         AND id <> '90eb96fc-e9ec-47d9-a48e-39833998fcbe'::uuid
    expect: rowcount_eq
    value: 0

  - name: post_schema_version_recorded
    sql: |
      SELECT 1 FROM public.schema_version
       WHERE version IN ('4.21.0-eventsource-001','4.21.1-eventsource-001-xpidem')
    expect: rowcount_eq
    value: 2

  # SEPARATE from the DDL gate above, on purpose. 0b is data-only, so it creates no object whose
  # existence proves it ran — and it DIDN'T run, for the whole of v3.97.0, while the DDL gate above
  # passed the entire time and the header of 0b read like a result. A DDL row and a backfill row
  # answer different questions and must be assertable separately.
  - name: post_backfill_ledger_row_recorded
    sql: |
      SELECT 1 FROM public.schema_version
       WHERE version = '4.21.3-eventsource-001-backfill'
    expect: rowcount_eq
    value: 1

  # The column is only worth having if it stays true. This asserts the FORWARD path, not history:
  # any status_change row written after the app_status writer deploys must carry the value. Scoped
  # to rows created after the backfill so it does not re-assert what post_every_status_change_row_
  # classified already covers. Expect 0 before the deploy too — there is simply nothing in range.
  - name: post_new_status_rows_carry_source
    sql: |
      SELECT 1 FROM public.event_log
       WHERE deleted_at IS NULL AND event_type = 'status_change'
         AND created_at > '2026-08-04 17:20:28.211257+00'::timestamptz
         AND source IS DISTINCT FROM 'app_status'
    expect: rowcount_eq
    value: 0
