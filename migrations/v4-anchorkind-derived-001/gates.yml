# gates.yml
# V4-ANCHORKIND-DERIVED-001 — widen harvest_watch_dismissal.anchor_kind to admit 'derived'.
#
# STATUS AT AUTHORING (2026-08-13): AUTHORED, NOT APPLIED anywhere. The authoring lane executed no
# DDL in any environment. Sequencing belongs to the orchestrator:
#   staging 0a -> rehearse 0r on staging -> re-apply 0a on staging -> prod 0a.
#
# NO ORDERING HAZARD IN EITHER DIRECTION. Widening a CHECK is the safe direction: the currently
# deployed Lambda writes only 'observed'/'sibling'/'calendar', every one of which stays legal, and
# validation runs against rows already inside the narrower old set. So this can land before or after
# any deploy. (The dangerous direction is the reverse — see 0r-rollback.sql, which is narrowing and
# refuses to run once real derived rows exist.)
#
# THIS MIGRATION IS INERT ON ARRIVAL. Nothing can write 'derived' into the column while
# lambda/harvests/watch.js DERIVED_ANCHOR_ENABLED is false. Applying it flips nothing and makes no
# derived row appear anywhere; it removes a 500 that would otherwise fire on the FIRST dismissal of
# a derived-anchored row after the flag flips (V4-ANCHORFLIP-001 condition 2 / consult flip-package
# item 2).
#
# CONTINUITY, per L-369. Two gates below assert APPLY-WINDOW facts — that no derived dismissal
# exists yet, and that the DDL step itself wrote no rows. Both become legitimately false the moment
# the flag flips and Dave taps "not yet" on a derived row, which is the SUCCESS case. They are
# marked `continuous: false` so the scheduled sweep skips them instead of going permanently red and
# training everyone to ignore the runner. The runner DEFAULTS to continuous: true, so this has to be
# stated explicitly on every such gate.

pre:
  - name: pre_dismissal_table_present
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name='harvest_watch_dismissal'
    expect: rowcount_eq
    value: 1

  - name: pre_anchor_constraint_present
    note: >
      The constraint must already exist under this exact name, because 0a's DROP ... IF EXISTS
      would otherwise silently succeed against a differently-named constraint and leave the old
      narrow one in place beside the new wide one — the table would still reject 'derived' and the
      post gate would be the first thing to notice.
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid = 'public.harvest_watch_dismissal'::regclass
         AND conname = 'harvest_watch_dismissal_anchor_chk'
         AND contype = 'c'
    expect: rowcount_eq
    value: 1

  - name: pre_anchor_constraint_still_narrow
    note: >
      Apply-window only. Proves 0a has not already run — after it has, this is false forever, which
      is the intended end state and not a regression.
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid = 'public.harvest_watch_dismissal'::regclass
         AND conname = 'harvest_watch_dismissal_anchor_chk'
         AND pg_get_constraintdef(oid) NOT LIKE '%derived%'
    expect: rowcount_eq
    value: 1
    continuous: false

post:
  - name: post_anchor_constraint_admits_derived
    note: >
      The whole point of the migration, asserted on the constraint DEFINITION rather than by
      attempting an insert — the gate runner is read-only by construction.
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid = 'public.harvest_watch_dismissal'::regclass
         AND conname = 'harvest_watch_dismissal_anchor_chk'
         AND contype = 'c'
         AND pg_get_constraintdef(oid) LIKE '%derived%'
    expect: rowcount_eq
    value: 1
    continuous: true

  - name: post_anchor_vocabulary_matches_impression
    note: >
      harvest_watch_dismissal (the calibration numerator) and watch_impression (its denominator)
      must agree on the anchor-kind vocabulary, or a derived row is recordable as an impression and
      not as a dismissal — the exact split this migration closes. Both are closed at watch.js
      TIER_RANK; adding a fifth tier there means widening BOTH, and this gate is what says so.
    sql: |
      WITH defs AS (
        SELECT conrelid::regclass::text AS tbl, pg_get_constraintdef(oid) AS def
          FROM pg_constraint
         WHERE contype = 'c'
           AND conname IN ('harvest_watch_dismissal_anchor_chk', 'watch_impression_anchor_chk')
      )
      SELECT tbl FROM defs
       WHERE def LIKE '%''observed''%' AND def LIKE '%''sibling''%'
         AND def LIKE '%''calendar''%' AND def LIKE '%''derived''%'
    expect: rowcount_eq
    value: 2
    continuous: true

  - name: post_sibling_constraints_untouched
    note: >
      Blast-radius receipt. 0a issues a DROP ... ADD against ONE constraint; the table's other
      CHECK (reason_chk) and its three indexes must be exactly as they were.
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid = 'public.harvest_watch_dismissal'::regclass
         AND conname = 'harvest_watch_dismissal_reason_chk'
         AND contype = 'c'
         AND pg_get_constraintdef(oid) LIKE '%not_yet%'
    expect: rowcount_eq
    value: 1
    continuous: true

  - name: post_ddl_wrote_no_rows
    note: >
      Additive-only receipt for the apply window: a pure constraint swap writes nothing, so no
      dismissal row's created_at may sit inside the apply hour. TIME-RELATIVE and therefore
      apply-window only (L-369) — a genuine user dismissal shortly before a scheduled sweep would
      red this for a reason that has nothing to do with the migration. continuous: false.
    sql: |
      SELECT 1 FROM public.harvest_watch_dismissal
       WHERE created_at > now() - interval '1 hour'
    expect: rowcount_eq
    value: 0
    continuous: false

  - name: post_no_derived_dismissals_yet
    note: >
      Inertness receipt for the apply window: this migration widens a vocabulary, it does not open
      the tier. While DERIVED_ANCHOR_ENABLED is false nothing can write 'derived'. EXPECTED to go
      false after the flag flips and the first derived row is dismissed — that is the success case,
      which is precisely why it must not run continuously (L-369).
    sql: |
      SELECT 1 FROM public.harvest_watch_dismissal
       WHERE anchor_kind = 'derived'
    expect: rowcount_eq
    value: 0
    continuous: false

# ROLLBACK (documentation only — gate_runner.py's strict schema admits ONLY pre/sweep/post as
# top-level keys and exits 2 on anything else, which would make every gate above silently
# unrunnable. Same defect fixed in v4-harvwatch-001 and v4-anchorbase-001 on 2026-08-12.)
# rollback:
#   file: 0r-rollback.sql
#   note: >
#     NARROWING, i.e. the dangerous direction. It contains a DO-block guard that RAISES rather than
#     letting the ADD CONSTRAINT fail opaquely if any row already carries anchor_kind='derived'.
#     Rehearse it on staging BEFORE applying 0a to prod — while staging is still clean, which is the
#     only window in which the rehearsal is meaningful. After a rehearsal, re-apply 0a.
#     Never delete derived rows to make the rollback run: they are calibration samples.
