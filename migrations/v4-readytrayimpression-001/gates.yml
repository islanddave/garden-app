# gates.yml
# V4-READYTRAYIMPRESSION-001 — public.ready_impression (the weigh-in tray impression log).
#
# STATUS: APPLIED TO BOTH DATABASES. Verified read-only against live prod and live staging
# 2026-09-07 (OPS-GATEFROZENCOUNT-001 follow-on):
#
#   prod     public.ready_impression  112 rows, 12 columns, shown_on 2026-08-18 .. 2026-08-24,
#                                     1 distinct user, 43 distinct plants
#   staging  public.ready_impression  0 rows, 12 columns
#
# All 10 schema-shape post gates pass on BOTH databases, under the owner role AND under garden_ro.
# post_starts_empty fails on prod at rowcount=112 — correctly; see its own note.
#
# There is NO schema_version row for this migration on either database, because 0a-additive-ddl.sql
# never writes one. Stated as an explicit negative so the next auditor does not read its absence as
# evidence of non-apply — the live relation is the receipt, and the first beacon row (2026-08-18)
# bounds the apply date.
#
# THE ORIGINAL STATUS LINE READ "STATUS AT AUTHORING (2026-08-17): AUTHORED, NOT APPLIED. Not
# applied to staging, not applied to prod." That went stale at the apply and was never revised, and
# it is not cosmetic: it is a stale exhaustive claim of exactly the kind that hid v4-carekey-001's
# dead verb. It cost real work — lane E's §E3 deferred this file on the strength of it, and the
# eleven `continuous` flags below then sat unflipped for three weeks while a live, growing table
# went unguarded by the nightly sweep. Corrected here rather than left for whoever reads it next.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# SEQUENCING
#
#   staging apply -> rehearse 0r-rollback -> re-apply to staging -> PROD apply -> dev push -> promote
#
# The DDL must reach STAGING BEFORE THE DEV PUSH: CI's integration job branches off staging and does
# NOT apply migrations, so a missing relation there presents as an infra flake, gets retried green,
# and stays hidden. It must ALSO reach PROD before the promote — the writer is non-fatal by
# construction (a failed insert returns 202 and logs a warning; the client never even reads the
# response), so a late migration breaks nothing, but every weigh-in session served before it lands
# is a day of denominator that no backfill can ever reconstruct (see 0r-rollback.sql).
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# GATE CLASSIFICATION (L-369 — decided at authoring, not after the first false red)
#
#   * Every post gate carried `continuous: false` at authoring because the migration was UNAPPLIED —
#     the scheduled sweep runs post gates against LIVE prod and would report a standing red until
#     the apply (convention per v4-watchimpression-001 / v4-weatherdaily-001).
#   * The SCHEMA-SHAPE gates (table/columns/constraints/index) stay true forever once applied: those
#     ten were FLIPPED to `continuous: true` 2026-09-07, the apply having been confirmed above. Each
#     was run against live prod AND live staging before its flag was moved, and each was then
#     mutation-proved to still be capable of going red. Ten flipped, one deliberately left dormant.
#   * post_starts_empty is PERMANENTLY window-scoped — never flip it. It is an L-369 category-1
#     emptiness assert: the tray's beacon populates this table from the first weigh-in session after
#     the Lambda ships, so its truth decays BY DESIGN the moment the feature runs.
#   * No time-relative gates and no data-expectation gates (L-369 categories 2 and 3): this
#     migration touches no existing relation, and impression counts are facts about how often Dave
#     opens a weigh-in session, not invariants of any environment.

pre:
  - name: pre_plants_present
    note: FK target. ready_impression.plant_id references public.plants(id).
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name='plants'
    expect: rowcount_eq
    value: 1

  - name: pre_plants_has_primary_key
    note: >
      A REFERENCES clause needs a unique constraint on the target. Reads pg_catalog, NOT
      information_schema.table_constraints — that view is privilege-filtered to the table owner and
      returns zero rows for garden_ro while the PK sits there perfectly healthy (v4-weatherdaily-001
      note, re-confirmed on live prod 2026-08-12).
    sql: |
      SELECT 1 FROM pg_class t
        JOIN pg_namespace n ON n.oid = t.relnamespace
        JOIN pg_index i ON i.indrelid = t.oid AND i.indisprimary
       WHERE n.nspname='public' AND t.relname='plants'
    expect: rowcount_eq
    value: 1

  - name: pre_table_absent
    note: Greenfield. If this returns a row, someone already applied 0a — stop and diff before re-running.
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name='ready_impression'
    expect: rowcount_eq
    value: 0

  - name: pre_watch_impression_untouched
    note: >
      The design decision this migration turns on: watch_impression is NOT widened. Its region CHECK
      must still carry exactly its own three values and no 'ready_tray'. If this gate ever fails,
      someone applied the rejected alternative and BOTH shapes are now live.
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid='public.watch_impression'::regclass
         AND conname='watch_impression_region_chk'
         AND pg_get_constraintdef(oid) NOT LIKE '%ready_tray%'
    expect: rowcount_eq
    value: 1

post:
  - name: post_table_present
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name='ready_impression'
    expect: rowcount_eq
    value: 1
    continuous: true    # armed 2026-09-07 — verified green on prod + staging, then mutation-proved

  - name: post_all_columns_present
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='ready_impression'
         AND column_name IN ('id','user_id','plant_id','shown_on','slot','region','source',
                             'model_version','overdue_ratio','days_since_last_harvest',
                             'repeat_interval_days','created_at')
    expect: rowcount_eq
    value: 12
    continuous: true    # armed 2026-09-07 — verified green on prod + staging, then mutation-proved

  - name: post_no_extra_columns
    note: >
      Paired with the gate above so the two together pin the column set EXACTLY. The IN-filter gate
      alone passes happily on a table that also grew a column nobody intended. This one is the
      other half: it asserts NO COLUMN EXISTS OUTSIDE the intended set, and projects the offender's
      name so a red says which column rather than only how many.

      DE-FROZEN 2026-09-07 (OPS-GATEFROZENCOUNT-001), completing the pass that de-froze
      ops-cueinstrument-001, v4-plantmerge-001, v4-watchimpression-001 and v4-weatherdaily-001 on
      2026-09-06. Until this edit the gate counted the table's columns UNFILTERED and asserted
      `value: 12` — an armed frozen TOTAL, which is a different and worse thing than the sibling's
      `value: 12` above (that one is the length of its own inline IN-list and cannot be moved by a
      column the list does not name). A frozen total reds on ANY widening, including a legitimate
      one, and the tempting repair — 12 -> 13 — silently re-freezes at the new number and teaches
      the next person to bump again. v4-dtmbasisvar-001:41 is the one that already fired
      (v_sow_candidates pinned at 33 columns, live 37, neutralised 2026-09-02). The NOT-IN form
      fails on precisely the same unintended column and accommodates an intended one by editing ONE
      list instead of a list plus a total. Allowlist verified against live prod AND staging
      2026-09-07: both carry exactly these 12 columns.

      That de-freeze was written while this gate was still `continuous: false` and therefore outside
      the scheduled sweep, so it could not red anything at the time. It is `continuous: true` as of
      2026-09-07 and IS now in the sweep — de-freezing it first is what made arming it safe, since
      the armed frozen TOTAL would have gone red in the sweep on the first legitimate widening.

      The allowlist must stay NULL-free: `x NOT IN (…, NULL)` is NULL for every x, so a single NULL
      element would make this gate return zero rows against ANY table shape and go vacuously green.
    sql: |
      SELECT column_name FROM information_schema.columns
       WHERE table_schema='public' AND table_name='ready_impression'
         AND column_name NOT IN ('id','user_id','plant_id','shown_on','slot','region','source',
                                 'model_version','overdue_ratio','days_since_last_harvest',
                                 'repeat_interval_days','created_at')
    expect: rowcount_eq
    value: 0
    continuous: true    # armed 2026-09-07 — verified green on prod + staging, then mutation-proved

  - name: post_no_created_by_column
    note: >
      Deliberate absence, not an oversight — same as watch_impression and weather_daily. The
      V4-OWNERSHIP-001 transfer trigger fires on created_by across 9 tables and reads NULL -> value
      as an ownership transfer; a table a client beacon batch-writes must stay outside that
      machinery. The user column is user_id (who was shown the tray).
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='ready_impression' AND column_name='created_by'
    expect: rowcount_eq
    value: 0
    continuous: true    # armed 2026-09-07 — verified green on prod + staging, then mutation-proved

  - name: post_shown_on_is_date_not_timestamp
    note: >
      Load-bearing. shown_on is contracted to be an ET CIVIL DAY. A timestamptz here would compile,
      write and read fine while silently re-anchoring the dedupe grain to UTC — splitting one
      evening's weigh-in across two "days" for five hours every night and double-counting exposure.
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='ready_impression'
         AND column_name='shown_on' AND data_type='date'
    expect: rowcount_eq
    value: 1
    continuous: true    # armed 2026-09-07 — verified green on prod + staging, then mutation-proved

  - name: post_check_constraints_present
    note: >
      region keeps the analysis honest about shown-vs-offered; source is the provenance flag recon
      §7c called a blocking prerequisite (model row vs recency fallback); the snapshot CHECK stops a
      client that drops the frozen model columns from producing rows that look fine and answer every
      calibration question with NULLs.
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid='public.ready_impression'::regclass AND contype='c'
         AND conname IN ('ready_impression_region_chk','ready_impression_source_chk',
                         'ready_impression_snapshot_chk')
    expect: rowcount_eq
    value: 3
    continuous: true    # armed 2026-09-07 — verified green on prod + staging, then mutation-proved

  - name: post_unique_guard_columns
    note: >
      The ON CONFLICT target the writer names: (user_id, plant_id, shown_on, region). Without it,
      every re-entry into a weigh-in session mints duplicate rows and "impressions per day" measures
      how often Dave opens the flow instead of exposure. Reads pg_catalog for the same
      owner-privilege reason as pre_plants_has_primary_key.
    sql: |
      SELECT 1
        FROM pg_constraint c
        JOIN LATERAL unnest(c.conkey) AS k(attnum) ON true
        JOIN pg_attribute a ON a.attrelid = c.conrelid AND a.attnum = k.attnum
       WHERE c.conrelid='public.ready_impression'::regclass AND c.contype='u'
         AND c.conname='uq_ready_impression_day'
         AND a.attname IN ('user_id','plant_id','shown_on','region')
    expect: rowcount_eq
    value: 4
    continuous: true    # armed 2026-09-07 — verified green on prod + staging, then mutation-proved

  - name: post_unique_guard_has_exactly_four_columns
    note: >
      Pairs with the gate above: that one proves the four expected columns are IN the key; this one
      proves nothing else is. A five-column key would satisfy the filtered gate and still break the
      writer's ON CONFLICT column-list target.
    sql: |
      SELECT 1
        FROM pg_constraint c
        JOIN LATERAL unnest(c.conkey) AS k(attnum) ON true
       WHERE c.conrelid='public.ready_impression'::regclass AND c.contype='u'
         AND c.conname='uq_ready_impression_day'
    expect: rowcount_eq
    value: 4
    continuous: true    # armed 2026-09-07 — verified green on prod + staging, then mutation-proved

  - name: post_fk_to_plants
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid='public.ready_impression'::regclass AND contype='f'
         AND confrelid='public.plants'::regclass
    expect: rowcount_eq
    value: 1
    continuous: true    # armed 2026-09-07 — verified green on prod + staging, then mutation-proved

  - name: post_plant_day_index_present
    note: >
      The analysis read shape (per-plant time series). A missing index never errors — it just makes
      the anti-join quietly awful — so its presence is asserted here rather than discovered in a
      query plan later.
    sql: |
      SELECT 1 FROM pg_indexes
       WHERE schemaname='public' AND tablename='ready_impression'
         AND indexname='idx_ready_impression_plant_day'
    expect: rowcount_eq
    value: 1
    continuous: true    # armed 2026-09-07 — verified green on prod + staging, then mutation-proved

  - name: post_starts_empty
    note: >
      PERMANENT apply-window gate — NEVER flip to continuous (L-369 category 1). The tray beacon
      populates this table from the first weigh-in session after the Lambda ships, so this assert is
      true only inside the apply window. It exists solely to prove the DDL itself seeded nothing.

      NO LONGER A PREDICTION — MEASURED. It is the one gate of the eleven that was NOT armed on
      2026-09-07, and the reason is on the record rather than argued: run read-only against live
      prod that day it returned `rowcount=112`, i.e. it is ALREADY RED and has been since the first
      beacon write on 2026-08-18. Arming it would have planted a permanent false red in the
      blocking nightly sweep. It read PASS on staging the same day only because staging has never
      received a beacon write (0 rows); that is an accident of traffic, not evidence of an
      invariant, and it will red there too the first time staging serves a weigh-in session. A
      green reading on ONE database is not grounds to flip this.
    sql: |
      SELECT 1 FROM public.ready_impression
    expect: rowcount_eq
    value: 0
    continuous: false   # PERMANENTLY window-scoped — the feature's own writer fills the table
                        # (L-369: emptiness asserts are never continuous)
