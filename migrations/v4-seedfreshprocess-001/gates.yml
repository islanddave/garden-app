# gates.yml
# V4-SEEDFRESHPROCESS-001 — inventory_items.seed_process gains 'fresh'.
#
# MOSTLY ENVIRONMENT-SYMMETRIC, with ONE deliberate exception. Every gate but one reads pg_constraint
# or counts rows against the base table, so it means the same thing on staging as on prod. The
# exception is post_prod_population_intact, which carries `env: prod` because its 200-row floor is a
# fact about prod's seed collection (267) and not about staging's (66) — two different populations,
# not one at two scales.
#   CORRECTED 2026-09-03: this header previously said "No `env: prod` anywhere" while
#   post_rowcount_undisturbed hardcoded a prod-scaled 200 with no scoping. The claim and the file
#   disagreed, and the file was wrong — that gate could never pass on staging.
#
# POST GATES SELF-ARM, in VIOLATION-COUNT shape (expect 0): green where unapplied, green where
# applied and intact, RED only on a genuine revert. post_check_accepts_fresh is the exception and
# carries `continuous: false` — it is an apply record, not a standing invariant.
#   THEY ARM OFF pg_constraint, NOT off schema_version, and that distinction was misread once so it
#   is worth stating. post_check_still_guards and post_no_invalid_process_values are green on an
#   unmigrated database by construction: the OLD check already names wet and dry and already forbids
#   anything outside the vocabulary. Neither needs a ledger row to know whether to fire, which makes
#   the catalogue a strictly better instrument here than `WHERE EXISTS (SELECT 1 FROM schema_version
#   WHERE version = ...)` — it observes the thing itself rather than a claim that the thing was done.
#   The missing schema_version INSERT (added to 0a on 2026-09-03) was a real defect for a different
#   reason — no durable apply record, and no `pre_not_already_applied` guard is writable without one —
#   but it was never why a gate here went red. That was post_rowcount_undisturbed's 200, on staging.
#
# WHAT THIS FILE IS ACTUALLY GUARDING. The dangerous property of a CHECK migration is not the apply,
# it is the WIDTH: a widen is safe on live data by construction, a narrow can refuse or orphan. So
# the post gates assert the constraint accepts all THREE values and still refuses a fourth — the
# second half matters, because "widened" and "removed" look identical if you only test acceptance.

pre:
  - name: pre_seed_process_check_exists
    note: >
      The constraint must exist to be replaced. Violation-count shape: 0 when present, 1 when
      missing, so this is 0 whenever the apply can succeed.
    sql: |
      SELECT 1
       WHERE (SELECT count(*) FROM pg_constraint
               WHERE conname = 'inventory_items_seed_process_check') <> 1
    expect: rowcount_eq
    value: 0

  - name: pre_no_fresh_rows_yet
    note: >
      Nothing can already be 'fresh' — the old CHECK forbids it. Asserted rather than assumed
      because a non-zero here would mean the constraint was already dropped by something else, and
      this migration would then be widening a table that is currently unguarded.
    sql: |
      SELECT 1 FROM public.inventory_items WHERE seed_process = 'fresh'
    expect: rowcount_eq
    value: 0
    continuous: false

post:
  - name: post_check_accepts_fresh
    note: >
      The apply record. The constraint definition must now name all three values. Read from
      pg_get_constraintdef rather than by attempting an INSERT, so the gate has no side effect on
      live data. continuous false — this is what the migration DID, not a standing invariant.
    sql: |
      SELECT 1
       WHERE (SELECT count(*) FROM pg_constraint
               WHERE conname = 'inventory_items_seed_process_check'
                 AND pg_get_constraintdef(oid) LIKE '%fresh%') <> 1
    expect: rowcount_eq
    value: 0
    continuous: false

  - name: post_check_still_guards
    note: >
      SELF-ARMING, and the half that stops a widen being mistaken for a removal. A constraint that
      was DROPPED and never re-added would pass any "does it accept 'fresh'" test, because an absent
      constraint accepts everything. This asserts the constraint still EXISTS and still names the two
      original values, so the only way to be green is to have widened it rather than deleted it.
      Violation count 0 whether or not this migration has run — before, it names wet+dry; after, it
      names wet+dry+fresh. RED only if someone drops or narrows it.
    sql: |
      SELECT 1
       WHERE (SELECT count(*) FROM pg_constraint
               WHERE conname = 'inventory_items_seed_process_check'
                 AND pg_get_constraintdef(oid) LIKE '%wet%'
                 AND pg_get_constraintdef(oid) LIKE '%dry%') <> 1
    expect: rowcount_eq
    value: 0

  - name: post_no_invalid_process_values
    note: >
      SELF-ARMING data gate, and it is the one that would catch a constraint dropped in prod by hand.
      Counts rows whose seed_process is outside the whole vocabulary. 0 before this migration (the
      old CHECK enforced it), 0 after (the new one does), and non-zero only if the column is being
      written without a guard.
    sql: |
      SELECT 1 FROM public.inventory_items
       WHERE seed_process IS NOT NULL
         AND seed_process NOT IN ('wet', 'dry', 'fresh')
    expect: rowcount_eq
    value: 0

  - name: post_rowcount_undisturbed
    note: >
      A CHECK change must not touch data, and this is the environment-agnostic half of that check:
      the seeds population must not be empty. It is deliberately NOT a frozen number — a frozen count
      breaks the first time Dave adds a packet, which trains people to bump the number instead of
      reading the gate.
      CORRECTED 2026-09-03. This gate previously asserted `< 200` with a note claiming it was "a
      non-zero floor" — the note described this rule and the SQL implemented a different, prod-scaled
      one. Measured the day it was caught: prod 267 seed rows, STAGING 66. So the gate could never
      pass on staging, and carrying neither `env: prod` nor `continuous: false` it would have redded
      `gate-invariants.yml`'s staging leg on every `migrations/**` push, permanently, for a database
      that was correctly migrated. A gate that cannot pass is not a strict gate; it is noise that
      teaches people to skim the gate run. Found by a peer session during the prod apply.
    sql: |
      SELECT 1
       WHERE (SELECT count(*) FROM public.inventory_items
               WHERE category = 'seeds' AND deleted_at IS NULL) = 0
    expect: rowcount_eq
    value: 0

  - name: post_prod_population_intact
    env: prod
    note: >
      The prod-scaled half, split out of post_rowcount_undisturbed rather than deleted with it. A
      non-zero floor alone would survive a migration that deleted four fifths of the seed rows, and
      on prod there IS a defensible order of magnitude to assert: the collection has stood in the
      200s all season (267 on 2026-09-03). 200 is a floor with real headroom beneath today's count,
      not a frozen equality, so ordinary additions and the occasional soft-delete never touch it.
      `env: prod` because the number is a fact about prod's collection and nothing else — staging
      holds 66 rows and is a different population, not a smaller copy of the same one. Scoping it is
      the honest fix; scaling one number to satisfy two unrelated datasets would not be.
    sql: |
      SELECT 1
       WHERE (SELECT count(*) FROM public.inventory_items
               WHERE category = 'seeds' AND deleted_at IS NULL) < 200
    expect: rowcount_eq
    value: 0
