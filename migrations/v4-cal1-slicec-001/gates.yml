# gates.yml
# V4-HARVDUAL-001 Slice C — real-sample tier + auto-capture.
#
# SEQUENCING (ORDERED). This migration completes v4-cal1-pervariety-001, which must be applied first
# (and whose 0a carried a blocking FK bug — see its header; it targeted the `cultivar` VIEW, which
# Postgres refuses):
#   1. CTAS: ctas_20260803_harvest_log_slicec, ctas_20260803_plant_varieties_slicec
#   2. pervariety-001 0a -> 0b -> 0d-seed-samples (generated by scripts/cal1/gen-cal1-seed.mjs)
#   3. this dir: 0a-resolver-v2 -> 0b-reference-revert -> 0c-backfill-basis -> 0d-validate -> 0f-autocapture
#   4. 0e-coverage (read-only) to confirm nothing moved
# 0c MUST precede 0d: before the backfill every live row has a weight with a NULL basis, so
# VALIDATE on chk_harvest_log_weight_basis_pairing fails on the first row it scans.
#
# ORDER vs THE LAMBDA (L-081): apply ALL of this before deploying the Lambda. The write paths now
# set weight_basis; against a database without that column they fail. Conversely, once the CHECKs
# are validated, a Lambda that does NOT set weight_basis raises 23514 on every harvest save — so
# these two must ship together, schema first.

pre:
  - name: pre_pervariety_objects_present
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public'
         AND table_name IN ('cultivar_weight_sample','cultivar_weight_void','cultivar_weight_derived')
    expect: rowcount_eq
    value: 3

  - name: pre_weight_basis_column_present
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='harvest_log' AND column_name='weight_basis'
    expect: rowcount_eq
    value: 1

  - name: pre_refweight_applied
    sql: |
      SELECT 1 FROM public.schema_version WHERE version='4.18.0-cal1-refweight-001'
    expect: rowcount_eq
    value: 1

post:
  # ── resolver v2 ──────────────────────────────────────────────────────────────
  - name: post_resolver_returns_three_columns
    sql: |
      SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
       WHERE n.nspname='public' AND p.proname='resolve_harvest_weight'
         AND pg_get_function_result(p.oid)
             = 'TABLE(weight_grams numeric, weight_estimated boolean, weight_basis text)'
    expect: rowcount_eq
    value: 1

  # !! RETIRED 2026-08-04 by migrations/v4-cal1-sampleconf-001 — DO NOT RE-RUN AGAINST A v3 DATABASE.
  # This gate encodes the defect that migration fixes. The claim below ("whatever the sample count")
  # rested on the first eight samples reading ~25% under catalog; at 21 samples the n=1 deltas are
  # noise spanning -92%..+83%, so a single weighing is NOT a better estimate than a curated figure.
  # Under v3 a derived row outranks the reference only when corroborated (confidence high/medium,
  # i.e. sample_n>=2, or sample_n>=5), and this gate fails by design on 16 of 18 rows. Its
  # replacement is v4-cal1-sampleconf-001/gates.yml :: post_provisional_does_not_outrank_reference
  # (plus post_corroborated_still_outranks_reference, which preserves the half of this that was right).
  #
  # A real sample must outrank the reference value for the same variety, whatever the sample count:
  # one weighing beats a catalog figure. min-n governs comparison, not best-available-estimate.
  - name: post_sample_tier_outranks_reference
    sql: |
      SELECT 1
        FROM public.plant_varieties v
        JOIN public.plants pl ON pl.variety_id = v.id AND pl.deleted_at IS NULL
        JOIN public.cultivar_weight_derived d ON d.cultivar_id = v.id AND d.unit = 'count'
        CROSS JOIN LATERAL public.resolve_harvest_weight(pl.id, 'count', 1, NULL) r
       WHERE v.deleted_at IS NULL
         AND (r.weight_basis <> 'cultivar' OR round(r.weight_grams, 4) <> round(d.grams_per_unit, 4))
    expect: rowcount_eq
    value: 0

  # A user-supplied weight always wins, and always reads as measured.
  - name: post_user_weight_wins
    sql: |
      SELECT 1 FROM public.resolve_harvest_weight(NULL,'count',5,337)
       WHERE weight_grams=337 AND weight_estimated=false AND weight_basis='measured'
    expect: rowcount_eq
    value: 1

  # ── provenance integrity across the whole table ──────────────────────────────
  - name: post_every_weight_has_a_basis
    sql: |
      SELECT 1 FROM public.harvest_log
       WHERE deleted_at IS NULL AND (weight_grams IS NULL) <> (weight_basis IS NULL)
    expect: rowcount_eq
    value: 0

  - name: post_basis_agrees_with_estimated_flag
    sql: |
      SELECT 1 FROM public.harvest_log
       WHERE weight_basis IS NOT NULL AND weight_estimated <> (weight_basis <> 'measured')
    expect: rowcount_eq
    value: 0

  # Only the CHECKs that are safe to arm before the Lambda ships. The two writer-coupled ones
  # (basis_pairing, basis_estimated) belong to 0g-recheck-after-lambda — arming them here 23514'd
  # every prod harvest save on 2026-08-03. See the README incident note.
  - name: post_pervariety_checks_validated
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conname IN ('chk_cws_unit_vocab','chk_cws_total_grams_pos','chk_cws_unit_count_pos',
                         'chk_harvest_log_weight_basis')
         AND convalidated
    expect: rowcount_eq
    value: 4

  # ── auto-capture ─────────────────────────────────────────────────────────────
  - name: post_autocapture_functions_present
    sql: |
      SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
       WHERE n.nspname='public'
         AND p.proname IN ('record_harvest_weight_sample','void_event_weight_samples')
    expect: rowcount_eq
    value: 2

  - name: post_sample_source_event_linked
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='cultivar_weight_sample'
         AND column_name='source_event_id'
    expect: rowcount_eq
    value: 1

  # The derived view must ignore samples whose source harvest was undone, or an undo would leave a
  # phantom measurement steering every future estimate for that variety.
  - name: post_derived_excludes_deleted_sources
    sql: |
      SELECT 1 FROM public.cultivar_weight_sample s
       JOIN public.event_log e ON e.id = s.source_event_id AND e.deleted_at IS NOT NULL
       JOIN public.cultivar_weight_derived d ON d.cultivar_id = s.cultivar_id AND d.unit = s.unit
       WHERE NOT EXISTS (SELECT 1 FROM public.cultivar_weight_void v WHERE v.sample_id = s.id)
    expect: rowcount_eq
    value: 0

  - name: post_schema_versions_recorded
    sql: |
      SELECT 1 FROM public.schema_version WHERE version IN
        ('4.20.0-cal1-slicec-001','4.20.1-cal1-slicec-revert-001',
         '4.20.2-cal1-slicec-basis-001','4.20.3-cal1-slicec-autocapture-001')
    expect: rowcount_eq
    value: 4
