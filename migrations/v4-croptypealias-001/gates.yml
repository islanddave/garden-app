# gates.yml
# V4-CROPTYPEALIAS-001 — adds nullable crop_types.search_aliases + populates 54 rows.
#
# ── THE ENVIRONMENT ASYMMETRY, FIRST, BECAUSE IT DETERMINES HOW TO READ EVERY GATE BELOW ─────────
# PROD CARRIES 150 crop_types; STAGING CARRIES 98 (measured 2026-08-28). A subset of the 54 target
# slugs does not exist on staging at all, so any count gate over them is smaller there — not wrong,
# just measuring a different population. Every gate that pins the number 54 therefore carries
# `env: prod`. The gates that assert SHAPE rather than population (the column exists; the excluded
# eight carry no alias; display_name was not touched) are correct on both and are left unscoped.
#
# The ALTER itself matters MORE on staging than on prod: integration CI forks its ephemeral Neon
# branch from STAGING and applies no migrations, so if the column is missing there, every test
# touching the search path fails the moment lambda/dashboard/handlers.js references it. Apply to
# both. post_column_exists is the gate that catches a staging-only omission.
#
# SELF-ARMING. gate-invariants.yml fires on the `migrations/**` push to dev, which happens BEFORE
# the apply, and runs `--phase post --continuous-only`. Every post gate below is therefore wrapped
# in an EXISTS on this migration's own schema_version row: vacuously true until applied, asserted
# forever after. Without the wrapper the sweep fails from the moment the file lands until the apply.
#
# CONTRADICTION CHECK (the bee_balm trap, L-372 family). Grepped the whole gate corpus for
# `search_aliases` and for `crop_types.*display_name`: ZERO gates reference the new column (it did
# not exist), and no gate pins a display_name VALUE. post_display_names_untouched below is therefore
# filling a genuine gap rather than duplicating a sibling — and it exists specifically because the
# alternative design for this feature WAS to edit display_name, so a future session reaching for that
# again is the realistic regression.
#
# THE VACUITY HAZARD AND WHERE IT IS CLOSED. post_excluded_six_have_no_alias is a violation count,
# and a violation count over rows that do not exist is also 0 — it cannot fail on staging for the
# slugs staging lacks. What closes it on prod is post_melon_receipt, which asserts a target tuple
# POSITIVELY, plus post_own_53_aliases_intact, which asserts this migration's own writes are still
# THERE rather than that no violation is present.
#
# Which of those two carries the weight depends on the invocation, and the sweep is the demanding
# one: post_melon_receipt is continuous:false, so it does NOT run in the `--phase post
# --continuous-only` pass gate-invariants.yml actually executes. In that mode post_own_53_aliases_
# intact is the ONLY positive assertion in this file and is load-bearing for every violation gate
# here. It must never be weakened into a violation count. A green run on staging proves the column
# shape and nothing about the data.

pre:
  # Existence of the target population. Stays true after the apply, so it is safe as a continuous
  # `pre` gate. env:prod because staging holds only a subset of these slugs.
  - name: pre_all_54_target_slugs_exist
    env: prod
    sql: |
      SELECT count(*) FROM public.crop_types
       WHERE deleted_at IS NULL
         AND slug IN (
           'geranium','melon','bean','tomatillo','sedum','coleus','fittonia','squash','beet','sage',
           'tradescantia','arugula','eggplant','collard','yarrow','calibrachoa','bay','bee_balm',
           'lemon_verbena','kohlrabi','okra','luffa','bitter_melon','cucamelon','foxglove',
           'japanese_maple','dogwood','pothos','spider_plant','christmas_cactus','crown_of_thorns',
           'lithops','winter_squash','pea','morning_glory','bok_choy','columbine','four_o_clock',
           'sunflower','artichoke','hollyhock','milkweed','poppy','stock','viola','edelweiss',
           'tweedia','blackberry_lily','dracaena','chard','mizuna','tatsoi','rhubarb','pineapple')
    expect: scalar_eq
    value: 54

post:
  # SHAPE — correct on both environments, and the one that catches a staging-only omission.
  # Not self-arming-wrapped: the column either exists or the code that reads it 500s, and that is
  # true the instant the ALTER runs regardless of the receipt row.
  - name: post_column_exists
    sql: |
      SELECT count(*) FROM information_schema.columns
       WHERE table_schema = 'public'
         AND table_name   = 'crop_types'
         AND column_name  = 'search_aliases'
    expect: scalar_eq
    value: 1

  # POPULATION — a RECEIPT FOR THIS MIGRATION'S OWN WRITES, not a census of the table.
  #
  # RE-SCOPED 2026-09-07, replacing `post_alias_row_count`. That gate counted every alias-bearing row
  # in crop_types and pinned one global total, which made a gate belonging to THIS migration a
  # function of every alias anywhere in the table — so unrelated work moved it and the only repair on
  # offer was to bump the number. It had already happened once: 54 -> 56 on 2026-08-29, and those two
  # extra rows were cilantro and thunbergia, written and owned by v4-croptypealias-002, not by this
  # migration. The comment that bump left behind ended "57 would be wrong". On 2026-09-07 prod
  # reached 57 legitimately — a new crop type `penstemon` gained the alias `beardtongue`, its
  # standard common name and precisely what this feature exists to make searchable. The alias was
  # right and the gate was wrong: a claim about the whole table, exhaustive when written and stale
  # the moment the table grew.
  #
  # WHY THE NEW FORM CANNOT DRIFT. The population is ENUMERATED, not queried open. A row can only
  # enter this count by being named in the VALUES list below, so no crop type created later — with
  # an alias or without one — can move it. That is the same closed-world shape as
  # pre_all_54_target_slugs_exist and post_display_names_untouched above and below it, the two gates
  # in this file that have never needed a bump, and the reason they haven't is structural not lucky.
  #
  # AND IT IS STRICTLY STRONGER, NOT WEAKER. The old gate tested only `search_aliases IS NOT NULL`,
  # so a session that overwrote melon's alias with garbage still passed it. This pins the VALUE of
  # every row it names, so a reword, a truncation, a soft-delete or a dropped row all red it. Pinning
  # values is also what preserves the anti-vacuity duty the header assigns this gate: it counts rows
  # that must BE there, so if the targets vanish the count falls, where a violation count would sit
  # silently at 0.
  #
  # 53 AND NOT 54. winter_squash is the one target whose value this migration no longer owns —
  # v4-croptypealias-002 appended 'pumpkin' by Dave's 2026-08-29 decision. Pinning the old value here
  # would be false, and pinning the new one would re-import the very cross-migration coupling this
  # re-scope removes. Its receipt is 002's post_winter_squash_alias_appended, which pins the entire
  # string, is continuous, and is unscoped — verified passing against prod AND staging 2026-09-07 —
  # so the row is not left uncovered. Any future amendment to a row below moves out the same way, to
  # a receipt in the migration that amends it: a deliberate act with evidence, not a number bump.
  #
  # env:prod is unchanged and for the unchanged reason — staging carries 98 crop_types to prod's 150
  # and holds only a subset of these slugs, so any count over them fails there permanently.
  # continuous is unchanged (default true), and per the header must stay that way.
  - name: post_own_53_aliases_intact
    env: prod
    sql: |
      SELECT count(*) FROM public.crop_types ct
        JOIN (VALUES
           ('geranium','pelargonium'), ('melon','cantaloupe, muskmelon, honeydew'),
           ('bean','green bean, snap bean, string bean'), ('tomatillo','husk tomato'),
           ('sedum','stonecrop'), ('coleus','plectranthus'),
           ('fittonia','nerve plant'), ('squash','zucchini, courgette'),
           ('beet','beetroot'), ('sage','salvia'),
           ('tradescantia','spiderwort, inch plant'), ('arugula','rocket'),
           ('eggplant','aubergine'), ('collard','collard greens'),
           ('yarrow','achillea'), ('calibrachoa','million bells'),
           ('bay','bay laurel'), ('bee_balm','monarda, bergamot'),
           ('lemon_verbena','aloysia'), ('kohlrabi','german turnip'),
           ('okra','lady''s finger, bhindi'), ('luffa','loofah, sponge gourd'),
           ('bitter_melon','bitter gourd, karela'), ('cucamelon','mouse melon, mexican sour gherkin'),
           ('foxglove','digitalis'), ('japanese_maple','acer'),
           ('dogwood','cornus'), ('pothos','devil''s ivy, epipremnum'),
           ('spider_plant','chlorophytum'), ('christmas_cactus','schlumbergera'),
           ('crown_of_thorns','euphorbia milii'), ('lithops','living stones'),
           ('pea','snap pea, snow pea, shelling pea'), ('morning_glory','ipomoea'),
           ('bok_choy','pak choi, pac choi'), ('columbine','aquilegia'),
           ('four_o_clock','mirabilis'), ('sunflower','helianthus'),
           ('artichoke','globe artichoke'), ('hollyhock','alcea'),
           ('milkweed','asclepias'), ('poppy','papaver'),
           ('stock','matthiola'), ('viola','pansy, johnny jump-up'),
           ('edelweiss','leontopodium'), ('tweedia','blue star, oxypetalum'),
           ('blackberry_lily','belamcanda, leopard lily'), ('dracaena','corn plant'),
           ('chard','swiss chard, silverbeet'), ('mizuna','japanese mustard'),
           ('tatsoi','spinach mustard'), ('rhubarb','rheum'),
           ('pineapple','ananas')
             ) AS owned(slug, aliases)
          ON owned.slug = ct.slug
         AND owned.aliases = ct.search_aliases
       WHERE ct.deleted_at IS NULL
         AND EXISTS (SELECT 1 FROM public.schema_version
                      WHERE version = '4.64.1-croptypealias-001')
    expect: scalar_eq
    value: 53

  # THE POSITIVE RECEIPT — the tuple that motivated the whole item. Asserts presence of a value
  # rather than absence of a violation, which is what makes the violation-count gates non-vacuous
  # on prod. continuous:false + env:prod, mirroring post_pea_row_actually_applied in
  # v4-peafirstyear-001: staging may not carry 'melon' and this must not fail there forever.
  - name: post_melon_receipt
    env: prod
    continuous: false
    sql: |
      SELECT count(*) FROM public.crop_types
       WHERE slug = 'melon'
         AND deleted_at IS NULL
         AND search_aliases = 'cantaloupe, muskmelon, honeydew'
    expect: scalar_eq
    value: 1

  # THE BLAST-RADIUS BOUND. Crop types deliberately EXCLUDED because the obvious synonym would be
  # wrong, and they are Dave's open decision — not an oversight to be tidied up later by a session
  # that notices they have no alias. Every one must STILL be NULL.
  #   marigold(calendula is a different genus) jade('money plant' collides with money_plant/Lunaria)
  #   delphinium(larkspur=Consolida) endive+radicchio(Cichorium overlap) carnation(dianthus broader)
  #
  # AMENDED 2026-08-29 by v4-croptypealias-002, and RENAMED because the number moved. Dave was walked
  # through all eight on 2026-08-29 and released three: cilantro -> 'coriander' and thunbergia ->
  # 'black-eyed susan vine' are no longer excluded and are dropped from this list; winter_squash was
  # never in it (see below). Five decisions remain, spanning six slugs because endive and radicchio
  # are two rows of one decision. Their receipts live in v4-croptypealias-002/gates.yml.
  - name: post_excluded_six_have_no_alias
    sql: |
      SELECT count(*) FROM public.crop_types
       WHERE deleted_at IS NULL
         AND slug IN ('marigold','jade','delphinium','endive','radicchio','carnation')
         AND search_aliases IS NOT NULL
         AND EXISTS (SELECT 1 FROM public.schema_version
                      WHERE version = '4.64.1-croptypealias-001')
    expect: scalar_eq
    value: 0

  # RETIRED 2026-08-29 — post_pumpkin_not_smuggled_into_any_alias.
  #
  # It asserted that 'pumpkin' appears in ZERO alias strings, because the winter_squash pumpkin
  # question was a categorisation call Dave had not made. He made it (2026-08-29): pumpkins are
  # winter squash and a search for pumpkin should surface the family.
  #
  # The gate is NOT simply deleted. Its guard is still wanted — a session appending 'pumpkin' to
  # squash, gourd or anything else is still a regression — so it is INVERTED and moved to
  # v4-croptypealias-002/gates.yml as `post_pumpkin_is_winter_squash_only`, which pins pumpkin to
  # exactly one row instead of zero. Deleting it outright would have thrown away the guard along with
  # the obsolete expectation, which is the failure this comment exists to prevent someone repeating.

  # DISPLAY_NAME UNTOUCHED. The whole reason this feature is a column is that display_name reaches
  # the text of a public Facebook/Instagram post (lambda/facebook-share/index.js:319). The realistic
  # regression is a future session "simplifying" this by folding aliases back into display_name.
  # Asserts the thirteen crops whose display name legitimately carries a parenthetical still read
  # exactly as they did before this migration — i.e. nothing was appended to any of them.
  - name: post_display_names_untouched
    env: prod
    sql: |
      SELECT count(*) FROM public.crop_types
       WHERE deleted_at IS NULL
         AND EXISTS (SELECT 1 FROM public.schema_version
                      WHERE version = '4.64.1-croptypealias-001')
         AND (slug, display_name) IN (
           ('bunching_onion', 'Onion (bunching / scallion)'),
           ('althaea',        'Althaea (Marshmallow)'),
           ('claytonia',      'Claytonia (Miner''s Lettuce)'),
           ('cobaea',         'Cobaea (Cup-and-Saucer Vine)'),
           ('haworthia',      'Haworthia / Gasteria'),
           ('helichrysum',    'Helichrysum (Licorice Plant)'),
           ('mache',          'Mache (Corn Salad)'),
           ('money_plant',    'Money Plant (Honesty)'),
           ('perilla',        'Perilla (Shiso)'),
           ('sempervivum',    'Sempervivum (Hens & Chicks)'),
           ('torenia',        'Torenia (Wishbone Flower)'),
           ('cherry',         'Cherry (sweet)'),
           ('sour_cherry',    'Cherry (tart)'))
    expect: scalar_eq
    value: 13
