# gates.yml
# V4-CAL1-REFWEIGHT-001 — reference (estimate) tier for harvest weight conversion.
#
# SEQUENCING (ORDERED — do not reorder, do not skip):
#   1. CTAS snapshots (crop_types, plant_varieties, harvest_log) — see 0a header.
#   2. pre gates -> 0a -> 0b-seed -> 0c-validate -> 0d-backfill -> post gates.
#      0c AFTER 0b on purpose: VALIDATE is then a real assertion over 408 seeded rows, not a
#      vacuous scan. 0d AFTER 0b because the backfill reads the seeded unit_weights.
#   3. 0e-coverage.sql (read-only) to report what landed.
#
# Nothing user-facing reads these columns yet; blast radius is confined to `SELECT *` consumers of
# crop_types / plant_varieties / harvest_log receiving extra keys (NULL before the seed).
#
# Pre:  substrate from v4-cal1-harvweight-001 present; none of the six new columns exist; CHECK names free.
# Post: six columns exist, NULLABLE, no default; six CHECKs exist AND convalidated; every seeded
#       unit_weights map is shape-legal; the harvweight pairing invariant still holds after the
#       backfill; no estimate was written without a positive weight; both schema_version rows present.

pre:
  # The estimate tier is layered on harvweight-001's substrate — without those four columns the
  # backfill has nowhere to write.
  - name: pre_harvweight_substrate_present
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public'
         AND ( (table_name='crop_types'  AND column_name IN ('default_unit','grams_per_unit'))
            OR (table_name='harvest_log' AND column_name IN ('weight_grams','weight_estimated')) )
    expect: rowcount_eq
    value: 4

  - name: pre_tables_present
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name IN ('crop_types','plant_varieties','harvest_log')
    expect: rowcount_eq
    value: 3

  # A name collision would mean this migration silently adopts someone else's column.
  - name: pre_new_columns_absent
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public'
         AND table_name IN ('crop_types','plant_varieties')
         AND column_name IN ('unit_weights','weight_source','weight_confidence')
    expect: rowcount_eq
    value: 0

  - name: pre_check_constraint_names_free
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conname IN ('chk_crop_types_unit_weights','chk_crop_types_weight_source',
                         'chk_crop_types_weight_confidence','chk_plant_varieties_unit_weights',
                         'chk_plant_varieties_weight_source','chk_plant_varieties_weight_confidence')
    expect: rowcount_eq
    value: 0

post:
  - name: post_six_columns_present
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public'
         AND table_name IN ('crop_types','plant_varieties')
         AND column_name IN ('unit_weights','weight_source','weight_confidence')
    expect: rowcount_eq
    value: 6

  # NULL = UNKNOWN stays the central contract; a NOT NULL or DEFAULT would break it structurally.
  - name: post_columns_nullable_and_defaultless
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public'
         AND table_name IN ('crop_types','plant_varieties')
         AND column_name IN ('unit_weights','weight_source','weight_confidence')
         AND (is_nullable <> 'YES' OR column_default IS NOT NULL)
    expect: rowcount_eq
    value: 0

  - name: post_six_checks_present_and_validated
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conname IN ('chk_crop_types_unit_weights','chk_crop_types_weight_source',
                         'chk_crop_types_weight_confidence','chk_plant_varieties_unit_weights',
                         'chk_plant_varieties_weight_source','chk_plant_varieties_weight_confidence')
         AND convalidated
    expect: rowcount_eq
    value: 6

  # Belt-and-braces over the CHECK: no seeded map may carry an out-of-vocab unit or a non-positive
  # value. A dead key is silently unreachable data; a non-positive factor corrupts a yield total.
  - name: post_unit_weights_all_shape_legal
    sql: |
      SELECT 1 FROM (
        SELECT unit_weights AS w FROM public.crop_types      WHERE unit_weights IS NOT NULL
        UNION ALL
        SELECT unit_weights      FROM public.plant_varieties WHERE unit_weights IS NOT NULL
      ) s, LATERAL jsonb_each(s.w) AS e(k,v)
       WHERE k NOT IN ('lb','oz','kg','g','count','bunch','cup','head')
          OR jsonb_typeof(v) <> 'number'
          OR (v#>>'{}')::numeric <= 0
    expect: rowcount_eq
    value: 0

  # The seed must never claim a measurement it does not have.
  #
  # continuous: false ADDED 2026-08-10 (gate-invariants backlog triage). "Was written by the seed" is
  # inferred here from `updated_at >= applied_at`, which is a valid proxy only DURING the apply
  # window — the identical construction that left v4-carecacheundo-001 red at 88 rows. Any later
  # legitimate write to plant_varieties satisfies the proxy while having nothing to do with the seed.
  # Measured 2026-08-10 on prod: 1 row, "Allegheny Blackberry" (weight_source='measured',
  # unit_weights={"cup":144,"count":0.7}), updated 2026-08-06 17:16:37Z — nine days after this seed
  # applied, by a later data-entry pass, not by this migration.
  - name: post_seed_never_claims_measured
    continuous: false
    sql: |
      SELECT 1 FROM public.plant_varieties
       WHERE weight_source = 'measured' AND unit_weights IS NOT NULL
         AND updated_at >= (SELECT applied_at FROM public.schema_version
                             WHERE version='4.18.1-cal1-refweight-seed-001')
    expect: rowcount_eq
    value: 0

  # harvweight-001's pairing invariant must survive the backfill.
  - name: post_weight_pairing_still_holds
    sql: |
      SELECT 1 FROM public.harvest_log
       WHERE (weight_grams IS NULL) <> (weight_estimated IS NULL)
    expect: rowcount_eq
    value: 0

  # No zero/negative weight may have been derived.
  - name: post_no_nonpositive_estimated_weight
    sql: |
      SELECT 1 FROM public.harvest_log
       WHERE weight_estimated IS TRUE AND (weight_grams IS NULL OR weight_grams <= 0)
    expect: rowcount_eq
    value: 0

  # The backfill must not have invented a MEASURED row.
  #
  # REWRITTEN 2026-08-10 (gate-invariants backlog triage), replacing
  # `post_measured_only_from_weight_units`. The anti-invention intent is kept; the UNIT premise it
  # rested on was superseded by a later, deliberate design decision in the same slice.
  #
  #   WHAT IT USED TO ASSERT: "weight_estimated=false is only legal for a harvest actually logged in
  #   a weight unit" — SELECT ... WHERE weight_estimated IS FALSE AND unit NOT IN ('g','kg','lb','oz').
  #   v4-cal1-slicec-001 then established the opposite rule in its own gates: "A user-supplied weight
  #   always wins, and always reads as measured", for ANY unit. Logging 10 tomatoes and weighing the
  #   pile at 2777 g is a real measurement recorded against unit='count'. The evidence that this was
  #   never a drift signal: on prod the old query returned 135 rows, and prod holds exactly 135
  #   measured rows in total — it failed 100% of the population it was meant to police, every one of
  #   them carrying a non-NULL weight_grams. It had become a statement about UNITS, not about
  #   invention.
  #
  #   WHAT IT NOW ASSERTS: the same claim, against the relation that actually decides it. A row may
  #   not read MEASURED unless it carries the 'measured' basis (which means a user supplied the
  #   weight) and an actual weight value — and, non-vacuously, the three coupling CHECKs that make
  #   that implication un-forgeable must still be present AND VALIDATED. The data half alone would
  #   be implied by those CHECKs and therefore vacuous; the constraint half is what would go red if
  #   someone dropped or NOT VALID'd them, which is the only way an invented measured row could
  #   actually be written. Neither pins a count, id, unit vocabulary or date.
  #   Measured 2026-08-10: 0 rows / 3 constraints on prod, same on staging.
  - name: post_measured_claim_is_structurally_enforced
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid = 'public.harvest_log'::regclass
         AND contype = 'c' AND convalidated
         AND conname IN ('chk_harvest_log_weight_pairing',
                         'chk_harvest_log_weight_basis_pairing',
                         'chk_harvest_log_weight_basis_estimated')
    expect: rowcount_eq
    value: 3

  - name: post_no_measured_row_without_a_supplied_weight
    sql: |
      SELECT h.id FROM public.harvest_log h
       WHERE h.weight_estimated IS FALSE
         AND (h.weight_basis IS DISTINCT FROM 'measured' OR h.weight_grams IS NULL)
    expect: rowcount_eq
    value: 0

  - name: post_schema_version_ddl_recorded
    sql: |
      SELECT 1 FROM public.schema_version WHERE version='4.18.0-cal1-refweight-001'
    expect: rowcount_eq
    value: 1

  - name: post_schema_version_seed_recorded
    sql: |
      SELECT 1 FROM public.schema_version WHERE version='4.18.1-cal1-refweight-seed-001'
    expect: rowcount_eq
    value: 1
