# gates.yml
# V4-GRAMSPOLICY-001 — clear variety_grams_required on the measurably uniform crops.
#
# ONE FILE, ONE DECISION, ONE TRANSACTION.
#   0a-flip.sql      guarded UPDATE of one boolean on at most 4 crop_types rows. `pre` -> `post`.
#   0r-rollback.sql  restores the exact captured per-crop prior values from the 0a snapshot.
#
# BOTH ENVIRONMENTS. Per the house rule, apply to staging AND prod before pushing migrations/**, and
# run the whole gate corpus, not only this directory's.
#
# ── ENV NOTE: THE TWO SIDES ARE EXPECTED TO DIVERGE, AND THAT IS THE MIGRATION WORKING ───────────
# 0a does not hardcode a flip; its WHERE clause re-derives the evidence per unit against the database
# it is applied to and withholds any nominated crop that fails. Verified live read-only 2026-08-16:
#   prod     137 live crop types. arugula, bean, beet, squash all clear both tests -> 4 rows flip.
#   staging   86 live crop types, a PRE-CROPSPLIT-001 snapshot. `bean` does not exist at all (clean
#             no-op, cf. v4-pepperreffix-001). `squash` still holds the WINTER cultivars — Pink
#             Banana 6800 g, PA Dutch Crookneck 4500 g, Red Kuri 1600 g, spread 4.25x, against a
#             200 g crop figure that is 0.047x the variety mean — so it fails BOTH tests and is
#             withheld with a WARNING. arugula and beet flip -> 2 rows.
# Gates that name a per-env row count are therefore env-scoped. The invariants that hold on a partial
# catalogue (no high-variance crop flipped; nothing outside the nominated set moved) run on both.
#
# ── NO LAMBDA ORDERING CONSTRAINT ───────────────────────────────────────────────────────────────
# variety_grams_required has exactly one reader: the tier-6 arm of public.resolve_harvest_weight
# (live on prod = v5, migrations/v4-cal1-indep-001/0b-resolver-v5.sql). No JS or TS reads it — the
# Lambda write paths select rw.weight_grams/weight_basis out of a LATERAL call and never inspect the
# flag. Old and new Lambda code behave identically across this change, in both directions.
#
# ── NO HISTORY MOVES ────────────────────────────────────────────────────────────────────────────
# The resolver is STABLE and runs at WRITE time, so stored harvest_log rows are frozen at their
# write and a policy change cannot move them. The only re-derivation path is the manual
# scripts/harvest-weight-ratchet.sh. post_no_stored_weight_moved asserts the outcome rather than
# trusting that reasoning.

pre:
  - name: pre_not_yet_applied
    sql: |
      SELECT 1 FROM public.schema_version WHERE version = '4.23.17-gramspolicy-001'
    expect: rowcount_eq
    value: 0

  # The defect, stated as a query: crops holding an unusable crop-type figure because the flag gates
  # tier 6 shut. 77 on prod at analysis time. Asserted as "many", not as an exact count, so the gate
  # survives a curator adding one more figure between analysis and apply.
  - name: pre_flag_is_stranding_crop_figures
    env: prod
    sql: |
      SELECT 1 FROM public.crop_types
       WHERE deleted_at IS NULL AND variety_grams_required
         AND unit_weights IS NOT NULL AND unit_weights <> '{}'::jsonb
    expect: rowcount_gte
    value: 50

  - name: pre_all_four_nominated_crops_exist_and_are_gated
    env: prod
    sql: |
      SELECT 1 FROM public.crop_types
       WHERE deleted_at IS NULL AND variety_grams_required
         AND slug = ANY (ARRAY['arugula','bean','beet','squash'])
    expect: rowcount_eq
    value: 4

  # The staging half of the same fact, so a silently-empty staging apply is distinguishable from a
  # correct partial one. bean is absent there; the other three exist and are gated.
  - name: pre_staging_holds_three_of_the_four
    env: staging
    sql: |
      SELECT 1 FROM public.crop_types
       WHERE deleted_at IS NULL AND variety_grams_required
         AND slug = ANY (ARRAY['arugula','bean','beet','squash'])
    expect: rowcount_eq
    value: 3

  # The reason squash must be decided at apply time and not hardcoded. On staging this returns a row;
  # on prod it returns none, because CROPSPLIT-001 moved the winter cultivars to winter_squash.
  - name: pre_squash_variance_differs_between_environments
    env: staging
    sql: |
      SELECT 1
        FROM public.plant_varieties v, jsonb_each(v.unit_weights) e
       WHERE v.deleted_at IS NULL AND v.crop_type_slug = 'squash' AND e.key = 'count'
      HAVING max((e.value #>> '{}')::numeric) / nullif(min((e.value #>> '{}')::numeric),0) > 1.25
    expect: rowcount_eq
    value: 1

post:
  - name: post_applied
    sql: |
      SELECT 1 FROM public.schema_version WHERE version = '4.23.17-gramspolicy-001'
    expect: rowcount_eq
    value: 1

  - name: post_prod_all_four_flipped
    env: prod
    sql: |
      SELECT 1 FROM public.crop_types
       WHERE deleted_at IS NULL AND NOT variety_grams_required
         AND slug = ANY (ARRAY['arugula','bean','beet','squash'])
    expect: rowcount_eq
    value: 4

  # The whole point of the apply-time predicate, asserted on the environment that exercises it.
  - name: post_staging_withheld_squash
    env: staging
    sql: |
      SELECT 1 FROM public.crop_types
       WHERE deleted_at IS NULL AND slug = 'squash' AND variety_grams_required
    expect: rowcount_eq
    value: 1

  - name: post_staging_flipped_exactly_arugula_and_beet
    env: staging
    sql: |
      SELECT 1 FROM public.crop_types
       WHERE deleted_at IS NULL AND NOT variety_grams_required
         AND slug = ANY (ARRAY['arugula','bean','beet','squash'])
    expect: rowcount_eq
    value: 2

  # ── THE HEADLINE INVARIANT: no crop with a high-variance unit may end up flipped. ───────────────
  # Re-derives test 1 from scratch over EVERY flipped crop, not just the four nominated, so it also
  # catches a pre-existing bad flip being newly justified by this migration's presence. It is scoped
  # to units the crop can actually price, because an unpriceable unit cannot cause a wrong weight.
  # NOTE: this gate is expected RED on prod today for reasons that predate this migration — see
  # post_preexisting_flips_are_out_of_scope below. It is env-scoped to staging for that reason and
  # the prod finding is carried as an explicit ask, not silenced.
  - name: post_no_flipped_crop_has_a_high_variance_priceable_unit
    env: staging
    sql: |
      SELECT ct.slug
        FROM public.crop_types ct
       CROSS JOIN LATERAL jsonb_each(ct.unit_weights) u
       WHERE ct.deleted_at IS NULL AND NOT ct.variety_grams_required
         AND (SELECT max((e.value #>> '{}')::numeric) / nullif(min((e.value #>> '{}')::numeric),0)
                FROM public.plant_varieties v, jsonb_each(v.unit_weights) e
               WHERE v.deleted_at IS NULL AND v.crop_type_slug = ct.slug AND e.key = u.key
              HAVING count(*) >= 2) > 1.25
    expect: rowcount_eq
    value: 0

  # The same invariant restricted to what THIS migration changed. Green on both environments. This is
  # the gate that actually defends the change; the one above defends the whole table and is
  # informational on prod until the pre-existing flips are resolved.
  - name: post_nothing_this_migration_flipped_has_a_high_variance_unit
    sql: |
      SELECT ct.slug
        FROM public.crop_types_vgr_snapshot_gramspolicy_001 s
        JOIN public.crop_types ct ON ct.slug = s.slug AND ct.deleted_at IS NULL
       CROSS JOIN LATERAL jsonb_each(ct.unit_weights) u
       WHERE NOT ct.variety_grams_required AND s.prior_value
         AND (SELECT max((e.value #>> '{}')::numeric) / nullif(min((e.value #>> '{}')::numeric),0)
                FROM public.plant_varieties v, jsonb_each(v.unit_weights) e
               WHERE v.deleted_at IS NULL AND v.crop_type_slug = ct.slug AND e.key = u.key
              HAVING count(*) >= 2) > 1.25
    expect: rowcount_eq
    value: 0

  # Test 2, re-derived over the same set: the number now in play must agree with the varieties it
  # stands in for. This is what kept radish (0.40x) and pea (0.80x) out.
  - name: post_flipped_crop_figures_agree_with_their_varieties
    sql: |
      SELECT ct.slug
        FROM public.crop_types_vgr_snapshot_gramspolicy_001 s
        JOIN public.crop_types ct ON ct.slug = s.slug AND ct.deleted_at IS NULL
       CROSS JOIN LATERAL jsonb_each(ct.unit_weights) u
       WHERE NOT ct.variety_grams_required AND s.prior_value
         AND (u.value #>> '{}')::numeric
             / nullif((SELECT avg((e.value #>> '{}')::numeric)
                         FROM public.plant_varieties v, jsonb_each(v.unit_weights) e
                        WHERE v.deleted_at IS NULL AND v.crop_type_slug = ct.slug AND e.key = u.key),0)
             NOT BETWEEN 0.85 AND 1.15
    expect: rowcount_eq
    value: 0

  # The high-variance crops this migration exists to NOT touch. tomato count is 68x measured across
  # 31 cultivars and pepper count 155x across 22; if either is ever flipped, every uncurated cultivar
  # of that crop starts pricing at the crop mean and Dave's totals silently absorb it.
  - name: post_tomato_and_pepper_still_gated
    sql: |
      SELECT 1 FROM public.crop_types
       WHERE deleted_at IS NULL AND slug IN ('tomato','pepper') AND variety_grams_required
    expect: rowcount_eq
    value: 2

  - name: post_only_nominated_crops_moved
    sql: |
      SELECT ct.slug FROM public.crop_types ct
       WHERE ct.deleted_at IS NULL AND NOT ct.variety_grams_required
         AND ct.slug <> ALL (ARRAY['arugula','bean','beet','squash',
                                   'basil','blueberry','broccoli','bunching_onion',
                                   'lettuce','red_raspberry','wineberry'])
    expect: rowcount_eq
    value: 0

  # ── HISTORY DID NOT MOVE ───────────────────────────────────────────────────────────────────────
  # The resolver runs at write time, so this should be structurally impossible. Asserted anyway,
  # because "structurally impossible" is exactly the claim a gate is for. Compares every live
  # non-measured row's STORED weight against what the resolver returns for it now; 0 disagreements
  # both before and after, verified read-only on prod 2026-08-16 over 368 rows.
  #
  # env: prod because staging carries FOUR pre-existing synthetic fixture rows
  # (f0571000-0000-4000-8000-00000000000{3,4,5,7}) that already disagree: three point at plants that
  # no longer exist so the resolver returns NULL, and one stores a rounded 15000 g against the exact
  # 33 lb -> 14968.54 g conversion. None has a variety or crop type, so none can be touched by a
  # variety_grams_required change. Running this gate unscoped on staging would leave it permanently
  # red for a reason this migration did not cause, which is how a real regression gets ignored.
  # post_staging_drift_is_still_only_the_known_fixtures keeps the staging side defended.
  - name: post_no_stored_weight_moved
    env: prod
    sql: |
      SELECT h.id
        FROM public.harvest_log h
        JOIN public.event_log e ON e.id = h.event_id AND e.deleted_at IS NULL
       CROSS JOIN LATERAL public.resolve_harvest_weight(e.plant_id, h.unit, h.quantity, NULL) rw
       WHERE h.deleted_at IS NULL
         AND NOT (h.weight_estimated IS FALSE AND h.unit NOT IN ('g','kg','lb','oz'))
         AND (h.weight_grams IS DISTINCT FROM rw.weight_grams
           OR h.weight_basis IS DISTINCT FROM rw.weight_basis)
    expect: rowcount_eq
    value: 0

  # Staging's half of the same invariant, stated as a delta rather than an absolute so it stays
  # sensitive: the drift set must remain exactly the four known fixtures. A fifth row appearing —
  # which is what a real regression would look like — fails this.
  - name: post_staging_drift_is_still_only_the_known_fixtures
    env: staging
    sql: |
      SELECT h.id
        FROM public.harvest_log h
        JOIN public.event_log e ON e.id = h.event_id AND e.deleted_at IS NULL
       CROSS JOIN LATERAL public.resolve_harvest_weight(e.plant_id, h.unit, h.quantity, NULL) rw
       WHERE h.deleted_at IS NULL
         AND NOT (h.weight_estimated IS FALSE AND h.unit NOT IN ('g','kg','lb','oz'))
         AND (h.weight_grams IS DISTINCT FROM rw.weight_grams
           OR h.weight_basis IS DISTINCT FROM rw.weight_basis)
         AND h.id <> ALL (ARRAY['f0571000-0000-4000-8000-000000000003',
                                'f0571000-0000-4000-8000-000000000004',
                                'f0571000-0000-4000-8000-000000000005',
                                'f0571000-0000-4000-8000-000000000007']::uuid[])
    expect: rowcount_eq
    value: 0

  - name: post_weight_pairing_invariant_intact
    sql: |
      SELECT 1 FROM public.harvest_log
       WHERE deleted_at IS NULL AND (weight_grams IS NULL) <> (weight_basis IS NULL)
    expect: rowcount_eq
    value: 0

  # The rollback's only input. If 0a ran and this is empty, the rollback path is gone.
  - name: post_snapshot_captured_the_prior_state
    sql: |
      SELECT 1 FROM public.crop_types_vgr_snapshot_gramspolicy_001
    expect: rowcount_gte
    value: 1

  # ═══ OPEN FINDING — NOT SILENCED, NOT FIXED BY THIS MIGRATION. NEEDS DAVE. ═══
  #
  # Three of the seven crops that were already variety_grams_required = false fail the very tests
  # this migration applies to new flips (prod, 2026-08-16):
  #   broccoli        head 8.33x curated / 1.57x measured over 2 cultivars; 12 harvests, 4,045 g
  #   lettuce         count+head 3.00x over 12 varieties
  #   bunching_onion  count 2.00x over 3 varieties
  # A further three (blueberry, red_raspberry, wineberry) were flipped on a single curated variety —
  # no measured variance at all, which under this migration's thin-evidence rule is not evidence of
  # uniformity. Only basil (cup 1.20x over 7 varieties) would qualify today.
  #
  # Reverting them is a DIFFERENT decision from the one Dave made ("flip only uniform crops" is about
  # what to flip, not about what to un-flip) and it would newly strand weights that currently resolve,
  # so it is deliberately NOT bundled here. Carried as a gate so the finding cannot be lost: it is
  # RED on prod by design and documents the exact set. Do not edit it to pass — resolve the finding.
  - name: post_preexisting_flips_are_out_of_scope
    env: prod
    note: >
      DELIBERATELY RED. Documents the three pre-existing flips (broccoli, lettuce, bunching_onion)
      that fail this migration's own uniformity test. Out of scope for V4-GRAMSPOLICY-001, which
      Dave scoped to which crops to flip. Awaiting a separate decision; see README-BUILD.md
      "What needs Dave's sign-off".
    sql: |
      SELECT ct.slug
        FROM public.crop_types ct
       CROSS JOIN LATERAL jsonb_each(ct.unit_weights) u
       WHERE ct.deleted_at IS NULL AND NOT ct.variety_grams_required
         AND ct.slug <> ALL (ARRAY['arugula','bean','beet','squash'])
         AND (SELECT max((e.value #>> '{}')::numeric) / nullif(min((e.value #>> '{}')::numeric),0)
                FROM public.plant_varieties v, jsonb_each(v.unit_weights) e
               WHERE v.deleted_at IS NULL AND v.crop_type_slug = ct.slug AND e.key = u.key
              HAVING count(*) >= 2) > 1.25
    expect: rowcount_eq
    value: 0
