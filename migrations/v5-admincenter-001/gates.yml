# gates.yml
# V5-ADMINCENTER-001 — user_notification_prefs.nav_tabs, the bottom nav's tab order per user.
#
# ⛔ STATUS AT AUTHORING (2026-09-08): AUTHORED ONLY. Staging NOT applied. Prod NOT applied.
#    The lane that wrote this was instructed to author and stop. Do not apply from a lane branch.
#    Nothing in this row has been run against any database.
#
# NO 0b. Nothing to migrate: this capability has never existed on the server or on a device, and
# NULL already means "the shipped default order", which is byte-identical to today's behaviour.
#
# SEQUENCING — the migration goes first, BOTH environments, before the dev push that teaches the
# critter Lambda about the column:
#   staging 0a -> staging gates -> rehearse 0r -> re-apply 0a -> deploy-staging
#     -> prod 0a -> prod gates -> promote.
# The Lambda change is a SEPARATE, LATER step and it is two edits, both of which must land after the
# DDL is in BOTH environments:
#   1. lambda/critter/validators.js — add 'nav_tabs' to HAS_UPDATABLE with an array/shape check.
#   2. lambda/critter/index.js — add nav_tabs to readUserPrefs' SELECT list, to the prefs upsert's
#      column list and COALESCE arms (cast ${nt}::jsonb at EVERY binding site, per the today_skipped
#      note there — a bare NULL parameter has no inferable type), and to the RETURNING list.
#      That route's admin gate goes in with it: writes to nav_tabs are refused 403 unless the caller's
#      sub is in ADMIN_CLERK_SUBS, fail-closed when the variable is empty (lambda/ux-events/index.js:74
#      is the house pattern). The client already renders a neutral placard on that 403.
# Landing either Lambda edit against a database without the column is the L-081 incident verbatim,
# and the SELECT-list half is the worse direction: it 500s EVERY prefs read, which is eight surfaces
# plus the nav config read, not just this feature.
#
# EXPOSURE IS THE LOWEST OF ANY MIGRATION ON THIS TABLE. The SPA half ships first and does not depend
# on the column at all: it reads prefs.nav_tabs, gets undefined, and renders the shipped bar — which
# is what it also does for a null value, a malformed value, and a failed GET. saveNavTabs sends
# nav_tabs as the ONLY key in its PATCH, so before the allowlist change the server answers 400 "no
# updatable fields present" and the admin page states that plainly. A partial apply therefore
# degrades to "the tab order does not follow you to another device", never to a 500 and never to an
# empty nav.
#
# COUNT DISCIPLINE — the scope statement for every predicate in this file.
# public.user_notification_prefs HAS NO deleted_at COLUMN. It is a per-Clerk-sub preference row keyed
# by primary key with no soft-delete concept (migrations/v2-mvp-critter/0a-additive-ddl.sql), so
# "live rows" and "all rows" are the same set and a `deleted_at IS NULL` filter would not parse. That
# claim is not left as a comment: pre_userprefs_has_no_deleted_at below ASSERTS it, so if a later
# migration ever adds soft-delete to this table these gates go red and get re-scoped rather than
# silently counting deleted rows. (The rule exists because a "verified" panel brief once counted 466
# rows where the app counts 444 — learning/error-log.md E-garden-seedvault-20260903-001.)
#
# NO PROD-DERIVED ABSOLUTES. Staging and prod hold different user rows; every gate here is a
# structural or shape assertion, and no gate pins a row count.
#
# Pre:  the table exists, is a TABLE, has no deleted_at, and does not yet have the column.
# Sweep: no stored value is a non-array, and no array holds a non-string element. Both self-arming
#        via to_jsonb, both VACUOUS until a writer exists — see the warning on each.
# Post: column present and jsonb, shape CHECK present AND validated, still nullable with no DEFAULT.

pre:
  - name: pre_userprefs_table_present
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name='user_notification_prefs'
    expect: rowcount_eq
    value: 1

  # Not ceremony: if this table were ever a view over another, adding a column to the base table
  # would leave it invisible to every app surface (the public.cultivar / garden_node failure mode),
  # and this migration's "no view widen required" claim would be false.
  - name: pre_userprefs_is_a_table_not_a_view
    sql: |
      SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
       WHERE n.nspname='public' AND c.relname='user_notification_prefs' AND c.relkind='r'
    expect: rowcount_eq
    value: 1

  # THE SCOPE STATEMENT, AS AN INSTRUMENT. Returns the offending column, of which there are none
  # while the table has no soft-delete. Stays armed forever: the day someone adds deleted_at here,
  # every count in this file needs re-scoping and this is what says so.
  - name: pre_userprefs_has_no_deleted_at
    sql: |
      SELECT column_name FROM information_schema.columns
       WHERE table_schema='public' AND table_name='user_notification_prefs'
         AND column_name='deleted_at'
    expect: rowcount_eq
    value: 0

  # continuous:false — true only BEFORE the apply, so leaving it armed would red the gate corpus on
  # every later run (garden-gate-invariants runs the continuous set against prod AND staging).
  - name: pre_nav_tabs_absent
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='user_notification_prefs'
         AND column_name='nav_tabs'
    expect: rowcount_eq
    value: 0
    continuous: false

sweep:
  # SELF-ARMING via to_jsonb: `to_jsonb(t) -> 'nav_tabs'` is SQL NULL when the column does not exist,
  # so this runs cleanly BEFORE the apply instead of erroring on an unknown column, and reads real
  # values the moment there are any.
  #
  # THE `'null'` IN THE LIST IS NOT PADDING. Once the column exists but is unset, to_jsonb maps the
  # SQL NULL to a JSON null, so the expression is jsonb 'null' — which IS NOT SQL NULL and would be
  # reported as a bad shape by a naive `IS NOT NULL AND typeof <> 'array'` predicate, reddening this
  # gate for every unconfigured user. jsonb_typeof over a three-way NOT IN is the form that
  # distinguishes absent / unset / set.
  #
  # ⚠️ VACUOUS UNTIL A WRITER EXISTS, deliberately, and not to be read as evidence: before the Lambda
  # allowlist change nothing can write this column, so 0 offending rows proves only that. It earns
  # its keep the day the writer ships. The instrument check for the constraint itself is
  # post_nav_tabs_shape_check_validated below.
  - name: sweep_nav_tabs_is_an_array
    sql: |
      SELECT created_by FROM public.user_notification_prefs t
       WHERE jsonb_typeof(to_jsonb(t) -> 'nav_tabs') NOT IN ('null', 'array')
    expect: rowcount_eq
    value: 0

  # The half the CHECK deliberately does NOT cover. chk_unp_nav_tabs_shape pins array-ness and
  # cardinality only; element type is asserted here instead of in the constraint so the database is
  # never the place a key vocabulary goes stale. Same vacuity warning as above.
  - name: sweep_nav_tabs_elements_are_strings
    sql: |
      SELECT t.created_by FROM public.user_notification_prefs t
       WHERE jsonb_typeof(to_jsonb(t) -> 'nav_tabs') = 'array'
         AND EXISTS (
               SELECT 1 FROM jsonb_array_elements(to_jsonb(t) -> 'nav_tabs') e
                WHERE jsonb_typeof(e.value) <> 'string')
    expect: rowcount_eq
    value: 0

post:
  # continuous:false — the ONLY gate here that asserts the column EXISTS, so it is true only from the
  # apply onward and would red the continuous corpus until then. The three below are phrased as "if
  # it exists, it is correct" so they can stay armed forever without that problem.
  - name: post_nav_tabs_column_present
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='user_notification_prefs'
         AND column_name='nav_tabs'
    expect: rowcount_eq
    value: 1
    continuous: false

  - name: post_nav_tabs_is_jsonb_if_present
    sql: |
      SELECT 1 WHERE EXISTS (
               SELECT 1 FROM information_schema.columns
                WHERE table_schema='public' AND table_name='user_notification_prefs'
                  AND column_name='nav_tabs')
         AND NOT EXISTS (
               SELECT 1 FROM information_schema.columns
                WHERE table_schema='public' AND table_name='user_notification_prefs'
                  AND column_name='nav_tabs' AND data_type='jsonb')
    expect: rowcount_eq
    value: 0

  # Presence AND validation are separate assertions on purpose: a constraint left NOT VALID looks
  # identical to a validated one in pg_constraint unless convalidated is read, and it does not
  # guarantee existing rows conform. Returns a row when the column is there and the validated CHECK
  # is not.
  - name: post_nav_tabs_shape_check_validated
    sql: |
      SELECT 1 WHERE EXISTS (
               SELECT 1 FROM information_schema.columns
                WHERE table_schema='public' AND table_name='user_notification_prefs'
                  AND column_name='nav_tabs')
         AND NOT EXISTS (
               SELECT 1 FROM pg_constraint
                WHERE conname='chk_unp_nav_tabs_shape' AND convalidated)
    expect: rowcount_eq
    value: 0

  # NULLABLE WITH NO DEFAULT, PINNED — the most important gate in this file. A later "helpful"
  # DEFAULT '["today","garden","create","harvests","put-up"]' would write an assertion nobody made
  # onto every row, destroy the client's ability to tell "never configured" from "chose the shipped
  # order", and — worse — freeze today's bar into the database, so the next deploy that changes the
  # shipped tabs would silently not reach anyone who already has a row. NULL must keep meaning
  # "whatever the app ships". Already self-arming: it returns the OFFENDING column, of which there
  # are none while the column is absent.
  - name: post_nav_tabs_nullable_no_default
    sql: |
      SELECT column_name FROM information_schema.columns
       WHERE table_schema='public' AND table_name='user_notification_prefs'
         AND column_name='nav_tabs'
         AND (is_nullable <> 'YES' OR column_default IS NOT NULL)
    expect: rowcount_eq
    value: 0
