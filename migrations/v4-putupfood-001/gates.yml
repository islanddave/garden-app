# gates.yml
# V4-PUTUPFOODCATEGORY-001 (BD-056) — seed the non-plant food classes into crop_types.
#
# PROMOTE-TIME SEQUENCING:
#   1. STAGING: pre -> apply 0a -> post.
#   2. PROD:    pre -> apply 0a -> post.
#   DATA ONLY. It ships no DDL, so it does not have to be sequenced against a promote — but it
#   SHOULD be applied AFTER the app change ships, not before. Applying first is not unsafe (nothing
#   in the deployed bundle references these slugs), it is merely premature: until the useCropTypes
#   scope filter is live, the seven rows are visible to the garden pickers, which is precisely the
#   pollution this migration's header argues it avoids. Apply-after keeps that window closed.
#
# ANY pre/post assertion failing is a HARD ABORT.

pre:
  - name: pre_crop_types_present
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name='crop_types'
    expect: rowcount_eq
    value: 1

  # The seed only has a point if attribution is what blocks a loaf of bread. If this CHECK were
  # already relaxed, the design's column-based approach had landed and this migration is the wrong
  # answer to a question somebody else already answered.
  - name: pre_attribution_check_still_requires_a_crop
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid='public.preservation_log'::regclass
         AND conname='chk_preservation_log_attribution'
    expect: rowcount_eq
    value: 1

  - name: pre_no_food_class_seeded
    sql: |
      SELECT count(*) FROM public.crop_types
       WHERE slug IN ('bread','cheese','milk','butter','yogurt','meat','fish')
    expect: scalar_eq
    value: 0

  # The gating category must be genuinely NEW. If anything already carries it, the app-side filter
  # this migration relies on would start hiding rows that predate it — a silent narrowing of the
  # garden vocabulary rather than an addition to the pantry one.
  - name: pre_gating_category_unused
    sql: |
      SELECT count(*) FROM public.crop_types WHERE category='non_plant_food'
    expect: scalar_eq
    value: 0

  - name: pre_schema_version_not_recorded
    sql: |
      SELECT 1 FROM public.schema_version WHERE version='4.39.0-putupfood-001'
    expect: rowcount_eq
    value: 0

post:
  - name: post_all_seven_food_types_present
    sql: |
      SELECT count(*) FROM public.crop_types
       WHERE slug IN ('bread','cheese','milk','butter','yogurt','meat','fish')
         AND deleted_at IS NULL
    expect: scalar_eq
    value: 7

  # THE GATE THAT MAKES THE APP FILTER MEAN ANYTHING. The whole no-pollution story is
  # "category = 'non_plant_food' and useCropTypes(scope='garden') excludes it". A seeded row with the
  # wrong category is a loaf of bread in the planting picker, and nothing else in this file catches
  # it — post_all_seven_present would still be green.
  - name: post_every_food_class_carries_the_gating_category
    sql: |
      SELECT count(*) FROM public.crop_types
       WHERE slug IN ('bread','cheese','milk','butter','yogurt','meat','fish')
         AND category='non_plant_food'
    expect: scalar_eq
    value: 7

  # The V4-HARVATTR-001 honesty contract applied to a seed: NULL = UNKNOWN = never fires. Unlike the
  # v4-putupprov-002-fruitseed version of this gate — which had to be scoped `continuous: false`
  # after V4-CROPTYPE-002 legitimately gave blackberry a harvest habit — this one stays CONTINUOUS.
  # blackberry is a real plant in this garden and acquiring harvest behaviour was correct. Bread will
  # never have a repeat_interval_days, so a later migration writing one is a defect worth catching
  # forever, not a legitimate change this gate should be scoped around.
  - name: post_no_invented_harvest_behaviour
    sql: |
      SELECT 1 FROM public.crop_types
       WHERE slug IN ('bread','cheese','milk','butter','yogurt','meat','fish')
         AND (harvest_habit IS NOT NULL OR repeat_interval_days IS NOT NULL
              OR loss_horizon_hours IS NOT NULL OR set_to_first_pick_days IS NOT NULL)
    expect: rowcount_eq
    value: 0

  - name: post_no_invented_lifecycle
    sql: |
      SELECT 1 FROM public.crop_types
       WHERE slug IN ('bread','cheese','milk','butter','yogurt','meat','fish')
         AND default_lifecycle IS NOT NULL
    expect: rowcount_eq
    value: 0

  # The DB-level expression of the app-side gating, and the one gate here that would catch the
  # filter failing in production rather than in a unit test. A non-plant food class must never
  # become the crop type of a garden variety.
  - name: post_no_variety_typed_to_a_food_class
    sql: |
      SELECT 1 FROM public.plant_varieties v
       JOIN public.crop_types ct ON ct.slug = v.crop_type_slug
       WHERE ct.category='non_plant_food'
    expect: rowcount_eq
    value: 0

  # continuous: false — this is an APPLY-WINDOW snapshot, not a standing invariant. Minting a crop
  # type from the app is a live feature (V4-CROPTYPE-001) and 'non_plant_food' is an accepted
  # category, so Dave adding `eggs` later is legitimate and would take an =7 assertion red forever.
  # The permanent invariants are the two above (no harvest behaviour, no varieties), which hold for
  # any number of food classes; this one exists to prove THIS SEED wrote exactly what it claimed.
  - name: post_seed_wrote_exactly_seven_food_classes
    continuous: false
    sql: |
      SELECT count(*) FROM public.crop_types WHERE category='non_plant_food'
    expect: scalar_eq
    value: 7

  - name: post_schema_version_recorded
    sql: |
      SELECT 1 FROM public.schema_version WHERE version='4.39.0-putupfood-001'
    expect: rowcount_eq
    value: 1
