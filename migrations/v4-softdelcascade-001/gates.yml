# gates.yml
# V4-SOFTDELCASCADE-001 — the CONTAINER delete axis left on CASCADE by BUG-EVTANCHORDEL-001.
#
# SEQUENCING (load-bearing — read before applying anything):
#   0a-additive-ddl.sql  — widens the EVTANCHORDEL cold store with archived_project_id and adds
#                          archive_container_events(). Purely additive; no row data touched. MUST be
#                          applied BEFORE 0c, because 0c's RESTRICT is only operable if the escape
#                          hatch exists. Applying 0c first leaves an operator with a blocked delete
#                          and no supported way through.
#   0c-constraint.sql    — flips three FKs CASCADE -> RESTRICT. THE FIX.
#
# DEPLOY BOUNDARY — the falsifiable test, answered per constraint.
#   QUESTION: would the CURRENTLY DEPLOYED prod code perform an operation this RESTRICT rejects?
#   METHOD: the live deployed Lambda bundles were downloaded (aws lambda get-function Code.Location)
#   for garden-projects, garden-events, garden-plants, garden-photos, garden-harvests and grepped for
#   `DELETE FROM`. This is the deployed artifact, not the branch in hand.
#   RESULT: the only `DELETE FROM` in the deployed bundles are `DELETE FROM favorites` (unrelated), a
#   source COMMENT predicting this ticket, and an assertion STRING forbidding the thing. Zero
#   deployed writers hard-delete plant_projects, event_log, photos or harvest_log.
#   ANSWER: NO — for event_log.project_id, for photos.project_id and for photos.event_id alike.
#   0c changes only the referential action on a parent DELETE; INSERT and UPDATE are untouched, so
#   no deployed writer's behaviour changes. There is NO writer coupling with the deployed artifact,
#   and therefore NO pre-deploy/post-deploy split: this ships as one file.
#
#   The old writers that DO break are non-app and CI-only, and must land BEFORE 0c reaches the
#   environment they run against:
#     1. .github/workflows/deploy-staging.yml smoke purge — deletes event_log (lines 560, 562) BEFORE
#        photos (line 569), and the photos sweep covers plant_id/location_id/project_id but NOT
#        event_id. Under flip 3 a smoke photo hanging off a smoke event refuses the event delete and
#        ON_ERROR_STOP=1 reds the deploy. 0-row no-op against staging today (verified live: zero
#        smoke photos carry an event_id, zero smoke residue rows), so it is latent, not firing.
#     2. tests/integration/** teardowns — audited file by file against all three flips. NONE breaks
#        today. Three are green by property rather than by construction; see README §Required
#        companion edits. Note that .github/workflows/integration-test.yml branches CI off STAGING
#        and applies no migrations, so staging apply arms CI on the very next run — there is no
#        separate window in which to stage the test fixes.
#   Applying 0c to an environment whose purge has not been reordered reds the next staging deploy.
#   It cannot corrupt data — RESTRICT only ever refuses.
#
# ORDER APPLIED:
#   NOTHING IS APPLIED. This migration was authored, parse-verified and gate-validated only; no DDL
#   has been executed against prod or staging. See README.md §Runbook.
#
# NO GATE HERE IS MARKED `continuous: true`, deliberately. gate-invariants.yml runs
# `--phase post --continuous-only` against LIVE prod and staging on a schedule; marking the
# "constraint is armed" gates continuous before the migration is applied would report a standing
# failure for a migration that has not run. Zero gates repo-wide use the flag today. Promoting the
# durable invariants below to continuous is a deliberate follow-up AFTER prod apply, not part of this
# change.
#
# Both `pre` blocks assert the CURRENT (broken) state, so a re-run against an already-migrated
# database fails the pre-gate rather than silently re-applying.

pre:
  # The defect itself, asserted rather than assumed. If this returns fewer than 3, the migration has
  # already been applied (or the schema is not what was surveyed) — stop and re-survey.
  - name: pre_three_container_fks_are_cascade
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conname IN ('event_log_project_id_fkey','photos_project_id_fkey','photos_event_id_fkey')
         AND confdeltype = 'c'
    expect: rowcount_eq
    value: 3

  # The premise of the whole ticket: the PLANTING axis is already hardened, so this is finishing a
  # job rather than starting one. If these are not RESTRICT, EVTANCHORDEL has been rolled back and
  # this migration is answering the wrong question.
  - name: pre_evtanchordel_plant_axis_already_restrict
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conname IN ('event_log_plant_id_fkey','photos_plant_id_fkey','photos_location_id_fkey')
         AND confdeltype = 'r'
    expect: rowcount_eq
    value: 3

  # 0a extends EVTANCHORDEL's cold store rather than inventing a parallel one, so that store must
  # already exist. Applying this migration to a database without it is a sequencing error.
  - name: pre_evtanchordel_archive_substrate_present
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema = 'public'
         AND table_name IN ('event_log_archive','harvest_log_archive')
    expect: rowcount_eq
    value: 2

  - name: pre_archive_plant_events_present
    sql: |
      SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
       WHERE n.nspname = 'public' AND p.proname = 'archive_plant_events'
    expect: rowcount_eq
    value: 1

  - name: pre_archive_container_events_absent
    sql: |
      SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
       WHERE n.nspname = 'public' AND p.proname = 'archive_container_events'
    expect: rowcount_eq
    value: 0

  # 0a arms event_log_archive_has_provenance over existing rows. Both tables must be EMPTY for that
  # to be unconditionally safe. If either is non-empty, stop: the CHECK is still satisfied by
  # archive_plant_events()' output (archived_plant_id is always set), but that has to be confirmed
  # rather than assumed. This is the in-database form of "arming a constraint is a deploy".
  - name: pre_archive_tables_empty_before_check_is_armed
    sql: |
      SELECT 1 FROM public.event_log_archive
      UNION ALL
      SELECT 1 FROM public.harvest_log_archive
    expect: rowcount_eq
    value: 0

sweep:
  # L-058: every predicate the constraint is about to enforce must ALREADY hold. RESTRICT can only be
  # added if every existing child value resolves to a live parent — this is the scan the ALTER
  # performs, run first so a mid-ALTER failure becomes a clean pre-apply stop.
  #
  # DELIBERATELY UNFILTERED. No `deleted_at IS NULL` anywhere below: a foreign key does not know what
  # a soft delete is. A row pointing at a soft-deleted parent still satisfies the FK; a row pointing
  # at a row that is GONE does not. Filtering by deleted_at here would hide exactly the rows that
  # break the ALTER.
  # VACUITY NOTE (audit 2026-08-12) — the three sweep_no_dangling_* gates below are BELT-AND-BRACES,
  # not coverage. All three FKs they pre-flight are already `convalidated = t` in live prod, which is
  # Postgres's own catalog-level proof that no dangling row exists on those exact columns; and 0c
  # changes only the referential ACTION, keeping the same columns and the same parent. The validation
  # scan that 0c's ADD CONSTRAINT runs therefore cannot fail for a reason these gates would catch.
  # They pass because a validated FK already forbids the condition, NOT because anything about this
  # migration was checked. Kept (they cost nothing and would catch a hand-edited NOT VALID FK), but
  # do not count them as evidence the apply is safe.
  #
  # RLS TRAP, recorded so the next auditor does not lose an hour to it: event_log, photos and
  # plant_projects all have relrowsecurity = t. Run these three sweeps as a role subject to RLS (e.g.
  # garden_ro via scripts/psql-ro.sh) and they report 1 and 2 dangling rows — pure visibility
  # artifacts, because the parent rows are filtered from that role while the child rows are not.
  # gate_runner connects with NEON_DATABASE_URL (owner, RLS-exempt, conn.read_only = True) and gets
  # the true answer: verified 2026-08-12, sweep 6/6 PASS against live prod.
  - name: sweep_no_dangling_event_project_refs
    sql: |
      SELECT 1 FROM public.event_log e
       WHERE e.project_id IS NOT NULL
         AND NOT EXISTS (SELECT 1 FROM public.plant_projects p WHERE p.id = e.project_id)
    expect: rowcount_eq
    value: 0

  - name: sweep_no_dangling_photo_project_refs
    sql: |
      SELECT 1 FROM public.photos ph
       WHERE ph.project_id IS NOT NULL
         AND NOT EXISTS (SELECT 1 FROM public.plant_projects p WHERE p.id = ph.project_id)
    expect: rowcount_eq
    value: 0

  - name: sweep_no_dangling_photo_event_refs
    sql: |
      SELECT 1 FROM public.photos ph
       WHERE ph.event_id IS NOT NULL
         AND NOT EXISTS (SELECT 1 FROM public.event_log e WHERE e.id = ph.event_id)
    expect: rowcount_eq
    value: 0

  # INFORMATIONAL CAPTURE (rowcount_gte: 0 — always passes, still runs, still reports). The blast
  # radius this migration closes, recorded at apply time so the before/after is on the record rather
  # than in a commit message. Asserting a specific count here would be an environment-specific
  # assertion that fails on staging for no reason.
  - name: sweep_capture_unprotected_containers
    note: >
      Containers whose hard delete is refused by NOTHING today. A container is incidentally protected
      only if a harvest_log row (project_id or event_id, both already RESTRICT) or a
      cultivar_weight_sample (NO ACTION) happens to block it.
      INFORMATIONAL CAPTURE, NOT AN ASSERTION — `rowcount_gte 0` is satisfied by every possible
      result, so this gate CANNOT FAIL by construction. It exists to print the population into the
      apply record, not to guard anything. Do not read a PASS here as a safety check.
      Prod at authoring time: 76 containers with events, 27 incidentally protected, 49 unprotected,
      2432 events one DELETE away. RE-MEASURED ON LIVE PROD 2026-08-12 (the table has grown since):
      74 containers with events, 29 incidentally protected, 45 unprotected, 2333 events one DELETE
      away.
    sql: |
      WITH ev AS (
        SELECT project_id, array_agg(id) AS ids, count(*) AS n_events
          FROM public.event_log WHERE project_id IS NOT NULL GROUP BY project_id
      ), blocked AS (
        SELECT e.project_id
          FROM ev e
         WHERE EXISTS (SELECT 1 FROM public.harvest_log h WHERE h.project_id = e.project_id)
            OR EXISTS (SELECT 1 FROM public.harvest_log h WHERE h.event_id = ANY(e.ids))
            OR EXISTS (SELECT 1 FROM public.cultivar_weight_sample s
                        WHERE s.source_event_id = ANY(e.ids))
      )
      SELECT e.project_id, e.n_events
        FROM ev e
       WHERE e.project_id NOT IN (SELECT project_id FROM blocked)
    expect: rowcount_gte
    value: 0

  # INFORMATIONAL CAPTURE. Photos whose ONLY parent is the container or the event — the rows for
  # which archive_container_events() must RAISE rather than detach, because detaching would violate
  # photos_must_have_parent. Prod at authoring time: 10 project-only, 0 event-only. Not an assertion:
  # their existence is legitimate, it just means those containers need operator action first.
  - name: sweep_capture_photos_with_a_single_dying_parent
    note: >
      INFORMATIONAL CAPTURE, NOT AN ASSERTION — `rowcount_gte 0` is satisfied by every possible
      result, so this gate CANNOT FAIL by construction. Flagged in the 2026-08-12 audit because,
      unlike its sibling capture above, it carried no note and so read like a real guard. It lists
      the photos whose ONLY parent is a dying one, i.e. exactly the population
      archive_container_events()' Guard 3 will refuse to strand — useful to see before an operator
      runs the function, but it guards nothing on its own. Live prod 2026-08-12: 12 such photos.
    sql: |
      SELECT ph.id, ph.project_id, ph.event_id
        FROM public.photos ph
       WHERE ph.plant_id IS NULL AND ph.location_id IS NULL
         AND ph.inventory_item_id IS NULL AND ph.space_id IS NULL
         AND COALESCE(ph.intake_status = 'pending_tag', false) = false
         AND ((ph.project_id IS NOT NULL AND ph.event_id IS NULL)
              OR (ph.event_id IS NOT NULL AND ph.project_id IS NULL))
    expect: rowcount_gte
    value: 0

  # The skew archive_container_events()' Guard 2 exists to catch, checked BEFORE apply rather than
  # discovered inside the function. A harvest_log row anchored to one container whose event belongs
  # to another cannot be archived by container without stranding detail off a surviving event. Zero
  # in prod (harvest_log.project_id is non-null and always equals its event's project_id).
  - name: sweep_no_harvest_log_container_skew
    sql: |
      SELECT 1 FROM public.harvest_log h
        JOIN public.event_log e ON e.id = h.event_id
       WHERE h.project_id IS DISTINCT FROM e.project_id
    expect: rowcount_eq
    value: 0

post:
  # ═══ SELF-ARMING, ADDED 2026-08-10 (gate-invariants backlog triage) ═══
  #
  # THIS MIGRATION IS NOT APPLIED ANYWHERE. Verified 2026-08-10 against live prod and live staging:
  # neither schema_version row exists on either environment, and all three container FKs still read
  # confdeltype='c' on prod. The gates below were therefore CORRECTLY red — they were reporting an
  # unfixed defect, not drift. But `.github/workflows/gate-invariants.yml` runs every continuous post
  # gate on a schedule with no skip-if-unapplied logic, so this one directory contributed 8 of the 27
  # prod failures and 8 of the 28 on staging: a third of the entire standing-red backlog, generated
  # by a migration that has not run yet. That is exactly the noise
  # migrations/v4-cachemissingrow-001/gates.yml warns about — "adding a knowingly-red gate to that
  # backlog is how an invariant suite decays into noise everyone learns to scroll past."
  #
  # The repair is the pattern that file establishes, NOT a weakening: each gate is keyed on the
  # schema_version row THIS migration writes in the same transaction as the DDL it asserts. Before
  # apply the gate is vacuously true, because the invariant is not yet CLAIMED. After apply it
  # asserts for real, permanently, with no follow-up edit to forget. Two arming rows, used precisely:
  # 0a-additive-ddl.sql writes '4.23.2-softdelcascade-001-archive' and arms the archive-substrate
  # gates; 0c-constraint.sql writes '4.23.2-softdelcascade-001' and arms the FK gates. Arming a 0c
  # gate on the 0a row would let a half-applied migration pass.
  #
  # Every original predicate is preserved verbatim inside the OR; nothing was relaxed, rescoped or
  # deleted, and no gate was given `env:`. The moment the apply lands, all 8 assert at full strength.
  - name: post_three_container_fks_are_restrict
    sql: |
      SELECT 1
       WHERE NOT EXISTS (SELECT 1 FROM public.schema_version
                          WHERE version = '4.23.2-softdelcascade-001')
          OR (SELECT count(*) FROM pg_constraint
               WHERE conname IN ('event_log_project_id_fkey','photos_project_id_fkey',
                                 'photos_event_id_fkey')
                 AND confdeltype = 'r') = 3
    expect: rowcount_eq
    value: 1

  # THE CLASS GATE. The reported finding was three instances; this asserts the whole class is empty.
  # No FK carrying USER HISTORY may be ON DELETE CASCADE. "History" is enumerated rather than
  # inferred: event_log, photos, harvest_log and preservation_log are the four tables that record
  # something the user did or observed and that cannot be recomputed from anything else.
  # container_closure, entity_memory and inactive_project_dismissals are deliberately NOT in the list
  # — they are derived caches, and cascading them is correct.
  # Self-armed on the 0c row (see the header note). Prod currently reads 4 rows here — the three this
  # migration flips plus one more in the same class — which is the unfixed defect, faithfully
  # reported, and it will report it again the instant 0c lands if any of them survives.
  - name: post_no_cascade_fk_out_of_a_user_history_table
    note: >
      MIGRATION-BLOCKING DEFECT FOUND AND FIXED 2026-08-12 (audit before apply). As authored this
      gate had no conname carve-out, so it would have PASSED vacuously before apply (its
      schema_version guard is false) and then FAILED the moment 0c succeeded — the migration would
      apply cleanly and immediately red its own post phase. Cause: photos_inventory_item_id_fkey is
      `photos.inventory_item_id -> inventory_items(id) ON DELETE CASCADE` (verified live prod
      2026-08-12), so table `photos` still carries a CASCADE FK that this migration does not own and
      does not flip. Simulated post-apply on live prod: without the carve-out the query returns 1 row
      (expect 0) -> FAIL. The carve-out is by exact conname, NOT by widening the table list, so the
      gate still catches any NEW cascade introduced into these tables and still catches regression of
      the three FKs this migration owns. THE CARVED-OUT FK IS A REAL SIBLING DEFECT of the same class
      (a hard `DELETE FROM inventory_items` would destroy photos of that item with no archive) but is
      deliberately NOT folded in: it is a different parent axis needing its own deployed-writer test,
      and its blast radius is small and latent — the deployed garden-inventory-items Lambda
      soft-deletes (`UPDATE inventory_items SET deleted_at = NOW()`, verified in the live bundle) and
      only 6 prod photos carry an inventory_item_id. Tracked as a follow-up, not closed here.
    sql: |
      SELECT c.conname
        FROM pg_constraint c
        JOIN pg_class t ON t.oid = c.conrelid AND t.relkind = 'r'
        JOIN pg_namespace n ON n.oid = t.relnamespace AND n.nspname = 'public'
       WHERE EXISTS (SELECT 1 FROM public.schema_version
                      WHERE version = '4.23.2-softdelcascade-001')
         AND c.contype = 'f'
         AND c.confdeltype = 'c'
         AND t.relname IN ('event_log','photos','harvest_log','preservation_log')
         AND c.conname <> 'photos_inventory_item_id_fkey'
    expect: rowcount_eq
    value: 0

  # The fix must not have been "achieved" by relaxing the invariant next door. EVTANCHORDEL's anchor
  # CHECK and the photos parent CHECK both survive this migration untouched.
  - name: post_anchor_checks_survive
    sql: |
      SELECT 1 FROM pg_constraint c JOIN pg_class t ON t.oid = c.conrelid
       WHERE t.relkind = 'r' AND c.contype = 'c'
         AND c.conname IN ('event_log_has_anchor','photos_must_have_parent')
    expect: rowcount_eq
    value: 2

  # And the planting axis this migration completes is still armed. A green run with EVTANCHORDEL
  # reverted would mean the two axes disagree again.
  - name: post_plant_axis_still_restrict
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conname IN ('event_log_plant_id_fkey','photos_plant_id_fkey','photos_location_id_fkey')
         AND confdeltype = 'r'
    expect: rowcount_eq
    value: 3

  # NO ROW WAS TOUCHED. This migration is constraint-and-function only. These are structural
  # invariants rather than absolute counts, so they stay true as the garden grows.
  - name: post_no_anchorless_events_introduced
    note: >
      REAL GATE — and the audit of 2026-08-12 found it is real for a reason nobody had written down.
      `event_log_has_anchor` is `convalidated = f` in live prod (NOT VALIDATED): it is enforced only
      for rows inserted or updated after it was added, and the pre-existing population was never
      scanned. So the database does NOT guarantee this predicate and the gate can genuinely fail.
      Contrast its sibling below, which is vacuous for exactly the opposite reason. Live prod
      2026-08-12: 0 anchorless events.
    sql: |
      SELECT 1 FROM public.event_log WHERE plant_id IS NULL AND project_id IS NULL
    expect: rowcount_eq
    value: 0

  - name: post_no_parentless_photos_introduced
    note: >
      VACUOUS — PASSES FOR THE WRONG REASON, kept only as belt-and-braces (audit 2026-08-12).
      `photos_must_have_parent` is `convalidated = t` in live prod and its CHECK expression is the
      exact negation of this query, term for term across all seven arms. Postgres therefore makes a
      matching row physically impossible to store, so this gate reports the constraint's enforcement
      rather than anything about this migration. Do not count it as evidence that the photo-detach
      logic is correct — the gate that actually covers that ordering is
      post_archive_functions_detach_photos_before_deleting_events.
    sql: |
      SELECT 1 FROM public.photos ph
       WHERE ph.event_id IS NULL AND ph.project_id IS NULL AND ph.location_id IS NULL
         AND ph.plant_id IS NULL AND ph.inventory_item_id IS NULL AND ph.space_id IS NULL
         AND COALESCE(ph.intake_status = 'pending_tag', false) = false
    expect: rowcount_eq
    value: 0

  # ── 0a substrate ────────────────────────────────────────────────────────────────────────────
  # Self-armed on the 0a row (see the header note) — this and the four gates below assert 0a
  # substrate, so they must not be armed by the 0c row.
  - name: post_archive_container_events_exists
    sql: |
      SELECT 1
       WHERE NOT EXISTS (SELECT 1 FROM public.schema_version
                          WHERE version = '4.23.2-softdelcascade-001-archive')
          OR (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'public' AND p.proname = 'archive_container_events') = 1
    expect: rowcount_eq
    value: 1

  # The escape hatch for the OTHER axis must still be there. Both are needed: a container and a
  # planting are independent delete targets.
  - name: post_both_archive_functions_exist
    sql: |
      SELECT 1
       WHERE NOT EXISTS (SELECT 1 FROM public.schema_version
                          WHERE version = '4.23.2-softdelcascade-001-archive')
          OR (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'public'
                 AND p.proname IN ('archive_plant_events','archive_container_events')) = 2
    expect: rowcount_eq
    value: 1

  # ADDED 2026-08-12 (audit before apply). This is THE compatibility invariant that makes flip 3
  # (photos.event_id CASCADE -> RESTRICT) safe, and NOTHING gated it.
  #
  # The authored deploy-boundary analysis answered "would the currently deployed code produce an
  # operation this constraint rejects?" by grepping the deployed LAMBDA bundles for `DELETE FROM`.
  # That method is structurally blind to IN-DATABASE writers, and there is exactly one:
  # archive_plant_events(), shipped by BUG-EVTANCHORDEL-001, which really does
  # `DELETE FROM public.event_log`. Under flip 3 that delete is refused with 23503 for any event that
  # still has a photo hanging off it. It survives ONLY because it DETACHES photos (sets event_id =
  # NULL) BEFORE deleting the events — an ordering property internal to the function body, invisible
  # to every other gate here, and silently destroyable by any future edit that reorders those two
  # statements or narrows the detach predicate. Verified live on prod 2026-08-12: detach at prosrc
  # offset 2262, delete at 3022.
  #
  # Non-vacuous by construction: it fails if either function loses its detach, loses its delete, or
  # performs them in the wrong order. Covers BOTH archive functions — archive_container_events() has
  # the identical hazard for the same reason.
  - name: post_archive_functions_detach_photos_before_deleting_events
    note: >
      Ordering invariant inside the two archive functions: photos must be detached (event_id set to
      NULL, directly or via CASE) BEFORE `DELETE FROM public.event_log`. This is what keeps the
      in-database writers compatible with photos_event_id_fkey ON DELETE RESTRICT. A future edit that
      reorders these statements would leave both functions raising 23503 on any event that still
      carries a photo, and no other gate in this file would notice.
    sql: |
      SELECT 1
       WHERE NOT EXISTS (SELECT 1 FROM public.schema_version
                          WHERE version = '4.23.2-softdelcascade-001-archive')
          OR (SELECT count(*)
                FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'public'
                 AND p.proname IN ('archive_plant_events','archive_container_events')
                 AND regexp_instr(p.prosrc, 'event_id\s*=\s*(NULL|CASE)') > 0
                 AND regexp_instr(p.prosrc, 'DELETE FROM public\.event_log') > 0
                 AND regexp_instr(p.prosrc, 'event_id\s*=\s*(NULL|CASE)')
                   < regexp_instr(p.prosrc, 'DELETE FROM public\.event_log')) = 2
    expect: rowcount_eq
    value: 1

  - name: post_archive_provenance_columns_exist
    sql: |
      SELECT 1
       WHERE NOT EXISTS (SELECT 1 FROM public.schema_version
                          WHERE version = '4.23.2-softdelcascade-001-archive')
          OR (SELECT count(*) FROM information_schema.columns
               WHERE table_schema = 'public'
                 AND table_name IN ('event_log_archive','harvest_log_archive')
                 AND column_name = 'archived_project_id') = 2
    expect: rowcount_eq
    value: 1

  # The relaxation and the CHECK are a PAIR: archived_plant_id may now be NULL only because
  # archived_project_id can carry the provenance instead. Asserting the nullability alone would pass
  # in the state where the CHECK was dropped and provenance can silently go missing entirely.
  - name: post_archived_plant_id_is_nullable
    sql: |
      SELECT 1
       WHERE NOT EXISTS (SELECT 1 FROM public.schema_version
                          WHERE version = '4.23.2-softdelcascade-001-archive')
          OR (SELECT count(*) FROM information_schema.columns
               WHERE table_schema = 'public'
                 AND table_name IN ('event_log_archive','harvest_log_archive')
                 AND column_name = 'archived_plant_id'
                 AND is_nullable = 'YES') = 2
    expect: rowcount_eq
    value: 1

  - name: post_archive_provenance_check_armed
    sql: |
      SELECT 1
       WHERE NOT EXISTS (SELECT 1 FROM public.schema_version
                          WHERE version = '4.23.2-softdelcascade-001-archive')
          OR (SELECT count(*) FROM pg_constraint c JOIN pg_class t ON t.oid = c.conrelid
               WHERE c.contype = 'c'
                 AND c.conname IN ('event_log_archive_has_provenance',
                                   'harvest_log_archive_has_provenance')
                 AND c.convalidated) = 2
    expect: rowcount_eq
    value: 1

  # The archive must NOT re-create the coupling this migration removes: no FK on it. An FK would make
  # the cold store refuse the very rows it exists to hold.
  - name: post_archive_has_no_foreign_keys
    sql: |
      SELECT 1 FROM pg_constraint c JOIN pg_class t ON t.oid = c.conrelid
       WHERE t.relname IN ('event_log_archive','harvest_log_archive') AND c.contype = 'f'
    expect: rowcount_eq
    value: 0

  # Nothing in this migration calls archive_container_events(). A non-zero count straight after apply
  # means something ran it during the migration window. Re-runnable later only as an informational
  # note; on apply day it is an assertion.
  - name: post_archive_is_empty_on_apply
    note: >
      APPLY-WINDOW GATE ONLY — it asserts that this migration moved no row, which is true because 0a
      and 0c are constraint-and-function only and nothing calls archive_container_events()
      automatically. It is therefore correct at apply time and WILL legitimately fail later, the
      first time an operator actually archives a container. That is by design, but note the
      asymmetry flagged in the 2026-08-12 audit: unlike every other post gate here it carries NO
      schema_version guard, so it is live on every run rather than only after apply. Do not promote
      it to `continuous: true`, and expect to retire it once the escape hatch is first used. Live
      prod 2026-08-12: both archives 0 rows.
    sql: |
      SELECT 1 FROM public.event_log_archive
      UNION ALL
      SELECT 1 FROM public.harvest_log_archive
    expect: rowcount_eq
    value: 0

  # NO NEW TRIGGERS. scripts/restore-verify.py builds a table:trigger:function inventory and hard-
  # fails on prod-vs-restore drift. This migration deliberately adds none — the fix is a constraint
  # action and a function, not a trigger — so that inventory is unchanged and needs no fixture
  # update. If this ever returns > 0, restore-verify must be revisited in the same commit.
  - name: post_no_new_triggers_on_touched_tables
    sql: |
      SELECT 1 FROM pg_trigger g JOIN pg_class t ON t.oid = g.tgrelid
       WHERE NOT g.tgisinternal
         AND t.relname IN ('event_log','photos','plant_projects','harvest_log',
                           'event_log_archive','harvest_log_archive')
         AND g.tgname NOT IN ('set_updated_at','prevent_ownership_transfer','container_bump',
                              'container_closure_after_ins','container_reparent_after',
                              'trg_delete_entity_tags_project')
    expect: rowcount_eq
    value: 0

  # continuous: false ADDED 2026-08-10. This is the APPLY-TIME RECEIPT — the one gate here that is
  # not a standing invariant and so cannot be self-armed (arming it on its own subject would make it
  # tautological). Same call v4-cachemissingrow-001 makes for its own version row. It stays a full
  # blocking assertion during the apply.
  - name: post_schema_version_recorded
    continuous: false
    sql: |
      SELECT 1 FROM public.schema_version
       WHERE version IN ('4.23.2-softdelcascade-001','4.23.2-softdelcascade-001-archive')
    expect: rowcount_eq
    value: 2
