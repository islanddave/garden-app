# gates.yml
# V4-HANDEDNESSCONTROLS-001 (BD-054) — user_notification_prefs.handedness, per-user cross-device.
#
# ⛔ STATUS AT AUTHORING (2026-08-25): AUTHORED ONLY. Staging NOT applied. Prod NOT applied.
#    The lane that wrote this was instructed to author and stop. Do not apply from a lane branch.
#
# NO 0b. There is no prior server-side value to migrate: the previous value lives in browser
# localStorage this migration cannot reach. A NULL column means "this user has not set it", which is
# byte-identical to today's behaviour, so the DDL is inert until the Lambda allowlist change lands.
#
# SEQUENCING — the migration goes first, BOTH environments, before the dev push that adds
# `handedness` to the critter Lambda's PATCH allowlist:
#   staging 0a -> staging 0c  ->  prod 0a -> prod 0c  ->  dev push (Lambda) -> deploy.
# Landing the Lambda change against a database without the column is the L-081 incident verbatim.
#
# EXPOSURE IS LOWER THAN V4-USERPREFS-001's, and lower still than V4-ACQMATURE-001's. The SPA half
# already shipped and does NOT depend on this column: handedness is read from localStorage, and
# saveHandedness sends `handedness` as the ONLY key in its PATCH, so before the allowlist change the
# server answers 400 "no updatable fields present" and the client turns that into a silent null. A
# partial apply therefore degrades to "the preference does not follow you to another device", never
# to a 500 and never to a wrong layout. That is a reason to sequence it correctly, not to relax.
#
# NO VIEW WIDEN REQUIRED — user_notification_prefs is a plain table (relkind='r'), re-pinned below,
# so the garden_node failure mode (a column added to a base table and invisible through an explicit
# column-list view) cannot occur here.
#
# Pre:  the column does not exist yet; the table exists and is a TABLE.
# Sweep: no row holds a handedness outside the domain (vacuous before 0a; real on any re-run).
# Post: column present and text, the domain CHECK exists AND is validated, still nullable/no-default.

pre:
  - name: pre_userprefs_table_present
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name='user_notification_prefs'
    expect: rowcount_eq
    value: 1

  - name: pre_userprefs_is_a_table_not_a_view
    sql: |
      SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
       WHERE n.nspname='public' AND c.relname='user_notification_prefs' AND c.relkind='r'
    expect: rowcount_eq
    value: 1

  # continuous:false — this one is true only BEFORE the apply, so leaving it armed would red the
  # gate corpus on every later run (garden-gate-invariants self-arming).
  - name: pre_handedness_absent
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='user_notification_prefs'
         AND column_name='handedness'
    expect: rowcount_eq
    value: 0
    continuous: false

sweep:
  # The domain, asserted INDEPENDENTLY of the CHECK so a dropped or never-validated constraint
  # cannot make this pass vacuously. Written to return the OFFENDING rows.
  #
  # SELF-ARMING via to_jsonb: `to_jsonb(t) ->> 'handedness'` is NULL when the column does not exist
  # yet, so this runs cleanly BEFORE the apply instead of erroring on an unknown column. It reads
  # the real values the moment there are any.
  #
  # ⚠️ VACUOUS ON THE FIRST APPLY, deliberately, and not to be read as evidence: immediately after
  # 0a every row holds NULL, so 0 offending rows proves nothing. It earns its keep once the writer
  # ships. The instrument check is post_handedness_check_validated below.
  - name: sweep_handedness_in_domain
    sql: |
      SELECT created_by FROM public.user_notification_prefs t
       WHERE (to_jsonb(t) ->> 'handedness') IS NOT NULL
         AND (to_jsonb(t) ->> 'handedness') NOT IN ('right','left')
    expect: rowcount_eq
    value: 0

post:
  # continuous:false — the ONLY gate here that asserts the column EXISTS, so it is true only from
  # the apply onward and would red `gate_runner --all --phase post --continuous-only` on every push
  # until then (the gate-invariants job runs exactly that against prod AND staging). The three gates
  # below are phrased as "if it exists, it is correct" so they can stay armed forever without that
  # problem — a self-arming shape, per the standing lesson, rather than a corpus-wide red.
  - name: post_handedness_column_present
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='user_notification_prefs'
         AND column_name='handedness'
    expect: rowcount_eq
    value: 1
    continuous: false

  - name: post_handedness_is_text_if_present
    sql: |
      SELECT 1 WHERE EXISTS (
               SELECT 1 FROM information_schema.columns
                WHERE table_schema='public' AND table_name='user_notification_prefs'
                  AND column_name='handedness')
         AND NOT EXISTS (
               SELECT 1 FROM information_schema.columns
                WHERE table_schema='public' AND table_name='user_notification_prefs'
                  AND column_name='handedness' AND data_type='text')
    expect: rowcount_eq
    value: 0

  # Presence AND validation are separate assertions on purpose: a constraint left NOT VALID looks
  # identical to a validated one in pg_constraint unless convalidated is read, and it does not
  # guarantee existing rows conform. 0c is the half that gets forgotten — this is what would catch
  # it. Returns a row when the column is there and the validated CHECK is not.
  - name: post_handedness_check_validated
    sql: |
      SELECT 1 WHERE EXISTS (
               SELECT 1 FROM information_schema.columns
                WHERE table_schema='public' AND table_name='user_notification_prefs'
                  AND column_name='handedness')
         AND NOT EXISTS (
               SELECT 1 FROM pg_constraint
                WHERE conname='chk_unp_handedness' AND convalidated)
    expect: rowcount_eq
    value: 0

  # NULLABLE with NO DEFAULT, pinned. A later "helpful" DEFAULT 'right' would write an assertion
  # nobody made onto every existing row and destroy the client's ability to tell "unset" from
  # "chose right-handed" — which is what makes a value set on another device adoptable. Already
  # self-arming: it returns the OFFENDING column, of which there are none while the column is absent.
  - name: post_handedness_nullable_no_default
    sql: |
      SELECT column_name FROM information_schema.columns
       WHERE table_schema='public' AND table_name='user_notification_prefs'
         AND column_name='handedness'
         AND (is_nullable <> 'YES' OR column_default IS NOT NULL)
    expect: rowcount_eq
    value: 0
