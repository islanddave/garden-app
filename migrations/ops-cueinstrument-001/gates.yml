# gates.yml
# OPS-CUEINSTRUMENT-001 — public.weather_cue_impression (the Today weather-cue impression log).
#
# STATUS AT AUTHORING (2026-09-02): AUTHORED, NOT APPLIED. Not applied to staging, not applied to
# prod. The authoring lane executed no DDL anywhere and mutated no database.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# SEQUENCING
#
#   staging apply -> rehearse 0r-rollback -> re-apply to staging -> PROD apply -> dev push -> promote
#
# The DDL must reach STAGING BEFORE THE DEV PUSH: CI's integration job branches off staging and does
# NOT apply migrations, so a missing relation there presents as an infra flake, gets retried green,
# and stays hidden. It must ALSO reach PROD before the promote — the writer is non-fatal by
# construction (a failed insert returns 202 and logs a warning; the client never reads the response),
# so a late migration breaks nothing visible, but every day the cue renders before it lands is a day
# of denominator no backfill can reconstruct (see 0r-rollback.sql). That is precisely the failure
# this row exists to prevent, so a late apply defeats the point of shipping the render at all.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# GATE CLASSIFICATION (L-369 — decided at authoring, not after the first false red)
#
#   * Every post gate carries `continuous: false` at authoring because the migration is UNAPPLIED —
#     the scheduled sweep runs post gates against LIVE prod and would report a standing red until
#     the apply (convention per v4-watchimpression-001 / v4-readytrayimpression-001).
#   * The SCHEMA-SHAPE gates (table/columns/constraints/index) stay true forever once applied: flip
#     those to `continuous: true` AFTER the prod apply.
#   * post_starts_empty is PERMANENTLY window-scoped — never flip it. It is an L-369 category-1
#     emptiness assert: the Today beacon populates this table from the first cue-day after the
#     Lambda ships, so its truth decays BY DESIGN the moment the feature runs.
#   * No time-relative gates and no data-expectation gates (L-369 categories 2 and 3): this
#     migration touches no existing relation, and cue counts are facts about the weather and about
#     how often Dave opens Today, not invariants of any environment.

pre:
  - name: pre_table_absent
    note: Greenfield. If this returns a row, someone already applied 0a — stop and diff before re-running.
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name='weather_cue_impression'
    expect: rowcount_eq
    value: 0
    # APPLY-WINDOW ONLY. `continuous` defaults TRUE, so as authored this gate went permanently red
    # the instant the migration it guards was applied — and it would have redded the scheduled
    # invariant sweep forever while looking like a real regression. A starting-state assertion is
    # false by design after the apply; it is not an invariant.
    continuous: false

  - name: pre_daily_plan_present
    note: >
      Not an FK — this table has none. daily_plan is the SOURCE of every cue an impression can
      describe, and its generated_at is what plan_generated_at records. If the producer relation is
      absent, the instrument has nothing to instrument and the apply is premature.
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name='daily_plan'
    expect: rowcount_eq
    value: 1

  - name: pre_watch_impression_untouched
    note: >
      The design decision this migration turns on: watch_impression is MIRRORED, not widened. Its
      region CHECK must still carry exactly its own three values and no weather cue. If this gate
      ever fails, someone applied the rejected alternative and BOTH shapes are now live.
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid='public.watch_impression'::regclass
         AND conname='watch_impression_region_chk'
         AND pg_get_constraintdef(oid) NOT LIKE '%weather%'
    expect: rowcount_eq
    value: 1

post:
  - name: post_table_present
    sql: |
      SELECT 1 FROM information_schema.tables
       WHERE table_schema='public' AND table_name='weather_cue_impression'
    expect: rowcount_eq
    value: 1
    continuous: true    # flipped 2026-09-02 — prod apply landed (receipt 5.0.0-cueinstrument-20260902)

  - name: post_all_columns_present
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='weather_cue_impression'
         AND column_name IN ('id','user_id','shown_on','cue','form','model_version',
                             'plan_generated_at','created_at')
    expect: rowcount_eq
    value: 8
    continuous: true    # flipped 2026-09-02 — prod apply landed (receipt 5.0.0-cueinstrument-20260902)

  - name: post_no_extra_columns
    note: >
      Paired with the gate above so the two together pin the column set EXACTLY. The IN-filter gate
      alone passes happily on a table that also grew a column nobody intended.
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='weather_cue_impression'
    expect: rowcount_eq
    value: 8
    continuous: true    # flipped 2026-09-02 — prod apply landed (receipt 5.0.0-cueinstrument-20260902)

  - name: post_no_created_by_column
    note: >
      Deliberate absence, not an oversight — same as watch_impression, ready_impression and
      weather_daily. The V4-OWNERSHIP-001 transfer trigger fires on created_by across 9 tables and
      reads NULL -> value as an ownership transfer; a table a client beacon writes must stay outside
      that machinery. The user column is user_id (who was shown the cue).
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='weather_cue_impression'
         AND column_name='created_by'
    expect: rowcount_eq
    value: 0
    continuous: true    # flipped 2026-09-02 — prod apply landed (receipt 5.0.0-cueinstrument-20260902)

  - name: post_shown_on_is_date_not_timestamp
    note: >
      Load-bearing. shown_on is contracted to be an ET CIVIL DAY. A timestamptz here would compile,
      write and read fine while silently re-anchoring the dedupe grain to UTC — splitting one
      evening's cue across two "days" for five hours every night and double-counting exposure.
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='weather_cue_impression'
         AND column_name='shown_on' AND data_type='date'
    expect: rowcount_eq
    value: 1
    continuous: true    # flipped 2026-09-02 — prod apply landed (receipt 5.0.0-cueinstrument-20260902)

  - name: post_plan_generated_at_is_timestamptz
    note: >
      The staleness coordinate. A `timestamp without time zone` here would silently re-anchor
      "which nightly run produced this cue" to whatever the session TimeZone happened to be, which
      is the exact question the 02:00-vs-15:30 form split turns on.
    sql: |
      SELECT 1 FROM information_schema.columns
       WHERE table_schema='public' AND table_name='weather_cue_impression'
         AND column_name='plan_generated_at' AND data_type='timestamp with time zone'
    expect: rowcount_eq
    value: 1
    continuous: true    # flipped 2026-09-02 — prod apply landed (receipt 5.0.0-cueinstrument-20260902)

  - name: post_check_constraints_present
    note: >
      cue is closed at engine.js computeCallout's five rules; form is closed at the render's two
      wordings. Both are analysis partitions, not decoration — an out-of-vocabulary value must fail
      loudly rather than pool a sixth rule into an existing rate.
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid='public.weather_cue_impression'::regclass AND contype='c'
         AND conname IN ('weather_cue_impression_cue_chk','weather_cue_impression_form_chk')
    expect: rowcount_eq
    value: 2
    continuous: true    # flipped 2026-09-02 — prod apply landed (receipt 5.0.0-cueinstrument-20260902)

  - name: post_cue_check_carries_all_five_rules
    note: >
      Tighter than "the constraint exists". computeCallout has FIVE rules; a CHECK that shipped with
      four would drop exactly one rule's impressions and nothing else — a silent measurement hole in
      the shape of a working feature.
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid='public.weather_cue_impression'::regclass
         AND conname='weather_cue_impression_cue_chk'
         AND pg_get_constraintdef(oid) LIKE '%freeze%'
         AND pg_get_constraintdef(oid) LIKE '%cold%'
         AND pg_get_constraintdef(oid) LIKE '%heat%'
         AND pg_get_constraintdef(oid) LIKE '%rain%'
         AND pg_get_constraintdef(oid) LIKE '%wet%'
    expect: rowcount_eq
    value: 1
    continuous: true    # flipped 2026-09-02 — prod apply landed (receipt 5.0.0-cueinstrument-20260902)

  - name: post_no_foreign_keys
    note: >
      Deliberate. Deviation 1 in 0a: the cue is garden-wide and names no planting, so there is no
      honest FK target. An FK appearing here means someone added an invented plant_id.
    sql: |
      SELECT 1 FROM pg_constraint
       WHERE conrelid='public.weather_cue_impression'::regclass AND contype='f'
    expect: rowcount_eq
    value: 0
    continuous: true    # flipped 2026-09-02 — prod apply landed (receipt 5.0.0-cueinstrument-20260902)

  - name: post_unique_guard_columns
    note: >
      The ON CONFLICT target the writer names: (user_id, shown_on, cue). Without it, every open of
      Today mints another row and "impressions per day" measures phone-checking frequency instead of
      exposure. Reads pg_catalog, NOT information_schema.table_constraints — that view is
      privilege-filtered to the table owner and returns zero rows for garden_ro while the constraint
      sits there perfectly healthy (v4-weatherdaily-001 note, re-confirmed on live prod 2026-08-12).
    sql: |
      SELECT 1
        FROM pg_constraint c
        JOIN LATERAL unnest(c.conkey) AS k(attnum) ON true
        JOIN pg_attribute a ON a.attrelid = c.conrelid AND a.attnum = k.attnum
       WHERE c.conrelid='public.weather_cue_impression'::regclass AND c.contype='u'
         AND c.conname='uq_weather_cue_impression_day'
         AND a.attname IN ('user_id','shown_on','cue')
    expect: rowcount_eq
    value: 3
    continuous: true    # flipped 2026-09-02 — prod apply landed (receipt 5.0.0-cueinstrument-20260902)

  - name: post_unique_guard_has_exactly_three_columns
    note: >
      Pairs with the gate above: that one proves the three expected columns are IN the key; this one
      proves nothing else is. A four-column key would satisfy the filtered gate and still break the
      writer's ON CONFLICT column-list target.
    sql: |
      SELECT 1
        FROM pg_constraint c
        JOIN LATERAL unnest(c.conkey) AS k(attnum) ON true
       WHERE c.conrelid='public.weather_cue_impression'::regclass AND c.contype='u'
         AND c.conname='uq_weather_cue_impression_day'
    expect: rowcount_eq
    value: 3
    continuous: true    # flipped 2026-09-02 — prod apply landed (receipt 5.0.0-cueinstrument-20260902)

  - name: post_cue_day_index_present
    note: >
      The analysis read shape (per-cue time series). A missing index never errors — it just makes
      the join quietly awful — so its presence is asserted here rather than discovered in a query
      plan later.
    sql: |
      SELECT 1 FROM pg_indexes
       WHERE schemaname='public' AND tablename='weather_cue_impression'
         AND indexname='idx_weather_cue_impression_cue_day'
    expect: rowcount_eq
    value: 1
    continuous: true    # flipped 2026-09-02 — prod apply landed (receipt 5.0.0-cueinstrument-20260902)

  - name: post_starts_empty
    note: >
      PERMANENT apply-window gate — NEVER flip to continuous (L-369 category 1). The Today beacon
      populates this table from the first cue-day after the Lambda ships, so this assert is true
      only inside the apply window. It exists solely to prove the DDL itself seeded nothing.
    sql: |
      SELECT 1 FROM public.weather_cue_impression
    expect: rowcount_eq
    value: 0
    continuous: false   # PERMANENTLY window-scoped — the feature's own writer fills the table
                        # (L-369: emptiness asserts are never continuous)
