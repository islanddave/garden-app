# gates.yml
# V5-PUTUPMAKE-001 — Put-Up release 1b ("Put it up"), the database half. Three files, three checkpoints:
#
#   0a-additive-ddl.sql         the schema, stamp '5.0.0-putupmake-001'. Before it: `pre` + the
#                               sweep_* gates (README.md's two pre-checks are sweep_no_remaining_above_package
#                               and sweep_no_duplicate_live_place_groups — run them IMMEDIATELY before
#                               every apply, staging and prod).
#   ── B's promote; verify-deploy shows B's Lambda live ──
#   0p-post-deploy-backfill.sql the use_by_basis backfill, stamp '5.0.0-putupmake-001-backfill'. Before
#                               it: the mid_backfill_* gates (the runner has no `mid` phase, so they sit
#                               in `sweep`, distinguished by name — the v5-preservunit-001 convention).
#   0r-rollback.sql             guarded; valid only while B's code is off dev (05-release-train §4).
#
# READ EACH CHECKPOINT'S OWN GATES. `--phase sweep` before 0a reports mid_backfill_0a_applied as FAIL,
# correctly: that gate belongs to the 0p checkpoint. Before 0a read sweep_* only; before 0p read mid_*.
#
# ── SELF-ARMING, AND THE HOUSE RULE ABOUT WHEN NOT TO ────────────────────────────────────────────
# `continuous:` defaults to true and gate-invariants.yml runs `--all --phase post --continuous-only`
# against live prod AND staging on every migrations/** push to dev, on the Tuesday cron (MAIN's corpus)
# and on dispatch — including dispatches on the putup-train ref BEFORE B's sitting, when neither
# database has this DDL. So:
#   * a post gate that is FALSE today asserts only once 0a has run: it is armed on this migration's own
#     schema_version row (`EXISTS (... version = '5.0.0-putupmake-001')`) — vacuous before, permanent
#     after, no follow-up edit. 0a writes the row in the same transaction as the DDL.
#   * a post gate that is TRUE today is NOT armed (the v4-putupmethod-001 rule): arming it would make it
#     vacuous today and delete a real assertion. Each unarmed gate below says so.
#   * the NULL-basis gate is armed on the BACKFILL's stamp, not 0a's: pushing the directory must not red
#     a database the post-deploy backfill has not reached (review3, data-schema-architect).
#   * catalog joins only, never `::regclass` (a regclass cast errors even under a false WHERE), and no
#     query names a column 0a adds: data gates over new columns read `to_jsonb(row) ->> 'col'`, which is
#     NULL — not 42703 — on a database without the column. So every gate here is vacuous, never ERROR,
#     on prod and staging as they stand, and stays so while only earlier releases are applied.
#   * only rowcount_eq / rowcount_gte / scalar_eq; every count-shaped gate returns one row per violator
#     so a FAIL names what is wrong; no prod-derived absolute (staging carries different data).
#
# ── THE GATE CENSUS: gates in OTHER directories this migration must keep green ─────────────────────
# (05-release-train §6 requires v4-cascadesweep-001 and v4-evtanchordel-001 to be named here.)
#   v4-cascadesweep-001   post_no_cascade_onto_a_soft_deletable_table — why kbi -> kitchen_batch moves
#                         to NO ACTION in the statement that adds kbi.deleted_at; ksl gains no deleted_at.
#   v4-evtanchordel-001   post_no_setnull_fk_inside_an_anchor_check — why no CHECK names kbi.plant_id,
#                         and (with the implication CHECK it cannot see) why preservation_log.batch_id
#                         leaves SET NULL.
#   v4-archpreservguard-001  both routines name preservation_log, before the harvest_log delete.
#   v4-archrestore-001    photo_detach_archive and its ordering, the pre-existing guards, the cross-
#                         container guard text, the return shape.
#   v4-softdelcascade-001 the photo detach precedes the event delete.
#   v5-inflightbatch-001  Guard 3 and Guard 4 message text; kbi -> harvest_log RESTRICT; ksl ->
#                         kitchen_batch CASCADE; every kitchen-table CHECK validated; the view exists.
#   v4-putup-001          attribution / method_other / quantity_value CHECKs present by name; the
#                         plants, harvest_log and crop_types FKs from preservation_log unchanged.
#   v4-putupprov-001      post_attribution_check_unchanged: the relaxed CHECK names no source_kind.
#   v4-putupsession-001   no CHECK mentions preserved_at_approx; that column untouched.
#   v5-phrecord-001       kitchen_stage_log's pH pair is the only pH constraint there; the view keeps the
#                         last-pH pair and its garden_ro grant (CREATE OR REPLACE keeps the ACL).
#   v5-kbownertrigger-001 the shared prevent_ownership_transfer() stays untouched.
#   v4-harvestaudit-001   no INSERT arm on any audit trigger.
#   v5-preservunit-001    post_quantity_never_recorded_without_its_unit (release 1a's restatement):
#                         satisfied by chk_preservation_log_quantity_pairing, validated, naming both.
#   v4-putupprov-001 / v4-putupsession-001 / v5-putupmultisource-001 / v5-phrecord-001 column pins:
#                         restated by release 1a as named-column presence, so the added columns pass.
# Proven, not asserted: MAIN's and this branch's `--all --phase post --continuous-only` were run against
# a local PG 17 replica of prod before and after 0a (README.md).

pre:
  - name: pre_not_already_applied
    sql: |
      SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001'
    expect: rowcount_eq
    value: 0

  - name: pre_family_relations_present
    sql: |
      SELECT count(*)
        FROM pg_class c
        JOIN pg_namespace n ON n.oid = c.relnamespace
       WHERE n.nspname = 'public'
         AND ((c.relkind = 'r'
               AND c.relname IN ('preservation_log','kitchen_batch','kitchen_batch_input',
                                 'kitchen_stage_log','storage_location'))
              OR (c.relkind = 'v' AND c.relname = 'v_kitchen_batch_current'))
    expect: scalar_eq
    value: 6

  # Half-applied or hand-applied state: none of 0a's 29 columns may exist yet.
  - name: pre_no_1b_column_yet
    sql: |
      SELECT c.table_name, c.column_name
        FROM information_schema.columns c
       WHERE c.table_schema = 'public'
         AND (c.table_name, c.column_name) IN (VALUES
               ('preservation_log','label'), ('preservation_log','container_label'),
               ('preservation_log','use_by_basis'), ('preservation_log','storage_moved_at'),
               ('preservation_log','texture'), ('preservation_log','is_raw'),
               ('preservation_log','in_oil'), ('preservation_log','ph_reading'),
               ('preservation_log','ph_read_at'), ('preservation_log','put_up_stage_id'),
               ('preservation_log','preserved_at_precision'), ('preservation_log','idempotency_key'),
               ('kitchen_batch','idempotency_key'),
               ('kitchen_stage_log','entered_precision'), ('kitchen_stage_log','voids_id'),
               ('kitchen_stage_log','idempotency_key'),
               ('kitchen_batch_input','plant_id'), ('kitchen_batch_input','preservation_log_id'),
               ('kitchen_batch_input','crop_type_slug'), ('kitchen_batch_input','source_label'),
               ('kitchen_batch_input','role'), ('kitchen_batch_input','salt_pct'),
               ('kitchen_batch_input','salt_base'), ('kitchen_batch_input','base_g'),
               ('kitchen_batch_input','put_up_stage_id'), ('kitchen_batch_input','output_id'),
               ('kitchen_batch_input','ordinal'), ('kitchen_batch_input','deleted_at'),
               ('kitchen_batch_input','idempotency_key'))
    expect: rowcount_eq
    value: 0

  # 0a names all four in CREATE TRIGGER / the audit call; a missing one fails mid-transaction.
  - name: pre_trigger_functions_exist
    sql: |
      SELECT count(DISTINCT p.proname)
        FROM pg_proc p
        JOIN pg_namespace n ON n.oid = p.pronamespace
       WHERE n.nspname = 'public'
         AND p.proname IN ('set_updated_at','prevent_kitchen_batch_ownership_transfer',
                           'audit_stmt_update','audit_watched_slice')
    expect: scalar_eq
    value: 4

  # preservation_log carried no trigger on 2026-09-29 (both envs); 0a attaches three. A trigger found
  # here was added by someone else since — read it before stacking three more.
  - name: pre_preservation_log_has_no_triggers
    sql: |
      SELECT g.tgname
        FROM pg_trigger g
        JOIN pg_class t ON t.oid = g.tgrelid
        JOIN pg_namespace n ON n.oid = t.relnamespace
       WHERE n.nspname = 'public' AND t.relname = 'preservation_log' AND NOT g.tgisinternal
    expect: rowcount_eq
    value: 0

  # 0a replaces these three definitions wholesale. Each fingerprint was read on prod AND staging
  # 2026-09-29 (identical, PostgreSQL 17.11) and is what 0a's own guard accepts as "pre-1b"; a mismatch
  # means someone changed it since, and 0a would refuse. Fold their change into 0a, re-pin, re-rehearse.
  - name: pre_archive_plant_events_is_the_captured_body
    sql: |
      SELECT md5(p.prosrc)
        FROM pg_proc p
        JOIN pg_namespace n ON n.oid = p.pronamespace
       WHERE n.nspname = 'public' AND p.proname = 'archive_plant_events'
    expect: scalar_eq
    value: 'b98b7fa25681bd8929bba311ee490869'

  - name: pre_archive_container_events_is_the_captured_body
    sql: |
      SELECT md5(p.prosrc)
        FROM pg_proc p
        JOIN pg_namespace n ON n.oid = p.pronamespace
       WHERE n.nspname = 'public' AND p.proname = 'archive_container_events'
    expect: scalar_eq
    value: '76a4c2e1969ac0c675a2a853578a406d'

  - name: pre_view_is_the_captured_definition
    sql: |
      SELECT md5(pg_get_viewdef(c.oid, true))
        FROM pg_class c
        JOIN pg_namespace n ON n.oid = c.relnamespace
       WHERE n.nspname = 'public' AND c.relname = 'v_kitchen_batch_current' AND c.relkind = 'v'
    expect: scalar_eq
    value: '6eaff4dacaa1963064cd25258e1a29a3'

  # 0a owns chk_preservation_log_quantity_unit (DROP IF EXISTS + ADD). A unit CHECK under ANY OTHER name
  # would survive 0a and could be narrower than the union — two vocabularies on one column.
  - name: pre_no_other_check_names_quantity_unit
    sql: |
      SELECT c.conname
        FROM pg_constraint c
        JOIN pg_class t ON t.oid = c.conrelid
        JOIN pg_namespace n ON n.oid = t.relnamespace
       WHERE n.nspname = 'public' AND t.relname = 'preservation_log' AND c.contype = 'c'
         AND pg_get_constraintdef(c.oid) LIKE '%quantity_unit%'
         AND c.conname NOT IN ('chk_preservation_log_quantity_unit')
    expect: rowcount_eq
    value: 0

sweep:
  # ── 0a's checkpoint: run IMMEDIATELY before every apply of 0a (L-058) ─────────────────────────
  # PRE-CHECK 1 (README). chk_preservation_log_remaining_within_package is created VALIDATED, so one
  # violating row aborts the whole apply. WHOLE-TABLE: a CHECK does not read deleted_at.
  - name: sweep_no_remaining_above_package
    sql: |
      SELECT id FROM public.preservation_log WHERE remaining_count > package_count
    expect: rowcount_eq
    value: 0

  # PRE-CHECK 2 (README). The partial unique index would fail to build. LIVE rows only, because the
  # index is partial on deleted_at IS NULL.
  - name: sweep_no_duplicate_live_place_groups
    sql: |
      SELECT user_id, kind, lower(label)
        FROM public.storage_location
       WHERE deleted_at IS NULL
       GROUP BY 1, 2, 3
      HAVING count(*) > 1
    expect: rowcount_eq
    value: 0

  # The column has had NO vocabulary until 0a; this is where the union's superset claim meets the data.
  # WHOLE-TABLE. A hit means: widen the union in 0a (it never narrows), do not force the apply.
  - name: sweep_every_stored_unit_in_the_union
    sql: |
      SELECT id, quantity_unit
        FROM public.preservation_log
       WHERE quantity_unit IS NOT NULL
         AND quantity_unit NOT IN (
               'g','kg','oz','lb','ml','l','tsp','tbsp','fl oz','cup','pint','qt','gal',
               'count','clove','head','bunch','pinch','peck','bushel','half-bushel','flat','jar','bag',
               'other',
               'lbs','cups','pints','quarts','bushels','half-bushels','pecks','flats','jars','bags')
    expect: rowcount_eq
    value: 0

  # The pairing CHECK's precondition, asserted rather than assumed (both columns are NOT NULL today).
  - name: sweep_every_quantity_pair_whole_and_positive
    sql: |
      SELECT id
        FROM public.preservation_log
       WHERE (quantity_value IS NULL) <> (quantity_unit IS NULL) OR quantity_value <= 0
    expect: rowcount_eq
    value: 0

  # kitchen_stage_log.amount_unit had no CHECK; 0a arms KITCHEN_UNITS on it.
  - name: sweep_every_stage_amount_unit_in_kitchen_units
    sql: |
      SELECT id, amount_unit
        FROM public.kitchen_stage_log
       WHERE amount_unit IS NOT NULL
         AND amount_unit NOT IN (
               'g','kg','oz','lb','ml','l','tsp','tbsp','fl oz','cup','pint','qt','gal',
               'count','clove','head','bunch','pinch','peck','bushel','half-bushel','flat','jar','bag',
               'other')
    expect: rowcount_eq
    value: 0

  # ── 0p's checkpoint: after verify-deploy shows B's Lambda live, before 0p ──────────────────────
  - name: mid_backfill_0a_applied
    sql: |
      SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001'
    expect: rowcount_eq
    value: 1

  - name: mid_backfill_not_already_applied
    sql: |
      SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001-backfill'
    expect: rowcount_eq
    value: 0

  - name: mid_backfill_b_lambda_is_live
    manual: true
    note: >
      NOT EXECUTABLE FROM POSTGRES, so it is a runbook step the runner counts as MANUAL, never as a
      pass. Before 0p: `python3 scripts/putup-sitting-check.py --f-deployed --only lambdas` must PASS
      (the deployed preservation, plants and storage-location zips carry the promoted build's files;
      scripts/verify-deploy.py reads run conclusions only, not CodeSha256). While release 1a's Lambda is live, a basis on a
      row lets 1a's date Edit raise 23514; after 0p, 0r is closed and recovery is forward-fix only.

post:
  # ── The apply receipt, made continuous by arming it on the DDL rather than on itself ───────────
  # "The stamp exists" cannot be armed on the stamp. Armed on 0a's first column instead: the DDL landed
  # AND the row is missing means a hand-applied 0a or a deleted row — the state that would silently
  # disarm every gate below. Same shape as v5-inflightbatch-001's revised receipt.
  - name: post_schema_version_recorded
    sql: |
      SELECT 1
       WHERE EXISTS (SELECT 1 FROM information_schema.columns
                      WHERE table_schema = 'public' AND table_name = 'preservation_log'
                        AND column_name = 'use_by_basis')
         AND NOT EXISTS (SELECT 1 FROM public.schema_version
                          WHERE version = '5.0.0-putupmake-001')
    expect: rowcount_eq
    value: 0

  # ── Columns ─────────────────────────────────────────────────────────────────────────────────
  # Every 0a column present, NULLABLE, NO DEFAULT (V4: every new column nullable; a default would assert
  # a value on every row written before the column existed). Plus the three columns 0a made nullable.
  - name: post_1b_columns_present_nullable_no_default
    sql: |
      SELECT v.tbl, v.col
        FROM (VALUES
               ('preservation_log','label'), ('preservation_log','container_label'),
               ('preservation_log','use_by_basis'), ('preservation_log','storage_moved_at'),
               ('preservation_log','texture'), ('preservation_log','is_raw'),
               ('preservation_log','in_oil'), ('preservation_log','ph_reading'),
               ('preservation_log','ph_read_at'), ('preservation_log','put_up_stage_id'),
               ('preservation_log','preserved_at_precision'), ('preservation_log','idempotency_key'),
               ('preservation_log','quantity_value'), ('preservation_log','quantity_unit'),
               ('kitchen_batch','idempotency_key'),
               ('kitchen_stage_log','entered_precision'), ('kitchen_stage_log','voids_id'),
               ('kitchen_stage_log','idempotency_key'), ('kitchen_stage_log','entered_at'),
               ('kitchen_batch_input','plant_id'), ('kitchen_batch_input','preservation_log_id'),
               ('kitchen_batch_input','crop_type_slug'), ('kitchen_batch_input','source_label'),
               ('kitchen_batch_input','role'), ('kitchen_batch_input','salt_pct'),
               ('kitchen_batch_input','salt_base'), ('kitchen_batch_input','base_g'),
               ('kitchen_batch_input','put_up_stage_id'), ('kitchen_batch_input','output_id'),
               ('kitchen_batch_input','ordinal'), ('kitchen_batch_input','deleted_at'),
               ('kitchen_batch_input','idempotency_key')) AS v(tbl, col)
       WHERE EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001')
         AND NOT EXISTS (SELECT 1 FROM information_schema.columns c
                          WHERE c.table_schema = 'public' AND c.table_name = v.tbl
                            AND c.column_name = v.col
                            AND c.is_nullable = 'YES' AND c.column_default IS NULL)
    expect: rowcount_eq
    value: 0

  # ── Every CHECK the release relies on: present by name, on its table, VALIDATED ─────────────────
  # Kept names included (quantity_value, start_pairing, attribution, method_other): a later rename or a
  # NOT VALID re-add reds here.
  - name: post_1b_checks_present_and_validated
    sql: |
      SELECT v.tbl, v.con
        FROM (VALUES
               ('preservation_log','chk_preservation_log_label_nonblank'),
               ('preservation_log','chk_preservation_log_label_len'),
               ('preservation_log','chk_preservation_log_use_by_basis'),
               ('preservation_log','chk_preservation_log_use_by_basis_date'),
               ('preservation_log','chk_preservation_log_texture'),
               ('preservation_log','chk_preservation_log_texture_method'),
               ('preservation_log','chk_preservation_log_ph_pairing'),
               ('preservation_log','chk_preservation_log_ph_scale'),
               ('preservation_log','chk_preservation_log_put_up_stage_batch'),
               ('preservation_log','chk_preservation_log_preserved_at_precision'),
               ('preservation_log','chk_preservation_log_quantity_pairing'),
               ('preservation_log','chk_preservation_log_quantity_unit'),
               ('preservation_log','chk_preservation_log_quantity_value'),
               ('preservation_log','chk_preservation_log_remaining_within_package'),
               ('preservation_log','chk_preservation_log_attribution'),
               ('preservation_log','chk_preservation_log_method_other'),
               ('kitchen_batch','chk_kitchen_batch_start_precision'),
               ('kitchen_batch','chk_kitchen_batch_start_pairing'),
               ('kitchen_batch','chk_kitchen_batch_kind_other'),
               ('kitchen_stage_log','chk_ksl_stage_kind'),
               ('kitchen_stage_log','chk_ksl_entered_precision'),
               ('kitchen_stage_log','chk_ksl_entered_pairing'),
               ('kitchen_stage_log','chk_ksl_void_pairing'),
               ('kitchen_stage_log','chk_ksl_amount_unit'),
               ('kitchen_batch_input','chk_kbi_kind'),
               ('kitchen_batch_input','chk_kbi_qty_unit'),
               ('kitchen_batch_input','chk_kbi_put_up_pairing'),
               ('kitchen_batch_input','chk_kbi_role'),
               ('kitchen_batch_input','chk_kbi_salt_base'),
               ('kitchen_batch_input','chk_kbi_output_needs_put_up')) AS v(tbl, con)
       WHERE EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001')
         AND NOT EXISTS (SELECT 1
                           FROM pg_constraint c
                           JOIN pg_class t ON t.oid = c.conrelid
                           JOIN pg_namespace n ON n.oid = t.relnamespace
                          WHERE n.nspname = 'public' AND t.relname = v.tbl AND c.conname = v.con
                            AND c.contype = 'c' AND c.convalidated)
    expect: rowcount_eq
    value: 0

  # The relaxed CHECKs carry their new leg, and the attribution CHECK names neither source_kind (also
  # v4-putupprov-001's pin) nor batch_id (V4: no batch_id leg). One row per missing or forbidden term.
  - name: post_relaxed_checks_have_their_label_leg
    sql: |
      SELECT v.con, v.term, v.must
        FROM (VALUES
               ('chk_preservation_log_attribution', '(label IS NOT NULL)', true),
               ('chk_preservation_log_attribution', 'source_kind', false),
               ('chk_preservation_log_attribution', 'batch_id', false),
               ('chk_preservation_log_method_other', '(label IS NOT NULL)', true)) AS v(con, term, must)
        JOIN pg_constraint c ON c.conname = v.con
        JOIN pg_class t ON t.oid = c.conrelid
        JOIN pg_namespace n ON n.oid = t.relnamespace
       WHERE n.nspname = 'public' AND t.relname = 'preservation_log'
         AND EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001')
         AND (strpos(pg_get_constraintdef(c.oid), v.term) > 0) <> v.must
    expect: rowcount_eq
    value: 0

  # ── Vocabularies: every word 1b relies on is admitted (one row per word missing) ────────────────
  - name: post_widened_vocabularies_admit_the_1b_words
    sql: |
      SELECT v.tbl, v.con, v.word
        FROM (VALUES
               ('kitchen_stage_log','chk_ksl_stage_kind','reopened'),
               ('kitchen_stage_log','chk_ksl_stage_kind','paused'),
               ('kitchen_stage_log','chk_ksl_stage_kind','resumed'),
               ('kitchen_stage_log','chk_ksl_stage_kind','noted'),
               ('kitchen_stage_log','chk_ksl_stage_kind','put_up'),
               ('kitchen_stage_log','chk_ksl_stage_kind','void'),
               ('kitchen_batch_input','chk_kbi_kind','garden'),
               ('kitchen_batch_input','chk_kbi_kind','put_up'),
               ('kitchen_batch_input','chk_kbi_kind','harvest'),
               ('kitchen_batch','chk_kitchen_batch_start_precision','season'),
               ('kitchen_batch','chk_kitchen_batch_start_precision','year'),
               ('kitchen_stage_log','chk_ksl_entered_precision','season'),
               ('kitchen_stage_log','chk_ksl_entered_precision','unknown'),
               ('preservation_log','chk_preservation_log_preserved_at_precision','after'),
               ('preservation_log','chk_preservation_log_preserved_at_precision','unknown'),
               ('preservation_log','chk_preservation_log_use_by_basis','typed'),
               ('preservation_log','chk_preservation_log_use_by_basis','recipe'),
               ('preservation_log','chk_preservation_log_use_by_basis','table'),
               ('preservation_log','chk_preservation_log_use_by_basis','house'),
               ('preservation_log','chk_preservation_log_use_by_basis','none')) AS v(tbl, con, word)
       WHERE EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001')
         AND NOT EXISTS (SELECT 1
                           FROM pg_constraint c
                           JOIN pg_class t ON t.oid = c.conrelid
                           JOIN pg_namespace n ON n.oid = t.relnamespace
                          WHERE n.nspname = 'public' AND t.relname = v.tbl AND c.conname = v.con
                            AND strpos(pg_get_constraintdef(c.oid), '''' || v.word || '''') > 0)
    expect: rowcount_eq
    value: 0

  # THE UNION NEVER NARROWS (V4 "Units"): all 35 values admitted by the unit CHECK, walked against the
  # live definition so a value lost in a DROP + ADD is named. The quotes are part of the probe, so
  # 'half-bushel' is not satisfied by 'half-bushels' nor 'l' by 'lb'.
  - name: post_unit_check_is_the_permissive_union
    sql: |
      SELECT v.word
        FROM unnest(ARRAY[
               'g','kg','oz','lb','ml','l','tsp','tbsp','fl oz','cup','pint','qt','gal',
               'count','clove','head','bunch','pinch','peck','bushel','half-bushel','flat','jar','bag',
               'other',
               'lbs','cups','pints','quarts','bushels','half-bushels','pecks','flats','jars','bags'])
             AS v(word)
       WHERE EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001')
         AND NOT EXISTS (SELECT 1
                           FROM pg_constraint c
                           JOIN pg_class t ON t.oid = c.conrelid
                           JOIN pg_namespace n ON n.oid = t.relnamespace
                          WHERE n.nspname = 'public' AND t.relname = 'preservation_log'
                            AND c.conname = 'chk_preservation_log_quantity_unit'
                            AND strpos(pg_get_constraintdef(c.oid), '''' || v.word || '''') > 0)
    expect: rowcount_eq
    value: 0

  # KITCHEN_UNITS (25) on both kitchen unit columns, the same walk.
  - name: post_kitchen_unit_checks_carry_kitchen_units
    sql: |
      SELECT k.tbl, k.con, v.word
        FROM (VALUES ('kitchen_batch_input','chk_kbi_qty_unit'),
                     ('kitchen_stage_log','chk_ksl_amount_unit')) AS k(tbl, con)
       CROSS JOIN unnest(ARRAY[
               'g','kg','oz','lb','ml','l','tsp','tbsp','fl oz','cup','pint','qt','gal',
