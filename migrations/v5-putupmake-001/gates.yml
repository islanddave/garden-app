  # ── Every trigger the release relies on: present, ENABLED, the right function and shape ────────
  # tgtype bits: 1 row-level, 2 BEFORE, 16 UPDATE — so BEFORE UPDATE FOR EACH ROW = 19, AFTER UPDATE
  # FOR EACH STATEMENT = 16 (no INSERT bit 4 and no DELETE bit 8 on the audit trigger). The shape is read
  # from tgtype and the transition-table names, never from pg_get_triggerdef text.
  - name: post_1b_triggers_present_and_enabled
