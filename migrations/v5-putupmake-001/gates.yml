  # ── The archive routines skip removed lines, and the container routine names kitchen batches ───
  # Both filter kbi.deleted_at; the container routine carries Guard 5's message; and in BOTH the kitchen
  # guard reads kitchen_batch_input BEFORE the harvest_log delete (positional, like
  # v4-archpreservguard-001's gate: a guard below the delete is decoration).
  - name: post_archive_routines_filter_removed_lines
    sql: |
      SELECT p.proname, v.problem
        FROM pg_proc p
        JOIN pg_namespace n ON n.oid = p.pronamespace
       CROSS JOIN LATERAL (VALUES
               ('no kbi.deleted_at filter', strpos(p.prosrc, 'kbi.deleted_at IS NULL') = 0),
               ('kitchen guard after the harvest_log delete',
                strpos(p.prosrc, 'kitchen_batch_input') = 0
                OR strpos(p.prosrc, 'kitchen_batch_input')
                   > strpos(p.prosrc, 'DELETE FROM public.harvest_log')),
               ('no Guard 5 message',
                p.proname = 'archive_container_events'
                AND strpos(p.prosrc, 'kitchen_batch row(s) record a batch fed by these harvests') = 0))
             AS v(problem, bad)
       WHERE n.nspname = 'public'
         AND p.proname IN ('archive_plant_events','archive_container_events')
         AND EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001')
         AND v.bad
    expect: rowcount_eq
