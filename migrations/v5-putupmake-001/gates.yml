  # ── The post-deploy backfill ──────────────────────────────────────────────────────────────────
  # THE NULL-BASIS GATE (V4: post-deploy, no dated row has a NULL basis). Armed on the BACKFILL's stamp
  # (and 0a's), so it asserts only once 0p has run. WHOLE-TABLE: 0p classifies soft-deleted rows too.
  # to_jsonb, not the column name: vacuous rather than 42703 where 0a has not run.
  - name: post_no_dated_row_without_a_basis
    sql: |
      SELECT p.id
        FROM public.preservation_log p
       WHERE EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001-backfill')
         AND EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001')
         AND (to_jsonb(p) ->> 'use_by_basis') IS NULL
         AND p.use_by_target IS NOT NULL
    expect: rowcount_eq
    value: 0

  # A FORGOTTEN BACKFILL CANNOT HIDE BEHIND THE GATE ABOVE. That gate is vacuous until 0p's stamp exists,
  # so a backfill that never ran would leave it green forever. This one arms itself on B being USED: once
  # any jar carries a basis (only B's writers set one) the backfill's stamp must exist. Red between B's
  # first put-up and step 12 of B's sitting — true, and short.
  - name: post_backfill_ran_once_b_writes_a_basis
    sql: |
      SELECT 1
       WHERE EXISTS (SELECT 1 FROM public.preservation_log p
                      WHERE (to_jsonb(p) ->> 'use_by_basis') IS NOT NULL)
         AND NOT EXISTS (SELECT 1 FROM public.schema_version
                          WHERE version = '5.0.0-putupmake-001-backfill')
    expect: rowcount_eq
    value: 0

  # ── Apply-window receipt ──────────────────────────────────────────────────────────────────────
  # Right after 0a, and until B's code writes: no B-shaped row exists — 0a wrote no data, and 0r's window
  # is open. B's first put-up, key or basis ends the window, which is why this is continuous: false; and
  # 0p's stamp closes it for good (the backfill sets a basis on every row), so it stands down there
  # rather than reading as a failure at 0p's checkpoint. to_jsonb so a runbook run of the whole post
  # phase on an unapplied database reports 0, not 42703.
  - name: post_no_b_shaped_row_yet
    continuous: false
    sql: |
      SELECT x.what, x.id
        FROM (SELECT 'stage row' AS what, s.id FROM public.kitchen_stage_log s
               WHERE (to_jsonb(s) ->> 'stage_kind') IN ('put_up','void')
                  OR (to_jsonb(s) ->> 'idempotency_key') IS NOT NULL
              UNION ALL
              SELECT 'jar', p.id FROM public.preservation_log p
               WHERE (to_jsonb(p) ->> 'use_by_basis') IS NOT NULL
                  OR (to_jsonb(p) ->> 'idempotency_key') IS NOT NULL
              UNION ALL
