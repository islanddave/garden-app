  # The audit trigger watches EXACTLY V4's nine columns: one row per column watched but not listed, or
  # listed but not watched, or watched but absent from the table (a typo'd name compares NULL = NULL
  # forever — v4-harvestaudit-001's vacuity mode). Arguments read from the live trigger.
  #
  # STANDS DOWN ON F'S STAMP (the one edit release F makes to this directory; 06-ferment-path §3.9):
  # v5-fermentpath-001 re-creates this trigger watching these nine plus remaining_amount, shu_est_low,
  # shu_est_high and cooked, and its post_audit_watches_exactly_the_thirteen takes over. Every leg carries
  # the NOT EXISTS so no leg reds on a database F has reached. 0a, 0r and the stamp are untouched.
  - name: post_audit_watches_exactly_the_nine
    sql: |
      WITH watched AS (
        SELECT btrim(x, ' ''') AS col
          FROM pg_trigger g
          JOIN pg_class t ON t.oid = g.tgrelid
          JOIN pg_namespace n ON n.oid = t.relnamespace
         CROSS JOIN LATERAL regexp_split_to_table(
                 substring(pg_get_triggerdef(g.oid) FROM 'audit_stmt_update\(([^)]*)\)'), ',') AS x
         WHERE n.nspname = 'public' AND t.relname = 'preservation_log'
           AND g.tgname = 'trg_audit_preservation_log_upd'
      ), expected(col) AS (
        VALUES ('storage_location_id'), ('use_by_target'), ('use_by_basis'), ('package_count'),
               ('remaining_count'), ('label'), ('is_raw'), ('in_oil'), ('deleted_at')
      )
      SELECT 'not watched' AS problem, e.col FROM expected e
       WHERE EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001')
         AND NOT EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-fermentpath-001')
         AND NOT EXISTS (SELECT 1 FROM watched w WHERE w.col = e.col)
      UNION ALL
      SELECT 'watched but not in V4''s list', w.col FROM watched w
       WHERE NOT EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-fermentpath-001')
         AND NOT EXISTS (SELECT 1 FROM expected e WHERE e.col = w.col)
      UNION ALL
      SELECT 'watched but not a column', w.col FROM watched w
       WHERE NOT EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-fermentpath-001')
         AND NOT EXISTS (SELECT 1 FROM information_schema.columns c
                          WHERE c.table_schema = 'public' AND c.table_name = 'preservation_log'
                            AND c.column_name = w.col)
    expect: rowcount_eq
    value: 0

  # ── The ownership-trigger function names real columns on its table (per touched table) ─────────
  # BUG-KBOWNERTRIGGER-001's class: a trigger function naming OLD.<col> / NEW.<col> the table lacks
  # raises 42703 on every UPDATE and no existence check can see it. preservation_log gains its ownership
  # trigger in 1b (armed: it must EXIST once 0a ran); kitchen_batch has one (NOT armed: true today —
  # v5-kbownertrigger-001's own check is apply-window only, this makes it continuous). One row per
  # missing trigger, per column the table lacks, or per function naming no column at all.
  - name: post_ownership_trigger_names_real_columns_preservation_log
    sql: |
      WITH own AS (
        SELECT g.tgname, p.prosrc
          FROM pg_trigger g
          JOIN pg_class t ON t.oid = g.tgrelid
          JOIN pg_namespace n ON n.oid = t.relnamespace
          JOIN pg_proc p ON p.oid = g.tgfoid
         WHERE n.nspname = 'public' AND t.relname = 'preservation_log' AND NOT g.tgisinternal
           AND p.proname LIKE 'prevent%ownership_transfer'
      ), ref AS (
        SELECT own.tgname, lower((regexp_matches(own.prosrc, '(?:OLD|NEW)\.([a-z_][a-z0-9_]*)', 'gi'))[1]) AS col
          FROM own
      )
      SELECT 'no ownership trigger' AS problem, NULL::text AS col
       WHERE EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-putupmake-001')
         AND NOT EXISTS (SELECT 1 FROM own)
      UNION ALL
      SELECT 'names no column', own.tgname FROM own
       WHERE NOT EXISTS (SELECT 1 FROM ref WHERE ref.tgname = own.tgname)
      UNION ALL
      SELECT 'names a column the table lacks', ref.col FROM ref
       WHERE NOT EXISTS (SELECT 1 FROM information_schema.columns c
                          WHERE c.table_schema = 'public' AND c.table_name = 'preservation_log'
                            AND c.column_name = ref.col)
    expect: rowcount_eq
    value: 0

  - name: post_ownership_trigger_names_real_columns_kitchen_batch
    sql: |
      WITH own AS (
        SELECT g.tgname, p.prosrc
          FROM pg_trigger g
          JOIN pg_class t ON t.oid = g.tgrelid
          JOIN pg_namespace n ON n.oid = t.relnamespace
          JOIN pg_proc p ON p.oid = g.tgfoid
         WHERE n.nspname = 'public' AND t.relname = 'kitchen_batch' AND NOT g.tgisinternal
           AND p.proname LIKE 'prevent%ownership_transfer'
      ), ref AS (
        SELECT own.tgname, lower((regexp_matches(own.prosrc, '(?:OLD|NEW)\.([a-z_][a-z0-9_]*)', 'gi'))[1]) AS col
          FROM own
      )
      SELECT 'no ownership trigger' AS problem, NULL::text AS col
       WHERE NOT EXISTS (SELECT 1 FROM own)
      UNION ALL
      SELECT 'names no column', own.tgname FROM own
       WHERE NOT EXISTS (SELECT 1 FROM ref WHERE ref.tgname = own.tgname)
      UNION ALL
      SELECT 'names a column the table lacks', ref.col FROM ref
       WHERE NOT EXISTS (SELECT 1 FROM information_schema.columns c
                          WHERE c.table_schema = 'public' AND c.table_name = 'kitchen_batch'
                            AND c.column_name = ref.col)
    expect: rowcount_eq
    value: 0

