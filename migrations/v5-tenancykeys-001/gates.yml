# gates.yml
# v5-tenancykeys-001: V5-SPACETENANCYKEY-001 (multi-space plan V204 step 2.0e, §2.4 "Unique keys and upserts"):
# the index gate. Stamp 5.3.12-tenancykeys-001. README.md has the rule, the apply order, the arming decision and the
# C-CONV pre-scan.
#
# ── WHAT IT ASSERTS ───────────────────────────────────────────────────────────────────────────────
#   Every unique index on an S, D or base-capable C table (class and tenancy column from
#   lambda/tenancy-classes.json) carries the tenancy key, or is exempt by class in
#   scripts/tenancy-index-exemptions.json. Per arm:
#     S  a key column is workspace_id or the table's tenancy column (spacetheme: space_id);
#     D  a key column is workspace_id or the tenancy column; on 'D via plot' tables space_id or plot_id (§2.2);
#        or the leading key column alone carries a single-column FK into an S or D table;
#     C  ('C base + private') a key column is workspace_id, or the predicate holds a bare top-level is_base
#        conjunct with no OR;
#   and class 1 by rule: the single-column primary key on id. A NULLS NOT DISTINCT index passes no arm.
#   Violation-shaped: one row per unique index that passes no arm and is not exempt,
#   '<schema>.<table>.<index> (<class>; <key columns>)'. To list them on a red, run the gate's SQL read-only.
#
# ── THE VALUES LISTS ARE THE FILES ────────────────────────────────────────────────────────────────
#   key_classes (nspname, relname, class, tenancy_column): every table of lambda/tenancy-classes.json whose class
#   is S…, D… or 'C base + private' (relkinds r, p, m, f; views hold no index). exemptions (nspname, relname,
#   indexname, class): every entry of scripts/tenancy-index-exemptions.json. lambda/tenancy-keys.static.test.js
#   holds each marked block here and in 0a-stamp.sql equal to the files (N16); `node tests/lib/tenancyKeys.mjs
#   --values` prints the rows to paste. A table not in key_classes is not checked (the 2.0b relkind gate reds on
#   an unclassed relation); an exemption naming an index that does not exist is harmless here (the test catches it
#   against the committed snapshot).
#
# ── SELF-ARMING ───────────────────────────────────────────────────────────────────────────────────
#   gate-invariants runs `gate_runner.py --all --phase post --continuous-only` against live prod and staging on
#   every migrations/** push. This directory has no DDL, so it follows v5-tenantgates-001 and
#   v5-tenancyclasses-001: a 0a that writes only the stamp (refusing first where the armed gate would red) and a 0r
#   that deletes it. The post gate returns rows only when the stamp exists. No `::regclass` anywhere: relations by
#   pg_class.relname joined to pg_namespace.
#
# REHEARSED on a throwaway local PostgreSQL 17 loaded with prod's schema and stamps (README.md). Not run against
# staging or prod as an applied migration; the unarmed pre gate was read on both (README.md).

