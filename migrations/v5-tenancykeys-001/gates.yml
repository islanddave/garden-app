                  FROM keycols kc WHERE kc.indexrelid = u.indexrelid) AS keys,
               (u.indisprimary AND u.indnkeyatts = 1
                AND EXISTS (SELECT 1 FROM keycols kc WHERE kc.indexrelid = u.indexrelid AND kc.attname = 'id')) AS pk_on_id,
