  - name: pre_no_leaf_row_states_feeding_on_these_cultivars
    env: prod
    note: >
      v_resolved_care merges system || cultivar || leaf, right wins. A leaf-scope row stating its own
      fertilize_interval_days (or no_calendar_feed) on any planting of these cultivars would override what
      0a writes on the cultivar row, so the fix would not reach that planting. None exists at authoring —
      no leaf row at all on any planting of these 21 cultivars, live or deleted; if one appears, stop and
      decide which value is meant before applying.
    sql: |
      SELECT lo.id, p.name
        FROM public.care_profile lo
        JOIN public.plants p ON p.id = lo.scope_id
       WHERE lo.scope = 'leaf'
         AND p.variety_id IN ('a11dd600-84b4-4bd6-8611-f85336bc3c2e', 'b11814aa-83ed-48e4-882d-a6709e42572f', '1b2b7bf8-0d9e-4c39-b7d7-0acd744f16f7', '3db84405-1941-4e88-bb77-58595f47c3e7', 'd9eba456-0836-4690-b3db-02aa0fb4fb1b', '219329ac-66f3-4c25-8a46-6246bb91c858', 'ba53f113-9903-449d-81b9-7dce30ef3934', 'c94e3179-b14a-4707-8ca2-1305dd0946dc', '450c3391-b809-43e5-b7ae-de16b9cce431', '3b986e62-14ca-4262-86bb-eb35c418bd19', '055e3ff1-21c0-44ce-bace-d8a900f6145a', 'd3101ac0-fd4e-456e-86b7-ebea732ac84c', 'b1fad1e2-b2e1-40ee-ab02-1f6cf9a20a6d', '72ebf73c-bf46-429a-bb2d-3243e3d0826d', '0609afc2-51ea-4045-858b-fe28060e2f20', 'f46745bf-c77e-4f42-b939-5363378a035e', '81924103-2858-408f-991e-aad591827a49', '51da1e31-c16d-4cbc-ac3b-b3c718e7472c', 'ece82bf2-6a60-4186-b031-64af0519aa49', '21a8596d-f689-4028-a1dc-a34ae94c128b', 'bc79d915-69a3-4945-8293-27314d83a29b')
