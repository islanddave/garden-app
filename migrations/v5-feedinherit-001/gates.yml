# gates.yml
# v5-feedinherit-001 — BUG-CAREFEEDINHERIT-001. Adds fertilize_interval_days to 21 cultivar care_profile
# rows (written by cadence-backfill-20260823 without one, so they inherit the system row's 14 days) with
# the value the bundled cadence data carries. Data-only. Rows, reach and exclusions: 0a-data.sql header
# and README.md. The three legacy Rubus rows, Lemon Thyme and the Peach are deliberately NOT written; a
# pre/post pair checks that 0a leaves them alone.
#
# STATUS AT AUTHORING (2026-09-21): AUTHORED, NOT APPLIED on staging or prod. Rehearsed on an ephemeral
# fork of prod (README.md).
#
# SEQUENCING — README.md. Per environment, staging first:
#   --phase pre -> apply 0a -> --phase post
# then `gate_runner.py --all --phase post --continuous-only` on BOTH envs.
# Pushing this directory before the apply cannot red gate-invariants.yml: the one continuous post gate
# self-arms on this migration's schema_version row. Measured read-only on prod at authoring.
#
# GATE CLASSIFICATION (decided at authoring, not after the first false red)
#   * Standing invariant (continuous, self-armed): the failure shape this migration exists to undo — a
#     live planting of one of these 21 cultivars that adopts a database profile and takes its feeding
#     interval from the SYSTEM row, because neither its cultivar row nor a leaf row states one (the key
#     dropped again by a future whole-profile backfill, or a non-numeric/zero value written over it). It
#     judges WHERE the interval comes from, not what it is: a later, deliberate change to another number
#     is a new decision, not a regression, and a planting whose profile says no_calendar_feed is fed by
#     nobody's interval, so it passes too.
#   * Apply-window receipts (continuous: false): the exact value 0a wrote, the single-key method, the
#     engine's view of the 21 plantings, that the five excluded rows were left alone, and that 0a wrote no
#     other care_profile row. A later, deliberate edit of any profile is not a regression.
#   * EVERY gate that names a prod id is env: prod — the standing invariant included. Its population is
#     defined by 21 prod cultivar ids, and 0a is keyed to prod care_profile row ids written on prod on
#     2026-08-23, after the staging branch was cut (2026-08-11; the v5-coldshadow-001/-002 finding). On
#     staging those rows cannot exist, so 0a stamps the version and nothing else. This lane was cleared to
#     read prod only; staging is unread.
#   * No gate names a column this migration adds (it adds none), and none casts ::regclass, so every gate
#     parses and runs on an unapplied database.
#
# NO `sweep` PHASE: nothing is constrained, so there is no predicate that must hold before the apply.

pre:
  - name: pre_not_already_applied
    sql: |
      SELECT 1 FROM public.schema_version WHERE version = '5.0.0-feedinherit-001'
    expect: rowcount_eq
    value: 0

