  # ── STANDING INVARIANT (continuous, self-armed) ────────────────────────────────────────────────────

  - name: post_no_live_planting_of_these_cultivars_inherits_the_house_feed_interval
    env: prod
    note: >
      Dave's decision (2026-09-21, set the 21 to their care-data intervals) as an invariant: no live
      planting of these 21 cultivars that adopts a database profile takes its feeding interval from the
      system row. Its cultivar row or a leaf row must state fertilize_interval_days, and the resolved value
      must be a positive number (the engine reads nothing else as a cadence), unless the resolved profile
      says no_calendar_feed — then no interval is used at all. Judges the source, not the number, so a later
      deliberate change to another value stays green. Only plantings with a non-empty cadence_scopes are
      judged, because only those adopt the database profile; the others resolve the bundled entry, which
      lambda/daily-plan/feedinherit.test.js pins at the same values. Returns one row per offending
      planting. Self-armed: vacuous until the stamp exists.
    sql: |
      SELECT p.id, p.name, vrc.resolved_profile->'fertilize_interval_days' AS feed
        FROM public.plants p
        LEFT JOIN public.plant_projects pj ON pj.id = p.project_id
        JOIN public.v_resolved_care vrc ON vrc.leaf_id = p.id
        LEFT JOIN public.care_profile cd ON cd.scope = 'cultivar' AND cd.scope_id = p.variety_id
        LEFT JOIN public.care_profile lo ON lo.scope = 'leaf' AND lo.scope_id = p.id
       WHERE EXISTS (SELECT 1 FROM public.schema_version WHERE version = '5.0.0-feedinherit-001')
         AND p.variety_id IN ('a11dd600-84b4-4bd6-8611-f85336bc3c2e', 'b11814aa-83ed-48e4-882d-a6709e42572f', '1b2b7bf8-0d9e-4c39-b7d7-0acd744f16f7', '3db84405-1941-4e88-bb77-58595f47c3e7', 'd9eba456-0836-4690-b3db-02aa0fb4fb1b', '219329ac-66f3-4c25-8a46-6246bb91c858', 'ba53f113-9903-449d-81b9-7dce30ef3934', 'c94e3179-b14a-4707-8ca2-1305dd0946dc', '450c3391-b809-43e5-b7ae-de16b9cce431', '3b986e62-14ca-4262-86bb-eb35c418bd19', '055e3ff1-21c0-44ce-bace-d8a900f6145a', 'd3101ac0-fd4e-456e-86b7-ebea732ac84c', 'b1fad1e2-b2e1-40ee-ab02-1f6cf9a20a6d', '72ebf73c-bf46-429a-bb2d-3243e3d0826d', '0609afc2-51ea-4045-858b-fe28060e2f20', 'f46745bf-c77e-4f42-b939-5363378a035e', '81924103-2858-408f-991e-aad591827a49', '51da1e31-c16d-4cbc-ac3b-b3c718e7472c', 'ece82bf2-6a60-4186-b031-64af0519aa49', '21a8596d-f689-4028-a1dc-a34ae94c128b', 'bc79d915-69a3-4945-8293-27314d83a29b')
         AND p.deleted_at IS NULL AND p.archived_at IS NULL
         AND (p.status IS NULL OR p.status NOT IN ('ended', 'failed', 'dead', 'archived'))
         AND (pj.status IS NULL OR pj.status <> 'planning')
         AND pj.archived_at IS NULL
         AND cardinality(vrc.cadence_scopes) > 0
         AND vrc.resolved_profile->'no_calendar_feed' IS DISTINCT FROM 'true'::jsonb
         AND (    (coalesce(cd.profile ? 'fertilize_interval_days', false)
                   OR coalesce(lo.profile ? 'fertilize_interval_days', false))
              AND CASE WHEN jsonb_typeof(vrc.resolved_profile->'fertilize_interval_days') = 'number'
                       THEN (vrc.resolved_profile->>'fertilize_interval_days')::numeric > 0
                       ELSE false END
             ) IS NOT TRUE
    expect: rowcount_eq
    value: 0

