  - name: post_the_excluded_rows_were_left_alone
    env: prod
    continuous: false
    note: >
      Dave's 2026-09-21 scope (the 21 only) as a receipt: after 0a, none of the five excluded rows states a
      feeding interval, and none was written by 0a's transaction (its updated_at is not the stamp's
      applied_at — both are now() of the same transaction when 0a writes a row). With
      pre_the_excluded_rows_state_no_feed_interval passing before the apply, a row here means 0a touched
      one. A receipt, not a standing gate: a later, deliberate decision about any of them is not a
      regression of this one.
    sql: |
      SELECT cp.id
        FROM public.care_profile cp
       WHERE cp.id IN ('49ebc111-edb7-46f3-b665-8e0ea04a579a', 'b973ecee-5c9e-4eac-b801-56b30e38dce3', '401f91aa-ebb5-4fdf-9b5c-f6872b203bbc', '6b8e2195-5534-4bb6-aceb-c91a9daebc88', 'd9690105-fb81-40cf-abb0-218972f86daa')
         AND (cp.profile ? 'fertilize_interval_days'
              OR cp.updated_at = (SELECT applied_at FROM public.schema_version WHERE version = '5.0.0-feedinherit-001'))
    expect: rowcount_eq
    value: 0

  - name: post_zero_a_wrote_no_other_care_profile_row
    env: prod
    continuous: false
    note: >
      0a sets updated_at = now() on every row it writes, and now() is the stamp's applied_at (same
      transaction), so the rows written in the apply are exactly those whose updated_at equals it. None may
      be outside the 21. An absence receipt, so it also passes on an unapplied database; the value receipts
      above are the ones that fail there. A re-run of 0a moves applied_at and writes no row, so it stays
      green.
    sql: |
      SELECT cp.id, cp.scope, cp.scope_id
        FROM public.care_profile cp
       WHERE cp.updated_at = (SELECT applied_at FROM public.schema_version WHERE version = '5.0.0-feedinherit-001')
         AND cp.id NOT IN ('58586ba5-7080-469d-bf77-3f5746cd2132', 'cf4e17cf-d3da-46c9-bf71-a014f35bf2ad', '834a3a15-bd59-4801-ac2d-1d58bc0c79a3', '9548b3f2-e86c-435e-8ef2-28f5d0e8aa8c', 'e43739f4-75a6-4ae4-a673-1a8aef0e0f0b', 'f807599b-f4d4-4fff-9703-ff21cbf9981f', '04554719-e633-44d7-8791-f3e33c90ed2d', 'f86d0c66-7b6d-4a8e-b9de-0132d9e3332a', '13bcffdc-ac3d-4294-a6a9-b887aa76584e', '5378c39e-8174-4ce9-85ad-351adc4f1486', '8cc55d60-10a6-468e-a9af-cfafc7731b65', '2d2bc039-58e4-4ce7-8930-e58a66c4cd5a', 'ebf1aab5-4879-4080-a8aa-4e11b454de31', 'e74d95b7-df0a-4948-9bf2-d5bfd1bbeeea', 'c848cd0b-48bf-4622-be46-b65903725bc3', '315a0e95-0469-4b88-9647-5662c0edc884', '1d49baf7-103b-4a65-a6f5-81d1034d36a1', 'ae276aeb-95c1-4dd2-8eab-159aa4dfa262', '241d3455-8961-4c8c-a7ab-4a73e84fc002', 'd44d911e-b57c-40d2-88e9-d35ae16b1c87', '43162747-b27c-4ac3-bbd8-eadddd48cffc')
