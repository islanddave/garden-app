# gates.yml
# V4-HARVHABITGAP-001 — bee_balm harvest_habit NULL -> cut_and_come_again / 14d.
#
# DATA ONLY. No DDL, no view, no code, no deploy. Executes a condition pre-authored in
# src/data/harvest-attributes-v1.json on 2026-07-21; it makes no new horticultural call.
#
# STAGING MAY BE VACUOUS AND THAT IS EXPECTED. Staging's crop_types vocabulary is not guaranteed to
# carry a bee_balm row, and the gates below are all violation-count-must-be-0, so on staging they can
# pass by matching nothing. post_prod_flip_actually_applied is the env:prod gate that distinguishes
# "applied" from "matched nothing" — scripted rather than left to a human reading runner output,
# same shape as v4-rapinidtm-001.

pre:
  # Not "count(*) = 1": that is a prod absolute and would fail on a staging branch with no such row.
  # This asserts only that the slug scope can never match MORE than one live row, which is what a
  # slug-scoped UPDATE is already supposed to guarantee.
  - name: pre_bee_balm_at_most_one_live_row
    sql: |
      SELECT CASE WHEN count(*) <= 1 THEN 0 ELSE 1 END FROM public.crop_types
       WHERE slug = 'bee_balm' AND deleted_at IS NULL
    expect: scalar_eq
    value: 0

  # The forward UPDATE is guarded `harvest_habit IS NULL` (first-write-wins). If something already
  # wrote a DIFFERENT habit onto this row, the migration would silently no-op and the post gate
  # would then be asserting someone else's value. Catch that before applying, not after.
  - name: pre_bee_balm_habit_is_null_or_already_the_target
    sql: |
      SELECT count(*) FROM public.crop_types
       WHERE slug = 'bee_balm' AND deleted_at IS NULL
         AND harvest_habit IS NOT NULL
         AND harvest_habit IS DISTINCT FROM 'cut_and_come_again'
    expect: scalar_eq
    value: 0

post:
  # SELF-ARMING, not `continuous: false`. This is a POST-APPLY assertion, and it defaulted to
  # continuous: true, so it ran against prod — where the migration has NOT been applied and bee_balm's
  # harvest_habit is still NULL. That is the CORRECT state for a not-yet-applied environment, not a
  # failure, but the bare predicate read it as a violation and took gate-invariants.yml red (CI run
  # 32148716594: FAIL post/post_bee_balm_is_cut_and_come_again_14), blocking every dev push.
  #
  # The EXISTS on this migration's own schema_version row is the arming condition: the assertion is
  # inert in any environment that has not applied 0a-data.sql, and becomes a real continuous
  # invariant the instant it has. Strictly better than continuous: false, which would have made it an
  # apply-window check only and left the flip unguarded forever after. Version string is byte-identical
  # to the INSERT in 0a-data.sql and to post_schema_version_present below.
  - name: post_bee_balm_is_cut_and_come_again_14
    sql: |
      SELECT count(*) FROM public.crop_types c
       WHERE c.slug = 'bee_balm' AND c.deleted_at IS NULL
         AND EXISTS (SELECT 1 FROM public.schema_version WHERE version='4.35.0-harvhabitgap-001')
         AND (c.harvest_habit IS DISTINCT FROM 'cut_and_come_again'
              OR c.repeat_interval_days IS DISTINCT FROM 14)
    expect: scalar_eq
    value: 0

  # The condition named a habit and a cadence. Anything else appearing on this row means someone
  # invented a value on the way through, which is precisely what executing a pre-authored decision
  # is supposed to make impossible.
  - name: post_bee_balm_unnamed_attributes_stay_null
    sql: |
      SELECT count(*) FROM public.crop_types
       WHERE slug = 'bee_balm' AND deleted_at IS NULL
         AND (loss_horizon_hours IS NOT NULL
              OR set_to_first_pick_days IS NOT NULL
              OR harvest_season_start_doy IS NOT NULL
              OR harvest_season_end_doy IS NOT NULL)
    expect: scalar_eq
    value: 0

  # THE BLAST-RADIUS BOUND. This migration seeds exactly one previously-NULL habit. The other four
  # slugs in the V4-HARVHABITGAP-001 item are deliberate NULLs — aloe/calibrachoa/lantana are
  # ornamentals on not_harvest_tracked, ginger is recorded as establishing — and every one of them
  # must STILL be NULL afterwards. lambda/harvests/watch.js:24 says of the ornamental exclusions
  # "they are correctly excluded and must STAY excluded"; this is that sentence, enforced.
  - name: post_the_deliberate_nulls_stay_null
    sql: |
      SELECT count(*) FROM public.crop_types
       WHERE deleted_at IS NULL
         AND slug IN ('aloe','calibrachoa','lantana','ginger','avocado')
         AND harvest_habit IS NOT NULL
    expect: scalar_eq
    value: 0

  # THE DRIFT GUARD (added 2026-08-20, same item). The three deliberate-NULL lists in
  # src/data/harvest-attributes-v1.json are pure documentation: harvestAttributesSync.test.js binds
  # only by_crop_type <-> 0b-data.sql and never looks at them, so nothing has ever noticed a newly
  # minted crop type that no list explains. That has now happened three times — aloe/calibrachoa/
  # lantana (caught 2026-08-17), dogwood (caught 2026-08-20, minted by v4-croptypedogwood-001 the
  # same week), and twelve never-grown perennial fruit slugs that were on no list at all since the
  # vocabulary was minted. A recurring omission needs an invariant, not a fourth patch.
  #
  # Asserts the whole point of this ledger item: after the flip, EVERY remaining NULL habit is a
  # recorded decision rather than a gap. The slug list is the union of not_harvest_tracked.slugs +
  # unseeded_vocabulary.slugs + establishing_not_yet_harvestable.entries, and
  # src/__tests__/harvestNullHabitCoverage.test.js fails if this list and that union ever diverge —
  # the same JSON->SQL projection binding harvestAttributesSync.test.js applies to the seed.
  #
  # SELF-ARMING on this migration's schema_version, for the same reason as
  # post_bee_balm_is_cut_and_come_again_14: bee_balm is seeded in by_crop_type and so is deliberately
  # NOT on the list, which makes this gate red on any environment that still has it NULL. Verified
  # 2026-08-20 against both live environments: after the flip prod has 75 NULL habits and staging 40,
  # and every one of them is on the list — 0 violations in both. Before the flip it is inert.
  #
  # 2026-08-25 (V4-PUTUPFOODCATEGORY-001): bread, cheese, milk, butter, yogurt, meat and fish added.
  # That seed puts seven NON-PLANT food classes into crop_types so Put-Up can browse food that never
  # grew in a garden, and each arrives with a NULL harvest_habit — so without this the seed would
  # have turned THIS gate red on the first gate-invariants run after the apply. Caught by rehearsing
  # the whole corpus against an ephemeral fork of prod with the seed applied, which is the only way
  # it was ever going to surface: 0a's own gates all passed.
  # The alternative fix was an `AND c.category <> 'non_plant_food'` exemption, and it was rejected.
  # An exemption lets every FUTURE food class skip the written record, which is the single thing
  # this list exists to require — the same "narrowing an honesty list to exclude the row that broke
  # it" move that v4-putupprov-002-fruitseed's gate comment warns against. The seven are recorded in
  # not_harvest_tracked.slugs with their reason, and the projection binding still holds.
  #
  # 2026-08-31 (BUG-HABITGAPREGISTRY-001): goldenrod and hoya added. Both crop types were minted
  # 2026-08-30 with a NULL harvest_habit and were on no list, so this gate went red on prod the next
  # run — expected scalar_eq=0, got 2. Registered rather than seeded: NULL is the CORRECT value for
  # both and no habit was invented to clear the red. goldenrod is category='flower' and hoya is
  # category='houseplant', which is the not_harvest_tracked shape exactly, and neither carries a pick.
  # This is the drift this gate exists to catch working as designed — a slug minted today with no list
  # entry is a hard CI failure rather than a slow drift, same as yarrow on 2026-08-25. Recorded in
  # not_harvest_tracked.slugs in the same change, which harvestNullHabitCoverage.test.js requires;
  # projection untouched (nothing added to by_crop_type).
  - name: post_every_null_habit_is_a_recorded_decision
    sql: |
      SELECT count(*) FROM public.crop_types c
       WHERE c.deleted_at IS NULL
         AND c.harvest_habit IS NULL
         AND EXISTS (SELECT 1 FROM public.schema_version WHERE version='4.35.0-harvhabitgap-001')
         AND c.slug NOT IN (
           'aloe','althaea','apple','apricot','artichoke','avocado','begonia','blackberry_lily',
           'bok_choy','borage','bread','brussels_sprouts','butter','cactus','calibrachoa',
           'carnation','carrot','celery','cheese','cherry','christmas_cactus','chrysanthemum',
           'cobaea','coleus','columbine','cranberry','crown_of_thorns','delphinium','dogwood',
           'dracaena','echeveria','edelweiss','elderberry','fish','fittonia','flower_mix',
           'four_o_clock','foxglove','geranium','ginger','goldenrod','grape','haworthia','helichrysum',
           'hibiscus','hollyhock','hosta','hoya','jade','japanese_maple','lantana','lithops','luffa',
           'marigold','meat','milk','milkweed','money_plant','morning_glory','mustard',
           'nectarine','parsnip','pear','perilla','petunia','pineapple','plum','poppy','pothos',
           'radish','raspberry','rhubarb','rose','sedum','sempervivum','sour_cherry','spider_plant',
           'spinach','stock','succulent','sunflower','thunbergia','torenia','tradescantia','tweedia',
           'vietnamese_coriander','viola','yarrow','yogurt')
    expect: scalar_eq
    value: 0

  # env:prod, and scripted. On prod the row exists, so this is the only gate that can tell an applied
  # migration from one that matched nothing — post_bee_balm_is_cut_and_come_again_14 shares its slug
  # predicate with the UPDATE and so passes vacuously where the row is absent.
  - name: post_prod_flip_actually_applied
    env: prod
    continuous: false
    sql: |
      SELECT 1 - count(*) FROM public.crop_types
       WHERE slug = 'bee_balm' AND deleted_at IS NULL
         AND harvest_habit = 'cut_and_come_again' AND repeat_interval_days = 14
    expect: scalar_eq
    value: 0

  # Apply-time receipt. continuous: false — it is absent from any environment this has not been
  # applied to, which is the correct state there, not a failure.
  - name: post_schema_version_present
    continuous: false
    sql: |
      SELECT 1 FROM public.schema_version WHERE version='4.35.0-harvhabitgap-001' LIMIT 1
    expect: rowcount_gte
    value: 1
